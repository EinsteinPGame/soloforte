const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function hexToRgba(hex,a){return'rgba('+parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16)+','+a+')';}
function lighten(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function darken(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}

const RACE_WEIGHTS={};
// Legendary (very rare) — weight 0.25
['God','Primordial','Cosmic Mind','Reincarnation','Evil Reincarnation'].forEach(r=>RACE_WEIGHTS[r]=0.25);
// Epic (rare) — weight 0.4
['Demi-God','Devil','Dragon','Dragon Slayer','Cosmic Warrior','Voidwalker','Soulweaver','Nucleite'].forEach(r=>RACE_WEIGHTS[r]=0.4);
// Rare — weight 0.6
['Demon','Angel','Vampire','Hive Mind','Genies','Giant','Symbiote','Mythical Beast','Dragonborn','Elemental'].forEach(r=>RACE_WEIGHTS[r]=0.6);
// Uncommon — weight 0.85
['Spirit','Werebeast','Gargoyle','Golem','Siren','Fortunas','Dispensian','Cyborg','Animorph','Nightborn','Fey','Centaur','Chimekin','Merfolk'].forEach(r=>RACE_WEIGHTS[r]=0.85);
// Common — weight 1.2 (default)
// Darwizzies (joke/weakest) — weight 0.25 (rare, punishment roll)
RACE_WEIGHTS['Darwizzies']=0.25;

function getItemWeights(cat){
  const items=cat.items,n=items.length;
  const tierIds=new Set(['strength','speed','durability','iq','fight','weaponMastery','powerMastery']);
  if(tierIds.has(cat.id))return items.map((_,i)=>i===0?0.4:1.5-i/(n-1));
  if(cat.id==='race')return items.map(r=>RACE_WEIGHTS[r]||1.2);
  if(cat.id==='apexForces')return items.map(item=>item==='None'?2.5:1);
  const noItems={'weapon':'No Weapon','enchantment':'No Enchantment','extraPower':'No Extra Power','weakness':'No Weakness'};
  if(noItems[cat.id])return items.map(item=>item===noItems[cat.id]?3:1);
  return null;
}

function getCumAngles(cat){
  const n=cat.items.length,w=getItemWeights(cat);
  if(!w){const a=[];for(let i=0;i<=n;i++)a.push(i*Math.PI*2/n);return a;}
  const total=w.reduce((a,b)=>a+b,0),cum=[0];
  for(let i=0;i<n;i++)cum.push(cum[i]+w[i]/total*Math.PI*2);
  return cum;
}

const SFX={
  ctx:null,
  _init(){if(!this.ctx)try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},
  _tone(freq,dur,type,vol,delay){
    this._init();if(!this.ctx)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,this.ctx.currentTime+(delay||0));
    g.gain.setValueAtTime(vol||0.15,this.ctx.currentTime+(delay||0));
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+(delay||0)+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(this.ctx.currentTime+(delay||0));o.stop(this.ctx.currentTime+(delay||0)+dur);
  },
  tick(vol){this._tone(600,0.03,'sine',vol||0.08)},
  tickLoud(){this._tone(700,0.05,'sine',0.18);this._tone(500,0.03,'triangle',0.1,0.02)},
  land(){this._tone(400,0.2,'sine',0.25);this._tone(600,0.25,'sine',0.2,0.1);this._tone(800,0.15,'sine',0.12,0.2);this._tone(500,0.3,'triangle',0.08,0.3)},
  spin(){for(let i=0;i<3;i++)this._tone(500+i*50,0.05,'square',0.05,i*0.04)},
  click(){this._tone(800,0.05,'square',0.06)},
  victory(){for(let i=0;i<6;i++)this._tone(400+i*80,0.2,'sine',0.12,i*0.12);this._tone(900,0.4,'sine',0.15,0.72)},
  defeat(){this._tone(300,0.3,'sine',0.15);this._tone(200,0.4,'sine',0.12,0.2)},
  hit(){this._tone(200,0.12,'sine',0.15)},
  crit(){this._tone(600,0.1,'sawtooth',0.2);this._tone(900,0.12,'square',0.18,0.05)},
  block(){this._tone(150,0.08,'square',0.1)},
  heartbeat(){this._tone(60,0.15,'sine',0.2);this._tone(65,0.12,'sine',0.15,0.12)},
  reveal(){for(let i=0;i<4;i++)this._tone(200+i*150,0.3,'sine',0.1+i*0.03,i*0.15);this._tone(900,0.5,'sine',0.18,0.6)},
  whoosh(){this._init();if(!this.ctx)return;const dur=0.3,bufSz=this.ctx.sampleRate*dur,buf=this.ctx.createBuffer(1,bufSz,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<bufSz;i++){const t=i/bufSz;d[i]=(Math.random()*2-1)*0.08*Math.sin(t*Math.PI);}const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=buf;g.gain.setValueAtTime(0.08,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);s.connect(g);g.connect(this.ctx.destination);s.start();s.stop(this.ctx.currentTime+dur);},
};

let buttons=[];
function addBtn(id,x,y,w,h,label,color,cb,opts){buttons.push({id,x,y,w,h,label,color:color||'#fff',cb,hover:false,...(opts||{})})}
function clearBtns(){buttons=[]}
function drawBtn(b){
  if(b.color==='transparent')return;
  X.save();
  const r=b.h>40?8:6;
  X.beginPath();
  X.moveTo(b.x+r,b.y);X.lineTo(b.x+b.w-r,b.y);X.quadraticCurveTo(b.x+b.w,b.y,b.x+b.w,b.y+r);
  X.lineTo(b.x+b.w,b.y+b.h-r);X.quadraticCurveTo(b.x+b.w,b.y+b.h,b.x+b.w-r,b.y+b.h);
  X.lineTo(b.x+r,b.y+b.h);X.quadraticCurveTo(b.x,b.y+b.h,b.x,b.y+b.h-r);
  X.lineTo(b.x,b.y+r);X.quadraticCurveTo(b.x,b.y,b.x+r,b.y);X.closePath();
  X.fillStyle=b.hover?hexToRgba(b.color,0.2):'rgba(20,20,30,0.8)';X.fill();
  X.strokeStyle=b.color;X.lineWidth=b.hover?2.5:1.5;X.stroke();
  X.fillStyle=b.hover?'#fff':b.color;
  X.font='bold '+(b.fontSize||Math.min(16,b.h*0.4))+'px "Segoe UI",Arial,sans-serif';
  X.textAlign='center';X.textBaseline='middle';
  X.fillText(b.label,b.x+b.w/2,b.y+b.h/2);
  X.restore();
}

let particles=[];
function spawnParticle(x,y,opts){
  particles.push({x,y,vx:opts.vx||0,vy:opts.vy||0,life:opts.life||30,maxLife:opts.life||30,
    color:opts.color||'#fff',size:opts.size||3,text:opts.text||null,gravity:opts.gravity||0,friction:opts.friction||1,glow:opts.glow||false});
}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=p.friction;p.vy*=p.friction;p.life--;if(p.life<=0)particles.splice(i,1);}}
function drawParticles(){particles.forEach(p=>{const alpha=p.life/p.maxLife;X.globalAlpha=alpha;if(p.text){X.font='bold '+p.size+'px "Segoe UI",sans-serif';X.textAlign='center';X.textBaseline='middle';if(p.glow){X.shadowColor=p.color;X.shadowBlur=8;}X.fillStyle=p.color;X.fillText(p.text,p.x,p.y);X.shadowBlur=0;}else{if(p.glow){X.shadowColor=p.color;X.shadowBlur=6;}X.fillStyle=p.color;X.beginPath();X.arc(p.x,p.y,p.size*alpha,0,Math.PI*2);X.fill();X.shadowBlur=0;}X.globalAlpha=1;});}

// Background ambient particles
function spawnBgParticles(){
  while(bgParticles.length<40){
    bgParticles.push({x:Math.random()*VW,y:Math.random()*VH,vx:(Math.random()-0.5)*0.5,vy:-0.3-Math.random()*0.5,
      size:1+Math.random()*2,life:60+Math.random()*120,maxLife:180,color:'rgba(255,255,255,0.15)'});
  }
}
function updateBgParticles(){
  for(let i=bgParticles.length-1;i>=0;i--){
    const p=bgParticles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0||p.y<-10||p.x<-10||p.x>VW+10){bgParticles.splice(i,1);}
  }
}
function drawBgParticles(){
  bgParticles.forEach(p=>{
    const alpha=(p.life/p.maxLife)*0.3;
    X.globalAlpha=alpha;X.fillStyle=p.color;
    X.beginPath();X.arc(p.x,p.y,p.size,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;
}

// Ember/spark particles for dramatic spin visuals
function spawnEmbers(cx,cy,radius){
  for(let i=0;i<3;i++){
    const angle=Math.random()*Math.PI*2;
    const dist=radius+Math.random()*20;
    emberParticles.push({
      x:cx+Math.cos(angle)*dist, y:cy+Math.sin(angle)*dist,
      vx:(Math.random()-0.5)*2, vy:-1-Math.random()*2,
      life:30+Math.random()*40, maxLife:70,
      size:1+Math.random()*2, color:pick(['#ff4400','#ff6600','#ffaa00','#ff2200','#ffcc00'])
    });
  }
}
function updateEmbers(){
  for(let i=emberParticles.length-1;i>=0;i--){
    const e=emberParticles[i];
    e.x+=e.vx;e.y+=e.vy;e.vy-=0.01;e.vx*=0.98;e.life--;
    if(e.life<=0)emberParticles.splice(i,1);
  }
}
function drawEmbers(){
  emberParticles.forEach(e=>{
    const alpha=e.life/e.maxLife;
    X.globalAlpha=alpha;
    X.shadowColor=e.color;X.shadowBlur=6;

    X.beginPath();X.arc(e.x,e.y,e.size*alpha,0,Math.PI*2);X.fill();

}

// Draw inter-spin narration overlay
function drawNarration(){

  const elapsed=Date.now()-interSpinNarration.startTime;

  if(elapsed>dur){interSpinNarration=null;return;}
  const t=elapsed/dur;
  // fade in (0-0.2), hold (0.2-0.7), fade out (0.7-1)
  let alpha=1;
  if(t<0.2)alpha=t/0.2;
  else if(t>0.7)alpha=1-(t-0.7)/0.3;
  X.save();

// Build the wheel queue (main categories + conditional)
function buildWheelQueue(){
  wheelQueue=WHEEL_CATEGORIES.map(c=>c.id);
  wheelIdx=0;
  charResult={};
}

function getCurrentWheel(){
  const id=wheelQueue[wheelIdx];
  let cat=WHEEL_CATEGORIES.find(c=>c.id===id);
  if(!cat){
    const cond=CONDITIONAL_WHEELS.find(c=>c.id===id);
    if(cond)cat=cond;
  }
  return cat;
}

// Check and insert conditional wheels after a spin
function checkConditionals(){
  const lastId=wheelQueue[wheelIdx];
  const lastResult=charResult[lastId];
  CONDITIONAL_WHEELS.forEach(cw=>{
    if(wheelQueue.includes(cw.id))return; // already added
    const t=cw.trigger;
    if(t.category===lastId){
      if(t.values===null || t.values.includes(lastResult)){
        // Insert conditional wheel right after current
        wheelQueue.splice(wheelIdx+1,0,cw.id);
      }
    }
  });
}

// ============================================================
// WHEEL SPIN MECHANICS
// ============================================================
function startSpin(cat){
  const items=cat.items;
  if(!items||items.length===0)return;
  spin.phase='spinning';
  spin.angle=Math.random()*Math.PI*2;
  spin.speed=0.2+Math.random()*0.15;
  spin.targetIdx=rand(0,items.length-1);
  spin.result=null;
  spin.landedIdx=-1;
  SFX.spin();
}

let lastTickAngle=0;
function updateSpin(){
  if(spin.phase!=='spinning')return;
  spin.angle+=spin.speed;
  // More dramatic deceleration — slower decay when speed is low for extended suspense
  const decay=spin.speed<0.03?0.992:spin.speed<0.06?0.990:0.988;
  spin.speed*=decay;

  // Tick sound as segments pass (respects weighted segment sizes)
  const cat=getCurrentWheel();
  if(cat){
    const cum=getCumAngles(cat);
    const normA=(((-spin.angle)%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    const normL=(((-lastTickAngle)%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    let curSeg=cat.items.length-1,lastSeg=cat.items.length-1;
    for(let i=0;i<cat.items.length;i++){if(normA<cum[i+1]){curSeg=i;break;}}
    for(let i=0;i<cat.items.length;i++){if(normL<cum[i+1]){lastSeg=i;break;}}
    if(curSeg!==lastSeg&&spin.speed>0.01){
      // Louder ticks as wheel slows down (more dramatic)
      if(spin.speed<0.03)SFX.tickLoud();
      else if(spin.speed<0.06)SFX.tick(0.14);
      else SFX.tick();
    }
    // Heartbeat effect during final moments — dramatic tension builder
    if(spin.speed<0.02&&spin.speed>0.001){
      const now=Date.now();
      const heartbeatInterval=Math.max(300,spin.speed*15000); // faster as wheel slows
      if(now-lastHeartbeat>heartbeatInterval){
        SFX.heartbeat();
        lastHeartbeat=now;
      }
    }
  }
  lastTickAngle=spin.angle;

  if(spin.speed<0.001){
    spin.phase='landed';
    spin.landTime=Date.now();
    if(cat){
      const items=cat.items;
      const cum=getCumAngles(cat);
      const normAngle=(((-spin.angle)%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
      let idx=items.length-1;
      for(let i=0;i<items.length;i++){if(normAngle<cum[i+1]){idx=i;break;}}
      spin.landedIdx=idx;
      spin.result=items[idx];
      charResult[cat.id]=spin.result;
      checkConditionals();
      SFX.land();
      // Celebration burst
      spawnCelebration(VW/2,VH*0.52,cat.color||'#2196F3');
    }
  }
}

function drawSpin(){
  clearBtns();
  X.fillStyle='#000';X.fillRect(0,0,VW,VH);

  // Background ambient particles
  if(spin.phase==='spinning'){spawnBgParticles();}
  updateBgParticles();
  drawBgParticles();

  // Ember/spark particles during spin for dramatic effect
  if(spin.phase==='spinning'){
    const cat2=getCurrentWheel();
    if(cat2){
      const wr2=Math.min(VW*0.42,VH*0.32);
      spawnEmbers(VW/2,VH*0.52,wr2);
    }
  }
  updateEmbers();
  drawEmbers();

  // Dramatic slowdown glow — wheel glows brighter as it slows
  if(spin.phase==='spinning'&&spin.speed<0.05&&spin.speed>0.001){
    const intensity=(0.05-spin.speed)/0.05;
    X.fillStyle=`rgba(255,255,255,${intensity*0.06})`;
    X.fillRect(0,0,VW,VH);
  }

  // Screen flash on land
  if(screenFlash>0){

    X.fillRect(0,0,VW,VH);
    screenFlash*=0.88;

  }

  // Result scale-in animation
  if(spin.phase==='landed'&&resultScale<1){resultScale=Math.min(1,resultScale+0.06);}

  const cat=getCurrentWheel();
  if(!cat){
    // All spins done
    screen='charDone';return;
  }
  const items=cat.items;
  if(!items||items.length===0){wheelIdx++;return;}

  const totalSpins=wheelQueue.length;
  const currentSpin=wheelIdx+1;

  // === TOP SECTION: Icon + Category Label + Result ===
  const topY=isMobile?50:55;

  // Category icon (emoji)
  X.font='36px serif';X.textAlign='center';X.textBaseline='middle';
  X.fillText(cat.icon||'🎯',VW/2,topY-5);

  // Category label pill
  const pillText=(cat.num||'')+'.'+cat.label;

  const pillW=X.measureText(pillText).width+30;
  const pillH=32;
  const pillX=VW/2-pillW/2,pillY=topY+22;
  X.beginPath();
  X.moveTo(pillX+8,pillY);X.lineTo(pillX+pillW-8,pillY);X.quadraticCurveTo(pillX+pillW,pillY,pillX+pillW,pillY+8);
  X.lineTo(pillX+pillW,pillY+pillH-8);X.quadraticCurveTo(pillX+pillW,pillY+pillH,pillX+pillW-8,pillY+pillH);
  X.lineTo(pillX+8,pillY+pillH);X.quadraticCurveTo(pillX,pillY+pillH,pillX,pillY+pillH-8);
  X.lineTo(pillX,pillY+8);X.quadraticCurveTo(pillX,pillY,pillX+8,pillY);X.closePath();
  X.fillStyle='#222';X.fill();

  X.fillText(pillText,VW/2,pillY+pillH/2);

  // Result text (big bold) — only when landed, with scale-in animation
  let resultY=pillY+pillH+15;
  if(spin.phase==='landed'&&spin.result){
    const scale=resultScale;
    const baseFontSize=isMobile?24:36;
    const fontSize=Math.round(baseFontSize*scale);
    X.font='bold '+fontSize+'px "Segoe UI",Arial,sans-serif';
    // Glow on result text
    const t=(Date.now()-spin.landTime)*0.003;
    const glowIntensity=8+Math.sin(t*2)*4;
    X.save();
    X.shadowColor=cat.color||'#2196F3';
    X.shadowBlur=glowIntensity*scale;
    X.fillStyle='#fff';
    X.globalAlpha=scale;
    // Wrap long text
    const maxW=VW-40;
    let txt=spin.result;
    if(X.measureText(txt).width>maxW){
      X.font='bold '+(isMobile?18:26)+'px "Segoe UI",Arial,sans-serif';
    }
    if(X.measureText(txt).width>maxW){
      X.font='bold '+(isMobile?14:20)+'px "Segoe UI",Arial,sans-serif';
    }
    if(X.measureText(txt).width>maxW){
      while(X.measureText(txt+'..').width>maxW&&txt.length>2)txt=txt.slice(0,-1);
      txt=txt+'..';
    }
    X.fillText(txt,VW/2,resultY+15);
    X.shadowBlur=0;
    X.globalAlpha=1;
    X.restore();
    resultY+=isMobile?40:55;
  }else{
    resultY+=10;
  }

  // === WHEEL ===
  const wheelCenterY=spin.phase==='landed'?(resultY+VH*0.9)/2:VH*0.52;
  const maxR=Math.min(VW*0.42,VH*0.32);
  const wr=maxR;
  const cx=VW/2,cy=wheelCenterY;

  const cum=getCumAngles(cat);
  const baseColor=cat.color||'#2196F3';
  const isRainbow=RAINBOW_CATS.has(cat.id);
  const neonColor=NEON_CATS[cat.id]||null;

  // Neon glow aura for Extra Power / Weakness wheels
  if(neonColor&&spin.phase!=='landed'){
    const t=Date.now()*0.003;
    const glowR=wr+12+Math.sin(t)*4;
    X.save();
    X.shadowColor=neonColor;X.shadowBlur=35+Math.sin(t*1.3)*10;
    X.strokeStyle=neonColor;X.lineWidth=3;
    X.beginPath();X.arc(cx,cy,glowR,0,Math.PI*2);X.stroke();
    X.shadowBlur=20+Math.sin(t*0.7)*8;
    X.beginPath();X.arc(cx,cy,glowR+6,0,Math.PI*2);X.stroke();
    X.shadowBlur=0;X.restore();
  }

  X.save();X.translate(cx,cy);X.rotate(spin.angle);

  for(let i=0;i<items.length;i++){
    const startA=cum[i]-Math.PI/2;
    const endA=cum[i+1]-Math.PI/2;
    const arcSize=cum[i+1]-cum[i];

    // Segment color
    let segColor;
    if(isRainbow){
      segColor=rainbowHsl(i,items.length);
    }else if(items[i]==='Darwizzy'){
      segColor='#1a1a1a'; // near-black for joke tier
    }else if(items.length<=15){
      const hueShift=(i/items.length)*60-30;
      segColor=i%2===0?lighten(baseColor,hueShift):darken(baseColor,30+hueShift);
    }else{
      const shades=[baseColor,darken(baseColor,30),darken(baseColor,55),lighten(baseColor,20),darken(baseColor,15),lighten(baseColor,5)];
      segColor=shades[i%shades.length];
    }

    // Landed: highlight winner with category-specific glow + pulse, dim others
    if(spin.phase==='landed'){
      if(i===spin.landedIdx){
        // Pulsing glow on winning segment
        const pulseT=(Date.now()-spin.landTime)*0.003;
        const pulseIntensity=0.15+Math.sin(pulseT*3)*0.1;
        X.save();
        X.shadowColor=cat.color||'#fff';
        X.shadowBlur=12+Math.sin(pulseT*2)*6;
        X.restore();
        // Category-specific highlight: bright saturated version of category color
        const catHighlights={
          race:'#42A5F5',size:'#8BC34A',strength:'#CE93D8',speed:'#42A5F5',
          durability:'#EF5350',iq:'#5C6BC0',fight:'#FF5252',weapon:'#D2691E',
          weaponMastery:'#FF1744',enchantment:'#FF4081',extraPower:'#E040FB',
          powerMastery:'#D500F9',weakness:'#26C6DA',apexForces:'#F48FB1',
          conquered:'#FFA726',backstory:'#FF7043',title:'#E0E0E0',
          cosmicPower:'#536DFE',fairyPowers:'#F8BBD0',mythicalBeast:'#FF8A65',
          boneLineage:'#CFD8DC',primordialType:'#7C4DFF',whatConquered:'#FFB74D',
          demonRank:'#EF5350',angelOrder:'#90CAF9',dragonType:'#FF9100',
          elementalAffinity:'#FFB74D',godDomain:'#FFE082',vampireBloodline:'#F48FB1',
          werebeastForm:'#8D6E63',symbionteBond:'#CE93D8',reincarnationOrigin:'#78909C',
          vampireFeeding:'#C62828',dragonBloodline:'#E65100',undeathOrigin:'#455A64',
          demonHierarchy:'#D50000',faeAllegiance:'#00695C',swordStyle:'#9E9E9E',
          bowStyle:'#66BB6A',staffSchool:'#9C27B0'
        };
        if(isRainbow){segColor=rainbowHslLit(i,items.length);}
        else{segColor=catHighlights[cat.id]||lighten(baseColor,60);}
      }else{
        segColor=isRainbow?rainbowHslDark(i,items.length):darken(baseColor,80);
      }
    }

    X.beginPath();X.moveTo(0,0);X.arc(0,0,wr,startA,endA);X.closePath();
    X.fillStyle=segColor;X.fill();
    X.strokeStyle='rgba(0,0,0,0.5)';X.lineWidth=1.5;X.stroke();

    // Clip to segment to prevent text bleeding into neighbors
    X.save();
    X.beginPath();
    X.moveTo(0,0);
    X.arc(0,0,wr*0.97,startA,endA);
    X.closePath();
    X.clip();

    // Text label
    const midA=startA+arcSize/2;
    const textR=wr*0.68;
    X.save();
    X.translate(Math.cos(midA)*textR,Math.sin(midA)*textR);
    X.rotate(midA+Math.PI/2);

    // Font size based on number of items and arc size — bigger for readability
    let fontSize=Math.min(16,Math.max(8,wr*0.1));
    if(items.length>20)fontSize=Math.min(13,Math.max(7,wr*0.08));
    if(items.length>30)fontSize=Math.min(11,Math.max(6,wr*0.055));
    if(items.length>60)fontSize=Math.min(8,Math.max(5,wr*0.035));
    if(items.length>100)fontSize=Math.min(6,Math.max(4,wr*0.024));
    if(items.length>140)fontSize=Math.min(5,Math.max(3,wr*0.018));
    // Shrink text for tiny weighted segments (rare/powerful items)
    if(arcSize<Math.PI*2/items.length*0.6)fontSize=Math.max(4,fontSize*0.7);

    X.font='bold '+fontSize+'px "Segoe UI",Arial,sans-serif';
    X.textAlign='center';X.textBaseline='middle';

    // Arc chord at text radius — compute BEFORE using it
    const arcChord=2*textR*Math.sin(Math.min(arcSize,Math.PI)/2);

    // Skip text for segments too small to read (< 3px arc width)
    if(arcChord<3&&!(spin.phase==='landed'&&i===spin.landedIdx)){X.restore();X.restore();continue;}

    // Dim non-winner text when landed; Darwizzy always dim grey
    if(spin.phase==='landed'&&i!==spin.landedIdx){
      X.fillStyle='rgba(255,255,255,0.2)';
    }else if(items[i]==='Darwizzy'){
      X.fillStyle='rgba(255,255,255,0.35)';
    }else{
      X.fillStyle='#fff';
    }

    const label=items[i];
    // Cap text width strictly to arc chord to prevent visual overlap
    const maxTextW=Math.min(wr*0.42,arcChord*0.75);
    // Further reduce fontSize if text still won't fit in the arc
    let adjustedFontSize=fontSize;
    X.font='bold '+adjustedFontSize+'px "Segoe UI",Arial,sans-serif';
    if(X.measureText(label).width>maxTextW&&adjustedFontSize>3){
      adjustedFontSize=Math.max(3,Math.floor(adjustedFontSize*maxTextW/X.measureText(label).width));
      X.font='bold '+adjustedFontSize+'px "Segoe UI",Arial,sans-serif';
    }
    if(X.measureText(label).width<=maxTextW){
      X.fillText(label,0,0);
    }else{
      // Try word-wrapping into 2 lines
      const words=label.split(' ');
      if(words.length>=2){
        let line1='',line2='';
        const mid=Math.ceil(words.length/2);
        line1=words.slice(0,mid).join(' ');
        line2=words.slice(mid).join(' ');
        const lineH=adjustedFontSize*0.65;
        // Check if wrapped lines fit
        if(X.measureText(line1).width<=maxTextW&&X.measureText(line2).width<=maxTextW){
          X.fillText(line1,0,-lineH);
          X.fillText(line2,0,lineH);
        }else{
          // Still too long — truncate
          let trunc=label;
          while(X.measureText(trunc+'..').width>maxTextW&&trunc.length>2)trunc=trunc.slice(0,-1);
          X.fillText(trunc+'..',0,0);
        }
      }else{
        let trunc=label;
        while(X.measureText(trunc+'..').width>maxTextW&&trunc.length>2)trunc=trunc.slice(0,-1);
        X.fillText(trunc+'..',0,0);
      }
    }
    X.restore();
    X.restore(); // end clip region
  }
  X.restore();

  // Center hub
  const hubR=wr*0.12;
  X.beginPath();X.arc(cx,cy,hubR,0,Math.PI*2);
  const hubGrad=X.createRadialGradient(cx,cy,hubR*0.3,cx,cy,hubR);
  hubGrad.addColorStop(0,'#444');hubGrad.addColorStop(1,'#111');
  X.fillStyle=hubGrad;X.fill();
  X.strokeStyle='#333';X.lineWidth=3;X.stroke();

  // Inner hub ring
  X.beginPath();X.arc(cx,cy,hubR*0.5,0,Math.PI*2);
  X.strokeStyle='#555';X.lineWidth=2;X.stroke();

  // Outer rim (neon-tinted for special wheels)
  if(neonColor&&spin.phase!=='landed'){
    X.save();X.shadowColor=neonColor;X.shadowBlur=15;
    X.beginPath();X.arc(cx,cy,wr+3,0,Math.PI*2);
    X.strokeStyle=neonColor;X.lineWidth=4;X.stroke();
    X.shadowBlur=0;X.restore();
  }else{
    X.beginPath();X.arc(cx,cy,wr+3,0,Math.PI*2);
    X.strokeStyle='#222';X.lineWidth=5;X.stroke();
  }

  // Pointer at top
  const ptrY=cy-wr-12;
  X.beginPath();X.moveTo(cx,cy-wr+2);X.lineTo(cx-10,ptrY-8);X.lineTo(cx+10,ptrY-8);X.closePath();
  X.fillStyle='#fff';X.fill();
  X.strokeStyle='#888';X.lineWidth=1;X.stroke();

  // === BOTTOM: Spin button or Next button ===
  if(spin.phase==='idle'){
    const btnW=160,btnH=50;
    addBtn('spin',cx-btnW/2,VH-btnH-30,btnW,btnH,'SPIN!',cat.color||'#2196F3',()=>{startSpin(cat);},{fontSize:20});
  }else if(spin.phase==='landed'){
    const btnW=160,btnH=45;
    addBtn('next',cx-btnW/2,VH-btnH-25,btnW,btnH,'NEXT >>',cat.color||'#2196F3',()=>{
      wheelIdx++;
      if(wheelIdx>=wheelQueue.length){
        screen='charDone';SFX.reveal();
      }else{
        // Show lore narration between spins
        interSpinNarration={text:pick(LORE_NARRATIONS),startTime:Date.now(),duration:1600};
        SFX.whoosh();
        setTimeout(()=>{
          spin={phase:'idle',angle:Math.random()*Math.PI*2,speed:0,result:null,landedIdx:-1};
          emberParticles=[];
        },800);
      }
    },{fontSize:16});
  }

  // Progress indicator (small dots at bottom)
  const dotY=VH-12;
  const dotSpacing=8;
  const totalDots=Math.min(wheelQueue.length,20);
  const dotsStartX=cx-(totalDots-1)*dotSpacing/2;
  for(let i=0;i<totalDots;i++){
    X.beginPath();X.arc(dotsStartX+i*dotSpacing,dotY,2.5,0,Math.PI*2);
    X.fillStyle=i<wheelIdx?cat.color:(i===wheelIdx?'#fff':'#333');
    X.fill();
  }

  // Spin counter
  X.font='12px "Segoe UI",sans-serif';X.fillStyle='#555';X.textAlign='center';
  X.fillText(currentSpin+'/'+totalSpins,VW/2,dotY-12);

  // Back button
  addBtn('back',10,10,60,30,'< Back','#666',()=>{screen='title';},{fontSize:12});

  buttons.forEach(drawBtn);
}

// ============================================================
// DRAW: CHARACTER PORTRAIT — Dynamic visual based on build
// ============================================================
function drawCharacterPortrait(X,cx,y,h,raceColor,cr,t){
  const race=(cr.race||'').toLowerCase();
  const weapon=(cr.weapon||'').toLowerCase();
  const size=(cr.size||'6ft').replace('ft','');
  const sizeScale=Math.max(0.7,Math.min(1.3,(parseFloat(size)||6)/6));

  // Race-specific aura/armour color (overrides generic blue category color)
  const raceAuraColors={
    'human':'#4a90d9','elf':'#2ecc71','dwarf':'#cd853f','orc':'#556b2f',
    'goblin':'#6b8e23','demon':'#cc3333','devil':'#aa0000','angel':'#87ceeb',
    'fairy':'#dda0dd','dragon':'#cc6600','dragonborn':'#b8860b','skeleton':'#708090',
    'vampire':'#8b0000','spirit':'#778899','god':'#ffd700','demi-god':'#daa520',
    'merfolk':'#20b2aa','centaur':'#8b6914','reptile':'#228b22','slimes':'#32cd32',
    'elemental':'#ff6347','golem':'#808080','cyborg':'#4682b4','werebeast':'#8b4513',
    'giant':'#a0522d','birdkin':'#87ceeb','dryad':'#3cb371','nightborn':'#483d8b',
    'voidwalker':'#4b0082','cosmic warrior':'#1e90ff','soulweaver':'#9370db',
    'genies':'#da70d6','gargoyle':'#696969','trolls':'#556b2f','siren':'#48d1cc',
    'mythical beast':'#ff8c00','cosmic mind':'#191970','hive mind':'#9acd32',
    'symbiote':'#800080','artisan':'#deb887','fortunas':'#ffd700','dispensian':'#c0c0c0',
    'nucleite':'#00ff7f','primordial':'#2f4f4f','reincarnation':'#e6e6fa',
    'evil reincarnation':'#8b008b','dragon slayer':'#b22222','animorph':'#d2691e',
    'fey':'#98fb98','chimekin':'#e9967a','boardborn':'#bc8f8f','darwizzies':'#dcdcdc',
    'gnomes':'#8fbc8f',
  };
  raceColor=raceAuraColors[race]||raceColor;

  // Scale body proportions by character size
  const headR=h*0.10*sizeScale;
  const bodyW=h*0.16*sizeScale;
  const bodyH=h*0.35*sizeScale;
  const shoulderY=y+h*0.33;
  const bodyTop=shoulderY;
  const bodyBot=bodyTop+bodyH;
  const legH=h*0.18*sizeScale;

  // Race-specific body/skin color
  const raceBodyColors={
    'demon':'#8b2252','devil':'#8b0000','angel':'#e8e0d0','fairy':'#f0d0f0',
    'dragon':'#3a6b3a','dragonborn':'#4a7a4a','elf':'#c8b89a','dwarf':'#c8a870',
    'orc':'#5a7a3a','goblin':'#5a8a3a','skeleton':'#d0c8b8','vampire':'#c0b0b0',
    'slimes':'#50c878','elemental':'#7090d0','golem':'#8a8a7a','cyborg':'#708090',
    'spirit':'#a0b8d0','god':'#ffe8b0','demi-god':'#e8d8b0','merfolk':'#60a0b0',
    'centaur':'#c0a070','reptile':'#5a8050','werebeast':'#8a7050','giant':'#b0a080',
  };
  const skinColor=raceBodyColors[race]||lighten(raceColor,30);
  const darkSkin=darken(skinColor,40);
  const armourColor=darken(raceColor,20);

  X.save();

  // Aura glow behind character
  X.shadowColor=raceColor;X.shadowBlur=Math.min(40,4+30);
  const auraGrad=X.createRadialGradient(cx,bodyTop+bodyH*0.3,headR,cx,bodyTop+bodyH*0.3,h*0.5);
  auraGrad.addColorStop(0,hexToRgba(raceColor,0.15));auraGrad.addColorStop(1,'transparent');
  X.fillStyle=auraGrad;X.fillRect(cx-h*0.6,y,h*1.2,h);
  X.shadowBlur=0;

  // === RACE-SPECIFIC FEATURES (behind body) ===

  // Wings (angels, fairies, demons, dragons, birdkin)
  const hasWings=race.includes('angel')||race.includes('fairy')||race.includes('demon')||
    race.includes('devil')||race.includes('dragon')||race==='birdkin'||race==='dragonborn';
  if(hasWings){
    const wingColor=race.includes('angel')?'#f0e8d8':race.includes('fairy')?'#e0b0e8':
      race.includes('demon')||race.includes('devil')?'#5a1a2a':
      race.includes('dragon')||race==='dragonborn'?'#3a5a3a':'#8a7a6a';
    const wingAlpha=0.4+Math.sin(t*2)*0.1;
    X.save();X.globalAlpha=wingAlpha;
    // Left wing
    X.beginPath();
    X.moveTo(cx-bodyW*0.5,shoulderY+bodyH*0.1);
    X.quadraticCurveTo(cx-h*0.5,shoulderY-h*0.15,cx-h*0.45,shoulderY+bodyH*0.4);
    X.quadraticCurveTo(cx-h*0.3,shoulderY+bodyH*0.5,cx-bodyW*0.5,shoulderY+bodyH*0.3);
    X.fillStyle=wingColor;X.fill();X.strokeStyle=lighten(wingColor,30);X.lineWidth=1;X.stroke();
    // Right wing
    X.beginPath();
    X.moveTo(cx+bodyW*0.5,shoulderY+bodyH*0.1);
    X.quadraticCurveTo(cx+h*0.5,shoulderY-h*0.15,cx+h*0.45,shoulderY+bodyH*0.4);
    X.quadraticCurveTo(cx+h*0.3,shoulderY+bodyH*0.5,cx+bodyW*0.5,shoulderY+bodyH*0.3);
    X.fillStyle=wingColor;X.fill();X.strokeStyle=lighten(wingColor,30);X.lineWidth=1;X.stroke();
    X.restore();
  }

  // Tail (demons, dragons, reptiles, werebeasts)
  const hasTail=race.includes('demon')||race.includes('devil')||race.includes('dragon')||
    race==='dragonborn'||race==='reptile'||race==='werebeast'||race==='centaur';
  if(hasTail){
    X.beginPath();
    const tailStart=bodyBot-bodyH*0.1;
    X.moveTo(cx+bodyW*0.3,tailStart);
    X.quadraticCurveTo(cx+h*0.35,tailStart+legH*0.5+Math.sin(t*3)*5,
      cx+h*0.25,tailStart+legH*0.8);
    X.strokeStyle=darkSkin;X.lineWidth=h*0.02;X.lineCap='round';X.stroke();
  }

  // === BODY ===

  // Legs
  X.fillStyle=darkSkin;
  // Left leg
  X.beginPath();
  X.moveTo(cx-bodyW*0.3,bodyBot);
  X.lineTo(cx-bodyW*0.45,bodyBot+legH);
  X.lineTo(cx-bodyW*0.15,bodyBot+legH);
  X.lineTo(cx-bodyW*0.05,bodyBot);
  X.closePath();X.fill();
  // Right leg
  X.beginPath();
  X.moveTo(cx+bodyW*0.05,bodyBot);
  X.lineTo(cx+bodyW*0.15,bodyBot+legH);
  X.lineTo(cx+bodyW*0.45,bodyBot+legH);
  X.lineTo(cx+bodyW*0.3,bodyBot);
  X.closePath();X.fill();

  // Boots/feet
  X.fillStyle=race==='skeleton'?'#b0a898':'#3a3a3a';
  X.fillRect(cx-bodyW*0.5,bodyBot+legH-h*0.02,bodyW*0.35,h*0.03);
  X.fillRect(cx+bodyW*0.15,bodyBot+legH-h*0.02,bodyW*0.35,h*0.03);

  // Torso (armour-colored)
  const torsoGrad=X.createLinearGradient(cx-bodyW,bodyTop,cx+bodyW,bodyBot);
  torsoGrad.addColorStop(0,armourColor);torsoGrad.addColorStop(0.5,lighten(armourColor,20));
  torsoGrad.addColorStop(1,armourColor);
  X.fillStyle=torsoGrad;
  X.beginPath();
  X.moveTo(cx-bodyW,bodyTop);
  X.lineTo(cx+bodyW,bodyTop);
  X.lineTo(cx+bodyW*0.8,bodyBot);
  X.lineTo(cx-bodyW*0.8,bodyBot);
  X.closePath();X.fill();

  // Armour details — chest plate highlight
  X.strokeStyle=hexToRgba('#fff',0.2);X.lineWidth=1;
  X.beginPath();X.moveTo(cx,bodyTop+bodyH*0.1);X.lineTo(cx-bodyW*0.3,bodyTop+bodyH*0.4);
  X.moveTo(cx,bodyTop+bodyH*0.1);X.lineTo(cx+bodyW*0.3,bodyTop+bodyH*0.4);X.stroke();
  // Belt
  X.fillStyle=darken(armourColor,30);
  X.fillRect(cx-bodyW*0.85,bodyBot-bodyH*0.08,bodyW*1.7,bodyH*0.06);

  // Shoulder pads
  X.fillStyle=lighten(armourColor,10);
  X.beginPath();X.arc(cx-bodyW,bodyTop+bodyH*0.05,bodyW*0.3,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(cx+bodyW,bodyTop+bodyH*0.05,bodyW*0.3,0,Math.PI*2);X.fill();

  // Arms (skin color, extend from shoulders)
  X.fillStyle=skinColor;
  const armLen=bodyH*0.7;
  // Left arm
  X.save();X.translate(cx-bodyW*1.1,bodyTop+bodyH*0.08);X.rotate(-0.15+Math.sin(t*1.5)*0.03);
  X.fillRect(-h*0.025,0,h*0.05,armLen);X.restore();
  // Right arm (angled to hold weapon)
  X.save();X.translate(cx+bodyW*1.1,bodyTop+bodyH*0.08);X.rotate(0.3);
  X.fillRect(-h*0.025,0,h*0.05,armLen);X.restore();

  // === HEAD ===
  // Neck
  X.fillStyle=skinColor;
  X.fillRect(cx-h*0.03,shoulderY-h*0.06,h*0.06,h*0.07);

  // Head shape
  X.beginPath();X.arc(cx,shoulderY-headR*0.8,headR,0,Math.PI*2);
  X.fillStyle=skinColor;X.fill();

  // Eyes (race-dependent)
  const eyeY=shoulderY-headR*0.85;
  const eyeSpacing=headR*0.4;
  if(race==='skeleton'){
    // Hollow eye sockets
    X.fillStyle='#1a1a1a';
    X.beginPath();X.arc(cx-eyeSpacing,eyeY,headR*0.15,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(cx+eyeSpacing,eyeY,headR*0.15,0,Math.PI*2);X.fill();
    X.fillStyle=raceColor;
    X.beginPath();X.arc(cx-eyeSpacing,eyeY,headR*0.06,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(cx+eyeSpacing,eyeY,headR*0.06,0,Math.PI*2);X.fill();
  } else {
    // Normal eyes with glow
    X.fillStyle='#fff';
    X.beginPath();X.ellipse(cx-eyeSpacing,eyeY,headR*0.12,headR*0.08,0,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(cx+eyeSpacing,eyeY,headR*0.12,headR*0.08,0,0,Math.PI*2);X.fill();
    // Iris color based on race
    const irisColor=race.includes('demon')||race.includes('devil')?'#ff2020':
      race.includes('angel')?'#60a0ff':race.includes('dragon')?'#ffaa00':
      race.includes('vampire')?'#cc0000':race==='elemental'?raceColor:'#334';
    X.fillStyle=irisColor;
    X.beginPath();X.arc(cx-eyeSpacing,eyeY,headR*0.06,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(cx+eyeSpacing,eyeY,headR*0.06,0,Math.PI*2);X.fill();
  }

  // Hair (race-dependent style)
  const hairColor=race==='elf'?'#d4af37':race.includes('demon')||race.includes('devil')?'#2a0a0a':
    race.includes('angel')?'#f0e8d0':race==='orc'?'#1a1a1a':race==='vampire'?'#1a1a2a':
    race.includes('dragon')?darken(skinColor,20):lighten(raceColor,20);
  X.fillStyle=hairColor;
  const hairTop=shoulderY-headR*1.8;
  if(race==='skeleton'){
    // No hair
  } else if(race==='slimes'||race==='golem'||race==='elemental'){
    // Crown/crest instead of hair
    X.beginPath();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+Math.PI*i/4-Math.PI/2;
      const cr2=headR*(0.8+Math.sin(t*2+i)*0.1);
      X.lineTo(cx+Math.cos(a)*cr2,hairTop+headR*0.3+Math.sin(a)*cr2*0.5);
    }
    X.closePath();X.fill();
  } else {
    // Standard hair
    X.beginPath();
    X.arc(cx,shoulderY-headR*0.8,headR*1.12,Math.PI,0);
    X.lineTo(cx+headR*1.2,shoulderY-headR*0.3);
    X.quadraticCurveTo(cx+headR*1.1,shoulderY,cx+headR*0.5,shoulderY+headR*0.2);
    X.lineTo(cx-headR*0.5,shoulderY+headR*0.2);
    X.quadraticCurveTo(cx-headR*1.1,shoulderY,cx-headR*1.2,shoulderY-headR*0.3);
    X.closePath();X.fill();
  }

  // Horns (demons, devils, dragons)
  if(race.includes('demon')||race.includes('devil')||race.includes('dragon')||race==='dragonborn'){
    X.fillStyle=race.includes('dragon')?darken(skinColor,30):'#3a2020';
    // Left horn
    X.beginPath();X.moveTo(cx-headR*0.7,hairTop+headR*0.5);
    X.quadraticCurveTo(cx-headR*1.2,hairTop-headR*0.3,cx-headR*0.9,hairTop-headR*0.1);
    X.lineTo(cx-headR*0.6,hairTop+headR*0.6);X.closePath();X.fill();
    // Right horn
    X.beginPath();X.moveTo(cx+headR*0.7,hairTop+headR*0.5);
    X.quadraticCurveTo(cx+headR*1.2,hairTop-headR*0.3,cx+headR*0.9,hairTop-headR*0.1);
    X.lineTo(cx+headR*0.6,hairTop+headR*0.6);X.closePath();X.fill();
  }

  // Ears (elves get pointed ears)
  if(race==='elf'||race==='fairy'){
    X.fillStyle=skinColor;
    X.beginPath();X.moveTo(cx-headR,eyeY);
    X.lineTo(cx-headR*1.5,eyeY-headR*0.5);X.lineTo(cx-headR*0.9,eyeY+headR*0.1);X.fill();
    X.beginPath();X.moveTo(cx+headR,eyeY);
    X.lineTo(cx+headR*1.5,eyeY-headR*0.5);X.lineTo(cx+headR*0.9,eyeY+headR*0.1);X.fill();
  }

  // Crown/halo (gods, angels, demi-gods)
  if(race==='god'||race==='demi-god'){
    X.strokeStyle='#ffd700';X.lineWidth=2;X.shadowColor='#ffd700';X.shadowBlur=10;
    X.beginPath();
    for(let i=0;i<7;i++){
      const a=-Math.PI+Math.PI*i/6;
      const tipY=hairTop-headR*0.2+(i%2===0?-headR*0.25:0);
      X.lineTo(cx+Math.cos(a)*headR*0.8,tipY);
    }
    X.strokeStyle='#ffd700';X.stroke();X.fillStyle=hexToRgba('#ffd700',0.3);X.fill();
    X.shadowBlur=0;
  }
  if(race.includes('angel')){
    X.strokeStyle='#ffe8a0';X.lineWidth=2;X.shadowColor='#ffe8a0';X.shadowBlur=15;
    X.beginPath();X.ellipse(cx,hairTop-headR*0.1,headR*0.8,headR*0.2,0,0,Math.PI*2);X.stroke();
    X.shadowBlur=0;
  }

  // === WEAPON (in right hand) ===
  const weapX=cx+bodyW*1.1+Math.sin(0.3)*armLen*0.9;
  const weapY=bodyTop+bodyH*0.08+Math.cos(0.3)*armLen*0.9;

  const isSword=weapon.includes('sword')||weapon.includes('katana')||weapon.includes('rapier')||
    weapon.includes('scimitar')||weapon.includes('claymore')||weapon.includes('falchion')||
    weapon.includes('gladius')||weapon.includes('zweihander')||weapon.includes('dao')||
    weapon.includes('khopesh')||weapon.includes('cutlass')||weapon.includes('saber')||
    weapon.includes('flamberge')||weapon.includes('estoc')||weapon.includes('blade');
  const isAxe=weapon.includes('axe')||weapon.includes('halberd')||weapon.includes('bardiche')||
    weapon.includes('tomahawk')||weapon.includes('labrys');
  const isHammer=weapon.includes('hammer')||weapon.includes('mace')||weapon.includes('maul')||
    weapon.includes('morningstar')||weapon.includes('flail')||weapon.includes('club')||weapon.includes('scepter');
  const isSpear=weapon.includes('spear')||weapon.includes('trident')||weapon.includes('pike')||
    weapon.includes('javelin')||weapon.includes('lance')||weapon.includes('glaive')||
    weapon.includes('naginata')||weapon.includes('guandao');
  const isDagger=weapon.includes('dagger')||weapon.includes('kris')||weapon.includes('stiletto')||
    weapon.includes('tanto')||weapon.includes('kukri')||weapon.includes('karambit')||weapon.includes('kunai');
  const isBow=weapon.includes('bow')||weapon.includes('crossbow');
  const isStaff=weapon.includes('staff')||weapon.includes('wand');
  const isScythe=weapon.includes('scythe')||weapon.includes('sickle')||weapon.includes('kama');
  const isGun=weapon.includes('pistol')||weapon.includes('musket')||weapon.includes('cannon')||weapon.includes('gunblade');
  const isClaw=weapon.includes('claw')||weapon.includes('gauntlet')||weapon.includes('knuckle')||
    weapon.includes('iron fist')||weapon.includes('bagh nakh');
  const isShield=weapon.includes('shield')||weapon.includes('buckler')||weapon.includes('targe');
  const isWhip=weapon.includes('whip')||weapon.includes('chain')||weapon.includes('kusarigama')||weapon.includes('rope dart');

  // Enchantment glow color
  const ench=(cr.enchantment||'').toLowerCase();
  const enchColor=ench.includes('fire')||ench.includes('blaze')||ench.includes('inferno')?'#ff4400':
    ench.includes('ice')||ench.includes('frost')||ench.includes('cryo')?'#44ccff':
    ench.includes('lightning')||ench.includes('thunder')||ench.includes('storm')?'#ffee00':
    ench.includes('poison')||ench.includes('toxic')||ench.includes('venom')?'#44ff44':
    ench.includes('dark')||ench.includes('shadow')||ench.includes('void')||ench.includes('curse')?'#8844cc':
    ench.includes('light')||ench.includes('holy')||ench.includes('divine')?'#ffe880':
    ench.includes('blood')?'#cc2222':raceColor;

  X.save();
  if(ench&&weapon!=='no weapon'){X.shadowColor=enchColor;X.shadowBlur=8;}

  if(weapon==='no weapon'||weapon===''){
    // Bare fists — just show clenched hand
  } else if(isSword){
    const sLen=h*0.35;
    X.save();X.translate(weapX,weapY);X.rotate(-0.8);
    // Blade
    X.fillStyle='#c0c8d0';
    X.beginPath();X.moveTo(-h*0.012,0);X.lineTo(0,-sLen);X.lineTo(h*0.012,0);X.closePath();X.fill();
    // Edge highlight
    X.strokeStyle='#e8e8f0';X.lineWidth=1;
    X.beginPath();X.moveTo(0,-sLen);X.lineTo(0,0);X.stroke();
    // Guard
    X.fillStyle='#8a7a3a';X.fillRect(-h*0.04,0,h*0.08,h*0.015);
    // Handle
    X.fillStyle='#4a3a2a';X.fillRect(-h*0.01,h*0.015,h*0.02,h*0.06);
    // Pommel
    X.fillStyle='#8a7a3a';X.beginPath();X.arc(0,h*0.08,h*0.015,0,Math.PI*2);X.fill();
    X.restore();
  } else if(isAxe){
    const aLen=h*0.3;
    X.save();X.translate(weapX,weapY);X.rotate(-0.6);
    // Handle
    X.fillStyle='#5a4a30';X.fillRect(-h*0.01,0,h*0.02,aLen);
    // Axe head
    X.fillStyle='#8a8a8a';
    X.beginPath();X.moveTo(h*0.01,-h*0.01);
    X.quadraticCurveTo(h*0.06,-h*0.04,h*0.05,h*0.06);
    X.lineTo(h*0.01,h*0.04);X.closePath();X.fill();
    X.restore();
  } else if(isHammer){
    const hLen=h*0.3;
    X.save();X.translate(weapX,weapY);X.rotate(-0.5);
    X.fillStyle='#5a4a30';X.fillRect(-h*0.01,0,h*0.02,hLen);
    // Hammer head
    X.fillStyle='#6a6a6a';X.fillRect(-h*0.04,-h*0.02,h*0.08,h*0.05);
    X.restore();
  } else if(isSpear){
    const sLen=h*0.45;
    X.save();X.translate(weapX,weapY);X.rotate(-0.9);
    X.fillStyle='#5a4a30';X.fillRect(-h*0.008,0,h*0.016,sLen);
    // Spearhead
    X.fillStyle='#c0c0c0';
    X.beginPath();X.moveTo(0,-h*0.04);X.lineTo(-h*0.015,0);X.lineTo(h*0.015,0);X.closePath();X.fill();
    X.restore();
  } else if(isDagger){
    X.save();X.translate(weapX,weapY);X.rotate(-0.7);
    X.fillStyle='#b0b8c0';
    X.beginPath();X.moveTo(-h*0.008,0);X.lineTo(0,-h*0.12);X.lineTo(h*0.008,0);X.closePath();X.fill();
    X.fillStyle='#4a3a2a';X.fillRect(-h*0.015,0,h*0.03,h*0.04);
    X.restore();
  } else if(isBow){
    X.save();X.translate(weapX,weapY);X.rotate(-0.3);
    X.strokeStyle='#6a5030';X.lineWidth=h*0.015;X.lineCap='round';
    X.beginPath();X.arc(h*0.02,0,h*0.15,Math.PI*0.3,Math.PI*1.7);X.stroke();
    // String
    X.strokeStyle='#c0b890';X.lineWidth=1;
    X.beginPath();
    X.moveTo(h*0.02+Math.cos(Math.PI*0.3)*h*0.15,Math.sin(Math.PI*0.3)*h*0.15);
    X.lineTo(h*0.02+Math.cos(Math.PI*1.7)*h*0.15,Math.sin(Math.PI*1.7)*h*0.15);
    X.stroke();
    X.restore();
  } else if(isStaff){
    X.save();X.translate(weapX,weapY);X.rotate(-0.8);
    X.fillStyle='#5a4030';X.fillRect(-h*0.01,0,h*0.02,h*0.4);
    // Orb on top
    X.fillStyle=enchColor;X.shadowColor=enchColor;X.shadowBlur=12;
    X.beginPath();X.arc(0,-h*0.02,h*0.025,0,Math.PI*2);X.fill();
    X.shadowBlur=0;
    X.restore();
  } else if(isScythe){
    X.save();X.translate(weapX,weapY);X.rotate(-0.7);
    X.fillStyle='#4a3a2a';X.fillRect(-h*0.008,0,h*0.016,h*0.4);
    // Blade
    X.fillStyle='#9a9a9a';
    X.beginPath();X.moveTo(0,0);
    X.quadraticCurveTo(-h*0.12,-h*0.06,-h*0.08,-h*0.01);
    X.lineTo(0,h*0.02);X.closePath();X.fill();
    X.restore();
  } else if(isGun){
    X.save();X.translate(weapX,weapY);X.rotate(0.3);
    X.fillStyle='#4a4a4a';
    X.fillRect(-h*0.01,0,h*0.02,h*0.15); // barrel
    X.fillRect(-h*0.02,h*0.1,h*0.04,h*0.06); // grip
    X.restore();
  } else if(isWhip){
    X.save();X.strokeStyle='#5a3a20';X.lineWidth=h*0.01;X.lineCap='round';
    X.beginPath();X.moveTo(weapX,weapY);
    X.quadraticCurveTo(weapX+h*0.15,weapY+h*0.2+Math.sin(t*3)*h*0.05,
      weapX+h*0.05,weapY+h*0.35);X.stroke();
    X.restore();
  } else if(isShield){
    // Shield in left hand instead
    const shX=cx-bodyW*1.1-armLen*0.3;
    const shY=bodyTop+bodyH*0.4;
    X.fillStyle=armourColor;
    X.beginPath();
    X.ellipse(shX,shY,h*0.06,h*0.08,0,0,Math.PI*2);X.fill();
    X.strokeStyle=lighten(armourColor,30);X.lineWidth=2;X.stroke();
    // Shield emblem
    X.fillStyle=raceColor;
    X.beginPath();X.arc(shX,shY,h*0.025,0,Math.PI*2);X.fill();
  } else {
    // Generic weapon — glowing orb
    X.fillStyle=enchColor;X.shadowColor=enchColor;X.shadowBlur=10;
    X.beginPath();X.arc(weapX,weapY+h*0.05,h*0.03,0,Math.PI*2);X.fill();
    X.shadowBlur=0;
  }
  X.shadowBlur=0;
  X.restore();

  // === ENCHANTMENT PARTICLE EFFECTS ===
  if(ench&&weapon!=='no weapon'){
    X.save();
    for(let i=0;i<8;i++){
      const pa=(t*1.5+i*Math.PI/4);
      const pr=h*0.2+Math.sin(t+i*0.8)*h*0.05;
      const px=weapX+Math.cos(pa)*pr*0.3-h*0.1;
      const py=weapY-h*0.1+Math.sin(pa)*pr*0.5;
      const alpha=Math.max(0,Math.sin(t*2+i)*0.5+0.3);
      X.fillStyle=hexToRgba(enchColor,alpha);
      X.beginPath();X.arc(px,py,1.5+Math.sin(t+i)*0.5,0,Math.PI*2);X.fill();
    }
    X.restore();
  }

  // === POWER AURA (based on strength tier) ===
  const str=(cr.strength||'').toLowerCase();
  if(str.includes('cosmic')||str.includes('universal')||str.includes('boundless')){
    X.save();X.globalAlpha=0.15+Math.sin(t*1.5)*0.05;
    X.strokeStyle=raceColor;X.lineWidth=2;
    X.beginPath();X.arc(cx,bodyTop+bodyH*0.3,h*0.4+Math.sin(t*2)*5,0,Math.PI*2);X.stroke();
    X.beginPath();X.arc(cx,bodyTop+bodyH*0.3,h*0.48+Math.cos(t*1.5)*8,0,Math.PI*2);X.stroke();
    X.restore();
  }

  X.restore();
}

function drawCharDone(){
  clearBtns();
  if(!charDoneEnteredAt)charDoneEnteredAt=Date.now();
  const revealElapsed=(Date.now()-charDoneEnteredAt)/1000;
  const revealAlpha=Math.min(1,revealElapsed/1.2); // 1.2s fade-in

  X.fillStyle='#000';X.fillRect(0,0,VW,VH);

  // Dramatic reveal title during fade-in
  if(revealAlpha<0.8){
    const titleAlpha=revealAlpha<0.3?revealAlpha/0.3:revealAlpha>0.5?1-(revealAlpha-0.5)/0.3:1;
    X.save();X.globalAlpha=titleAlpha;
    X.font='italic bold '+(isMobile?22:32)+'px "Georgia","Segoe UI",serif';
    X.textAlign='center';X.textBaseline='middle';
    X.shadowColor='#af1111';X.shadowBlur=25;
    X.fillStyle='#e0c0a0';
    X.fillText('Your fate is sealed.',VW/2,VH/2);
    X.shadowBlur=0;X.restore();
    if(revealAlpha<0.5)return; // hold on reveal text briefly
  }

  X.save();X.globalAlpha=Math.min(1,(revealAlpha-0.4)/0.8);

  // Fantasy background gradient based on race/element
  const raceColor=CAT_COLORS.race;
  const grad=X.createLinearGradient(0,0,VW,VH);
  grad.addColorStop(0,'#000');grad.addColorStop(0.3,darken(raceColor,100));
  grad.addColorStop(0.7,darken('#7B1FA2',100));grad.addColorStop(1,'#000');
  X.fillStyle=grad;X.fillRect(0,0,VW,VH);

  // Particle effects

    const px=((Math.sin(t*0.3+i*2.1)*0.5+0.5)*VW);

// ============================================================
// BATTLE ENGINE — Tier-based combat
// ============================================================
function tierToNum(val,tierArr){
  if(!val||!tierArr)return 3;
  const idx=tierArr.indexOf(val);
  return idx>=0?idx:3;
}

function getCharPower(ch){
  return {
    str:tierToNum(ch.strength,STRENGTH),
    spd:tierToNum(ch.speed,SPEED),
    dur:tierToNum(ch.durability,DURABILITY),
    iq:tierToNum(ch.iq,IQ_TIERS),
    fight:tierToNum(ch.fight,FIGHT),
    wm:tierToNum(ch.weaponMastery,WEAPON_MASTERY),
    pm:tierToNum(ch.powerMastery,POWER_MASTERY),
  };
}

function initBattle(ch1,ch2){
  const p1=getCharPower(ch1),p2=getCharPower(ch2);
  const hp1=50+(p1.dur*12);
  const hp2=50+(p2.dur*12);

  battleState={
    f1:{...ch1,power:p1,hp:hp1,maxHp:hp1,x:VW*0.25,y:VH/2,alive:true,atkCd:0,hitFlash:0,scale:1},
    f2:{...ch2,power:p2,hp:hp2,maxHp:hp2,x:VW*0.75,y:VH/2,alive:true,atkCd:0,hitFlash:0,scale:1},
    phase:'intro',introTimer:0,winner:null,resultTimer:0,
  };
  battleTime=0;particles=[];battleLog=[];
  addBattleLog(ch1._name+' vs '+ch2._name+'!','#fff');
}

function addBattleLog(msg,color){
  battleLog.unshift({msg,color:color||'#aaa',life:180});
  if(battleLog.length>6)battleLog.pop();
}

function updateBattle(){
  if(!battleState)return;
  battleTime++;

  if(battleState.phase==='intro'){
    battleState.introTimer++;
    if(battleState.introTimer>=120){
      battleState.phase='fight';
    }
    return;
  }

  if(battleState.phase==='result'){
    battleState.resultTimer++;
    if(battleState.resultTimer%3===0&&battleState.winner){
      const w=battleState.winner;
      spawnParticle(w.x+rand(-30,30),w.y+rand(-30,30),{
        vx:rand(-2,2)*0.5,vy:rand(-3,-1)*0.5,life:40,
        color:pick(['#FFD700','#fff','#FF6F00']),size:rand(2,4),glow:true,gravity:0.05
      });
    }
    updateParticles();return;
  }

  const f1=battleState.f1,f2=battleState.f2;
  [f1,f2].forEach(f=>{
    if(!f.alive)return;
    const enemy=f===f1?f2:f1;
    if(!enemy.alive)return;

    const dx=enemy.x-f.x,dy=enemy.y-f.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const spd=1.5+f.power.spd*0.4;

    // Move toward enemy
    if(dist>80){f.x+=dx/dist*spd;f.y+=dy/dist*spd;}

    // Attack
    f.atkCd--;
    if(f.atkCd<=0&&dist<100){
      const atkPower=f.power.str*2+f.power.fight+f.power.wm;
      const def=enemy.power.dur+enemy.power.fight*0.5;
      let dmg=Math.max(1,atkPower-def+rand(-2,3));

      // Crit chance based on IQ
      const critChance=5+f.power.iq*3;
      const isCrit=rand(1,100)<=critChance;
      if(isCrit){dmg=Math.floor(dmg*1.8);SFX.crit();}else{SFX.hit();}

      // Dodge based on speed
      const dodgeChance=(enemy.power.spd-f.power.spd)*5;
      if(rand(1,100)<=dodgeChance){
        addBattleLog(enemy._name+' dodged!','#1565C0');
        spawnParticle(enemy.x,enemy.y-20,{text:'DODGE',color:'#1565C0',size:16,vy:-1,life:30,glow:true});
      }else{
        enemy.hp-=dmg;
        enemy.hitFlash=10;
        addBattleLog(f._name+' hit for '+dmg+(isCrit?' CRIT!':''),'#F44336');
        spawnParticle(enemy.x,enemy.y-20,{text:'-'+dmg,color:isCrit?'#FFD700':'#F44336',size:isCrit?20:16,vy:-1.5,life:30,glow:true});

        if(enemy.hp<=0){
          enemy.hp=0;enemy.alive=false;
          battleState.phase='result';battleState.winner=f;
          addBattleLog(f._name+' WINS!','#FFD700');
          SFX.victory();
        }
      }
      f.atkCd=Math.max(10,40-f.power.spd*3);
    }

    f.hitFlash=Math.max(0,f.hitFlash-1);
  });
  updateParticles();
}

function drawBattle(){
  clearBtns();X.fillStyle='#000';X.fillRect(0,0,VW,VH);
  if(!battleState)return;

  // Battle gradient bg
  const grad=X.createLinearGradient(0,0,VW,VH);
  grad.addColorStop(0,'#0a0a1a');grad.addColorStop(1,'#1a0a0a');
  X.fillStyle=grad;X.fillRect(0,0,VW,VH);

  const f1=battleState.f1,f2=battleState.f2;

  if(battleState.phase==='intro'){
    const t=battleState.introTimer;
    // P1 slide in
    if(t<50){
      const alpha=t/50;
      X.globalAlpha=alpha;
      X.font='bold 20px "Segoe UI",sans-serif';X.textAlign='center';X.fillStyle='#2196F3';
      X.fillText(f1._name||'Fighter 1',VW*0.25,VH/2);
      X.font='12px "Segoe UI",sans-serif';X.fillStyle='#aaa';
      X.fillText(f1.race||'',VW*0.25,VH/2+22);
    }
    // VS
    if(t>=50&&t<80){
      X.globalAlpha=(t-50)/30;
      X.font='bold 48px "Segoe UI",sans-serif';X.textAlign='center';X.fillStyle='#fff';
      X.fillText('VS',VW/2,VH/2);
    }
    // P2 slide in
    if(t>=80&&t<120){
      X.globalAlpha=(t-80)/40;
      X.font='bold 20px "Segoe UI",sans-serif';X.textAlign='center';X.fillStyle='#F44336';
      X.fillText(f2._name||'Fighter 2',VW*0.75,VH/2);
      X.font='12px "Segoe UI",sans-serif';X.fillStyle='#aaa';
      X.fillText(f2.race||'',VW*0.75,VH/2+22);
    }
    X.globalAlpha=1;
    buttons.forEach(drawBtn);return;
  }

  // Draw fighters
  [f1,f2].forEach((f,i)=>{
    const color=i===0?'#2196F3':'#F44336';

    // Fighter circle
    X.save();
    if(f.hitFlash>0){X.shadowColor='#F44336';X.shadowBlur=20;}
    if(!f.alive){X.globalAlpha=0.3;}

    X.beginPath();X.arc(f.x,f.y,25,0,Math.PI*2);
    const fGrad=X.createRadialGradient(f.x-5,f.y-5,3,f.x,f.y,25);
    fGrad.addColorStop(0,lighten(color,40));fGrad.addColorStop(1,color);
    X.fillStyle=fGrad;X.fill();
    X.strokeStyle=darken(color,30);X.lineWidth=2;X.stroke();
    X.shadowBlur=0;

    // Name label
    X.font='bold 11px "Segoe UI",sans-serif';X.textAlign='center';X.fillStyle='#fff';
    X.fillText(f._name||'?',f.x,f.y-35);

    // HP bar
    const hpW=60,hpH=6,hpX=f.x-hpW/2,hpY=f.y-45;
    X.fillStyle='#333';X.fillRect(hpX,hpY,hpW,hpH);
    const hpPct=Math.max(0,f.hp/f.maxHp);
    X.fillStyle=hpPct>0.5?'#4CAF50':hpPct>0.25?'#FF9800':'#F44336';
    X.fillRect(hpX,hpY,hpW*hpPct,hpH);

    X.globalAlpha=1;X.restore();
  });

  // Battle log
  const logX=10,logY=VH-20;
  battleLog.forEach((l,i)=>{
    const alpha=Math.min(1,l.life/60);
    X.globalAlpha=alpha;X.font='11px "Segoe UI",sans-serif';X.textAlign='left';
    X.fillStyle=l.color;X.fillText(l.msg,logX,logY-i*16);
    l.life--;
  });
  X.globalAlpha=1;
  battleLog=battleLog.filter(l=>l.life>0);

  // Draw particles
  drawParticles();

  // Result
  if(battleState.phase==='result'&&battleState.winner){
    X.font='bold '+(isMobile?24:36)+'px "Segoe UI",sans-serif';X.textAlign='center';
    X.shadowColor='#FFD700';X.shadowBlur=20;
    X.fillStyle='#FFD700';
    X.fillText(battleState.winner._name+' WINS!',VW/2,60);
    X.shadowBlur=0;

    if(battleState.resultTimer>60){
      addBtn('back',VW/2-60,VH-80,120,40,'BACK','#666',()=>{screen='title';battleState=null;},{fontSize:14});
    }
  }

  addBtn('quit',10,10,50,28,'Quit','#666',()=>{screen='title';battleState=null;},{fontSize:11});
  buttons.forEach(drawBtn);
}

// ============================================================
// INPUT HANDLING
// ============================================================
function handleInput(mx,my){
  for(let i=buttons.length-1;i>=0;i--){
    const b=buttons[i];
    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
      if(b.cb){b.cb();SFX.click();}
      return true;
    }
  }
  return false;
}

C.addEventListener('click',e=>{
  const r=C.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  handleInput(mx,my);
});
C.addEventListener('touchend',e=>{
  e.preventDefault();
  if(e.changedTouches&&e.changedTouches[0]){
    const r=C.getBoundingClientRect();
    const mx=e.changedTouches[0].clientX-r.left,my=e.changedTouches[0].clientY-r.top;
    handleInput(mx,my);
  }
},{passive:false});

// Hover tracking
C.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  buttons.forEach(b=>{b.hover=mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h;});
});

// ============================================================
// MAIN GAME LOOP
// ============================================================
function gameLoop(){
  switch(screen){
    case 'title':drawTitle();break;
    case 'spin':updateSpin();drawSpin();drawNarration();break;
    case 'charDone':drawCharDone();break;
    case 'roster':drawRoster();break;
    case 'battleSelect':drawBattleSelect();break;
    case 'battle':updateBattle();drawBattle();break;
  }
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
