<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scenario Generator - SoloForte</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#14141f;--card-hover:#1a1a2e;--text:#e0e0e0;--text-dim:#888;--accent:#6c5ce7;--success:#00b894;--danger:#e17055;--warning:#fdcb6e}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* ===== MENU SCREEN ===== */
.menu-screen{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.menu-header{text-align:center;padding:40px 0 32px;user-select:none}
.menu-header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#6c5ce7,#a29bfe,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.menu-header p{color:var(--text-dim);margin-top:8px;font-size:0.95rem}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.scenario-card{background:var(--card);border-radius:16px;overflow:hidden;transition:all .25s;position:relative;border:1px solid #222}
.scenario-card:hover{transform:translateY(-4px);border-color:#444;background:var(--card-hover)}
.scenario-card.locked{opacity:.6;pointer-events:auto}
.scenario-card.locked:hover{transform:none}
.card-banner{height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-banner .icon{font-size:3rem;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.card-banner .icon-art{z-index:1;width:100%;height:100%;position:absolute;inset:0}
.spiderman-banner{overflow:hidden}
.spiderman-banner .city-bg{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(0deg,#0a0a1a 0%,transparent 100%)}
.spiderman-banner .city-bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:
  linear-gradient(90deg,transparent 3%,#111 3%,#111 7%,transparent 7%,transparent 12%,#151515 12%,#151515 18%,transparent 18%,transparent 25%,#111 25%,#111 30%,transparent 30%,transparent 38%,#131313 38%,#131313 42%,transparent 42%,transparent 55%,#111 55%,#111 62%,transparent 62%,transparent 70%,#141414 70%,#141414 76%,transparent 76%,transparent 85%,#111 85%,#111 92%,transparent 92%);
  mask:linear-gradient(0deg,#000 60%,transparent);-webkit-mask:linear-gradient(0deg,#000 60%,transparent)}
.card-banner::before{content:'';position:absolute;inset:0;opacity:.7}
.card-body{padding:16px}
.card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.card-body p{font-size:.85rem;color:var(--text-dim);line-height:1.5;margin-bottom:12px;min-height:40px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.card-tag{font-size:.7rem;padding:3px 8px;border-radius:99px;background:rgba(108,92,231,.15);color:#a29bfe}
.card-badge{position:absolute;top:12px;right:12px;font-size:.7rem;padding:4px 10px;border-radius:99px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-playable{background:rgba(0,184,148,.2);color:#00b894}
.badge-soon{background:rgba(136,136,136,.2);color:#888}
.badge-new{background:rgba(253,121,168,.2);color:#fd79a8}

/* ===== SETUP SCREEN ===== */
.setup-screen{max-width:600px;margin:0 auto;padding:24px 16px}
.setup-screen h2{text-align:center;font-size:1.8rem;margin-bottom:24px;font-weight:700}
.setup-group{margin-bottom:20px}
.setup-group label{display:block;font-size:.85rem;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.setup-group input[type="text"]{width:100%;padding:12px 16px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:var(--text);font-size:1rem}
.setup-group input:focus{border-color:var(--accent)}
.role-options{display:flex;gap:10px;flex-wrap:wrap}
.role-btn{padding:12px 18px;background:#1a1a2e;border:2px solid #333;border-radius:10px;color:var(--text);font-size:.9rem;transition:all .2s;text-align:left;flex:1;min-width:140px}
.role-btn:hover{border-color:#555}
.role-btn.selected{border-color:var(--accent);background:rgba(108,92,231,.15)}
.preset-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preset-btn{padding:14px;background:#1a1a2e;border:2px solid #333;border-radius:12px;color:var(--text);text-align:left;transition:all .2s}
.preset-btn:hover{border-color:#555}
.preset-btn.selected{border-color:var(--accent);background:rgba(108,92,231,.15)}
.preset-btn .name{font-weight:700;font-size:.95rem;margin-bottom:4px}
.preset-btn .desc{font-size:.75rem;color:var(--text-dim)}
.custom-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.stat-input{background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:10px;text-align:center}
.stat-input .stat-name{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.stat-input .stat-val{font-size:1.4rem;font-weight:700;margin:4px 0;color:var(--accent)}
.stat-input .stat-btns{display:flex;justify-content:center;gap:8px}
.stat-input .stat-btns button{width:28px;height:28px;border-radius:50%;background:#333;color:var(--text);font-size:1rem;display:flex;align-items:center;justify-content:center}
.stat-input .stat-btns button:hover{background:#444}
.points-left{text-align:center;font-size:.9rem;color:var(--accent);margin-top:8px}
.start-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:1.1rem;font-weight:700;border-radius:12px;margin-top:24px;transition:all .2s;text-transform:uppercase;letter-spacing:1px}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,.3)}
.start-btn:disabled{opacity:.4;transform:none;cursor:not-allowed}
.back-link{display:block;text-align:center;margin-top:16px;color:var(--text-dim);font-size:.85rem;cursor:pointer;background:none}
.back-link:hover{color:var(--text)}

/* ===== GAME SCREEN ===== */
.game-screen{display:flex;flex-direction:column;min-height:100vh}
.game-topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(20,20,31,.95);border-bottom:1px solid #222;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.game-topbar .title{font-weight:700;font-size:.95rem}
.game-topbar .actions{display:flex;gap:8px}
.topbar-btn{padding:6px 14px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text-dim);font-size:.8rem;transition:all .2s}
.topbar-btn:hover{color:var(--text);border-color:#555}
.game-body{flex:1;display:flex;max-width:1000px;margin:0 auto;width:100%;padding:24px 16px}
.game-main{flex:1;max-width:700px}
.game-sidebar{width:220px;margin-left:24px;flex-shrink:0}
.scene-mood{height:160px;border-radius:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.scene-mood::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 60%,var(--bg))}
.story-text{font-size:1.05rem;line-height:1.8;margin-bottom:24px;white-space:pre-wrap}
.story-text .new-text{animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.choice-btn{padding:14px 18px;background:#1a1a2e;border:2px solid #2a2a3e;border-radius:12px;color:var(--text);font-size:.95rem;text-align:left;transition:all .2s;position:relative}
.choice-btn:hover{border-color:var(--accent);background:rgba(108,92,231,.08);transform:translateX(4px)}
.choice-btn .check-info{font-size:.75rem;color:var(--warning);margin-top:4px}
.choice-btn .rel-info{font-size:.75rem;color:#fd79a8;margin-top:2px}
.choice-btn .effect-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.choice-btn .effect-tag{font-size:.65rem;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.choice-btn .effect-tag.stat-up{background:rgba(0,184,148,.15);color:#00b894;border:1px solid rgba(0,184,148,.3)}
.choice-btn .effect-tag.stat-down{background:rgba(214,48,49,.15);color:#ff7675;border:1px solid rgba(214,48,49,.3)}
.choice-btn .effect-tag.rel-up{background:rgba(253,121,168,.15);color:#fd79a8;border:1px solid rgba(253,121,168,.3)}
.choice-btn .effect-tag.rel-down{background:rgba(214,48,49,.15);color:#ff7675;border:1px solid rgba(214,48,49,.3)}
.choice-btn.disabled{opacity:.4;pointer-events:none}
.effect-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.effect-toast-item{padding:8px 18px;border-radius:10px;font-size:.85rem;font-weight:700;animation:toastIn .4s ease-out,toastOut .4s ease-in 1.8s forwards;white-space:nowrap;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.effect-toast-item.positive{background:rgba(0,184,148,.9);color:#fff}
.effect-toast-item.negative{background:rgba(214,48,49,.9);color:#fff}
.effect-toast-item.neutral{background:rgba(108,92,231,.9);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}

/* Stat check result overlay */
.check-result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:100;animation:fadeIn .3s}
.check-result .inner{background:var(--card);padding:32px;border-radius:20px;text-align:center;max-width:360px;border:2px solid #333}
.check-result .roll-display{font-size:2.5rem;font-weight:800;margin:16px 0}
.check-result .roll-display.success{color:var(--success)}
.check-result .roll-display.fail{color:var(--danger)}
.check-result .roll-detail{font-size:.85rem;color:var(--text-dim);margin-bottom:16px}
.check-result button{padding:10px 28px;background:var(--accent);color:#fff;border-radius:10px;font-size:.95rem;font-weight:600}

/* Sidebar */
.sidebar-section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #222}
.sidebar-section h4{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:.85rem}
.stat-row .stat-bar{width:60px;height:6px;background:#222;border-radius:3px;overflow:hidden}
.stat-row .stat-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.rel-row{display:flex;justify-content:space-between;font-size:.82rem;padding:2px 0}
.rel-row .val.positive{color:var(--success)}
.rel-row .val.negative{color:var(--danger)}
.inv-item{font-size:.82rem;padding:2px 0;color:var(--text-dim)}

/* ===== SAVE/LOAD MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:20px;padding:28px;max-width:440px;width:90%;border:1px solid #333}
.modal h3{margin-bottom:16px;font-size:1.2rem}
.modal{max-height:80vh;overflow-y:auto}
.save-slot{padding:14px;background:#1a1a2e;border:1px solid #333;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.save-slot:hover{border-color:var(--accent)}
.save-slot .slot-name{font-weight:600;font-size:.9rem}
.save-slot .slot-info{font-size:.78rem;color:var(--text-dim);margin-top:4px}
.modal-close{display:block;width:100%;padding:12px;background:#333;color:var(--text);border-radius:10px;margin-top:12px;font-size:.9rem}
.modal-close:hover{background:#444}

/* ===== UNLOCK MODAL ===== */
.unlock-input{display:flex;gap:8px;margin-top:12px}
.unlock-input input{flex:1;padding:10px 14px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text);font-size:1rem;text-align:center;letter-spacing:4px}
.unlock-input button{padding:10px 20px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600}
.unlock-error{color:var(--danger);font-size:.85rem;margin-top:8px;text-align:center}

/* ===== END SCREEN ===== */
.end-screen{max-width:600px;margin:60px auto;padding:24px;text-align:center}
.end-screen h2{font-size:2rem;margin-bottom:16px}
.end-screen p{color:var(--text-dim);line-height:1.7;margin-bottom:24px}
.end-screen button{padding:14px 32px;background:var(--accent);color:#fff;border-radius:12px;font-size:1rem;font-weight:600;margin:6px}

/* ===== CUTSCENE ===== */
.cutscene-panel{background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden;border:1px solid #222;animation:panelSlideIn .6s ease}
@keyframes panelSlideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.cutscene-panel .panel-image{width:100%;height:180px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:3rem}
.cutscene-panel .panel-image svg{width:100%;height:100%;display:block}
.cutscene-panel .panel-text{padding:16px;font-size:.95rem;line-height:1.7;color:var(--text)}
.cutscene-panel .panel-text .caption{font-size:.8rem;color:var(--text-dim);font-style:italic;margin-top:8px}
.cutscene-replay{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text-dim);font-size:.8rem;margin-bottom:16px;cursor:pointer;position:relative;z-index:5}
.cutscene-replay:hover{color:var(--text);border-color:#555}
.cutscene-progress{height:3px;background:#222;border-radius:2px;margin-bottom:16px;overflow:hidden}
.cutscene-progress .fill{height:100%;background:var(--accent);transition:width .3s linear}

/* ===== CHARACTER PORTRAITS ===== */
.scene-mood .char-portraits{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:100%;width:100%;position:relative;z-index:1;padding-bottom:4px}
.scene-mood .char-portrait{flex-shrink:0;filter:drop-shadow(0 4px 16px rgba(0,0,0,.7));transition:transform .3s ease;animation:portraitFadeIn .5s ease}
.scene-mood .char-portrait.single{width:110px;height:150px}
.scene-mood .char-portrait.dual{width:90px;height:128px}
.scene-mood .char-portrait.multi{width:70px;height:100px}
@keyframes portraitFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.scene-mood .char-portrait svg{width:100%;height:100%;display:block}
.char-portrait-glow{position:absolute;inset:0;pointer-events:none;z-index:0}

/* ===== MOBILE ===== */
.sidebar-toggle{display:none;padding:10px 16px;background:var(--card);border:1px solid #222;border-radius:10px;color:var(--text-dim);font-size:.85rem;margin-bottom:12px;width:100%}
@media(max-width:768px){
  .menu-header h1{font-size:1.8rem}
  .scenario-grid{grid-template-columns:1fr}
  .game-body{flex-direction:column;padding:16px 12px}
  .game-sidebar{width:100%;margin-left:0;margin-top:16px;display:none}
  .game-sidebar.open{display:block}
  .sidebar-toggle{display:block}
  .scene-mood{height:120px}
  .scene-mood .char-portrait.single{width:80px;height:112px}
  .scene-mood .char-portrait.dual{width:66px;height:96px}
  .scene-mood .char-portrait.multi{width:52px;height:76px}
  .preset-options{grid-template-columns:1fr}
  .custom-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>

    text:`You pull the blinds back and freeze.

The street four floors below is chaos. A car is flipped on its side, still smoking. People are running — some in pajamas, some barefoot. And behind them, others are moving wrong. Stumbling, lurching, fast when they shouldn't be. One of them catches a woman by the hair and drags her down. You look away before you see the rest.

Red and blue lights flash from a police cruiser at the intersection, but the doors are open and nobody's inside. A military Humvee rolls past, soldiers on top scanning rooftops with mounted lights.

This isn't a riot. This isn't a protest. The city is falling apart.

You need to move. But first — you need something to fight with.`,

  zo_barricade:{
    text:`You shove the bookshelf against the front door. Drag the kitchen table behind it. Wedge a chair under the handle for good measure.

For twenty minutes, it feels like the right call. You sit in the dark, listening to the world end outside your window.

Then the scratching starts. Not at your door — at your neighbor's. Mrs. Chen's apartment, right next to yours. You hear her deadbolt turn. Her door opens. She says "Hello? Is someone—"

The scream cuts through the wall like it's paper.

Then silence. Then footsteps — slow, dragging — and something bumps against YOUR door. The bookshelf shifts an inch.

You can't stay here.`,

  zo_weapon:{

    text:`"Hello? I'm not going to hurt you."

    text:`You sprint to the overturned truck. Hands reach out and pull you behind cover.

ZOMBIE_NODES.zo_listen = {
  text:`You press your ear to the railing and listen.

[PERCEPTION CHECK PASSED]

Below: two, maybe three of them shuffling on the second floor landing. Their breathing is wrong — gurgling, like fluid in the lungs.

Above: nothing. The fifth floor apartment with the light is quiet. Could be empty. Could be someone hiding. Could be a trap.

But you also hear something else — far below, in the alley. An engine idling. Someone has a car running down there.`,

ZOMBIE_NODES.zo_upstairs = {
  text:`You climb up. The fifth floor window is cracked open, curtains blowing.

You pull yourself through into a clean, well-lit apartment. Someone was here recently — coffee still warm on the counter, laptop open on a news feed that stopped updating thirty minutes ago.

On the kitchen table: a backpack already packed. Water, granola bars, a flashlight, a first aid kit, and a note: "Going to the roof. Helicopter evac at dawn. — R.T."

The roof. If there's an evac...`,
  scene:'dark',mood:'#636e72',
  effects:{inventory:['Flashlight','First aid kit','Granola bars']},
  choices:[
    {text:'Head to the roof',next:'zo_ch1_end_roof'},
    {text:'Take the supplies and go down to the alley',next:'zo_alley'}
  ]
};
ZOMBIE_NODES.zo_ch1_end_roof = {
  text:`You take the stairs to the roof. The door is already open.

The city stretches before you in every direction. Fires painting the skyline orange. The distant thud of explosions — the military is bombing something. Somewhere east, a massive column of smoke rises from what might be the hospital.

And in the sky, a helicopter. Moving away from you, searchlight sweeping. It's heading east.

On the roof: a flare gun and two flares, left behind. And a fresh set of scratch marks on the door you just came through — from the outside.

Someone was up here. They already got picked up. Or they didn't.

You have the high ground. You have flares. Dawn is five hours away.

ZOMBIE_NODES.zo_lobby_run = {text:'You burst through the lobby door. The security guard — what\'s left of him — turns. You don\'t slow down. You hurdle the overturned desk, your feet hit broken glass, pain flares but you keep running. Through the shattered entrance, into the night air.\n\nBehind you, the thing from 4B crashes into the lobby. But you\'re already gone.',scene:'dark',mood:'#e17055',effects:{flags:{first_kill:false}},choices:[{text:'Main street — find help',next:'zo_main_street'},{text:'Alley — stay hidden',next:'zo_alley'}]};
ZOMBIE_NODES.zo_barricade_stair = {text:'You grab a fire extinguisher from the wall mount and jam it through the door handle. The thing slams into the door — once, twice — but the handle holds. For now.\n\nYou\'re in the lobby. The entrance is right there.',scene:'dark',mood:'#636e72',choices:[{text:'Check the lobby carefully',next:'zo_stairwell'},{text:'Head straight outside',next:'zo_alley'}]};
ZOMBIE_NODES.zo_sprint_past = {text:'You take the stairs at a dead sprint. The two figures react — too slow. One grabs at your shirt, fingers scraping fabric, but you rip free. The other lunges and misses entirely.\n\nYou\'re past them. Ground floor. The lobby waits.',scene:'dark',mood:'#636e72',choices:[{text:'Enter the lobby',next:'zo_stairwell'}]};

ZOMBIE_NODES.zo_parking = {text:'The parking lot is mostly empty. Three cars remain. One has keys in the visor — an old Honda Civic. It starts on the third try.\n\nYou have transportation. Where do you go?',scene:'dark',mood:'#636e72',effects:{inventory:['Honda Civic'],flags:{has_car:true}},choices:[{text:'Drive to the main street — find other survivors',next:'zo_main_street'},{text:'Drive to the convenience store — stock up first',next:'zo_store'}]};
ZOMBIE_NODES.zo_store_grab = {text:'You move through the store quickly, filling your pockets and a plastic bag. Water bottles, a first aid kit, two cans of beans, a lighter, batteries.\n\n[PERCEPTION CHECK PASSED]\n\nYou notice a baseball bat behind the counter — the cashier\'s. And the crying from the back has stopped. Whoever was there heard you moving around.\n\nThe loading dock exit is to your right. The front door is behind you.',scene:'dark',mood:'#636e72',effects:{inventory:['Water bottles','First aid kit','Canned food','Lighter']},choices:[{text:'Call out to whoever\'s in the back',next:'zo_store_call'},{text:'Take the bat and leave through the loading dock',next:'zo_ch1_end_solo',effects:{inventory:['Baseball bat']}}]};
ZOMBIE_NODES.zo_store_approach = {text:'You move toward the storage room. The crying gets louder, then stops abruptly — they heard you.\n\nThe door is cracked open. Through the gap, you see movement. Someone small, pressed into the corner.',scene:'dark',mood:'#636e72',choices:[{text:'"Hey. I\'m not infected. Are you okay?"',next:'zo_store_call'},{text:'Push the door open slowly',next:'zo_store_call'}]};
ZOMBIE_NODES.zo_ch1_end_solo = {text:'You step out onto the loading dock. The alley behind the store is quiet. No movement. No sound except distant gunfire and the low hum of a city dying.\n\nYou have supplies. You have a weapon. You have no one.\n\nSometimes alone is safer. Sometimes it just means no one hears you scream.\n\n---\n\nCHAPTER 1 COMPLETE\n\nYou chose to go alone. Speed and stealth are your advantages — but every fight is yours alone.\n\nChapter 2: "No Safe Haven" — coming soon.',scene:'dark',mood:'#636e72',effects:{flags:{chapter1_complete:true,went_solo:true}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]};

fp_arrival:{
  characters:['tyler'],
  text:`The bass hits you before you even reach the front steps. You can feel it in your chest — a deep, rhythmic pulse that makes the windows of the Kappa Sigma house vibrate.

Tyler nudges your arm. "Dude. This is it. Biggest party of the semester." He's already grinning, running a hand through his hair, scanning the crowd like a kid at a carnival.

You take a breath. The night air is warm, carrying the smell of beer, cologne, and freshly cut grass. Through the open front door, you can see a packed hallway — bodies moving, someone holding a speaker above their head, flashes of neon from a blacklight somewhere deeper in the house.

This is your first real college party. Everything that happens tonight starts with what you do next.`,

  text:`You lean against the porch railing, watching the party from outside. Tyler disappeared inside thirty seconds ago. You're alone with the distant bass and the sound of crickets competing with hip-hop.

fp_bp_result:{

  text:`The game is tight. Chad's good — annoyingly good — but you're holding your own. The crowd gets into it, chanting with every shot. You sink two in a row and someone yells your name like you're famous.

  text:`You walk over to Mia with beer pong adrenaline still buzzing through you. She puts her phone down before you even open your mouth.

},
fp_fridge_girl:{characters:['nadia'],text:'She\'s leaning against the fridge, arms crossed, watching the party like a nature documentary. When she sees you looking, she doesn\'t look away.\n\n"Let me guess," she says. "Freshman. First Kappa Sigma party. Probably came with a friend who ditched you for a girl."\n\n"Am I that obvious?"\n\n"I\'m pre-med. I observe things." She extends a hand. "Nadia. I\'m not gonna ask what your major is because that\'s the most boring question on earth. Instead — what\'s the weirdest thing about you? The thing you don\'t tell people at parties."\n\nShe takes a sip of water — not alcohol, water — and waits for your answer with sharp, curious eyes.',scene:'party',mood:'#e17055',effects:{flags:{met_nadia:true}},choices:[{text:'Tell her something genuinely weird about yourself.',next:'fp_nadia_talk',check:{stat:'cha',dc:9},effects:{stats:{cha:1}}},{text:'"I don\'t have a weird thing. I\'m aggressively normal."',next:'fp_nadia_talk'},{text:'"That\'s a big ask from someone I met ten seconds ago."',next:'fp_nadia_talk',effects:{stats:{int:1}}}]},
fp_nadia_talk:{characters:['nadia'],text:'Nadia listens. Really listens — tilting her head, not looking at her phone, not scanning the room. When you finish, she nods.\n\n"See? That\'s way more interesting than \'I\'m a business major.\'" She smiles for the first time. It changes her whole face.\n\nYou talk for twenty minutes. She tells you she\'s from a tiny town nobody\'s heard of, that she hates parties but forces herself to come because "you can\'t study human behavior from your dorm room." She\'s funny in a dry, deadpan way that catches you off guard.\n\n"Okay," she says eventually, checking her phone. "I\'ve hit my social quota for the night. But—" she tears a corner off a napkin and writes her number. "You\'re interesting. Not many people survive my weirdness test. Text me sometime. Not tonight. I\'ll be asleep in twenty minutes."\n\nShe pushes off the fridge, gives you a two-finger salute, and walks toward the door.',scene:'party',mood:'#fdcb6e',effects:{flags:{got_nadia_number:true},relationships:{nadia:3}},choices:[{text:'Follow her. "Hey — wait up. I\'ll walk you."',next:'fp_nadia_walk',effects:{relationships:{nadia:2},stats:{cou:1}}},{text:'Pocket the number. Back to the party.',next:'fp_backyard'},{text:'That was refreshing. Try the dance floor.',next:'fp_dance_floor',check:{stat:'cou',dc:8}},{text:'Head to the bottle spin — the night\'s not over.',next:'fp_bottle_spin'}]},
fp_dance_floor:{
  characters:['zara'],
  text:`The living room has been transformed. Furniture shoved to the walls, a DJ table in the corner pumping out bass-heavy beats. Colored lights spin across the ceiling — someone rigged LED strips everywhere. It's dark except for the lights, and packed.

You feel the music in your bones. Around you, people are dancing — some good, some terrible, all having the time of their lives. Nobody's watching. Nobody's judging. It's just movement and noise and energy.

[COURAGE CHECK PASSED]

Something clicks. You stop thinking and start moving. It's not perfect, but it doesn't need to be. The music takes over. Tyler appears next to you, doing some ridiculous move that makes you both crack up.

Then someone dances into your space — red hair, huge smile, moves like she's performing for a crowd of thousands. "Hey! You're actually good!" she shouts over the music. It's Zara. She grabs your hands and pulls you into a spin.`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{danced:true,met_zara:true},relationships:{zara:2},stats:{cou:1}},
  choices:[
    {text:'Dance with Zara — match her energy.',next:'fp_dance_zara',effects:{relationships:{zara:2}}},
    {text:'Dance with the group — soak in the vibe.',next:'fp_dance_group'},
    {text:'After a few songs, take a breather — head to the couch.',next:'fp_couch'},
    {text:'Drift toward the DJ booth. The setup looks sick.',next:'fp_dj_booth'}
  ]
},
fp_bottle_spin:{
  characters:['mia','zara','chad'],
  text:`The living room circle is ten people strong. Someone's cleared a space on the hardwood floor. A glass bottle sits in the middle, glinting under the string lights.

You recognize some faces: Mia, sitting cross-legged with a nervous smile. Zara, already hyped. Chad, who nods at you — respect or rivalry, hard to tell. Two guys you don't know. Three girls from different groups. And Tyler, who saved you a spot.

"Rules are simple," Zara announces, clearly self-appointed host. "Spin the bottle. Whoever it lands on — you choose: truth, dare, or..." she pauses for effect, "...kiss."

A ripple of nervous laughter goes around the circle. Mia pulls her sleeves over her hands. Chad cracks his knuckles. Tyler elbows you.

"Who's first?" Zara looks around. Her eyes land on you. "New face goes first. That's definitely a rule. Spin."

The bottle is in front of you. Everyone's watching.`,
  scene:'party',mood:'#fd79a8',
  effects:{flags:{bottle_spin:true}},
  choices:[
    {text:'Spin the bottle. Here goes nothing.',next:'fp_spin_result'},
    {text:'"How about you go first, Zara? Show us how it\'s done."',next:'fp_zara_spins',effects:{relationships:{zara:1}},check:{stat:'cha',dc:9}},
    {text:'Spin it with confidence — you just won beer pong, you can handle this.',next:'fp_spin_result',requires:{won_beer_pong:true},effects:{stats:{cou:1}}}
  ]
},
fp_spin_result:{
  characters:['mia'],
  text:`You lean forward and give the bottle a solid spin. It whirls across the hardwood, catching the light — a blur of green glass. The circle holds its breath.

It slows. Passes Chad. Passes one of the guys you don't know. Passes Tyler (who looks relieved). And stops.

Pointing directly at Mia.

Her eyes widen. The circle explodes — oohs, whistles, someone literally screams. Mia's cheeks go pink, but she's smiling. She tucks her hair behind her ear and meets your eyes.

"Truth, dare, or kiss?" Zara asks, practically vibrating with excitement.

The room is watching. Mia is watching. This is one of those moments.`,
  scene:'party',mood:'#fd79a8',
  effects:{relationships:{mia:1}},
  choices:[
    {text:'"Truth. Mia — what\'s your honest first impression of me?"',next:'fp_mia_truth',effects:{relationships:{mia:1}}},
    {text:'"Dare."',next:'fp_dare'},
    {text:'Look at Mia. "...Kiss?"',next:'fp_kiss_mia',check:{stat:'cou',dc:11},effects:{relationships:{mia:3}}},
    {text:'Let Mia choose. "Your call."',next:'fp_mia_chooses',effects:{relationships:{mia:2}}}
  ]
},
fp_mia_truth:{
  characters:['mia'],
  text:`Mia bites her lip, thinking. The circle leans in.

"Okay. Honest first impression..." She looks at you. Really looks at you. "I noticed you in psych class the first week. You were the only person actually writing stuff down. And I thought... he's either really into psychology, or he's really trying. Either way, I liked it."

She pauses. "And tonight — you walked in here and I thought, 'Oh. That's the psych class guy. He cleans up nice.'"

The circle "oohs" again. Tyler is grinning ear to ear. Mia looks embarrassed but not unhappy. You feel warm in a way that has nothing to do with the crowded room.

"Okay, NEXT!" Zara grabs the bottle and spins before the moment gets too heavy. The game continues, but something has shifted between you and Mia. She keeps glancing your way.

Three rounds later, Zara gets dared to dance on the table (she does it immediately). Chad has to text his ex something nice (he looks pained). The energy is high, everyone's laughing.

Then it's your turn again.`,
  scene:'party',mood:'#fd79a8',
  effects:{flags:{mia_confession:true},relationships:{mia:2}},
  choices:[
    {text:'Spin again — feeling lucky.',next:'fp_spin_two'},
    {text:'Slip out of the circle — go find Mia in the kitchen.',next:'fp_after_spin_mia',effects:{relationships:{mia:1}}},
    {text:'Suggest everyone moves to the backyard — switch up the energy.',next:'fp_backyard',effects:{flags:{led_group:true}}}
  ]
},
fp_roof_mia:{
  characters:['mia'],
  text:`Mia leads you through the kitchen, down a hall, up a narrow staircase that smells like old carpet and cologne. The music fades with every step. She pushes open a door at the top — and the night sky opens up.

The roof is a flat section above the garage, surrounded by a low railing. Someone put cheap string lights up here, and there are a few lawn chairs. But the real feature is the view — the campus stretching out below, lit up like a circuit board. The library's clock tower glowing in the distance.

"Told you it was worth it," Mia says, settling into a chair. She pulls her knees up to her chest and looks out over campus.

It's quiet up here. The party is a muffled heartbeat below your feet. Stars overhead, or at least the ones that fight through the light pollution. The air is cool on your skin.

"This is my favorite part of these parties," she says softly. "Finding the quiet spots. Is that lame?"

She's looking at you now, and in the string light glow her eyes are dark and warm and very close.`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{on_roof:true},relationships:{mia:2}},
  choices:[
    {text:'"Not lame at all. This is the best part of my night so far."',next:'fp_roof_deep',effects:{relationships:{mia:2}}},
    {text:'Sit next to her. Don\'t say anything. Just enjoy the silence.',next:'fp_roof_deep',effects:{relationships:{mia:2}},check:{stat:'per',dc:8}},
    {text:'"So tell me something real. Not party small talk."',next:'fp_roof_deep',effects:{relationships:{mia:2}}},
    {text:'Point at the sky. "What constellation is that?" (You have no idea.)',next:'fp_roof_mia_stars',effects:{relationships:{mia:2},stats:{cha:1}}}
  ]
},
fp_roof_deep:{
  characters:['mia'],
  text:`Time does something strange on the roof. Minutes stretch. The party below rises and falls like breathing. You and Mia talk — really talk. Not party talk. Real talk.

She tells you she almost didn't come to college. That her parents wanted her to take over the family restaurant. That psychology is her way of understanding why people do what they do — including herself.

You tell her things you didn't plan to say. The conversation flows like water, finding its own path.

At some point her chair gets closer to yours. Your shoulders are almost touching. She's shivering slightly in the night air.

"I'm glad I came tonight," she says, quiet enough that you have to lean in. "I almost didn't."

She turns her head. You're very close. You can see the string lights reflected in her eyes. The music swells from below — something slow. The moment stretches.`,
  scene:'party',mood:'#6c5ce7',
  effects:{relationships:{mia:3}},
  choices:[
    {text:'Close the distance. Kiss her.',next:'fp_roof_kiss',check:{stat:'cou',dc:9},effects:{relationships:{mia:4}}},
    {text:'Offer her your jacket. The moment doesn\'t need to be rushed.',next:'fp_roof_gentle',effects:{relationships:{mia:3}}},
    {text:'"Want to go back down? I think I hear them starting bottle spin."',next:'fp_bottle_spin',effects:{relationships:{mia:-1}}}
  ]
},
fp_roof_kiss:{
  characters:['mia'],
  text:`You lean in. She meets you halfway.

The kiss is soft. Tentative at first, like a question. Then she smiles against your lips and the answer is yes. Her hand finds the side of your face, cool fingers against warm skin. The string lights blur. The distant bass becomes a heartbeat.

When you pull apart, she's looking at you like you're something she just discovered.

"Okay," she breathes. "That was worth coming to this party for."

You stay on the roof for a while longer. Talking, laughing, sitting so close that your arm is around her shoulders and her head is tilted toward yours. The party rages below, but up here it's just you two and the sky.

Eventually, the music shifts. Someone downstairs is shouting about a midnight toast.

"Should we go back down?" Mia asks. "Or stay up here forever? I'm okay with either."`,
  scene:'party',mood:'#fd79a8',
  effects:{flags:{kissed_mia:true,mia_romance:true},relationships:{mia:4}},
  choices:[
    {text:'"Let\'s go down. But stay with me."',next:'fp_late_night_together',effects:{relationships:{mia:2}}},
    {text:'"Five more minutes up here. Then we rejoin the world."',next:'fp_late_night_together',effects:{relationships:{mia:2}}},
    {text:'"Honestly? I could stay here all night."',next:'fp_ending_roof',effects:{relationships:{mia:3}}}
  ]
},
fp_roof_gentle:{
  characters:['mia'],
  text:`You shrug off your jacket and drape it over her shoulders. She looks surprised, then pulls it tighter around herself.

"Old school," she says with a small smile. "I like it."

The moment settles. Not every connection needs to rush toward something. This one is building slowly, and that's okay. She leans her shoulder against yours — warm where you're touching, cool everywhere else.

You talk for another hour. About everything and nothing. She laughs at your stories. You listen to hers. The party below peaks and starts to wind down, but neither of you move.

"Hey," she says eventually, her voice sleepy and content. "This was really nice. Can I — would it be weird if I asked for your number?"`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{mia_slow_burn:true},relationships:{mia:3}},
  choices:[
    {text:'Give her your number. This is just the beginning.',next:'fp_ending_good',effects:{relationships:{mia:3},flags:{got_mia_number:true}}},
    {text:'"Only if you promise to sit next to me in psych class on Tuesday."',next:'fp_ending_good',effects:{relationships:{mia:4},flags:{got_mia_number:true}}}
  ]
},
fp_backyard:{
  characters:['luna'],
  text:`The backyard is a different world. Cooler, darker, the music muffled by the house. Fairy lights are strung between the fence and a big oak tree. A fire pit crackles in the center of a loose circle of people, their faces warm and orange.

Someone's playing guitar — softly, not performing, just noodling. A couple is sharing a blanket on the grass. Two guys are having an intense conversation about whether aliens exist.

It's the chill zone. The decompression chamber between the chaos inside and the quiet of the rest of campus.

You spot an empty lawn chair by the fire. Near it, Luna is sitting cross-legged on the grass, sketching something in her notebook by firelight.`,
  scene:'party',mood:'#fdcb6e',
  choices:[
    {text:'Sit by Luna. See what she\'s drawing.',next:'fp_luna_art',effects:{relationships:{luna:2}}},
    {text:'Take the chair by the fire. Just chill.',next:'fp_fire_chill'},
    {text:'Join the alien debate — you have opinions.',next:'fp_alien_debate',check:{stat:'int',dc:9}},
    {text:'You overhear two guys at the drinks table talking about Tyler...',next:'fp_loyalty_test',effects:{stats:{per:1}}},
    {text:'Past the fire pit — is that a glow-stick pool?',next:'fp_pool_area'},
    {text:'Behind the oak tree — is that a Polaroid station?',next:'fp_polaroid_corner'}
  ]
},
fp_couch:{
  characters:['tyler'],
  text:`The couch area is a haven of relative calm. A big L-shaped sectional, a coffee table covered in cups, and a group of people playing some kind of card game.

You sink into the cushions. It's comfortable — almost dangerously comfortable after standing around nervously. Tyler drops beside you.

"Dude, Jake's parties are legendary for a reason," he says, gesturing around. "Free food, free drinks, and..." he lowers his voice, "Zara's here. You know Zara, right? Dance team captain? She's like — dude."

He's looking at the dance floor with the expression of a man who has never once successfully talked to his crush.

A girl next to you on the couch turns. "Are you guys freshmen? You look lost. In a cute way." She grins. She has kind eyes and a lacrosse hoodie.`,
  scene:'party',mood:'#e17055',
  effects:{relationships:{tyler:1}},
  choices:[
    {text:'Talk to lacrosse hoodie girl — she seems cool.',next:'fp_couch_talk'},
    {text:'Wing-man Tyler toward Zara. He clearly needs help.',next:'fp_wingman',check:{stat:'cha',dc:10},effects:{relationships:{tyler:3}}},
    {text:'Play the card game — looks like fun.',next:'fp_card_game'},
    {text:'Tyler starts walking toward Zara. This is going to be a disaster.',next:'fp_tyler_zara_wingman'},
    {text:'Settle in. The couch crew\'s debating professors.',next:'fp_couch_midnight'}
  ]
},
fp_late_night_together:{
  characters:['mia'],
  text:`You come back down together. The party has shifted — it's past midnight now. The frantic energy of the early night has softened into something warmer. Fewer people, lower music, longer conversations. Someone put on a playlist of slow songs.

Mia's hand finds yours in the dim hallway. She doesn't let go.

You drift through the remnants of the party together. Share the last slice of pizza. Dance — slow, just swaying, in the corner of the living room where nobody's watching. She rests her head on your shoulder and you can smell her shampoo — something like vanilla.

Tyler gives you a thumbs up from across the room. You give him one back.

"So," Mia says, pulling back to look at you. "Walk me home? My dorm's like ten minutes from here."`,
  scene:'party',mood:'#6c5ce7',
  effects:{relationships:{mia:2}},
  choices:[
    {text:'"Absolutely. Let\'s go."',next:'fp_walk_home_mia',effects:{relationships:{mia:2}}},
    {text:'"Let me say bye to Tyler first, then yes."',next:'fp_walk_home_mia',effects:{relationships:{tyler:1,mia:1}}},
    {text:'"Actually — one more stop first. There\'s a Polaroid station outside."',next:'fp_polaroid_mia',effects:{relationships:{mia:2}}},
    {text:'"The night\'s not over yet. Let\'s find the Polaroid station first."',next:'fp_polaroid_mia',effects:{relationships:{mia:1}}}
  ]
},
fp_walk_home_mia:{
  characters:['mia'],
  text:`The walk is everything.

The campus is quiet at 2 AM. Streetlamps casting pools of yellow light on empty sidewalks. The air is cool and clean after the warmth of the party. Your footsteps echo.

Mia walks close enough that your arms brush. She's wearing your jacket (she never gave it back, and you're not asking).

She tells you about the constellation she can see — Orion, she thinks, or maybe not, she failed astronomy. You point out a shooting star that turns out to be a plane. She pretends it counted anyway.

At her dorm, she stops at the door. Turns to face you. The porch light makes everything golden.

"Tonight was..." she starts, then shakes her head. "I don't have a word for it."

She reaches up and fixes your collar — a small, intimate gesture that says more than words.

"Tuesday? Psych class? Save me a seat?"

---

THE NIGHT ENDS

You walk back to your dorm alone, but you don't feel alone. Your jacket smells like her perfume. Your phone buzzes — a text from an unknown number: "Got home safe. Thanks for the best night. - M"

The semester just got a lot more interesting.`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{ending_mia:true,chapter1_complete:true},relationships:{mia:4}},
  choices:[
    {text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'},
    {text:'But the walk isn\'t over yet...',next:'fp_mia_walk_talk',effects:{relationships:{mia:1}}}
  ]
},
fp_ending_roof:{
  characters:['mia'],
  text:`You stay.

The party winds down below you, but on the roof, time moves differently. Mia falls asleep with her head on your shoulder, your jacket pulled tight around her. The string lights flicker. A shooting star — an actual one this time — streaks across the sky, and you watch it alone because you don't want to wake her.

At some point, you doze off too. When you open your eyes, the sky is turning pink at the edges. Dawn. The campus is silent. Even the music has finally stopped.

Mia stirs, blinks, looks around. Sees the sunrise. Sees you.

"We stayed all night," she says, not a question. Her voice is rough with sleep.

"Yeah."

She smiles — slow, warm, private. A smile just for you. Then she takes your hand and you watch the sunrise together over a campus that doesn't know your story yet.

---

THE NIGHT ENDS

Some nights change everything. This was one of them.`,
  scene:'party',mood:'#fdcb6e',
  effects:{flags:{ending_sunrise:true,chapter1_complete:true},relationships:{mia:5}},
  choices:[
    {text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}
  ]
},
fp_ending_good:{
  characters:['mia','tyler'],
  text:`You exchange numbers. She texts you immediately — a smiley face, nothing else. You text back a smiley face. It's stupid and perfect.

Tyler finds you as you're walking out. "Bro. BROOOO. You got her number?!" He's more excited than you are. "This is the greatest night of all time."

The walk back to your dorm is cool and quiet. The adrenaline fades into something warmer — contentment. You replay the night in your head. The party, the beer pong, the conversations, the moments that felt like they mattered.

Your phone buzzes. Mia: "Hey. Thanks for tonight. First party that didn't suck. See you Tuesday?"

You smile in the dark.

---

THE NIGHT ENDS

First college party: survived. First real connection: made. First time feeling like you belong here: tonight.`,
  scene:'party',mood:'#00b894',
  effects:{flags:{ending_good:true,chapter1_complete:true}},
  choices:[
    {text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'},
    {text:'Wake up the next day. Check your phone.',next:'fp_ending_morning_texts'}
  ]
},
fp_tyler_info:{characters:['tyler'],text:'Tyler leans in conspiratorially. "Okay so — Jake is the host, Kappa Sigma president, nicest dude ever. Chad is the beer pong king, kind of a bro but harmless. Mia — that\'s the girl from your psych class, don\'t think I haven\'t noticed you looking. Zara is the red-haired one on the dance floor, she\'s amazing, don\'t talk to me about it. And Luna — artsy girl, mysterious, I don\'t know her deal but she\'s cute."',scene:'party',mood:'#e17055',effects:{flags:{knows_everyone:true}},choices:[{text:'Go talk to Mia.',next:'fp_meet_mia',check:{stat:'cha',dc:9}},{text:'Hit the dance floor — find Zara.',next:'fp_dance_floor',check:{stat:'cou',dc:8}},{text:'Challenge Chad at beer pong.',next:'fp_beer_pong',check:{stat:'cou',dc:10}}]},
fp_find_tyler:{characters:['tyler'],text:'You weave through the party looking for Tyler. He\'s easy to spot — laughing too loud near the DJ, holding two cups, already in his element.\n\n"There you are! Dude, where\'d you go? Come on, I\'ll introduce you around." He throws an arm around your shoulder and steers you toward the kitchen.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:1}},choices:[{text:'Let Tyler lead the way.',next:'fp_kitchen'},{text:'"Actually — I met someone. Come with me."',next:'fp_backyard',effects:{relationships:{tyler:1}}},{text:'"Is that Zara over there?" Watch Tyler\'s brain short-circuit.',next:'fp_tyler_zara_wingman',effects:{relationships:{tyler:2}}}]},
fp_hallway:{characters:[],text:'The upstairs hallway is dim. Closed doors on both sides — bedrooms, probably. A bathroom with a line. And at the end, a narrow staircase going up with a sign that says "ROOF ACCESS — COOL PEOPLE ONLY."\n\nSomeone stumbles out of the bathroom. Music thumps through the floor. It\'s quieter up here, but you can feel the party vibrating through the walls.\n\nA door to your left is slightly open — warm light and conversation spilling out. Sounds like a smaller gathering inside. Through the crack, you can see bean bags, a lava lamp, and what looks like a very chill vibe.',scene:'party',mood:'#636e72',choices:[{text:'Go up to the roof.',next:'fp_roof_solo'},{text:'Check out the chill room.',next:'fp_chill_room'},{text:'Head back down to the party.',next:'fp_kitchen_chill'},{text:'Look at the photos on the wall. Decades of frat history.',next:'fp_hallway_photos',effects:{stats:{per:1}}},{text:'Sit on the stairs between floors. The acoustics are interesting.',next:'fp_stairwell'},{text:'There\'s a door with a "DO NOT ENTER" sign. Knock.',next:'fp_jake_room',requires:{met_jake:true},effects:{relationships:{jake:1}}},{text:'A balcony door is ajar. Zara\'s silhouette.',next:'fp_zara_balcony',requires:{met_zara:true}}]},
fp_chill_room:{characters:['jake'],text:'You push the door open. It\'s Jake\'s room — or someone\'s room, temporarily converted into the anti-party. A lava lamp casts slow orange blobs on the walls. Four people are scattered across bean bags and the floor: two sharing earbuds and vibing to something, one reading a book (at a party — respect), and Jake himself, sitting on the windowsill with a drink.\n\n"Hey! Welcome to the VIP lounge," Jake says. "No music, no games, no drama. Just people being people."\n\nHe pats the bean bag next to him. "You look like you could use five minutes of not being overstimulated."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:2}},choices:[{text:'Sit down. Five minutes of calm sounds perfect.',next:'fp_jake_talk',effects:{relationships:{jake:1}}},{text:'"Actually, I was heading to the roof."',next:'fp_roof_solo'},{text:'"Nice spot. But I think the party\'s calling me back."',next:'fp_kitchen_chill'}]},
fp_jake_talk:{characters:['jake'],text:'Jake\'s easy to talk to. Not in the overconfident frat-president way you expected — he\'s actually thoughtful. He asks you what you\'re studying, where you\'re from, if you\'re settling in okay.\n\n"Freshmen always have this look," he says. "Like they\'re performing. Trying to be the college version of themselves. Takes about a semester to figure out that nobody cares. Just be yourself. The right people will find you."\n\nHe nods at the party below. "I throw these things because people need a place to let go. But the real connections?" He taps the bean bag. "Always happen in rooms like this."\n\nHe checks his phone. "Oh — Tyler\'s looking for you. Said something about Zara. He seemed panicky."\n\n"Also," Jake leans in, "Mia asked where you went. Just saying."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:2},stats:{int:1}},choices:[{text:'Go find Tyler — he needs you.',next:'fp_tyler_panic',effects:{relationships:{tyler:1}}},{text:'Find Mia — she was looking for you.',next:'fp_mia_looking',effects:{relationships:{mia:1}}},{text:'Stay and keep talking to Jake.',next:'fp_jake_deep',effects:{relationships:{jake:2}}},{text:'"What do you actually think about — when the party\'s quiet?"',next:'fp_jake_philosophy',effects:{relationships:{jake:3}}}]},
fp_tyler_panic:{characters:['tyler'],text:'You find Tyler on the stairs, pacing. He grabs your arm the second he sees you.\n\n"Dude. DUDE. I danced with Zara. Like, actually danced. And she said — she SAID — \'we should hang out sometime.\' What does that MEAN?"\n\n"It means she wants to hang out."\n\n"But is that hang out or HANG OUT? There\'s a difference! A critical difference!" He\'s spiraling. Classic Tyler.\n\n"She gave me her number. Look." He holds up his phone. There it is. Zara, with a red heart emoji she typed in herself.\n\n"I haven\'t texted her yet. What do I say? I\'ve been standing here for ten minutes trying to think of something that isn\'t terrible."',scene:'party',mood:'#00b894',effects:{relationships:{tyler:2}},choices:[{text:'"Just say: Hey, it\'s Tyler. Tonight was fun." Keep it simple.',next:'fp_tyler_texts',effects:{relationships:{tyler:2}}},{text:'"Send her a meme. Something from whatever band you both like."',next:'fp_tyler_texts',effects:{relationships:{tyler:2}},check:{stat:'int',dc:8}},{text:'"You\'re overthinking this. She literally put a heart emoji. She likes you."',next:'fp_tyler_texts',effects:{relationships:{tyler:3}}}]},
fp_tyler_texts:{characters:['tyler'],text:'Tyler types. Deletes. Types again. Deletes. You grab the phone and hit send before he can delete a third time.\n\n"NO!" He snatches it back. Stares at the screen. Three dots appear — Zara\'s typing.\n\nThe reply comes: a laughing emoji, then "took you long enough :)" then "come find me, I\'m by the fire pit."\n\nTyler looks at you like you just solved world hunger. "You\'re the best friend I\'ve ever had. Genuinely. I\'m naming my firstborn after you."\n\nHe practically runs toward the backyard. You stand alone in the hallway, grinning. Your best friend is having the night of his life.\n\nNow — what about yours?',scene:'party',mood:'#00b894',effects:{relationships:{tyler:3,zara:1},flags:{tyler_zara_connected:true}},choices:[{text:'Follow Tyler to the backyard.',next:'fp_backyard'},{text:'Go find Mia.',next:'fp_mia_looking'},{text:'Head to the roof — earn some quiet time.',next:'fp_roof_solo'}]},
fp_mia_looking:{characters:['mia'],text:'You find Mia near the bottom of the stairs. She\'s looking up — right at you. A small smile when your eyes meet.\n\n"There you are. I was wondering if you left."\n\n"Just exploring. Jake has a chill room upstairs."\n\n"Jake\'s chill room is legendary." She falls into step beside you. "So... the party\'s starting to thin out. The good part is starting — when it gets quiet enough to actually talk to someone without screaming."\n\nShe\'s standing close. The hallway is dim, the music softer now — someone switched to a mellower playlist. You can hear crickets through an open window.\n\n"I was hoping I\'d run into you again tonight," she says. And there\'s nothing casual about the way she says it.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{mia_sought_you:true}},choices:[{text:'"I was hoping for the same thing. Roof?"',next:'fp_roof_mia',effects:{relationships:{mia:2},flags:{with_mia:true}}},{text:'"Walk and talk? I haven\'t seen the backyard yet."',next:'fp_backyard_mia',effects:{relationships:{mia:1}}},{text:'"Want to just... stand here for a minute? I like this."',next:'fp_late_night_together',effects:{relationships:{mia:3}}}]},
fp_jake_deep:{characters:['jake'],text:'Jake tells you about why he started throwing parties. "My freshman year, I didn\'t know anyone. Went to one party, stood in a corner for two hours, went home. Worst night of my semester."\n\nHe sips his drink. "So I decided — when I\'m the one with the house, nobody stands in a corner. Everyone gets welcomed. Everyone gets a conversation."\n\nHe looks out the window at the backyard, where people are gathered around the fire. "That\'s the whole thing. It\'s not about the alcohol or the music. It\'s about giving people a place to belong, even for a night."\n\nYou sit with that for a moment. Then Jake checks the time. "It\'s getting late. The party\'ll wind down soon. Go make your night count — whoever you\'re thinking about, go find them."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:3},flags:{jake_wisdom:true},stats:{int:1}},choices:[{text:'Find Mia.',next:'fp_mia_looking',effects:{relationships:{mia:1}}},{text:'Head to the backyard.',next:'fp_backyard'},{text:'Go to the roof.',next:'fp_roof_solo'}]},
fp_roof_solo:{characters:[],text:'The roof is empty. Just you, the string lights, and the view. Campus below, stars above, the party a muffled pulse under your feet.\n\nYou sit in a lawn chair and breathe. It\'s the first quiet moment of the night. Up here, you can think.\n\nThe city lights twinkle in the distance. A plane blinks red-white across the sky. Somewhere below, a girl laughs — bright and unguarded.\n\nAfter a few minutes, the roof door opens. Someone else had the same idea.',scene:'party',mood:'#6c5ce7',effects:{flags:{on_roof:true}},choices:[{text:'Wait to see who it is.',next:'fp_roof_surprise'},{text:'Stay quiet. Hope they don\'t see you.',next:'fp_roof_eavesdrop',effects:{stats:{per:1}}},{text:'Call out before they trip. "Watch the cables."',next:'fp_roof_surprise',effects:{stats:{cha:1}}}]},
fp_roof_surprise:{characters:['luna'],text:'It\'s Luna. She stops when she sees you, then smiles. "Oh — rooftop gang. Mind if I join?"\n\nShe sits cross-legged on the concrete next to your chair, pulls out her sketchbook, and starts drawing the skyline.\n\n"I always end up here at these things," she says. "The party is fun for about an hour, then I need sky."',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:2}},choices:[{text:'"What are you drawing?"',next:'fp_luna_art'},{text:'Just sit together in comfortable silence.',next:'fp_luna_quiet',effects:{relationships:{luna:2}}}]},
fp_luna_art:{characters:['luna'],text:'You lean over to look. She\'s sketching the campus skyline — quick, confident strokes. The library tower, the dorms, the trees. It\'s good. Really good.\n\n"I draw what I see," she says. "Parties, people, places. It\'s how I process things. Some people journal. I sketch."\n\nShe flips back a few pages. A portrait of someone laughing. A crowd scene from what looks like another party. A cat sleeping on a windowsill.\n\n"You\'re talented," you say, and mean it.\n\nShe looks at you with those gold-brown eyes. "Want me to draw you?"',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:2}},choices:[{text:'"Sure. How should I pose?"',next:'fp_luna_draws_you',effects:{relationships:{luna:3}}},{text:'"Only if I get to keep it."',next:'fp_luna_draws_you',effects:{relationships:{luna:3}},check:{stat:'cha',dc:9}}]},
fp_luna_draws_you:{characters:['luna'],text:'Luna sketches quickly, glancing up at you between strokes. "Don\'t move too much. And don\'t make a face — just be normal."\n\n"What does normal look like?"\n\n"Like that. Right there." She smiles and keeps drawing.\n\nFive minutes later, she turns the sketchbook around. It\'s you — but somehow more interesting than you think you look. She captured something in the eyes, the posture, that feels true.\n\n"You can have it," she says, tearing the page out carefully. "Consider it a souvenir of your first real party."\n\nShe writes something in the corner of the page. Her number.',scene:'party',mood:'#fd79a8',effects:{flags:{luna_drew_you:true,got_luna_number:true},relationships:{luna:4}},choices:[{text:'Stay on the roof with Luna and talk until the stars fade.',next:'fp_ending_luna'},{text:'"This is amazing. Want to go downstairs and get a drink?"',next:'fp_kitchen_chill',effects:{relationships:{luna:1}}}]},
fp_luna_quiet:{characters:['luna'],text:'You sit together without talking. It should be awkward but it isn\'t. Luna draws. You watch the campus. The fire pit below glows orange. Someone\'s playing guitar — faint chords drifting up.\n\n"I like that you don\'t need to fill silence," she says after a while. "Most people can\'t handle it."\n\nShe tears a page from her sketchbook and hands it to you. It\'s a quick sketch of the view from the roof, with two small figures sitting side by side.\n\n"For your first party," she says.',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:3},flags:{luna_sketch_gift:true}},choices:[{text:'Stay with Luna.',next:'fp_ending_luna'},{text:'Head back down to the party.',next:'fp_kitchen_chill',effects:{relationships:{luna:-1}}}]},
fp_ending_luna:{characters:['luna'],text:'You and Luna stay on the roof until the party dies below you. She tells you about her art — how she wants to illustrate graphic novels, how she sees stories in everything. You tell her about yourself, and she listens in that way she has — quiet, attentive, like she\'s sketching you with her mind.\n\nAt some point, her head is on your shoulder. At some point, the sky starts turning purple at the edges. At some point, you realize this is the most real conversation you\'ve had since you got to college.\n\n"Hey," she whispers. "The sunrise."\n\nYou watch it together. She takes your hand — her fingers are stained with graphite. It feels like the beginning of something that won\'t fit in a sketchbook.\n\n---\n\nTHE NIGHT ENDS\n\nYou walk home with a drawing in your pocket and a number in your phone. The world looks different in the morning light — like she drew it better than it was.',scene:'party',mood:'#fdcb6e',effects:{flags:{ending_luna:true,chapter1_complete:true},relationships:{luna:5}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]},
fp_celebrate:{characters:['tyler'],text:'You and Tyler ride the high. He buys you a drink (from the free table, but it\'s the thought that counts). People you\'ve never met are congratulating you. For fifteen minutes, you\'re the most popular person at the party.\n\n"Best. Night. Ever." Tyler is beaming. He drags you to the dance floor.',scene:'party',mood:'#00b894',effects:{relationships:{tyler:2}},choices:[{text:'Dance with Tyler — celebrate properly.',next:'fp_dance_floor',check:{stat:'cou',dc:7}},{text:'Use the momentum — go talk to Mia.',next:'fp_meet_mia_confident'},{text:'Take a breather — head to the backyard.',next:'fp_backyard'},{text:'Keep drinking. The night is young and you\'re invincible.',next:'fp_ending_blackout',requires:{drank_punch:true},effects:{stats:{cou:1,int:-3}}},{text:'The celebration fades. Time to check on your people.',next:'fp_celebrate_aftermath'}]},
fp_rematch:{characters:['chad'],text:'Chad grins. "Double or nothing? You\'re on."\n\nThe rematch is brutal. Chad\'s locked in now — no more showboating. Every shot is precise. The crowd picks sides. You trade cups back and forth.\n\nFinal cup again. This time, Chad sinks it first. Clean shot, no rim.\n\n"THAT\'S what I\'m talking about!" He chest-bumps his friend. Then turns to you, hand extended. "Good game though. For real. You\'re alright."\n\nYou lost, but somehow it doesn\'t feel like losing.',scene:'party',mood:'#e17055',effects:{relationships:{chad:2},flags:{lost_rematch:true}},choices:[{text:'Head to the couch — enough competition for now.',next:'fp_couch'},{text:'Find Mia — she was watching earlier.',next:'fp_meet_mia'},{text:'"Alright, show me what else you guys do around here."',next:'fp_chad_hangout',effects:{relationships:{chad:2}}}]},
fp_backyard_mia:{characters:['mia'],text:'"The backyard?" Mia thinks about it for exactly one second. "Yeah, actually. I could use some air."\n\nZara shrugs. "Your loss. Bottle spin waits for no one!" She spins back into the crowd.\n\nThe backyard is quiet by comparison. Fire pit glowing, fairy lights in the trees, a few people scattered around. You find two chairs near the fire.\n\nMia sits and tilts her head back, looking at the stars. "This is more my speed," she says.',scene:'party',mood:'#fdcb6e',effects:{relationships:{mia:2},flags:{backyard_with_mia:true}},choices:[{text:'Talk by the fire — get to know her.',next:'fp_roof_deep',effects:{relationships:{mia:1}}},{text:'"Want to see the roof? Jake apparently has a whole setup up there."',next:'fp_roof_mia',effects:{relationships:{mia:1}}},{text:'Luna walks over with her sketchbook. "Mind if I join?"',next:'fp_mia_luna_meet',requires:{met_luna_first:true}}]},
fp_dance_zara:{characters:['zara'],text:'Zara dances like the music was written for her. She pulls you in, spins away, comes back. It\'s not romantic — it\'s pure energy. She\'s laughing the whole time, making up moves, getting everyone around you to join.\n\n"You\'re fun!" she shouts. "Most new people are so stiff. Like dancing mannequins."\n\nThree songs later, you\'re both breathless. She links her arm through yours and pulls you off the dance floor. "Come on. They\'re doing bottle spin and I need to be there for the drama."',scene:'party',mood:'#6c5ce7',effects:{relationships:{zara:3}},choices:[{text:'Go to bottle spin with Zara.',next:'fp_bottle_spin'},{text:'"I need water first — meet you there."',next:'fp_kitchen_chill'},{text:'"Actually — one more dance. Teach me how you move like that."',next:'fp_zara_dance_deeper',effects:{relationships:{zara:2}}}]},
fp_dance_group:{characters:[],text:'You dance with the group — strangers becoming friends through shared rhythm. Nobody cares how you look. The DJ drops a track everyone knows and the whole room sings along, off-key and perfect.\n\nThis is what college is supposed to feel like.\n\nAfter a few songs, Tyler grabs your arm. "Dude — bottle spin. Living room. Come ON."',scene:'party',mood:'#6c5ce7',effects:{stats:{cou:1}},choices:[{text:'Bottle spin. Let\'s go.',next:'fp_bottle_spin'},{text:'Stay on the dance floor a bit longer.',next:'fp_kitchen_chill'},{text:'Someone shouts "DANCE BATTLE!" A circle forms.',next:'fp_dance_battle'}]},
fp_couch_talk:{characters:['amy'],text:'Her name is Amy. She\'s a sophomore, lacrosse midfielder, from Connecticut. She\'s easy to talk to — the kind of person who asks questions and actually listens to the answers.\n\n"First party? Honestly, they\'re all like this. Loud, chaotic, someone always cries in the bathroom by midnight." She grins. "But they\'re fun if you find the right people."\n\nShe introduces you to the card game group. It\'s some drinking game you\'ve never heard of. They explain the rules terribly. You play anyway.',scene:'party',mood:'#e17055',choices:[{text:'Keep hanging with Amy and the group.',next:'fp_card_game'},{text:'Head to the kitchen — heard something about beer pong.',next:'fp_kitchen'}]},
fp_card_game:{characters:[],text:'The card game makes no sense but everyone\'s laughing too hard to care. You win a round by accident. Amy high-fives you.\n\nThe night flows. People cycle in and out of the group. Tyler shows up, stays for two rounds, gets distracted by Zara walking past and leaves mid-sentence.\n\nIt\'s comfortable here. Low-key. But the party is still going strong around you, and the night is young.',scene:'party',mood:'#e17055',choices:[{text:'Stay here — this is nice.',next:'fp_ending_good'},{text:'Time to explore — hit the kitchen or dance floor.',next:'fp_kitchen_chill'},{text:'Check out the backyard.',next:'fp_backyard'},{text:'Ask Amy about the girl by the fridge — she seemed interesting.',next:'fp_amy_nadia_tip',effects:{relationships:{nadia:1}}}]},
fp_amy_nadia_tip:{characters:['amy'],text:'Amy follows your gaze. "Nadia? She\'s in my bio class. Smartest person I\'ve ever met — like, scary smart. She doesn\'t come to parties much. Pre-med, always studying. But when she does show up..." Amy grins. "She has this thing where she tests people. Asks weird questions. If you pass, she actually talks to you. If you don\'t..." she makes a slicing gesture across her throat.\n\n"She didn\'t scare you off, did she?"\n\n"Not yet."\n\n"Then go. Before she leaves — she never stays past midnight."',scene:'party',mood:'#e17055',effects:{flags:{amy_nadia_tip:true}},choices:[{text:'Head to the kitchen. Find Nadia.',next:'fp_fridge_girl',effects:{stats:{cou:1}}},{text:'Stay with Amy\'s group. Nadia can wait.',next:'fp_fire_chill'}]},
fp_wingman:{characters:['tyler','zara'],text:'You grab Tyler. "Come on. You\'re talking to Zara tonight."\n\n"What?! No. No no no. I can\'t—"\n\n"Yes you can. I\'ll be right there."\n\nYou steer him toward the dance floor. Zara is between songs, getting water. You introduce Tyler like he\'s your coolest friend (he is, technically, your only friend here, but she doesn\'t need to know that).\n\nTyler freezes for exactly two seconds, then something clicks and he starts talking. About music. Turns out Zara loves the same obscure band he does. They\'re off and running.\n\nZara grabs his hand and pulls him onto the dance floor. Tyler looks back at you with an expression of pure gratitude and terror.\n\nYou did a good thing.',scene:'party',mood:'#00b894',effects:{relationships:{tyler:3,zara:1},flags:{wingman:true}},choices:[{text:'Head to the kitchen — your work here is done.',next:'fp_kitchen'},{text:'Find your own adventure — check the backyard.',next:'fp_backyard'},{text:'Wander upstairs.',next:'fp_hallway'}]},
fp_fire_chill:{characters:[],text:'You settle into the lawn chair. The fire crackles. Someone passes you a marshmallow on a stick — you don\'t know who, but you accept it.\n\nThe backyard crew is different from the house crowd. Mellower. A girl is showing someone constellations. Two guys are planning a road trip. The guitar player knows exactly three songs but plays them really well.\n\nYou roast your marshmallow perfectly. Small victory.\n\nThe night could end here and it would still be good.',scene:'party',mood:'#fdcb6e',choices:[{text:'Stay by the fire. Let the night wind down.',next:'fp_ending_good'},{text:'Go back inside — the night\'s not over yet.',next:'fp_kitchen_chill'},{text:'A crash from inside breaks the calm. Something\'s going on.',next:'fp_party_drama'},{text:'Head to the roof alone. End the night on your own terms.',next:'fp_ending_solo',effects:{stats:{int:1}}},{text:'Tyler sits down next to you. He looks like he wants to say something.',next:'fp_tyler_confides',effects:{relationships:{tyler:2}}}]},
fp_alien_debate:{characters:[],text:'You drop into the alien conversation like you\'ve been there the whole time.\n\n"I\'m just saying — the universe is too big for us to be alone," says the tall one.\n"That\'s literally just the Drake equation and it proves nothing," says the short one.\n"Okay but what about the Wow! signal—"\n"You can\'t base an argument on ONE signal from 1977—"\n\n[INTELLIGENCE CHECK PASSED]\n\nYou bring up the Fermi paradox. Both guys turn to you like you just spoke ancient Greek. "FINALLY someone who actually knows what they\'re talking about!"\n\nYou\'re in. The debate rages for twenty minutes. People gather to listen. You hold your own.\n\nLuna, sketching nearby, looks up and catches your eye. She mouths "nerd" with a smile.',scene:'party',mood:'#fdcb6e',effects:{relationships:{luna:1},stats:{int:1}},choices:[{text:'Go talk to Luna.',next:'fp_luna_art',effects:{relationships:{luna:1}}},{text:'Stay in the debate — this is actually fun.',next:'fp_fire_chill'},{text:'Notice a girl by the back door watching the debate. She looks intrigued.',next:'fp_fridge_girl',effects:{stats:{int:1}}}]},
fp_zara_spins:{characters:['zara'],text:'"Oh you want ME to go first? Okay!" Zara grabs the bottle without hesitation and gives it a dramatic spin, blowing on it like dice.\n\nIt lands on Tyler.\n\nTyler\'s face goes through five emotions in two seconds. The circle loses it. Zara grins at him. "Truth, dare, or kiss, tall guy?"\n\nTyler\'s mouth opens and closes. You\'ve never seen him this flustered.\n\n"...Dare?" he manages.\n\n"I dare you to dance with me. Right now. One full song."\n\nShe pulls him up. He goes willingly. The circle cheers. The DJ, sensing the moment, drops something slow. Tyler puts his hands on her waist like he\'s handling fine china. Zara rolls her eyes fondly and pulls him closer.\n\nYour best friend is having his moment. Your turn is next.',scene:'party',mood:'#fd79a8',effects:{relationships:{tyler:2,zara:1},flags:{tyler_zara_moment:true}},choices:[{text:'Spin the bottle. Your turn.',next:'fp_spin_result'},{text:'Slip out while everyone\'s watching Tyler — explore the party.',next:'fp_kitchen_chill'}]},
fp_kiss_mia:{characters:['mia'],text:'The room goes quiet. Mia\'s eyes widen, then soften. She looks at you for a long moment — reading your face, deciding.\n\nThen she leans forward.\n\nThe kiss is brief and electric. Her lips taste like fruit punch. The circle erupts — cheering, stamping feet, someone throws a cup in the air. Zara is screaming.\n\nWhen you pull apart, Mia\'s cheeks are pink but she\'s smiling. She tucks her hair behind her ear. "Not bad, psych class," she says quietly, just for you.\n\nThe game continues but neither of you are paying attention to it anymore.',scene:'party',mood:'#fd79a8',effects:{flags:{kissed_mia_spin:true,mia_romance:true},relationships:{mia:4}},choices:[{text:'After the game, ask Mia to go somewhere quieter.',next:'fp_roof_mia',effects:{relationships:{mia:2},flags:{with_mia:true}}},{text:'Stay in the circle — ride the energy.',next:'fp_mia_truth'}]},
fp_mia_chooses:{characters:['mia'],text:'Mia meets your eyes. The room waits.\n\n"Truth," she says, and you feel the collective disappointment ripple around the circle.\n\nZara groans. "BORING. Fine — truth. Ask her something good at least."\n\nMia looks at you expectantly. The question is yours.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:1}},choices:[{text:'"Have you ever had a crush on someone in this room?"',next:'fp_mia_truth',effects:{relationships:{mia:1}}},{text:'"What\'s the most spontaneous thing you\'ve ever done?"',next:'fp_mia_truth',effects:{relationships:{mia:1}}}]},
fp_dare:{characters:['zara'],text:'Zara\'s eyes light up. "DARE. I love dare. Okay..." She thinks. The circle watches.\n\n"I dare you to go up to the DJ and request the most embarrassing song you can think of. And you have to dance to it. The whole song."\n\nThe circle laughs. You stand up. Time to commit.',scene:'party',mood:'#fdcb6e',effects:{stats:{cou:1}},choices:[{text:'Do the dare. Own it completely.',next:'fp_dare_done',check:{stat:'cou',dc:8}},{text:'Pick the most ridiculous song possible.',next:'fp_dare_done',check:{stat:'cha',dc:9}}]},
fp_dare_done:{characters:[],text:'You walk up to the DJ, whisper your request, and wait.\n\nThe opening notes hit and the ENTIRE party reacts. People are dying. You hit the dance floor and give it everything — every terrible move, every dramatic gesture, full commitment.\n\nBy the end of the song, people are dancing WITH you. It went from embarrassing to iconic. You get a standing ovation from the bottle spin circle when you return.\n\n"LEGEND," Zara declares. Even Chad is clapping.\n\nMia is watching you with a look that says she\'s seeing you differently now.',scene:'party',mood:'#00b894',effects:{relationships:{mia:2,zara:2,chad:1},flags:{dare_legend:true},stats:{cha:1,cou:1}},choices:[{text:'Sit back down, riding the high.',next:'fp_mia_truth'},{text:'Walk over to Mia with that confidence.',next:'fp_meet_mia_confident'}]},
fp_spin_two:{characters:['zara'],text:'Second spin. The bottle whirls again.\n\nThis time it stops on... Zara.\n\nShe throws her hands up. "YESSSS. Okay. I pick dare. Always dare. Hit me."\n\nThe circle feeds you suggestions but it\'s your call.',scene:'party',mood:'#fd79a8',choices:[{text:'"I dare you to text your crush right now."',next:'fp_after_spin_group',effects:{relationships:{zara:1}}},{text:'"I dare you to do a cartwheel. Right here."',next:'fp_after_spin_group',effects:{relationships:{zara:2}}},{text:'"Truth instead — who here do you think is the cutest?"',next:'fp_after_spin_group',effects:{relationships:{zara:1}}}]},
fp_after_spin_group:{characters:[],text:'The game winds down after another few rounds. People drift away — some to the dance floor, some to the kitchen, some outside. The intimate circle energy fades into the wider party.\n\nIt\'s getting late. The party has peaked and is settling into its final form — softer music, fewer people, longer conversations. The best part, or the worst part, depending on who you ask.',scene:'party',mood:'#636e72',choices:[{text:'Find Mia.',next:'fp_after_spin_mia'},{text:'Head to the backyard for some air.',next:'fp_backyard'},{text:'Grab water in the kitchen. Wind down.',next:'fp_kitchen_late'},{text:'Find Tyler — walk home together. Bros before everything.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:2}}}]},
fp_after_spin_mia:{characters:['mia'],text:'You find Mia in the kitchen, refilling her cup. She sees you and her face lights up — subtle, but you catch it.\n\n"Hey. Spin the bottle was fun." She pauses. "That first spin though... my heart actually stopped for a second."\n\nShe\'s being more open now. The party stripped away the careful distance she keeps in class. Here, at 1 AM, with the party winding down, she\'s just Mia.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:2}},choices:[{text:'"Want to go somewhere quieter? Jake has a roof setup."',next:'fp_roof_mia',effects:{relationships:{mia:2},flags:{with_mia:true}}},{text:'"Walk you home? It\'s getting late."',next:'fp_walk_home_mia',effects:{relationships:{mia:2}}},{text:'"This was fun. See you in class Tuesday?"',next:'fp_ending_good',effects:{relationships:{mia:1}}}]},
fp_roof_luna:{characters:['luna'],text:'Luna grabs your hand and leads you through the party like she owns the place — weaving past the kitchen, up the back stairs, past a couple making out in the hallway, and through a door marked "ROOF ACCESS — COOL PEOPLE ONLY."\n\nThe roof is magic. String lights zigzag overhead, two beat-up lawn chairs face the campus skyline, and someone left a bluetooth speaker playing lo-fi. The bass from downstairs is just a heartbeat through the floor.\n\nLuna drops into a chair and kicks her feet up on the railing. "Best seat in the house. I found this spot at Jake\'s last party and I\'ve been gatekeeping it ever since."\n\nThe view is ridiculous — the whole campus spread out below, the library tower lit up, distant headlights on the highway. The air is cooler up here, clean.\n\nLuna pulls out her sketchbook. "You can talk or not. I\'m just going to draw for a bit. Sometimes the best company is someone who doesn\'t need to fill every second with noise."',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:2},flags:{on_roof:true,with_luna:true}},choices:[{text:'Sit in comfortable silence and watch the campus.',next:'fp_luna_quiet',effects:{relationships:{luna:2}}},{text:'"What are you drawing?"',next:'fp_luna_art',effects:{relationships:{luna:1}}},{text:'"Tell me something real. Something you don\'t tell people at parties."',next:'fp_roof_luna_real',effects:{relationships:{luna:2}},check:{stat:'cha',dc:10}}]},
fp_roof_luna_real:{characters:['luna'],text:'Luna stops drawing. She looks at you — really looks, like she\'s deciding whether you mean it.\n\n"Okay." She closes the sketchbook. "Something real."\n\nShe pulls her knees up, wraps her arms around them. The string lights catch the silver in her rings.\n\n"I almost dropped out last semester. Like, packed-my-bags almost. I couldn\'t draw anymore — total block. Every line felt wrong. I sat in my dorm for three weeks doing nothing."\n\nShe\'s quiet for a moment. A breeze moves her hair.\n\n"My roommate dragged me to a party. This house, actually. And I ended up on this exact roof, sketching the skyline, and it just... came back. Like it was waiting for me up here."\n\nShe looks at you. "So now I come back. Every time. Superstitious, maybe. But it works."\n\n"That\'s why you know all the good spots," you say.\n\nShe smiles — smaller than her other smiles, but more real. "Yeah. That\'s why."',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:3},flags:{luna_opened_up:true}},choices:[{text:'Share something real back — she earned it.',next:'fp_roof_luna_share',effects:{relationships:{luna:3}},check:{stat:'cha',dc:8}},{text:'"Thank you for telling me that. I mean it."',next:'fp_luna_draws_you',effects:{relationships:{luna:2}}},{text:'Move closer. Let the moment breathe.',next:'fp_roof_luna_close',effects:{relationships:{luna:2}}}]},
fp_roof_luna_share:{characters:['luna'],text:'You tell her about yourself. The real stuff — not the highlight reel you give people at orientation. She listens the way she draws: carefully, catching details other people miss.\n\nWhen you finish, she\'s quiet for a moment. Then she reaches over and squeezes your hand. Brief, warm, deliberate.\n\n"I\'m glad you came to this party," she says. "And I\'m glad you picked the roof."\n\nThe lo-fi speaker shifts to something with piano. The campus lights blur a little — or maybe that\'s just the moment.\n\n"Can I draw you?" she asks. "Not the party version of you. The version I just met."',scene:'party',mood:'#fd79a8',effects:{relationships:{luna:3},flags:{shared_real:true}},choices:[{text:'"Yeah. Draw the real version."',next:'fp_luna_draws_you',effects:{relationships:{luna:3}}},{text:'Kiss her instead.',next:'fp_roof_luna_kiss',effects:{relationships:{luna:4}},check:{stat:'cou',dc:11}}]},
