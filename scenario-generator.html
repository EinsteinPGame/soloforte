fp_roof_luna_close:{characters:['luna'],text:'You move your chair closer. Close enough that your shoulders almost touch. Luna doesn\'t move away.\n\nShe opens her sketchbook again but doesn\'t draw. Just holds it. The lo-fi plays something soft with rain sounds mixed in.\n\n"You\'re different," she says, not looking at you. "From the people down there. They\'re performing. You\'re just... here."\n\n"So are you."\n\nShe turns her head. You\'re close enough to see the flecks of gold in her brown eyes. The crescent moon tattoo on her wrist catches the string light.\n\n"Draw me?" you ask.\n\nShe smiles. "I already started."',scene:'party',mood:'#fd79a8',effects:{relationships:{luna:3}},choices:[{text:'Let her draw you.',next:'fp_luna_draws_you',effects:{relationships:{luna:2}}},{text:'Lean in.',next:'fp_roof_luna_kiss',effects:{relationships:{luna:3}},check:{stat:'cou',dc:10}}]},
fp_roof_luna_kiss:{characters:['luna'],text:'You lean in. She meets you halfway.\n\nThe kiss is soft. Unhurried. She tastes like the drink she was holding earlier — something citrusy. Her hand comes up to rest on the side of your face, fingers cool from the night air.\n\nWhen you pull apart, she\'s smiling with her eyes closed. "I knew you were going to do that," she says.\n\n"Was it obvious?"\n\n"The whole time." She opens her eyes. Gold-brown, catching starlight. "I was just waiting for you to figure it out."\n\nShe leans her head on your shoulder. Her hair smells like paint and jasmine. The campus spreads out below you, beautiful and indifferent, and up here on the roof of a frat house at 1 AM, everything feels exactly right.\n\n"Stay up here with me?" she asks. "Until sunrise?"',scene:'party',mood:'#fd79a8',effects:{flags:{kissed_luna:true,luna_romance:true},relationships:{luna:5}},choices:[{text:'"I\'m not going anywhere."',next:'fp_ending_luna',effects:{relationships:{luna:3}}},{text:'"Only if you draw the sunrise when it comes."',next:'fp_ending_luna',effects:{relationships:{luna:3},flags:{sunrise_drawing:true}}}]},
fp_luna_tour:{characters:['luna'],text:'Luna takes you on the unofficial tour. She knows every corner — the pantry where Jake hides the good snacks ("don\'t tell anyone"), the basement that nobody goes to ("it\'s weirdly peaceful"), and the spot in the backyard where you can hear the fountain from campus.\n\nShe talks about art, about how she sees parties as living paintings. She points out moments — "See that guy proposing a toast? That\'s a Caravaggio." You don\'t fully get it but you love how her mind works.\n\nThe tour ends on the roof.',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:3}},choices:[{text:'Stay on the roof with Luna.',next:'fp_luna_quiet',effects:{relationships:{luna:2}}},{text:'"This tour was incredible. Draw me?"',next:'fp_luna_draws_you',effects:{relationships:{luna:2}}}]},

// === NADIA DEEP PATH ===
fp_nadia_walk:{characters:['nadia'],text:'You catch up to Nadia at the door. She turns, surprised. "Following me? Bold move."\n\n"You said you\'re leaving. I figured I\'d walk you. It\'s late."\n\nShe studies you for a second — that pre-med assessment again. Whatever she sees, it passes. "Fine. But I walk fast and I don\'t do small talk."\n\nYou step into the night together. The campus is quiet. Street lamps cast pools of orange light on the sidewalk. Music fades behind you until it\'s just crickets and footsteps.\n\n"So," she says. "Since you passed the weirdness test. Here\'s level two: what scares you? Not spiders or heights. Real fear. The kind that keeps you up."',scene:'party',mood:'#636e72',effects:{relationships:{nadia:2},flags:{walking_nadia:true}},choices:[{text:'Tell her the truth — that you\'re afraid of being forgettable.',next:'fp_nadia_real',effects:{stats:{int:1},relationships:{nadia:3}}},{text:'"That I picked the wrong path and won\'t realize until it\'s too late."',next:'fp_nadia_real',effects:{stats:{int:1},relationships:{nadia:2}}},{text:'Deflect with humor. "Right now? That this is a test and I\'m failing."',next:'fp_nadia_deflect',effects:{stats:{cha:1}}}]},
fp_nadia_real:{characters:['nadia'],text:'Nadia doesn\'t respond right away. She just walks, thinking. The silence is different from most silences — it\'s not empty, it\'s full. She\'s processing.\n\n"Mine is mediocrity," she says finally. "Not failing — that at least means you tried something hard. Mediocrity. Being fine. Having a fine career and a fine apartment and a fine life. I\'d rather crash and burn doing something extraordinary than coast through something forgettable."\n\nShe kicks a pebble. It skips three times.\n\n"You know what\'s weird? I\'ve been at this school three months and you\'re the first person I\'ve said that to. Including my roommate." She looks at you sideways. "Don\'t make it weird."\n\nYou\'ve reached a fork in the path — left toward the dorms, right toward the 24-hour coffee shop that always has that weird jazz playing.',scene:'party',mood:'#6c5ce7',effects:{relationships:{nadia:3}},choices:[{text:'"Coffee? I know a place that\'s open." Point toward the shop.',next:'fp_nadia_coffee',effects:{relationships:{nadia:2},flags:{nadia_coffee:true}}},{text:'Walk her to her dorm. Some conversations are perfect at this length.',next:'fp_nadia_goodbye',effects:{relationships:{nadia:2}}},{text:'"It\'s not weird. It\'s honest. I respect that about you."',next:'fp_nadia_honest',effects:{relationships:{nadia:3},stats:{cha:1}}}]},
fp_nadia_deflect:{characters:['nadia'],text:'She snorts. "It\'s always a test. Life is a test. But you\'re doing okay so far — B plus."\n\n"Only B plus?"\n\n"A minus requires vulnerability. You\'re funny but you\'re hiding behind it." She says it matter-of-factly, like diagnosing a condition. "It\'s fine. Most people do. The interesting ones eventually stop."\n\nYou walk in silence for a bit. She\'s right, and you both know it.\n\n"I\'ll give you one more chance," she says. "Coffee shop\'s around the corner. Open 24 hours. Terrible jazz but decent espresso. You can try for that A minus."',scene:'party',mood:'#636e72',effects:{relationships:{nadia:1}},choices:[{text:'Go for coffee. She deserves the real version of you.',next:'fp_nadia_coffee',effects:{relationships:{nadia:2},flags:{nadia_coffee:true}}},{text:'Walk her home instead. "Rain check on the A minus."',next:'fp_nadia_goodbye',effects:{relationships:{nadia:1}}}]},
fp_nadia_coffee:{characters:['nadia'],text:'The coffee shop is exactly as described — terrible jazz, decent espresso, and a barista who looks like he hasn\'t slept since 2019. You grab a corner booth.\n\nNadia orders a double espresso at 1 AM like a sociopath. You get the same because you\'re trying to keep up.\n\nShe pulls out a notebook — not a phone, an actual paper notebook — and starts writing. "Sorry, I just — I had a thought. Give me thirty seconds."\n\nYou watch her write. Her handwriting is precise, almost architectural. When she finishes, she looks up.\n\n"Okay. Here\'s what I think about you." She flips the notebook around. She\'s written three words: CURIOUS. GUARDED. KIND.\n\n"I profile people. Force of habit. Pre-med thing." She shrugs. "Disagree with any of them?"',scene:'party',mood:'#fdcb6e',effects:{relationships:{nadia:3},stats:{int:1}},choices:[{text:'"Guarded. Yeah, maybe. Working on it." Let the walls down a little.',next:'fp_nadia_walls_down',effects:{relationships:{nadia:4},stats:{cha:1}}},{text:'"Kind? That\'s generous. You barely know me."',next:'fp_nadia_walls_down',effects:{relationships:{nadia:2}}},{text:'Take the notebook and write three words about HER.',next:'fp_nadia_profile',effects:{relationships:{nadia:3},stats:{int:1}},check:{stat:'int',dc:9}}]},
fp_nadia_walls_down:{characters:['nadia'],text:'Something shifts. The conversation goes deeper — past the witty deflections and into the real stuff. She tells you about growing up in a town where ambition was suspicious. About her mom, who wanted her to stay close. About the day she got her acceptance letter and cried in her car for an hour.\n\n"Not from happiness," she clarifies. "From guilt. Because leaving felt like betraying everyone who stayed."\n\nThe espresso grows cold. The jazz loops. The barista changes shifts and the new one doesn\'t even notice you.\n\nAt some point, your knees are touching under the table and neither of you moves away.\n\n"It\'s almost 3 AM," she says, checking her phone for the first time all night. "I have a 9 AM lab." But she doesn\'t move.',scene:'party',mood:'#fd79a8',effects:{relationships:{nadia:4},flags:{nadia_deep_talk:true}},choices:[{text:'"Stay five more minutes. The lab can wait."',next:'fp_ending_nadia',effects:{relationships:{nadia:3}}},{text:'Walk her home. This night doesn\'t need a grand gesture to be perfect.',next:'fp_ending_nadia_walk',effects:{relationships:{nadia:3}}},{text:'"Why pre-med? The real reason — not the resume answer."',next:'fp_nadia_study',effects:{relationships:{nadia:3},stats:{per:1}}}]},
fp_nadia_profile:{characters:['nadia'],text:'You take the pen. Think. Write three words and turn the notebook back.\n\nShe reads them. Her expression changes — the armor cracks, just for a second. Whatever you wrote, it landed.\n\n"Huh," she says quietly. Then louder: "Okay. A minus. Possibly A."\n\nShe doesn\'t take the notebook back right away. She reads the words again.\n\nThe conversation after that is different. Real. She stops testing you and starts talking to you — about her research, her fears, the paper she\'s writing about empathy in clinical settings. You talk until the barista pointedly starts mopping around your table.\n\n"We should go," she says. But she\'s smiling. That rare, face-changing smile.',scene:'party',mood:'#fd79a8',effects:{relationships:{nadia:5},stats:{int:1},flags:{nadia_profiled:true}},choices:[{text:'Walk her home under the street lamps.',next:'fp_ending_nadia_walk',effects:{relationships:{nadia:3}}},{text:'"One more espresso. I want to hear about that paper."',next:'fp_ending_nadia',effects:{relationships:{nadia:3}}}]},
fp_nadia_honest:{characters:['nadia'],text:'"I respect that about you." The words hang there — simple, direct.\n\nNadia stops walking. Turns to face you fully. The street lamp catches her eyes and you realize they\'re dark green, not brown like you thought.\n\n"You know what? Upgraded to A minus." She holds out her hand — not to shake, but palm up, offering. "Coffee. Now. Before I remember I\'m supposed to be antisocial."\n\nYou take her hand. It\'s warm. Her fingers close around yours, firm and sure, like she makes decisions and doesn\'t second-guess them.',scene:'party',mood:'#fd79a8',effects:{relationships:{nadia:4}},choices:[{text:'Coffee shop. This night just got a second act.',next:'fp_nadia_coffee',effects:{relationships:{nadia:2}}},{text:'"Actually — forget coffee. Show me the stars."',next:'fp_nadia_stars',effects:{relationships:{nadia:3}}},{text:'"Antisocial is underrated. I like it."',next:'fp_ending_nadia_walk',effects:{relationships:{nadia:2}}}]},
fp_nadia_goodbye:{characters:['nadia'],text:'You walk Nadia to her dorm. She stops at the entrance, keys in hand, and turns around.\n\n"Tonight was... not terrible," she says. Coming from her, it\'s a rave review.\n\n"High praise."\n\n"Don\'t let it go to your head." She opens the door, pauses. "That number on the napkin? Use it. But not before noon. I\'m not a morning person."\n\nShe disappears inside. You stand there for a moment, the napkin in your pocket feeling heavier than paper should.\n\nThe walk back to your dorm is quiet. The party is a distant memory — a thumping bass line that faded into crickets and coffee and a girl who sees through people like X-rays.',scene:'party',mood:'#6c5ce7',effects:{flags:{ending_nadia_gentle:true,chapter1_complete:true},relationships:{nadia:3}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]},
fp_ending_nadia:{characters:['nadia'],text:'Five minutes turns into thirty. Thirty turns into the barista putting chairs up on tables around you. You finally leave when the lights flicker — the universal sign for "get out."\n\nOutside, the campus is ghost-quiet. 3:47 AM. The air is cold and clean.\n\nNadia shivers. You offer your jacket. She takes it without protest — the first time tonight she\'s accepted something without a sarcastic comment.\n\nAt her dorm, she turns. "I don\'t do this. Talk to strangers. Stay out late. Any of it."\n\n"I know."\n\n"Good." She reaches up and fixes your collar — a gesture that feels practiced, like she\'s done it in her head before doing it for real. "Text me. Before noon is acceptable. I lied earlier."\n\nShe starts to go inside, then turns back. Stands on her toes. Kisses your cheek — quick, precise, deliberate. Like everything she does.\n\n"A plus," she whispers. Then she\'s gone.\n\n---\n\nTHE NIGHT ENDS\n\nYou walk home with cold coffee in your veins and a napkin number in your pocket. You text her at 3:52 AM: "Made it home. Tonight was not terrible."\n\nHer reply comes in four seconds: "Agreed. Now go to sleep. Some of us have labs."',scene:'party',mood:'#fdcb6e',effects:{flags:{ending_nadia:true,chapter1_complete:true},relationships:{nadia:5}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]},
fp_ending_nadia_walk:{characters:['nadia'],text:'You walk her home. The streets are empty — just you two and the street lamps and the sound of your footsteps falling into sync.\n\nShe talks about constellations. Not in a performative way — she actually knows them. Points out Orion, Cassiopeia, something she calls "the fake Big Dipper" which you\'re pretty sure isn\'t a real thing.\n\n"It\'s not," she admits. "I made it up freshman year. But I\'ve been calling it that so long it\'s real to me now."\n\nAt her dorm, she leans against the wall. "Level three of the weirdness test: do something unexpected. Right now."\n\nYou think about it. Then you take the napkin from your pocket — the one with her number — and write your number on the other side. Hand it back.\n\n"Now we both have something to lose," you say.\n\nShe looks at the napkin. Both numbers, both sides. She folds it carefully, puts it in her pocket.\n\n"A plus," she says. Quiet. Certain.\n\n---\n\nTHE NIGHT ENDS\n\nThe walk home is cold but you barely feel it. You\'re replaying every word, every look, every time she let the armor slip. Some people are puzzles. Nadia is a puzzle that wants to be solved — she\'s just making sure you\'re worth the answer.',scene:'party',mood:'#fdcb6e',effects:{flags:{ending_nadia_walk:true,chapter1_complete:true},relationships:{nadia:5}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]},

// === CHAD BRO PATH ===
fp_chad_hangout:{characters:['chad'],text:'Chad throws an arm around your shoulder like you\'ve been friends for years. "You\'re alright, New Kid. Most freshmen are scared of me. Which is fair — I\'m very intimidating."\n\nHe flexes. He is not particularly intimidating.\n\n"Come on, the boys are doing something stupid in the backyard. You\'ll love it." He steers you outside where a group of guys have set up an obstacle course made of lawn chairs, pool noodles, and what appears to be a stolen traffic cone.\n\n"The Kappa Gauntlet," Chad announces proudly. "Fastest time gets their name on the Wall of Legends." He points at a whiteboard nailed to the fence with exactly three names on it — all Chad.',scene:'party',mood:'#00b894',effects:{relationships:{chad:2},flags:{met_chad_properly:true}},choices:[{text:'Run the Gauntlet. Full send.',next:'fp_gauntlet',effects:{stats:{cou:1}},check:{stat:'cou',dc:9}},{text:'"I\'ll time you first. Show me how it\'s done."',next:'fp_gauntlet_watch',effects:{relationships:{chad:1}}},{text:'"I\'m more of a spectator. Got a beer?"',next:'fp_backyard',effects:{relationships:{chad:-1}}}]},
fp_gauntlet:{characters:['chad'],text:'You run the Gauntlet. Hurdle the first chair — clean. Duck under the pool noodle arch — nailed it. Sprint around the traffic cone, slide under the table, and finish by catching a cup Chad throws at you.\n\nThe guys erupt. Chad checks his phone stopwatch. "Fourteen point three seconds. DUDE. That\'s second place! I\'m impressed and also threatened."\n\nHe writes your name on the whiteboard. Below all three of his.\n\n"You know what this means?" He\'s grinning. "You\'re officially a Kappa Sigma honorary. That comes with privileges — unlimited access to the snack pantry, permanent invite to Thursday game nights, and..." he leans in conspiratorially, "I\'ll introduce you to literally anyone at this party. Name someone."',scene:'party',mood:'#00b894',effects:{relationships:{chad:3},stats:{cou:1},flags:{gauntlet_complete:true}},choices:[{text:'"That girl by the fridge — Nadia. She seems interesting."',next:'fp_fridge_girl',effects:{relationships:{chad:1}}},{text:'"I keep hearing about Mia. What\'s her deal?"',next:'fp_chad_mia_intel',effects:{relationships:{chad:1}}},{text:'"Nobody. Let\'s just hang. You guys are fun."',next:'fp_fire_chill',effects:{relationships:{chad:3}}}]},
fp_gauntlet_watch:{characters:['chad'],text:'Chad takes his mark. "Okay — this is the championship form. Watch and learn."\n\nHe launches. Clips the first chair, tangles in the pool noodles, nearly faceplants on the table slide, and fumbles the cup catch. His time: twenty-two seconds.\n\n"THAT WAS RIGGED," he shouts. "The pool noodles moved! Someone moved the pool noodles!"\n\nNobody moved the pool noodles.\n\n"Your turn. You literally cannot do worse." He\'s laughing so hard he can barely hold the stopwatch.',scene:'party',mood:'#00b894',effects:{relationships:{chad:2}},choices:[{text:'Run the Gauntlet. Beat his time easily.',next:'fp_gauntlet',effects:{stats:{cou:1}},check:{stat:'cou',dc:8}},{text:'Intentionally tie his time. Bros don\'t embarrass bros.',next:'fp_fire_chill',effects:{relationships:{chad:4},stats:{cha:1}}}]},
fp_chad_mia_intel:{characters:['chad','mia'],text:'Chad\'s face gets serious — as serious as Chad gets, which is like a golden retriever trying to look stern.\n\n"Mia? Good pick. She\'s a sophomore, psych major, crazy smart. She seems quiet but she\'s got opinions about everything. She\'s also —" he lowers his voice, "— been looking over here like three times in the last ten minutes."\n\nHe elbows you. "I can set it up. Walk over there with me — I\'ll do the intro, you do the rest. It\'s all about the wingman approach. Trust me, I\'ve studied this."\n\n"Have you ever actually set anyone up successfully?"\n\n"Technically no. But I\'ve watched a lot of YouTube. Same thing."',scene:'party',mood:'#e17055',effects:{relationships:{chad:1}},choices:[{text:'Let Chad be your wingman. What\'s the worst that could happen?',next:'fp_wingman',effects:{relationships:{chad:2}}},{text:'Go talk to Mia yourself. You don\'t need a wingman.',next:'fp_meet_mia_confident',effects:{stats:{cou:1}}}]},

// === LATE PARTY DRAMA ===
fp_party_drama:{characters:['chad'],text:'A crash from inside the house — glass breaking, raised voices. The music keeps going but everyone outside turns to look.\n\nChad stands up. "Not again." He jogs toward the back door.\n\nThrough the window, you can see two guys in each other\'s faces. One is tall, varsity jacket — you don\'t recognize him. The other is some freshman who looks terrified but won\'t back down. Something about a spilled drink, but it\'s clearly not about the drink.\n\nJake appears, hands up, trying to de-escalate. But Varsity Jacket isn\'t listening. He shoves the freshman. The room goes quiet.',scene:'party',mood:'#d63031',effects:{flags:{witnessed_drama:true}},choices:[{text:'Step in. Help Jake break it up.',next:'fp_break_fight',effects:{stats:{cou:2},relationships:{jake:3}},check:{stat:'cou',dc:10}},{text:'Find the freshman\'s friends. He shouldn\'t be alone.',next:'fp_help_freshman',effects:{stats:{int:1},relationships:{jake:1}}},{text:'Stay out of it. Not your problem.',next:'fp_drama_aftermath'}]},
fp_break_fight:{characters:['jake'],text:'You push through the crowd. Jake sees you and nods — grateful. You step between them.\n\n"Hey man, it\'s not worth it." You look Varsity Jacket in the eye. He\'s bigger than you. Definitely stronger. But up close, you can see it — he\'s scared too. Puffed up because everyone\'s watching.\n\n"Walk away," you say. Not aggressive. Just calm. "Nobody needs this."\n\nThe room holds its breath. Varsity Jacket stares you down. Then — slowly — his shoulders drop. He mutters something, grabs his drink, and walks toward the door. His friends follow.\n\nThe room exhales. Someone starts clapping. Jake grabs your shoulder. "You\'re a legend. Seriously. That could\'ve gone sideways."\n\nThe freshman you saved looks shaken but grateful. "Thanks, man. I don\'t — I didn\'t know what to do."\n\nWord spreads fast. By the time you get back outside, three people you\'ve never met fist-bump you. Mia is looking at you from across the room with an expression you can\'t quite read.',scene:'party',mood:'#00b894',effects:{relationships:{jake:3,mia:2},stats:{cou:2},flags:{broke_up_fight:true}},choices:[{text:'Go talk to Mia. That look meant something.',next:'fp_mia_looking',effects:{relationships:{mia:2}}},{text:'Check on the freshman. Make sure he\'s okay.',next:'fp_help_freshman_after',effects:{stats:{int:1},relationships:{jake:1}}},{text:'Find Tyler. Big night — need to process.',next:'fp_tyler_panic',effects:{relationships:{tyler:1}}}]},
fp_help_freshman:{characters:[],text:'You find the freshman outside, sitting on the porch steps, shaking. His name is Marcus. He\'s a first-year engineering student who came alone because his roommate bailed.\n\n"I just — I accidentally bumped into that guy and he flipped out. I apologized like three times." His voice is thin. "Maybe I shouldn\'t have come."\n\nJake comes out a few minutes later. "Hey, you good? That guy\'s gone. I told him he\'s not welcome back." He sits on the other side of Marcus. "First party?"\n\nMarcus nods.\n\nJake looks at you. "Will you hang with him for a bit? I gotta go do damage control inside."\n\nYou spend twenty minutes with Marcus. He calms down. Turns out he\'s actually funny when he\'s not terrified — dry humor, loves sci-fi, has strong opinions about the Star Wars prequels.\n\n"Thanks for... you know. Not walking past." He stands up straighter. "I think I\'m okay now."',scene:'party',mood:'#636e72',effects:{relationships:{jake:2},stats:{int:1},flags:{helped_marcus:true}},choices:[{text:'Introduce Marcus to Tyler. They\'d get along.',next:'fp_marcus_tyler',effects:{stats:{cha:1}}},{text:'"Come on. I\'ll show you the non-scary parts of this party."',next:'fp_backyard',effects:{stats:{cou:1}}}]},
fp_help_freshman_after:{characters:[],text:'Marcus is outside, sitting with a water bottle, looking more embarrassed than scared now.\n\n"Hey — you\'re the guy who stepped in. Thank you. Seriously." He stands up. "I\'m Marcus."\n\nYou talk for a few minutes. He loosens up — turns out near-fights are a good bonding experience. He\'s into game development, wants to build RPGs, and has a theory about why every college party plays the same seven songs.\n\n"It\'s algorithmic momentum," he explains. "One DJ picks a viral track, the next copies it, and within three weeks every party in America has the same playlist. I did a spreadsheet."\n\n"You did a spreadsheet about party music?"\n\n"Don\'t judge me."',scene:'party',mood:'#636e72',effects:{flags:{helped_marcus:true},stats:{int:1}},choices:[{text:'Introduce Marcus to the group. He needs friends.',next:'fp_backyard',effects:{stats:{cha:1}}},{text:'Exchange numbers. Good people are worth keeping.',next:'fp_fire_chill',effects:{flags:{got_marcus_number:true}}}]},
fp_marcus_tyler:{characters:['tyler','marcus'],text:'You bring Marcus to Tyler, who is currently explaining his beer pong philosophy to a cactus. (Tyler\'s had a few.)\n\n"Tyler, this is Marcus. Marcus, Tyler. You\'re both into overthinking simple things — you\'ll get along."\n\nWithin five minutes, they\'re in a heated debate about whether the Star Wars sequels ruined the franchise or saved it. Tyler says saved (he\'s wrong). Marcus says ruined (debatable). They\'re both wrong but enjoying it.\n\nJake watches from the doorway, arms crossed, grinning at you. He mouths: "You\'re good at this."\n\nThe party feels different now. Smaller, warmer, more real. The loud early hours gave way to this — the quiet late hours where people stop performing and start connecting.',scene:'party',mood:'#fdcb6e',effects:{relationships:{tyler:2,jake:2},stats:{cha:1},flags:{marcus_tyler_friends:true}},choices:[{text:'Soak it in. Head to the backyard fire pit.',next:'fp_fire_chill'},{text:'Find Mia — the night\'s not over yet.',next:'fp_mia_looking',effects:{relationships:{mia:1}}},{text:'Go to the roof. Earn some solitude.',next:'fp_roof_solo'}]},
fp_drama_aftermath:{characters:[],text:'Jake handles it. You watch from outside as he calmly guides Varsity Jacket toward the exit, talking the whole time — calm, steady. Jake\'s clearly done this before.\n\nThe party resets. Music comes back. People relax. But the energy\'s different now — that raw edge that makes late-night parties either magic or disaster.\n\nChad sits back down next to you. "It\'s always the varsity guys," he says, shaking his head. "They peak in high school and take it out on everyone else."\n\nThe fire crackles. Someone hands you a fresh drink. The night goes on.',scene:'party',mood:'#636e72',effects:{flags:{stayed_out_of_drama:true}},choices:[{text:'The mood shift makes you want company. Find Mia.',next:'fp_mia_looking'},{text:'Stay by the fire. Sometimes quiet is enough.',next:'fp_fire_chill'},{text:'Head to the roof. Thinking time.',next:'fp_roof_solo'},{text:'Find Tyler. Time to head home — enough excitement for one night.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:1}}},{text:'Wait — it\'s not over. Something\'s happening at the front door.',next:'fp_fight_brewing'}]},

// === TYLER BEST FRIEND ARC ===
fp_tyler_walk_home:{characters:['tyler'],text:'The party\'s dying. Tyler finds you by the door, jacket slung over one shoulder, grinning ear to ear.\n\n"Best night ever?" he asks.\n\n"Best night ever."\n\nYou walk home together. The campus is empty at 2 AM — just street lamps and crickets and two freshmen who had the night of their lives.\n\nTyler recaps the entire evening in excruciating detail. Every moment with Zara, described three different ways. You let him talk. That\'s what best friends are for.\n\n"Hey," he says, suddenly serious. "Thanks for tonight. For making me talk to her. For being there. I know I dragged you to that party and you didn\'t want to come. But I\'m glad you did."\n\n"Me too."\n\nHe throws an arm around your shoulder. "Freshman year is gonna be okay, isn\'t it?"\n\nYou look at the stars, the empty campus, your best friend walking next to you.',scene:'party',mood:'#fdcb6e',effects:{relationships:{tyler:4},flags:{tyler_walk:true}},choices:[{text:'"Yeah, man. I think it is."',next:'fp_ending_tyler',effects:{relationships:{tyler:2}}},{text:'Just walk in comfortable silence. Some moments don\'t need words.',next:'fp_ending_tyler',effects:{relationships:{tyler:2}}}]},
fp_ending_tyler:{characters:['tyler'],text:'You get back to the dorm. Tyler pauses at his door.\n\n"One more thing." He holds up his phone. The text chain with Zara is already five messages deep. She sent a selfie from her dorm — peace sign, still in her party outfit. Tyler\'s reply is a badly-lit photo of himself doing the same pose. She replied with seven laughing emojis.\n\n"I\'m cooked," he says happily. "Absolutely cooked."\n\nYou laugh, fist-bump him goodnight, and go to your room. You lie on your bed, staring at the ceiling, replaying the night. The music, the people, the conversations. Tyler\'s face when Zara pulled him onto the dance floor. The fire pit. The string lights.\n\nYour phone buzzes. Tyler: "dude. best freshman year ever. and it\'s literally day 1."\n\nYou type back: "day 1 of many"\n\nHe sends back a fist bump emoji. You fall asleep smiling.\n\n---\n\nTHE NIGHT ENDS\n\nNot every great night is about romance. Sometimes the best story from a party is the one you tell with your best friend, years later, starting with "Remember that first party?" and ending with "Yeah. That was the night everything started."',scene:'party',mood:'#fdcb6e',effects:{flags:{ending_tyler:true,chapter1_complete:true},relationships:{tyler:5}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]},

// === ROOF MIA DEEPER PATH ===
fp_roof_mia_stars:{characters:['mia'],text:'Mia points at the sky. "Okay, that one. That bright one. What constellation is that?"\n\n"I have absolutely no idea."\n\n"Me neither. Let\'s name it." She traces a shape with her finger. "That one looks like a lopsided coffee cup. The Caffeine Constellation."\n\n"And that cluster there — that\'s The Procrastinator. Named after every college student who\'s staring at the sky instead of studying."\n\nShe laughs — a real laugh, not a polite one. The kind that makes her scrunch her nose.\n\n"We should do this again," she says. Then quickly: "I mean — not necessarily THIS. On a roof. At a party. Just... hanging out. Without thirty drunk people around us."\n\nShe\'s nervous. It\'s endearing.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},stats:{cha:1}},choices:[{text:'"I\'d like that. Coffee? This week?"',next:'fp_roof_mia_date',effects:{relationships:{mia:3},flags:{asked_mia_out:true}}},{text:'"How about we name every constellation first? We\'ve got all night."',next:'fp_ending_roof',effects:{relationships:{mia:3}}},{text:'Just smile at her. Let the moment speak.',next:'fp_roof_gentle',effects:{relationships:{mia:2}}}]},
fp_roof_mia_date:{characters:['mia'],text:'"Coffee," she repeats, testing the word. "Like a date?"\n\n"Like whatever you want it to be."\n\nShe holds your gaze. The string lights reflect in her eyes. "Wednesday. 3 PM. The place on College Ave with the terrible art on the walls. I\'ll save you a seat."\n\n"How do you know I\'ll show up?"\n\n"Because you climbed onto a roof at a frat party to talk about fake constellations with me. You\'ll show up."\n\nShe\'s right. You both know it.\n\nThe conversation after that is easy — effortless in the way that only happens when two people click. She tells you about her thesis idea (something about group psychology that\'s actually fascinating). You tell her about the thing you\'re passionate about. She listens like it matters.\n\nAt some point, her hand finds yours on the concrete between you. Neither of you acknowledges it. Neither of you moves away.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:4},flags:{mia_date_set:true}},choices:[{text:'Stay until the sunrise. This night deserves a proper ending.',next:'fp_ending_roof',effects:{relationships:{mia:3}}},{text:'Walk her home. End the night right.',next:'fp_walk_home_mia',effects:{relationships:{mia:2}}}]},

// === KITCHEN LATE NIGHT ===
fp_kitchen_late:{characters:[],text:'The kitchen at 1 AM is a different place. The beer pong table is abandoned, cups still standing. Someone left the fridge open and the light cuts a yellow triangle across the floor. Two people are having a quiet conversation by the window. The blender is somehow still running — nobody knows why.\n\nYou grab a water bottle and lean against the counter. The party sounds different from here — muffled bass through the walls, occasional laughter, the house settling into its late-night rhythm.\n\nSomeone slides onto the counter next to you. It\'s Chad, holding a bag of chips like a trophy.\n\n"You know what the best part of hosting is?" he says, crunching. "When it gets late enough that only the real ones are left. Everyone else went home. You stayed. That means something."',scene:'party',mood:'#fdcb6e',effects:{relationships:{chad:2}},choices:[{text:'"What made you join a frat? Like, actually?"',next:'fp_chad_real',effects:{relationships:{chad:2}}},{text:'Grab some chips. Sometimes silence is enough.',next:'fp_fire_chill'},{text:'"I should find Tyler before he does something stupid."',next:'fp_tyler_panic',effects:{relationships:{tyler:1}}},{text:'People are starting to leave. Time to exchange numbers before it\'s too late.',next:'fp_number_exchange'},{text:'The night\'s winding down. Take stock.',next:'fp_night_winding_down'},{text:'Mia\'s sitting on the stairs, shoes off.',next:'fp_mia_stairs',requires:{met_mia:true},effects:{relationships:{mia:1}}},{text:'Tyler looks rough over by the wall...',next:'fp_tyler_too_drunk',effects:{relationships:{tyler:1}}}]},
fp_chad_real:{characters:['chad'],text:'Chad stops chewing. Nobody\'s ever asked him that before — or at least, nobody he took seriously.\n\n"Honestly? I was lonely." He says it simply, like a fact. "Grew up as an only kid. My parents traveled a lot. I was alone in a big house most of the time. When I got to college, I wanted..." he gestures around, "...this. People around. Noise. Belonging to something."\n\nHe shrugs. "Everyone thinks I\'m here for the parties. And yeah, beer pong is sick. But the real thing? Having brothers. Having people who text you happy birthday at midnight because they actually care. That\'s the thing."\n\nHe offers you the chip bag. "Don\'t tell anyone I said that. I have a reputation."\n\n"Your secret\'s safe."\n\n"Good." He grins. "Want to hear about the time I accidentally set the kitchen on fire? It\'s a great story."',scene:'party',mood:'#fdcb6e',effects:{relationships:{chad:4},stats:{int:1},flags:{chad_real_talk:true}},choices:[{text:'Listen to the kitchen fire story. This guy\'s deeper than he looks.',next:'fp_fire_chill',effects:{relationships:{chad:2}}},{text:'"I appreciate you telling me that. Seriously."',next:'fp_ending_good',effects:{relationships:{chad:3}}},{text:'Check the time — it\'s late. Time to head out.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:1}},requires:{wingman:true}}]},

// === SOLO ENDING ===
fp_ending_solo:{characters:[],text:'You end up on the roof alone. Everyone else drifted home or fell asleep somewhere inside. The music stopped an hour ago. It\'s just you and the pre-dawn sky and the lingering smell of smoke from the fire pit.\n\nYou replay the night. Every conversation, every choice, every moment where you could have gone left but went right. Beer pong with strangers. Dancing with people whose names you\'ve already forgotten. Real conversations with people whose names you won\'t.\n\nYour phone has three new numbers in it. Your jacket smells like smoke and cheap cologne. You have a drawing in your pocket, or a napkin, or just the memory of someone looking at you like you mattered.\n\nThe sky turns pink. Then gold. The campus wakes up — sprinklers, birds, a jogger on the path below.\n\nYou don\'t feel lonely. You feel like yourself — maybe for the first time since you got here. Not the college version, not the version that\'s trying to impress anyone. Just you, sitting on a rooftop, watching the sun come up after the best night of your life so far.\n\n---\n\nTHE NIGHT ENDS\n\nSome nights you remember for the people. Some you remember for the person you became. This was both.',scene:'party',mood:'#fdcb6e',effects:{flags:{ending_solo:true,chapter1_complete:true}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]},

// ============================================================
// ROLE-EXCLUSIVE PATHS & TRADE-OFF EXPANSION (Batch 2)
// ============================================================

// === NERVOUS FRESHMAN EXCLUSIVE — OVERWHELM ARC ===
fp_overwhelm:{characters:[],text:'The noise hits you like a wall. Laughter that sounds mocking even though it\'s not. Music so loud your thoughts dissolve. Everyone here seems to know each other, know the rules, know how to hold a cup without looking awkward.\n\nYour hands are shaking. Just a little — enough that you switch the cup to your other hand and shove the trembling one in your pocket.\n\nA guy shoulder-checks you on his way past. "Watch it, freshman." He doesn\'t even look back.\n\nYou could push through this. Or you could find somewhere quieter. Or you could leave — nobody would notice.',scene:'party',mood:'#636e72',effects:{stats:{cou:-1}},choices:[{text:'Push through it. You didn\'t come here to hide.',next:'fp_overwhelm_push',effects:{stats:{cou:2,cha:-1}}},{text:'Find a bathroom. Lock the door. Breathe.',next:'fp_overwhelm_bathroom',effects:{stats:{per:1}}},{text:'Text Tyler. "Where are you?"',next:'fp_overwhelm_tyler',effects:{relationships:{tyler:1}}}]},
fp_overwhelm_push:{characters:[],text:'You force yourself forward. Into the crowd, into the heat, into the noise. Every cell in your body says retreat but you keep walking.\n\nAnd something shifts. Not immediately — it takes a few minutes. But the crowd stops feeling like a threat and starts feeling like a current you\'re swimming in. Someone hands you a fresh cup. A girl compliments your shoes. A group opens their circle to let you in without anyone saying a word.\n\nYou\'re still terrified. But you\'re here. And that counts for something.\n\nThe group is playing some kind of card game — you don\'t know the rules, but they\'re laughing so hard someone almost falls off their chair.',scene:'party',mood:'#e17055',effects:{stats:{cou:1},flags:{pushed_through:true}},choices:[{text:'Ask to join. Fake it till you make it.',next:'fp_card_game',effects:{stats:{cha:1}}},{text:'Watch for a round first. Learn the game.',next:'fp_card_game',effects:{stats:{int:1,per:1}}},{text:'The kitchen sounds safer.',next:'fp_kitchen'}]},
fp_overwhelm_bathroom:{characters:[],text:'The bathroom is small and smells like Pine-Sol and beer. You lock the door and sit on the edge of the tub. Your reflection stares back at you from the mirror — red-faced, wide-eyed, breathing too fast.\n\nYou run cold water over your wrists. Count to ten. Then twenty.\n\nSomeone knocks. "Occupied!" you call out, voice steadier than you feel.\n\n"Take your time," a girl\'s voice says, not unkindly.\n\nBy the time you open the door, three minutes later, you feel human again. The girl waiting is leaning against the wall, scrolling her phone. Dark hair. Oversized denim jacket. She looks up.\n\n"You okay? You looked like you were about to pass out back there."\n\nIt\'s Luna.',scene:'party',mood:'#636e72',effects:{flags:{met_luna_bathroom:true},relationships:{luna:1}},choices:[{text:'"First party. Is it always this... much?"',next:'fp_luna_bathroom_talk',effects:{relationships:{luna:2}}},{text:'"I\'m fine. Just needed a second."',next:'fp_luna_intro',effects:{relationships:{luna:1}}},{text:'Just nod and walk away quickly.',next:'fp_hallway'}]},
fp_luna_bathroom_talk:{characters:['luna'],text:'Luna laughs softly. "The first one is always the worst. After that, you learn which rooms to avoid and which people to stick near."\n\nShe leads you to a quieter spot in the hallway, near a window that\'s cracked open. The breeze feels incredible.\n\n"I\'m Luna. Art major. I spend most parties in corners drawing people who don\'t know they\'re being drawn." She pulls out a tiny sketchbook. "It\'s either weird or endearing — depends who you ask."\n\nShe\'s easy to talk to. No pressure, no performance. Just two people who\'d rather be somewhere quieter but aren\'t willing to leave yet.',scene:'party',mood:'#636e72',effects:{relationships:{luna:3},stats:{per:1}},choices:[{text:'"Can I see some of your sketches?"',next:'fp_luna_art',effects:{relationships:{luna:2}}},{text:'"What\'s the weirdest thing you\'ve drawn at a party?"',next:'fp_luna_quiet',effects:{relationships:{luna:1}}},{text:'"Want to find somewhere with less... everything?"',next:'fp_roof_luna',effects:{relationships:{luna:2}}}]},
fp_overwhelm_tyler:{characters:['tyler'],text:'Tyler texts back instantly: "KITCHEN. Beer pong. Get here NOW bro."\n\nYou push through the crowd toward the kitchen. When Tyler spots you, his face lights up. He throws an arm around your shoulder — half supportive, half claiming you as his teammate.\n\n"There he is! This is my boy, we\'re running pong next game." He turns to you, lower voice: "You good? You look like you\'ve seen a ghost."\n\nHe noticed. He\'s not going to make a thing of it, but he noticed.\n\n"I\'m good," you say. And with Tyler\'s arm around your shoulder, you almost believe it.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:3}},choices:[{text:'Play beer pong with Tyler.',next:'fp_beer_pong',effects:{relationships:{tyler:1}}},{text:'"Actually, let me just chill and watch for a bit."',next:'fp_kitchen_chill'},{text:'"Who\'s the girl by the fridge?"',next:'fp_fridge_girl',effects:{relationships:{tyler:-1}}}]},

// === CONFIDENT TRANSFER EXCLUSIVE — REPUTATION ARC ===
fp_transfer_arrival:{characters:[],text:'You\'ve been to parties before. Bigger ones, at your old school. With better DJs and worse beer. The Kappa Sigma house is mid — but you\'re not here for the house.\n\nYou\'re here because starting over means starting from zero, and zero is a number you\'re not comfortable with.\n\nTyler — your randomly assigned roommate, somehow already your closest thing to a friend here — waves from the front steps. "Dude, you walk like you own the place already."\n\n"Fake it till you make it."\n\n"Pretty sure you stopped faking a long time ago."\n\nYou scan the crowd. In thirty seconds you\'ve already identified the social clusters: the try-hards by the door, the clique on the lawn pretending they don\'t want to go inside, and the people who actually matter — the ones who look relaxed.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:1},stats:{cha:1}},choices:[{text:'Make an entrance. Walk straight to the biggest group and introduce yourself.',next:'fp_transfer_entrance',effects:{stats:{cha:1,cou:1,per:-1}}},{text:'Play it strategic. Find out who runs this house first.',next:'fp_transfer_strategic',effects:{stats:{int:1,per:1,cou:-1}}},{text:'Let Tyler lead. He knows these people.',next:'fp_front_door',effects:{relationships:{tyler:1}}}]},
fp_transfer_entrance:{characters:[],text:'You walk up to the loudest cluster on the porch — five guys, two girls, all holding cups and talking over each other. One of them is clearly the alpha — tallest, loudest, standing in the center.\n\n"Hey. I\'m new. Transfer from State. Who do I talk to about getting on the pong bracket?"\n\nThe alpha — Chad, you\'ll learn later — sizes you up for exactly two seconds. Then grins.\n\n"Transfer, huh? You any good?"\n\n"I went undefeated at State\'s Spring Fling."\n\nThat\'s a lie. You went 2-3. But it works.\n\n"Alright, hotshot. You\'re on next. Don\'t embarrass yourself." Chad claps your shoulder and the circle opens for you. Just like that, you\'re in.\n\nBut you catch one of the girls — sharp eyes, denim jacket — studying you from the porch railing. She doesn\'t look impressed. She looks... curious.',scene:'party',mood:'#e17055',effects:{relationships:{chad:2},flags:{lied_about_pong:true}},choices:[{text:'Play pong. Prove the lie was worth it.',next:'fp_beer_pong',effects:{relationships:{chad:1}}},{text:'Go talk to the girl on the railing.',next:'fp_luna_intro',effects:{relationships:{chad:-1,luna:1}}},{text:'Work the room first. More introductions.',next:'fp_transfer_mingle',effects:{stats:{cha:1}}}]},
fp_transfer_strategic:{characters:[],text:'You lean against the porch railing, watching. Mapping.\n\nThe tall guy in the center — he\'s the host or close to it. The girl in the crop top near the DJ is someone everyone keeps approaching. The quiet one by the fridge inside — she\'s watching everyone the same way you are.\n\nTyler comes back with two cups. "You\'re doing that thing again where you analyze everyone before talking to them."\n\n"It\'s not analyzing. It\'s... observing."\n\n"At your old school they probably called it intense."\n\nHe\'s not wrong. But it works. You already know who the key players are. The question is who to approach first.',scene:'party',mood:'#636e72',effects:{stats:{per:1}},choices:[{text:'Approach the host (Chad) — start at the top.',next:'fp_chad_hangout',effects:{relationships:{chad:1}}},{text:'The girl watching everyone (Nadia) — she\'s interesting.',next:'fp_fridge_girl',effects:{stats:{int:1}}},{text:'Actually, let the party come to you. Hit the dance floor.',next:'fp_dance_floor',effects:{stats:{cou:1}}}]},
fp_transfer_mingle:{characters:[],text:'Over the next twenty minutes, you meet more people than most freshmen meet in a week. You\'re good at this — reading what people want to hear, matching energy, dropping just enough mystery to make them want more.\n\nBy the time you reach the kitchen, you have four new Instagram followers, two invitations to study groups, and someone\'s already calling you by a nickname.\n\nBut Nadia — the pre-med by the fridge — sees right through it.\n\n"You\'re working the room," she says flatly, not as an accusation. As a diagnosis. "I watched you. Different personality for every group. Which one is the real you?"\n\nThe question lands harder than it should.',scene:'party',mood:'#e17055',effects:{relationships:{nadia:1},stats:{cha:1,int:-1}},choices:[{text:'"Maybe none of them. Maybe I\'m still figuring it out." (Honest)',next:'fp_nadia_honest',effects:{relationships:{nadia:3},stats:{int:1,cha:-1}}},{text:'"This one. The one talking to you." (Smooth)',next:'fp_nadia_deflect',effects:{relationships:{nadia:1},stats:{cha:1}}},{text:'"Does it matter? Everyone performs at parties."',next:'fp_nadia_talk',effects:{relationships:{nadia:-1},stats:{int:1}}}]},

// === STAR ATHLETE EXCLUSIVE — FAME ARC ===
fp_athlete_arrival:{characters:[],text:'You hear them before you even reach the door.\n\n"Yo, that\'s him! From the team!"\n\nTwo guys you\'ve never spoken to wave at you like old friends. A girl you vaguely recognize from the campus gym does a double-take. This happens everywhere now — the roster photo went viral after the home opener, and suddenly everyone knows your face.\n\nTyler elbows you. "Must be nice being famous."\n\n"I scored one goal."\n\n"Yeah, the game-winner. In the last thirty seconds. Against the defending champs. No big deal."\n\nThe problem with being recognized is that people want to talk to the athlete. Not to you. There\'s a version of tonight where you play that role — high-fives, game stories, accepting every drink pushed into your hand. And there\'s a version where you try to be just... a person at a party.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:1},flags:{recognized:true}},choices:[{text:'Lean into it. Be the star tonight.',next:'fp_athlete_fame',effects:{stats:{cha:1,cou:1,int:-1},flags:{playing_star:true}}},{text:'Dodge the attention. You just want a normal night.',next:'fp_athlete_lowkey',effects:{stats:{per:1,int:1,cha:-1}}},{text:'Split the difference — be friendly, but don\'t perform.',next:'fp_front_door',effects:{relationships:{tyler:1}}}]},
fp_athlete_fame:{characters:[],text:'You lean in. Someone hands you a cup. Then another person. Within five minutes you\'re at the center of a group of twelve, telling the story of the game-winner.\n\n"So the defender\'s on my hip, right? I fake left — he bites — and I just tap it far post. Keeper didn\'t even move."\n\nThey love it. The attention is warm and addictive. Chad materializes and pulls you into a bro-hug like you\'ve known each other for years.\n\n"Bro, you\'re a LEGEND. You\'re playing pong with me. Non-negotiable."\n\nBut across the room, you catch someone rolling their eyes. Nadia, leaning against the fridge. She mouths something to her friend — you can\'t read it, but you can guess.\n\nAnd Tyler\'s drifted to the edge of the group. He looks... small.',scene:'party',mood:'#e17055',effects:{relationships:{chad:3,tyler:-1,nadia:-1},stats:{cha:1}},choices:[{text:'Pull Tyler back in. "Tyler set up the assist — tell them about it."',next:'fp_athlete_tyler_save',effects:{relationships:{tyler:3,chad:1},stats:{cha:-1}}},{text:'Keep riding the wave. Tyler can handle himself.',next:'fp_beer_pong',effects:{relationships:{tyler:-2},stats:{cou:1}}},{text:'Break off to talk to Nadia. She clearly thinks you\'re full of it.',next:'fp_athlete_nadia',effects:{relationships:{chad:-1,nadia:1},stats:{int:1,cha:-1}}}]},
fp_athlete_lowkey:{characters:[],text:'You slip past the guys calling your name with a wave and a "Be right back" you don\'t intend to keep.\n\nThe side of the house is quieter. You take the long way around to the back entrance, past the recycling bins and someone\'s abandoned skateboard. Inside, the kitchen is less packed.\n\nNo one here seems to recognize you. It\'s an unfamiliar relief.\n\nYou grab a water bottle and lean against the counter. For the first time since the season started, you\'re just some guy at a party. Anonymous. Normal.\n\nA girl by the fridge catches your eye. Not because she\'s staring — because she\'s the only other person in the room who isn\'t performing.',scene:'party',mood:'#636e72',effects:{stats:{per:1},flags:{keeping_lowkey:true}},choices:[{text:'Talk to her.',next:'fp_fridge_girl',effects:{stats:{int:1}}},{text:'Find Tyler — he probably needs a wingman.',next:'fp_find_tyler',effects:{relationships:{tyler:1}}},{text:'Explore. See what else this house has.',next:'fp_hallway',effects:{stats:{per:1}}}]},
fp_athlete_tyler_save:{characters:['tyler'],text:'You reach back and grab Tyler\'s arm, pulling him forward.\n\n"Nah, nah — Tyler set up the whole play. Tell them about the cross, dude."\n\nTyler blinks, surprised. Then his face splits into a grin. "Oh, you mean the one where I sent it blind from the corner and somehow this idiot was exactly where he needed to be?"\n\nThe group laughs. Chad slaps Tyler\'s back. "Roommate assist! That\'s poetic!"\n\nTyler shoots you a look — gratitude mixed with something deeper. You could have had the spotlight alone. You chose to share it.\n\nThe rest of the night, Tyler sticks a little closer. Not in a clingy way — in a "this guy\'s actually my friend" way.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:4},stats:{cha:1},flags:{shared_spotlight:true}},choices:[{text:'Play pong with Tyler as your partner.',next:'fp_beer_pong',effects:{relationships:{tyler:1}}},{text:'Now that the crowd\'s happy, slip away. Find something real.',next:'fp_kitchen_chill'},{text:'"Let\'s get some air." Head to the backyard.',next:'fp_backyard',effects:{relationships:{tyler:1}}}]},
fp_athlete_nadia:{characters:['nadia'],text:'Nadia doesn\'t look up from her phone when you approach. Then she does.\n\n"Oh. The sports guy. I thought you\'d be busy accepting your throne from the frat boys."\n\n"That obvious?"\n\n"You have the charisma of someone who\'s used to people clapping for them. It\'s not a compliment."\n\nOuch. But she\'s smiling — a sharp, testing kind of smile.\n\n"I\'m Nadia. Pre-med. I don\'t watch sports, so you\'re going to have to be interesting the normal way."',scene:'party',mood:'#e17055',effects:{relationships:{nadia:2},stats:{cha:-1,int:1}},choices:[{text:'"Good. I\'m tired of being interesting the easy way." (Honest)',next:'fp_nadia_honest',effects:{relationships:{nadia:3},stats:{int:1}}},{text:'"Pre-med? So you dissect things. Including people?"',next:'fp_nadia_talk',effects:{relationships:{nadia:1},stats:{cha:1}}},{text:'"I get it — you\'ve decided I\'m shallow. Want to find out if you\'re wrong?"',next:'fp_nadia_profile',effects:{relationships:{nadia:2}},check:{stat:'cha',dc:11}}]},

// === TRADE-OFF CHOICES — NEW BRANCHES ===
// Decisions where gaining something means losing something else

fp_drink_dilemma:{characters:['chad'],text:'Chad pushes two cups toward you. "Alright — house rules. You can have the Mystery Punch, which is basically jet fuel but it\'ll loosen you up for the rest of the night. Or the Light Stuff, which tastes like watered-down regret but you\'ll remember everything tomorrow."\n\nHe\'s not being pushy — he genuinely sees this as a meaningful choice.\n\n"Choose wisely. This decision determines the kind of night you have."',scene:'party',mood:'#e17055',effects:{relationships:{chad:1}},choices:[{text:'Mystery Punch. Go big or go home.',next:'fp_punch_brave',effects:{stats:{cou:2,int:-2,per:-1},flags:{drank_punch:true}}},{text:'Light Stuff. I want to remember tonight.',next:'fp_punch_safe',effects:{stats:{int:1,per:1,cou:-1},flags:{stayed_sober:true}}},{text:'"I\'ll just grab a water, actually."',next:'fp_punch_sober',effects:{stats:{int:2,per:1,cou:-2,cha:-1},flags:{fully_sober:true}}}]},
fp_punch_brave:{characters:['chad'],text:'The Mystery Punch tastes like someone dissolved a gummy bear in rubbing alcohol. It burns going down and immediately makes your eyes water.\n\nChad watches your reaction and howls with laughter. "There it is! That\'s the face! Everyone makes that face!"\n\nWithin fifteen minutes, the edges of the party soften. The music sounds better. People are funnier. Your own jokes land harder. The anxiety that\'s been sitting in your chest since you arrived dissolves like sugar in hot water.\n\nYou\'re looser now. Freer. Also definitely going to make some decisions tonight that Sober You would strongly disagree with.',scene:'party',mood:'#e17055',effects:{relationships:{chad:2},stats:{cha:2}},choices:[{text:'Hit the dance floor — you feel invincible.',next:'fp_dance_floor',effects:{stats:{cou:1}}},{text:'Find someone to talk to. You\'re a great conversationalist right now. (You think.)',next:'fp_drunk_mingle',effects:{stats:{cha:1,int:-1}}},{text:'Challenge someone to beer pong. You can definitely win now.',next:'fp_beer_pong',effects:{stats:{cou:1}}}]},
fp_punch_safe:{characters:['chad'],text:'The Light Stuff tastes like slightly fizzy water with a suggestion of alcohol. You\'re not going to get a story out of this drink, but you\'re not going to wake up on someone\'s lawn either.\n\nChad shrugs. "Respectable. Boring, but respectable."\n\nThe thing about staying mostly sober at a party is that you see everything. The way people\'s masks slip as the night goes on. The quiet dramas playing out in corners. The person standing alone by the wall who looks exactly as nervous as you felt an hour ago.\n\nYou\'re clearheaded. That\'s a superpower at 1 AM when everyone else is running on fumes.',scene:'party',mood:'#636e72',effects:{stats:{per:1}},choices:[{text:'Use your clarity. Watch the room. Read people.',next:'fp_sober_observer',effects:{stats:{per:1,int:1}}},{text:'Find a real conversation. Sober-to-sober hits different.',next:'fp_kitchen_chill'},{text:'Help the nervous person by the wall.',next:'fp_help_freshman',effects:{stats:{cha:1},relationships:{tyler:1}}}]},
fp_punch_sober:{characters:[],text:'"Water?" Chad stares at you like you\'ve just refused a gift. "At a PARTY? Bro."\n\nA few people nearby exchange looks. You feel the judgment — it\'s subtle but it\'s there. The social currency you just lost is tangible.\n\nBut you also feel something else: solid. Grounded. Like the only person in a room full of swaying buildings.\n\nTyler appears and throws an arm around you. "Leave him alone, Chad. He\'s the designated smart one tonight."',scene:'party',mood:'#636e72',effects:{relationships:{chad:-1,tyler:2}},choices:[{text:'Own it. "Someone has to remember all the embarrassing stuff you guys do."',next:'fp_sober_observer',effects:{stats:{cha:1,int:1},relationships:{chad:1}}},{text:'Feel self-conscious about it. Maybe find somewhere less judgmental.',next:'fp_hallway',effects:{stats:{cou:-1}}},{text:'"Tyler\'s right. I\'m collecting blackmail material."',next:'fp_kitchen_chill',effects:{relationships:{chad:1,tyler:1}}}]},

fp_sober_observer:{characters:[],text:'Staying sober at a party turns you into a documentary filmmaker. You see everything.\n\nThe couple in the corner having a quiet fight — she\'s crying, he\'s trying to hold her hand, she keeps pulling away. The three guys by the DJ booth who keep checking the door, waiting for someone who isn\'t coming. The girl on the dance floor who\'s dancing alone and doesn\'t care who sees.\n\nAnd then you notice something interesting: Mia, the confident one from earlier, is sitting alone on the stairs. Not performing for anyone. Just... sitting. Her phone screen illuminates her face. She looks different without the audience — smaller, somehow.\n\nNobody else has noticed.',scene:'party',mood:'#636e72',effects:{stats:{per:2}},choices:[{text:'Go sit with Mia. She doesn\'t know you\'re watching.',next:'fp_mia_alone',effects:{relationships:{mia:2}}},{text:'Give her space. Some moments aren\'t meant to be interrupted.',next:'fp_fire_chill',effects:{stats:{int:1}}},{text:'Keep watching the room. There are stories everywhere.',next:'fp_late_observations',effects:{stats:{per:1,int:1}}}]},
fp_mia_alone:{characters:['mia'],text:'You sit two steps below her. Close enough to talk, far enough to not crowd.\n\n"Hey."\n\nShe startles. The performance mask goes up instantly — smile, posture, energy. "Oh hey! Having fun?"\n\nThen she sees your face. You\'re not performing either. And something in her... relaxes.\n\n"Actually, no," she says, dropping the act. "I had a fight with my roommate before coming here. She said something that—" She stops. "Why am I telling you this? I literally met you two hours ago."\n\n"Because I\'m the only person here not drunk enough to forget it."\n\nShe laughs. A real one. "God, you\'re right. That\'s depressing and comforting at the same time."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:4},stats:{cha:1}},choices:[{text:'"What did she say?" Let her talk.',next:'fp_mia_opens_up',effects:{relationships:{mia:3},stats:{per:1,cou:-1}}},{text:'"You don\'t have to tell me. But I\'m here."',next:'fp_mia_truth',effects:{relationships:{mia:2}}},{text:'"Want to go somewhere less... staircase-y?"',next:'fp_roof_mia',effects:{relationships:{mia:2}}}]},
fp_mia_opens_up:{characters:['mia'],text:'Mia\'s quiet for a moment. She picks at the label on her cup.\n\n"She said I\'m exhausting. That being around me feels like being in someone else\'s movie — and she\'s tired of being a supporting character."\n\nThe words hang in the air.\n\n"And the worst part? She\'s right. I know she\'s right. I take up all the oxygen in every room I walk into and I don\'t know how to stop. It\'s not even on purpose — it\'s just... who I am. Or who I turned into."\n\nShe looks at you. "You\'re like the opposite of me. You watch. You listen. I perform. I project. And right now, I would give anything to be the person who can sit on stairs at a party and just... be quiet."\n\nHer eyes are shining. Not crying — just close.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:5},stats:{int:1},flags:{mia_vulnerable:true}},choices:[{text:'"You\'re being quiet right now. With me. So maybe it\'s not about changing — it\'s about who you\'re with."',next:'fp_mia_truth',effects:{relationships:{mia:4},stats:{cha:2,int:-1}}},{text:'"Your roommate said that because she cares. Not everyone would bother."',next:'fp_mia_truth',effects:{relationships:{mia:2},stats:{int:1}}},{text:'Just sit there. Be the proof that silence can be comfortable.',next:'fp_mia_truth',effects:{relationships:{mia:3},stats:{per:1}}}]},

fp_late_observations:{characters:[],text:'You find a spot by the staircase bannister and lean. The party is thinning — it\'s past midnight, the lightweights have gone home, the real night is just starting.\n\nThings you notice:\n\n1. Tyler and Zara have been talking by the fire pit for forty minutes straight. She laughed so hard she snorted. He didn\'t flinch.\n\n2. Jake — the quiet one from the chill room — is teaching someone chess using bottle caps as pieces. He\'s winning.\n\n3. Luna is sitting on the back porch, drawing in her sketchbook by the light of her phone. She looks perfectly content.\n\n4. Chad just carried a passed-out freshman to the couch and put a glass of water next to him. Nobody saw except you.\n\nThis party has layers. The surface is noise and chaos. Underneath, real things are happening.',scene:'party',mood:'#636e72',effects:{stats:{per:2,int:1}},choices:[{text:'Go check on Tyler and Zara. Be a good wingman.',next:'fp_dance_zara',effects:{relationships:{tyler:1}}},{text:'Sit with Luna on the porch.',next:'fp_roof_luna',effects:{relationships:{luna:2}}},{text:'Tell Chad you saw what he did. He deserves to know someone noticed.',next:'fp_chad_observed',effects:{relationships:{chad:3}}}]},

fp_chad_observed:{characters:['chad'],text:'You walk over to Chad as he\'s heading back to the kitchen.\n\n"Hey. I saw you help that kid on the couch."\n\nChad freezes. Then waves it off. "Oh — nah, that\'s just — he was gonna choke on his own face. Basic hosting."\n\n"Most hosts would\'ve stepped over him."\n\nChad looks at you differently now. Not the frat bro performance. Something real.\n\n"My older brother passed out at a party in high school. Nobody helped him. He woke up in the hospital." He says it matter-of-factly. "So yeah. I check on people. Sue me."\n\nHe turns away, but you catch the edge of something — a heaviness he carries underneath all the loud. He plays the party king because the alternative is remembering why he started.',scene:'party',mood:'#fdcb6e',effects:{relationships:{chad:5},stats:{per:1,int:1},flags:{chad_deep:true}},choices:[{text:'"That\'s heavy. I\'m glad he was okay."',next:'fp_chad_real',effects:{relationships:{chad:3}}},{text:'"You\'re a good guy, Chad. Genuinely."',next:'fp_fire_chill',effects:{relationships:{chad:2}}},{text:'Change the subject for him. He didn\'t sign up for therapy tonight.',next:'fp_kitchen_late',effects:{relationships:{chad:2},stats:{cha:1}}}]},

// === DRUNK MINGLE PATH ===
fp_drunk_mingle:{characters:[],text:'Drunk You is a conversational powerhouse. Or at least, Drunk You thinks so.\n\nYou pinball between groups, high-fiving strangers, telling stories that are 40% true, laughing at jokes you don\'t understand. Someone calls you "bro" and you call them "bro" back and neither of you knows the other\'s name.\n\nIt\'s chaotic and warm and exactly the kind of night you imagined college being.\n\nThen you accidentally bump into someone\'s cup. Beer splashes onto a girl\'s white top. She looks down. Then up at you. Her expression is... deciding.',scene:'party',mood:'#e17055',effects:{stats:{cha:1,per:-1}},choices:[{text:'Apologize immediately and offer your jacket.',next:'fp_spill_save',effects:{stats:{cha:1,cou:1},relationships:{mia:1}}},{text:'Freeze. Your brain is buffering.',next:'fp_spill_freeze',effects:{stats:{cha:-2},relationships:{mia:-1}}},{text:'Make a joke. "First the beer, now your shirt — I\'m ruining everything tonight."',next:'fp_spill_joke',effects:{stats:{cha:2,int:-1}},check:{stat:'cha',dc:10}}]},
fp_spill_save:{characters:['mia'],text:'You whip off your jacket and hold it out. "I am so, SO sorry. Here — this is clean, I promise."\n\nShe takes it. Examines the stain on her top, then you. Her expression shifts from annoyed to... amused.\n\n"You know, most guys would\'ve just said \'my bad\' and walked away." She slips into your jacket. It\'s comically oversized on her. "I\'m Mia."\n\n"I know — I mean — someone told me. I\'m not — I didn\'t—"\n\nShe holds up a hand. "Relax. Buy me a replacement top and we\'re even. Or..." she looks down at your jacket, "I could just keep this. It\'s actually really warm."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{gave_jacket:true}},choices:[{text:'"Keep it. It looks better on you anyway."',next:'fp_mia_talk',effects:{relationships:{mia:3},stats:{cha:1}}},{text:'"That jacket cost me forty bucks. You better at least tell me your major."',next:'fp_mia_talk',effects:{relationships:{mia:2},stats:{cha:1}}},{text:'This is getting flirty. Stay or redirect?',next:'fp_mia_flirt',effects:{relationships:{mia:2}}}]},
fp_spill_freeze:{characters:[],text:'You stand there. Beer dripping from your hand. Her white top turning see-through in a spreading circle. Your mouth opens but nothing comes out.\n\n"Are you... going to say something?" she asks.\n\nSomeone nearby snickers. You hear a phone camera click.\n\nTyler materializes from nowhere. "Dude\'s had a rough night — here, napkins." He hands her a stack from the kitchen, diffusing the tension with practiced ease.\n\nShe takes them and walks away without looking back. You\'ve just become the "beer guy" in at least three people\'s party story tonight.\n\nTyler pats your shoulder. "Don\'t worry about it. She\'ll forget by tomorrow."\n\nShe won\'t.',scene:'party',mood:'#636e72',effects:{relationships:{mia:-2,tyler:1},stats:{cha:-1},flags:{beer_incident:true}},choices:[{text:'Find somewhere to disappear. The porch. The backyard. Anywhere.',next:'fp_backyard',effects:{stats:{cou:-1}}},{text:'Try to find her later and apologize properly.',next:'fp_mia_apology',effects:{stats:{cou:1}}},{text:'Let it go. Everyone does something embarrassing at parties. This is yours.',next:'fp_kitchen_chill',effects:{stats:{int:1}}},{text:'Try to keep drinking to forget it. Bad idea.',next:'fp_ending_humiliation',effects:{stats:{cou:-1,int:-2}},requires:{drank_punch:true}}]},
fp_spill_joke:{characters:['mia'],text:'"First the beer, now your shirt — I\'m basically a natural disaster at this point."\n\nBeat. Two beats.\n\nShe snorts. Then laughs. Then she\'s laughing so hard she has to hold on to your arm, which is ironic because you\'re the one who ruined her shirt.\n\n"Oh my god. You are — that\'s — okay, you\'re funny." She wipes her eyes. "I\'m Mia. You owe me a shirt. Or a really good story to make up for it."\n\n"How about both?"\n\n"Deal. But the story first. Entertain me while I air-dry."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:4},stats:{cha:1}},choices:[{text:'Tell her about the time you accidentally walked into the wrong exam room.',next:'fp_mia_talk',effects:{relationships:{mia:2}}},{text:'"Actually, let\'s dance. The music will dry you faster. Science."',next:'fp_dance_floor',effects:{relationships:{mia:2},stats:{cou:1}}},{text:'"Story AND shirt? You drive a hard bargain. I like it."',next:'fp_mia_flirt',effects:{relationships:{mia:3}}}]},
fp_mia_apology:{characters:['mia'],text:'You find her twenty minutes later on the back porch, scrolling her phone. The stain has dried into a faint shadow. She looks up and her expression flickers — recognition, then something like acceptance.\n\n"Hey. I\'m sorry about earlier. I froze, and that was worse than the spill. You deserved an apology, and I should\'ve given you one right away."\n\nShe studies you. Really studies you, like she\'s deciding something.\n\n"That\'s... actually really mature. Most guys would\'ve just avoided me all night." She shifts over on the bench. "Sit down. You\'ve earned five minutes of conversation. Don\'t waste them."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},stats:{cou:1,cha:1},flags:{apologized_mia:true}},choices:[{text:'Make the most of five minutes. Ask her something real.',next:'fp_mia_talk',effects:{relationships:{mia:2}}},{text:'"Five minutes? What if I need six?"',next:'fp_mia_flirt',effects:{relationships:{mia:2},stats:{cha:1}}},{text:'Sit in comfortable silence for a moment first.',next:'fp_backyard_mia',effects:{relationships:{mia:1}}}]},

// === LOYALTY TEST — SOMEONE TALKS ABOUT YOUR FRIEND ===
fp_loyalty_test:{characters:[],text:'You\'re grabbing a drink when you overhear two guys by the counter.\n\n"...yeah, Tyler. He tries way too hard. Like, bro, we get it, you want people to like you. It\'s kind of pathetic."\n\nThe other one laughs. "The desperate energy is crazy. He brought his roommate as a prop tonight."\n\nThey don\'t know you\'re the roommate.\n\nYour grip tightens on your cup. Tyler has been nothing but genuine all night. He dragged you here because he wanted you to have fun — not because he was using you.\n\nBut these guys don\'t know that. And they\'re saying it loud enough that other people might hear.',scene:'party',mood:'#2d3436',effects:{},choices:[{text:'Confront them. "That\'s my roommate you\'re talking about."',next:'fp_loyalty_confront',effects:{stats:{cou:2,cha:-1},relationships:{tyler:4}},check:{stat:'cou',dc:9}},{text:'Walk away. Tyler doesn\'t need you fighting his battles.',next:'fp_loyalty_ignore',effects:{stats:{int:1,cou:-1},relationships:{tyler:-1}}},{text:'Quietly tell Tyler what they said. Let him decide.',next:'fp_loyalty_tell',effects:{relationships:{tyler:2},stats:{int:1}}}]},
fp_loyalty_confront:{characters:['tyler'],text:'You step into their line of sight. "Tyler\'s my roommate. And he\'s the most genuine person at this party."\n\nThe first guy looks startled. The second one smirks. "Relax, bro. We\'re just—"\n\n"You\'re talking shit about someone who\'d help either of you without thinking twice. So either say it to his face or keep his name out of your mouths."\n\nSilence. The kitchen goes quiet for a second — long enough that a few people look over. Long enough that it matters.\n\nThe smirking guy puts his hands up. "Whatever, man." They walk away.\n\nYou don\'t tell Tyler. But later that night, one of the guys comes up to you and mutters, "Fair point, dude. My bad." \n\nSome things don\'t need a whole speech. Sometimes showing up is enough.',scene:'party',mood:'#2d3436',effects:{relationships:{tyler:5,chad:2},stats:{cou:2},flags:{defended_tyler:true}},choices:[{text:'Find Tyler. He doesn\'t need to know, but you want to be near him.',next:'fp_backyard',effects:{relationships:{tyler:2}}},{text:'Let the adrenaline settle. Go somewhere quiet.',next:'fp_roof_solo',effects:{stats:{per:1}}},{text:'You need to burn this energy. Dance floor.',next:'fp_dance_floor',effects:{stats:{cou:1}}}]},
fp_loyalty_ignore:{characters:[],text:'You walk away. It\'s the smart move — no drama, no scene, no consequences.\n\nBut it sits in your stomach like a stone. The rest of the night, every time Tyler laughs or tells a joke, you hear those words: pathetic, desperate, prop.\n\nAre you one? A prop?\n\nNo. Tyler invited you because he wanted you here. You know that.\n\nBut you walked away when someone said otherwise. And that\'s going to take a while to stop tasting.',scene:'party',mood:'#636e72',effects:{stats:{cou:-1},flags:{heard_tyler_diss:true}},choices:[{text:'Find Tyler and stick close. Make up for it in your own way.',next:'fp_kitchen_late',effects:{relationships:{tyler:2}}},{text:'The guilt is heavy. Get some air.',next:'fp_backyard',effects:{stats:{per:1}}},{text:'Tell Tyler later. When it\'s just you two.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:1}}}]},
fp_loyalty_tell:{characters:['tyler'],text:'You find Tyler by the fire pit. "Hey. Can I tell you something?"\n\nHe reads your face instantly. "What happened?"\n\nYou tell him. Word for word. Tyler\'s expression doesn\'t change — not anger, not hurt, just... processing.\n\n"Yeah," he says finally. "I know people say that stuff. I\'ve heard it before." He takes a sip. "Here\'s the thing — I\'d rather be the try-hard who cares too much than the cool guy who doesn\'t care about anyone. You know?"\n\nHe bumps your shoulder. "Thanks for telling me, though. Most people wouldn\'t."\n\nIn that moment, Tyler goes from your roommate to your friend. The real kind.',scene:'party',mood:'#fdcb6e',effects:{relationships:{tyler:5},stats:{int:1,cha:1},flags:{told_tyler:true}},choices:[{text:'Stay by the fire with him.',next:'fp_fire_chill',effects:{relationships:{tyler:2}}},{text:'"You\'re a good dude, Tyler. Let\'s enjoy the rest of this night."',next:'fp_backyard',effects:{relationships:{tyler:1}}},{text:'Fist bump. No words needed.',next:'fp_late_observations',effects:{relationships:{tyler:2}}}]},

// === PARTY DRAMA EXPANSION — FIGHT ESCALATION ===
fp_fight_brewing:{characters:[],text:'The energy shifts. You feel it before you see it — a tightness in the air, voices getting sharp.\n\nBy the front door, two guys are chest-to-chest. One of them is a Kappa Sigma brother. The other is an outsider — bigger, drunker, pointing a finger.\n\n"You talked to my girlfriend."\n\n"Bro, I asked her where the bathroom was."\n\n"THAT\'S my girl. You don\'t LOOK at her."\n\nChad is already moving toward them, hands up, peace-making voice. But the outsider is three drinks past reason.\n\nThis is about to get ugly.',scene:'party',mood:'#d63031',effects:{},choices:[{text:'Help Chad de-escalate. Two voices are better than one.',next:'fp_fight_deescalate',failNext:'fp_ending_fight_expelled',effects:{stats:{cha:1,cou:1},relationships:{chad:2}},check:{stat:'cha',dc:10}},{text:'Find the girlfriend. She can defuse this faster than anyone.',next:'fp_fight_girlfriend',effects:{stats:{int:2,per:1,cou:-1}}},{text:'Stay back. This isn\'t your fight.',next:'fp_fight_watch',effects:{stats:{per:1,cou:-1}}}]},
fp_fight_deescalate:{characters:['chad'],text:'You step in beside Chad. "Hey man — nobody\'s trying to start anything. We\'re all just here to have a good time, right?"\n\nThe outsider looks at you. Then at Chad. Two calm people against his adrenaline. It\'s not enough to stop him — but it\'s enough to slow him down.\n\nChad puts a hand on the Kappa brother\'s shoulder and walks him backward, talking low. You stay between them.\n\n"Let\'s get you some water," you tell the outsider. "Your girl\'s over there. Go be with her instead of doing something you\'ll regret."\n\nHe hesitates. Then his shoulders drop. "Yeah. Yeah, okay." He walks away.\n\nChad exhales. "You\'re good at that. You ever thought about pledging?"\n\nHe\'s only half joking.',scene:'party',mood:'#fdcb6e',effects:{relationships:{chad:4},stats:{cha:2,cou:1},flags:{stopped_fight:true}},choices:[{text:'"Pledging? Maybe. But only if you promise no more almost-fights."',next:'fp_chad_hangout',effects:{relationships:{chad:2}}},{text:'The adrenaline rush hits. You need to sit down.',next:'fp_fire_chill',effects:{stats:{per:1}}},{text:'That was intense. Time for something lighter.',next:'fp_dance_floor',effects:{stats:{cou:1}}}]},
fp_fight_girlfriend:{characters:[],text:'You scan the crowd and find her — standing near the kitchen door, watching the confrontation with a mix of horror and embarrassment. She knows exactly what\'s happening.\n\n"Hey — he\'s your boyfriend, right? He\'s about to do something really dumb."\n\nShe closes her eyes. "He does this every party. Every single one."\n\n"Can you pull him out of here before Chad has to?"\n\nShe nods and pushes through the crowd. You hear her voice cut through the noise: "Marcus. We\'re leaving. NOW." Something in her tone says she\'s done — not just tonight, but maybe with all of it.\n\nMarcus deflates. They leave through the front door. The party exhales.\n\nSmart play. No fists, no scene. Just the right words to the right person.',scene:'party',mood:'#636e72',effects:{stats:{int:2,per:1},flags:{defused_smart:true}},choices:[{text:'Find Chad and make sure he\'s okay.',next:'fp_chad_hangout',effects:{relationships:{chad:2}}},{text:'That was exhausting. Find somewhere peaceful.',next:'fp_roof_solo',effects:{stats:{per:1}}},{text:'Back to the party. The show must go on.',next:'fp_kitchen_late'}]},
fp_fight_watch:{characters:[],text:'You step back. The crowd forms a loose circle — half worried, half recording on their phones.\n\nThe outsider shoves the Kappa brother. The brother stumbles into a table. Cups go flying. Someone screams.\n\nChad tackles the outsider before a real punch lands. Two more brothers pin the guy\'s arms. It\'s over in seconds, but the damage is done — the vibe is broken. People are grabbing their things. Someone\'s calling campus security.\n\nThe party empties fast after that. Within twenty minutes, it\'s just the Kappa brothers cleaning up broken cups and the lingering smell of spilled beer.\n\nYou could\'ve done something. You didn\'t. That\'s not a judgment — it\'s just a fact that\'s going to sit with you.',scene:'party',mood:'#2d3436',effects:{stats:{cou:-1},flags:{fight_happened:true}},choices:[{text:'Help clean up. It\'s the least you can do.',next:'fp_cleanup',effects:{relationships:{chad:1},stats:{cha:1}}},{text:'Find Tyler. Time to go home.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:1}}},{text:'Stay and sit with whoever\'s still here.',next:'fp_kitchen_late'}]},

// === CLEANUP / AFTERMATH ===
fp_cleanup:{characters:['chad'],text:'The house looks like a crime scene made of red cups. You grab a trash bag from under the sink and start picking up.\n\nChad notices. Doesn\'t say anything at first — just works alongside you, sweeping broken glass, wiping counters. The silence is comfortable.\n\n"You don\'t have to do this," he says eventually. "You\'re not a brother."\n\n"I know. But the floor\'s sticky and it\'s bothering me."\n\nHe laughs — tired but real. "You know what, you\'re alright. Come to the next one. You\'ve got a standing invite."\n\nBy the time you leave, the kitchen is cleaner than when the party started. There\'s something satisfying about that — making something better than you found it.',scene:'party',mood:'#fdcb6e',effects:{relationships:{chad:4},stats:{cha:1,per:1},flags:{helped_cleanup:true}},choices:[{text:'Head home. It\'s been one hell of a night.',next:'fp_ending_good',effects:{flags:{chad_invite:true}}},{text:'One more moment on the porch before leaving.',next:'fp_ending_solo'}]},

// === JAKE DEEPER PATH ===
fp_jake_philosophy:{characters:['jake'],text:'Jake adjusts his position on the beanbag. "You ever think about how weird parties are? Like, objectively?\n\n"Fifty strangers cramming into a room, drinking poison, yelling over music, trying to form connections that\'ll probably evaporate by Monday. And we call it fun."\n\n"Is it fun for you?"\n\n"The conversations are. Like this one." He pauses. "The performance part? No. I hate the performance part. Everyone pretending to be cooler or drunker or more confident than they are."\n\nHe picks up a bottle cap and rolls it between his fingers.\n\n"I think the best thing about 2 AM is that people run out of energy to fake it. That\'s when the real stuff happens."',scene:'party',mood:'#636e72',effects:{relationships:{jake:3},stats:{int:2}},choices:[{text:'"So this is the real you?"',next:'fp_jake_real',effects:{relationships:{jake:2}}},{text:'"What do you perform as during the day?"',next:'fp_jake_mask',effects:{relationships:{jake:2},stats:{int:1}}},{text:'"You\'d get along with Luna. She thinks the same way."',next:'fp_jake_luna_intro',effects:{relationships:{jake:1,luna:1}}}]},
fp_jake_real:{characters:['jake'],text:'"Pretty much." He shrugs. "I don\'t really have a party version. What you see is what you get — quiet, overthinks everything, will destroy you at chess if you let me."\n\n"That\'s refreshing."\n\n"Or boring. Depends who you ask." He smiles. "But you\'re still sitting here, so maybe refreshing."\n\nThe room has emptied. It\'s just you and Jake and the lo-fi playlist he put on when the main speakers died. He pulls out his phone and shows you a note — it\'s a list titled "THINGS I WANT TO BUILD."\n\nAn app that matches people by music taste. A short film about loneliness that\'s actually funny. A coffee shop where every table has a chess board.\n\n"I write everything down because I know I won\'t do most of it. But having the list means the ideas existed. That counts for something."',scene:'party',mood:'#636e72',effects:{relationships:{jake:4},stats:{int:1},flags:{jake_real:true}},choices:[{text:'"The coffee shop one. Do that one."',next:'fp_jake_deep',effects:{relationships:{jake:2}}},{text:'"Can I add something to the list?"',next:'fp_jake_deep',effects:{relationships:{jake:3},stats:{cha:1}}},{text:'This guy might be the best person you\'ve met tonight.',next:'fp_ending_good',effects:{relationships:{jake:3}}}]},
