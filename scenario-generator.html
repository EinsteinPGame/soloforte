<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scenario Generator - SoloForte</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#14141f;--card-hover:#1a1a2e;--text:#e0e0e0;--text-dim:#888;--accent:#6c5ce7;--success:#00b894;--danger:#e17055;--warning:#fdcb6e}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* ===== MENU SCREEN ===== */
.menu-screen{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.menu-header{text-align:center;padding:40px 0 32px;user-select:none}
.menu-header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#6c5ce7,#a29bfe,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.menu-header p{color:var(--text-dim);margin-top:8px;font-size:0.95rem}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.scenario-card{background:var(--card);border-radius:16px;overflow:hidden;transition:all .25s;position:relative;border:1px solid #222}
.scenario-card:hover{transform:translateY(-4px);border-color:#444;background:var(--card-hover)}
.scenario-card.locked{opacity:.6;pointer-events:auto}
.scenario-card.locked:hover{transform:none}
.card-banner{height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-banner .icon{font-size:3rem;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.card-banner .icon-art{z-index:1;width:100%;height:100%;position:absolute;inset:0}
.spiderman-banner{overflow:hidden}
.spiderman-banner .city-bg{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(0deg,#0a0a1a 0%,transparent 100%)}
.spiderman-banner .city-bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:
  linear-gradient(90deg,transparent 3%,#111 3%,#111 7%,transparent 7%,transparent 12%,#151515 12%,#151515 18%,transparent 18%,transparent 25%,#111 25%,#111 30%,transparent 30%,transparent 38%,#131313 38%,#131313 42%,transparent 42%,transparent 55%,#111 55%,#111 62%,transparent 62%,transparent 70%,#141414 70%,#141414 76%,transparent 76%,transparent 85%,#111 85%,#111 92%,transparent 92%);
  mask:linear-gradient(0deg,#000 60%,transparent);-webkit-mask:linear-gradient(0deg,#000 60%,transparent)}
.card-banner::before{content:'';position:absolute;inset:0;opacity:.7}
.card-body{padding:16px}
.card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.card-body p{font-size:.85rem;color:var(--text-dim);line-height:1.5;margin-bottom:12px;min-height:40px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.card-tag{font-size:.7rem;padding:3px 8px;border-radius:99px;background:rgba(108,92,231,.15);color:#a29bfe}
.card-badge{position:absolute;top:12px;right:12px;font-size:.7rem;padding:4px 10px;border-radius:99px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-playable{background:rgba(0,184,148,.2);color:#00b894}
.badge-soon{background:rgba(136,136,136,.2);color:#888}
.badge-new{background:rgba(253,121,168,.2);color:#fd79a8}

/* ===== SETUP SCREEN ===== */
.setup-screen{max-width:600px;margin:0 auto;padding:24px 16px}
.setup-screen h2{text-align:center;font-size:1.8rem;margin-bottom:24px;font-weight:700}
.setup-group{margin-bottom:20px}
.setup-group label{display:block;font-size:.85rem;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.setup-group input[type="text"]{width:100%;padding:12px 16px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:var(--text);font-size:1rem}
.setup-group input:focus{border-color:var(--accent)}
.role-options{display:flex;gap:10px;flex-wrap:wrap}
.role-btn{padding:12px 18px;background:#1a1a2e;border:2px solid #333;border-radius:10px;color:var(--text);font-size:.9rem;transition:all .2s;text-align:left;flex:1;min-width:140px}
.role-btn:hover{border-color:#555}
.role-btn.selected{border-color:var(--accent);background:rgba(108,92,231,.15)}
.preset-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preset-btn{padding:14px;background:#1a1a2e;border:2px solid #333;border-radius:12px;color:var(--text);text-align:left;transition:all .2s}
.preset-btn:hover{border-color:#555}
.preset-btn.selected{border-color:var(--accent);background:rgba(108,92,231,.15)}
.preset-btn .name{font-weight:700;font-size:.95rem;margin-bottom:4px}
.preset-btn .desc{font-size:.75rem;color:var(--text-dim)}
.custom-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.stat-input{background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:10px;text-align:center}
.stat-input .stat-name{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.stat-input .stat-val{font-size:1.4rem;font-weight:700;margin:4px 0;color:var(--accent)}
.stat-input .stat-btns{display:flex;justify-content:center;gap:8px}
.stat-input .stat-btns button{width:28px;height:28px;border-radius:50%;background:#333;color:var(--text);font-size:1rem;display:flex;align-items:center;justify-content:center}
.stat-input .stat-btns button:hover{background:#444}
.points-left{text-align:center;font-size:.9rem;color:var(--accent);margin-top:8px}
.start-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:1.1rem;font-weight:700;border-radius:12px;margin-top:24px;transition:all .2s;text-transform:uppercase;letter-spacing:1px}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,.3)}
.start-btn:disabled{opacity:.4;transform:none;cursor:not-allowed}
.back-link{display:block;text-align:center;margin-top:16px;color:var(--text-dim);font-size:.85rem;cursor:pointer;background:none}
.back-link:hover{color:var(--text)}

/* ===== GAME SCREEN ===== */
.game-screen{display:flex;flex-direction:column;min-height:100vh}
.game-topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(20,20,31,.95);border-bottom:1px solid #222;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.game-topbar .title{font-weight:700;font-size:.95rem}
.game-topbar .actions{display:flex;gap:8px}
.topbar-btn{padding:6px 14px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text-dim);font-size:.8rem;transition:all .2s}
.topbar-btn:hover{color:var(--text);border-color:#555}
.game-body{flex:1;display:flex;max-width:1000px;margin:0 auto;width:100%;padding:24px 16px}
.game-main{flex:1;max-width:700px}
.game-sidebar{width:220px;margin-left:24px;flex-shrink:0}
.scene-mood{height:160px;border-radius:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.scene-mood::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 60%,var(--bg))}
.story-text{font-size:1.05rem;line-height:1.8;margin-bottom:24px;white-space:pre-wrap}
.story-text .new-text{animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.choice-btn{padding:14px 18px;background:#1a1a2e;border:2px solid #2a2a3e;border-radius:12px;color:var(--text);font-size:.95rem;text-align:left;transition:all .2s;position:relative}
.choice-btn:hover{border-color:var(--accent);background:rgba(108,92,231,.08);transform:translateX(4px)}
.choice-btn .check-info{font-size:.75rem;color:var(--warning);margin-top:4px}
.choice-btn .rel-info{font-size:.75rem;color:#fd79a8;margin-top:2px}
.choice-btn .effect-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.choice-btn .effect-tag{font-size:.65rem;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.choice-btn .effect-tag.stat-up{background:rgba(0,184,148,.15);color:#00b894;border:1px solid rgba(0,184,148,.3)}
.choice-btn .effect-tag.stat-down{background:rgba(214,48,49,.15);color:#ff7675;border:1px solid rgba(214,48,49,.3)}
.choice-btn .effect-tag.rel-up{background:rgba(253,121,168,.15);color:#fd79a8;border:1px solid rgba(253,121,168,.3)}
.choice-btn .effect-tag.rel-down{background:rgba(214,48,49,.15);color:#ff7675;border:1px solid rgba(214,48,49,.3)}
.choice-btn.disabled{opacity:.4;pointer-events:none}
.effect-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.effect-toast-item{padding:8px 18px;border-radius:10px;font-size:.85rem;font-weight:700;animation:toastIn .4s ease-out,toastOut .4s ease-in 1.8s forwards;white-space:nowrap;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.effect-toast-item.positive{background:rgba(0,184,148,.9);color:#fff}
.effect-toast-item.negative{background:rgba(214,48,49,.9);color:#fff}
.effect-toast-item.neutral{background:rgba(108,92,231,.9);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}

/* Stat check result overlay */
.check-result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:100;animation:fadeIn .3s}
.check-result .inner{background:var(--card);padding:32px;border-radius:20px;text-align:center;max-width:360px;border:2px solid #333}
.check-result .roll-display{font-size:2.5rem;font-weight:800;margin:16px 0}
.check-result .roll-display.success{color:var(--success)}
.check-result .roll-display.fail{color:var(--danger)}
.check-result .roll-detail{font-size:.85rem;color:var(--text-dim);margin-bottom:16px}
.check-result button{padding:10px 28px;background:var(--accent);color:#fff;border-radius:10px;font-size:.95rem;font-weight:600}

/* Sidebar */
.sidebar-section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #222}
.sidebar-section h4{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:.85rem}
.stat-row .stat-bar{width:60px;height:6px;background:#222;border-radius:3px;overflow:hidden}
.stat-row .stat-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.rel-row{display:flex;justify-content:space-between;font-size:.82rem;padding:2px 0}
.rel-row .val.positive{color:var(--success)}
.rel-row .val.negative{color:var(--danger)}
.inv-item{font-size:.82rem;padding:2px 0;color:var(--text-dim)}

/* ===== SAVE/LOAD MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:20px;padding:28px;max-width:440px;width:90%;border:1px solid #333}
.modal h3{margin-bottom:16px;font-size:1.2rem}
.modal{max-height:80vh;overflow-y:auto}
.save-slot{padding:14px;background:#1a1a2e;border:1px solid #333;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.save-slot:hover{border-color:var(--accent)}
.save-slot .slot-name{font-weight:600;font-size:.9rem}
.save-slot .slot-info{font-size:.78rem;color:var(--text-dim);margin-top:4px}
.modal-close{display:block;width:100%;padding:12px;background:#333;color:var(--text);border-radius:10px;margin-top:12px;font-size:.9rem}
.modal-close:hover{background:#444}

/* ===== UNLOCK MODAL ===== */
.unlock-input{display:flex;gap:8px;margin-top:12px}
.unlock-input input{flex:1;padding:10px 14px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text);font-size:1rem;text-align:center;letter-spacing:4px}
.unlock-input button{padding:10px 20px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600}
.unlock-error{color:var(--danger);font-size:.85rem;margin-top:8px;text-align:center}

/* ===== END SCREEN ===== */
.end-screen{max-width:600px;margin:60px auto;padding:24px;text-align:center}
.end-screen h2{font-size:2rem;margin-bottom:16px}
.end-screen p{color:var(--text-dim);line-height:1.7;margin-bottom:24px}
.end-screen button{padding:14px 32px;background:var(--accent);color:#fff;border-radius:12px;font-size:1rem;font-weight:600;margin:6px}

/* ===== CUTSCENE ===== */
.cutscene-panel{background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden;border:1px solid #222;animation:panelSlideIn .6s ease}
@keyframes panelSlideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.cutscene-panel .panel-image{width:100%;height:180px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:3rem}
.cutscene-panel .panel-image svg{width:100%;height:100%;display:block}
.cutscene-panel .panel-text{padding:16px;font-size:.95rem;line-height:1.7;color:var(--text)}
.cutscene-panel .panel-text .caption{font-size:.8rem;color:var(--text-dim);font-style:italic;margin-top:8px}
.cutscene-replay{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text-dim);font-size:.8rem;margin-bottom:16px;cursor:pointer;position:relative;z-index:5}
.cutscene-replay:hover{color:var(--text);border-color:#555}
.cutscene-progress{height:3px;background:#222;border-radius:2px;margin-bottom:16px;overflow:hidden}
.cutscene-progress .fill{height:100%;background:var(--accent);transition:width .3s linear}


/* ===== MOBILE ===== */
.sidebar-toggle{display:none;padding:10px 16px;background:var(--card);border:1px solid #222;border-radius:10px;color:var(--text-dim);font-size:.85rem;margin-bottom:12px;width:100%}
@media(max-width:768px){
  .menu-header h1{font-size:1.8rem}
  .scenario-grid{grid-template-columns:1fr}
  .game-body{flex-direction:column;padding:16px 12px}
  .game-sidebar{width:100%;margin-left:0;margin-top:16px;display:none}
  .game-sidebar.open{display:block}
  .sidebar-toggle{display:block}
  .scene-mood{height:120px}
  .preset-options{grid-template-columns:1fr}
  .custom-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<script>
// ============================================================
// CONFIG
// ============================================================
const PRIVATE_CODE = 'JK2E3';
const STAT_NAMES = {str:'Strength',cha:'Charisma',int:'Intelligence',per:'Perception',cou:'Courage',lck:'Luck'};
const PRESETS = {
  recommended:{label:'Recommended',desc:'Balanced stats. The intended experience.',stats:{str:5,cha:5,int:5,per:5,cou:5,lck:5}},
  gifted:{label:'Gifted',desc:'Higher stats. More options, NPCs react to your talent.',stats:{str:7,cha:7,int:7,per:7,cou:7,lck:7}},

// ============================================================
// STATE
// ============================================================
const STATE = {
  screen:'menu',
  scenario:null,
  player:{name:'',role:'',stats:{str:5,cha:5,int:5,per:5,cou:5,lck:5}},
  currentNode:null,
  flags:{},
  relationships:{},
  inventory:[],
  history:[],
  preset:'recommended',
  privateUnlocked:localStorage.getItem('sg_private')==='true',
  titleTaps:0,
  lastTap:0,
  sidebarOpen:false,
  checkResult:null,
  pendingNext:null
};

// ============================================================
// SCENARIOS
// ============================================================
const SCENARIO_META = [
  {id:'soldier',title:'Soldier Interrogation',desc:'You wake up in a cold concrete room. A bright light burns overhead. Someone wants answers.',icon:'&#127894;',gradient:'linear-gradient(135deg,#2d3436,#636e72)',tags:['Military','Thriller'],status:'playable',private:false},
  {id:'transformer',title:'Transformer: War for Cybertron',desc:'Cybertron is dying. The Autobots fight to save it. The Decepticons fight to rule it. Choose your faction — and decide the fate of a world.',icon:'&#129302;',gradient:'linear-gradient(135deg,#0984e3,#74b9ff,#e17055)',tags:['Sci-Fi','Action','Faction'],status:'playable',private:false},
  {id:'spiderman',title:'City Under Siege',desc:'The city needs a hero. Suit up, pick your gadgets, and swing into action against rising threats.',icon:'spiderman-art',gradient:'linear-gradient(135deg,#1a0508 0%,#8b0000 35%,#0a1a3a 100%)',tags:['Superhero','Action'],status:'soon',private:false,progression:'suits'},
  {id:'zombie',title:'Zombie Outbreak',desc:'The streets are chaos. Gunshots echo between buildings. You need to survive — starting now.',icon:'&#129503;',gradient:'linear-gradient(135deg,#00b894,#d63031)',tags:['Horror','Survival'],status:'playable',private:false},
  {id:'heist',title:'The Perfect Heist',desc:'Assemble a crew. Plan the approach. Break into the Meridian Vault — the most secure underground bank in history.',icon:'&#128176;',gradient:'linear-gradient(135deg,#0c1445,#d4a017)',tags:['Crime','Thriller','Heist'],status:'playable',private:false},
  {id:'examcrunch',title:'Exam Crunch',desc:'72 hours until the biggest exam of your life. Zero preparation. How do you survive?',icon:'&#128218;',gradient:'linear-gradient(135deg,#ffeaa7,#fdcb6e)',tags:['Comedy','Strategy','School'],status:'playable',private:false},
  {id:'prisonbreak',title:'Prison Break',desc:'Maximum security. Minimum time. One chance to get out before they move you to the hole.',icon:'&#128274;',gradient:'linear-gradient(135deg,#636e72,#e17055)',tags:['Thriller','Stealth'],status:'playable',private:false},
  {id:'shadowprotocol',title:'Shadow Protocol',desc:'You are Agent Zero. Your handler just went dark. Trust no one. Complete the mission.',icon:'&#128373;',gradient:'linear-gradient(135deg,#2d3436,#00b894)',tags:['Spy','Thriller'],status:'playable',badge:'new',private:false},
  {id:'neonabyss',title:'Neon Abyss',desc:'Neo-Tokyo 2087. The megacorps own everything — your body, your data, your future. Time to take it back.',icon:'&#128302;',gradient:'linear-gradient(135deg,#6c5ce7,#e17055)',tags:['Cyberpunk','Thriller'],status:'playable',private:false},
  {id:'rome',title:'Legions of Rome',desc:'Lead your century into battle. Glory or death — the Senate demands results.',icon:'&#9876;',gradient:'linear-gradient(135deg,#d4a017,#c0392b)',tags:['Historical','Strategy'],status:'soon',private:false},
  {id:'olympus',title:'Wrath of Olympus',desc:'The gods offer their boons. Monsters roam the land. Prove yourself worthy of legend.',icon:'&#9889;',gradient:'linear-gradient(135deg,#6c5ce7,#fdcb6e)',tags:['Mythology','Action'],status:'soon',private:false,progression:'boons'},
  {id:'hogwarts',title:'Hogwarts',desc:'Year 1 begins. Choose your house, learn your spells, uncover a mystery lurking in the castle.',icon:'&#9733;',gradient:'linear-gradient(135deg,#6c5ce7,#d4a017)',tags:['Fantasy','Magic'],status:'playable',private:false,progression:'spells'},
  {id:'jjk',title:'JJK: Altered Fates',desc:'Enroll at Tokyo Jujutsu High alongside Yuji Itadori. Your choices rewrite the timeline — who lives, who dies, and whether Sukuna ever rises.',icon:'&#128308;',gradient:'linear-gradient(135deg,#2a0845,#1a0a2e,#4a0000)',tags:['Anime','Action','Supernatural'],status:'playable',private:false},
  {id:'deathnote',title:'Death Note: Rewritten',desc:'A second Death Note falls. You find it. Light Yagami is Kira. Do you help him, stop him, or play your own game?',icon:'&#128213;',gradient:'linear-gradient(135deg,#1a1a3e,#8b0000,#3d0066)',tags:['Anime','Thriller','Psychological'],status:'playable',private:false},
  {id:'aot',title:'AOT: Wings of Freedom',desc:'Join the 104th Training Corps alongside Eren, Mikasa, and Armin. Your choices during humanity\'s war against the Titans change everything.',icon:'&#9876;',gradient:'linear-gradient(135deg,#2a3a1a,#cc4400,#660000)',tags:['Anime','Action','Dark Fantasy'],status:'playable',private:false},
  {id:'naruto',title:'Naruto: Shinobi Crossroads',desc:'Graduate the Academy alongside Naruto. Your choices during key events create butterfly effects that alter the entire ninja world.',icon:'&#127744;',gradient:'linear-gradient(135deg,#1a4a1a,#cc6600,#0a2a5a)',tags:['Anime','Action','Ninja'],status:'playable',private:false},
  {id:'demonslayer',title:'Demon Slayer: Breath of Resolve',desc:'After tragedy strikes your family, you train to become a Demon Slayer. Fight alongside Tanjiro and the Hashira — your breathing style and choices shape the war against Muzan.',icon:'&#128293;',gradient:'linear-gradient(135deg,#1a0a2e,#cc2200,#0a3a3a)',tags:['Anime','Action','Dark Fantasy'],status:'playable',private:false},
  {id:'onepiece',title:'One Piece: Grand Line Gambit',desc:'Set sail with Luffy and the Straw Hats. Navigate the Grand Line, clash with Warlords and Emperors, and chase the dream of the Pirate King.',icon:'&#9875;',gradient:'linear-gradient(135deg,#0a2a5a,#cc2200,#d4a017)',tags:['Anime','Adventure','Pirates'],status:'playable',private:false},
  {id:'dbz',title:'Dragon Ball Z: Saiyan Legacy',desc:'Train under Master Roshi and King Kai. Face Saiyans, Frieza, Cell, and Buu. Your power level and choices reshape the Dragon Ball universe.',icon:'&#128293;',gradient:'linear-gradient(135deg,#ff6600,#ffcc00,#2a0845)',tags:['Anime','Action','Martial Arts'],status:'playable',private:false},
  {id:'mha',title:'My Hero Academia: Hero Rising',desc:'Enroll at UA High alongside Deku and Class 1-A. Train your Quirk, survive villain attacks, and prove what it means to be a true hero.',icon:'&#128170;',gradient:'linear-gradient(135deg,#0a4a0a,#2196F3,#ff3300)',tags:['Anime','Action','Superhero'],status:'playable',private:false},
  {id:'bleach',title:'Bleach: Soul Reaper\'s Resolve',desc:'Gain Soul Reaper powers and enter the Soul Society. Fight alongside Ichigo against Hollows, Arrancars, and Aizen\'s master plan. Your Zanpakuto and choices shape the fate of all worlds.',icon:'&#9876;',gradient:'linear-gradient(135deg,#0a0a2e,#ff6600,#1a1a4e)',tags:['Anime','Action','Supernatural'],status:'playable',private:false},
  {id:'fma',title:'Fullmetal Alchemist: Equivalent Exchange',desc:'Study alchemy at Central Command alongside the Elric brothers. Uncover a conspiracy that reaches the top of the military. The truth demands a price — what are you willing to pay?',icon:'&#9883;',gradient:'linear-gradient(135deg,#8b0000,#d4a017,#2d3436)',tags:['Anime','Action','Mystery'],status:'playable',private:false},
  {id:'hxh',title:'Hunter x Hunter: The Exam Begins',desc:'Take the Hunter Exam alongside Gon, Killua, Kurapika, and Leorio. Master Nen, survive deadly trials, and face the darkness of the Hunter world. Your choices determine what kind of Hunter you become.',icon:'&#127919;',gradient:'linear-gradient(135deg,#1a5a1a,#d4a017,#2a0845)',tags:['Anime','Action','Adventure'],status:'playable',private:false},
  {id:'tg',title:'Tokyo Ghoul: Hunger & Humanity',desc:'After a deadly encounter, you become a half-ghoul — part human, part monster. Navigate the war between humans and ghouls in Tokyo. Feed or starve, fight or hide. Your choices decide which world you belong to.',icon:'&#128065;',gradient:'linear-gradient(135deg,#1a1a1a,#cc0000,#2a0845)',tags:['Anime','Dark','Psychological'],status:'playable',private:false},
  {id:'sao',title:'Sword Art Online: Death Game',desc:'10,000 players are trapped in a virtual MMORPG where death in-game means death in real life. Clear all 100 floors of Aincrad or die trying. Your sword skills and choices determine who survives.',icon:'&#9876;',gradient:'linear-gradient(135deg,#0a2a5a,#4a90d9,#d4a017)',tags:['Anime','Action','Virtual Reality'],status:'playable',private:false},
  {id:'cg',title:'Code Geass: Power of the King',desc:'In a world conquered by the Holy Britannian Empire, you gain the power of Geass — absolute obedience. Lead a rebellion, wear a mask, and sacrifice everything to free a nation. But power corrupts, and every order has consequences.',icon:'&#128142;',gradient:'linear-gradient(135deg,#2a0845,#cc0000,#d4a017)',tags:['Anime','Strategy','Mecha'],status:'playable',private:false},
  {id:'sg',title:'Steins;Gate: Divergence',desc:'In a cluttered apartment above a CRT shop, a self-proclaimed mad scientist discovers time travel. Every text you send to the past creates a new world line. But saving one person means losing another. Can you reach the Steins Gate?',icon:'&#128337;',gradient:'linear-gradient(135deg,#1a3a1a,#00cc00,#0a0a2e)',tags:['Anime','Sci-Fi','Thriller'],status:'playable',private:false},
  {id:'vs',title:'Vinland Saga: True Warrior',desc:'In the age of Vikings, you seek revenge, glory, and meaning. Follow Thorfinn from child warrior to pacifist explorer. Is a true warrior one who fights — or one who chooses not to?',icon:'&#9876;',gradient:'linear-gradient(135deg,#2d3436,#636e72,#d4a017)',tags:['Anime','Historical','Drama'],status:'playable',private:false},
  {id:'tpn',title:'The Promised Neverland: Escape from Grace Field',desc:'Grace Field House is paradise — loving Mama, delicious food, happy children. But behind the smiles hides a horrifying truth: you are livestock, raised as food for demons. Escape or be devoured.',icon:'&#127807;',gradient:'linear-gradient(135deg,#1a3a1a,#ff6600,#2a0a2e)',tags:['Anime','Thriller','Psychological'],status:'playable',private:false},
  {id:'csm',title:'Chainsaw Man: Devil Hunter',desc:'Devils are born from human fears. You join Public Safety to hunt them — but your new partner has a chainsaw for a face, your boss has ulterior motives, and the Gun Devil is coming. In this world, everyone has a price.',icon:'&#128296;',gradient:'linear-gradient(135deg,#8b0000,#ff4500,#1a1a1a)',tags:['Anime','Action','Dark'],status:'playable',private:false},
  {id:'mp',title:'Mob Psycho 100: Emotional Explosion',desc:'You are the most powerful esper alive — and all you want is to be normal. But emotions you suppress at 0% are building toward 100%. When the counter hits max, not even you can control what happens.',icon:'&#128165;',gradient:'linear-gradient(135deg,#7b1fa2,#e040fb,#1a237e)',tags:['Anime','Action','Comedy'],status:'playable',private:false},
  {id:'sxf',title:'Spy x Family: Operation Strix',desc:'A spy, an assassin, and a telepath walk into a family. Your mission: infiltrate Eden Academy, get close to a political target, and keep the fake family together. The only problem? The family might be becoming real.',icon:'&#128373;',gradient:'linear-gradient(135deg,#1a3a1a,#cc0000,#d4a017)',tags:['Anime','Comedy','Spy'],status:'playable',private:false},
  {id:'cw',title:'Cooking Wars: Kitchen Battleground',desc:'Enroll at the most elite culinary academy in the world. Master techniques, survive kitchen battles, and prove your cooking can make judges weep. No swords — just knives, fire, and flavor.',icon:'&#127859;',gradient:'linear-gradient(135deg,#ff6600,#ffcc00,#8b0000)',tags:['Anime','Non-Combat','School'],status:'playable',private:false}

const ROLE_DATA = {
  'Captured Officer':{desc:'You held rank. You held secrets. Now you hold nothing but silence and the hope that your training is enough.',bonuses:{cou:2,int:1,cha:-1},startFlag:'role_officer'},
  'Resistance Fighter':{desc:'You were never regular military. You fight for a cause, not a flag. They caught you — but they do not know what you really are.',bonuses:{str:2,cou:1,per:-1},startFlag:'role_resistance'},
  'Undercover Agent':{desc:'Your cover is blown — or is it? You have been so many people that the truth is just another mask. Play the room.',bonuses:{cha:2,int:1,str:-1},startFlag:'role_undercover'},
  'Veteran Thief':{desc:'You have done this before. The scars prove it. One last job — then you are out.',bonuses:{per:2,int:1,cou:-1},startFlag:'role_veteran'},
  'First-Timer':{desc:'No record. No reputation. That is exactly why they picked you.',bonuses:{lck:2,cou:1,cha:-1},startFlag:'role_firsttimer'},
  'Inside Man':{desc:'You used to work at Meridian. You know the building. You know the people. You know where the bodies are buried.',bonuses:{int:2,per:1,lck:-1},startFlag:'role_insideman'},
  'Nervous Freshman':{desc:'First semester. First party. Everything is new and terrifying.',bonuses:{per:2,int:1,cou:-1},startFlag:'role_freshman'},
  'Confident Transfer':{desc:'Transferred from another school. You know the game — just not these people.',bonuses:{cha:2,int:1,str:-1},startFlag:'role_transfer'},
  'Star Athlete':{desc:'Everyone knows your name from the roster. Tonight you\'re just trying to have fun.',bonuses:{str:2,cou:1,cha:-1},startFlag:'role_athlete'},
  'Cursed Prodigy':{desc:'You were born saturated with cursed energy. Techniques come naturally — control does not.',bonuses:{str:2,per:1,int:-1},startFlag:'role_prodigy'},
  'Tactical Genius':{desc:'You see patterns others miss. Every curse has a weakness. You just need to survive long enough to find it.',bonuses:{int:2,per:1,str:-1},startFlag:'role_tactician'},
  'Cursed Speech User':{desc:'Your words carry power. A single command can stop a curse in its tracks — but overuse shreds your throat.',bonuses:{cha:2,cou:1,per:-1},startFlag:'role_speech'},
  'Justice Seeker':{desc:'The world is rotten. But a notebook that kills is not justice — unless you make it so. You want to use the Death Note for good.',bonuses:{int:2,per:1,cou:-1},startFlag:'role_justice'},
  'Power Player':{desc:'A notebook that can kill anyone whose face you know? This is not a moral dilemma. This is an opportunity.',bonuses:{cou:2,cha:1,int:-1},startFlag:'role_power'},
  'Detective Mind':{desc:'You do not want to use the Death Note. You want to understand it. And you want to find Kira before anyone else does.',bonuses:{per:2,int:1,str:-1},startFlag:'role_detective'},
  'Titan Slayer':{desc:'Born to fight. ODM gear feels like an extension of your body. Where others see terror, you see targets.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_slayer'},
  'Scout Strategist':{desc:'You see the battlefield three moves ahead. Every titan has a pattern. Every formation has a weakness. You just need time to think.',bonuses:{int:2,per:1,str:-1},startFlag:'role_strategist'},
  'Shifter Descendant':{desc:'Your bloodline carries a secret even you do not fully understand. Sometimes your wounds heal too fast. Sometimes you dream of memories that are not yours.',bonuses:{str:1,int:1,per:1,cou:-1},startFlag:'role_shifter'},
  'Taijutsu Prodigy':{desc:'Your fists speak louder than any jutsu. You train your body until it breaks, then train it harder. Where others weave signs, you close the distance.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_taijutsu'},
  'Genjutsu Weaver':{desc:'Reality is what you decide it is. Your illusions are so convincing that even sensors second-guess themselves. The battlefield is a stage and you are the director.',bonuses:{int:2,cha:1,str:-1},startFlag:'role_genjutsu'},
  'Ninjutsu Savant':{desc:'You devour jutsu like others devour ramen. Every hand sign is instinct, every elemental release a conversation. Your chakra control is the envy of your class.',bonuses:{int:2,per:1,cou:-1},startFlag:'role_ninjutsu'},
  'Flame Breather':{desc:'Your master taught you the Flame Breathing style. Your strikes burn hot and fast — overwhelming power at the cost of endurance. You fight like a wildfire.',bonuses:{str:2,cou:1,per:-1},startFlag:'role_flame'},
  'Water Breather':{desc:'Fluid. Adaptive. Your Water Breathing flows around every attack, finding openings where others see walls. Defense and offense become one.',bonuses:{per:2,int:1,str:-1},startFlag:'role_water'},
  'Thunder Breather':{desc:'One step. One strike. Thunder Breathing is about explosive speed — closing distance before the demon even registers you moved. But if you miss, you are exposed.',bonuses:{str:2,per:1,int:-1},startFlag:'role_thunder'},
  'Devil Fruit User':{desc:'You ate a Devil Fruit — a cursed treasure that grants superhuman power at the cost of the sea itself. You can never swim again, but the ability you gained changes everything.',bonuses:{str:2,cha:1,per:-1},startFlag:'role_devilfruit'},
  'Master Swordsman':{desc:'Three swords, two swords, one sword — it does not matter. Your blade is your soul. You trained under the greatest and carry the ambition to surpass them all.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_swordsman'},
  'Haki Prodigy':{desc:'You were born with the rare gift of Conqueror\`s Haki — the ability to impose your will on others. Combined with Observation and Armament Haki, you sense and strike with supernatural precision.',bonuses:{per:2,int:1,str:-1},startFlag:'role_haki'},
  'Martial Arts Prodigy':{desc:'Enhanced physical combat, devastating combos, and mastery of ki techniques. Your fists are weapons forged through relentless training.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_martial_artist'},
  'Ki Energy Master':{desc:'Devastating energy attacks, flight mastery, and ki sensing abilities. You channel your life force into beams that can shatter mountains.',bonuses:{int:2,per:1,str:-1},startFlag:'role_ki_master'},
  'Saiyan Berserker':{desc:'Raw Saiyan power, zenkai boosts from near-death, and Great Ape transformation potential. You fight on instinct and grow stronger with every battle.',bonuses:{str:2,cou:1,per:-1},startFlag:'role_berserker'},
  'Power Quirk User':{desc:'Your Quirk enhances raw physical ability — strength, speed, or durability. You hit hard and take hits harder. But without control, your own body is the first casualty.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_power_quirk'},
  'Support Quirk User':{desc:'Your Quirk is not flashy, but it is versatile — barriers, healing, sensory enhancement. You make everyone around you better. Heroes fight; you make sure they win.',bonuses:{int:2,per:1,str:-1},startFlag:'role_support_quirk'},
  'Stealth Quirk User':{desc:'Invisibility, phasing, sound dampening — your Quirk works best when no one sees you coming. Perfect for rescue ops and ambushes. Less ideal for head-on fights.',bonuses:{per:2,int:1,cou:-1},startFlag:'role_stealth_quirk'},
  'Zanpakuto Prodigy':{desc:'Your Zanpakuto spirit spoke to you before you even knew its name. Shikai came naturally. Bankai whispers at the edge of your consciousness. Raw sword talent — but technique takes discipline.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_zanpakuto'},
  'Kido Master':{desc:'Hado and Bakudo flow from your fingertips like poetry. Binding spells, destruction arts, barriers — where others swing swords, you rewrite the battlefield with incantations.',bonuses:{int:2,per:1,str:-1},startFlag:'role_kido'},
  'Hollow Hybrid':{desc:'Something dark lives inside you. A mask forms when you lose control. Hollow reiatsu surges through your veins — terrifying power with a price. Can you master it before it consumes you?',bonuses:{str:2,per:1,int:-1},startFlag:'role_hollow_hybrid'},
  'Combat Alchemist':{desc:'State Alchemist. Your transmutation circles are weapons — walls of stone, lances of iron, explosions from the air itself. The military calls you an asset. The Ishvalans call you a monster.',bonuses:{str:2,int:1,cha:-1},startFlag:'role_combat_alch'},
  'Alkahestry Healer':{desc:'Trained in Xingese alkahestry — the healing branch of alchemy. You read the Dragon\'s Pulse, transmute at range, and mend wounds others call fatal. But healing in a war zone means choosing who lives.',bonuses:{int:2,per:1,str:-1},startFlag:'role_alkahestry'},
  'Chimera Researcher':{desc:'Your specialty is bio-alchemy. You understand the composition of living things at a molecular level. The knowledge is powerful — and the temptation to cross ethical lines is constant.',bonuses:{int:2,per:1,cou:-1},startFlag:'role_chimera'},
  'Enhancer Fighter':{desc:'Your Nen type is Enhancement — raw power amplified. Your punches hit like cannonballs and your body endures what would shatter steel. Simple, devastating, and honest. The strongest category in direct combat.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_enhancer'},
  'Transmuter Prodigy':{desc:'Your Nen type is Transmutation — you change the properties of your aura. Electricity, rubber, poison, whatever you imagine. Versatile and unpredictable. Killua would approve.',bonuses:{int:2,per:1,str:-1},startFlag:'role_transmuter'},
  'Specialist Anomaly':{desc:'Your Nen type is Specialization — unique abilities that defy classification. No one can predict your power because no one has seen anything like it. Rare, mysterious, and dangerous. Even to yourself.',bonuses:{per:2,int:1,cou:-1},startFlag:'role_specialist'},
  'Ukaku Ghoul':{desc:'Your kagune manifests from the shoulders — crystalline wings that fire projectiles. Fast, lethal at range, but burns through RC cells quickly. You hit hard and fast or not at all.',bonuses:{per:2,str:1,cou:-1},startFlag:'role_ukaku'},
  'Koukaku Ghoul':{desc:'Your kagune grows from the shoulder blade — dense, heavy, shield-like. Slower but incredibly durable. You are the wall that does not break. Defense that becomes offense.',bonuses:{str:2,cou:1,per:-1},startFlag:'role_koukaku'},
  'Rinkaku Ghoul':{desc:'Your kagune sprouts from the lower back — tentacle-like appendages with devastating striking power. High attack, high regeneration, but fragile kagune that can be severed. Glass cannon incarnate.',bonuses:{str:2,per:1,int:-1},startFlag:'role_rinkaku'},
  'Solo Beater':{desc:'Beta tester turned front-liner. You know the maps, the spawns, the boss patterns. Other players call you a cheater — a "beater." You fight alone because trusting others gets people killed.',bonuses:{str:2,per:1,cha:-1},startFlag:'role_beater'},
  'Guild Leader':{desc:'You lead from the front. Your strength is not just your sword — it is the people who follow you. Building trust, managing morale, keeping your guild alive. Every death is your failure.',bonuses:{cha:2,cou:1,per:-1},startFlag:'role_guild_leader'},
  'Info Broker':{desc:'Knowledge is the real currency in Aincrad. You map dungeons, track PKers, sell intel, and know secrets that could topple guilds. Your dagger is sharp but your information is sharper.',bonuses:{int:2,per:1,str:-1},startFlag:'role_info_broker'},
  'Strategic Commander':{desc:'You see the battlefield as a chess board. Troop movements, supply lines, political leverage — your mind is your weapon. You win wars before the first shot is fired.',bonuses:{int:2,cha:1,str:-1},startFlag:'role_strategist'},
  'Knightmare Ace':{desc:'Born to pilot. Your Knightmare Frame responds to your thoughts faster than your body. In the cockpit, you are unstoppable. Outside it, you are just another rebel.',bonuses:{str:2,per:1,int:-1},startFlag:'role_ace'},
  'Shadow Operative':{desc:'You work in the spaces between. Intelligence gathering, sabotage, assassination. The Black Knights need a public face and a hidden blade — you are the blade.',bonuses:{per:2,int:1,cou:-1},startFlag:'role_shadow'},
  'Lab Member':{desc:'You stumbled into the Future Gadget Laboratory by accident and stayed because the experiments fascinated you. Your contribution is creativity — you see connections between ideas that others miss.',bonuses:{int:2,per:1,str:-1},startFlag:'role_lab_member'},
  'SERN Defector':{desc:'You worked for SERN — the European organization secretly researching time travel. You know their methods, their goals, and their willingness to kill. You left because you saw what they did to test subjects.',bonuses:{int:2,cou:1,cha:-1},startFlag:'role_sern_defector'},
  'Time Traveler':{desc:'You have already traveled through time. You remember a future that no longer exists. The memories are fragmenting, but you know one thing: something terrible is coming, and this lab is the key to stopping it.',bonuses:{per:2,int:1,str:-1},startFlag:'role_time_traveler'},
  'Viking Warrior':{desc:'Born to raid. The sea is your road, the axe your voice. You live by the code of the Norsemen — glory in battle, honor in death, and Valhalla at the end. But something whispers that there is more to life than war.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_viking'},
  'Shieldmaiden':{desc:'You fight alongside men but are underestimated by all. Your shield arm is iron, your resolve unbreakable. In a world that sees women as prizes, you carved your name with a sword.',bonuses:{str:1,cou:2,cha:-1},startFlag:'role_shieldmaiden'},
  'Norse Explorer':{desc:'While others raid for silver, you sail for the horizon. You have seen lands no Norseman has named. You carry maps, not grudges. But the sea does not care about your peaceful intentions.',bonuses:{per:2,int:1,str:-1},startFlag:'role_explorer'},
  'Strategic Mind':{desc:'You see patterns others miss. Every routine has a crack. Every rule has an exception. While others play, you plan. The farm is a puzzle, and you intend to solve it.',bonuses:{int:2,per:1,str:-1},startFlag:'role_strategist'},
  'Compassionate Leader':{desc:'You feel everything — every laugh, every tear, every goodbye. Your empathy is your greatest weapon and your heaviest burden. You cannot leave anyone behind.',bonuses:{cha:2,cou:1,per:-1},startFlag:'role_compassionate'},
  'Survival Instinct':{desc:'Fight or flight is not a choice for you — it is a reflex. You are faster, stronger, more alert than the others. When danger comes, your body moves before your mind catches up.',bonuses:{str:2,per:1,int:-1},startFlag:'role_survival'},
  'Reckless Brawler':{desc:'You fight like you have nothing to lose — because you do not. No technique, no strategy, just raw aggression and a refusal to stay down. Devils fear the ones who do not fear death.',bonuses:{str:2,cou:1,int:-1},startFlag:'role_brawler'},
  'Contract Specialist':{desc:'Every devil has a price. You understand contracts — the give and take, the fine print, the loopholes. Where others fight, you negotiate. Your body is currency and you spend it wisely.',bonuses:{int:2,cha:1,str:-1},startFlag:'role_contract'},
  'Fiend Hybrid':{desc:'A devil inhabits your corpse — but you are still in here, somewhere. Two minds, one body, constant war. Your devil powers are immense but every use risks losing yourself entirely.',bonuses:{str:2,per:1,cha:-1},startFlag:'role_fiend'},
  'Psychic Prodigy':{desc:'Your psychic power is overwhelming — telekinesis, barriers, energy blasts. Everything comes naturally. Too naturally. You have never had to try, which means you have never learned to grow.',bonuses:{str:2,int:1,cha:-1},startFlag:'role_psychic'},
  'Emotional Empath':{desc:'You feel everything. Other people\'s emotions flood into you like a radio you cannot turn off. Your psychic power responds to feelings, not commands — which makes you unpredictable and deeply kind.',bonuses:{cha:2,per:1,str:-1},startFlag:'role_empath'},
  'Vessel of Power':{desc:'Something else lives inside you. A vast psychic entity that stirs when your emotions spike. You are its cage, its host, its reluctant partner. When you lose control, it does not.',bonuses:{str:2,per:1,int:-1},startFlag:'role_vessel'},
  'WISE Agent':{desc:'Trained by the best intelligence agency in Westalis. You excel at infiltration, combat, and thinking on your feet. Your handler trusts you with the most sensitive operations.',bonuses:{cou:2,per:1,cha:-1},startFlag:'role_wise_agent'},
  'Intelligence Analyst':{desc:'You see patterns in the noise. Intercepted communications, behavioral analysis, strategic planning — you are the brain behind the brawn. Field work terrifies you, but sometimes the desk is not enough.',bonuses:{int:2,per:1,str:-1},startFlag:'role_analyst'},
  'Field Operative':{desc:'You live in the shadows. Disguises, dead drops, safe houses — you have been undercover so long you sometimes forget which name is real. Twilight is the best, but you are not far behind.',bonuses:{cha:2,int:1,cou:-1},startFlag:'role_field_op'},
  'Street Cook':{desc:'You learned to cook in your family\'s tiny diner. No formal training, no fancy techniques — just instinct, flavor, and heart. The elite academy looks down on you. Prove them wrong.',bonuses:{cou:2,cha:1,int:-1},startFlag:'role_street_cook'},
  'Pastry Prodigy':{desc:'Sugar, butter, precision. Your desserts are architectural masterpieces. You won the National Junior Patisserie Championship at 14. Savory cooking is your weakness — and the academy demands versatility.',bonuses:{int:2,per:1,str:-1},startFlag:'role_pastry'},
  'Molecular Gastronomist':{desc:'Spherification. Sous vide. Flavor pairing algorithms. You treat cooking as science. Your dishes are brilliant — critics call them "technically perfect but soulless." You are here to prove them wrong.',bonuses:{int:2,per:1,cha:-1},startFlag:'role_molecular'},
  'Heavy Warrior':{desc:'You are built for war. Your chassis is reinforced plating, your weapons systems heavy-grade. You do not dodge — you absorb, endure, and hit back harder. The front line is your home.',bonuses:{str:2,cou:1,per:-1},startFlag:'role_heavy'},

function statCheck(statName, dc) {
  const stat = STATE.player.stats[statName] || 5;
  const roll = Math.floor(Math.random() * 10) + 1;
  const total = stat + roll;
  return {success: total >= dc, roll, stat, total, dc, statName};
}

function applyEffects(effects) {
  if (!effects) return;
  if (effects.flags) Object.assign(STATE.flags, effects.flags);
  if (effects.relationships) {
    for (const [k,v] of Object.entries(effects.relationships)) {
      STATE.relationships[k] = Math.max(-10, Math.min(10, (STATE.relationships[k]||0) + v));
    }
  }
  if (effects.stats) {
    for (const [k,v] of Object.entries(effects.stats)) {
      STATE.player.stats[k] = Math.max(1, Math.min(10, (STATE.player.stats[k]||5) + v));
    }
  }
  if (effects.inventory) {
    effects.inventory.forEach(item => {
      if (!STATE.inventory.includes(item)) STATE.inventory.push(item);
    });
  }
  // Auto-track heist crew size
  if (STATE.scenario === 'heist') {
    const recruited = ['nova_recruited','santos_recruited','wheels_recruited','brick_recruited','silk_recruited'].filter(f => STATE.flags[f]);
    if (recruited.length >= 3) STATE.flags.crew_3 = true;
  }
}

function scrollToStory() {
  setTimeout(() => {
    const storyText = document.querySelector('.story-text');
    if (storyText) storyText.scrollIntoView({behavior:'smooth',block:'start'});
  }, 80);
}

function showEffectToasts(effects) {
  if (!effects) return;
  const toasts = [];
  if (effects.stats) {
    for (const [k,v] of Object.entries(effects.stats)) {
      const name = STAT_NAMES[k] || k;
      if (v > 0) toasts.push({text:`${name} +${v}`,cls:'positive'});
      else if (v < 0) toasts.push({text:`${name} ${v}`,cls:'negative'});
    }
  }
  if (effects.relationships) {
    for (const [k,v] of Object.entries(effects.relationships)) {
      const name = k.charAt(0).toUpperCase()+k.slice(1);
      if (v > 0) toasts.push({text:`${name} +${v}`,cls:'positive'});
      else if (v < 0) toasts.push({text:`${name} ${v}`,cls:'negative'});
    }
  }
  if (effects.inventory) {
    effects.inventory.forEach(item => toasts.push({text:`+ ${item}`,cls:'neutral'}));
  }
  if (!toasts.length) return;
  const container = document.createElement('div');
  container.className = 'effect-toast';
  toasts.forEach((t,i) => {
    const el = document.createElement('div');
    el.className = `effect-toast-item ${t.cls}`;
    el.textContent = t.text;
    el.style.animationDelay = `${i*0.1}s, ${1.8+i*0.1}s`;
    container.appendChild(el);
  });
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 2500);
}

// A choice can point at a node that was planned but never written. Previously
// goToNode() just returned, so the button did nothing at all and the game
// looked frozen. Show an explicit "to be continued" instead.
function showUnwrittenBranch(nodeId) {
  const existing = document.querySelector('.tbc-toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'effect-toast tbc-toast';
  el.innerHTML = '<div class="effect-toast-item neutral" style="max-width:22rem;text-align:center;line-height:1.4">'
    + '<strong>To be continued</strong><br>This branch has not been written yet. Pick another choice.'
    + '</div>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
  console.warn('[scenario] unwritten branch:', STATE.scenario, '->', nodeId);
}

function goToNode(nodeId) {
  if (nodeId === '_menu') { STATE.screen = 'menu'; render(); return; }
  const scenario = SCENARIOS[STATE.scenario];
  if (!scenario) return;
  const node = scenario.nodes[nodeId];
  if (!node) { showUnwrittenBranch(nodeId); return; }
  STATE.currentNode = nodeId;
  STATE.history.push(nodeId);
  if (node.effects) { applyEffects(node.effects); showEffectToasts(node.effects); }
  render();
  scrollToStory();
}

function handleChoice(choice) {
  if (choice.effects) { applyEffects(choice.effects); showEffectToasts(choice.effects); }
  if (choice.check) {
    const result = statCheck(choice.check.stat, choice.check.dc);
    STATE.checkResult = result;
    STATE.pendingNext = result.success ? choice.next : (choice.failNext || choice.next);
    render();
  } else {
    goToNode(choice.next);
  }
}

function showStoryLog() {
  const sc = SCENARIOS[STATE.scenario];
  if (!sc) return;
  const entries = STATE.history.map((nodeId, i) => {
    const node = sc.nodes[nodeId];
    if (!node) return '';
    const preview = node.text.substring(0, 120).replace(/\n/g, ' ') + (node.text.length > 120 ? '...' : '');
    const isCurrent = i === STATE.history.length - 1;
    return `<div class="story-log-entry${isCurrent?' current':''}" onclick="jumpToStoryNode(${i})" style="padding:10px 14px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:${isCurrent?'var(--accent)':'#222'};border:1px solid ${isCurrent?'var(--accent)':'#333'}">
      <div style="font-size:.7rem;color:${isCurrent?'#fff':'var(--text-dim)'};margin-bottom:2px">Node ${i+1} of ${STATE.history.length}</div>
      <div style="font-size:.85rem;color:${isCurrent?'#fff':'var(--text)'}">${preview}</div>
    </div>`;
  }).join('');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div style="background:var(--card);padding:24px;border-radius:16px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;border:1px solid #333">
    <h3 style="margin:0 0 12px;font-size:1.1rem">Story Log</h3>
    <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:12px">Tap any entry to jump back to that point. Current position highlighted.</div>
    ${entries}
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()" style="margin-top:12px;width:100%;padding:10px;background:var(--accent);color:#fff;border-radius:10px;font-weight:600">Close</button>
  </div>`;
  document.body.appendChild(overlay);
}

function jumpToStoryNode(historyIndex) {
  if (historyIndex < 0 || historyIndex >= STATE.history.length) return;
  const nodeId = STATE.history[historyIndex];
  // Trim history to the selected point
  STATE.history = STATE.history.slice(0, historyIndex + 1);
  STATE.currentNode = nodeId;
  const overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
  render();
  scrollToStory();
}

function dismissCheck() {
  const next = STATE.pendingNext;
  STATE.checkResult = null;
  STATE.pendingNext = null;
  // Remove overlay from DOM (it was appended to document.body)
  const overlay = document.querySelector('.check-result');
  if (overlay) overlay.remove();
  if (next) goToNode(next);
  scrollToStory();
}

// CUTSCENE ENGINE — Graphic Novel Style
// ============================================================
// Cutscenes are arrays of panels shown sequentially (10s total).
// Each panel: {image: 'gradient/emoji', text: 'narration', caption: 'optional'}
// Text and images STAY visible — they build up like a graphic novel.
// Replay button lets you rewatch the sequence.

function playCutscene(panels, onComplete) {
  if (!panels || !panels.length) { if (onComplete) onComplete(); return; }
  const container = document.createElement('div');
  container.className = 'cutscene-container';
  container.style.cssText = 'max-width:700px;margin:0 auto;padding:16px';

  const progressBar = document.createElement('div');
  progressBar.className = 'cutscene-progress';
  progressBar.innerHTML = '<div class="fill" style="width:0%"></div>';
  container.appendChild(progressBar);

  const panelArea = document.createElement('div');
  panelArea.className = 'cutscene-panels';
  container.appendChild(panelArea);

  // Replace game main content with cutscene
  const gameMain = document.querySelector('.game-main');
  if (!gameMain) { if (onComplete) onComplete(); return; }
  const origContent = gameMain.innerHTML;
  gameMain.innerHTML = '';
  gameMain.appendChild(container);

  const perPanel = Math.max(2000, Math.floor(10000 / panels.length));
  let panelIdx = 0;
  let timer = null;

  function showNextPanel() {
    if (panelIdx >= panels.length) {
      progressBar.querySelector('.fill').style.width = '100%';
      // Add replay + continue buttons
      const controls = document.createElement('div');
      controls.style.cssText = 'text-align:center;margin-top:16px';
      controls.innerHTML = `
        <button class="cutscene-replay" id="cs-replay">&#8635; Replay</button>
        <button class="start-btn" id="cs-continue" style="max-width:300px;margin:12px auto;display:block;padding:12px">Continue</button>`;
      container.appendChild(controls);
      document.getElementById('cs-replay').onclick = () => { replayCutscene(); };
      document.getElementById('cs-continue').onclick = () => { if (onComplete) onComplete(); scrollToStory(); };
      return;
    }
    const p = panels[panelIdx];
    const panel = document.createElement('div');
    panel.className = 'cutscene-panel';
    panel.innerHTML = `
      <div class="panel-image" style="background:${p.image || 'linear-gradient(135deg,#2d3436,#636e72)'}">
        ${p.svg ? p.svg : p.icon ? `<span style="font-size:3rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))">${p.icon}</span>` : ''}
      </div>
      <div class="panel-text">${formatText(p.text)}${p.caption ? `<div class="caption">${p.caption}</div>` : ''}</div>`;
    panelArea.appendChild(panel);
    panelIdx++;
    const pct = Math.round((panelIdx / panels.length) * 100);
    progressBar.querySelector('.fill').style.width = pct + '%';
    panel.scrollIntoView({behavior:'smooth',block:'end'});
    if (panelIdx < panels.length) {
      timer = setTimeout(showNextPanel, perPanel);
    } else {
      timer = setTimeout(showNextPanel, 1000);
    }
  }

  function replayCutscene() {
    if (timer) clearTimeout(timer);
    panelArea.innerHTML = '';
    progressBar.querySelector('.fill').style.width = '0%';
    const ctrl = container.querySelector('#cs-replay')?.closest('div');
    if (ctrl) ctrl.remove();
    panelIdx = 0;
    timer = setTimeout(showNextPanel, 500);
  }

  timer = setTimeout(showNextPanel, 500);
}

// Nodes can have a `cutscene` array to trigger before showing the node text.
// We hook into goToNode to check for cutscenes.
const _origGoToNode = goToNode;
goToNode = function(nodeId) {
  if (nodeId === '_menu') { STATE.screen = 'menu'; render(); return; }
  const scenario = SCENARIOS[STATE.scenario];
  if (!scenario) return;
  const node = scenario.nodes[nodeId];
  if (!node) { showUnwrittenBranch(nodeId); return; }
  if (node.cutscene && node.cutscene.length) {
    // Set state first so sidebar updates
    STATE.currentNode = nodeId;
    STATE.history.push(nodeId);
    if (node.effects) applyEffects(node.effects);
    render();
    // Play cutscene, then re-render to show the normal node
    setTimeout(() => {
      playCutscene(node.cutscene, () => {
        render(); // Re-render to show normal text + choices after cutscene
      });
    }, 100);
  } else {
    _origGoToNode(nodeId);
  }
};

function startScenario(id) {
  const sc = SCENARIOS[id];
  if (!sc || !sc.startNode) return;
  STATE.scenario = id;
  STATE.screen = 'setup';
  STATE.player.role = '';
  STATE.preset = 'recommended';
  STATE.player.stats = {...PRESETS.recommended.stats};
  render();
}

function beginGame() {
  if (!STATE.player.name.trim()) { STATE.player.name = 'Player'; }
  const sc = SCENARIOS[STATE.scenario];
  STATE.screen = 'game';
  STATE.currentNode = sc.startNode;
  STATE.flags = {};
  STATE.relationships = {...(sc.relationships || {})};
  STATE.inventory = [];
  STATE.history = [sc.startNode];
  STATE.sidebarOpen = false;
  // Apply role stat bonuses and start flag
  const rd = ROLE_DATA[STATE.player.role];
  if (rd) {
    for (const [k,v] of Object.entries(rd.bonuses)) {
      STATE.player.stats[k] = Math.max(1, Math.min(10, (STATE.player.stats[k]||5) + v));
    }
    if (rd.startFlag) STATE.flags[rd.startFlag] = true;
  }
  if (sc.nodes[sc.startNode]?.effects) applyEffects(sc.nodes[sc.startNode].effects);
  render();
}

// SAVE / LOAD — Unlimited Dynamic Saves
// ============================================================
function getSaveIndex() {
  try { return JSON.parse(localStorage.getItem('sg_saves') || '[]'); } catch(e) { return []; }
}
function setSaveIndex(ids) { localStorage.setItem('sg_saves', JSON.stringify(ids)); }

function saveGame(saveId) {
  const data = {
    scenario: STATE.scenario,
    player: JSON.parse(JSON.stringify(STATE.player)),
    currentNode: STATE.currentNode,
    flags: {...STATE.flags},
    relationships: {...STATE.relationships},
    inventory: [...STATE.inventory],
    history: [...STATE.history],
    preset: STATE.preset,
    savedAt: new Date().toISOString()
  };
  localStorage.setItem('sg_save_' + saveId, JSON.stringify(data));
  const idx = getSaveIndex();
  if (!idx.includes(saveId)) { idx.unshift(saveId); setSaveIndex(idx); }
  else { idx.splice(idx.indexOf(saveId), 1); idx.unshift(saveId); setSaveIndex(idx); }
}

function createNewSave() {
  const saveId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  saveGame(saveId);
  return saveId;
}

function loadGame(saveId) {
  const raw = localStorage.getItem('sg_save_' + saveId);
  if (!raw) return false;
  const data = JSON.parse(raw);
  Object.assign(STATE, {
    scenario: data.scenario,
    player: data.player,
    currentNode: data.currentNode,
    flags: data.flags || {},
    relationships: data.relationships || {},
    inventory: data.inventory || [],
    history: data.history || [],
    preset: data.preset || 'recommended',
    screen: 'game',
    checkResult: null,
    pendingNext: null
  });
  render();
  return true;
}

function getSaveInfo(saveId) {
  const raw = localStorage.getItem('sg_save_' + saveId);
  if (!raw) return null;
  const data = JSON.parse(raw);
  const meta = SCENARIO_META.find(m => m.id === data.scenario);
  return {
    id: saveId,
    scenario: meta ? meta.title : data.scenario,
    name: data.player.name,
    role: data.player.role,
    node: data.currentNode,
    date: new Date(data.savedAt).toLocaleString(),
    steps: (data.history||[]).length
  };
}

function deleteSave(saveId) {
  localStorage.removeItem('sg_save_' + saveId);
  const idx = getSaveIndex();
  const pos = idx.indexOf(saveId);
  if (pos !== -1) { idx.splice(pos, 1); setSaveIndex(idx); }
}

// Migrate old fixed slots to dynamic system
(function migrateSaves() {
  const idx = getSaveIndex();
  for (let i = 0; i < 5; i++) {
    const key = 'sg_save_' + i;
    const raw = localStorage.getItem(key);
    if (raw && !idx.includes(String(i))) {
      idx.push(String(i));
    }
  }
  if (idx.length) setSaveIndex(idx);
})();

// ============================================================
// PRIVATE UNLOCK
// ============================================================
function handleTitleTap() {
  const now = Date.now();
  if (now - STATE.lastTap > 3000) STATE.titleTaps = 0;
  STATE.lastTap = now;
  STATE.titleTaps++;
  if (STATE.titleTaps >= 5) {
    STATE.titleTaps = 0;
    showUnlockModal();
  }
}

function showUnlockModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Enter Access Code</h3>
      <p style="color:var(--text-dim);font-size:.85rem;margin-bottom:12px">Private scenarios require an access code.</p>
      <div class="unlock-input">
        <input type="password" id="unlock-code" placeholder="CODE" maxlength="20" autocomplete="off">
        <button onclick="tryUnlock()">Unlock</button>
      </div>
      <div id="unlock-error" class="unlock-error"></div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('input').focus();
  overlay.querySelector('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });
}

function tryUnlock() {
  const input = document.getElementById('unlock-code');
  const err = document.getElementById('unlock-error');
  if (input.value.toUpperCase() === PRIVATE_CODE) {
    STATE.privateUnlocked = true;
    localStorage.setItem('sg_private', 'true');
    document.querySelector('.modal-overlay').remove();
    render();
  } else {
    err.textContent = 'Invalid code.';
    input.value = '';
    input.focus();
  }
}

// ============================================================
// RENDERING
// ============================================================
const app = document.getElementById('app');

function render() {
  switch(STATE.screen) {
    case 'menu': renderMenu(); break;
    case 'setup': renderSetup(); break;
    case 'game': renderGameScreen(); break;
  }
}

                    <ellipse cx="8" cy="42" rx="10" ry="14" fill="#c0392b"/>
                    <!-- Blue sides -->
                    <ellipse cx="8" cy="44" rx="10" ry="12" fill="#1a3a6a" clip-path="inset(0 25% 0 25%)"/>
                    <!-- Head -->
                    <circle cx="8" cy="24" r="10" fill="#c0392b"/>
                    <!-- Web lines on head -->
                    <line x1="8" y1="14" x2="8" y2="34" stroke="#8b0000" stroke-width=".5" opacity=".6"/>
                    <line x1="-2" y1="24" x2="18" y2="24" stroke="#8b0000" stroke-width=".5" opacity=".6"/>
                    <line x1="1" y1="16" x2="15" y2="32" stroke="#8b0000" stroke-width=".4" opacity=".4"/>
                    <line x1="15" y1="16" x2="1" y2="32" stroke="#8b0000" stroke-width=".4" opacity=".4"/>
                    <!-- Eyes -->
                    <path d="M2,22 L5,19 L9,22 L5,24 Z" fill="white" stroke="#222" stroke-width=".5"/>
                    <path d="M14,22 L11,19 L7,22 L11,24 Z" fill="white" stroke="#222" stroke-width=".5"/>
                    <!-- Arms -->
                    <line x1="-2" y1="36" x2="-16" y2="28" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
                    <line x1="18" y1="36" x2="32" y2="24" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
                    <!-- Hands -->
                    <circle cx="-16" cy="28" r="2.5" fill="#c0392b"/>
                    <circle cx="32" cy="24" r="2.5" fill="#c0392b"/>
                    <!-- Web from hand -->
                    <line x1="32" y1="24" x2="55" y2="10" stroke="#ddd" stroke-width=".6" opacity=".4"/>
                    <line x1="32" y1="24" x2="50" y2="18" stroke="#ddd" stroke-width=".4" opacity=".3"/>
                    <!-- Legs -->
                    <line x1="2" y1="54" x2="-5" y2="74" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
                    <line x1="14" y1="54" x2="20" y2="72" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
                    <!-- Red boots -->
                    <circle cx="-5" cy="74" r="3" fill="#c0392b"/>
                    <circle cx="20" cy="72" r="3" fill="#c0392b"/>
                    <!-- Spider emblem on chest -->
                    <ellipse cx="8" cy="40" rx="3" ry="2" fill="#111" opacity=".7"/>
                    <!-- Web pattern on torso -->
                    <line x1="8" y1="30" x2="8" y2="54" stroke="#8b0000" stroke-width=".4" opacity=".5"/>
                    <line x1="-2" y1="42" x2="18" y2="42" stroke="#8b0000" stroke-width=".4" opacity=".5"/>
                  </g>
                  <!-- Moon glow -->
                  <circle cx="160" cy="25" r="14" fill="#223" opacity=".3"/>
                  <circle cx="160" cy="25" r="10" fill="#334" opacity=".2"/>
                </svg>
              </div>
              <div class="city-bg"></div>
            ` : `<span class="icon">${m.icon}</span>`}
          </div>
          <span class="card-badge ${playable?'badge-playable':'badge-soon'}">${playable?(isNew?'NEW':'PLAY'):'COMING SOON'}</span>
          <div class="card-body">
            <h3>${m.title}</h3>
            <p>${m.desc}</p>
            <div class="card-tags">${m.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
          </div>
        </div>`;
    }).join('');

  const hasSaves = getSaveIndex().some(id => getSaveInfo(id));

  app.innerHTML = `
    <div class="menu-screen">
      <div class="menu-header">
        <h1 onclick="handleTitleTap()">Scenario Generator</h1>
        <p>Choose your story. Every decision matters.</p>
      </div>
      ${hasSaves ? `<div style="text-align:center;margin-bottom:20px"><button class="topbar-btn" onclick="showLoadModal()" style="padding:10px 24px;font-size:.9rem">Continue Saved Game</button></div>` : ''}
      <div class="scenario-grid">${cards}</div>
    </div>`;
}

function renderSetup() {
  const sc = SCENARIOS[STATE.scenario];
  const meta = sc.meta;
  const roles = sc.roles;

  const roleHTML = roles.length ? `
    <div class="setup-group">
      <label>Choose Your Role</label>
      <div class="role-options">
        ${roles.map(r => {
          const rd = ROLE_DATA[r];
          const bonusText = rd ? Object.entries(rd.bonuses).map(([k,v]) => `${STAT_NAMES[k]||k} ${v>0?'+':''}${v}`).join(', ') : '';
          return `<button class="role-btn ${STATE.player.role===r?'selected':''}" onclick="STATE.player.role='${r}';render()"><strong>${r}</strong>${rd?`<div style="font-size:.75rem;color:var(--text-dim);margin-top:4px">${rd.desc}</div><div style="font-size:.7rem;color:#6c5ce7;margin-top:2px">${bonusText}</div>`:''}</button>`;
        }).join('')}
      </div>
    </div>` : '';

  const presetHTML = Object.entries(PRESETS).map(([k,v]) => `
    <button class="preset-btn ${STATE.preset===k?'selected':''}" onclick="selectPreset('${k}')">
      <div class="name">${v.label}</div>
      <div class="desc">${v.desc}</div>
    </button>`).join('');

  const customHTML = STATE.preset === 'custom' ? `
    <div class="custom-stats">
      ${Object.entries(STAT_NAMES).map(([k,name]) => `
        <div class="stat-input">
          <div class="stat-name">${name}</div>
          <div class="stat-val">${STATE.player.stats[k]}</div>
          <div class="stat-btns">
            <button onclick="adjustStat('${k}',-1)">-</button>
            <button onclick="adjustStat('${k}',1)">+</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="points-left">Points remaining: ${30 - Object.values(STATE.player.stats).reduce((a,b)=>a+b,0)}</div>` : '';

  const canStart = STATE.player.name.trim() && (roles.length === 0 || STATE.player.role) && (STATE.preset !== 'custom' || Object.values(STATE.player.stats).reduce((a,b)=>a+b,0) === 30);

  app.innerHTML = `
    <div class="setup-screen">
      <h2 style="background:${meta.gradient};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${meta.title}</h2>
      <div class="setup-group">
        <label>Your Name</label>
        <input type="text" id="player-name" value="${STATE.player.name}" placeholder="Enter your name..." maxlength="20" oninput="STATE.player.name=this.value">
      </div>
      ${roleHTML}
      <div class="setup-group">
        <label>Difficulty Preset</label>
        <div class="preset-options">${presetHTML}</div>
        ${customHTML}
      </div>
      <button class="start-btn" ${canStart?'':"disabled"} onclick="beginGame()">BEGIN</button>
      <button class="back-link" onclick="STATE.screen='menu';render()">Back to scenarios</button>
    </div>`;
}

function selectPreset(key) {
  STATE.preset = key;
  if (key !== 'custom') {
    STATE.player.stats = {...PRESETS[key].stats};
  } else {
    STATE.player.stats = {str:5,cha:5,int:5,per:5,cou:5,lck:5};
  }
  render();
}

function adjustStat(stat, delta) {
  const total = Object.values(STATE.player.stats).reduce((a,b)=>a+b,0);
  const newVal = STATE.player.stats[stat] + delta;
  if (newVal < 1 || newVal > 10) return;
  if (delta > 0 && total >= 30) return;
  STATE.player.stats[stat] = newVal;
  render();
}

function renderGameScreen() {
  const sc = SCENARIOS[STATE.scenario];
  const node = sc.nodes[STATE.currentNode];
  if (!node) return;
  const meta = sc.meta;

  const moodColor = node.mood || '#1a1a2e';
  const sceneGrad = `linear-gradient(135deg, ${moodColor}, ${moodColor}88, var(--bg))`;

  const moodInner = `<span class="icon" style="font-size:2.5rem">${meta.icon}</span>`;

  // Filter choices by flags/conditions/role
  const choices = (node.choices||[]).filter(c => {
    if (c.requires) {
      for (const [k,v] of Object.entries(c.requires)) {
        if (STATE.flags[k] !== v) return false;
      }
    }
    if (c.minRel) {
      for (const [k,v] of Object.entries(c.minRel)) {
        if ((STATE.relationships[k]||0) < v) return false;
      }
    }
    if (c.requireRole && STATE.player.role !== c.requireRole) return false;
    if (c.requireFlag) {
      if (c.requireFlag.startsWith('!')) {
        if (STATE.flags[c.requireFlag.slice(1)]) return false;
      } else {
        if (!STATE.flags[c.requireFlag]) return false;
      }
    }
    return true;
  });

  const choiceHTML = choices.map((c,i) => {
    let extra = '';
    if (c.check) extra += `<div class="check-info">[${STAT_NAMES[c.check.stat]} check — DC ${c.check.dc}]</div>`;
    if (c.relHint) extra += `<div class="rel-info">${c.relHint}</div>`;
    // Effect preview tags
    let tags = '';
    if (c.effects) {
      const tagParts = [];
      if (c.effects.stats) {
        for (const [k,v] of Object.entries(c.effects.stats)) {
          const cls = v > 0 ? 'stat-up' : 'stat-down';
          tagParts.push(`<span class="effect-tag ${cls}">${STAT_NAMES[k]||k} ${v>0?'+':''}${v}</span>`);
        }
      }
      if (c.effects.relationships) {
        for (const [k,v] of Object.entries(c.effects.relationships)) {
          const cls = v > 0 ? 'rel-up' : 'rel-down';
          tagParts.push(`<span class="effect-tag ${cls}">${k.charAt(0).toUpperCase()+k.slice(1)} ${v>0?'+':''}${v}</span>`);
        }
      }
      if (tagParts.length) tags = `<div class="effect-tags">${tagParts.join('')}</div>`;
    }
    return `<button class="choice-btn" onclick="handleChoice(SCENARIOS['${STATE.scenario}'].nodes['${STATE.currentNode}'].choices[${(node.choices||[]).indexOf(c)}])">${c.text}${extra}${tags}</button>`;
  }).join('');

  // Sidebar: stats
  const statsHTML = Object.entries(STAT_NAMES).map(([k,name]) => {
    const val = STATE.player.stats[k]||5;
    return `<div class="stat-row"><span>${name}</span><span>${val}</span><div class="stat-bar"><div class="stat-fill" style="width:${val*10}%"></div></div></div>`;
  }).join('');

  // Sidebar: relationships
  const relEntries = Object.entries(STATE.relationships).filter(([k,v]) => v !== 0);
  const relHTML = relEntries.length ? relEntries.map(([k,v]) => {
    const cls = v > 0 ? 'positive' : 'negative';
    return `<div class="rel-row"><span>${k.charAt(0).toUpperCase()+k.slice(1)}</span><span class="val ${cls}">${v>0?'+':''}${v}</span></div>`;
  }).join('') : '<div style="font-size:.8rem;color:var(--text-dim)">No relationships yet</div>';

  // Sidebar: inventory
  const invHTML = STATE.inventory.length ? STATE.inventory.map(i => `<div class="inv-item">- ${i}</div>`).join('') : '<div style="font-size:.8rem;color:var(--text-dim)">Empty</div>';

  app.innerHTML = `
    <div class="game-screen">
      <div class="game-topbar">
        <div class="title">${meta.title}</div>
        <div class="actions">
          <button class="topbar-btn" onclick="showStoryLog()">Log</button>
          <button class="topbar-btn" onclick="showSaveModal()">Save</button>
          <button class="topbar-btn" onclick="showLoadModal()">Load</button>
          <button class="topbar-btn" onclick="if(confirm('Return to menu? Unsaved progress will be lost.'))STATE.screen='menu',render()">Menu</button>
        </div>
      </div>
      <div class="game-body">
        <div class="game-main">
          <div class="scene-mood" style="background:${sceneGrad}">
            ${moodInner}
          </div>
          <button class="sidebar-toggle" onclick="STATE.sidebarOpen=!STATE.sidebarOpen;document.querySelector('.game-sidebar').classList.toggle('open')">Stats & Inventory</button>
          <div class="story-text"><div class="new-text">${formatText(node.text)}</div></div>
          <div class="choice-list">${choiceHTML}</div>
        </div>
        <div class="game-sidebar ${STATE.sidebarOpen?'open':''}">
          <div class="sidebar-section"><h4>Character</h4>
            <div style="font-size:.9rem;font-weight:600;margin-bottom:4px">${STATE.player.name}</div>
            ${STATE.player.role ? `<div style="font-size:.8rem;color:var(--text-dim)">${STATE.player.role}</div>` : ''}
          </div>
          <div class="sidebar-section"><h4>Stats</h4>${statsHTML}</div>
          <div class="sidebar-section"><h4>Relationships</h4>${relHTML}</div>
          <div class="sidebar-section"><h4>Inventory</h4>${invHTML}</div>
        </div>
      </div>
    </div>`;

  // Check result overlay — shows all stats alongside the check
  if (STATE.checkResult) {
    const cr = STATE.checkResult;
    const allStatsHTML = Object.entries(STAT_NAMES).map(([k,name]) => {
      const val = STATE.player.stats[k]||5;
      const isActive = k === cr.statName;
      return `<div style="display:flex;justify-content:space-between;padding:3px 8px;border-radius:6px;font-size:.8rem;${isActive?'background:var(--accent);color:#fff;font-weight:700':'color:var(--text-dim)'}"><span>${name}</span><span>${val}</span></div>`;
    }).join('');
    const overlay = document.createElement('div');
    overlay.className = 'check-result';
    overlay.innerHTML = `
      <div class="inner" style="max-width:420px">
        <div style="display:flex;gap:20px;align-items:flex-start">
          <div style="flex:1;text-align:center">
            <div style="font-size:.85rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px">${STAT_NAMES[cr.statName]} Check</div>
            <div class="roll-display ${cr.success?'success':'fail'}">${cr.success?'SUCCESS':'FAILED'}</div>
            <div class="roll-detail">${STAT_NAMES[cr.statName]} ${cr.stat} + Roll ${cr.roll} = ${cr.total} vs DC ${cr.dc}</div>
            <button onclick="dismissCheck()">Continue</button>
          </div>
          <div style="min-width:120px;border-left:1px solid #333;padding-left:12px">
            <div style="font-size:.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Your Stats</div>
            ${allStatsHTML}
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
  }
}

function formatText(text) {
  return text.replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[(.+?)\]/g, '<span style="color:var(--accent);font-style:italic">[$1]</span>');
}

function showSaveModal() {
  const idx = getSaveIndex();
  const existingSlots = idx.map(id => {
    const info = getSaveInfo(id);
    if (!info) return '';
    return `<div class="save-slot" style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;cursor:pointer" onclick="saveGame('${id}');this.closest('.modal-overlay').remove()">
        <div class="slot-name">${info.scenario}</div>
        <div class="slot-info">${info.name} (${info.role||'no role'}) | ${info.steps} steps | ${info.date}</div>
      </div>
      <button onclick="event.stopPropagation();if(confirm('Delete this save?')){deleteSave('${id}');this.closest('.modal-overlay').remove();showSaveModal()}" style="background:none;color:var(--danger);font-size:1.1rem;padding:4px 8px" title="Delete">&#10005;</button>
    </div>`;
  }).filter(Boolean).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>Save Game</h3>
    <div class="save-slot" onclick="createNewSave();this.closest('.modal-overlay').remove()" style="border:1px dashed var(--accent);text-align:center">
      <div class="slot-name" style="color:var(--accent)">+ New Save</div>
    </div>
    ${existingSlots}
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>`;
  document.body.appendChild(overlay);
}

function showLoadModal() {
  const idx = getSaveIndex();
  const slots = idx.map(id => {
    const info = getSaveInfo(id);
    if (!info) return '';
    return `<div class="save-slot" style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;cursor:pointer" onclick="loadGame('${id}');this.closest('.modal-overlay').remove()">
        <div class="slot-name">${info.scenario}</div>
        <div class="slot-info">${info.name} (${info.role||'no role'}) | ${info.steps} steps | ${info.date}</div>
      </div>
      <button onclick="event.stopPropagation();if(confirm('Delete this save?')){deleteSave('${id}');this.closest('.modal-overlay').remove();showLoadModal()}" style="background:none;color:var(--danger);font-size:1.1rem;padding:4px 8px" title="Delete">&#10005;</button>
    </div>`;
  }).filter(Boolean).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>Load Game</h3>${slots || '<div style="text-align:center;color:var(--text-dim);padding:20px">No saved games</div>'}
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>`;
  document.body.appendChild(overlay);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
