<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scenario Generator - SoloForte</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#14141f;--card-hover:#1a1a2e;--text:#e0e0e0;--text-dim:#888;--accent:#6c5ce7;--success:#00b894;--danger:#e17055;--warning:#fdcb6e}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* ===== MENU SCREEN ===== */
.menu-screen{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.menu-header{text-align:center;padding:40px 0 32px;user-select:none}
.menu-header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#6c5ce7,#a29bfe,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.menu-header p{color:var(--text-dim);margin-top:8px;font-size:0.95rem}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.scenario-card{background:var(--card);border-radius:16px;overflow:hidden;transition:all .25s;position:relative;border:1px solid #222}
.scenario-card:hover{transform:translateY(-4px);border-color:#444;background:var(--card-hover)}
.scenario-card.locked{opacity:.6;pointer-events:auto}
.scenario-card.locked:hover{transform:none}
.card-banner{height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-banner .icon{font-size:3rem;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.card-banner .icon-art{z-index:1;width:100%;height:100%;position:absolute;inset:0}
.spiderman-banner{overflow:hidden}
.spiderman-banner .city-bg{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(0deg,#0a0a1a 0%,transparent 100%)}
.spiderman-banner .city-bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:
  linear-gradient(90deg,transparent 3%,#111 3%,#111 7%,transparent 7%,transparent 12%,#151515 12%,#151515 18%,transparent 18%,transparent 25%,#111 25%,#111 30%,transparent 30%,transparent 38%,#131313 38%,#131313 42%,transparent 42%,transparent 55%,#111 55%,#111 62%,transparent 62%,transparent 70%,#141414 70%,#141414 76%,transparent 76%,transparent 85%,#111 85%,#111 92%,transparent 92%);
  mask:linear-gradient(0deg,#000 60%,transparent);-webkit-mask:linear-gradient(0deg,#000 60%,transparent)}
.card-banner::before{content:'';position:absolute;inset:0;opacity:.7}
.card-body{padding:16px}
.card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.card-body p{font-size:.85rem;color:var(--text-dim);line-height:1.5;margin-bottom:12px;min-height:40px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.card-tag{font-size:.7rem;padding:3px 8px;border-radius:99px;background:rgba(108,92,231,.15);color:#a29bfe}
.card-badge{position:absolute;top:12px;right:12px;font-size:.7rem;padding:4px 10px;border-radius:99px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-playable{background:rgba(0,184,148,.2);color:#00b894}
.badge-soon{background:rgba(136,136,136,.2);color:#888}
.badge-new{background:rgba(253,121,168,.2);color:#fd79a8}

/* ===== SETUP SCREEN ===== */
.setup-screen{max-width:600px;margin:0 auto;padding:24px 16px}
.setup-screen h2{text-align:center;font-size:1.8rem;margin-bottom:24px;font-weight:700}
.setup-group{margin-bottom:20px}
.setup-group label{display:block;font-size:.85rem;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.setup-group input[type="text"]{width:100%;padding:12px 16px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:var(--text);font-size:1rem}
.setup-group input:focus{border-color:var(--accent)}
.role-options{display:flex;gap:10px;flex-wrap:wrap}
.role-btn{padding:12px 18px;background:#1a1a2e;border:2px solid #333;border-radius:10px;color:var(--text);font-size:.9rem;transition:all .2s;text-align:left;flex:1;min-width:140px}
.role-btn:hover{border-color:#555}
.role-btn.selected{border-color:var(--accent);background:rgba(108,92,231,.15)}
.preset-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preset-btn{padding:14px;background:#1a1a2e;border:2px solid #333;border-radius:12px;color:var(--text);text-align:left;transition:all .2s}
.preset-btn:hover{border-color:#555}
.preset-btn.selected{border-color:var(--accent);background:rgba(108,92,231,.15)}
.preset-btn .name{font-weight:700;font-size:.95rem;margin-bottom:4px}
.preset-btn .desc{font-size:.75rem;color:var(--text-dim)}
.custom-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.stat-input{background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:10px;text-align:center}
.stat-input .stat-name{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.stat-input .stat-val{font-size:1.4rem;font-weight:700;margin:4px 0;color:var(--accent)}
.stat-input .stat-btns{display:flex;justify-content:center;gap:8px}
.stat-input .stat-btns button{width:28px;height:28px;border-radius:50%;background:#333;color:var(--text);font-size:1rem;display:flex;align-items:center;justify-content:center}
.stat-input .stat-btns button:hover{background:#444}
.points-left{text-align:center;font-size:.9rem;color:var(--accent);margin-top:8px}
.start-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:1.1rem;font-weight:700;border-radius:12px;margin-top:24px;transition:all .2s;text-transform:uppercase;letter-spacing:1px}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,.3)}
.start-btn:disabled{opacity:.4;transform:none;cursor:not-allowed}
.back-link{display:block;text-align:center;margin-top:16px;color:var(--text-dim);font-size:.85rem;cursor:pointer;background:none}
.back-link:hover{color:var(--text)}

/* ===== GAME SCREEN ===== */
.game-screen{display:flex;flex-direction:column;min-height:100vh}
.game-topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(20,20,31,.95);border-bottom:1px solid #222;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.game-topbar .title{font-weight:700;font-size:.95rem}
.game-topbar .actions{display:flex;gap:8px}
.topbar-btn{padding:6px 14px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text-dim);font-size:.8rem;transition:all .2s}
.topbar-btn:hover{color:var(--text);border-color:#555}
.game-body{flex:1;display:flex;max-width:1000px;margin:0 auto;width:100%;padding:24px 16px}
.game-main{flex:1;max-width:700px}
.game-sidebar{width:220px;margin-left:24px;flex-shrink:0}
.scene-mood{height:160px;border-radius:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.scene-mood::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 60%,var(--bg))}
.story-text{font-size:1.05rem;line-height:1.8;margin-bottom:24px;white-space:pre-wrap}
.story-text .new-text{animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.choice-btn{padding:14px 18px;background:#1a1a2e;border:2px solid #2a2a3e;border-radius:12px;color:var(--text);font-size:.95rem;text-align:left;transition:all .2s;position:relative}
.choice-btn:hover{border-color:var(--accent);background:rgba(108,92,231,.08);transform:translateX(4px)}
.choice-btn .check-info{font-size:.75rem;color:var(--warning);margin-top:4px}
.choice-btn .rel-info{font-size:.75rem;color:#fd79a8;margin-top:2px}
.choice-btn .effect-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.choice-btn .effect-tag{font-size:.65rem;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.choice-btn .effect-tag.stat-up{background:rgba(0,184,148,.15);color:#00b894;border:1px solid rgba(0,184,148,.3)}
.choice-btn .effect-tag.stat-down{background:rgba(214,48,49,.15);color:#ff7675;border:1px solid rgba(214,48,49,.3)}
.choice-btn .effect-tag.rel-up{background:rgba(253,121,168,.15);color:#fd79a8;border:1px solid rgba(253,121,168,.3)}
.choice-btn .effect-tag.rel-down{background:rgba(214,48,49,.15);color:#ff7675;border:1px solid rgba(214,48,49,.3)}
.choice-btn.disabled{opacity:.4;pointer-events:none}
.effect-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.effect-toast-item{padding:8px 18px;border-radius:10px;font-size:.85rem;font-weight:700;animation:toastIn .4s ease-out,toastOut .4s ease-in 1.8s forwards;white-space:nowrap;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.effect-toast-item.positive{background:rgba(0,184,148,.9);color:#fff}
.effect-toast-item.negative{background:rgba(214,48,49,.9);color:#fff}
.effect-toast-item.neutral{background:rgba(108,92,231,.9);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}

/* Stat check result overlay */
.check-result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:100;animation:fadeIn .3s}
.check-result .inner{background:var(--card);padding:32px;border-radius:20px;text-align:center;max-width:360px;border:2px solid #333}
.check-result .roll-display{font-size:2.5rem;font-weight:800;margin:16px 0}
.check-result .roll-display.success{color:var(--success)}
.check-result .roll-display.fail{color:var(--danger)}
.check-result .roll-detail{font-size:.85rem;color:var(--text-dim);margin-bottom:16px}
.check-result button{padding:10px 28px;background:var(--accent);color:#fff;border-radius:10px;font-size:.95rem;font-weight:600}

/* Sidebar */
.sidebar-section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #222}
.sidebar-section h4{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:.85rem}
.stat-row .stat-bar{width:60px;height:6px;background:#222;border-radius:3px;overflow:hidden}
.stat-row .stat-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.rel-row{display:flex;justify-content:space-between;font-size:.82rem;padding:2px 0}
.rel-row .val.positive{color:var(--success)}
.rel-row .val.negative{color:var(--danger)}
.inv-item{font-size:.82rem;padding:2px 0;color:var(--text-dim)}

/* ===== SAVE/LOAD MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:20px;padding:28px;max-width:440px;width:90%;border:1px solid #333}
.modal h3{margin-bottom:16px;font-size:1.2rem}
.modal{max-height:80vh;overflow-y:auto}
.save-slot{padding:14px;background:#1a1a2e;border:1px solid #333;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.save-slot:hover{border-color:var(--accent)}
.save-slot .slot-name{font-weight:600;font-size:.9rem}
.save-slot .slot-info{font-size:.78rem;color:var(--text-dim);margin-top:4px}
.modal-close{display:block;width:100%;padding:12px;background:#333;color:var(--text);border-radius:10px;margin-top:12px;font-size:.9rem}
.modal-close:hover{background:#444}

/* ===== UNLOCK MODAL ===== */
.unlock-input{display:flex;gap:8px;margin-top:12px}
.unlock-input input{flex:1;padding:10px 14px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text);font-size:1rem;text-align:center;letter-spacing:4px}
.unlock-input button{padding:10px 20px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600}
.unlock-error{color:var(--danger);font-size:.85rem;margin-top:8px;text-align:center}

/* ===== END SCREEN ===== */
.end-screen{max-width:600px;margin:60px auto;padding:24px;text-align:center}
.end-screen h2{font-size:2rem;margin-bottom:16px}
.end-screen p{color:var(--text-dim);line-height:1.7;margin-bottom:24px}
.end-screen button{padding:14px 32px;background:var(--accent);color:#fff;border-radius:12px;font-size:1rem;font-weight:600;margin:6px}

/* ===== CUTSCENE ===== */
.cutscene-panel{background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden;border:1px solid #222;animation:panelSlideIn .6s ease}
@keyframes panelSlideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.cutscene-panel .panel-image{width:100%;height:180px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:3rem}
.cutscene-panel .panel-image svg{width:100%;height:100%;display:block}
.cutscene-panel .panel-text{padding:16px;font-size:.95rem;line-height:1.7;color:var(--text)}
.cutscene-panel .panel-text .caption{font-size:.8rem;color:var(--text-dim);font-style:italic;margin-top:8px}
.cutscene-replay{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:var(--text-dim);font-size:.8rem;margin-bottom:16px;cursor:pointer;position:relative;z-index:5}
.cutscene-replay:hover{color:var(--text);border-color:#555}
.cutscene-progress{height:3px;background:#222;border-radius:2px;margin-bottom:16px;overflow:hidden}
.cutscene-progress .fill{height:100%;background:var(--accent);transition:width .3s linear}

/* ===== MOBILE ===== */
.sidebar-toggle{display:none;padding:10px 16px;background:var(--card);border:1px solid #222;border-radius:10px;color:var(--text-dim);font-size:.85rem;margin-bottom:12px;width:100%}
@media(max-width:768px){
  .menu-header h1{font-size:1.8rem}
  .scenario-grid{grid-template-columns:1fr}
  .game-body{flex-direction:column;padding:16px 12px}
  .game-sidebar{width:100%;margin-left:0;margin-top:16px;display:none}
  .game-sidebar.open{display:block}
  .sidebar-toggle{display:block}
  .scene-mood{height:120px}
  .preset-options{grid-template-columns:1fr}
  .custom-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// CONFIG
// ============================================================
const PRIVATE_CODE = 'JK2E3';
const STAT_NAMES = {str:'Strength',cha:'Charisma',int:'Intelligence',per:'Perception',cou:'Courage',lck:'Luck'};
const PRESETS = {
  recommended:{label:'Recommended',desc:'Balanced stats. The intended experience.',stats:{str:5,cha:5,int:5,per:5,cou:5,lck:5}},

// ============================================================
// STATE
// ============================================================
const STATE = {
  screen:'menu',
  scenario:null,
  player:{name:'',role:'',stats:{str:5,cha:5,int:5,per:5,cou:5,lck:5}},
  currentNode:null,
  flags:{},
  relationships:{},
  inventory:[],
  history:[],
  preset:'recommended',

// ============================================================
// SCENARIOS

const SCENARIO_META = [
  {id:'soldier',title:'Soldier Interrogation',desc:'You wake up in a cold concrete room. A bright light burns overhead. Someone wants answers.',icon:'&#127894;',gradient:'linear-gradient(135deg,#2d3436,#636e72)',tags:['Military','Thriller'],status:'soon',private:false},
  {id:'transformer',title:'Transformer vs Soldiers',desc:'Metal giant against an entire battalion. Choose your side in a war between steel and flesh.',icon:'&#129302;',gradient:'linear-gradient(135deg,#0984e3,#e17055)',tags:['Sci-Fi','Action'],status:'soon',private:false},

  {id:'examcrunch',title:'Exam Crunch',desc:'72 hours until the biggest exam of your life. Zero preparation. How do you survive?',icon:'&#128218;',gradient:'linear-gradient(135deg,#ffeaa7,#fdcb6e)',tags:['Comedy','Strategy'],status:'soon',private:false},
  {id:'prisonbreak',title:'Prison Break',desc:'Maximum security. Minimum time. One chance to get out before they move you to the hole.',icon:'&#128274;',gradient:'linear-gradient(135deg,#636e72,#e17055)',tags:['Thriller','Stealth'],status:'soon',private:false},

  fratparty:['Nervous Freshman','Confident Transfer','Star Athlete']
};
const ROLE_DATA = {

  'Confident Transfer':{desc:'Transferred from another school. You know the game — just not these people.',bonuses:{cha:2,int:1,str:-1},startFlag:'role_transfer'},
  'Star Athlete':{desc:'Everyone knows your name from the roster. Tonight you\'re just trying to have fun.',bonuses:{str:2,cou:1,cha:-1},startFlag:'role_athlete'}

// ============================================================
// SCENARIO DATA — ZOMBIE OUTBREAK (Chapter 1)
// ============================================================
const ZOMBIE_NODES = {
  zo_wake:{
    text:`Your eyes snap open. Something is wrong.

Jake's texts come in rapid fire:

"something happened downtown dont know what"
"people are attacking each other"
"im at the gas station on 5th DO NOT GO OUTSIDE WITHOUT SOMETHING TO PROTECT YOURSELF"
"tyler is dead dude. tyler is dead. im not joking"

      {text:'Call Jake back.',next:'zo_call_jake'}
    ]
  },
  zo_call_jake:{
    text:`The phone rings. Once. Twice. Five times. Voicemail.

You try again. Straight to voicemail this time.

One more try. It rings — then picks up. But it's not Jake's voice. It's breathing. Wet, ragged breathing, like someone choking on their own throat. Then a sound that isn't a word, something between a growl and a moan.

The call disconnects.

Your hands are shaking.`,
    scene:'dark',mood:'#d63031',

></g><!-- Zombie grabbing person --><g transform="translate(200,110)"><circle cx="0" cy="8" r="5" fill="#8b0000" opacity=".8"/><line x1="0" y1="13" x2="-2" y2="30" stroke="#8b0000" stroke-width="3"/><line x1="-2" y1="20" x2="12" y2="14" stroke="#8b0000" stroke-width="2.5"/><circle cx="15" cy="10" r="4.5" fill="#555"/><line x1="15" y1="15" x2="14" y2="28" stroke="#555" stroke-width="2.5"/><path d="M12,14 Q13,8 16,6" stroke="#666" stroke-width="1.5" fill="none"/></g><!-- Red atmosphere --><rect x="0" y="0" width="400" height="180" fill="#d63031" opacity=".06"/><!-- Building silhouettes --><rect x="0" y="30" width="40" height="120" fill="#0a0a0a"/><rect x="350" y="45" width="50" height="105" fill="#0a0a0a"/></svg>`,text:'People are running. Behind them, others move WRONG — stumbling, lurching, impossibly fast. One catches a woman by the hair. You look away.',caption:'They\'re not human anymore.'},

    ],
    text:`You pull the blinds back and freeze.

The street four floors below is chaos. A car is flipped on its side, still smoking. People are running — some in pajamas, some barefoot. And behind them, others are moving wrong. Stumbling, lurching, fast when they shouldn't be. One of them catches a woman by the hair and drags her down. You look away before you see the rest.

Red and blue lights flash from a police cruiser at the intersection, but the doors are open and nobody's inside. A military Humvee rolls past, soldiers on top scanning rooftops with mounted lights.

This isn't a riot. This isn't a protest. The city is falling apart.

You need to move. But first — you need something to fight with.`,
    scene:'dark',mood:'#d63031',
    effects:{flags:{saw_outside:true}},
    choices:[
      {text:'Turn away from the window. Look around.',next:'zo_weapon'},
      {text:'Step back. Push the bookshelf against the door.',next:'zo_barricade'}
    ]
  },
  zo_barricade:{
    text:`You shove the bookshelf against the front door. Drag the kitchen table behind it. Wedge a chair under the handle for good measure.

For twenty minutes, it feels like the right call. You sit in the dark, listening to the world end outside your window.

Then the scratching starts. Not at your door — at your neighbor's. Mrs. Chen's apartment, right next to yours. You hear her deadbolt turn. Her door opens. She says "Hello? Is someone—"

The scream cuts through the wall like it's paper.

Then silence. Then footsteps — slow, dragging — and something bumps against YOUR door. The bookshelf shifts an inch.

You can't stay here.`,
    scene:'dark',mood:'#e17055',
    effects:{flags:{tried_barricade:true}},
    choices:[
      {text:'Grab the kitchen knife and head for the fire escape',next:'zo_weapon_knife'},
      {text:'Go out the window to the fire escape — no time for weapons',next:'zo_fire_escape_bare'}
    ]
  },
  zo_weapon:{
    text:`You move through the apartment fast, adrenaline making everything sharp. What do you have?

The kitchen: a chef's knife, a cast iron skillet, a drawer full of utensils. The closet: a baseball bat from your college league days, still wrapped in athletic tape. The bathroom: nothing useful. Under the bed: a crowbar you forgot about from when you moved in.

You can carry one main weapon and one backup. Choose wisely — you don't know what's waiting in the hallway.`,
    scene:'dark',mood:'#636e72',
    choices:[
      {text:'Baseball bat — reach and power',next:'zo_hallway',effects:{inventory:['Baseball bat'],flags:{weapon:'bat'}}},
      {text:'Crowbar — versatile, can pry doors open too',next:'zo_hallway',effects:{inventory:['Crowbar'],flags:{weapon:'crowbar'}}},
      {text:'Chef\'s knife — light, fast, deadly',next:'zo_hallway',effects:{inventory:['Chef\'s knife'],flags:{weapon:'knife'}}},
      {text:'Cast iron skillet — nothing gets through this',next:'zo_hallway',effects:{inventory:['Cast iron skillet'],flags:{weapon:'skillet'}}}
    ]
  },
  zo_weapon_knife:{
    text:`You yank the biggest knife from the block. It's an 8-inch chef's knife — sharp, solid, terrifying in your shaking hand.

The thing on the other side of your door groans. The bookshelf scrapes another inch.

The fire escape. Now.`,
    scene:'dark',mood:'#e17055',
    effects:{inventory:['Chef\'s knife'],flags:{weapon:'knife'}},
    choices:[
      {text:'Go out the bedroom window to the fire escape',next:'zo_fire_escape'}
    ]
  },
  zo_fire_escape_bare:{
    text:`No time. You wrench the bedroom window open. The cold night air hits you like a wall. The fire escape is old, rusted, groaning under your weight as you climb out.

Below, the alley is empty. Above, someone's apartment has a light on — fifth floor. You're on the fourth.

You have nothing to defend yourself with. That's going to be a problem.`,
    scene:'dark',mood:'#636e72',
    effects:{flags:{no_weapon:true}},
    choices:[
      {text:'Climb down to the alley',next:'zo_alley'},
      {text:'Climb up — maybe the neighbor has supplies',next:'zo_upstairs',check:{stat:'str',dc:10}}
    ]
  },
  zo_fire_escape:{
    text:`You slide the window open and step onto the fire escape. The metal is cold under your bare feet — you didn't even grab shoes.

Four floors up, the city spreads before you like a war zone. Fires burning in three places you can see. The distant crackle of gunfire — semi-automatic, not police issue. The helicopter has moved east.

Below, the alley looks clear. Above, there's a light on — fifth floor apartment. Down is faster. Up might have supplies, allies, information.`,
    scene:'dark',mood:'#636e72',
    choices:[
      {text:'Climb down to the alley — speed matters',next:'zo_alley'},
      {text:'Climb up to the lit apartment — strength in numbers',next:'zo_upstairs',check:{stat:'str',dc:8}},
      {text:'Listen carefully before moving',next:'zo_listen',check:{stat:'per',dc:10}}
    ]
  },
  zo_hallway:{
    text:`You crack your apartment door open. The hallway fluorescents are flickering — one burned out, the other buzzing like an angry wasp.

The smell hits you first. Copper and something rotten, sweet and horrible. There's a dark smear on the wall near the elevator. The elevator doors are jammed half-open, light blinking inside, empty.

The stairwell door is at the end of the hall. Between you and it: four apartment doors. All closed. One of them has scratch marks around the handle.

Something thumps behind door 4B.`,
    scene:'dark',mood:'#e17055',
    choices:[
      {text:'Move fast — straight to the stairwell',next:'zo_stairwell',check:{stat:'cou',dc:8}},
      {text:'Move carefully, hugging the wall',next:'zo_hallway_careful',check:{stat:'per',dc:10}},
      {text:'Check door 4B — someone might need help',next:'zo_door_4b'}
    ]
  },
  zo_door_4b:{
    text:`You approach 4B. The scratch marks are deep — gouged into the wood like someone used their fingernails. Through the door, you hear the thumping again. Rhythmic. Like someone hitting their head against a wall.

You knock softly. "Hello? You okay in there?"

The thumping stops.

Silence.

Then BANG — something slams against the door from inside. The whole frame shudders. Again. BANG. The hinges groan. Whatever's in there, it's not looking for help. It's trying to get out.

And it heard you.`,
    scene:'dark',mood:'#d63031',
    effects:{flags:{alerted_4b:true}},
    choices:[
      {text:'RUN to the stairwell',next:'zo_stairwell_run'},
      {text:'Back away slowly, don\'t make more noise',next:'zo_stairwell',check:{stat:'per',dc:12}}
    ]
  },
  zo_hallway_careful:{
    text:`You press against the wall, sliding forward inch by inch. Your ears pick up everything — the fluorescent buzz, a distant scream, water running somewhere.

[PERCEPTION CHECK PASSED]

You notice two things: the dark smear on the wall isn't just blood — it trails into apartment 4C, whose door is slightly ajar. And under the stairwell door, you can see shadows moving. Multiple shadows. At least two, maybe three figures, shuffling in the stairwell below.

The fire escape at the end of the hall might be the smarter exit.`,
    scene:'dark',mood:'#636e72',
    effects:{flags:{noticed_stairwell_danger:true}},
    choices:[
      {text:'Take the fire escape instead',next:'zo_fire_escape'},
      {text:'Risk the stairwell anyway — it\'s faster',next:'zo_stairwell_danger'}
    ]
  },
  zo_stairwell:{
    text:`You push through the stairwell door. The echo of your footsteps bounces off concrete walls. Emergency lighting casts everything in a dim red glow.

You start descending. Third floor — clear. Second floor — a door hangs off its hinges, but nothing moves. First floor — the exit to the lobby is right there.

Through the small window in the door, you can see the lobby. The front desk is overturned. Glass from the entrance is shattered across the tile. And standing in the middle of it all, swaying slightly, is what used to be the building's security guard. His uniform is soaked dark. His head tilts at an angle that shouldn't be possible.

He hasn't seen you yet.`,
    scene:'dark',mood:'#d63031',
    choices:[
      {text:'Try to sneak past him to the front entrance',next:'zo_sneak_lobby',check:{stat:'per',dc:11}},
      {text:'Fight him — he\'s between you and freedom',next:'zo_fight_guard',check:{stat:'str',dc:9}},
      {text:'Go back up and use the fire escape',next:'zo_fire_escape'}
    ]
  },
  zo_stairwell_run:{
    text:`You bolt. Behind you, door 4B splinters. You don't look back.

The stairwell door slams open as you hit it at full speed. You take the stairs three at a time, hand on the railing, feet barely touching. Above you, the hallway door crashes open again — it followed you.

You can hear it. Fast. Faster than it should be. Bare feet slapping concrete, a wet snarling sound that echoes down the stairwell.

You hit the ground floor. The lobby door is right there.`,
    scene:'dark',mood:'#d63031',
    effects:{flags:{being_chased:true}},
    choices:[
      {text:'Burst through to the lobby — don\'t stop',next:'zo_lobby_run'},
      {text:'Slam the stairwell door shut behind you and barricade it',next:'zo_barricade_stair',check:{stat:'str',dc:11}}
    ]
  },
  zo_stairwell_danger:{
    text:`You know they're there. You push the door open slowly, carefully.

Two figures on the landing below. Both in pajamas — residents. One missing an arm below the elbow, still dripping. The other's jaw hangs at a wrong angle. They're not moving, just standing. Waiting.

You have one chance to get past before they react.`,
    scene:'dark',mood:'#d63031',
    choices:[
      {text:'Sprint past them — speed and surprise',next:'zo_sprint_past',check:{stat:'cou',dc:10}},
      {text:'Fight through them',next:'zo_fight_two',check:{stat:'str',dc:13}},
      {text:'Go back — take the fire escape',next:'zo_fire_escape'}
    ]
  },
  zo_alley:{
    text:`Your feet hit the alley pavement. Cold, wet, scattered with trash. The fire escape ladder retracts above you with a clang that echoes too loud.

The alley runs north-south. South leads to the main street — you can see the flashing lights, hear the chaos. North leads deeper into the block, toward the back parking lot and the convenience store on the corner.

A rat shoots past your ankle. Somewhere above, glass breaks.

You're outside now. The apartment was a cage, but at least it had walls. Out here, you're exposed.`,
    scene:'dark',mood:'#636e72',
    choices:[
      {text:'Head south to the main street — find help, find the military',next:'zo_main_street'},
      {text:'Go north to the convenience store — supplies first',next:'zo_store'},
      {text:'Check the parking lot for a car',next:'zo_parking',check:{stat:'lck',dc:10}}
    ]
  },
  zo_store:{
    text:`The QuikMart on the corner still has power — the neon "OPEN 24HRS" sign flickers blue and red. The door is ajar. One of the front windows is cracked but holding.

Inside, it's been partially looted. Shelves knocked over, cereal and chips scattered across the floor. But the back shelves — water, canned food, first aid — look mostly untouched. People grabbed the easy stuff and ran.

Behind the counter, the register is open and empty. No cashier. A small TV on the counter plays static.

Then you hear it: someone crying. Quietly. Coming from the back storage room.`,
    scene:'dark',mood:'#00b894',
    choices:[
      {text:'Call out: "Hello? I\'m not going to hurt you"',next:'zo_store_call'},
      {text:'Stay quiet, grab supplies, leave fast',next:'zo_store_grab',check:{stat:'per',dc:9}},
      {text:'Approach the storage room carefully',next:'zo_store_approach',check:{stat:'cou',dc:10}}
    ]
  },
  zo_store_call:{
    text:`"Hello? I'm not going to hurt you."

The crying stops. A pause that stretches forever.

Then a small voice: "Are you... are you normal?"

"Yeah. Yeah, I'm normal."

The storage room door cracks open. A girl — early twenties, dark hair pulled back, wearing a convenience store vest with a name tag that says MAYA. Her eyes are red, mascara streaked. She's holding a box cutter in a white-knuckle grip.

"I've been in here since it started," she says. "My manager — he turned. Right in front of me. I locked myself in and I've been—" Her voice breaks. She takes a breath. "Are there more of you? Is anyone coming to help?"`,
    scene:'dark',mood:'#00b894',
    effects:{flags:{met_maya:true},relationships:{maya:2}},
    choices:[
      {text:'"I don\'t know. But we should stick together."',next:'zo_ch1_end_maya',effects:{relationships:{maya:2},flags:{allied_maya:true}}},
      {text:'"I saw military out there. We need to reach them."',next:'zo_ch1_end_maya',effects:{relationships:{maya:1}}},
      {text:'"Honestly? I have no idea what\'s going on. But I\'m getting out of the city."',next:'zo_ch1_end_maya',effects:{relationships:{maya:1},flags:{plan_escape:true}}}
    ]
  },
  zo_ch1_end_maya:{
    text:`Maya nods slowly. She wipes her eyes with the back of her hand, then straightens up. Something in her shifts — from terrified cashier to someone deciding to survive.

"Okay," she says. "Let me grab the first aid kit. There's a back exit that leads to the loading dock. My car's parked out there — if it hasn't been taken."

She moves to the supply shelf, starts shoving water bottles and bandages into a canvas bag. Efficient. Focused. Whatever she was ten minutes ago, she's not that anymore.

You have a weapon. You have a companion. You have supplies. And outside, the city is burning.

Chapter 1 is just the beginning.

    scene:'dark',mood:'#00b894',
    effects:{flags:{chapter1_complete:true}},
    choices:[
      {text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}
    ]
  },
  zo_main_street:{
    text:`You step onto the main street and immediately regret it.

    text:`You sprint to the overturned truck. Hands reach out and pull you behind cover.

    {text:'Chad pushes two cups toward you. "House rules — choose your drink."',next:'fp_drink_dilemma'}
  ]
},
fp_fridge_girl:{text:'She\'s leaning against the fridge, arms crossed, watching the party like a nature documentary. When she sees you looking, she doesn\'t look away.\n\n"Let me guess," she says. "Freshman. First Kappa Sigma party. Probably came with a friend who ditched you for a girl."\n\n"Am I that obvious?"\n\n"I\'m pre-med. I observe things." She extends a hand. "Nadia. I\'m not gonna ask what your major is because that\'s the most boring question on earth. Instead — what\'s the weirdest thing about you? The thing you don\'t tell people at parties."\n\nShe takes a sip of water — not alcohol, water — and waits for your answer with sharp, curious eyes.',scene:'party',mood:'#e17055',effects:{flags:{met_nadia:true}},choices:[{text:'Tell her something genuinely weird about yourself.',next:'fp_nadia_talk',check:{stat:'cha',dc:9},effects:{stats:{cha:1}}},{text:'"I don\'t have a weird thing. I\'m aggressively normal."',next:'fp_nadia_talk'},{text:'"That\'s a big ask from someone I met ten seconds ago."',next:'fp_nadia_talk',effects:{stats:{int:1}}}]},
fp_nadia_talk:{text:'Nadia listens. Really listens — tilting her head, not looking at her phone, not scanning the room. When you finish, she nods.\n\n"See? That\'s way more interesting than \'I\'m a business major.\'" She smiles for the first time. It changes her whole face.\n\nYou talk for twenty minutes. She tells you she\'s from a tiny town nobody\'s heard of, that she hates parties but forces herself to come because "you can\'t study human behavior from your dorm room." She\'s funny in a dry, deadpan way that catches you off guard.\n\n"Okay," she says eventually, checking her phone. "I\'ve hit my social quota for the night. But—" she tears a corner off a napkin and writes her number. "You\'re interesting. Not many people survive my weirdness test. Text me sometime. Not tonight. I\'ll be asleep in twenty minutes."\n\nShe pushes off the fridge, gives you a two-finger salute, and walks toward the door.',scene:'party',mood:'#fdcb6e',effects:{flags:{got_nadia_number:true},relationships:{nadia:3}},choices:[{text:'Follow her. "Hey — wait up. I\'ll walk you."',next:'fp_nadia_walk',effects:{relationships:{nadia:2},stats:{cou:1}}},{text:'Pocket the number. Back to the party.',next:'fp_backyard'},{text:'That was refreshing. Try the dance floor.',next:'fp_dance_floor',check:{stat:'cou',dc:8}},{text:'Head to the bottle spin — the night\'s not over.',next:'fp_bottle_spin'}]},
fp_dance_floor:{
  text:`The living room has been transformed. Furniture shoved to the walls, a DJ table in the corner pumping out bass-heavy beats. Colored lights spin across the ceiling — someone rigged LED strips everywhere. It's dark except for the lights, and packed.

You feel the music in your bones. Around you, people are dancing — some good, some terrible, all having the time of their lives. Nobody's watching. Nobody's judging. It's just movement and noise and energy.

[COURAGE CHECK PASSED]

Something clicks. You stop thinking and start moving. It's not perfect, but it doesn't need to be. The music takes over. Tyler appears next to you, doing some ridiculous move that makes you both crack up.

Then someone dances into your space — red hair, huge smile, moves like she's performing for a crowd of thousands. "Hey! You're actually good!" she shouts over the music. It's Zara. She grabs your hands and pulls you into a spin.`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{danced:true,met_zara:true},relationships:{zara:2},stats:{cou:1}},
  choices:[
    {text:'Dance with Zara — match her energy.',next:'fp_dance_zara',effects:{relationships:{zara:2}}},
    {text:'Dance with the group — soak in the vibe.',next:'fp_dance_group'},
    {text:'After a few songs, take a breather — head to the couch.',next:'fp_couch'}
  ]
},
fp_bottle_spin:{
  text:`The living room circle is ten people strong. Someone's cleared a space on the hardwood floor. A glass bottle sits in the middle, glinting under the string lights.

You recognize some faces: Mia, sitting cross-legged with a nervous smile. Zara, already hyped. Chad, who nods at you — respect or rivalry, hard to tell. Two guys you don't know. Three girls from different groups. And Tyler, who saved you a spot.

"Rules are simple," Zara announces, clearly self-appointed host. "Spin the bottle. Whoever it lands on — you choose: truth, dare, or..." she pauses for effect, "...kiss."

A ripple of nervous laughter goes around the circle. Mia pulls her sleeves over her hands. Chad cracks his knuckles. Tyler elbows you.

"Who's first?" Zara looks around. Her eyes land on you. "New face goes first. That's definitely a rule. Spin."

The bottle is in front of you. Everyone's watching.`,
  scene:'party',mood:'#fd79a8',
  effects:{flags:{bottle_spin:true}},
  choices:[
    {text:'Spin the bottle. Here goes nothing.',next:'fp_spin_result'},
    {text:'"How about you go first, Zara? Show us how it\'s done."',next:'fp_zara_spins',effects:{relationships:{zara:1}},check:{stat:'cha',dc:9}},
    {text:'Spin it with confidence — you just won beer pong, you can handle this.',next:'fp_spin_result',requires:{won_beer_pong:true},effects:{stats:{cou:1}}}
  ]
},
fp_spin_result:{
  text:`You lean forward and give the bottle a solid spin. It whirls across the hardwood, catching the light — a blur of green glass. The circle holds its breath.

It slows. Passes Chad. Passes one of the guys you don't know. Passes Tyler (who looks relieved). And stops.

Pointing directly at Mia.

Her eyes widen. The circle explodes — oohs, whistles, someone literally screams. Mia's cheeks go pink, but she's smiling. She tucks her hair behind her ear and meets your eyes.

"Truth, dare, or kiss?" Zara asks, practically vibrating with excitement.

The room is watching. Mia is watching. This is one of those moments.`,
  scene:'party',mood:'#fd79a8',
  effects:{relationships:{mia:1}},
  choices:[
    {text:'"Truth. Mia — what\'s your honest first impression of me?"',next:'fp_mia_truth',effects:{relationships:{mia:1}}},
    {text:'"Dare."',next:'fp_dare'},
    {text:'Look at Mia. "...Kiss?"',next:'fp_kiss_mia',check:{stat:'cou',dc:11},effects:{relationships:{mia:3}}},
    {text:'Let Mia choose. "Your call."',next:'fp_mia_chooses',effects:{relationships:{mia:2}}}
  ]
},
fp_mia_truth:{
  text:`Mia bites her lip, thinking. The circle leans in.

"Okay. Honest first impression..." She looks at you. Really looks at you. "I noticed you in psych class the first week. You were the only person actually writing stuff down. And I thought... he's either really into psychology, or he's really trying. Either way, I liked it."

She pauses. "And tonight — you walked in here and I thought, 'Oh. That's the psych class guy. He cleans up nice.'"

The circle "oohs" again. Tyler is grinning ear to ear. Mia looks embarrassed but not unhappy. You feel warm in a way that has nothing to do with the crowded room.

"Okay, NEXT!" Zara grabs the bottle and spins before the moment gets too heavy. The game continues, but something has shifted between you and Mia. She keeps glancing your way.

Three rounds later, Zara gets dared to dance on the table (she does it immediately). Chad has to text his ex something nice (he looks pained). The energy is high, everyone's laughing.

Then it's your turn again.`,
  scene:'party',mood:'#fd79a8',
  effects:{flags:{mia_confession:true},relationships:{mia:2}},
  choices:[
    {text:'Spin again — feeling lucky.',next:'fp_spin_two'},
    {text:'Slip out of the circle — go find Mia in the kitchen.',next:'fp_after_spin_mia',effects:{relationships:{mia:1}}},
    {text:'Suggest everyone moves to the backyard — switch up the energy.',next:'fp_backyard',effects:{flags:{led_group:true}}}
  ]
},
fp_roof_mia:{
  text:`Mia leads you through the kitchen, down a hall, up a narrow staircase that smells like old carpet and cologne. The music fades with every step. She pushes open a door at the top — and the night sky opens up.

The roof is a flat section above the garage, surrounded by a low railing. Someone put cheap string lights up here, and there are a few lawn chairs. But the real feature is the view — the campus stretching out below, lit up like a circuit board. The library's clock tower glowing in the distance.

"Told you it was worth it," Mia says, settling into a chair. She pulls her knees up to her chest and looks out over campus.

It's quiet up here. The party is a muffled heartbeat below your feet. Stars overhead, or at least the ones that fight through the light pollution. The air is cool on your skin.

"This is my favorite part of these parties," she says softly. "Finding the quiet spots. Is that lame?"

She's looking at you now, and in the string light glow her eyes are dark and warm and very close.`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{on_roof:true},relationships:{mia:2}},
  choices:[
    {text:'"Not lame at all. This is the best part of my night so far."',next:'fp_roof_deep',effects:{relationships:{mia:2}}},
    {text:'Sit next to her. Don\'t say anything. Just enjoy the silence.',next:'fp_roof_deep',effects:{relationships:{mia:2}},check:{stat:'per',dc:8}},
    {text:'"So tell me something real. Not party small talk."',next:'fp_roof_deep',effects:{relationships:{mia:2}}},
    {text:'Point at the sky. "What constellation is that?" (You have no idea.)',next:'fp_roof_mia_stars',effects:{relationships:{mia:2},stats:{cha:1}}}
  ]
},
fp_roof_deep:{
  text:`Time does something strange on the roof. Minutes stretch. The party below rises and falls like breathing. You and Mia talk — really talk. Not party talk. Real talk.

She tells you she almost didn't come to college. That her parents wanted her to take over the family restaurant. That psychology is her way of understanding why people do what they do — including herself.

You tell her things you didn't plan to say. The conversation flows like water, finding its own path.

At some point her chair gets closer to yours. Your shoulders are almost touching. She's shivering slightly in the night air.

"I'm glad I came tonight," she says, quiet enough that you have to lean in. "I almost didn't."

She turns her head. You're very close. You can see the string lights reflected in her eyes. The music swells from below — something slow. The moment stretches.`,
  scene:'party',mood:'#6c5ce7',
  effects:{relationships:{mia:3}},
  choices:[
    {text:'Close the distance. Kiss her.',next:'fp_roof_kiss',check:{stat:'cou',dc:9},effects:{relationships:{mia:4}}},
    {text:'Offer her your jacket. The moment doesn\'t need to be rushed.',next:'fp_roof_gentle',effects:{relationships:{mia:3}}},
    {text:'"Want to go back down? I think I hear them starting bottle spin."',next:'fp_bottle_spin',effects:{relationships:{mia:-1}}}
  ]
},
fp_roof_kiss:{
  text:`You lean in. She meets you halfway.

The kiss is soft. Tentative at first, like a question. Then she smiles against your lips and the answer is yes. Her hand finds the side of your face, cool fingers against warm skin. The string lights blur. The distant bass becomes a heartbeat.

When you pull apart, she's looking at you like you're something she just discovered.

"Okay," she breathes. "That was worth coming to this party for."

You stay on the roof for a while longer. Talking, laughing, sitting so close that your arm is around her shoulders and her head is tilted toward yours. The party rages below, but up here it's just you two and the sky.

Eventually, the music shifts. Someone downstairs is shouting about a midnight toast.

"Should we go back down?" Mia asks. "Or stay up here forever? I'm okay with either."`,
  scene:'party',mood:'#fd79a8',
  effects:{flags:{kissed_mia:true,mia_romance:true},relationships:{mia:4}},
  choices:[
    {text:'"Let\'s go down. But stay with me."',next:'fp_late_night_together',effects:{relationships:{mia:2}}},
    {text:'"Five more minutes up here. Then we rejoin the world."',next:'fp_late_night_together',effects:{relationships:{mia:2}}},
    {text:'"Honestly? I could stay here all night."',next:'fp_ending_roof',effects:{relationships:{mia:3}}}
  ]
},
fp_roof_gentle:{
  text:`You shrug off your jacket and drape it over her shoulders. She looks surprised, then pulls it tighter around herself.

"Old school," she says with a small smile. "I like it."

The moment settles. Not every connection needs to rush toward something. This one is building slowly, and that's okay. She leans her shoulder against yours — warm where you're touching, cool everywhere else.

You talk for another hour. About everything and nothing. She laughs at your stories. You listen to hers. The party below peaks and starts to wind down, but neither of you move.

"Hey," she says eventually, her voice sleepy and content. "This was really nice. Can I — would it be weird if I asked for your number?"`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{mia_slow_burn:true},relationships:{mia:3}},
  choices:[
    {text:'Give her your number. This is just the beginning.',next:'fp_ending_good',effects:{relationships:{mia:3},flags:{got_mia_number:true}}},
    {text:'"Only if you promise to sit next to me in psych class on Tuesday."',next:'fp_ending_good',effects:{relationships:{mia:4},flags:{got_mia_number:true}}}
  ]
},
fp_backyard:{
  text:`The backyard is a different world. Cooler, darker, the music muffled by the house. Fairy lights are strung between the fence and a big oak tree. A fire pit crackles in the center of a loose circle of people, their faces warm and orange.

Someone's playing guitar — softly, not performing, just noodling. A couple is sharing a blanket on the grass. Two guys are having an intense conversation about whether aliens exist.

It's the chill zone. The decompression chamber between the chaos inside and the quiet of the rest of campus.

You spot an empty lawn chair by the fire. Near it, Luna is sitting cross-legged on the grass, sketching something in her notebook by firelight.`,
  scene:'party',mood:'#fdcb6e',
  choices:[
    {text:'Sit by Luna. See what she\'s drawing.',next:'fp_luna_art',effects:{relationships:{luna:2}}},
    {text:'Take the chair by the fire. Just chill.',next:'fp_fire_chill'},
    {text:'Join the alien debate — you have opinions.',next:'fp_alien_debate',check:{stat:'int',dc:9}},
    {text:'You overhear two guys at the drinks table talking about Tyler...',next:'fp_loyalty_test',effects:{stats:{per:1}}},
    {text:'Past the fire pit — is that a glow-stick pool?',next:'fp_pool_area'}
  ]
},
fp_couch:{
  text:`The couch area is a haven of relative calm. A big L-shaped sectional, a coffee table covered in cups, and a group of people playing some kind of card game.

You sink into the cushions. It's comfortable — almost dangerously comfortable after standing around nervously. Tyler drops beside you.

"Dude, Jake's parties are legendary for a reason," he says, gesturing around. "Free food, free drinks, and..." he lowers his voice, "Zara's here. You know Zara, right? Dance team captain? She's like — dude."

He's looking at the dance floor with the expression of a man who has never once successfully talked to his crush.

A girl next to you on the couch turns. "Are you guys freshmen? You look lost. In a cute way." She grins. She has kind eyes and a lacrosse hoodie.`,
  scene:'party',mood:'#e17055',
  effects:{relationships:{tyler:1}},
  choices:[
    {text:'Talk to lacrosse hoodie girl — she seems cool.',next:'fp_couch_talk'},
    {text:'Wing-man Tyler toward Zara. He clearly needs help.',next:'fp_wingman',check:{stat:'cha',dc:10},effects:{relationships:{tyler:3}}},
    {text:'Play the card game — looks like fun.',next:'fp_card_game'},
    {text:'Tyler starts walking toward Zara. This is going to be a disaster.',next:'fp_tyler_zara_wingman'}
  ]
},
fp_late_night_together:{
  text:`You come back down together. The party has shifted — it's past midnight now. The frantic energy of the early night has softened into something warmer. Fewer people, lower music, longer conversations. Someone put on a playlist of slow songs.

Mia's hand finds yours in the dim hallway. She doesn't let go.

You drift through the remnants of the party together. Share the last slice of pizza. Dance — slow, just swaying, in the corner of the living room where nobody's watching. She rests her head on your shoulder and you can smell her shampoo — something like vanilla.

Tyler gives you a thumbs up from across the room. You give him one back.

"So," Mia says, pulling back to look at you. "Walk me home? My dorm's like ten minutes from here."`,
  scene:'party',mood:'#6c5ce7',
  effects:{relationships:{mia:2}},
  choices:[
    {text:'"Absolutely. Let\'s go."',next:'fp_walk_home_mia',effects:{relationships:{mia:2}}},
    {text:'"Let me say bye to Tyler first, then yes."',next:'fp_walk_home_mia',effects:{relationships:{tyler:1,mia:1}}}
  ]
},
fp_walk_home_mia:{
  text:`The walk is everything.

The campus is quiet at 2 AM. Streetlamps casting pools of yellow light on empty sidewalks. The air is cool and clean after the warmth of the party. Your footsteps echo.

Mia walks close enough that your arms brush. She's wearing your jacket (she never gave it back, and you're not asking).

She tells you about the constellation she can see — Orion, she thinks, or maybe not, she failed astronomy. You point out a shooting star that turns out to be a plane. She pretends it counted anyway.

At her dorm, she stops at the door. Turns to face you. The porch light makes everything golden.

"Tonight was..." she starts, then shakes her head. "I don't have a word for it."

She reaches up and fixes your collar — a small, intimate gesture that says more than words.

"Tuesday? Psych class? Save me a seat?"

---

THE NIGHT ENDS

You walk back to your dorm alone, but you don't feel alone. Your jacket smells like her perfume. Your phone buzzes — a text from an unknown number: "Got home safe. Thanks for the best night. - M"

The semester just got a lot more interesting.`,
  scene:'party',mood:'#6c5ce7',
  effects:{flags:{ending_mia:true,chapter1_complete:true},relationships:{mia:4}},
  choices:[
    {text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}
  ]
},
fp_ending_roof:{
  text:`You stay.

The party winds down below you, but on the roof, time moves differently. Mia falls asleep with her head on your shoulder, your jacket pulled tight around her. The string lights flicker. A shooting star — an actual one this time — streaks across the sky, and you watch it alone because you don't want to wake her.

At some point, you doze off too. When you open your eyes, the sky is turning pink at the edges. Dawn. The campus is silent. Even the music has finally stopped.

Mia stirs, blinks, looks around. Sees the sunrise. Sees you.

"We stayed all night," she says, not a question. Her voice is rough with sleep.

"Yeah."

She smiles — slow, warm, private. A smile just for you. Then she takes your hand and you watch the sunrise together over a campus that doesn't know your story yet.

---

THE NIGHT ENDS

Some nights change everything. This was one of them.`,
  scene:'party',mood:'#fdcb6e',
  effects:{flags:{ending_sunrise:true,chapter1_complete:true},relationships:{mia:5}},
  choices:[
    {text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}
  ]
},
fp_ending_good:{
  text:`You exchange numbers. She texts you immediately — a smiley face, nothing else. You text back a smiley face. It's stupid and perfect.

Tyler finds you as you're walking out. "Bro. BROOOO. You got her number?!" He's more excited than you are. "This is the greatest night of all time."

The walk back to your dorm is cool and quiet. The adrenaline fades into something warmer — contentment. You replay the night in your head. The party, the beer pong, the conversations, the moments that felt like they mattered.

Your phone buzzes. Mia: "Hey. Thanks for tonight. First party that didn't suck. See you Tuesday?"

You smile in the dark.

---

THE NIGHT ENDS

First college party: survived. First real connection: made. First time feeling like you belong here: tonight.`,

  choices:[

},
fp_tyler_info:{text:'Tyler leans in conspiratorially. "Okay so — Jake is the host, Kappa Sigma president, nicest dude ever. Chad is the beer pong king, kind of a bro but harmless. Mia — that\'s the girl from your psych class, don\'t think I haven\'t noticed you looking. Zara is the red-haired one on the dance floor, she\'s amazing, don\'t talk to me about it. And Luna — artsy girl, mysterious, I don\'t know her deal but she\'s cute."',scene:'party',mood:'#e17055',effects:{flags:{knows_everyone:true}},choices:[{text:'Go talk to Mia.',next:'fp_meet_mia',check:{stat:'cha',dc:9}},{text:'Hit the dance floor — find Zara.',next:'fp_dance_floor',check:{stat:'cou',dc:8}},{text:'Challenge Chad at beer pong.',next:'fp_beer_pong',check:{stat:'cou',dc:10}}]},
fp_find_tyler:{text:'You weave through the party looking for Tyler. He\'s easy to spot — laughing too loud near the DJ, holding two cups, already in his element.\n\n"There you are! Dude, where\'d you go? Come on, I\'ll introduce you around." He throws an arm around your shoulder and steers you toward the kitchen.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:1}},choices:[{text:'Let Tyler lead the way.',next:'fp_kitchen'}]},
fp_hallway:{text:'The upstairs hallway is dim. Closed doors on both sides — bedrooms, probably. A bathroom with a line. And at the end, a narrow staircase going up with a sign that says "ROOF ACCESS — COOL PEOPLE ONLY."\n\nSomeone stumbles out of the bathroom. Music thumps through the floor. It\'s quieter up here, but you can feel the party vibrating through the walls.\n\nA door to your left is slightly open — warm light and conversation spilling out. Sounds like a smaller gathering inside. Through the crack, you can see bean bags, a lava lamp, and what looks like a very chill vibe.',scene:'party',mood:'#636e72',choices:[{text:'Go up to the roof.',next:'fp_roof_solo'},{text:'Check out the chill room.',next:'fp_chill_room'},{text:'Head back down to the party.',next:'fp_kitchen_chill'},{text:'Look at the photos on the wall. Decades of frat history.',next:'fp_hallway_photos',effects:{stats:{per:1}}}]},
fp_chill_room:{text:'You push the door open. It\'s Jake\'s room — or someone\'s room, temporarily converted into the anti-party. A lava lamp casts slow orange blobs on the walls. Four people are scattered across bean bags and the floor: two sharing earbuds and vibing to something, one reading a book (at a party — respect), and Jake himself, sitting on the windowsill with a drink.\n\n"Hey! Welcome to the VIP lounge," Jake says. "No music, no games, no drama. Just people being people."\n\nHe pats the bean bag next to him. "You look like you could use five minutes of not being overstimulated."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:2}},choices:[{text:'Sit down. Five minutes of calm sounds perfect.',next:'fp_jake_talk',effects:{relationships:{jake:1}}},{text:'"Actually, I was heading to the roof."',next:'fp_roof_solo'},{text:'"Nice spot. But I think the party\'s calling me back."',next:'fp_kitchen_chill'}]},
fp_jake_talk:{text:'Jake\'s easy to talk to. Not in the overconfident frat-president way you expected — he\'s actually thoughtful. He asks you what you\'re studying, where you\'re from, if you\'re settling in okay.\n\n"Freshmen always have this look," he says. "Like they\'re performing. Trying to be the college version of themselves. Takes about a semester to figure out that nobody cares. Just be yourself. The right people will find you."\n\nHe nods at the party below. "I throw these things because people need a place to let go. But the real connections?" He taps the bean bag. "Always happen in rooms like this."\n\nHe checks his phone. "Oh — Tyler\'s looking for you. Said something about Zara. He seemed panicky."\n\n"Also," Jake leans in, "Mia asked where you went. Just saying."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:2},stats:{int:1}},choices:[{text:'Go find Tyler — he needs you.',next:'fp_tyler_panic',effects:{relationships:{tyler:1}}},{text:'Find Mia — she was looking for you.',next:'fp_mia_looking',effects:{relationships:{mia:1}}},{text:'Stay and keep talking to Jake.',next:'fp_jake_deep',effects:{relationships:{jake:2}}},{text:'"What do you actually think about — when the party\'s quiet?"',next:'fp_jake_philosophy',effects:{relationships:{jake:3}}}]},
fp_tyler_panic:{text:'You find Tyler on the stairs, pacing. He grabs your arm the second he sees you.\n\n"Dude. DUDE. I danced with Zara. Like, actually danced. And she said — she SAID — \'we should hang out sometime.\' What does that MEAN?"\n\n"It means she wants to hang out."\n\n"But is that hang out or HANG OUT? There\'s a difference! A critical difference!" He\'s spiraling. Classic Tyler.\n\n"She gave me her number. Look." He holds up his phone. There it is. Zara, with a red heart emoji she typed in herself.\n\n"I haven\'t texted her yet. What do I say? I\'ve been standing here for ten minutes trying to think of something that isn\'t terrible."',scene:'party',mood:'#00b894',effects:{relationships:{tyler:2}},choices:[{text:'"Just say: Hey, it\'s Tyler. Tonight was fun." Keep it simple.',next:'fp_tyler_texts',effects:{relationships:{tyler:2}}},{text:'"Send her a meme. Something from whatever band you both like."',next:'fp_tyler_texts',effects:{relationships:{tyler:2}},check:{stat:'int',dc:8}},{text:'"You\'re overthinking this. She literally put a heart emoji. She likes you."',next:'fp_tyler_texts',effects:{relationships:{tyler:3}}}]},
fp_tyler_texts:{text:'Tyler types. Deletes. Types again. Deletes. You grab the phone and hit send before he can delete a third time.\n\n"NO!" He snatches it back. Stares at the screen. Three dots appear — Zara\'s typing.\n\nThe reply comes: a laughing emoji, then "took you long enough :)" then "come find me, I\'m by the fire pit."\n\nTyler looks at you like you just solved world hunger. "You\'re the best friend I\'ve ever had. Genuinely. I\'m naming my firstborn after you."\n\nHe practically runs toward the backyard. You stand alone in the hallway, grinning. Your best friend is having the night of his life.\n\nNow — what about yours?',scene:'party',mood:'#00b894',effects:{relationships:{tyler:3,zara:1},flags:{tyler_zara_connected:true}},choices:[{text:'Follow Tyler to the backyard.',next:'fp_backyard'},{text:'Go find Mia.',next:'fp_mia_looking'},{text:'Head to the roof — earn some quiet time.',next:'fp_roof_solo'}]},
fp_mia_looking:{text:'You find Mia near the bottom of the stairs. She\'s looking up — right at you. A small smile when your eyes meet.\n\n"There you are. I was wondering if you left."\n\n"Just exploring. Jake has a chill room upstairs."\n\n"Jake\'s chill room is legendary." She falls into step beside you. "So... the party\'s starting to thin out. The good part is starting — when it gets quiet enough to actually talk to someone without screaming."\n\nShe\'s standing close. The hallway is dim, the music softer now — someone switched to a mellower playlist. You can hear crickets through an open window.\n\n"I was hoping I\'d run into you again tonight," she says. And there\'s nothing casual about the way she says it.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{mia_sought_you:true}},choices:[{text:'"I was hoping for the same thing. Roof?"',next:'fp_roof_mia',effects:{relationships:{mia:2},flags:{with_mia:true}}},{text:'"Walk and talk? I haven\'t seen the backyard yet."',next:'fp_backyard_mia',effects:{relationships:{mia:1}}},{text:'"Want to just... stand here for a minute? I like this."',next:'fp_late_night_together',effects:{relationships:{mia:3}}}]},
fp_jake_deep:{text:'Jake tells you about why he started throwing parties. "My freshman year, I didn\'t know anyone. Went to one party, stood in a corner for two hours, went home. Worst night of my semester."\n\nHe sips his drink. "So I decided — when I\'m the one with the house, nobody stands in a corner. Everyone gets welcomed. Everyone gets a conversation."\n\nHe looks out the window at the backyard, where people are gathered around the fire. "That\'s the whole thing. It\'s not about the alcohol or the music. It\'s about giving people a place to belong, even for a night."\n\nYou sit with that for a moment. Then Jake checks the time. "It\'s getting late. The party\'ll wind down soon. Go make your night count — whoever you\'re thinking about, go find them."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:3},flags:{jake_wisdom:true},stats:{int:1}},choices:[{text:'Find Mia.',next:'fp_mia_looking',effects:{relationships:{mia:1}}},{text:'Head to the backyard.',next:'fp_backyard'},{text:'Go to the roof.',next:'fp_roof_solo'}]},
fp_roof_solo:{text:'The roof is empty. Just you, the string lights, and the view. Campus below, stars above, the party a muffled pulse under your feet.\n\nYou sit in a lawn chair and breathe. It\'s the first quiet moment of the night. Up here, you can think.\n\nAfter a few minutes, the roof door opens. Someone else had the same idea.',scene:'party',mood:'#6c5ce7',effects:{flags:{on_roof:true}},choices:[{text:'Wait to see who it is.',next:'fp_roof_surprise'}]},
fp_roof_surprise:{text:'It\'s Luna. She stops when she sees you, then smiles. "Oh — rooftop gang. Mind if I join?"\n\nShe sits cross-legged on the concrete next to your chair, pulls out her sketchbook, and starts drawing the skyline.\n\n"I always end up here at these things," she says. "The party is fun for about an hour, then I need sky."',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:2}},choices:[{text:'"What are you drawing?"',next:'fp_luna_art'},{text:'Just sit together in comfortable silence.',next:'fp_luna_quiet',effects:{relationships:{luna:2}}}]},
fp_luna_art:{text:'You lean over to look. She\'s sketching the campus skyline — quick, confident strokes. The library tower, the dorms, the trees. It\'s good. Really good.\n\n"I draw what I see," she says. "Parties, people, places. It\'s how I process things. Some people journal. I sketch."\n\nShe flips back a few pages. A portrait of someone laughing. A crowd scene from what looks like another party. A cat sleeping on a windowsill.\n\n"You\'re talented," you say, and mean it.\n\nShe looks at you with those gold-brown eyes. "Want me to draw you?"',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:2}},choices:[{text:'"Sure. How should I pose?"',next:'fp_luna_draws_you',effects:{relationships:{luna:3}}},{text:'"Only if I get to keep it."',next:'fp_luna_draws_you',effects:{relationships:{luna:3}},check:{stat:'cha',dc:9}}]},
fp_luna_draws_you:{text:'Luna sketches quickly, glancing up at you between strokes. "Don\'t move too much. And don\'t make a face — just be normal."\n\n"What does normal look like?"\n\n"Like that. Right there." She smiles and keeps drawing.\n\nFive minutes later, she turns the sketchbook around. It\'s you — but somehow more interesting than you think you look. She captured something in the eyes, the posture, that feels true.\n\n"You can have it," she says, tearing the page out carefully. "Consider it a souvenir of your first real party."\n\nShe writes something in the corner of the page. Her number.',scene:'party',mood:'#fd79a8',effects:{flags:{luna_drew_you:true,got_luna_number:true},relationships:{luna:4}},choices:[{text:'Stay on the roof with Luna and talk until the stars fade.',next:'fp_ending_luna'},{text:'"This is amazing. Want to go downstairs and get a drink?"',next:'fp_kitchen_chill',effects:{relationships:{luna:1}}}]},
fp_luna_quiet:{text:'You sit together without talking. It should be awkward but it isn\'t. Luna draws. You watch the campus. The fire pit below glows orange. Someone\'s playing guitar — faint chords drifting up.\n\n"I like that you don\'t need to fill silence," she says after a while. "Most people can\'t handle it."\n\nShe tears a page from her sketchbook and hands it to you. It\'s a quick sketch of the view from the roof, with two small figures sitting side by side.\n\n"For your first party," she says.',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:3},flags:{luna_sketch_gift:true}},choices:[{text:'Stay with Luna.',next:'fp_ending_luna'},{text:'Head back down to the party.',next:'fp_kitchen_chill',effects:{relationships:{luna:-1}}}]},
fp_ending_luna:{text:'You and Luna stay on the roof until the party dies below you. She tells you about her art — how she wants to illustrate graphic novels, how she sees stories in everything. You tell her about yourself, and she listens in that way she has — quiet, attentive, like she\'s sketching you with her mind.\n\nAt some point, her head is on your shoulder. At some point, the sky starts turning purple at the edges. At some point, you realize this is the most real conversation you\'ve had since you got to college.\n\n"Hey," she whispers. "The sunrise."\n\nYou watch it together. She takes your hand — her fingers are stained with graphite. It feels like the beginning of something that won\'t fit in a sketchbook.\n\n---\n\nTHE NIGHT ENDS\n\nYou walk home with a drawing in your pocket and a number in your phone. The world looks different in the morning light — like she drew it better than it was.',scene:'party',mood:'#fdcb6e',effects:{flags:{ending_luna:true,chapter1_complete:true},relationships:{luna:5}},choices:[{text:'CHAPTER 2 COMING SOON — Return to Menu',next:'_menu'}]},
fp_celebrate:{text:'You and Tyler ride the high. He buys you a drink (from the free table, but it\'s the thought that counts). People you\'ve never met are congratulating you. For fifteen minutes, you\'re the most popular person at the party.\n\n"Best. Night. Ever." Tyler is beaming. He drags you to the dance floor.',scene:'party',mood:'#00b894',effects:{relationships:{tyler:2}},choices:[{text:'Dance with Tyler — celebrate properly.',next:'fp_dance_floor',check:{stat:'cou',dc:7}},{text:'Use the momentum — go talk to Mia.',next:'fp_meet_mia_confident'},{text:'Take a breather — head to the backyard.',next:'fp_backyard'},{text:'Keep drinking. The night is young and you\'re invincible.',next:'fp_ending_blackout',requires:{drank_punch:true},effects:{stats:{cou:1,int:-3}}}]},
fp_rematch:{text:'Chad grins. "Double or nothing? You\'re on."\n\nThe rematch is brutal. Chad\'s locked in now — no more showboating. Every shot is precise. The crowd picks sides. You trade cups back and forth.\n\nFinal cup again. This time, Chad sinks it first. Clean shot, no rim.\n\n"THAT\'S what I\'m talking about!" He chest-bumps his friend. Then turns to you, hand extended. "Good game though. For real. You\'re alright."\n\nYou lost, but somehow it doesn\'t feel like losing.',scene:'party',mood:'#e17055',effects:{relationships:{chad:2},flags:{lost_rematch:true}},choices:[{text:'Head to the couch — enough competition for now.',next:'fp_couch'},{text:'Find Mia — she was watching earlier.',next:'fp_meet_mia'},{text:'"Alright, show me what else you guys do around here."',next:'fp_chad_hangout',effects:{relationships:{chad:2}}}]},
fp_backyard_mia:{text:'"The backyard?" Mia thinks about it for exactly one second. "Yeah, actually. I could use some air."\n\nZara shrugs. "Your loss. Bottle spin waits for no one!" She spins back into the crowd.\n\nThe backyard is quiet by comparison. Fire pit glowing, fairy lights in the trees, a few people scattered around. You find two chairs near the fire.\n\nMia sits and tilts her head back, looking at the stars. "This is more my speed," she says.',scene:'party',mood:'#fdcb6e',effects:{relationships:{mia:2},flags:{backyard_with_mia:true}},choices:[{text:'Talk by the fire — get to know her.',next:'fp_roof_deep',effects:{relationships:{mia:1}}},{text:'"Want to see the roof? Jake apparently has a whole setup up there."',next:'fp_roof_mia',effects:{relationships:{mia:1}}},{text:'Luna walks over with her sketchbook. "Mind if I join?"',next:'fp_mia_luna_meet',requires:{met_luna_first:true}}]},
fp_dance_zara:{text:'Zara dances like the music was written for her. She pulls you in, spins away, comes back. It\'s not romantic — it\'s pure energy. She\'s laughing the whole time, making up moves, getting everyone around you to join.\n\n"You\'re fun!" she shouts. "Most new people are so stiff. Like dancing mannequins."\n\nThree songs later, you\'re both breathless. She links her arm through yours and pulls you off the dance floor. "Come on. They\'re doing bottle spin and I need to be there for the drama."',scene:'party',mood:'#6c5ce7',effects:{relationships:{zara:3}},choices:[{text:'Go to bottle spin with Zara.',next:'fp_bottle_spin'},{text:'"I need water first — meet you there."',next:'fp_kitchen_chill'},{text:'"Actually — one more dance. Teach me how you move like that."',next:'fp_zara_dance_deeper',effects:{relationships:{zara:2}}}]},
fp_dance_group:{text:'You dance with the group — strangers becoming friends through shared rhythm. Nobody cares how you look. The DJ drops a track everyone knows and the whole room sings along, off-key and perfect.\n\nThis is what college is supposed to feel like.\n\nAfter a few songs, Tyler grabs your arm. "Dude — bottle spin. Living room. Come ON."',scene:'party',mood:'#6c5ce7',effects:{stats:{cou:1}},choices:[{text:'Bottle spin. Let\'s go.',next:'fp_bottle_spin'},{text:'Stay on the dance floor a bit longer.',next:'fp_kitchen_chill'}]},
fp_couch_talk:{text:'Her name is Amy. She\'s a sophomore, lacrosse midfielder, from Connecticut. She\'s easy to talk to — the kind of person who asks questions and actually listens to the answers.\n\n"First party? Honestly, they\'re all like this. Loud, chaotic, someone always cries in the bathroom by midnight." She grins. "But they\'re fun if you find the right people."\n\nShe introduces you to the card game group. It\'s some drinking game you\'ve never heard of. They explain the rules terribly. You play anyway.',scene:'party',mood:'#e17055',choices:[{text:'Keep hanging with Amy and the group.',next:'fp_card_game'},{text:'Head to the kitchen — heard something about beer pong.',next:'fp_kitchen'}]},
fp_card_game:{text:'The card game makes no sense but everyone\'s laughing too hard to care. You win a round by accident. Amy high-fives you.\n\nThe night flows. People cycle in and out of the group. Tyler shows up, stays for two rounds, gets distracted by Zara walking past and leaves mid-sentence.\n\nIt\'s comfortable here. Low-key. But the party is still going strong around you, and the night is young.',scene:'party',mood:'#e17055',choices:[{text:'Stay here — this is nice.',next:'fp_ending_good'},{text:'Time to explore — hit the kitchen or dance floor.',next:'fp_kitchen_chill'},{text:'Check out the backyard.',next:'fp_backyard'},{text:'Ask Amy about the girl by the fridge — she seemed interesting.',next:'fp_amy_nadia_tip',effects:{relationships:{nadia:1}}}]},
fp_amy_nadia_tip:{text:'Amy follows your gaze. "Nadia? She\'s in my bio class. Smartest person I\'ve ever met — like, scary smart. She doesn\'t come to parties much. Pre-med, always studying. But when she does show up..." Amy grins. "She has this thing where she tests people. Asks weird questions. If you pass, she actually talks to you. If you don\'t..." she makes a slicing gesture across her throat.\n\n"She didn\'t scare you off, did she?"\n\n"Not yet."\n\n"Then go. Before she leaves — she never stays past midnight."',scene:'party',mood:'#e17055',effects:{flags:{amy_nadia_tip:true}},choices:[{text:'Head to the kitchen. Find Nadia.',next:'fp_fridge_girl',effects:{stats:{cou:1}}},{text:'Stay with Amy\'s group. Nadia can wait.',next:'fp_fire_chill'}]},
fp_wingman:{text:'You grab Tyler. "Come on. You\'re talking to Zara tonight."\n\n"What?! No. No no no. I can\'t—"\n\n"Yes you can. I\'ll be right there."\n\nYou steer him toward the dance floor. Zara is between songs, getting water. You introduce Tyler like he\'s your coolest friend (he is, technically, your only friend here, but she doesn\'t need to know that).\n\nTyler freezes for exactly two seconds, then something clicks and he starts talking. About music. Turns out Zara loves the same obscure band he does. They\'re off and running.\n\nZara grabs his hand and pulls him onto the dance floor. Tyler looks back at you with an expression of pure gratitude and terror.\n\nYou did a good thing.',scene:'party',mood:'#00b894',effects:{relationships:{tyler:3,zara:1},flags:{wingman:true}},choices:[{text:'Head to the kitchen — your work here is done.',next:'fp_kitchen'},{text:'Find your own adventure — check the backyard.',next:'fp_backyard'},{text:'Wander upstairs.',next:'fp_hallway'}]},
fp_fire_chill:{text:'You settle into the lawn chair. The fire crackles. Someone passes you a marshmallow on a stick — you don\'t know who, but you accept it.\n\nThe backyard crew is different from the house crowd. Mellower. A girl is showing someone constellations. Two guys are planning a road trip. The guitar player knows exactly three songs but plays them really well.\n\nYou roast your marshmallow perfectly. Small victory.\n\nThe night could end here and it would still be good.',scene:'party',mood:'#fdcb6e',choices:[{text:'Stay by the fire. Let the night wind down.',next:'fp_ending_good'},{text:'Go back inside — the night\'s not over yet.',next:'fp_kitchen_chill'},{text:'A crash from inside breaks the calm. Something\'s going on.',next:'fp_party_drama'},{text:'Head to the roof alone. End the night on your own terms.',next:'fp_ending_solo',effects:{stats:{int:1}}},{text:'Tyler sits down next to you. He looks like he wants to say something.',next:'fp_tyler_confides',effects:{relationships:{tyler:2}}}]},
fp_alien_debate:{text:'You drop into the alien conversation like you\'ve been there the whole time.\n\n"I\'m just saying — the universe is too big for us to be alone," says the tall one.\n"That\'s literally just the Drake equation and it proves nothing," says the short one.\n"Okay but what about the Wow! signal—"\n"You can\'t base an argument on ONE signal from 1977—"\n\n[INTELLIGENCE CHECK PASSED]\n\nYou bring up the Fermi paradox. Both guys turn to you like you just spoke ancient Greek. "FINALLY someone who actually knows what they\'re talking about!"\n\nYou\'re in. The debate rages for twenty minutes. People gather to listen. You hold your own.\n\nLuna, sketching nearby, looks up and catches your eye. She mouths "nerd" with a smile.',scene:'party',mood:'#fdcb6e',effects:{relationships:{luna:1},stats:{int:1}},choices:[{text:'Go talk to Luna.',next:'fp_luna_art',effects:{relationships:{luna:1}}},{text:'Stay in the debate — this is actually fun.',next:'fp_fire_chill'},{text:'Notice a girl by the back door watching the debate. She looks intrigued.',next:'fp_fridge_girl',effects:{stats:{int:1}}}]},
fp_zara_spins:{text:'"Oh you want ME to go first? Okay!" Zara grabs the bottle without hesitation and gives it a dramatic spin, blowing on it like dice.\n\nIt lands on Tyler.\n\nTyler\'s face goes through five emotions in two seconds. The circle loses it. Zara grins at him. "Truth, dare, or kiss, tall guy?"\n\nTyler\'s mouth opens and closes. You\'ve never seen him this flustered.\n\n"...Dare?" he manages.\n\n"I dare you to dance with me. Right now. One full song."\n\nShe pulls him up. He goes willingly. The circle cheers. The DJ, sensing the moment, drops something slow. Tyler puts his hands on her waist like he\'s handling fine china. Zara rolls her eyes fondly and pulls him closer.\n\nYour best friend is having his moment. Your turn is next.',scene:'party',mood:'#fd79a8',effects:{relationships:{tyler:2,zara:1},flags:{tyler_zara_moment:true}},choices:[{text:'Spin the bottle. Your turn.',next:'fp_spin_result'},{text:'Slip out while everyone\'s watching Tyler — explore the party.',next:'fp_kitchen_chill'}]},
fp_kiss_mia:{text:'The room goes quiet. Mia\'s eyes widen, then soften. She looks at you for a long moment — reading your face, deciding.\n\nThen she leans forward.\n\nThe kiss is brief and electric. Her lips taste like fruit punch. The circle erupts — cheering, stamping feet, someone throws a cup in the air. Zara is screaming.\n\nWhen you pull apart, Mia\'s cheeks are pink but she\'s smiling. She tucks her hair behind her ear. "Not bad, psych class," she says quietly, just for you.\n\nThe game continues but neither of you are paying attention to it anymore.',scene:'party',mood:'#fd79a8',effects:{flags:{kissed_mia_spin:true,mia_romance:true},relationships:{mia:4}},choices:[{text:'After the game, ask Mia to go somewhere quieter.',next:'fp_roof_mia',effects:{relationships:{mia:2},flags:{with_mia:true}}},{text:'Stay in the circle — ride the energy.',next:'fp_mia_truth'}]},
fp_mia_chooses:{text:'Mia meets your eyes. The room waits.\n\n"Truth," she says, and you feel the collective disappointment ripple around the circle.\n\nZara groans. "BORING. Fine — truth. Ask her something good at least."\n\nMia looks at you expectantly. The question is yours.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:1}},choices:[{text:'"Have you ever had a crush on someone in this room?"',next:'fp_mia_truth',effects:{relationships:{mia:1}}},{text:'"What\'s the most spontaneous thing you\'ve ever done?"',next:'fp_mia_truth',effects:{relationships:{mia:1}}}]},
fp_dare:{text:'Zara\'s eyes light up. "DARE. I love dare. Okay..." She thinks. The circle watches.\n\n"I dare you to go up to the DJ and request the most embarrassing song you can think of. And you have to dance to it. The whole song."\n\nThe circle laughs. You stand up. Time to commit.',scene:'party',mood:'#fdcb6e',effects:{stats:{cou:1}},choices:[{text:'Do the dare. Own it completely.',next:'fp_dare_done',check:{stat:'cou',dc:8}},{text:'Pick the most ridiculous song possible.',next:'fp_dare_done',check:{stat:'cha',dc:9}}]},
fp_dare_done:{text:'You walk up to the DJ, whisper your request, and wait.\n\nThe opening notes hit and the ENTIRE party reacts. People are dying. You hit the dance floor and give it everything — every terrible move, every dramatic gesture, full commitment.\n\nBy the end of the song, people are dancing WITH you. It went from embarrassing to iconic. You get a standing ovation from the bottle spin circle when you return.\n\n"LEGEND," Zara declares. Even Chad is clapping.\n\nMia is watching you with a look that says she\'s seeing you differently now.',scene:'party',mood:'#00b894',effects:{relationships:{mia:2,zara:2,chad:1},flags:{dare_legend:true},stats:{cha:1,cou:1}},choices:[{text:'Sit back down, riding the high.',next:'fp_mia_truth'},{text:'Walk over to Mia with that confidence.',next:'fp_meet_mia_confident'}]},
