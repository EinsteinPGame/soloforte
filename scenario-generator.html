fp_fight_watch:{text:'You step back. The crowd forms a loose circle — half worried, half recording on their phones.\n\nThe outsider shoves the Kappa brother. The brother stumbles into a table. Cups go flying. Someone screams.\n\nChad tackles the outsider before a real punch lands. Two more brothers pin the guy\'s arms. It\'s over in seconds, but the damage is done — the vibe is broken. People are grabbing their things. Someone\'s calling campus security.\n\nThe party empties fast after that. Within twenty minutes, it\'s just the Kappa brothers cleaning up broken cups and the lingering smell of spilled beer.\n\nYou could\'ve done something. You didn\'t. That\'s not a judgment — it\'s just a fact that\'s going to sit with you.',scene:'party',mood:'#2d3436',effects:{stats:{cou:-1},flags:{fight_happened:true}},choices:[{text:'Help clean up. It\'s the least you can do.',next:'fp_cleanup',effects:{relationships:{chad:1},stats:{cha:1}}},{text:'Find Tyler. Time to go home.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:1}}},{text:'Stay and sit with whoever\'s still here.',next:'fp_kitchen_late'}]},

// === CLEANUP / AFTERMATH ===
fp_cleanup:{text:'The house looks like a crime scene made of red cups. You grab a trash bag from under the sink and start picking up.\n\nChad notices. Doesn\'t say anything at first — just works alongside you, sweeping broken glass, wiping counters. The silence is comfortable.\n\n"You don\'t have to do this," he says eventually. "You\'re not a brother."\n\n"I know. But the floor\'s sticky and it\'s bothering me."\n\nHe laughs — tired but real. "You know what, you\'re alright. Come to the next one. You\'ve got a standing invite."\n\nBy the time you leave, the kitchen is cleaner than when the party started. There\'s something satisfying about that — making something better than you found it.',scene:'party',mood:'#fdcb6e',effects:{relationships:{chad:4},stats:{cha:1,per:1},flags:{helped_cleanup:true}},choices:[{text:'Head home. It\'s been one hell of a night.',next:'fp_ending_good',effects:{flags:{chad_invite:true}}},{text:'One more moment on the porch before leaving.',next:'fp_ending_solo'}]},

// === JAKE DEEPER PATH ===
fp_jake_philosophy:{text:'Jake adjusts his position on the beanbag. "You ever think about how weird parties are? Like, objectively?\n\n"Fifty strangers cramming into a room, drinking poison, yelling over music, trying to form connections that\'ll probably evaporate by Monday. And we call it fun."\n\n"Is it fun for you?"\n\n"The conversations are. Like this one." He pauses. "The performance part? No. I hate the performance part. Everyone pretending to be cooler or drunker or more confident than they are."\n\nHe picks up a bottle cap and rolls it between his fingers.\n\n"I think the best thing about 2 AM is that people run out of energy to fake it. That\'s when the real stuff happens."',scene:'party',mood:'#636e72',effects:{relationships:{jake:3},stats:{int:2}},choices:[{text:'"So this is the real you?"',next:'fp_jake_real',effects:{relationships:{jake:2}}},{text:'"What do you perform as during the day?"',next:'fp_jake_mask',effects:{relationships:{jake:2},stats:{int:1}}},{text:'"You\'d get along with Luna. She thinks the same way."',next:'fp_jake_luna_intro',effects:{relationships:{jake:1,luna:1}}}]},
fp_jake_real:{text:'"Pretty much." He shrugs. "I don\'t really have a party version. What you see is what you get — quiet, overthinks everything, will destroy you at chess if you let me."\n\n"That\'s refreshing."\n\n"Or boring. Depends who you ask." He smiles. "But you\'re still sitting here, so maybe refreshing."\n\nThe room has emptied. It\'s just you and Jake and the lo-fi playlist he put on when the main speakers died. He pulls out his phone and shows you a note — it\'s a list titled "THINGS I WANT TO BUILD."\n\nAn app that matches people by music taste. A short film about loneliness that\'s actually funny. A coffee shop where every table has a chess board.\n\n"I write everything down because I know I won\'t do most of it. But having the list means the ideas existed. That counts for something."',scene:'party',mood:'#636e72',effects:{relationships:{jake:4},stats:{int:1},flags:{jake_real:true}},choices:[{text:'"The coffee shop one. Do that one."',next:'fp_jake_deep',effects:{relationships:{jake:2}}},{text:'"Can I add something to the list?"',next:'fp_jake_deep',effects:{relationships:{jake:3},stats:{cha:1}}},{text:'This guy might be the best person you\'ve met tonight.',next:'fp_ending_good',effects:{relationships:{jake:3}}}]},
fp_jake_mask:{text:'"During the day? I\'m the quiet kid in the back of lecture hall who asks one question per semester, and it\'s always the one that makes the professor go \'huh, actually, good point.\' Then I go back to being invisible."\n\nHe grins. "I\'m campus furniture. People sit near me without seeing me. Which is fine — I hear EVERYTHING. I know more secrets than the campus gossip page."\n\n"That sounds lonely."\n\n"It\'s..." He considers. "Lonely-adjacent. I\'m alone a lot, but I don\'t always feel lonely. It\'s more like... waiting. For the right people to notice I exist."\n\nHe looks at you. "Maybe tonight was a good night for that."',scene:'party',mood:'#636e72',effects:{relationships:{jake:4},stats:{per:1,int:1},flags:{jake_lonely:true}},choices:[{text:'"I notice. For what it\'s worth."',next:'fp_jake_deep',effects:{relationships:{jake:4},stats:{cha:1}}},{text:'"Want to be less invisible? I can introduce you to people."',next:'fp_jake_deep',effects:{relationships:{jake:2},stats:{cha:1},flags:{jake_intro_offer:true}}},{text:'Say nothing. Just bump his fist. Some things don\'t need words.',next:'fp_ending_good',effects:{relationships:{jake:3}}}]},
fp_jake_luna_intro:{text:'"Luna? Art major Luna? Yeah, we had a class together. She drew me once without asking." He pauses. "It was actually really good. Made me look less boring than I am."\n\n"Want me to get her? I think you two would have a lot to talk about."\n\n"I—" He hesitates. This is the most uncertain you\'ve seen him. "Yeah. Okay. But if she doesn\'t want to, don\'t force it."\n\nYou find Luna on the porch and mention Jake. Her face lights up.\n\n"Jake! The quiet genius from Art History? He asked the best question all semester. I\'ve been wanting to talk to him for months."\n\nShe practically runs to the chill room. When you peek in ten minutes later, they\'re sitting cross-legged facing each other, and Luna\'s drawing him again. He\'s smiling — really smiling — for the first time tonight.',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:3,luna:3},stats:{cha:2},flags:{connected_jake_luna:true}},choices:[{text:'Leave them to it. You played matchmaker. Well done.',next:'fp_kitchen_late',effects:{stats:{cha:1}}},{text:'Join them for a while. This energy is infectious.',next:'fp_fire_chill',effects:{relationships:{jake:1,luna:1}}},{text:'Head out. This is a good note to end on.',next:'fp_ending_good',effects:{flags:{matchmaker:true}}}]},

// === NADIA DEEPER PATH ===
fp_nadia_study:{text:'"Can I ask you something personal?" you say.\n\nNadia raises an eyebrow. "Brave. Go ahead."\n\n"Why pre-med? Like, the real reason. Not the resume answer."\n\nShe\'s quiet for a long time. Long enough that you think she\'s not going to answer.\n\n"My grandmother had cancer. I was twelve. I watched doctors talk about her like she was a case number. Nobody looked her in the eyes. Nobody asked how she felt — just what her labs said."\n\nShe turns her cup slowly.\n\n"She died. And I decided I\'d be the doctor who looks people in the eyes. Even if it hurts. Especially if it hurts."',scene:'party',mood:'#636e72',effects:{relationships:{nadia:5},stats:{int:1,per:1},flags:{nadia_real_reason:true}},choices:[{text:'"She would be proud of you." (Simple, sincere)',next:'fp_nadia_walls_down',effects:{relationships:{nadia:4},stats:{cha:1}}},{text:'"That\'s... the most real thing anyone\'s said tonight."',next:'fp_nadia_walk',effects:{relationships:{nadia:3}}},{text:'Don\'t say anything. Just meet her eyes. The way she wishes those doctors had.',next:'fp_nadia_walls_down',effects:{relationships:{nadia:5},stats:{per:1,cha:-1}}}]},

// === ZARA EXPANSION ===
fp_zara_dance_deeper:{text:'Zara moves like the music was composed for her. You\'re trying to keep up, and failing, and she doesn\'t care.\n\n"Stop THINKING about it!" she shouts over the bass. "Your body knows what to do. Your brain is the problem!"\n\nShe grabs your hands and pulls you into a spin. You stumble. She catches you. You\'re both laughing.\n\n"There. THAT. That\'s dancing. Not the steps — the feeling."\n\nThe song changes to something slower. The crowd thins slightly. Zara doesn\'t let go of your hand.\n\n"One more song?" she asks. But the way she says it, she\'s asking about more than dancing.',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:4},stats:{cou:1}},choices:[{text:'"One more. Then you teach me that spin move properly."',next:'fp_zara_slow_dance',effects:{relationships:{zara:3},stats:{cou:1,int:-1}}},{text:'"Actually — want to get out of here? The music\'s better outside."',next:'fp_backyard',effects:{relationships:{zara:2}}},{text:'One more song turns into three. Then five. You lose count.',next:'fp_zara_lost_in_it',effects:{relationships:{zara:4},stats:{cou:2,per:-1}}}]},
fp_zara_slow_dance:{text:'The slow song is something old — a remix that keeps the bass but strips everything else down to vocals and piano.\n\nZara steps closer. Her hand moves from yours to your shoulder. You\'re swaying now, not really dancing — just moving together in a way that feels natural.\n\n"You\'re better at this than you think," she says, her voice low enough that only you can hear.\n\n"The slow stuff is easier."\n\n"The slow stuff is harder. It\'s just you and the other person and no choreography to hide behind."\n\nShe rests her forehead against your chin. She smells like vanilla and sweat and something sweet you can\'t name. The song ends. Neither of you moves.',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:5},stats:{cou:1},flags:{danced_slow_zara:true}},choices:[{text:'Stay in the moment. Let the next song decide.',next:'fp_zara_lost_in_it',effects:{relationships:{zara:3}}},{text:'"Want to go sit by the fire?"',next:'fp_fire_chill',effects:{relationships:{zara:2}}},{text:'Gently tilt her chin up.',next:'fp_zara_almost_kiss',effects:{relationships:{zara:4}},check:{stat:'cou',dc:11}}]},
fp_zara_lost_in_it:{text:'You don\'t know how long you danced. The DJ cycled through four different genres. Your feet hurt. Your shirt is damp. And somehow, at some point, Zara\'s hand ended up intertwined with yours and neither of you mentioned it.\n\nThe lights come up — harsh and fluorescent, the party\'s death rattle.\n\n"Oh god," Zara says, blinking. "What time is it?"\n\n"Late."\n\n"Late-late or oh-no-late?"\n\nYou check your phone. 2:47 AM.\n\n"Oh-no-late."\n\nShe laughs and squeezes your hand. "Best oh-no-late I\'ve ever had." She pulls out her phone. "Give me your number. I\'m going to text you tomorrow and pretend I\'m not thinking about tonight."',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:5},stats:{cou:1},flags:{zara_number:true,zara_dance_night:true}},choices:[{text:'Give her your number. Walk her out.',next:'fp_ending_good',effects:{relationships:{zara:3},flags:{zara_ending:true}}},{text:'"Or you could text me right now. So I know it\'s not a dream."',next:'fp_ending_good',effects:{relationships:{zara:4},flags:{zara_ending:true}}},{text:'"One last dance. The DJ hasn\'t kicked us out yet."',next:'fp_ending_good',effects:{relationships:{zara:3},flags:{zara_ending:true}}}]},
fp_zara_almost_kiss:{text:'You tilt her chin up. She doesn\'t pull away. Her eyes search yours in the flashing lights.\n\nFor a second, everything stops — the music, the crowd, the chaos.\n\nThen she puts a finger on your lips. Gently.\n\n"Not here," she whispers. "Not with thirty people watching and their phones out. I\'m not gonna be someone\'s party story."\n\nShe\'s not rejecting you. She\'s protecting the moment.\n\n"Walk me home later?" she asks. "When the real night starts."',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:4},stats:{per:1},flags:{zara_later:true}},choices:[{text:'"I\'ll be here."',next:'fp_zara_lost_in_it',effects:{relationships:{zara:3}}},{text:'Respect it completely. "Whenever you\'re ready."',next:'fp_dance_floor',effects:{relationships:{zara:2},stats:{cha:1}}},{text:'That took guts — hers, not yours. Admire her for it.',next:'fp_fire_chill',effects:{relationships:{zara:2},stats:{per:1}}}]},

// === BAD ENDINGS EXPANSION ===
fp_ending_humiliation:{text:'It happens fast.\n\nYou\'re talking to someone — you don\'t even remember who — and the punch catches up. The room tilts. You grab the nearest thing for support, which turns out to be a table. The table collapses. Cups cascade like dominoes. Beer soaks into the carpet in a spreading dark circle.\n\nSilence. Then laughter. Then phones.\n\nYou can see yourself from above — lying on a wet floor, covered in cheap beer, surrounded by strangers recording your worst moment. Someone\'s already typing a caption.\n\nTyler helps you up. "We gotta go. Now."\n\nThe walk home is quiet. Your clothes smell like beer and shame. Tomorrow morning, you\'ll see the video — 47 likes, 12 shares, three comments you\'ll remember for years.\n\nSome nights change your life. Some nights just scar it.\n\n---\n\nBAD ENDING: VIRAL MOMENT\n\nThe video gets taken down eventually. The memory doesn\'t.',scene:'dark',mood:'#d63031',effects:{flags:{ending_humiliation:true,chapter1_complete:true}},choices:[{text:'TRY AGAIN — Return to Menu',next:'_menu'}]},

fp_ending_blackout:{text:'The last thing you remember clearly is someone saying "one more." After that, everything becomes impressionist — blurred colors, disconnected sounds, faces you can\'t place.\n\nYou wake up on a couch that isn\'t yours. Morning light cuts through unfamiliar blinds. Your phone is dead. Your wallet is in your shoe for reasons you can\'t explain. There\'s a Sharpie drawing of a mustache on your hand.\n\nYou piece together the night from texts:\n\nTyler (2:14 AM): "dude where did you go"\nTyler (2:47 AM): "seriously where are you"\nTyler (3:12 AM): "found you. youre on chads couch. left water next to you"\n\nTyler took care of you. You don\'t deserve Tyler.\n\nThe headache is physical. The embarrassment is something else entirely. You don\'t know what you said last night. What you did. Who saw.\n\nThat uncertainty is worse than any hangover.\n\n---\n\nBAD ENDING: BLACKOUT\n\nYou\'ll never know exactly what happened. Maybe that\'s for the best.',scene:'dark',mood:'#2d3436',effects:{flags:{ending_blackout:true,chapter1_complete:true}},choices:[{text:'TRY AGAIN — Return to Menu',next:'_menu'}]},

fp_ending_ghosted:{text:'The party ends. Not with a bang — with a long, slow fade. People leave in pairs, in groups, laughing and leaning on each other. Car doors. Uber headlights. The music drops to ambient.\n\nAnd you\'re alone.\n\nNot the peaceful kind of alone. The kind where you talked to a dozen people and connected with none of them. Where you stood at the edge of every circle and never quite entered. Where everyone exchanged numbers and nobody asked for yours.\n\nYou walk home at 3 AM. The campus is beautiful in the dark — old brick and lamplight and the distant sound of someone playing guitar from a dorm window. It should feel cinematic. It just feels empty.\n\nYour phone has no new messages.\n\nYou tell yourself it doesn\'t matter. That parties are overrated. That the right people will find you eventually.\n\nBut "eventually" is a long word when you\'re walking alone at 3 AM.\n\n---\n\nBAD ENDING: GHOST\n\nSome nights you\'re the main character. Some nights you\'re an extra in everyone else\'s story.',scene:'dark',mood:'#2d3436',effects:{flags:{ending_ghost:true,chapter1_complete:true}},choices:[{text:'TRY AGAIN — Return to Menu',next:'_menu'}]},

// === HALLWAY EXPLORATION ARC ===
fp_hallway_upstairs:{text:'The upstairs hallway is dim — a single bulb casting long shadows. The music is muffled up here, more vibration than sound. Three doors: one open (a bedroom converted to a coat room, jackets piled on the bed), one closed (a bathroom, light leaking under the door), and one at the end with a "DO NOT ENTER — THIS MEANS YOU" sign.\n\nPhotos line the walls — frat composites going back decades. Men in suits, graduating classes, formal events. There\'s a continuity to it that\'s almost touching.\n\nSomeone comes out of the bathroom. It\'s Jake, drying his hands on his jeans.\n\n"Oh hey. Lost? The party\'s downstairs." He grins. "Unless you\'re looking for the roof access — it\'s through that door." He points at the DO NOT ENTER door.',scene:'party',mood:'#636e72',effects:{relationships:{jake:1}},choices:[{text:'"The roof? Is that allowed?"',next:'fp_roof_access',effects:{relationships:{jake:1}}},{text:'Look at the photos. "How long has this frat been around?"',next:'fp_hallway_photos',effects:{stats:{int:1}}},{text:'Go back downstairs. You don\'t belong up here.',next:'fp_kitchen_late'}]},
fp_roof_access:{text:'Jake shrugs. "Technically no. But I won\'t tell if you won\'t." He pushes the door open. Behind it, a narrow staircase leads to a trapdoor in the ceiling.\n\n"Best view on campus," he says. "I go up there when I need to think. Or when the party gets too... party."\n\nHe hesitates. "Want company, or is this a solo mission?"',scene:'party',mood:'#636e72',effects:{},choices:[{text:'"Come with me. I could use a guide."',next:'fp_jake_roof',effects:{relationships:{jake:2}}},{text:'"Solo mission. But thanks for the tip."',next:'fp_roof_solo'},{text:'"Actually — is Luna up there? I saw her heading upstairs."',next:'fp_roof_luna',requires:{met_luna_first:true}}]},
fp_jake_roof:{text:'The roof is even better than Jake promised. Clear sky, campus lights, the distant hum of the city. You and Jake sit on the ledge, feet dangling.\n\n"I built this frat from nothing," he says quietly. "Kappa Sigma was dead when I got here. Six members, no house, no reputation. I recruited, fundraised, renovated." He taps the roof. "Laid some of these tiles myself."\n\n"Why?"\n\n"Because I wanted a place where people felt welcome. Where the weird kid and the popular kid could sit in the same room and nobody made it a thing." He looks at the party below. "Most nights it works. Some nights... it\'s just a party. But tonight feels like one of the good ones."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:4},stats:{int:1,per:1},flags:{jake_roof:true}},choices:[{text:'"You built something real. That matters."',next:'fp_jake_deep',effects:{relationships:{jake:3}}},{text:'"What happens when you graduate? Who takes over?"',next:'fp_jake_philosophy',effects:{relationships:{jake:2}}},{text:'Sit in comfortable silence. The view says enough.',next:'fp_ending_good',effects:{relationships:{jake:3}}}]},
fp_hallway_photos:{text:'You lean in close to the photos. 1987. 1994. 2003. Rows of young men in suits, trying to look serious. Some of the older ones are yellowed and cracking.\n\nJake notices you looking. "That one—" he taps a photo from 1998. "—is my dad. He was Kappa Sigma president. And that one—" he taps 2001 "—is the guy who donated the house. Made a fortune in tech. Still sends money every year."\n\n"There\'s a continuity thing that gets me," Jake says. "All these guys stood where we\'re standing. Had the same late nights, the same dramas. Some of them are CEOs now. Some are teachers. Some are just... living their lives."\n\nHe\'s not bragging. He\'s genuinely moved by it.\n\n"I wonder which photo I\'ll be in."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:3},stats:{int:1}},choices:[{text:'"The one people remember." (Sincere)',next:'fp_jake_roof',effects:{relationships:{jake:3}}},{text:'"The one where your tie is crooked and you\'re making a face."',next:'fp_jake_talk',effects:{relationships:{jake:2},stats:{cha:1}}},{text:'Take a photo of the wall. This deserves to be remembered.',next:'fp_hallway_upstairs',effects:{stats:{per:1}}}]},

// === PHONE EXCHANGE / CH2 HOOKS ===
fp_number_exchange:{text:'The party is winding down. People are leaving in pairs, in groups, some stumbling, some steady. The energy has shifted from electric to warm — like embers after a fire.\n\nYou realize you haven\'t exchanged numbers with the people who mattered tonight. This is the window — ten minutes from now, everyone scatters and the night becomes a memory.\n\nWho do you want to stay in touch with?',scene:'party',mood:'#fdcb6e',effects:{},choices:[{text:'Find Mia before she leaves.',next:'fp_number_mia',requires:{met_mia_confident:true}},{text:'Find Luna. You want to see that sketchbook again.',next:'fp_number_luna',requires:{met_luna_first:true}},{text:'Find Nadia. She\'s probably already gone, but worth trying.',next:'fp_number_nadia',requires:{met_nadia:true}},{text:'You already have the numbers that matter. Head home.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:1}}}]},
fp_number_mia:{text:'You find Mia by the front door, putting on her shoes. She sees you and pauses.\n\n"Hey. I was going to find you before I left, but—" She holds up her phone. "I don\'t actually have your number. Which is insane, given that we\'ve been talking for three hours."\n\nYou exchange numbers. She types yours in, then immediately sends a text: a single star emoji.\n\n"So you know it\'s me," she says. "When I inevitably text you tomorrow pretending I\'m not thinking about tonight."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{mia_number_ch2:true}},choices:[{text:'"I\'ll be thinking about it too."',next:'fp_ending_good',effects:{relationships:{mia:3}}},{text:'"Text me whenever. Even if it\'s to name more fake constellations."',next:'fp_ending_good',effects:{relationships:{mia:3}}},{text:'Walk her home.',next:'fp_walk_home_mia',effects:{relationships:{mia:2}}}]},
fp_number_luna:{text:'Luna is on the porch, sketchbook in hand, drawing the aftermath — empty cups, string lights, the silhouette of someone asleep on a lawn chair.\n\n"You\'re capturing the crime scene," you say.\n\nShe smiles without looking up. "Every party has a before and after. The after is always more interesting. Less performance."\n\nShe finishes a line, then looks at you. "I don\'t usually give my number out at parties. But you\'re not the usual party person." She tears a corner from her sketchbook — it has her number written in pencil, with a tiny crescent moon doodled next to it.\n\n"She prepared that in advance," you realize.\n\n"Maybe," she says. Not embarrassed. Just honest.',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:4},flags:{luna_number_ch2:true}},choices:[{text:'"I\'ll text you. Maybe we can find another rooftop."',next:'fp_ending_good',effects:{relationships:{luna:3}}},{text:'Ask to keep the drawing she did of you earlier.',next:'fp_ending_luna',effects:{relationships:{luna:4}}},{text:'"Want to watch the sunrise from up there?" (gesture at the roof)',next:'fp_ending_luna',effects:{relationships:{luna:3}}}]},
fp_number_nadia:{text:'You find Nadia at the end of the block, walking fast, hands in her jacket pockets. She turns when she hears your footsteps.\n\n"Are you following me?" Not accusatory. Amused.\n\n"I didn\'t get your number. And you\'re walking away at the speed of someone who\'s about to disappear."\n\n"That is literally my move at every party." She stops walking. Considers. "Fine. But I have rules. No good morning texts. No \'wyd\' at 2 AM. And if you text me something boring, I will roast you without mercy."\n\n"Deal."\n\nShe takes your phone, types her number, and hands it back. Under the name field she\'s typed: "Nadia (the interesting one from the fridge)."',scene:'party',mood:'#fdcb6e',effects:{relationships:{nadia:3},flags:{nadia_number_ch2:true}},choices:[{text:'"The interesting one. Yeah, that checks out."',next:'fp_ending_good',effects:{relationships:{nadia:2}}},{text:'"Walk you home? I promise not to be boring."',next:'fp_ending_nadia_walk',effects:{relationships:{nadia:2}}},{text:'Let her go. Some connections are better when they leave you wanting more.',next:'fp_ending_good',effects:{relationships:{nadia:1},stats:{int:1}}}]},

fp_mia_luna_meet:{text:'Something unexpected happens — Mia and Luna end up next to each other by the fire pit. You\'re close enough to hear their conversation.\n\n"Your jacket is cute," Mia says. "Is that thrifted?"\n\n"Yeah, a place on 5th." Luna tugs at the collar. "Most of my clothes are secondhand. My art supplies cost too much to waste money on new fabric."\n\n"Okay, I need that thrift spot. I\'ve been looking for something exactly like that." Mia pulls out her phone. "Can I get your number? This is a fashion emergency."\n\nLuna laughs. "I\'ve never had my number requested for fashion consulting before."\n\nYou watch two people you care about connecting. It\'s a strange feeling — warm but bittersweet. If Chapter 2 is coming, they\'ll exist in your world together. That changes things.',scene:'party',mood:'#fdcb6e',effects:{relationships:{mia:1,luna:1},flags:{mia_luna_friends:true}},choices:[{text:'Join them. Three\'s not always a crowd.',next:'fp_fire_chill',effects:{relationships:{mia:1,luna:1}}},{text:'Let them have this. Go find Tyler.',next:'fp_tyler_confides',effects:{relationships:{tyler:1}}},{text:'Head to the kitchen. Give them space.',next:'fp_kitchen_late'}]},

fp_tyler_zara_struggle:{text:'You step back. Tyler flails for another thirty seconds of increasingly terrible conversation before Zara rescues them both.\n\n"You know what? Let\'s just dance. Talking is overrated." She grabs his hand and pulls him toward the music.\n\nTyler looks back at you — betrayed but also grateful, somehow.\n\nTen minutes later, they\'re dancing together and Tyler\'s actually not bad. Sometimes the best thing is to get out of your own way.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:1,zara:1},flags:{tyler_zara_dance:true}},choices:[{text:'Good. He figured it out. Time for your own adventure.',next:'fp_kitchen_late'},{text:'Watch them dance. It\'s cute.',next:'fp_late_observations',effects:{stats:{per:1}}},{text:'Find your own dance partner.',next:'fp_dance_floor',effects:{stats:{cou:1}}}]},

function statCheck(statName, dc) {
  const stat = STATE.player.stats[statName] || 5;
  const roll = Math.floor(Math.random() * 10) + 1;
  const total = stat + roll;
  return {success: total >= dc, roll, stat, total, dc, statName};
}

function applyEffects(effects) {
  if (!effects) return;
  if (effects.flags) Object.assign(STATE.flags, effects.flags);
  if (effects.relationships) {
    for (const [k,v] of Object.entries(effects.relationships)) {
      STATE.relationships[k] = Math.max(-10, Math.min(10, (STATE.relationships[k]||0) + v));
    }
  }
  if (effects.stats) {
    for (const [k,v] of Object.entries(effects.stats)) {
      STATE.player.stats[k] = Math.max(1, Math.min(10, (STATE.player.stats[k]||5) + v));
    }
  }
  if (effects.inventory) {
    effects.inventory.forEach(item => {
      if (!STATE.inventory.includes(item)) STATE.inventory.push(item);
    });
  }
}

function scrollToStory() {
  setTimeout(() => {
    const storyText = document.querySelector('.story-text');
    if (storyText) storyText.scrollIntoView({behavior:'smooth',block:'start'});
  }, 80);
}

function showEffectToasts(effects) {
  if (!effects) return;
  const toasts = [];
  if (effects.stats) {
    for (const [k,v] of Object.entries(effects.stats)) {
      const name = STAT_NAMES[k] || k;
      if (v > 0) toasts.push({text:`${name} +${v}`,cls:'positive'});
      else if (v < 0) toasts.push({text:`${name} ${v}`,cls:'negative'});
    }
  }
  if (effects.relationships) {
    for (const [k,v] of Object.entries(effects.relationships)) {
      const name = k.charAt(0).toUpperCase()+k.slice(1);
      if (v > 0) toasts.push({text:`${name} +${v}`,cls:'positive'});
      else if (v < 0) toasts.push({text:`${name} ${v}`,cls:'negative'});
    }
  }
  if (effects.inventory) {
    effects.inventory.forEach(item => toasts.push({text:`+ ${item}`,cls:'neutral'}));
  }
  if (!toasts.length) return;
  const container = document.createElement('div');
  container.className = 'effect-toast';
  toasts.forEach((t,i) => {
    const el = document.createElement('div');
    el.className = `effect-toast-item ${t.cls}`;
    el.textContent = t.text;
    el.style.animationDelay = `${i*0.1}s, ${1.8+i*0.1}s`;
    container.appendChild(el);
  });
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 2500);
}

function goToNode(nodeId) {
  if (nodeId === '_menu') { STATE.screen = 'menu'; render(); return; }
  const scenario = SCENARIOS[STATE.scenario];
  if (!scenario) return;
  const node = scenario.nodes[nodeId];
  if (!node) return;
  STATE.currentNode = nodeId;
  STATE.history.push(nodeId);
  if (node.effects) { applyEffects(node.effects); showEffectToasts(node.effects); }
  render();
  scrollToStory();
}

function handleChoice(choice) {
  if (choice.effects) { applyEffects(choice.effects); showEffectToasts(choice.effects); }
  if (choice.check) {
    const result = statCheck(choice.check.stat, choice.check.dc);
    STATE.checkResult = result;
    STATE.pendingNext = result.success ? choice.next : (choice.failNext || choice.next);
    render();
  } else {
    goToNode(choice.next);
  }
}

function dismissCheck() {
  const next = STATE.pendingNext;
  STATE.checkResult = null;
  STATE.pendingNext = null;
  if (next) goToNode(next);
  scrollToStory();
}

// ============================================================
// CUTSCENE ENGINE — Graphic Novel Style
// ============================================================
// Cutscenes are arrays of panels shown sequentially (10s total).
// Each panel: {image: 'gradient/emoji', text: 'narration', caption: 'optional'}
// Text and images STAY visible — they build up like a graphic novel.
// Replay button lets you rewatch the sequence.

function playCutscene(panels, onComplete) {
  if (!panels || !panels.length) { if (onComplete) onComplete(); return; }
  const container = document.createElement('div');
  container.className = 'cutscene-container';
  container.style.cssText = 'max-width:700px;margin:0 auto;padding:16px';

  const progressBar = document.createElement('div');
  progressBar.className = 'cutscene-progress';
  progressBar.innerHTML = '<div class="fill" style="width:0%"></div>';
  container.appendChild(progressBar);

  const panelArea = document.createElement('div');
  panelArea.className = 'cutscene-panels';
  container.appendChild(panelArea);

  // Replace game main content with cutscene
  const gameMain = document.querySelector('.game-main');
  if (!gameMain) { if (onComplete) onComplete(); return; }
  const origContent = gameMain.innerHTML;
  gameMain.innerHTML = '';
  gameMain.appendChild(container);

  const perPanel = Math.max(2000, Math.floor(10000 / panels.length));
  let panelIdx = 0;
  let timer = null;

  function showNextPanel() {
    if (panelIdx >= panels.length) {
      progressBar.querySelector('.fill').style.width = '100%';
      // Add replay + continue buttons
      const controls = document.createElement('div');
      controls.style.cssText = 'text-align:center;margin-top:16px';
      controls.innerHTML = `
        <button class="cutscene-replay" id="cs-replay">&#8635; Replay</button>
        <button class="start-btn" id="cs-continue" style="max-width:300px;margin:12px auto;display:block;padding:12px">Continue</button>`;
      container.appendChild(controls);
      document.getElementById('cs-replay').onclick = () => { replayCutscene(); };
      document.getElementById('cs-continue').onclick = () => { if (onComplete) onComplete(); scrollToStory(); };
      return;
    }
    const p = panels[panelIdx];
    const panel = document.createElement('div');
    panel.className = 'cutscene-panel';
    panel.innerHTML = `
      <div class="panel-image" style="background:${p.image || 'linear-gradient(135deg,#2d3436,#636e72)'}">
        ${p.svg ? p.svg : p.icon ? `<span style="font-size:3rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))">${p.icon}</span>` : ''}
      </div>
      <div class="panel-text">${formatText(p.text)}${p.caption ? `<div class="caption">${p.caption}</div>` : ''}</div>`;
    panelArea.appendChild(panel);
    panelIdx++;
    const pct = Math.round((panelIdx / panels.length) * 100);
    progressBar.querySelector('.fill').style.width = pct + '%';
    panel.scrollIntoView({behavior:'smooth',block:'end'});
    if (panelIdx < panels.length) {
      timer = setTimeout(showNextPanel, perPanel);
    } else {
      timer = setTimeout(showNextPanel, 1000);
    }
  }

  function replayCutscene() {
    if (timer) clearTimeout(timer);
    panelArea.innerHTML = '';
    progressBar.querySelector('.fill').style.width = '0%';
    const ctrl = container.querySelector('#cs-replay')?.closest('div');
    if (ctrl) ctrl.remove();
    panelIdx = 0;
    timer = setTimeout(showNextPanel, 500);
  }

  timer = setTimeout(showNextPanel, 500);
}

// Nodes can have a `cutscene` array to trigger before showing the node text.
// We hook into goToNode to check for cutscenes.
const _origGoToNode = goToNode;
goToNode = function(nodeId) {
  if (nodeId === '_menu') { STATE.screen = 'menu'; render(); return; }
  const scenario = SCENARIOS[STATE.scenario];
  if (!scenario) return;
  const node = scenario.nodes[nodeId];
  if (!node) return;
  if (node.cutscene && node.cutscene.length) {
    // Set state first so sidebar updates
    STATE.currentNode = nodeId;
    STATE.history.push(nodeId);
    if (node.effects) applyEffects(node.effects);
    render();
    // Play cutscene, then re-render to show the normal node
    setTimeout(() => {
      playCutscene(node.cutscene, () => {
        render(); // Re-render to show normal text + choices after cutscene
      });
    }, 100);
  } else {
    _origGoToNode(nodeId);
  }
};

function startScenario(id) {
  const sc = SCENARIOS[id];
  if (!sc || !sc.startNode) return;
  STATE.scenario = id;
  STATE.screen = 'setup';
  STATE.player.role = '';
  STATE.preset = 'recommended';
  STATE.player.stats = {...PRESETS.recommended.stats};
  render();
}

function beginGame() {
  if (!STATE.player.name.trim()) { STATE.player.name = 'Player'; }
  const sc = SCENARIOS[STATE.scenario];
  STATE.screen = 'game';
  STATE.currentNode = sc.startNode;
  STATE.flags = {};
  STATE.relationships = {...(sc.relationships || {})};
  STATE.inventory = [];
  STATE.history = [sc.startNode];
  STATE.sidebarOpen = false;
  // Apply role stat bonuses and start flag
  const rd = ROLE_DATA[STATE.player.role];
  if (rd) {
    for (const [k,v] of Object.entries(rd.bonuses)) {
      STATE.player.stats[k] = Math.max(1, Math.min(10, (STATE.player.stats[k]||5) + v));
    }
    if (rd.startFlag) STATE.flags[rd.startFlag] = true;
  }
  if (sc.nodes[sc.startNode]?.effects) applyEffects(sc.nodes[sc.startNode].effects);
  render();
}

// ============================================================
// SAVE / LOAD — Unlimited Dynamic Saves
// ============================================================
function getSaveIndex() {
  try { return JSON.parse(localStorage.getItem('sg_saves') || '[]'); } catch(e) { return []; }
}
function setSaveIndex(ids) { localStorage.setItem('sg_saves', JSON.stringify(ids)); }

function saveGame(saveId) {
  const data = {
    scenario: STATE.scenario,
    player: JSON.parse(JSON.stringify(STATE.player)),
    currentNode: STATE.currentNode,
    flags: {...STATE.flags},
    relationships: {...STATE.relationships},
    inventory: [...STATE.inventory],
    history: [...STATE.history],
    preset: STATE.preset,
    savedAt: new Date().toISOString()
  };
  localStorage.setItem('sg_save_' + saveId, JSON.stringify(data));
  const idx = getSaveIndex();
  if (!idx.includes(saveId)) { idx.unshift(saveId); setSaveIndex(idx); }
  else { idx.splice(idx.indexOf(saveId), 1); idx.unshift(saveId); setSaveIndex(idx); }
}

function createNewSave() {
  const saveId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  saveGame(saveId);
  return saveId;
}

function loadGame(saveId) {
  const raw = localStorage.getItem('sg_save_' + saveId);
  if (!raw) return false;
  const data = JSON.parse(raw);
  Object.assign(STATE, {
    scenario: data.scenario,
    player: data.player,
    currentNode: data.currentNode,
    flags: data.flags || {},
    relationships: data.relationships || {},
    inventory: data.inventory || [],
    history: data.history || [],
    preset: data.preset || 'recommended',
    screen: 'game',
    checkResult: null,
    pendingNext: null
  });
  render();
  return true;
}

function getSaveInfo(saveId) {
  const raw = localStorage.getItem('sg_save_' + saveId);
  if (!raw) return null;
  const data = JSON.parse(raw);
  const meta = SCENARIO_META.find(m => m.id === data.scenario);
  return {
    id: saveId,
    scenario: meta ? meta.title : data.scenario,
    name: data.player.name,
    role: data.player.role,
    node: data.currentNode,
    date: new Date(data.savedAt).toLocaleString(),
    steps: (data.history||[]).length
  };
}

function deleteSave(saveId) {
  localStorage.removeItem('sg_save_' + saveId);
  const idx = getSaveIndex();
  const pos = idx.indexOf(saveId);
  if (pos !== -1) { idx.splice(pos, 1); setSaveIndex(idx); }
}

// Migrate old fixed slots to dynamic system
(function migrateSaves() {
  const idx = getSaveIndex();
  for (let i = 0; i < 5; i++) {
    const key = 'sg_save_' + i;
    const raw = localStorage.getItem(key);
    if (raw && !idx.includes(String(i))) {
      idx.push(String(i));
    }
  }
  if (idx.length) setSaveIndex(idx);
})();

// ============================================================
// PRIVATE UNLOCK
// ============================================================
function handleTitleTap() {
  const now = Date.now();
  if (now - STATE.lastTap > 3000) STATE.titleTaps = 0;
  STATE.lastTap = now;
  STATE.titleTaps++;
  if (STATE.titleTaps >= 5) {
    STATE.titleTaps = 0;
    showUnlockModal();
  }
}

function showUnlockModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Enter Access Code</h3>
      <p style="color:var(--text-dim);font-size:.85rem;margin-bottom:12px">Private scenarios require an access code.</p>
      <div class="unlock-input">
        <input type="password" id="unlock-code" placeholder="CODE" maxlength="20" autocomplete="off">
        <button onclick="tryUnlock()">Unlock</button>
      </div>
      <div id="unlock-error" class="unlock-error"></div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('input').focus();
  overlay.querySelector('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });
}

function tryUnlock() {
  const input = document.getElementById('unlock-code');
  const err = document.getElementById('unlock-error');
  if (input.value.toUpperCase() === PRIVATE_CODE) {
    STATE.privateUnlocked = true;
    localStorage.setItem('sg_private', 'true');
    document.querySelector('.modal-overlay').remove();
    render();
  } else {
    err.textContent = 'Invalid code.';
    input.value = '';
    input.focus();
  }
}

// ============================================================
// RENDERING
// ============================================================
const app = document.getElementById('app');

function render() {
  switch(STATE.screen) {
    case 'menu': renderMenu(); break;
    case 'setup': renderSetup(); break;
    case 'game': renderGameScreen(); break;
  }
}

                  <!-- Web line -->

                    <ellipse cx="8" cy="42" rx="10" ry="14" fill="#c0392b"/>
                    <!-- Blue sides -->
                    <ellipse cx="8" cy="44" rx="10" ry="12" fill="#1a3a6a" clip-path="inset(0 25% 0 25%)"/>
                    <!-- Head -->
                    <circle cx="8" cy="24" r="10" fill="#c0392b"/>
                    <!-- Web lines on head -->
                    <line x1="8" y1="14" x2="8" y2="34" stroke="#8b0000" stroke-width=".5" opacity=".6"/>
                    <line x1="-2" y1="24" x2="18" y2="24" stroke="#8b0000" stroke-width=".5" opacity=".6"/>
                    <line x1="1" y1="16" x2="15" y2="32" stroke="#8b0000" stroke-width=".4" opacity=".4"/>
                    <line x1="15" y1="16" x2="1" y2="32" stroke="#8b0000" stroke-width=".4" opacity=".4"/>
                    <!-- Eyes -->
                    <path d="M2,22 L5,19 L9,22 L5,24 Z" fill="white" stroke="#222" stroke-width=".5"/>
                    <path d="M14,22 L11,19 L7,22 L11,24 Z" fill="white" stroke="#222" stroke-width=".5"/>
                    <!-- Arms -->
                    <line x1="-2" y1="36" x2="-16" y2="28" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
                    <line x1="18" y1="36" x2="32" y2="24" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
                    <!-- Hands -->
                    <circle cx="-16" cy="28" r="2.5" fill="#c0392b"/>
                    <circle cx="32" cy="24" r="2.5" fill="#c0392b"/>
                    <!-- Web from hand -->
                    <line x1="32" y1="24" x2="55" y2="10" stroke="#ddd" stroke-width=".6" opacity=".4"/>
                    <line x1="32" y1="24" x2="50" y2="18" stroke="#ddd" stroke-width=".4" opacity=".3"/>
                    <!-- Legs -->
                    <line x1="2" y1="54" x2="-5" y2="74" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
                    <line x1="14" y1="54" x2="20" y2="72" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
                    <!-- Red boots -->
                    <circle cx="-5" cy="74" r="3" fill="#c0392b"/>
                    <circle cx="20" cy="72" r="3" fill="#c0392b"/>
                    <!-- Spider emblem on chest -->
                    <ellipse cx="8" cy="40" rx="3" ry="2" fill="#111" opacity=".7"/>
                    <!-- Web pattern on torso -->
                    <line x1="8" y1="30" x2="8" y2="54" stroke="#8b0000" stroke-width=".4" opacity=".5"/>
                    <line x1="-2" y1="42" x2="18" y2="42" stroke="#8b0000" stroke-width=".4" opacity=".5"/>
                  </g>
                  <!-- Moon glow -->
                  <circle cx="160" cy="25" r="14" fill="#223" opacity=".3"/>
                  <circle cx="160" cy="25" r="10" fill="#334" opacity=".2"/>
                </svg>
              </div>
              <div class="city-bg"></div>
            ` : `<span class="icon">${m.icon}</span>`}
          </div>
          <span class="card-badge ${playable?'badge-playable':'badge-soon'}">${playable?(isNew?'NEW':'PLAY'):'COMING SOON'}</span>
          <div class="card-body">
            <h3>${m.title}</h3>
            <p>${m.desc}</p>
            <div class="card-tags">${m.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
          </div>
        </div>`;
    }).join('');

  const hasSaves = getSaveIndex().some(id => getSaveInfo(id));

  app.innerHTML = `
    <div class="menu-screen">
      <div class="menu-header">
        <h1 onclick="handleTitleTap()">Scenario Generator</h1>
        <p>Choose your story. Every decision matters.</p>
      </div>
      ${hasSaves ? `<div style="text-align:center;margin-bottom:20px"><button class="topbar-btn" onclick="showLoadModal()" style="padding:10px 24px;font-size:.9rem">Continue Saved Game</button></div>` : ''}
      <div class="scenario-grid">${cards}</div>
    </div>`;
}

function renderSetup() {
  const sc = SCENARIOS[STATE.scenario];
  const meta = sc.meta;
  const roles = sc.roles;

  const roleHTML = roles.length ? `
    <div class="setup-group">
      <label>Choose Your Role</label>
      <div class="role-options">
        ${roles.map(r => {
          const rd = ROLE_DATA[r];
          const bonusText = rd ? Object.entries(rd.bonuses).map(([k,v]) => `${STAT_NAMES[k]||k} ${v>0?'+':''}${v}`).join(', ') : '';
          return `<button class="role-btn ${STATE.player.role===r?'selected':''}" onclick="STATE.player.role='${r}';render()"><strong>${r}</strong>${rd?`<div style="font-size:.75rem;color:var(--text-dim);margin-top:4px">${rd.desc}</div><div style="font-size:.7rem;color:#6c5ce7;margin-top:2px">${bonusText}</div>`:''}</button>`;
        }).join('')}
      </div>
    </div>` : '';

  const presetHTML = Object.entries(PRESETS).map(([k,v]) => `
    <button class="preset-btn ${STATE.preset===k?'selected':''}" onclick="selectPreset('${k}')">
      <div class="name">${v.label}</div>
      <div class="desc">${v.desc}</div>
    </button>`).join('');

  const customHTML = STATE.preset === 'custom' ? `
    <div class="custom-stats">
      ${Object.entries(STAT_NAMES).map(([k,name]) => `
        <div class="stat-input">
          <div class="stat-name">${name}</div>
          <div class="stat-val">${STATE.player.stats[k]}</div>
          <div class="stat-btns">
            <button onclick="adjustStat('${k}',-1)">-</button>
            <button onclick="adjustStat('${k}',1)">+</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="points-left">Points remaining: ${30 - Object.values(STATE.player.stats).reduce((a,b)=>a+b,0)}</div>` : '';

  const canStart = STATE.player.name.trim() && (roles.length === 0 || STATE.player.role) && (STATE.preset !== 'custom' || Object.values(STATE.player.stats).reduce((a,b)=>a+b,0) === 30);

  app.innerHTML = `
    <div class="setup-screen">
      <h2 style="background:${meta.gradient};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${meta.title}</h2>
      <div class="setup-group">
        <label>Your Name</label>
        <input type="text" id="player-name" value="${STATE.player.name}" placeholder="Enter your name..." maxlength="20" oninput="STATE.player.name=this.value">
      </div>
      ${roleHTML}
      <div class="setup-group">
        <label>Difficulty Preset</label>
        <div class="preset-options">${presetHTML}</div>
        ${customHTML}
      </div>
      <button class="start-btn" ${canStart?'':"disabled"} onclick="beginGame()">BEGIN</button>
      <button class="back-link" onclick="STATE.screen='menu';render()">Back to scenarios</button>
    </div>`;
}

function selectPreset(key) {
  STATE.preset = key;
  if (key !== 'custom') {
    STATE.player.stats = {...PRESETS[key].stats};
  } else {
    STATE.player.stats = {str:5,cha:5,int:5,per:5,cou:5,lck:5};
  }
  render();
}

function adjustStat(stat, delta) {
  const total = Object.values(STATE.player.stats).reduce((a,b)=>a+b,0);
  const newVal = STATE.player.stats[stat] + delta;
  if (newVal < 1 || newVal > 10) return;
  if (delta > 0 && total >= 30) return;
  STATE.player.stats[stat] = newVal;
  render();
}

function renderGameScreen() {
  const sc = SCENARIOS[STATE.scenario];
  const node = sc.nodes[STATE.currentNode];
  if (!node) return;
  const meta = sc.meta;

  const moodColor = node.mood || '#1a1a2e';
  const sceneGrad = `linear-gradient(135deg, ${moodColor}, ${moodColor}88, var(--bg))`;

  // Filter choices by flags/conditions/role
  const choices = (node.choices||[]).filter(c => {
    if (c.requires) {
      for (const [k,v] of Object.entries(c.requires)) {
        if (STATE.flags[k] !== v) return false;
      }
    }
    if (c.minRel) {
      for (const [k,v] of Object.entries(c.minRel)) {
        if ((STATE.relationships[k]||0) < v) return false;
      }
    }
    if (c.requireRole && STATE.player.role !== c.requireRole) return false;
    return true;
  });

  const choiceHTML = choices.map((c,i) => {
    let extra = '';
    if (c.check) extra += `<div class="check-info">[${STAT_NAMES[c.check.stat]} check — DC ${c.check.dc}]</div>`;
    if (c.relHint) extra += `<div class="rel-info">${c.relHint}</div>`;
    // Effect preview tags
    let tags = '';
    if (c.effects) {
      const tagParts = [];
      if (c.effects.stats) {
        for (const [k,v] of Object.entries(c.effects.stats)) {
          const cls = v > 0 ? 'stat-up' : 'stat-down';
          tagParts.push(`<span class="effect-tag ${cls}">${STAT_NAMES[k]||k} ${v>0?'+':''}${v}</span>`);
        }
      }
      if (c.effects.relationships) {
        for (const [k,v] of Object.entries(c.effects.relationships)) {
          const cls = v > 0 ? 'rel-up' : 'rel-down';
          tagParts.push(`<span class="effect-tag ${cls}">${k.charAt(0).toUpperCase()+k.slice(1)} ${v>0?'+':''}${v}</span>`);
        }
      }
      if (tagParts.length) tags = `<div class="effect-tags">${tagParts.join('')}</div>`;
    }
    return `<button class="choice-btn" onclick="handleChoice(SCENARIOS['${STATE.scenario}'].nodes['${STATE.currentNode}'].choices[${(node.choices||[]).indexOf(c)}])">${c.text}${extra}${tags}</button>`;
  }).join('');

  // Sidebar: stats
  const statsHTML = Object.entries(STAT_NAMES).map(([k,name]) => {
    const val = STATE.player.stats[k]||5;
    return `<div class="stat-row"><span>${name}</span><span>${val}</span><div class="stat-bar"><div class="stat-fill" style="width:${val*10}%"></div></div></div>`;
  }).join('');

  // Sidebar: relationships
  const relEntries = Object.entries(STATE.relationships).filter(([k,v]) => v !== 0);
  const relHTML = relEntries.length ? relEntries.map(([k,v]) => {
    const cls = v > 0 ? 'positive' : 'negative';
    return `<div class="rel-row"><span>${k.charAt(0).toUpperCase()+k.slice(1)}</span><span class="val ${cls}">${v>0?'+':''}${v}</span></div>`;
  }).join('') : '<div style="font-size:.8rem;color:var(--text-dim)">No relationships yet</div>';

  // Sidebar: inventory
  const invHTML = STATE.inventory.length ? STATE.inventory.map(i => `<div class="inv-item">- ${i}</div>`).join('') : '<div style="font-size:.8rem;color:var(--text-dim)">Empty</div>';

  app.innerHTML = `
    <div class="game-screen">
      <div class="game-topbar">
        <div class="title">${meta.title}</div>
        <div class="actions">
          <button class="topbar-btn" onclick="showSaveModal()">Save</button>
          <button class="topbar-btn" onclick="showLoadModal()">Load</button>
          <button class="topbar-btn" onclick="if(confirm('Return to menu? Unsaved progress will be lost.'))STATE.screen='menu',render()">Menu</button>
        </div>
      </div>
      <div class="game-body">
        <div class="game-main">
          <div class="scene-mood" style="background:${sceneGrad}">
            <span class="icon" style="font-size:2.5rem">${meta.icon}</span>
          </div>
          <button class="sidebar-toggle" onclick="STATE.sidebarOpen=!STATE.sidebarOpen;document.querySelector('.game-sidebar').classList.toggle('open')">Stats & Inventory</button>
          <div class="story-text"><div class="new-text">${formatText(node.text)}</div></div>
          <div class="choice-list">${choiceHTML}</div>
        </div>
        <div class="game-sidebar ${STATE.sidebarOpen?'open':''}">
          <div class="sidebar-section"><h4>Character</h4>
            <div style="font-size:.9rem;font-weight:600;margin-bottom:4px">${STATE.player.name}</div>
            ${STATE.player.role ? `<div style="font-size:.8rem;color:var(--text-dim)">${STATE.player.role}</div>` : ''}
          </div>
          <div class="sidebar-section"><h4>Stats</h4>${statsHTML}</div>
          <div class="sidebar-section"><h4>Relationships</h4>${relHTML}</div>
          <div class="sidebar-section"><h4>Inventory</h4>${invHTML}</div>
        </div>
      </div>
    </div>`;

  // Check result overlay
  if (STATE.checkResult) {
    const cr = STATE.checkResult;
    const overlay = document.createElement('div');
    overlay.className = 'check-result';
    overlay.innerHTML = `
      <div class="inner">
        <div style="font-size:.85rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px">${STAT_NAMES[cr.statName]} Check</div>
        <div style="font-size:.75rem;color:var(--accent);margin-top:4px">Your ${STAT_NAMES[cr.statName]}: ${cr.stat}</div>
        <div class="roll-display ${cr.success?'success':'fail'}">${cr.success?'SUCCESS':'FAILED'}</div>
        <div class="roll-detail">${STAT_NAMES[cr.statName]} ${cr.stat} + Roll ${cr.roll} = ${cr.total} vs DC ${cr.dc}</div>
        <button onclick="dismissCheck()">Continue</button>
      </div>`;
    document.body.appendChild(overlay);
  }
}

function formatText(text) {
  return text.replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[(.+?)\]/g, '<span style="color:var(--accent);font-style:italic">[$1]</span>');
}

function showSaveModal() {
  const idx = getSaveIndex();
  const existingSlots = idx.map(id => {
    const info = getSaveInfo(id);
    if (!info) return '';
    return `<div class="save-slot" style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;cursor:pointer" onclick="saveGame('${id}');this.closest('.modal-overlay').remove()">
        <div class="slot-name">${info.scenario}</div>
        <div class="slot-info">${info.name} (${info.role||'no role'}) | ${info.steps} steps | ${info.date}</div>
      </div>
      <button onclick="event.stopPropagation();if(confirm('Delete this save?')){deleteSave('${id}');this.closest('.modal-overlay').remove();showSaveModal()}" style="background:none;color:var(--danger);font-size:1.1rem;padding:4px 8px" title="Delete">&#10005;</button>
    </div>`;
  }).filter(Boolean).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>Save Game</h3>
    <div class="save-slot" onclick="createNewSave();this.closest('.modal-overlay').remove()" style="border:1px dashed var(--accent);text-align:center">
      <div class="slot-name" style="color:var(--accent)">+ New Save</div>
    </div>
    ${existingSlots}
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>`;
  document.body.appendChild(overlay);
}

function showLoadModal() {
  const idx = getSaveIndex();
  const slots = idx.map(id => {
    const info = getSaveInfo(id);
    if (!info) return '';
    return `<div class="save-slot" style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;cursor:pointer" onclick="loadGame('${id}');this.closest('.modal-overlay').remove()">
        <div class="slot-name">${info.scenario}</div>
        <div class="slot-info">${info.name} (${info.role||'no role'}) | ${info.steps} steps | ${info.date}</div>
      </div>
      <button onclick="event.stopPropagation();if(confirm('Delete this save?')){deleteSave('${id}');this.closest('.modal-overlay').remove();showLoadModal()}" style="background:none;color:var(--danger);font-size:1.1rem;padding:4px 8px" title="Delete">&#10005;</button>
    </div>`;
  }).filter(Boolean).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>Load Game</h3>${slots || '<div style="text-align:center;color:var(--text-dim);padding:20px">No saved games</div>'}
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>`;
  document.body.appendChild(overlay);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
