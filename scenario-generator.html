fp_morning_wake:{characters:[],text:'Saturday. 11:47 AM.\n\nYour eyes open to a dorm room that looks like a crime scene — shoes scattered, a jacket you don\'t recognize draped over a chair, Tyler face-down on his bed with one sock on.\n\nYour phone screen lights up the ceiling. Notifications. Lots of them.\n\nYou reach for it, squinting against the daylight leaking through the blinds. Your mouth tastes like regret and fruit punch. But under the hangover haze, there\'s something else — a warm feeling. Like last night actually meant something.\n\nThe phone unlocks. Your heart does a little flip at what you see.',scene:'party',mood:'#fdcb6e',effects:{flags:{morning_wake:true}},choices:[{text:'Check texts first.',next:'fp_morning_texts'},{text:'Check Instagram — someone tagged you in stories.',next:'fp_morning_insta'},{text:'Ignore the phone. Wake Tyler up.',next:'fp_morning_tyler',effects:{relationships:{tyler:1}}}]},

fp_morning_texts:{characters:[],text:'Your texts read like a timeline of last night\'s connections:\n\n**Tyler** (3:17 AM): "bro i just want you to know ur the best friend ive ever had ok goodnight"\n**Tyler** (3:18 AM): "dont tell anyone i said that"\n**Tyler** (3:19 AM): "actually tell everyone i dont care"\n\n' + '**Group Chat: "KAPPA SATURDAY"** — 47 unread messages. Chad added you at some point. The chat is mostly memes from the party and people rating their hangovers on a scale of 1-10.\n\nAnd then... a text from someone specific. Someone who matters.\n\nYour heart rate picks up.',scene:'party',mood:'#fdcb6e',effects:{stats:{per:1}},choices:[{text:'Check Mia\'s text.',next:'fp_morning_mia_text',requires:{mia_romance:true}},{text:'Check Luna\'s text.',next:'fp_morning_luna_text',requires:{got_luna_number:true}},{text:'Check Nadia\'s text.',next:'fp_morning_nadia_text',requires:{nadia_chemistry:true}},{text:'No special text. Just the group chat. Reply to Tyler.',next:'fp_morning_tyler'}]},

fp_morning_mia_text:{characters:['mia'],text:'**Mia** (2:34 AM): "hey"\n**Mia** (2:34 AM): "so"\n**Mia** (2:35 AM): "tonight was good"\n**Mia** (2:41 AM): "really good actually"\n**Mia** (2:47 AM): "are you in davis\'s 10am or 2pm section? asking for scheduling purposes"\n**Mia** (2:47 AM): "that sounded weird"\n**Mia** (2:48 AM): "goodnight :)"\n\nYou stare at the screen. Six texts. She sent SIX texts. At 2 AM. Mia, who plays it cool, who never shows her cards — sent six increasingly unguarded messages to you.\n\nYour thumbs hover over the keyboard. This reply matters. A lot.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:2},stats:{per:1}},choices:[{text:'"Morning :) 2pm section. Save me a seat?"',next:'fp_morning_reply_smooth',effects:{relationships:{mia:3},stats:{cha:1}}},{text:'"I had a really good time too. Want to get coffee before class Monday?"',next:'fp_morning_coffee_ask',effects:{relationships:{mia:4},stats:{cou:1}}},{text:'Send her a meme about fruit punch. Keep it light.',next:'fp_morning_reply_casual',effects:{relationships:{mia:1}}},{text:'Wait. Don\'t reply yet. Let her sweat a little.',next:'fp_morning_wait_game',effects:{relationships:{mia:-1},stats:{int:1}}}]},

fp_morning_luna_text:{characters:['luna'],text:'**Luna** (4:12 AM): [image: a quick sketch of two stick figures watching a sunrise, captioned "us (approximate)"]\n**Luna** (4:13 AM): "i dont usually do this but i wanted you to have the digital version too"\n**Luna** (4:14 AM): "if you want to see more of my work or whatever... no pressure"\n**Luna** (4:15 AM): "or just hang out. art-adjacent hanging out."\n\nShe drew you a sketch. At 4 AM. And then tried to play it cool and failed beautifully.\n\nYou zoom into the drawing. It\'s simple but perfect — two figures silhouetted against a sky full of stars, one slightly leaning toward the other. She captured something real.\n\nYour thumbs find the keyboard.',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:2},stats:{per:1}},choices:[{text:'"This is beautiful. I want to see everything you\'ve drawn."',next:'fp_morning_luna_gallery',effects:{relationships:{luna:4},stats:{cha:1}}},{text:'"Art-adjacent hanging out sounds perfect. When?"',next:'fp_morning_coffee_ask_luna',effects:{relationships:{luna:3}}},{text:'Send back a terrible stick figure drawing of your own. Caption: "my contribution"',next:'fp_morning_luna_funny',effects:{relationships:{luna:2},stats:{cha:2}}}]},

fp_morning_nadia_text:{characters:['nadia'],text:'**Nadia** (1:58 AM): "Hypothesis: last night was statistically unlikely."\n**Nadia** (1:59 AM): "Probability of meeting someone genuinely interesting at a frat party: approximately 3.7%"\n**Nadia** (1:59 AM): "You are an outlier."\n**Nadia** (2:03 AM): "This is my version of a compliment. I am aware it needs work."\n\nYou read it three times. Nadia, the girl who speaks in data and keeps everyone at arm\'s length, just called you an outlier. In Nadia-speak, that\'s basically a love letter.\n\nShe texted first. That probably took her 45 minutes of deliberation.',scene:'party',mood:'#74b9ff',effects:{relationships:{nadia:3},stats:{int:1}},choices:[{text:'"3.7%? I\'ll take those odds. Coffee on Monday?"',next:'fp_morning_coffee_ask_nadia',effects:{relationships:{nadia:3},stats:{cha:1}}},{text:'"Your version of a compliment is my favorite version. Don\'t change it."',next:'fp_morning_nadia_warm',effects:{relationships:{nadia:4},stats:{per:1}}},{text:'"Sample size of one party. We need more data points. Next Saturday?"',next:'fp_morning_nadia_science',effects:{relationships:{nadia:3},stats:{int:2}}}]},

fp_morning_insta:{characters:[],text:'Instagram is a minefield.\n\nSomeone — you suspect Chad — posted a story from the beer pong table. You\'re in the background of at least three people\'s photos. One of them is genuinely flattering. The other two are... not.\n\nZara posted a boomerang of the dance floor. You can see Tyler\'s elbow.\n\nBut the one that stops your scrolling is a candid photo someone took without you noticing. You\'re talking to someone by the fire pit, and whatever you\'re saying has them laughing. You look relaxed. Happy. Like you belong.\n\nYou didn\'t know you could look like that.\n\n47 people liked Chad\'s story. 3 people followed you overnight. The campus social machine is already processing last night\'s data.',scene:'party',mood:'#fdcb6e',effects:{stats:{per:1,cha:1}},choices:[{text:'Like Chad\'s post. You\'re part of the crew now.',next:'fp_morning_tyler',effects:{relationships:{chad:1}}},{text:'Screenshot the candid. New profile pic material.',next:'fp_morning_tyler',effects:{stats:{cha:1}}},{text:'Check who followed you. One name jumps out.',next:'fp_morning_texts',effects:{stats:{per:1}}}]},

fp_morning_tyler:{characters:['tyler'],text:'You throw a pillow at Tyler. He groans like a dying animal.\n\n"Five more minutes."\n\n"It\'s almost noon, Tyler."\n\nHe rolls over, hair plastered to one side of his face, mascara from someone smudged on his cheek. "Worth it," he mumbles. Then his eyes fly open. "WAIT. Did last night actually happen? Did I actually dance with Zara? Or was that a dream?"\n\n"It happened."\n\n"Did she... did she seem... like she had a good time?"\n\n"Tyler. She literally pulled you onto the dance floor."\n\nHe sits up slowly, processing this information like a computer loading a very large file. Then a grin breaks across his face — genuine, surprised, luminous.\n\n"Dude. College is AWESOME."\n\nHe immediately checks his phone. Then looks at you, terrified. "She didn\'t text me. Is that bad? Should I text her? What do I say? How long do I wait? WHAT ARE THE RULES?"',scene:'party',mood:'#00b894',effects:{relationships:{tyler:2}},choices:[{text:'"Text her now. Something simple. \'Last night was fun.\'"',next:'fp_morning_tyler_advice',effects:{relationships:{tyler:2}}},{text:'"Wait until tonight. Play it cool."',next:'fp_morning_tyler_advice',effects:{relationships:{tyler:1}}},{text:'"Give me your phone. I\'ll do it."',next:'fp_morning_tyler_wingman',effects:{relationships:{tyler:3},stats:{cha:1}}},{text:'Suggest breakfast first. "Nobody makes good decisions on an empty stomach."',next:'fp_morning_breakfast',effects:{relationships:{tyler:2}}}]},

fp_morning_tyler_advice:{characters:['tyler'],text:'Tyler nods vigorously at whatever you said, then spends 15 minutes crafting a 4-word text.\n\n"Hey! Last night was fun :)"\n\nHe sends it. Then immediately regrets the exclamation point. Then regrets the smiley face. Then regrets the text. Then regrets being born.\n\nThree minutes later, his phone buzzes. Zara replied.\n\n"hey! it really was 😊 you should come to the thing at the quad next week"\n\nTyler doesn\'t speak for thirty seconds. He just shows you the screen, hand trembling slightly.\n\nThen he screams into his pillow.\n\nYou let him have this moment.',scene:'party',mood:'#00b894',effects:{relationships:{tyler:3,zara:1},flags:{tyler_zara_texting:true}},choices:[{text:'"See? I told you. Now get up — we need food."',next:'fp_morning_breakfast',effects:{relationships:{tyler:1}}},{text:'Check your own phone. Time to face your own messages.',next:'fp_morning_texts'}]},

fp_morning_tyler_wingman:{characters:['tyler'],text:'Tyler hands over his phone like a soldier surrendering his weapon. "Don\'t make me sound weird."\n\nYou type: "Hey Zara — Tyler here (the tall one who can\'t dance but tried anyway). Last night was the most fun I\'ve had since getting to campus. If you\'re free this week, I\'d love to grab coffee and prove I\'m slightly less awkward when sober."\n\nTyler reads it over your shoulder. "That\'s... that\'s actually perfect. How are you better at being me than I am?"\n\nYou hit send. Tyler covers his face with both hands and waits.\n\nThe response comes in 90 seconds.\n\n"omg tyler yes!! wednesday? there\'s a great spot on college ave. and for the record your dancing was adorable"\n\nTyler\'s face goes through surprise, disbelief, joy, and then something softer — gratitude. He looks at you.\n\n"You know I\'d literally die for you, right? Like, literally."',scene:'party',mood:'#00b894',effects:{relationships:{tyler:5,zara:2},flags:{tyler_zara_date:true}},choices:[{text:'Best wingman in the game. Now get breakfast.',next:'fp_morning_breakfast',effects:{relationships:{tyler:1}}},{text:'Your turn. Check your own phone.',next:'fp_morning_texts'}]},

fp_morning_breakfast:{characters:[],text:'The campus dining hall on a Saturday morning is a post-party support group. Everyone\'s in sweats, sunglasses indoors, mainlining coffee like it\'s an IV drip.\n\nYou and Tyler grab a table by the window. He\'s got three hash browns and an orange juice. You\'ve got whatever your hungover brain decided was food.\n\n"So," Tyler says through a mouthful of hash brown. "Real talk. Last night — was it everything you wanted?"\n\nYou think about it. The nerves at the front door. The music. The people. The conversations that felt real. The moments that surprised you.\n\n"Yeah," you say. "It was."\n\nTyler nods. "Me too." He pauses. "What happens Monday though? When we see everyone in class?"\n\nThat\'s the question, isn\'t it. The party was one night. The semester is everything after.',scene:'party',mood:'#fdcb6e',effects:{stats:{per:1},flags:{had_breakfast:true}},choices:[{text:'"Monday, we walk in like we belong. Because we do."',next:'fp_morning_end_confident',effects:{stats:{cou:2,cha:1}}},{text:'"I don\'t know. But I\'m not worried about it."',next:'fp_morning_end_peaceful',effects:{stats:{per:1,int:1}}},{text:'"Monday... I have psych at 2PM."',next:'fp_morning_end_anticipation',requires:{mia_romance:true},effects:{relationships:{mia:1}}}]},

fp_morning_reply_smooth:{characters:[],text:'You type it out, double-check for typos, and hit send.\n\n"Morning :) 2pm section. Save me a seat?"\n\nThree dots appear immediately. She was waiting.\n\n**Mia**: "deal. but i get the armrest"\n**Mia**: "non-negotiable"\n\nYou\'re grinning at your phone like an idiot. Tyler looks over.\n\n"Is that HER? Let me see. LET ME SEE."\n\nYou show him. He pumps both fists in the air.\n\n"PSYCH CLASS ROMANCE! I CALLED IT! I literally called it week one. Ask anyone."\n\nMonday can\'t come fast enough.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{mia_monday_plan:true}},choices:[{text:'Best Saturday ever. End the morning on a high.',next:'fp_morning_end_anticipation',effects:{relationships:{mia:1}}},{text:'Get breakfast with Tyler. Process everything.',next:'fp_morning_breakfast'}]},

fp_morning_coffee_ask:{characters:[],text:'You type it before you can overthink it.\n\n"I had a really good time too. Want to get coffee before class Monday?"\n\nSend. Delivered. Read.\n\nThe wait is 47 seconds but it feels like a semester.\n\n**Mia**: "wow okay jumping straight to coffee"\n**Mia**: "...yes. absolutely yes."\n**Mia**: "there\'s a place on elm street that does this lavender latte thing. meet at 1?"\n\nShe said yes. With details. She had a place in mind — which means she\'d already thought about it. About this. About you.\n\nMonday, 1 PM. Elm Street. Lavender latte.\n\nYou add it to your calendar like it\'s a final exam.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:5},flags:{coffee_date_mia:true}},choices:[{text:'Tell Tyler the news.',next:'fp_morning_tyler',effects:{relationships:{tyler:1}}},{text:'This is the perfect note to end on.',next:'fp_morning_end_anticipation'}]},

fp_morning_reply_casual:{characters:[],text:'You send a meme — that one with the cat looking at a glass of punch with deep suspicion. Caption: "me vs the mystery punch last night."\n\nHer reply comes fast.\n\n**Mia**: "LMAO that punch was criminal"\n**Mia**: "pretty sure it was 90% sugar 10% regret"\n**Mia**: "good thing the company was better than the drinks 😉"\n\nA wink emoji. From Mia. Who never uses emojis.\n\nYou file this data point away carefully.',scene:'party',mood:'#fdcb6e',effects:{relationships:{mia:2},flags:{mia_chatting:true}},choices:[{text:'Keep the conversation going. This is fun.',next:'fp_morning_texts',effects:{relationships:{mia:1}}},{text:'Leave it there — keep her wanting more.',next:'fp_morning_tyler'}]},

fp_morning_wait_game:{characters:[],text:'You put the phone down. Don\'t reply. It\'s a strategy — the kind you read about somewhere or maybe saw in a movie. Create mystery. Make her wonder.\n\n30 minutes pass. An hour. You check — no follow-up text from her. She\'s not the type to double-text.\n\nBut you notice something: she posted an Instagram story. A photo of sunrise from the campus clocktower. No caption. No tags.\n\nShe went to the clocktower to watch the sunrise. Alone. After texting you.\n\nYou suddenly feel like maybe playing games with someone who stayed up until 3 AM thinking about you isn\'t the power move you thought it was.\n\nIt\'s just... kind of lonely.',scene:'party',mood:'#636e72',effects:{stats:{per:2},relationships:{mia:-2}},choices:[{text:'Screw it. Text her back now.',next:'fp_morning_reply_smooth',effects:{relationships:{mia:1}}},{text:'Learn from this. Get breakfast. Be genuine next time.',next:'fp_morning_breakfast',effects:{stats:{int:1}}}]},

fp_morning_end_confident:{characters:['tyler'],text:'"We walk in like we belong."\n\nTyler raises his orange juice like a champagne glass. "To belonging."\n\nYou clink your coffee mug against it. The dining hall buzzes around you — hundreds of students nursing hangovers, planning weekends, living their lives. And for the first time since you got to this campus, you feel like you\'re one of them.\n\nNot a visitor. Not an imposter. Just... here.\n\nThe semester stretches ahead, full of classes and parties and conversations and people you haven\'t met yet. And you\'re ready for all of it.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nYou walked in a stranger. You walk out... something more. The party was just the beginning.\n\nChapter 2: "Monday Morning" — where the real story starts. Coming soon.',scene:'party',mood:'#00b894',effects:{flags:{ch1_complete_confident:true,chapter1_complete:true}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_end_peaceful:{characters:[],text:'"I don\'t know. But I\'m not worried about it."\n\nAnd you mean it. Something shifted last night — not dramatically, not in a movie-montage way, but in the quiet way that real changes happen. You went to a party. You talked to people. You were yourself, and that was enough.\n\nTyler finishes his hash brown and leans back. "You know what? Same. Whatever happens, happens."\n\nOutside the window, the campus is waking up. A jogger. A dog walker. Someone carrying what appears to be a traffic cone (every campus has one). Normal, ordinary Saturday.\n\nBut it feels different now. It feels like yours.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nNot every story needs a dramatic ending. Sometimes the best conclusion is the quiet certainty that you\'ll be okay.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#fdcb6e',effects:{flags:{ch1_complete_peaceful:true,chapter1_complete:true}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_end_anticipation:{characters:[],text:'Monday. 2 PM. Psych class.\n\nYou walk in three minutes early. The seat next to the one you always take is empty. Your heart is doing something complicated.\n\nThen Mia walks in. She sees you. And she smiles — not the careful, measured smile she wears around most people. A real one. The kind that reaches her eyes.\n\nShe drops her bag on the empty seat. "I believe I was promised armrest rights."\n\n"Non-negotiable, as discussed."\n\nShe sits. Close enough that your arms are almost touching. Professor Davis starts talking about cognitive biases. Neither of you are listening.\n\nUnder the desk, her knee bumps yours. She doesn\'t move it away.\n\nThe semester has 14 weeks left. You have a feeling they\'re going to be interesting.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nWhat starts at a party doesn\'t have to end at one.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#fd79a8',effects:{flags:{ch1_complete_mia:true,chapter1_complete:true},relationships:{mia:3}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_luna_gallery:{characters:['luna'],text:'Luna sends you a link to her portfolio. You scroll through it in bed — sketches, paintings, graphic novel panels. She draws like she sees the world at a different resolution than everyone else.\n\n"These are incredible," you type. And then, because you mean it: "You have an actual gift."\n\nHer reply takes a while. When it comes, it\'s just three words:\n\n"Thank you. Really."\n\nAnd then: "Art show at the student center next Friday. I have two pieces in it. No pressure but... I\'d like you to be there."\n\nYou screenshot the date and time. You\'re going. Of course you\'re going.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nSome connections are made with words. Some are made with art. The best ones are made with both.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#6c5ce7',effects:{flags:{ch1_complete_luna:true,chapter1_complete:true},relationships:{luna:5}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_coffee_ask_luna:{characters:['luna'],text:'"Art-adjacent hanging out. When?"\n\nLuna\'s reply comes with a location pin: a coffee shop called "Grounds for Thought" with a reading nook and exposed brick.\n\n"Wednesday, 3pm? They have this corner booth that\'s basically designed for sketching. Bring something to read — you can be my ambient human."\n\nYou don\'t know what an ambient human is but you\'re absolutely in.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nThe roof was just the prologue.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#6c5ce7',effects:{flags:{ch1_complete_luna_coffee:true,chapter1_complete:true,luna_date:true},relationships:{luna:4}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_luna_funny:{characters:['luna'],text:'You spend 3 minutes drawing the worst stick figure in human history. Two circles for a head (you messed up the first one), legs that are different lengths, and what\'s either arms or antennae.\n\nYou caption it: "my contribution. please display this at your next art show"\n\nHer reply: a voice message. 11 seconds of pure, uncontrolled laughter.\n\nThen: "I\'m framing this. This is going on my wall. You absolute disaster."\n\nThen: "...want to get lunch this week? I know a place where the food is better than your art (low bar)"\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nThe best relationships start with a laugh.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#6c5ce7',effects:{flags:{ch1_complete_luna_funny:true,chapter1_complete:true,luna_lunch:true},relationships:{luna:4}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_coffee_ask_nadia:{characters:['nadia'],text:'"3.7%? I\'ll take those odds. Coffee on Monday?"\n\nNadia takes exactly 4 minutes to reply. You know because you counted.\n\n"Acceptable. But I choose the location. The campus Starbucks has a 40% error rate on orders and I refuse to be a data point in their failure statistics."\n\nShe sends the address of a small independent cafe called "The Variable" — because of course it\'s called that.\n\n"Monday. 4pm. I\'ll be the one reading a neuroscience textbook recreationally."\n\nYou smile. This is going to be the most intellectually intimidating coffee date of your life. You can\'t wait.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nSome people connect through chemistry. Some through conversation. With Nadia, it\'s through curiosity.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#74b9ff',effects:{flags:{ch1_complete_nadia:true,chapter1_complete:true,nadia_date:true},relationships:{nadia:4}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_nadia_warm:{characters:['nadia'],text:'"Your version of a compliment is my favorite version. Don\'t change it."\n\nThe typing indicator appears. Disappears. Appears again. Four minutes.\n\n"Nobody has ever said that to me before."\n\nA pause.\n\n"Most people want me to be... softer. More approachable. Less like a peer-reviewed journal and more like a text message."\n\nAnother pause.\n\n"You\'re the first person who seems to actually like the way I communicate."\n\nYour chest tightens. Under all that armor of data and statistics, Nadia is just someone who wants to be understood. And last night, in a crowded kitchen at a frat party, you understood her.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nThe rarest connection isn\'t the one that\'s easy — it\'s the one that\'s real.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#74b9ff',effects:{flags:{ch1_complete_nadia_warm:true,chapter1_complete:true},relationships:{nadia:5}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_morning_nadia_science:{characters:['nadia'],text:'"Sample size of one party. We need more data points. Next Saturday?"\n\nNadia\'s reply is instantaneous — the fastest she\'s ever responded:\n\n"Finally. Someone who understands the scientific method."\n\nThen: "But I\'m not going to another frat party. The independent variables are too chaotic. I propose a controlled environment — dinner. Just us. I\'ll collect qualitative data on whether you\'re as interesting sober."\n\nShe proposed dinner. Nadia, who doesn\'t do social events, who tests people before letting them within arm\'s length, just asked you to dinner. Using science as an excuse, but still.\n\n"Saturday, 7pm. I\'ll text you the location after I\'ve reviewed at least four restaurants on three different criteria."\n\nOf course she will.\n\n---\n\nCHAPTER 1 COMPLETE: "THE FIRST NIGHT"\n\nHypothesis: this is the start of something unprecedented. Confidence level: 97.3%.\n\nChapter 2: "Monday Morning" — Coming soon.',scene:'party',mood:'#74b9ff',effects:{flags:{ch1_complete_nadia_date:true,chapter1_complete:true,nadia_dinner:true},relationships:{nadia:5}},choices:[{text:'Return to Menu',next:'_menu'}]},

fp_help_freshman:{characters:[],text:'You sit down next to Jake and the overwhelmed freshman. The kid — he can\'t be older than 18 — looks like he\'s two minutes from calling his mom.\n\n"First party?" you ask.\n\nHe nods miserably. "My roommate ditched me and I don\'t know anyone and I\'ve been standing by the fridge for 45 minutes pretending to read the label on a bottle of hot sauce."\n\nYou laugh. Not at him — with him, because you WERE him, two hours ago.\n\n"Want to know a secret?" you say. "I walked in here tonight knowing exactly one person. And I was terrified."\n\nHis eyes widen. "Seriously?"\n\n"Seriously. And now—" you gesture at the party around you, at Jake, at the world you somehow became part of tonight, "—now I\'m here."\n\nJake watches this exchange with a small smile. He catches your eye and nods. Respect.\n\nThe freshman\'s shoulders relax. "Okay. Where do I start?"\n\n"The fire pit. Trust me."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:3},stats:{cha:2,per:1},flags:{helped_freshman:true}},choices:[{text:'Walk him to the fire pit. Pay it forward.',next:'fp_ending_good',effects:{stats:{cha:1}}},{text:'This is the right way to end the night.',next:'fp_ending_solo',effects:{stats:{per:1,int:1}}}]},

fp_kitchen_2am:{characters:[],text:'The kitchen at 2 AM is a different planet. The main party has migrated to the dance floor and backyard, leaving the kitchen to the stragglers — the ones who want one more conversation before the night ends.\n\nSomeone left a bag of Doritos on the counter. It becomes a communal offering. Five strangers sit on the kitchen floor, sharing chips and life stories.\n\nA girl who hasn\'t said much all night suddenly looks up: "Does anyone else feel like college is just... performing? Like we\'re all pretending to know what we\'re doing?"\n\nThe silence that follows isn\'t awkward. It\'s honest.\n\n"Every single day," someone says.\n\n"Same."\n\n"God, same."\n\nAnd then everyone laughs, and the pretending stops, just for a moment.',scene:'party',mood:'#636e72',effects:{stats:{per:2,int:1}},choices:[{text:'Stay for the kitchen philosophy. This is the realest part of the night.',next:'fp_kitchen_philosophy'},{text:'This is the perfect last memory. Head home.',next:'fp_ending_good',effects:{stats:{per:1}}},{text:'Check on your people one last time.',next:'fp_late_observations'}]},

fp_mia_opens_up:{characters:['mia'],text:'Mia pulls her knees up on the step, making herself smaller. "Okay. Real answer? I hate parties because I\'m scared of being the boring one. In a room full of loud, interesting people, I\'m the girl who\'d rather be reading. And I\'ve spent my whole life being told that\'s wrong — that I should \'put myself out there\' and \'be more fun.\' As if being quiet means being broken."\n\nShe picks at the edge of her shoe. "Tonight I came because Zara literally wouldn\'t take no for an answer. And I was ready to hate every minute. But then..." she looks at you sideways. "Then I met someone who actually listened. Like, really listened. Not waiting for their turn to talk, but actually hearing me."\n\nShe\'s quiet for a moment. "That doesn\'t happen a lot."\n\nThe stairwell feels very small. Your heartbeat feels very loud.\n\n"For the record," she says, barely above a whisper, "you\'re the least boring person I\'ve met all semester."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:5},stats:{per:2},flags:{mia_opened_up:true}},choices:[{text:'"You\'re not broken. You\'re just... selective. And I\'m glad I made the cut."',next:'fp_roof_mia',effects:{relationships:{mia:3},stats:{cha:1}}},{text:'Don\'t say anything. Just take her hand.',next:'fp_mia_walk_talk',effects:{relationships:{mia:4},stats:{cou:2}}},{text:'"Want to get out of here? Just us?"',next:'fp_mia_walk_talk',effects:{relationships:{mia:3},stats:{cou:1}}}]},

fp_mia_looking:{characters:['mia'],text:'You scan the party for Mia. She\'s not at the beer pong table, not on the dance floor, not in the kitchen.\n\nThen you spot her — on the back porch, leaning against the railing, looking at her phone. She\'s alone, which is weird because Mia is never alone at these things; Zara usually has her in an iron social grip.\n\nShe looks up as you approach. Her expression shifts through several things — surprise, relief, something softer — before settling into a smile.\n\n"Hey. I was hoping you\'d find me."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{found_mia_alone:true}},choices:[{text:'"I was looking for you."',next:'fp_mia_stairs',effects:{relationships:{mia:2},stats:{cou:1}}},{text:'"Everything okay?"',next:'fp_mia_opens_up',effects:{relationships:{mia:2},stats:{per:1}}},{text:'Sit next to her on the porch. Let the silence do the talking.',next:'fp_roof_mia',effects:{relationships:{mia:2}}}]},

fp_ending_fight_expelled:{characters:[],text:'The punch connects before you even realize you threw it.\n\nEverything after is adrenaline and noise and hands pulling you apart. Campus security arrives in four minutes. The other guy has a split lip. You have bloody knuckles and a sinking feeling that you just changed the trajectory of your semester.\n\nThe security officer takes your student ID. "You\'ll be hearing from the Dean of Students. Both of you."\n\nTyler walks you home in silence. He\'s not angry — he\'s scared. For you.\n\n"What were you thinking?"\n\n"I wasn\'t."\n\n"Yeah. I know."\n\nThe disciplinary hearing is in two weeks. Best case: academic probation. Worst case: the thing nobody wants to say out loud.\n\nOne punch. That\'s all it takes.\n\n---\n\nBAD ENDING: ONE PUNCH\n\nSome mistakes can be unlearned. Some can\'t be undone.',scene:'dark',mood:'#d63031',effects:{flags:{ending_expelled:true,chapter1_complete:true}},choices:[{text:'TRY AGAIN — Return to Menu',next:'_menu'}]}

const SCENARIOS = {};
SCENARIO_META.forEach(m => {
  SCENARIOS[m.id] = {
    meta: m,
    roles: SCENARIO_ROLES[m.id] || [],
    nodes: m.id === 'zombie' ? ZOMBIE_NODES : m.id === 'fratparty' ? FRATPARTY_NODES : {},
    startNode: m.id === 'zombie' ? 'zo_wake' : m.id === 'fratparty' ? 'fp_arrival' : null,
    relationships: m.id === 'fratparty' ? {mia:0,zara:0,luna:0,jake:0,tyler:0,chad:0,nadia:0} : m.id === 'zombie' ? {maya:0,marcus:0} : {}
  };
});

// ============================================================
// ENGINE
// ============================================================
function statCheck(statName, dc) {
  const stat = STATE.player.stats[statName] || 5;
  const roll = Math.floor(Math.random() * 10) + 1;
  const total = stat + roll;
  return {success: total >= dc, roll, stat, total, dc, statName};
}

function applyEffects(effects) {
  if (!effects) return;
  if (effects.flags) Object.assign(STATE.flags, effects.flags);
  if (effects.relationships) {
    for (const [k,v] of Object.entries(effects.relationships)) {
      STATE.relationships[k] = Math.max(-10, Math.min(10, (STATE.relationships[k]||0) + v));
    }
  }
  if (effects.stats) {
    for (const [k,v] of Object.entries(effects.stats)) {
      STATE.player.stats[k] = Math.max(1, Math.min(10, (STATE.player.stats[k]||5) + v));
    }
  }
  if (effects.inventory) {
    effects.inventory.forEach(item => {
      if (!STATE.inventory.includes(item)) STATE.inventory.push(item);
    });
  }
}

function scrollToStory() {
  setTimeout(() => {
    const storyText = document.querySelector('.story-text');
    if (storyText) storyText.scrollIntoView({behavior:'smooth',block:'start'});
  }, 80);
}

function showEffectToasts(effects) {
  if (!effects) return;
  const toasts = [];
  if (effects.stats) {
    for (const [k,v] of Object.entries(effects.stats)) {
      const name = STAT_NAMES[k] || k;
      if (v > 0) toasts.push({text:`${name} +${v}`,cls:'positive'});
      else if (v < 0) toasts.push({text:`${name} ${v}`,cls:'negative'});
    }
  }
  if (effects.relationships) {
    for (const [k,v] of Object.entries(effects.relationships)) {
      const name = k.charAt(0).toUpperCase()+k.slice(1);
      if (v > 0) toasts.push({text:`${name} +${v}`,cls:'positive'});
      else if (v < 0) toasts.push({text:`${name} ${v}`,cls:'negative'});
    }
  }
  if (effects.inventory) {
    effects.inventory.forEach(item => toasts.push({text:`+ ${item}`,cls:'neutral'}));
  }
  if (!toasts.length) return;
  const container = document.createElement('div');
  container.className = 'effect-toast';
  toasts.forEach((t,i) => {
    const el = document.createElement('div');
    el.className = `effect-toast-item ${t.cls}`;
    el.textContent = t.text;
    el.style.animationDelay = `${i*0.1}s, ${1.8+i*0.1}s`;
    container.appendChild(el);
  });
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 2500);
}

function goToNode(nodeId) {
  if (nodeId === '_menu') { STATE.screen = 'menu'; render(); return; }
  const scenario = SCENARIOS[STATE.scenario];
  if (!scenario) return;
  const node = scenario.nodes[nodeId];
  if (!node) return;
  STATE.currentNode = nodeId;
  STATE.history.push(nodeId);
  if (node.effects) { applyEffects(node.effects); showEffectToasts(node.effects); }
  render();
  scrollToStory();
}

function handleChoice(choice) {
  if (choice.effects) { applyEffects(choice.effects); showEffectToasts(choice.effects); }
  if (choice.check) {
    const result = statCheck(choice.check.stat, choice.check.dc);
    STATE.checkResult = result;
    STATE.pendingNext = result.success ? choice.next : (choice.failNext || choice.next);
    render();
  } else {
    goToNode(choice.next);
  }
}

function dismissCheck() {
  const next = STATE.pendingNext;
  STATE.checkResult = null;
  STATE.pendingNext = null;
  if (next) goToNode(next);
  scrollToStory();
}

// ============================================================
// CUTSCENE ENGINE — Graphic Novel Style
// ============================================================
// Cutscenes are arrays of panels shown sequentially (10s total).
// Each panel: {image: 'gradient/emoji', text: 'narration', caption: 'optional'}
// Text and images STAY visible — they build up like a graphic novel.
// Replay button lets you rewatch the sequence.

function playCutscene(panels, onComplete) {
  if (!panels || !panels.length) { if (onComplete) onComplete(); return; }
  const container = document.createElement('div');
  container.className = 'cutscene-container';
  container.style.cssText = 'max-width:700px;margin:0 auto;padding:16px';

  const progressBar = document.createElement('div');
  progressBar.className = 'cutscene-progress';
  progressBar.innerHTML = '<div class="fill" style="width:0%"></div>';
  container.appendChild(progressBar);

  const panelArea = document.createElement('div');
  panelArea.className = 'cutscene-panels';
  container.appendChild(panelArea);

  // Replace game main content with cutscene
  const gameMain = document.querySelector('.game-main');
  if (!gameMain) { if (onComplete) onComplete(); return; }
  const origContent = gameMain.innerHTML;
  gameMain.innerHTML = '';
  gameMain.appendChild(container);

  const perPanel = Math.max(2000, Math.floor(10000 / panels.length));
  let panelIdx = 0;
  let timer = null;

  function showNextPanel() {
    if (panelIdx >= panels.length) {
      progressBar.querySelector('.fill').style.width = '100%';
      // Add replay + continue buttons
      const controls = document.createElement('div');
      controls.style.cssText = 'text-align:center;margin-top:16px';
      controls.innerHTML = `
        <button class="cutscene-replay" id="cs-replay">&#8635; Replay</button>
        <button class="start-btn" id="cs-continue" style="max-width:300px;margin:12px auto;display:block;padding:12px">Continue</button>`;
      container.appendChild(controls);
      document.getElementById('cs-replay').onclick = () => { replayCutscene(); };
      document.getElementById('cs-continue').onclick = () => { if (onComplete) onComplete(); scrollToStory(); };
      return;
    }
    const p = panels[panelIdx];
    const panel = document.createElement('div');
    panel.className = 'cutscene-panel';
    panel.innerHTML = `
      <div class="panel-image" style="background:${p.image || 'linear-gradient(135deg,#2d3436,#636e72)'}">
        ${p.svg ? p.svg : p.icon ? `<span style="font-size:3rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))">${p.icon}</span>` : ''}
      </div>
      <div class="panel-text">${formatText(p.text)}${p.caption ? `<div class="caption">${p.caption}</div>` : ''}</div>`;
    panelArea.appendChild(panel);
    panelIdx++;
    const pct = Math.round((panelIdx / panels.length) * 100);
    progressBar.querySelector('.fill').style.width = pct + '%';
    panel.scrollIntoView({behavior:'smooth',block:'end'});
    if (panelIdx < panels.length) {
      timer = setTimeout(showNextPanel, perPanel);
    } else {
      timer = setTimeout(showNextPanel, 1000);
    }
  }

  function replayCutscene() {
    if (timer) clearTimeout(timer);
    panelArea.innerHTML = '';
    progressBar.querySelector('.fill').style.width = '0%';
    const ctrl = container.querySelector('#cs-replay')?.closest('div');
    if (ctrl) ctrl.remove();
    panelIdx = 0;
    timer = setTimeout(showNextPanel, 500);
  }

  timer = setTimeout(showNextPanel, 500);
}

// Nodes can have a `cutscene` array to trigger before showing the node text.
// We hook into goToNode to check for cutscenes.
const _origGoToNode = goToNode;
goToNode = function(nodeId) {
  if (nodeId === '_menu') { STATE.screen = 'menu'; render(); return; }
  const scenario = SCENARIOS[STATE.scenario];
  if (!scenario) return;
  const node = scenario.nodes[nodeId];
  if (!node) return;
  if (node.cutscene && node.cutscene.length) {
    // Set state first so sidebar updates
    STATE.currentNode = nodeId;
    STATE.history.push(nodeId);
    if (node.effects) applyEffects(node.effects);
    render();
    // Play cutscene, then re-render to show the normal node
    setTimeout(() => {
      playCutscene(node.cutscene, () => {
        render(); // Re-render to show normal text + choices after cutscene
      });
    }, 100);
  } else {
    _origGoToNode(nodeId);
  }
};

function startScenario(id) {
  const sc = SCENARIOS[id];
  if (!sc || !sc.startNode) return;
  STATE.scenario = id;
  STATE.screen = 'setup';
  STATE.player.role = '';
  STATE.preset = 'recommended';
  STATE.player.stats = {...PRESETS.recommended.stats};
  render();
}

function beginGame() {
  if (!STATE.player.name.trim()) { STATE.player.name = 'Player'; }
  const sc = SCENARIOS[STATE.scenario];
  STATE.screen = 'game';
  STATE.currentNode = sc.startNode;
  STATE.flags = {};
  STATE.relationships = {...(sc.relationships || {})};
  STATE.inventory = [];
  STATE.history = [sc.startNode];
  STATE.sidebarOpen = false;
  // Apply role stat bonuses and start flag
  const rd = ROLE_DATA[STATE.player.role];
  if (rd) {
    for (const [k,v] of Object.entries(rd.bonuses)) {
      STATE.player.stats[k] = Math.max(1, Math.min(10, (STATE.player.stats[k]||5) + v));
    }
    if (rd.startFlag) STATE.flags[rd.startFlag] = true;
  }
  if (sc.nodes[sc.startNode]?.effects) applyEffects(sc.nodes[sc.startNode].effects);
  render();
}

// ============================================================
// SAVE / LOAD — Unlimited Dynamic Saves
// ============================================================
function getSaveIndex() {
  try { return JSON.parse(localStorage.getItem('sg_saves') || '[]'); } catch(e) { return []; }
}
function setSaveIndex(ids) { localStorage.setItem('sg_saves', JSON.stringify(ids)); }

function saveGame(saveId) {
  const data = {
    scenario: STATE.scenario,
    player: JSON.parse(JSON.stringify(STATE.player)),
    currentNode: STATE.currentNode,
    flags: {...STATE.flags},
    relationships: {...STATE.relationships},
    inventory: [...STATE.inventory],
    history: [...STATE.history],
    preset: STATE.preset,
    savedAt: new Date().toISOString()
  };
  localStorage.setItem('sg_save_' + saveId, JSON.stringify(data));
  const idx = getSaveIndex();
  if (!idx.includes(saveId)) { idx.unshift(saveId); setSaveIndex(idx); }
  else { idx.splice(idx.indexOf(saveId), 1); idx.unshift(saveId); setSaveIndex(idx); }
}

function createNewSave() {
  const saveId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  saveGame(saveId);
  return saveId;
}

function loadGame(saveId) {
  const raw = localStorage.getItem('sg_save_' + saveId);
  if (!raw) return false;
  const data = JSON.parse(raw);
  Object.assign(STATE, {
    scenario: data.scenario,
    player: data.player,
    currentNode: data.currentNode,
    flags: data.flags || {},
    relationships: data.relationships || {},
    inventory: data.inventory || [],
    history: data.history || [],
    preset: data.preset || 'recommended',
    screen: 'game',
    checkResult: null,
    pendingNext: null
  });
  render();
  return true;
}

function getSaveInfo(saveId) {
  const raw = localStorage.getItem('sg_save_' + saveId);
  if (!raw) return null;
  const data = JSON.parse(raw);
  const meta = SCENARIO_META.find(m => m.id === data.scenario);
  return {
    id: saveId,
    scenario: meta ? meta.title : data.scenario,
    name: data.player.name,
    role: data.player.role,
    node: data.currentNode,
    date: new Date(data.savedAt).toLocaleString(),
    steps: (data.history||[]).length
  };
}

function deleteSave(saveId) {
  localStorage.removeItem('sg_save_' + saveId);
  const idx = getSaveIndex();
  const pos = idx.indexOf(saveId);
  if (pos !== -1) { idx.splice(pos, 1); setSaveIndex(idx); }
}

// Migrate old fixed slots to dynamic system
(function migrateSaves() {
  const idx = getSaveIndex();
  for (let i = 0; i < 5; i++) {
    const key = 'sg_save_' + i;
    const raw = localStorage.getItem(key);
    if (raw && !idx.includes(String(i))) {
      idx.push(String(i));
    }
  }
  if (idx.length) setSaveIndex(idx);
})();

// ============================================================
// PRIVATE UNLOCK
// ============================================================
function handleTitleTap() {
  const now = Date.now();
  if (now - STATE.lastTap > 3000) STATE.titleTaps = 0;
  STATE.lastTap = now;
  STATE.titleTaps++;
  if (STATE.titleTaps >= 5) {
    STATE.titleTaps = 0;
    showUnlockModal();
  }
}

function showUnlockModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Enter Access Code</h3>
      <p style="color:var(--text-dim);font-size:.85rem;margin-bottom:12px">Private scenarios require an access code.</p>
      <div class="unlock-input">
        <input type="password" id="unlock-code" placeholder="CODE" maxlength="20" autocomplete="off">
        <button onclick="tryUnlock()">Unlock</button>
      </div>
      <div id="unlock-error" class="unlock-error"></div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('input').focus();
  overlay.querySelector('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });
}

function tryUnlock() {
  const input = document.getElementById('unlock-code');
  const err = document.getElementById('unlock-error');
  if (input.value.toUpperCase() === PRIVATE_CODE) {
    STATE.privateUnlocked = true;
    localStorage.setItem('sg_private', 'true');
    document.querySelector('.modal-overlay').remove();
    render();
  } else {
    err.textContent = 'Invalid code.';
    input.value = '';
    input.focus();
  }
}

// ============================================================
// RENDERING
// ============================================================
const app = document.getElementById('app');

function render() {
  switch(STATE.screen) {
    case 'menu': renderMenu(); break;
    case 'setup': renderSetup(); break;
    case 'game': renderGameScreen(); break;
  }
}

                    <!-- Blue sides -->
                    <ellipse cx="8" cy="44" rx="10" ry="12" fill="#1a3a6a" clip-path="inset(0 25% 0 25%)"/>
                    <!-- Head -->
                    <circle cx="8" cy="24" r="10" fill="#c0392b"/>
                    <!-- Web lines on head -->
                    <line x1="8" y1="14" x2="8" y2="34" stroke="#8b0000" stroke-width=".5" opacity=".6"/>
                    <line x1="-2" y1="24" x2="18" y2="24" stroke="#8b0000" stroke-width=".5" opacity=".6"/>
                    <line x1="1" y1="16" x2="15" y2="32" stroke="#8b0000" stroke-width=".4" opacity=".4"/>
                    <line x1="15" y1="16" x2="1" y2="32" stroke="#8b0000" stroke-width=".4" opacity=".4"/>
                    <!-- Eyes -->
                    <path d="M2,22 L5,19 L9,22 L5,24 Z" fill="white" stroke="#222" stroke-width=".5"/>

                    <!-- Arms -->
                    <line x1="-2" y1="36" x2="-16" y2="28" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
                    <line x1="18" y1="36" x2="32" y2="24" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
                    <!-- Hands -->
                    <circle cx="-16" cy="28" r="2.5" fill="#c0392b"/>
                    <circle cx="32" cy="24" r="2.5" fill="#c0392b"/>
                    <!-- Web from hand -->
                    <line x1="32" y1="24" x2="55" y2="10" stroke="#ddd" stroke-width=".6" opacity=".4"/>
                    <line x1="32" y1="24" x2="50" y2="18" stroke="#ddd" stroke-width=".4" opacity=".3"/>
                    <!-- Legs -->
                    <line x1="2" y1="54" x2="-5" y2="74" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
                    <line x1="14" y1="54" x2="20" y2="72" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
                    <!-- Red boots -->
                    <circle cx="-5" cy="74" r="3" fill="#c0392b"/>
                    <circle cx="20" cy="72" r="3" fill="#c0392b"/>
                    <!-- Spider emblem on chest -->
                    <ellipse cx="8" cy="40" rx="3" ry="2" fill="#111" opacity=".7"/>
                    <!-- Web pattern on torso -->
                    <line x1="8" y1="30" x2="8" y2="54" stroke="#8b0000" stroke-width=".4" opacity=".5"/>
                    <line x1="-2" y1="42" x2="18" y2="42" stroke="#8b0000" stroke-width=".4" opacity=".5"/>
                  </g>
                  <!-- Moon glow -->
                  <circle cx="160" cy="25" r="14" fill="#223" opacity=".3"/>
                  <circle cx="160" cy="25" r="10" fill="#334" opacity=".2"/>
                </svg>

            ` : `<span class="icon">${m.icon}</span>`}
          </div>
          <span class="card-badge ${playable?'badge-playable':'badge-soon'}">${playable?(isNew?'NEW':'PLAY'):'COMING SOON'}</span>
          <div class="card-body">
            <h3>${m.title}</h3>
            <p>${m.desc}</p>
            <div class="card-tags">${m.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
          </div>
        </div>`;
    }).join('');

  const hasSaves = getSaveIndex().some(id => getSaveInfo(id));

  app.innerHTML = `
    <div class="menu-screen">
      <div class="menu-header">
        <h1 onclick="handleTitleTap()">Scenario Generator</h1>
        <p>Choose your story. Every decision matters.</p>
      </div>
      ${hasSaves ? `<div style="text-align:center;margin-bottom:20px"><button class="topbar-btn" onclick="showLoadModal()" style="padding:10px 24px;font-size:.9rem">Continue Saved Game</button></div>` : ''}
      <div class="scenario-grid">${cards}</div>
    </div>`;
}

function renderSetup() {
  const sc = SCENARIOS[STATE.scenario];
  const meta = sc.meta;
  const roles = sc.roles;

  const roleHTML = roles.length ? `
    <div class="setup-group">
      <label>Choose Your Role</label>
      <div class="role-options">
        ${roles.map(r => {
          const rd = ROLE_DATA[r];
          const bonusText = rd ? Object.entries(rd.bonuses).map(([k,v]) => `${STAT_NAMES[k]||k} ${v>0?'+':''}${v}`).join(', ') : '';
          return `<button class="role-btn ${STATE.player.role===r?'selected':''}" onclick="STATE.player.role='${r}';render()"><strong>${r}</strong>${rd?`<div style="font-size:.75rem;color:var(--text-dim);margin-top:4px">${rd.desc}</div><div style="font-size:.7rem;color:#6c5ce7;margin-top:2px">${bonusText}</div>`:''}</button>`;
        }).join('')}
      </div>
    </div>` : '';

  const presetHTML = Object.entries(PRESETS).map(([k,v]) => `
    <button class="preset-btn ${STATE.preset===k?'selected':''}" onclick="selectPreset('${k}')">
      <div class="name">${v.label}</div>
      <div class="desc">${v.desc}</div>
    </button>`).join('');

  const customHTML = STATE.preset === 'custom' ? `
    <div class="custom-stats">
      ${Object.entries(STAT_NAMES).map(([k,name]) => `
        <div class="stat-input">
          <div class="stat-name">${name}</div>
          <div class="stat-val">${STATE.player.stats[k]}</div>
          <div class="stat-btns">
            <button onclick="adjustStat('${k}',-1)">-</button>
            <button onclick="adjustStat('${k}',1)">+</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="points-left">Points remaining: ${30 - Object.values(STATE.player.stats).reduce((a,b)=>a+b,0)}</div>` : '';

  const canStart = STATE.player.name.trim() && (roles.length === 0 || STATE.player.role) && (STATE.preset !== 'custom' || Object.values(STATE.player.stats).reduce((a,b)=>a+b,0) === 30);

  app.innerHTML = `
    <div class="setup-screen">
      <h2 style="background:${meta.gradient};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${meta.title}</h2>
      <div class="setup-group">
        <label>Your Name</label>
        <input type="text" id="player-name" value="${STATE.player.name}" placeholder="Enter your name..." maxlength="20" oninput="STATE.player.name=this.value">
      </div>
      ${roleHTML}
      <div class="setup-group">
        <label>Difficulty Preset</label>
        <div class="preset-options">${presetHTML}</div>
        ${customHTML}
      </div>
      <button class="start-btn" ${canStart?'':"disabled"} onclick="beginGame()">BEGIN</button>
      <button class="back-link" onclick="STATE.screen='menu';render()">Back to scenarios</button>
    </div>`;
}

function selectPreset(key) {
  STATE.preset = key;
  if (key !== 'custom') {
    STATE.player.stats = {...PRESETS[key].stats};
  } else {
    STATE.player.stats = {str:5,cha:5,int:5,per:5,cou:5,lck:5};
  }
  render();
}

function adjustStat(stat, delta) {
  const total = Object.values(STATE.player.stats).reduce((a,b)=>a+b,0);
  const newVal = STATE.player.stats[stat] + delta;
  if (newVal < 1 || newVal > 10) return;
  if (delta > 0 && total >= 30) return;
  STATE.player.stats[stat] = newVal;
  render();
}

function renderGameScreen() {
  const sc = SCENARIOS[STATE.scenario];
  const node = sc.nodes[STATE.currentNode];
  if (!node) return;
  const meta = sc.meta;

  const moodColor = node.mood || '#1a1a2e';
  const sceneGrad = `linear-gradient(135deg, ${moodColor}, ${moodColor}88, var(--bg))`;

  // Build scene-mood inner content: portraits if available, else emoji icon
  const nodeChars = node.characters || [];
  let moodInner;
  if (nodeChars.length > 0 && STATE.scenario === 'fratparty') {
    const validChars = nodeChars.filter(c => CHAR_PORTRAITS[c]);
    if (validChars.length > 0) {
      const sizeClass = validChars.length === 1 ? 'single' : validChars.length === 2 ? 'dual' : 'multi';
      const portraitEls = validChars.map(c => `<div class="char-portrait ${sizeClass}">${CHAR_PORTRAITS[c]}</div>`).join('');
      moodInner = `<div class="char-portraits">${portraitEls}</div>`;
    } else {
      moodInner = `<span class="icon" style="font-size:2.5rem">${meta.icon}</span>`;
    }
  } else {
    moodInner = `<span class="icon" style="font-size:2.5rem">${meta.icon}</span>`;
  }

  // Filter choices by flags/conditions/role
  const choices = (node.choices||[]).filter(c => {
    if (c.requires) {
      for (const [k,v] of Object.entries(c.requires)) {
        if (STATE.flags[k] !== v) return false;
      }
    }
    if (c.minRel) {
      for (const [k,v] of Object.entries(c.minRel)) {
        if ((STATE.relationships[k]||0) < v) return false;
      }
    }
    if (c.requireRole && STATE.player.role !== c.requireRole) return false;
    return true;
  });

  const choiceHTML = choices.map((c,i) => {
    let extra = '';
    if (c.check) extra += `<div class="check-info">[${STAT_NAMES[c.check.stat]} check — DC ${c.check.dc}]</div>`;
    if (c.relHint) extra += `<div class="rel-info">${c.relHint}</div>`;
    // Effect preview tags
    let tags = '';
    if (c.effects) {
      const tagParts = [];
      if (c.effects.stats) {
        for (const [k,v] of Object.entries(c.effects.stats)) {
          const cls = v > 0 ? 'stat-up' : 'stat-down';
          tagParts.push(`<span class="effect-tag ${cls}">${STAT_NAMES[k]||k} ${v>0?'+':''}${v}</span>`);
        }
      }
      if (c.effects.relationships) {
        for (const [k,v] of Object.entries(c.effects.relationships)) {
          const cls = v > 0 ? 'rel-up' : 'rel-down';
          tagParts.push(`<span class="effect-tag ${cls}">${k.charAt(0).toUpperCase()+k.slice(1)} ${v>0?'+':''}${v}</span>`);
        }
      }
      if (tagParts.length) tags = `<div class="effect-tags">${tagParts.join('')}</div>`;
    }
    return `<button class="choice-btn" onclick="handleChoice(SCENARIOS['${STATE.scenario}'].nodes['${STATE.currentNode}'].choices[${(node.choices||[]).indexOf(c)}])">${c.text}${extra}${tags}</button>`;
  }).join('');

  // Sidebar: stats
  const statsHTML = Object.entries(STAT_NAMES).map(([k,name]) => {
    const val = STATE.player.stats[k]||5;
    return `<div class="stat-row"><span>${name}</span><span>${val}</span><div class="stat-bar"><div class="stat-fill" style="width:${val*10}%"></div></div></div>`;
  }).join('');

  // Sidebar: relationships
  const relEntries = Object.entries(STATE.relationships).filter(([k,v]) => v !== 0);
  const relHTML = relEntries.length ? relEntries.map(([k,v]) => {
    const cls = v > 0 ? 'positive' : 'negative';
    return `<div class="rel-row"><span>${k.charAt(0).toUpperCase()+k.slice(1)}</span><span class="val ${cls}">${v>0?'+':''}${v}</span></div>`;
  }).join('') : '<div style="font-size:.8rem;color:var(--text-dim)">No relationships yet</div>';

  // Sidebar: inventory
  const invHTML = STATE.inventory.length ? STATE.inventory.map(i => `<div class="inv-item">- ${i}</div>`).join('') : '<div style="font-size:.8rem;color:var(--text-dim)">Empty</div>';

  app.innerHTML = `
    <div class="game-screen">
      <div class="game-topbar">
        <div class="title">${meta.title}</div>
        <div class="actions">
          <button class="topbar-btn" onclick="showSaveModal()">Save</button>
          <button class="topbar-btn" onclick="showLoadModal()">Load</button>
          <button class="topbar-btn" onclick="if(confirm('Return to menu? Unsaved progress will be lost.'))STATE.screen='menu',render()">Menu</button>
        </div>
      </div>
      <div class="game-body">
        <div class="game-main">
          <div class="scene-mood" style="background:${sceneGrad}">
            ${moodInner}
          </div>
          <button class="sidebar-toggle" onclick="STATE.sidebarOpen=!STATE.sidebarOpen;document.querySelector('.game-sidebar').classList.toggle('open')">Stats & Inventory</button>
          <div class="story-text"><div class="new-text">${formatText(node.text)}</div></div>
          <div class="choice-list">${choiceHTML}</div>
        </div>
        <div class="game-sidebar ${STATE.sidebarOpen?'open':''}">
          <div class="sidebar-section"><h4>Character</h4>
            <div style="font-size:.9rem;font-weight:600;margin-bottom:4px">${STATE.player.name}</div>
            ${STATE.player.role ? `<div style="font-size:.8rem;color:var(--text-dim)">${STATE.player.role}</div>` : ''}
          </div>
          <div class="sidebar-section"><h4>Stats</h4>${statsHTML}</div>
          <div class="sidebar-section"><h4>Relationships</h4>${relHTML}</div>
          <div class="sidebar-section"><h4>Inventory</h4>${invHTML}</div>
        </div>
      </div>
    </div>`;

  // Check result overlay
  if (STATE.checkResult) {
    const cr = STATE.checkResult;
    const overlay = document.createElement('div');
    overlay.className = 'check-result';
    overlay.innerHTML = `
      <div class="inner">
        <div style="font-size:.85rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px">${STAT_NAMES[cr.statName]} Check</div>
        <div style="font-size:.75rem;color:var(--accent);margin-top:4px">Your ${STAT_NAMES[cr.statName]}: ${cr.stat}</div>
        <div class="roll-display ${cr.success?'success':'fail'}">${cr.success?'SUCCESS':'FAILED'}</div>
        <div class="roll-detail">${STAT_NAMES[cr.statName]} ${cr.stat} + Roll ${cr.roll} = ${cr.total} vs DC ${cr.dc}</div>
        <button onclick="dismissCheck()">Continue</button>
      </div>`;
    document.body.appendChild(overlay);
  }
}

function formatText(text) {
  return text.replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[(.+?)\]/g, '<span style="color:var(--accent);font-style:italic">[$1]</span>');
}

function showSaveModal() {
  const idx = getSaveIndex();
  const existingSlots = idx.map(id => {
    const info = getSaveInfo(id);
    if (!info) return '';
    return `<div class="save-slot" style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;cursor:pointer" onclick="saveGame('${id}');this.closest('.modal-overlay').remove()">
        <div class="slot-name">${info.scenario}</div>
        <div class="slot-info">${info.name} (${info.role||'no role'}) | ${info.steps} steps | ${info.date}</div>
      </div>
      <button onclick="event.stopPropagation();if(confirm('Delete this save?')){deleteSave('${id}');this.closest('.modal-overlay').remove();showSaveModal()}" style="background:none;color:var(--danger);font-size:1.1rem;padding:4px 8px" title="Delete">&#10005;</button>
    </div>`;
  }).filter(Boolean).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>Save Game</h3>
    <div class="save-slot" onclick="createNewSave();this.closest('.modal-overlay').remove()" style="border:1px dashed var(--accent);text-align:center">
      <div class="slot-name" style="color:var(--accent)">+ New Save</div>
    </div>
    ${existingSlots}
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>`;
  document.body.appendChild(overlay);
}

function showLoadModal() {
  const idx = getSaveIndex();
  const slots = idx.map(id => {
    const info = getSaveInfo(id);
    if (!info) return '';
    return `<div class="save-slot" style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;cursor:pointer" onclick="loadGame('${id}');this.closest('.modal-overlay').remove()">
        <div class="slot-name">${info.scenario}</div>
        <div class="slot-info">${info.name} (${info.role||'no role'}) | ${info.steps} steps | ${info.date}</div>
      </div>
      <button onclick="event.stopPropagation();if(confirm('Delete this save?')){deleteSave('${id}');this.closest('.modal-overlay').remove();showLoadModal()}" style="background:none;color:var(--danger);font-size:1.1rem;padding:4px 8px" title="Delete">&#10005;</button>
    </div>`;
  }).filter(Boolean).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>Load Game</h3>${slots || '<div style="text-align:center;color:var(--text-dim);padding:20px">No saved games</div>'}
    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">Cancel</button></div>`;
  document.body.appendChild(overlay);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
