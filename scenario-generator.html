fp_jake_mask:{characters:['jake'],text:'"During the day? I\'m the quiet kid in the back of lecture hall who asks one question per semester, and it\'s always the one that makes the professor go \'huh, actually, good point.\' Then I go back to being invisible."\n\nHe grins. "I\'m campus furniture. People sit near me without seeing me. Which is fine — I hear EVERYTHING. I know more secrets than the campus gossip page."\n\n"That sounds lonely."\n\n"It\'s..." He considers. "Lonely-adjacent. I\'m alone a lot, but I don\'t always feel lonely. It\'s more like... waiting. For the right people to notice I exist."\n\nHe looks at you. "Maybe tonight was a good night for that."',scene:'party',mood:'#636e72',effects:{relationships:{jake:4},stats:{per:1,int:1},flags:{jake_lonely:true}},choices:[{text:'"I notice. For what it\'s worth."',next:'fp_jake_deep',effects:{relationships:{jake:4},stats:{cha:1}}},{text:'"Want to be less invisible? I can introduce you to people."',next:'fp_jake_deep',effects:{relationships:{jake:2},stats:{cha:1},flags:{jake_intro_offer:true}}},{text:'Say nothing. Just bump his fist. Some things don\'t need words.',next:'fp_ending_good',effects:{relationships:{jake:3}}}]},
fp_jake_luna_intro:{characters:['jake','luna'],text:'"Luna? Art major Luna? Yeah, we had a class together. She drew me once without asking." He pauses. "It was actually really good. Made me look less boring than I am."\n\n"Want me to get her? I think you two would have a lot to talk about."\n\n"I—" He hesitates. This is the most uncertain you\'ve seen him. "Yeah. Okay. But if she doesn\'t want to, don\'t force it."\n\nYou find Luna on the porch and mention Jake. Her face lights up.\n\n"Jake! The quiet genius from Art History? He asked the best question all semester. I\'ve been wanting to talk to him for months."\n\nShe practically runs to the chill room. When you peek in ten minutes later, they\'re sitting cross-legged facing each other, and Luna\'s drawing him again. He\'s smiling — really smiling — for the first time tonight.',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:3,luna:3},stats:{cha:2},flags:{connected_jake_luna:true}},choices:[{text:'Leave them to it. You played matchmaker. Well done.',next:'fp_kitchen_late',effects:{stats:{cha:1}}},{text:'Join them for a while. This energy is infectious.',next:'fp_fire_chill',effects:{relationships:{jake:1,luna:1}}},{text:'Head out. This is a good note to end on.',next:'fp_ending_good',effects:{flags:{matchmaker:true}}}]},

// === NADIA DEEPER PATH ===
fp_nadia_study:{characters:['nadia'],text:'"Can I ask you something personal?" you say.\n\nNadia raises an eyebrow. "Brave. Go ahead."\n\n"Why pre-med? Like, the real reason. Not the resume answer."\n\nShe\'s quiet for a long time. Long enough that you think she\'s not going to answer.\n\n"My grandmother had cancer. I was twelve. I watched doctors talk about her like she was a case number. Nobody looked her in the eyes. Nobody asked how she felt — just what her labs said."\n\nShe turns her cup slowly.\n\n"She died. And I decided I\'d be the doctor who looks people in the eyes. Even if it hurts. Especially if it hurts."',scene:'party',mood:'#636e72',effects:{relationships:{nadia:5},stats:{int:1,per:1},flags:{nadia_real_reason:true}},choices:[{text:'"She would be proud of you." (Simple, sincere)',next:'fp_nadia_walls_down',effects:{relationships:{nadia:4},stats:{cha:1}}},{text:'"That\'s... the most real thing anyone\'s said tonight."',next:'fp_nadia_walk',effects:{relationships:{nadia:3}}},{text:'Don\'t say anything. Just meet her eyes. The way she wishes those doctors had.',next:'fp_nadia_walls_down',effects:{relationships:{nadia:5},stats:{per:1,cha:-1}}}]},

// === ZARA EXPANSION ===
fp_zara_dance_deeper:{characters:['zara'],text:'Zara moves like the music was composed for her. You\'re trying to keep up, and failing, and she doesn\'t care.\n\n"Stop THINKING about it!" she shouts over the bass. "Your body knows what to do. Your brain is the problem!"\n\nShe grabs your hands and pulls you into a spin. You stumble. She catches you. You\'re both laughing.\n\n"There. THAT. That\'s dancing. Not the steps — the feeling."\n\nThe song changes to something slower. The crowd thins slightly. Zara doesn\'t let go of your hand.\n\n"One more song?" she asks. But the way she says it, she\'s asking about more than dancing.',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:4},stats:{cou:1}},choices:[{text:'"One more. Then you teach me that spin move properly."',next:'fp_zara_slow_dance',effects:{relationships:{zara:3},stats:{cou:1,int:-1}}},{text:'"Actually — want to get out of here? The music\'s better outside."',next:'fp_backyard',effects:{relationships:{zara:2}}},{text:'One more song turns into three. Then five. You lose count.',next:'fp_zara_lost_in_it',effects:{relationships:{zara:4},stats:{cou:2,per:-1}}}]},
fp_zara_slow_dance:{characters:['zara'],text:'The slow song is something old — a remix that keeps the bass but strips everything else down to vocals and piano.\n\nZara steps closer. Her hand moves from yours to your shoulder. You\'re swaying now, not really dancing — just moving together in a way that feels natural.\n\n"You\'re better at this than you think," she says, her voice low enough that only you can hear.\n\n"The slow stuff is easier."\n\n"The slow stuff is harder. It\'s just you and the other person and no choreography to hide behind."\n\nShe rests her forehead against your chin. She smells like vanilla and sweat and something sweet you can\'t name. The song ends. Neither of you moves.',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:5},stats:{cou:1},flags:{danced_slow_zara:true}},choices:[{text:'Stay in the moment. Let the next song decide.',next:'fp_zara_lost_in_it',effects:{relationships:{zara:3}}},{text:'"Want to go sit by the fire?"',next:'fp_fire_chill',effects:{relationships:{zara:2}}},{text:'Gently tilt her chin up.',next:'fp_zara_almost_kiss',effects:{relationships:{zara:4}},check:{stat:'cou',dc:11}}]},
fp_zara_lost_in_it:{characters:['zara'],text:'You don\'t know how long you danced. The DJ cycled through four different genres. Your feet hurt. Your shirt is damp. And somehow, at some point, Zara\'s hand ended up intertwined with yours and neither of you mentioned it.\n\nThe lights come up — harsh and fluorescent, the party\'s death rattle.\n\n"Oh god," Zara says, blinking. "What time is it?"\n\n"Late."\n\n"Late-late or oh-no-late?"\n\nYou check your phone. 2:47 AM.\n\n"Oh-no-late."\n\nShe laughs and squeezes your hand. "Best oh-no-late I\'ve ever had." She pulls out her phone. "Give me your number. I\'m going to text you tomorrow and pretend I\'m not thinking about tonight."',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:5},stats:{cou:1},flags:{zara_number:true,zara_dance_night:true}},choices:[{text:'Give her your number. Walk her out.',next:'fp_ending_good',effects:{relationships:{zara:3},flags:{zara_ending:true}}},{text:'"Or you could text me right now. So I know it\'s not a dream."',next:'fp_ending_good',effects:{relationships:{zara:4},flags:{zara_ending:true}}},{text:'"One last dance. The DJ hasn\'t kicked us out yet."',next:'fp_ending_good',effects:{relationships:{zara:3},flags:{zara_ending:true}}}]},
fp_zara_almost_kiss:{characters:['zara'],text:'You tilt her chin up. She doesn\'t pull away. Her eyes search yours in the flashing lights.\n\nFor a second, everything stops — the music, the crowd, the chaos.\n\nThen she puts a finger on your lips. Gently.\n\n"Not here," she whispers. "Not with thirty people watching and their phones out. I\'m not gonna be someone\'s party story."\n\nShe\'s not rejecting you. She\'s protecting the moment.\n\n"Walk me home later?" she asks. "When the real night starts."',scene:'party',mood:'#fd79a8',effects:{relationships:{zara:4},stats:{per:1},flags:{zara_later:true}},choices:[{text:'"I\'ll be here."',next:'fp_zara_lost_in_it',effects:{relationships:{zara:3}}},{text:'Respect it completely. "Whenever you\'re ready."',next:'fp_dance_floor',effects:{relationships:{zara:2},stats:{cha:1}}},{text:'That took guts — hers, not yours. Admire her for it.',next:'fp_fire_chill',effects:{relationships:{zara:2},stats:{per:1}}}]},

// === BAD ENDINGS EXPANSION ===
fp_ending_humiliation:{characters:[],text:'It happens fast.\n\nYou\'re talking to someone — you don\'t even remember who — and the punch catches up. The room tilts. You grab the nearest thing for support, which turns out to be a table. The table collapses. Cups cascade like dominoes. Beer soaks into the carpet in a spreading dark circle.\n\nSilence. Then laughter. Then phones.\n\nYou can see yourself from above — lying on a wet floor, covered in cheap beer, surrounded by strangers recording your worst moment. Someone\'s already typing a caption.\n\nTyler helps you up. "We gotta go. Now."\n\nThe walk home is quiet. Your clothes smell like beer and shame. Tomorrow morning, you\'ll see the video — 47 likes, 12 shares, three comments you\'ll remember for years.\n\nSome nights change your life. Some nights just scar it.\n\n---\n\nBAD ENDING: VIRAL MOMENT\n\nThe video gets taken down eventually. The memory doesn\'t.',scene:'dark',mood:'#d63031',effects:{flags:{ending_humiliation:true,chapter1_complete:true}},choices:[{text:'TRY AGAIN — Return to Menu',next:'_menu'}]},

fp_ending_blackout:{characters:[],text:'The last thing you remember clearly is someone saying "one more." After that, everything becomes impressionist — blurred colors, disconnected sounds, faces you can\'t place.\n\nYou wake up on a couch that isn\'t yours. Morning light cuts through unfamiliar blinds. Your phone is dead. Your wallet is in your shoe for reasons you can\'t explain. There\'s a Sharpie drawing of a mustache on your hand.\n\nYou piece together the night from texts:\n\nTyler (2:14 AM): "dude where did you go"\nTyler (2:47 AM): "seriously where are you"\nTyler (3:12 AM): "found you. youre on chads couch. left water next to you"\n\nTyler took care of you. You don\'t deserve Tyler.\n\nThe headache is physical. The embarrassment is something else entirely. You don\'t know what you said last night. What you did. Who saw.\n\nThat uncertainty is worse than any hangover.\n\n---\n\nBAD ENDING: BLACKOUT\n\nYou\'ll never know exactly what happened. Maybe that\'s for the best.',scene:'dark',mood:'#2d3436',effects:{flags:{ending_blackout:true,chapter1_complete:true}},choices:[{text:'TRY AGAIN — Return to Menu',next:'_menu'}]},

fp_ending_ghosted:{characters:[],text:'The party ends. Not with a bang — with a long, slow fade. People leave in pairs, in groups, laughing and leaning on each other. Car doors. Uber headlights. The music drops to ambient.\n\nAnd you\'re alone.\n\nNot the peaceful kind of alone. The kind where you talked to a dozen people and connected with none of them. Where you stood at the edge of every circle and never quite entered. Where everyone exchanged numbers and nobody asked for yours.\n\nYou walk home at 3 AM. The campus is beautiful in the dark — old brick and lamplight and the distant sound of someone playing guitar from a dorm window. It should feel cinematic. It just feels empty.\n\nYour phone has no new messages.\n\nYou tell yourself it doesn\'t matter. That parties are overrated. That the right people will find you eventually.\n\nBut "eventually" is a long word when you\'re walking alone at 3 AM.\n\n---\n\nBAD ENDING: GHOST\n\nSome nights you\'re the main character. Some nights you\'re an extra in everyone else\'s story.',scene:'dark',mood:'#2d3436',effects:{flags:{ending_ghost:true,chapter1_complete:true}},choices:[{text:'TRY AGAIN — Return to Menu',next:'_menu'}]},

// === HALLWAY EXPLORATION ARC ===
fp_hallway_upstairs:{characters:[],text:'The upstairs hallway is dim — a single bulb casting long shadows. The music is muffled up here, more vibration than sound. Three doors: one open (a bedroom converted to a coat room, jackets piled on the bed), one closed (a bathroom, light leaking under the door), and one at the end with a "DO NOT ENTER — THIS MEANS YOU" sign.\n\nPhotos line the walls — frat composites going back decades. Men in suits, graduating classes, formal events. There\'s a continuity to it that\'s almost touching.\n\nSomeone comes out of the bathroom. It\'s Jake, drying his hands on his jeans.\n\n"Oh hey. Lost? The party\'s downstairs." He grins. "Unless you\'re looking for the roof access — it\'s through that door." He points at the DO NOT ENTER door.',scene:'party',mood:'#636e72',effects:{relationships:{jake:1}},choices:[{text:'"The roof? Is that allowed?"',next:'fp_roof_access',effects:{relationships:{jake:1}}},{text:'Look at the photos. "How long has this frat been around?"',next:'fp_hallway_photos',effects:{stats:{int:1}}},{text:'Go back downstairs. You don\'t belong up here.',next:'fp_kitchen_late'},{text:'"Can I see your room? I\'m curious about the guy behind the party."',next:'fp_jake_room',effects:{relationships:{jake:2}}}]},
fp_roof_access:{characters:[],text:'Jake shrugs. "Technically no. But I won\'t tell if you won\'t." He pushes the door open. Behind it, a narrow staircase leads to a trapdoor in the ceiling.\n\n"Best view on campus," he says. "I go up there when I need to think. Or when the party gets too... party."\n\nHe hesitates. "Want company, or is this a solo mission?"',scene:'party',mood:'#636e72',effects:{},choices:[{text:'"Come with me. I could use a guide."',next:'fp_jake_roof',effects:{relationships:{jake:2}}},{text:'"Solo mission. But thanks for the tip."',next:'fp_roof_solo'},{text:'"Actually — is Luna up there? I saw her heading upstairs."',next:'fp_roof_luna',requires:{met_luna_first:true}}]},
fp_jake_roof:{characters:['jake'],text:'The roof is even better than Jake promised. Clear sky, campus lights, the distant hum of the city. You and Jake sit on the ledge, feet dangling.\n\n"I built this frat from nothing," he says quietly. "Kappa Sigma was dead when I got here. Six members, no house, no reputation. I recruited, fundraised, renovated." He taps the roof. "Laid some of these tiles myself."\n\n"Why?"\n\n"Because I wanted a place where people felt welcome. Where the weird kid and the popular kid could sit in the same room and nobody made it a thing." He looks at the party below. "Most nights it works. Some nights... it\'s just a party. But tonight feels like one of the good ones."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:4},stats:{int:1,per:1},flags:{jake_roof:true}},choices:[{text:'"You built something real. That matters."',next:'fp_jake_deep',effects:{relationships:{jake:3}}},{text:'"What happens when you graduate? Who takes over?"',next:'fp_jake_philosophy',effects:{relationships:{jake:2}}},{text:'Sit in comfortable silence. The view says enough.',next:'fp_ending_good',effects:{relationships:{jake:3}}}]},
fp_hallway_photos:{characters:['jake'],text:'You lean in close to the photos. 1987. 1994. 2003. Rows of young men in suits, trying to look serious. Some of the older ones are yellowed and cracking.\n\nJake notices you looking. "That one—" he taps a photo from 1998. "—is my dad. He was Kappa Sigma president. And that one—" he taps 2001 "—is the guy who donated the house. Made a fortune in tech. Still sends money every year."\n\n"There\'s a continuity thing that gets me," Jake says. "All these guys stood where we\'re standing. Had the same late nights, the same dramas. Some of them are CEOs now. Some are teachers. Some are just... living their lives."\n\nHe\'s not bragging. He\'s genuinely moved by it.\n\n"I wonder which photo I\'ll be in."',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:3},stats:{int:1}},choices:[{text:'"The one people remember." (Sincere)',next:'fp_jake_roof',effects:{relationships:{jake:3}}},{text:'"The one where your tie is crooked and you\'re making a face."',next:'fp_jake_talk',effects:{relationships:{jake:2},stats:{cha:1}}},{text:'Take a photo of the wall. This deserves to be remembered.',next:'fp_hallway_upstairs',effects:{stats:{per:1}}}]},

// === PHONE EXCHANGE / CH2 HOOKS ===
fp_number_exchange:{characters:[],text:'The party is winding down. People are leaving in pairs, in groups, some stumbling, some steady. The energy has shifted from electric to warm — like embers after a fire.\n\nYou realize you haven\'t exchanged numbers with the people who mattered tonight. This is the window — ten minutes from now, everyone scatters and the night becomes a memory.\n\nWho do you want to stay in touch with?',scene:'party',mood:'#fdcb6e',effects:{},choices:[{text:'Find Mia before she leaves.',next:'fp_number_mia',requires:{met_mia_confident:true}},{text:'Find Luna. You want to see that sketchbook again.',next:'fp_number_luna',requires:{met_luna_first:true}},{text:'Find Nadia. She\'s probably already gone, but worth trying.',next:'fp_number_nadia',requires:{met_nadia:true}},{text:'You already have the numbers that matter. Head home.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:1}}}]},
fp_number_mia:{characters:['mia'],text:'You find Mia by the front door, putting on her shoes. She sees you and pauses.\n\n"Hey. I was going to find you before I left, but—" She holds up her phone. "I don\'t actually have your number. Which is insane, given that we\'ve been talking for three hours."\n\nYou exchange numbers. She types yours in, then immediately sends a text: a single star emoji.\n\n"So you know it\'s me," she says. "When I inevitably text you tomorrow pretending I\'m not thinking about tonight."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{mia_number_ch2:true}},choices:[{text:'"I\'ll be thinking about it too."',next:'fp_ending_good',effects:{relationships:{mia:3}}},{text:'"Text me whenever. Even if it\'s to name more fake constellations."',next:'fp_ending_good',effects:{relationships:{mia:3}}},{text:'Walk her home.',next:'fp_walk_home_mia',effects:{relationships:{mia:2}}}]},
fp_number_luna:{characters:['luna'],text:'Luna is on the porch, sketchbook in hand, drawing the aftermath — empty cups, string lights, the silhouette of someone asleep on a lawn chair.\n\n"You\'re capturing the crime scene," you say.\n\nShe smiles without looking up. "Every party has a before and after. The after is always more interesting. Less performance."\n\nShe finishes a line, then looks at you. "I don\'t usually give my number out at parties. But you\'re not the usual party person." She tears a corner from her sketchbook — it has her number written in pencil, with a tiny crescent moon doodled next to it.\n\n"She prepared that in advance," you realize.\n\n"Maybe," she says. Not embarrassed. Just honest.',scene:'party',mood:'#6c5ce7',effects:{relationships:{luna:4},flags:{luna_number_ch2:true}},choices:[{text:'"I\'ll text you. Maybe we can find another rooftop."',next:'fp_ending_good',effects:{relationships:{luna:3}}},{text:'Ask to keep the drawing she did of you earlier.',next:'fp_ending_luna',effects:{relationships:{luna:4}}},{text:'"Want to watch the sunrise from up there?" (gesture at the roof)',next:'fp_ending_luna',effects:{relationships:{luna:3}}}]},
fp_number_nadia:{characters:['nadia'],text:'You find Nadia at the end of the block, walking fast, hands in her jacket pockets. She turns when she hears your footsteps.\n\n"Are you following me?" Not accusatory. Amused.\n\n"I didn\'t get your number. And you\'re walking away at the speed of someone who\'s about to disappear."\n\n"That is literally my move at every party." She stops walking. Considers. "Fine. But I have rules. No good morning texts. No \'wyd\' at 2 AM. And if you text me something boring, I will roast you without mercy."\n\n"Deal."\n\nShe takes your phone, types her number, and hands it back. Under the name field she\'s typed: "Nadia (the interesting one from the fridge)."',scene:'party',mood:'#fdcb6e',effects:{relationships:{nadia:3},flags:{nadia_number_ch2:true}},choices:[{text:'"The interesting one. Yeah, that checks out."',next:'fp_ending_good',effects:{relationships:{nadia:2}}},{text:'"Walk you home? I promise not to be boring."',next:'fp_ending_nadia_walk',effects:{relationships:{nadia:2}}},{text:'Let her go. Some connections are better when they leave you wanting more.',next:'fp_ending_good',effects:{relationships:{nadia:1},stats:{int:1}}}]},

// === CROSS-CHARACTER INTERACTIONS ===
fp_mia_luna_meet:{characters:['mia','luna'],text:'Something unexpected happens — Mia and Luna end up next to each other by the fire pit. You\'re close enough to hear their conversation.\n\n"Your jacket is cute," Mia says. "Is that thrifted?"\n\n"Yeah, a place on 5th." Luna tugs at the collar. "Most of my clothes are secondhand. My art supplies cost too much to waste money on new fabric."\n\n"Okay, I need that thrift spot. I\'ve been looking for something exactly like that." Mia pulls out her phone. "Can I get your number? This is a fashion emergency."\n\nLuna laughs. "I\'ve never had my number requested for fashion consulting before."\n\nYou watch two people you care about connecting. It\'s a strange feeling — warm but bittersweet. If Chapter 2 is coming, they\'ll exist in your world together. That changes things.',scene:'party',mood:'#fdcb6e',effects:{relationships:{mia:1,luna:1},flags:{mia_luna_friends:true}},choices:[{text:'Join them. Three\'s not always a crowd.',next:'fp_fire_chill',effects:{relationships:{mia:1,luna:1}}},{text:'Let them have this. Go find Tyler.',next:'fp_tyler_confides',effects:{relationships:{tyler:1}}},{text:'Head to the kitchen. Give them space.',next:'fp_kitchen_late'}]},

fp_tyler_zara_wingman:{characters:['tyler','zara'],text:'Tyler is trying to talk to Zara. It\'s going... not great.\n\n"So, uh, you\'re on the dance team, right? That\'s... cool. Dancing is... you move, like, your body? In ways?"\n\nZara stares at him. "Are you asking me to explain dancing?"\n\nTyler looks at you with the desperate eyes of a drowning man.\n\nYou have exactly two seconds to either save him or let him sink.',scene:'party',mood:'#e17055',effects:{},choices:[{text:'Save him. "What Tyler\'s trying to say is you were incredible earlier."',next:'fp_tyler_zara_saved',effects:{relationships:{tyler:3,zara:1},stats:{cha:1}}},{text:'Let him struggle. He needs to learn.',next:'fp_tyler_zara_struggle',effects:{relationships:{tyler:-1},stats:{int:1}}},{text:'Distract Zara so Tyler can reset. "Hey Zara — settle a debate for us."',next:'fp_tyler_zara_saved',effects:{relationships:{tyler:2,zara:1},stats:{cha:1}}}]},
fp_tyler_zara_saved:{characters:['tyler','zara'],text:'Your intervention works. The conversation shifts from Tyler\'s meltdown to actual human interaction. Zara starts talking about how she got into dance — she was shy as a kid, and dance was the only way she could express herself without words.\n\n"That\'s beautiful," Tyler says. And this time, he means it. No performance. Just Tyler.\n\nSomething clicks between them. It\'s subtle — she tilts her head when he talks, he stops fidgeting. The air changes.\n\nYou did that. Sometimes the best thing you can do at a party is be a bridge.\n\nTyler catches your eye over Zara\'s shoulder and mouths: "I OWE YOU."',scene:'party',mood:'#fdcb6e',effects:{relationships:{tyler:4,zara:2},stats:{cha:1},flags:{tyler_zara_connected:true}},choices:[{text:'Slip away. Tyler\'s got this now.',next:'fp_kitchen_late',effects:{stats:{per:1}}},{text:'Stay in the group. The energy here is good.',next:'fp_fire_chill'},{text:'"You two should dance together later." Plant the seed and leave.',next:'fp_backyard',effects:{relationships:{tyler:2,zara:1}}}]},
fp_tyler_zara_struggle:{characters:['tyler','zara'],text:'You step back. Tyler flails for another thirty seconds of increasingly terrible conversation before Zara rescues them both.\n\n"You know what? Let\'s just dance. Talking is overrated." She grabs his hand and pulls him toward the music.\n\nTyler looks back at you — betrayed but also grateful, somehow.\n\nTen minutes later, they\'re dancing together and Tyler\'s actually not bad. Sometimes the best thing is to get out of your own way.',scene:'party',mood:'#e17055',effects:{relationships:{tyler:1,zara:1},flags:{tyler_zara_dance:true}},choices:[{text:'Good. He figured it out. Time for your own adventure.',next:'fp_kitchen_late'},{text:'Watch them dance. It\'s cute.',next:'fp_late_observations',effects:{stats:{per:1}}},{text:'Find your own dance partner.',next:'fp_dance_floor',effects:{stats:{cou:1}}}]},

// === GAME ROOM DISCOVERY ===
fp_game_room:{characters:[],text:'Behind the kitchen, through a door you didn\'t notice before, is a game room. It\'s quieter here — a pool table, a dartboard, a vintage arcade cabinet running Pac-Man. The walls are covered in old band posters and polaroid photos.\n\nThree people are playing pool. One of them is Nadia, who is absolutely destroying the other two.\n\n"Solids," she says, sinking a ball without looking at you. "And yes, I know I said I was leaving. I lied. This pool table called to me."\n\nThe arcade cabinet glows invitingly in the corner. The dartboard has three darts stuck at weird angles — someone clearly rage-quit.',scene:'party',mood:'#fdcb6e',effects:{},choices:[{text:'Challenge Nadia to pool. She looks beatable. (She\'s not.)',next:'fp_pool_game',effects:{relationships:{nadia:2}},check:{stat:'int',dc:11}},{text:'Play Pac-Man. Some classics never get old.',next:'fp_arcade',effects:{stats:{per:1}}},{text:'Try darts. How hard can it be?',next:'fp_darts',effects:{stats:{per:1}},check:{stat:'per',dc:8}}]},
fp_pool_game:{characters:['nadia'],text:'You chalk up a cue. Nadia watches you with the expression of a cat watching a mouse approach.\n\n"Fair warning," she says. "My dad ran a bar. I could bank shots before I could drive."\n\nShe wasn\'t kidding. Three turns in, she\'s cleared half her balls and you\'ve sunk the cue ball twice.\n\nBut then something happens — you make a lucky shot, a bank off the side rail that drops right into the corner pocket. The room goes quiet.\n\nNadia raises an eyebrow. "Okay. That was impressive. Do it again."\n\nYou can\'t. But the trying is fun. She starts coaching you — "Lower your elbow, sight down the cue, no, don\'t hit it like you\'re angry at it" — and somewhere between the coaching and the laughing, the distance between you shrinks.\n\n"You\'re terrible," she says, leaning on her cue with a grin. "But you\'re entertaining. That\'s almost better."',scene:'party',mood:'#fdcb6e',effects:{relationships:{nadia:3},stats:{per:1}},choices:[{text:'"Best of three? I\'m a fast learner."',next:'fp_nadia_study',effects:{relationships:{nadia:2}}},{text:'"Teach me the bank shot. Properly."',next:'fp_nadia_walk',effects:{relationships:{nadia:2},stats:{per:1}}},{text:'"You win. But I\'m coming back next party for a rematch."',next:'fp_kitchen_late',effects:{relationships:{nadia:1}}}]},
fp_arcade:{characters:[],text:'The Pac-Man cabinet hums to life when you touch the joystick. The screen is scratched but functional, and the speakers crackle with that unmistakable waka-waka-waka.\n\nYou start playing. First life, second life — you\'re getting into it, muscle memory from childhood kicking in.\n\nSomeone appears next to you. Jake, holding two colas.\n\n"Oh man, someone\'s actually playing it! I found that thing at a yard sale. Took me and two brothers to carry it up the stairs." He watches you navigate the maze. "My high score\'s 47,000. It\'s on the board."\n\nYou check: J-A-K-E — 47,320.\n\nThe gauntlet has been thrown.',scene:'party',mood:'#fdcb6e',effects:{relationships:{jake:2}},choices:[{text:'Try to beat Jake\'s score. Focus mode activated.',next:'fp_arcade_run',effects:{stats:{per:2,int:1}},check:{stat:'per',dc:10}},{text:'Play casually and chat with Jake while dying repeatedly.',next:'fp_jake_talk',effects:{relationships:{jake:2}}},{text:'Give up after three lives. "Your score is safe."',next:'fp_game_room',effects:{relationships:{jake:1}}}]},
fp_arcade_run:{characters:[],text:'You zone in. The party fades. The ghosts become predictable. You find the cherry bonus, clear the board, start the next level.\n\nA small crowd gathers behind you. Jake is narrating like a sports commentator: "He\'s going for it. Look at that pattern — he\'s running the left-side loop. Classic strategy."\n\n42,000. 44,000. 46,000.\n\nThe ghosts speed up. Your palms are sweating. A ghost clips you — last life.\n\n47,500.\n\nThe cabinet plays the victory jingle. Your initials go up: three letters, carved into pixel history.\n\nJake stares at the screen. Then at you. Then back at the screen.\n\n"I\'m not even mad. That was beautiful." He extends his hand. "Welcome to the brotherhood."',scene:'party',mood:'#00b894',effects:{relationships:{jake:4},stats:{per:1},flags:{beat_jake_score:true}},choices:[{text:'This is the peak. Nothing else tonight will top this.',next:'fp_ending_good',effects:{relationships:{jake:2}}},{text:'Celebrate with the crowd. You just made history.',next:'fp_kitchen_late',effects:{stats:{cha:1}}},{text:'"Want to try Pac-Man together? I bet there\'s a two-player hack."',next:'fp_jake_deep',effects:{relationships:{jake:2}}}]},
fp_darts:{characters:[],text:'You pull the three darts from the board, line up, and throw.\n\nFirst dart: the wall. Not even close.\n\nSecond dart: the edge of the board. Progress.\n\nThird dart: bullseye.\n\nYou stare at the board. The dart quivers in the center, as surprised as you are.\n\n"DID YOU SEE THAT?" you shout to absolutely nobody. The game room is temporarily empty.\n\nThen Chad walks in, sees the bullseye, and loses his mind.\n\n"WAIT. First try? FIRST TRY?! I\'ve been playing darts for three years and I\'ve hit bullseye TWICE." He grabs your shoulders. "You\'re a natural. A PRODIGY. We\'re entering you in the next tournament."',scene:'party',mood:'#00b894',effects:{relationships:{chad:3},stats:{per:2},flags:{bullseye:true}},choices:[{text:'"It was definitely not first try. It was third try."',next:'fp_chad_hangout',effects:{relationships:{chad:1}}},{text:'Try to replicate it. Hit the wall again. Mystique preserved.',next:'fp_kitchen_late',effects:{stats:{cha:1}}},{text:'"Tournament? I\'m in. When?"',next:'fp_fire_chill',effects:{relationships:{chad:2},flags:{darts_tournament:true}}}]},

// === DJ INTERACTION ===
fp_dj_booth:{characters:['marcus'],text:'You drift toward the DJ booth. The guy behind the decks is focused — headphones half-on, one hand on the laptop, the other on a controller. He notices you watching and nods.\n\n"Yo. You got any requests?"\n\nHe\'s Luna\'s friend, you remember. The one she said was "useless" because he was DJing all night.\n\nUp close, his setup is impressive — proper controller, monitor speakers, even a small light rig he controls from his phone.\n\n"I\'m Marcus. I do all the Kappa Sigma parties. It\'s volunteer, but they let me eat free pizza, so." He shrugs. "Plus, controlling the energy of a room with music? That\'s a superpower."',scene:'party',mood:'#e17055',effects:{flags:{met_dj:true}},choices:[{text:'Request a song. Something unexpected.',next:'fp_dj_request',effects:{stats:{cha:1}}},{text:'"Can I try mixing something? Just for a second?"',next:'fp_dj_try',effects:{stats:{cou:1}},check:{stat:'cou',dc:9}},{text:'"How do you read a room? Like, musically?"',next:'fp_dj_philosophy',effects:{stats:{int:1,per:1}}}]},
fp_dj_request:{characters:['marcus'],text:'"Play something nobody expects," you say.\n\nMarcus grins. "I like you already." He scrolls through his library. "How about... this?"\n\nHe drops an 80s synth-pop track. Absolutely left-field at a hip-hop-dominant party. For three seconds, the dance floor freezes.\n\nThen someone screams "I LOVE THIS SONG!" and the energy transforms. People who weren\'t dancing start dancing. The vibe shifts from generic party to something specific, memorable, fun.\n\nMarcus points at you. "See? That\'s what a good request does. It changes the story of the night."\n\nFrom the dance floor, Mia catches your eye and mouths: "YOUR song choice?" She\'s dancing, arms up, grinning.',scene:'party',mood:'#e17055',effects:{stats:{cha:2},relationships:{mia:1}},choices:[{text:'Join the dance floor. This is your moment.',next:'fp_dance_floor',effects:{stats:{cou:1}}},{text:'Stay by the booth. Watch your song change the room.',next:'fp_late_observations',effects:{stats:{per:1}}},{text:'Go find Mia on the dance floor.',next:'fp_dance_zara',effects:{relationships:{mia:1}}}]},
fp_dj_try:{characters:['marcus'],text:'Marcus slides over and gives you one headphone cup. "Okay, see that slider? That\'s the crossfader. Right now Track A is playing. Track B is cued up and ready. When I say go, slide it to the center. SMOOTH. Not fast."\n\n"Go."\n\nYou slide the crossfader. The two tracks blend — bass from one, melody from the other. It sounds... good? Marcus nods approvingly.\n\n"Now bring up Track B all the way."\n\nYou push the slider. The new track takes over. The transition is clean. The crowd doesn\'t even notice — which, Marcus tells you, is the highest compliment.\n\n"Natural!" He bumps your fist. "You just did your first live mix at a party. Most people freeze."\n\nYou feel a weird pride — like you just performed surgery and the patient lived.',scene:'party',mood:'#00b894',effects:{stats:{cou:1,per:1},flags:{mixed_tracks:true}},choices:[{text:'"That was incredible. Can I stay up here for a bit?"',next:'fp_dj_philosophy',effects:{stats:{per:1}}},{text:'Go tell Tyler you just DJed. He won\'t believe you.',next:'fp_kitchen_chill',effects:{relationships:{tyler:1}}},{text:'One mix was enough. Back to the party.',next:'fp_kitchen_late'}]},
fp_dj_philosophy:{characters:['marcus'],text:'Marcus leans back in his chair, headphones around his neck.\n\n"Here\'s the thing nobody teaches you about DJing — it\'s not about the music. It\'s about the room. You watch people\'s bodies. When the energy dips, you lift it. When it peaks, you ride it. When someone\'s having a bad night, you play their song and don\'t tell them you noticed."\n\nHe points at the dance floor. "See her? She was crying twenty minutes ago. I played her favorite song — I know because she requested it last party. Now she\'s dancing. That\'s the job."\n\nHe\'s quiet for a moment. "Music doesn\'t fix things. But it holds space for feelings. And sometimes that\'s enough."\n\nThis guy is way deeper than his Hawaiian shirt suggests.',scene:'party',mood:'#fdcb6e',effects:{stats:{int:2,per:1},flags:{dj_wisdom:true}},choices:[{text:'"That might be the most beautiful thing anyone\'s said at this party."',next:'fp_late_observations',effects:{stats:{cha:1}}},{text:'"Play something for me. Whatever you think I need right now."',next:'fp_dance_floor',effects:{stats:{per:1}}},{text:'Sit with him behind the decks. Watch the room through his eyes.',next:'fp_ending_good',effects:{stats:{per:2}}}]},

// === ROOF EAVESDROP ===
fp_roof_eavesdrop:{characters:[],text:'You press back into your chair. The person doesn\'t see you — they\'re on the phone, voice tight.\n\n"Mom, I\'m fine. Yes, I\'m at a party. No, I\'m not drinking. Yes, I have my pepper spray. Mom—" A long pause. "I know you worry. I know why you worry. But I can\'t live in a cage because something happened to you when you were my age."\n\nAnother pause. Softer now: "I love you too. I\'ll call you in the morning. I promise."\n\nShe hangs up. Turns. Sees you.\n\nIt\'s Luna. Her eyes go wide.\n\n"How much of that did you hear?"',scene:'party',mood:'#636e72',effects:{relationships:{luna:1},flags:{heard_luna_call:true}},choices:[{text:'"Enough to know your mom loves you. And that you\'re braver than you let on."',next:'fp_roof_luna_real',effects:{relationships:{luna:4},stats:{per:1}}},{text:'"Nothing important. Just got here."  (Lie to protect her privacy)',next:'fp_roof_luna',effects:{relationships:{luna:1},stats:{cha:1}}},{text:'"All of it. Want to talk about it?"',next:'fp_roof_luna_real',effects:{relationships:{luna:3}}}]},

// === DANCE GROUP EXPANSION ===
fp_dance_battle:{characters:[],text:'The circle opens up. Someone shouts "DANCE BATTLE!" and suddenly there\'s a space in the middle of the floor, spotlit by a rogue LED strip.\n\nA guy you don\'t know goes first — windmill arms, ironically terrible, but committed. The crowd loves it.\n\nZara goes next and absolutely murders it. Thirty seconds of choreography that makes everyone\'s jaw drop. When she finishes, she points at you.\n\n"YOUR TURN, FRESHMAN."\n\nEvery phone in the room is recording.',scene:'party',mood:'#e17055',effects:{relationships:{zara:1}},choices:[{text:'Go for it. Dance like nobody\'s watching. (They are.)',next:'fp_dance_brave',effects:{stats:{cou:3,cha:1,per:-2}},check:{stat:'cou',dc:10}},{text:'Do an intentionally terrible dance. Lean into the comedy.',next:'fp_dance_comedy',effects:{stats:{cha:2,cou:1}}},{text:'Bow out gracefully. "I yield to the queen."',next:'fp_dance_floor',effects:{relationships:{zara:2},stats:{cha:1,cou:-1}}}]},
fp_dance_brave:{characters:[],text:'You step into the circle. Your heart is a drum machine. You\'ve never done this before — not with people watching, not with phones recording, not with a girl who dances professionally staring you down.\n\nBut something about tonight — the punch, the confidence, the fact that nobody here knew you yesterday — makes you move.\n\nYou\'re not good. You know that. But you commit. Every move, full extension. No hesitation, no looking around for approval. Just you and the beat.\n\nThe crowd starts slow-clapping. Then cheering. Not because you\'re skilled — because you\'re fearless. And at a party, fearless beats skilled every time.\n\nZara is grinning. When you finish, breathless, she high-fives you so hard your palm stings.\n\n"OKAY! I respect that! You can\'t dance but you\'ve got HEART!"',scene:'party',mood:'#00b894',effects:{stats:{cou:2},relationships:{zara:3},flags:{dance_battled:true}},choices:[{text:'Ride the high. You just peaked socially.',next:'fp_celebrate',effects:{stats:{cha:1}}},{text:'Find Mia in the crowd. You want to know if she saw that.',next:'fp_mia_looking',effects:{relationships:{mia:1}}},{text:'Collapse against a wall. That took everything you had.',next:'fp_kitchen_chill'}]},
fp_dance_comedy:{characters:[],text:'You moonwalk into the circle. Badly. Your foot catches on someone\'s cup. You recover by turning it into a spin — an intentional-looking spin that was definitely accidental.\n\nThen you do the robot. Then the sprinkler. Then some move you invented on the spot that involves finger guns and a hip thrust.\n\nThe crowd is DYING. People are crying laughing. Someone screams "GIVE HIM THE CROWN!"\n\nZara is bent over wheezing. "Oh my god. Stop. STOP. I can\'t breathe."\n\nYou finish with a bow. The circle erupts. You may not be a dancer, but you just became a legend.\n\nFor the rest of the night, random people come up to you doing the finger-gun move. You\'ve created a meme. A living, in-person meme.',scene:'party',mood:'#00b894',effects:{stats:{cha:3},relationships:{zara:2,chad:1},flags:{dance_comedian:true}},choices:[{text:'Milk it. You\'re the comedy king tonight.',next:'fp_kitchen_chill',effects:{stats:{cha:1}}},{text:'Find Tyler. He needs to know what just happened.',next:'fp_tyler_panic',effects:{relationships:{tyler:1}}},{text:'That was amazing. Time to chase something quieter.',next:'fp_backyard'}]},

// === MORNING AFTER HOOKS (for CH2 setup) ===
fp_ending_morning_texts:{characters:[],text:'The party replays in fragments — voices, laughter, the warm weight of a conversation that mattered. Last night was real. And tomorrow is Monday.\n\nBut first: Saturday morning. And your phone is buzzing.',scene:'party',mood:'#fdcb6e',effects:{flags:{ending_morning:true}},choices:[{text:'Wake up and face the morning.',next:'fp_morning_wake'}]},

// === ADDITIONAL CONNECTING NODES ===
fp_tyler_confides:{characters:['tyler'],text:'Tyler is quieter than usual. You\'re both on the back porch, feet on the railing, looking at nothing.\n\n"Can I tell you something?" he says. "And you can\'t laugh."\n\n"Depends how funny it is."\n\nHe doesn\'t laugh. "I\'ve never had a best friend before. Like, a real one. I had people I hung out with in high school, but nobody I\'d... call at 3 AM, you know? Nobody I\'d tell real stuff to."\n\nHe takes a breath. "I think maybe you\'re that person. And that scares me, because what if you wake up tomorrow and realize you can do better?"\n\nThe vulnerability hangs in the air between you. Tyler, who seems so confident, so easy — carrying this the whole time.',scene:'party',mood:'#fdcb6e',effects:{relationships:{tyler:5},stats:{per:1},flags:{tyler_confided:true}},choices:[{text:'"I\'m not going anywhere, Tyler. You\'re stuck with me."',next:'fp_ending_tyler',effects:{relationships:{tyler:4}}},{text:'"Why would you think I\'d leave?"',next:'fp_tyler_walk_home',effects:{relationships:{tyler:3}}},{text:'Don\'t say anything. Just bump his shoulder with yours.',next:'fp_ending_good',effects:{relationships:{tyler:4}}}]},

fp_pool_area:{characters:[],text:'Behind the house, past the fire pit, there\'s a small above-ground pool that someone filled with glow sticks. The water pulses with neon green and pink, casting alien shadows on everyone around it.\n\nThree people are in the pool fully clothed, laughing hysterically. Chad is standing at the edge with a garden hose, "refilling" the pool while mostly spraying people who walk past.\n\n"INCOMING!" He aims the hose at you.\n\nYou have exactly two seconds to react.',scene:'party',mood:'#00b894',effects:{},choices:[{text:'Dodge! (Courage check)',next:'fp_pool_dodge',check:{stat:'cou',dc:8},effects:{stats:{cou:1}}},{text:'Take the hit. Own it. Walk into the spray.',next:'fp_pool_soak',effects:{stats:{cou:2,cha:1},relationships:{chad:2}}},{text:'Grab a pool noodle and fight back.',next:'fp_pool_fight',effects:{stats:{str:1,cou:1},relationships:{chad:3}}}]},
fp_pool_dodge:{characters:['chad'],text:'You duck and the water sails over your head, drenching someone behind you. They shriek. Chad doubles over laughing.\n\n"Nice reflexes!" He tosses you a towel that\'s mostly dry. "You\'re good. Most people freeze."\n\nThe pool area has a vibe of its own — looser, sillier, everyone\'s a little wet and nobody cares about looking cool anymore. It\'s the most genuine part of the party.',scene:'party',mood:'#00b894',effects:{stats:{per:1}},choices:[{text:'Hang by the pool. This energy is good.',next:'fp_fire_chill',effects:{relationships:{chad:1}}},{text:'Now that you\'re dry, find someone to talk to.',next:'fp_kitchen_late'},{text:'The pool looks tempting...',next:'fp_pool_soak',effects:{stats:{cou:1}}}]},
fp_pool_soak:{characters:[],text:'The water hits you dead center. Cold. Shocking. You gasp — then start laughing. Because what else can you do?\n\nChad cheers. "RESPECT! This guy takes it like a champion!"\n\nSomeone throws you a towel from a chair. You\'re soaked, hair plastered to your face, shoes squelching. And you don\'t care. Something about being wet at a party strips away every ounce of self-consciousness.\n\nMia walks past, sees you dripping, and stops dead. "What happened to you?"\n\n"Chad happened."\n\n"You look ridiculous." She\'s trying not to smile. Failing.',scene:'party',mood:'#00b894',effects:{stats:{cou:1},relationships:{chad:2,mia:1},flags:{got_soaked:true}},choices:[{text:'"Want to look ridiculous with me?"',next:'fp_mia_talk',effects:{relationships:{mia:3},stats:{cha:1}}},{text:'Shake your head like a dog. Spray everyone.',next:'fp_fire_chill',effects:{relationships:{chad:2}}},{text:'Change into a dry shirt from the lost-and-found box.',next:'fp_backyard'}]},
fp_pool_fight:{characters:['chad'],text:'You grab a pool noodle from the ground and charge Chad. He shrieks — actually shrieks — and drops the hose.\n\nWhat follows is the most ridiculous three minutes of your life. You\'re chasing the host of a frat party around his own backyard with a foam noodle while thirty people cheer. He grabs another noodle. It becomes a duel.\n\nYou\'re both terrible. You\'re both laughing so hard you can barely stand. He lands a hit on your shoulder. You get him across the legs. A girl films the whole thing.\n\nFinally, you both collapse on the grass, panting. Chad extends a fist. You bump it.\n\n"You\'re officially my favorite freshman," he gasps. "That was ELITE."',scene:'party',mood:'#00b894',effects:{relationships:{chad:5},stats:{str:1,cou:1},flags:{pool_noodle_duel:true}},choices:[{text:'This guy\'s great. Hang with Chad the rest of the night.',next:'fp_chad_hangout',effects:{relationships:{chad:2}}},{text:'Catch your breath. Hit the kitchen for water.',next:'fp_kitchen_late'},{text:'That was the peak. Time to end on a high note.',next:'fp_ending_good',effects:{flags:{chad_invite:true}}}]},

// === BATHROOM QUEUE ENCOUNTERS ===
fp_bathroom_queue:{characters:[],text:'The bathroom line is four people deep. You lean against the wall and wait.\n\nThe guy ahead of you turns around. He\'s wearing a "MATH IS BEAUTIFUL" t-shirt and looks completely sober.\n\n"You know what\'s wild?" he says, unprompted. "There are approximately 150 people at this party. Statistically, at least 12 of them will form a lasting relationship with someone they met tonight. Two of those relationships will last longer than five years. One might be a marriage."\n\nHe adjusts his glasses. "I run the numbers on everything. It\'s a coping mechanism."\n\nThe girl behind you in line laughs. "That\'s either the most romantic or most depressing thing I\'ve ever heard at a party."',scene:'party',mood:'#fdcb6e',effects:{stats:{int:1}},choices:[{text:'"So which one are we? The marriage or the five-year?"',next:'fp_bathroom_girl',effects:{stats:{cha:1}}},{text:'"Run the numbers on this: what are the odds I beat Chad at pong tonight?"',next:'fp_bathroom_math',effects:{stats:{int:1}}},{text:'The door opens. Your turn. Skip the philosophy.',next:'fp_hallway'}]},
fp_bathroom_girl:{characters:[],text:'The girl behind you snorts. "Bold move, using someone else\'s statistics as a pickup line."\n\nShe steps forward as the line moves. Dark curls, a vintage band tee, combat boots that have seen actual combat with muddy festival grounds.\n\n"I\'m Priya. Sociology. And before you ask — no, I\'m not analyzing everyone at this party." She pauses. "Okay, I am. That couple by the stairs? They\'re going to break up within the month. He keeps checking his phone. She keeps not noticing."\n\nShe\'s sharp. Observant in a way that reminds you of Nadia, but warmer — like she studies people because she genuinely finds them fascinating, not because she\'s testing them.\n\n"What about me?" you ask. "What\'s your read?"\n\nShe tilts her head. Studies you for three seconds that feel like thirty.\n\n"You\'re at a crossroads tonight. You came in thinking this party was about finding something — a connection, an experience, proof that college is worth it. But the real question is whether you\'ll let the night happen to you, or happen to the night."',scene:'party',mood:'#fdcb6e',effects:{stats:{per:1,int:1}},choices:[{text:'"Happen to the night. Definitely."',next:'fp_kitchen_late',effects:{stats:{cou:1}}},{text:'"That was terrifyingly accurate. Are you a witch?"',next:'fp_fire_chill',effects:{stats:{cha:1}}},{text:'"What about you? What are you looking for tonight?"',next:'fp_backyard',effects:{stats:{per:1}}}]},
fp_bathroom_math:{characters:[],text:'Math Shirt guy lights up. "Okay, factoring in your build, apparent coordination, and the fact that Chad has been drinking for approximately three hours — I\'d give you a 34% chance. But here\'s the thing — " he leans in conspiratorially, "beer pong is 60% confidence, 30% muscle memory, and 10% actual physics. If you can get the crowd chanting your name before your third throw, your odds jump to 51%."\n\n"You\'ve thought about this a lot."\n\n"I\'ve thought about EVERYTHING a lot. It\'s exhausting." He smiles. "I\'m Raj. Applied Mathematics. I come to these things to test my models. Last party I predicted the exact minute the cops would show up. Missed it by four minutes. Still workshopping the variables."\n\nThe bathroom door opens. Raj gestures gallantly. "After you. And if you do play Chad — aim for the back-center cup first. The angle from the right side of the table gives you a 7% advantage."',scene:'party',mood:'#fdcb6e',effects:{stats:{int:2},flags:{met_raj:true}},choices:[{text:'Remember that tip. Head to the beer pong table.',next:'fp_beer_pong',effects:{stats:{per:1}}},{text:'This guy is fascinating. Invite him to hang out.',next:'fp_fire_chill',effects:{stats:{int:1}}},{text:'Use the bathroom and head back to the party.',next:'fp_kitchen_chill'}]},

// === POLAROID CORNER ===
fp_polaroid_corner:{characters:[],text:'Tucked behind the oak tree in the backyard, someone set up a Polaroid station. A clothesline is strung between two posts, photos clipped to it with tiny wooden pegs. There\'s a box of props — fake mustaches, oversized sunglasses, a foam crown, a sign that says "I SURVIVED KAPPA SIGMA."\n\nA girl is running the station, shaking a fresh Polaroid with practiced hands.\n\n"Want one? It\'s free. Well, it\'s free because I stole the film from the art department. But you didn\'t hear that."\n\nShe holds up the camera. The flash is already charged, casting a small red light on her face.\n\n"Solo, or you want to grab someone?"',scene:'party',mood:'#fdcb6e',effects:{},choices:[{text:'Solo shot. Grab the foam crown. Own it.',next:'fp_polaroid_solo',effects:{stats:{cou:1,cha:1}}},{text:'Grab Tyler for a best-friend photo.',next:'fp_polaroid_tyler',effects:{relationships:{tyler:2}}},{text:'Look around — Mia\'s nearby.',next:'fp_polaroid_mia',effects:{relationships:{mia:2}},requires:{met_mia:true}},{text:'Check out the other photos on the line. Who\'s been here tonight?',next:'fp_polaroid_browse',effects:{stats:{per:1}}}]},
fp_polaroid_solo:{characters:[],text:'You put on the foam crown, cross your arms, and give the camera your best "this is my kingdom" look.\n\nThe flash fires. The camera whirs. She shakes the Polaroid and hands it to you.\n\nYou watch your face slowly materialize from the white — crown slightly crooked, a grin that\'s half-confident and half-surprised you actually did it.\n\n"Keep it," she says. "Proof you were here. Years from now, you\'ll find this in a drawer and remember exactly how tonight felt."\n\nShe\'s right. You can already feel this photo becoming a memory — the kind that matters more than you\'d expect.',scene:'party',mood:'#fdcb6e',effects:{flags:{has_polaroid:true},stats:{cha:1}},choices:[{text:'Pocket it carefully. Back to the party.',next:'fp_fire_chill'},{text:'Take one more — this time with someone.',next:'fp_backyard',effects:{stats:{cha:1}}},{text:'Ask the photographer her story. She seems interesting.',next:'fp_polaroid_chat',effects:{stats:{per:1}}}]},
fp_polaroid_mia:{characters:['mia'],text:'You find Mia\'s eye across the backyard and tilt your head toward the Polaroid station. She smiles — that private smile — and walks over.\n\n"Oh my god, props?" She grabs the fake mustache and holds it up. "You have to wear the crown."\n\nYou put on the crown. She puts on the mustache. You both look absolutely ridiculous.\n\nThe flash fires.\n\nThe Polaroid develops slowly. Two idiots, grinning, looking at each other instead of the camera. The fairy lights catch in her hair. Your crown is sideways.\n\nIt\'s the best photo either of you has ever taken.\n\n"I want this one," she says, reaching for it.\n\n"We can share. You get it on weekdays, I get it on weekends."\n\nShe laughs. "Or you could just come to psych class more often and see the real thing."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},flags:{polaroid_mia:true}},choices:[{text:'"Deal. I\'ll even take notes for you."',next:'fp_late_night_together',effects:{relationships:{mia:2}}},{text:'Take another one. Serious faces this time.',next:'fp_roof_mia',effects:{relationships:{mia:2}}},{text:'Let her keep it. The memory is enough.',next:'fp_fire_chill',effects:{relationships:{mia:1}}}]},
fp_polaroid_tyler:{characters:['tyler'],text:'You grab Tyler mid-story and drag him to the Polaroid station.\n\n"Dude, what — oh SICK, props!" Tyler immediately grabs every prop. Fake mustache AND sunglasses AND the sign. You get the crown.\n\nThe photographer takes one look at you both and shakes her head, smiling. "This is going to be a good one."\n\nFlash.\n\nThe photo develops: Tyler doing a peace sign with his tongue out, you with the crown, both looking like you\'ve known each other for years instead of weeks.\n\nTyler holds the photo like it\'s sacred. "Bro. This is going on my wall. First college party, first real friend photo." He gets weirdly emotional for a second, then covers it with a laugh. "I mean, it\'s just a photo. Whatever. Anyway."',scene:'party',mood:'#fdcb6e',effects:{relationships:{tyler:3},flags:{polaroid_tyler:true}},choices:[{text:'"Not just a photo. Proof that tonight happened."',next:'fp_tyler_confides',effects:{relationships:{tyler:2}}},{text:'Give him a side-hug. No words needed.',next:'fp_backyard',effects:{relationships:{tyler:2}}},{text:'Take another one — group shot this time.',next:'fp_kitchen_late',effects:{relationships:{tyler:1}}}]},
fp_polaroid_browse:{characters:[],text:'You walk along the clothesline, studying the photos. A timeline of the night in reverse.\n\nEarly photos: people arriving, clean clothes, big eyes, nervous energy. Everyone posed, everyone performing.\n\nMid-night photos: loosened ties, red cups in hand, someone mid-laugh, someone mid-fall. Real moments breaking through the performance.\n\nRecent photos: smaller groups, closer together. A couple forehead-to-forehead. Three guys in a pile. A girl asleep on a lawn chair, someone draping a jacket over her.\n\nThe night tells a story in Polaroids. Everyone arrived as strangers and became... something else. Not friends, exactly. But people who shared a night, and that\'s its own kind of bond.\n\nOne photo catches your eye: Jake, alone, looking out at the party from the porch. He\'s not smiling. He looks tired, and proud, and a little lonely. The host who built a home for everyone else.',scene:'party',mood:'#636e72',effects:{stats:{per:2,int:1}},choices:[{text:'Find Jake. Tell him what you saw in that photo.',next:'fp_jake_deep',effects:{relationships:{jake:2}}},{text:'Take your own photo for the line. Add to the story.',next:'fp_polaroid_solo'},{text:'The night\'s getting late. Check on your people.',next:'fp_kitchen_late'}]},
fp_polaroid_chat:{characters:['dev'],text:'The photographer\'s name is Dev. Short for Devika. She\'s a visual arts senior who documents every Kappa Sigma party.\n\n"I started freshman year. Same as you — terrified, didn\'t know anyone. But I had my camera." She gestures at the clothesline. "Four years of photos. Somewhere in my apartment, I have a box with over 600 Polaroids from this house."\n\n"Why?"\n\n"Because nobody remembers the small moments. They remember the big ones — the kiss, the fight, the embarrassing thing. But the moments in between? The quiet laugh, the stranger who held the door, the friend who said something real for the first time? Those disappear. Unless someone catches them."\n\nShe pats the camera. "This is how I make friends. I give people proof that their small moments mattered."',scene:'party',mood:'#fdcb6e',effects:{stats:{per:2,int:1},flags:{met_dev:true}},choices:[{text:'"That\'s beautiful. Can I see some of the old ones?"',next:'fp_fire_chill',effects:{stats:{per:1}}},{text:'"Take one of me? No props. Just... real."',next:'fp_polaroid_solo',effects:{stats:{cou:1}}},{text:'Thank her and rejoin the party.',next:'fp_kitchen_late'}]},

// === TYLER RESCUE ARC ===
fp_tyler_too_drunk:{characters:['tyler'],text:'You find Tyler in the hallway, leaning against the wall at a concerning angle. His eyes are glassy and he\'s got that unfocused look that says the night just shifted from fun to damage control.\n\n"Hey buddy, you good?"\n\n"I\'m GREAT. I\'m better than great. I\'m—" he lurches sideways and you catch him. He\'s heavier than he looks. "I might have had the punch. The mystery punch. Chad said it was weak." He hiccups. "Chad lied."\n\nSomeone walks past and rolls their eyes. A girl you don\'t know gives you a sympathetic look. This is the unglamorous part of college parties that nobody puts in the movies.\n\nTyler is your friend. Right now, he needs you more than the party does.',scene:'party',mood:'#636e72',effects:{relationships:{tyler:2}},choices:[{text:'Get him water and find a quiet spot to sit.',next:'fp_tyler_sobering',effects:{relationships:{tyler:3},stats:{per:1}}},{text:'Find Chad. He made the punch — he can help.',next:'fp_tyler_chad_help',effects:{relationships:{chad:1,tyler:1}}},{text:'Call it. Get him home. The night\'s over for both of you.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:4}}}]},
fp_tyler_sobering:{characters:['tyler'],text:'You grab two water bottles from the kitchen and steer Tyler to the back porch steps. The cool air hits him and he shivers.\n\n"Drink this. Slowly."\n\nHe takes tiny sips. For five minutes, neither of you says anything. The party hums behind you. Stars are out — more than you expected for a campus this close to the city.\n\n"I\'m sorry," he says eventually. Small voice. "I do this. I get excited and I go too hard and then someone has to babysit me. It happened in high school too."\n\n"You\'re not babysitting material. You\'re friend material."\n\nHe looks at you. Even drunk, something lands. "You mean that?"\n\n"I wouldn\'t be sitting on these steps if I didn\'t."\n\nTwenty minutes pass. The water works. The air works. Tyler slowly comes back online — still drunk, but the kind of drunk where you can have a real conversation.',scene:'party',mood:'#636e72',effects:{relationships:{tyler:4},stats:{per:1,int:1},flags:{tyler_rescued:true}},choices:[{text:'Stay with him until he\'s ready to go back in.',next:'fp_kitchen_late',effects:{relationships:{tyler:2}}},{text:'"Want to talk about the going-too-hard thing? For real?"',next:'fp_tyler_confides',effects:{relationships:{tyler:3}}},{text:'Walk him home. He\'s had enough for tonight.',next:'fp_tyler_walk_home',effects:{relationships:{tyler:3}}}]},
fp_tyler_chad_help:{characters:['chad'],text:'You find Chad restocking cups in the kitchen. "Hey — Tyler had too much of the punch. How strong was that thing?"\n\nChad\'s face falls. The bro mask drops completely. "Shit. The punch is — okay, it\'s stronger than it tastes. Way stronger. I should\'ve put a sign up."\n\nWithout being asked, he grabs a water bottle and a bag of pretzels and follows you to Tyler. He kneels down next to him like an EMT.\n\n"Tyler, my man. How many fingers?" He holds up three.\n\n"...Seven."\n\n"Okay, that\'s not great. Eat these pretzels. Small bites." He turns to you. "I\'ll stay with him. You don\'t have to miss the party."\n\n"I\'m not leaving him."\n\nChad looks at you differently. Respect. Not the beer pong kind. The real kind.\n\n"You\'re a good one," he says quietly. "Most people would\'ve walked away."',scene:'party',mood:'#636e72',effects:{relationships:{chad:3,tyler:2},stats:{per:1},flags:{chad_helped_tyler:true}},choices:[{text:'Stay with both of them. This is where you belong right now.',next:'fp_tyler_sobering',effects:{relationships:{chad:2,tyler:2}}},{text:'Chad\'s got it. Check on Tyler in twenty minutes.',next:'fp_kitchen_late',effects:{relationships:{tyler:1}}},{text:'"Thanks, Chad. For real." Head back to the party.',next:'fp_fire_chill',effects:{relationships:{chad:1}}}]},

// === STAIRWELL CONVERSATIONS ===
fp_stairwell:{characters:[],text:'The stairwell between floors is a liminal space. Not quite the party, not quite away from it. You sit on a step and the bass vibrates through the wood beneath you.\n\nSomeone sits down two steps above you. You glance back — it\'s a girl with paint under her fingernails and a leather journal clutched to her chest.\n\n"Good spot," she says. "The acoustics here are different. The music sounds better from the stairs than the dance floor. More bass, less treble. The house filters it."\n\nShe opens her journal. You catch a glimpse of sketches — faces, quick and gestural, people caught in moments they didn\'t know were being observed.\n\nIt\'s Luna. You hadn\'t recognized her from behind.',scene:'party',mood:'#636e72',effects:{relationships:{luna:1}},choices:[{text:'"Are you sketching people at the party? Can I see?"',next:'fp_luna_sketchbook',effects:{relationships:{luna:3}}},{text:'"The stairs as an art gallery. I like your style."',next:'fp_roof_luna',effects:{relationships:{luna:2}}},{text:'Sit in comfortable silence. Not every moment needs words.',next:'fp_luna_quiet',effects:{relationships:{luna:2}}}]},
fp_luna_sketchbook:{characters:['luna'],text:'Luna hesitates — then opens the journal.\n\nPage after page of quick sketches. Chad mid-laugh, his whole body in it. Mia looking at her phone, face lit blue, lonely in a crowd. Tyler dancing with his eyes closed, completely free. Jake watching the party from a doorway, pride and exhaustion on his face in equal measure.\n\nAnd one of you. Standing by the kitchen door, looking out at the dance floor. She caught something you didn\'t know was showing — a mix of wonder and longing and courage.\n\n"When did you draw this?"\n\n"Earlier. When you didn\'t know I was watching." She takes the journal back gently. "That\'s when people are most themselves. When they think nobody\'s looking."\n\nShe flips to a blank page. "Want me to do a proper one? You looking at me, knowing I\'m drawing? It\'ll be different. More guarded. But sometimes that\'s interesting too."',scene:'party',mood:'#fd79a8',effects:{relationships:{luna:4},stats:{per:1},flags:{saw_luna_sketches:true}},choices:[{text:'"Draw me. I\'ll try not to be guarded."',next:'fp_luna_draws_you',effects:{relationships:{luna:3}}},{text:'"Keep the unguarded one. It\'s more honest."',next:'fp_roof_luna',effects:{relationships:{luna:3}}},{text:'"Draw us both. Sitting here on the stairs."',next:'fp_roof_luna_close',effects:{relationships:{luna:2}}}]},

// === ZARA VULNERABLE MOMENT ===
fp_zara_balcony:{characters:['zara'],text:'You find Zara on the second-floor balcony, sitting on the railing with her legs dangling over the edge. The red hair is unmistakable even in silhouette.\n\nShe\'s not performing. No audience, no energy, no center-of-attention glow. She\'s just... sitting. Looking at the campus like it\'s a painting she\'s trying to understand.\n\nShe hears you and turns. For half a second, you see something raw — then the smile snaps on like a stage light.\n\n"Hey! Just getting some air. You know me, always going going going—"\n\nShe stops. Realizes you saw the half-second. Decides whether to keep performing or let you in.',scene:'party',mood:'#636e72',effects:{relationships:{zara:2}},choices:[{text:'"You don\'t have to be \'on\' right now. It\'s just me."',next:'fp_zara_real',effects:{relationships:{zara:4},stats:{per:1}}},{text:'"Great view from up here. Mind if I sit?"',next:'fp_zara_quiet',effects:{relationships:{zara:2}}},{text:'Respect her space. "Just passing through. See you downstairs."',next:'fp_hallway',effects:{relationships:{zara:1}}}]},
fp_zara_real:{characters:['zara'],text:'The performance drops. It\'s like watching someone take off armor.\n\n"I\'m exhausted," she says simply. "I\'ve been \'on\' since 8 PM. That\'s five hours of being Zara — the fun one, the loud one, the one who drags everyone onto the dance floor." She pulls her knees up. "Nobody ever asks if the fun one is having fun."\n\n"Are you?"\n\nLong pause. "Sometimes. Genuinely. The dancing — that\'s real. I love dancing. But the rest? The constant energy, the making sure everyone else has a good time?" She sighs. "It\'s a role. And I\'m good at it. Too good. People expect it now."\n\nShe looks at you sideways. "Mia knows. She\'s the only one who ever says \'you can stop.\' That\'s why she\'s my best friend."\n\nA breeze moves her hair. She looks younger without the performance. More real.\n\n"Thanks for not making it weird," she says. "Most guys hear a girl say she\'s tired and try to be the hero. You just... sat there. That\'s nice."',scene:'party',mood:'#636e72',effects:{relationships:{zara:5},stats:{per:2,int:1},flags:{zara_real_moment:true}},choices:[{text:'"You\'re allowed to be tired. The party will survive without you for ten minutes."',next:'fp_fire_chill',effects:{relationships:{zara:3}}},{text:'"What would you do right now if nobody expected anything?"',next:'fp_zara_quiet',effects:{relationships:{zara:3}}},{text:'"Mia sounds like a good friend. You both are."',next:'fp_kitchen_late',effects:{relationships:{zara:2,mia:1}}}]},
fp_zara_quiet:{characters:['zara'],text:'You sit on the balcony together. No talking. The party pulses below — you can feel it through the floor, hear it through the walls. Up here it\'s just the two of you and the night air.\n\nZara pulls out her phone, scrolls to something, and holds out an earbud. "Want to listen? This is what I actually listen to when nobody\'s watching. Not the party stuff."\n\nYou take the earbud. It\'s soft — acoustic guitar, a voice like warm honey, lyrics about being lost and being okay with it.\n\n"Surprised?" she asks.\n\n"A little."\n\n"Good. I like surprising people in small ways. The big surprises are expected from me. The small ones are mine."\n\nYou listen to three songs together. By the third one, she\'s leaning her head against the railing and her eyes are closed. Not sleeping. Just resting. Being nobody for a few minutes.',scene:'party',mood:'#636e72',effects:{relationships:{zara:3},stats:{per:1},flags:{zara_playlist:true}},choices:[{text:'"This is the best part of my night. Seriously."',next:'fp_number_exchange',effects:{relationships:{zara:3}}},{text:'When the song ends, give back the earbud and smile. Head inside.',next:'fp_kitchen_late',effects:{relationships:{zara:2}}},{text:'"Want to go find Mia? I think she\'d want to know you\'re up here."',next:'fp_mia_looking',effects:{relationships:{zara:2,mia:1}}}]},

// === LATE KITCHEN PHILOSOPHY ===
fp_kitchen_2am:{characters:[],text:'The kitchen at 2 AM is a confessional.\n\nThe keg is empty. The beer pong table is a graveyard of cups. But three people are still here — you, and two strangers sitting on the countertop, sharing a bag of Doritos like communion wafers.\n\n"Here\'s what I think," says the girl on the left, gesturing with a chip. "Every college party is actually a speed-run of an entire relationship. You meet, you flirt, you fight, you make up, you say goodbye. All in one night."\n\n"That\'s depressingly accurate," says the guy next to her.\n\n"It\'s not depressing. It\'s efficient." She notices you. "New participant! Agree or disagree: tonight is a microcosm of your entire college experience."',scene:'party',mood:'#fdcb6e',effects:{stats:{int:1}},choices:[{text:'"Agree. I think I\'ve lived four years tonight."',next:'fp_kitchen_philosophy',effects:{stats:{int:1,per:1}}},{text:'"Disagree. Tonight is just the trailer. The movie hasn\'t started."',next:'fp_kitchen_philosophy',effects:{stats:{cha:1,int:1}}},{text:'Grab a Dorito and listen. Some conversations are better observed.',next:'fp_ending_morning_texts',effects:{stats:{per:1}}}]},
fp_kitchen_philosophy:{characters:[],text:'The three of you talk until the sky starts changing color outside the window. About college, about fear, about the specific loneliness of being surrounded by people and still feeling like you\'re the only one who doesn\'t have it figured out.\n\n"Nobody has it figured out," Dorito Girl says. "The people who look like they do? They\'re just better actors. Take it from a theater major."\n\n"Pre-law," says the guy. "And I can confirm: everyone is faking it. The entire legal system runs on confident bluffing."\n\nThe conversation meanders — politics, music, whether hot dogs are sandwiches (they are not), the meaning of \'home\' when you\'re living in a dorm for the first time.\n\nYou never exchange names. Somehow that makes it better. Pure connection, no context, no expectations. Three strangers telling each other the truth because the night is old enough for honesty.\n\nWhen the first bird sings outside the kitchen window, Dorito Girl hops off the counter.\n\n"This was the best conversation I\'ve had all semester," she says. "I hope I never see either of you again. It\'ll ruin it."',scene:'party',mood:'#fdcb6e',effects:{stats:{int:2,per:1},flags:{kitchen_philosophy:true}},choices:[{text:'"Same. Goodbye, people whose names I\'ll never know."',next:'fp_ending_morning_texts',effects:{stats:{cha:1}}},{text:'Actually — exchange numbers. Some connections are worth keeping.',next:'fp_number_exchange',effects:{stats:{cha:1}}}]},

// === EXPAND THIN NODES ===
fp_mia_walk_talk:{characters:['mia'],text:'The walk stretches out ahead of you — fifteen minutes of empty campus. Your footsteps echo off the science building. A sprinkler hisses somewhere in the dark.\n\n"Can I tell you something embarrassing?" Mia says. She\'s walking close enough that your arms keep brushing.\n\n"Always."\n\n"I almost left the party three times tonight. Once when I arrived and didn\'t recognize anyone. Once when bottle spin got intense. And once..." she trails off.\n\n"Once when?"\n\n"Once when you went to the roof without me. I thought — okay, he found someone more interesting. Classic Mia, always the second choice." She says it matter-of-factly, like she\'s read this about herself in a textbook.\n\n"You were never the second choice," you say. And you mean it.\n\nShe stops walking. Turns to face you. The campus is dead quiet.\n\n"Say that again."\n\n"You were never the second choice."',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:4},stats:{cha:1,per:1}},choices:[{text:'Kiss her under the streetlamp. Some moments write themselves.',next:'fp_ending_roof',effects:{relationships:{mia:4},flags:{mia_streetlamp_kiss:true}}},{text:'"And you won\'t be. Text me tomorrow?"',next:'fp_ending_morning_texts',effects:{relationships:{mia:3}}},{text:'Take her hand. Walk the rest of the way in comfortable silence.',next:'fp_ending_good',effects:{relationships:{mia:3}}}]},

// === NADIA EXPANSION ===
fp_nadia_stars:{characters:['nadia'],text:'Nadia walks you off campus, away from the light pollution, until you reach the soccer field. Dark. Open. The sky overhead is massive.\n\nShe lies down on the grass and you follow. Side by side, staring up.\n\n"That\'s the real Big Dipper," she says, pointing. "And that —" she traces a shape, "— is my fake one. See? It\'s smaller and slightly to the left. Like it\'s trying to copy the homework but doesn\'t quite get it."\n\nYou squint. You kind of see it. Or maybe you just want to because she\'s so earnest about it.\n\n"When I was a kid, I used to name all the constellations wrong on purpose," she says. "My dad would correct me and I\'d argue. I was seven, debating an astrophysicist about whether Orion\'s belt was actually called \'space pants.\' He loved it."\n\nShe goes quiet. "He still brings it up. Space pants." A soft laugh that holds something heavy underneath.\n\n"I miss being that sure about things."',scene:'party',mood:'#636e72',effects:{relationships:{nadia:4},stats:{per:1,int:1},flags:{nadia_stars:true}},choices:[{text:'"What are you unsure about now?"',next:'fp_nadia_real',effects:{relationships:{nadia:3}}},{text:'"Space pants is objectively a better name." Make her laugh.',next:'fp_ending_nadia_walk',effects:{relationships:{nadia:3},stats:{cha:1}}},{text:'Don\'t say anything. Just point at a random cluster and say: "That one\'s called \'The Nadia.\'"',next:'fp_ending_nadia',effects:{relationships:{nadia:4}}}]},

// === JAKE'S ROOM ===
fp_jake_room:{characters:['jake'],text:'Jake opens the DO NOT ENTER door. Behind it is his room — not a typical frat bro cave. Bookshelves line one wall, actually full. A desk with a lamp and a half-written essay. Photos everywhere: his family, the frat through the years, a group of kids at what looks like a summer camp.\n\n"Sorry about the mess," he says, though it\'s the cleanest room in the house. "I don\'t usually show people up here. It ruins the image."\n\n"What image?"\n\n"The \'chill party host who doesn\'t take anything seriously\' image." He sits on the bed. "In reality, I have a 3.8 GPA, I volunteer at a youth center on Saturdays, and I read poetry before bed. But if any of those guys downstairs knew that, they\'d treat me differently."\n\nHe picks up a book from his nightstand. Rumi.\n\n"The wound is the place where the light enters you," he reads. Then tosses the book down, embarrassed.',scene:'party',mood:'#636e72',effects:{relationships:{jake:4},stats:{int:2,per:1},flags:{jake_room:true}},choices:[{text:'"Why would being smart make them treat you differently?"',next:'fp_jake_mask',effects:{relationships:{jake:3}}},{text:'"Rumi. Good taste. What else have you got?"',next:'fp_jake_philosophy',effects:{relationships:{jake:2}}},{text:'"Your secret\'s safe with me. But you shouldn\'t have to hide it."',next:'fp_jake_deep',effects:{relationships:{jake:4}}}]},

// === LATE NIGHT EXPANSION ===
fp_night_winding_down:{characters:[],text:'The party is thinning. It\'s past 1 AM, and the house has that late-night feel — warmer, softer, the sharp edges of the night worn smooth. The music has shifted from bangers to something low and atmospheric. Fairy lights in the backyard glow like distant stars.\n\nYou\'re standing in the hallway between rooms. Through one door: the kitchen, where stragglers are having quiet conversations. Through the other: the backyard, where the fire pit is down to embers. Upstairs: the roof, dark and silent.\n\nYour phone buzzes. Multiple texts.\n\nThe night is ending. But endings are just choices you haven\'t made yet.',scene:'party',mood:'#636e72',effects:{},choices:[{text:'One last round through the party. Say goodbye to everyone.',next:'fp_number_exchange',effects:{stats:{cha:1}}},{text:'Find the person who mattered most tonight.',next:'fp_kitchen_late',effects:{stats:{per:1}}},{text:'Go to the roof alone. End the night with the sky.',next:'fp_ending_solo'},{text:'The kitchen at 2 AM has its own magic.',next:'fp_kitchen_2am',effects:{stats:{int:1}}}]},

// === CONNECTING NODES ===
fp_celebrate_aftermath:{characters:[],text:'The celebration high fades, and you find yourself at the edge of the dance floor, warm from dancing, warm from everything. The room is a kaleidoscope — lights, faces, laughter, bass.\n\nChad appears with two cups of water. "Hydration check. Even legends need water."\n\nYou drink gratefully. The party is hitting its stride — the peak energy, where everyone\'s loose enough to be real but not too far gone to remember.\n\n"Hey," Chad says, more seriously. "Tyler\'s looking rough. Might want to check on him. Last I saw he was by the stairs."',scene:'party',mood:'#e17055',effects:{relationships:{chad:1}},choices:[{text:'Find Tyler. He comes first.',next:'fp_tyler_too_drunk',effects:{relationships:{tyler:1}}},{text:'He\'s fine. Keep riding the wave.',next:'fp_dance_floor',effects:{stats:{cou:1}}},{text:'Check the backyard — the fire pit crowd calls to you.',next:'fp_fire_chill'},{text:'Actually... where did Mia go?',next:'fp_mia_looking',effects:{relationships:{mia:1}}}]},
fp_mia_stairs:{characters:['mia'],text:'You find Mia sitting on the stairs, shoes off, rubbing her feet.\n\n"Heels were a mistake," she says without looking up. "Zara convinced me. \'You\'ll look hot,\' she said. \'They\'re only three inches,\' she said. My feet are filing a formal complaint."\n\nShe scoots over to make room. The stairwell is quiet — a pocket of calm in the chaos. From here you can hear the party above and below, but it feels distant. Like you\'re backstage.\n\n"I had fun tonight," she says, quieter now. "More than I expected. I usually hate these things. But..." she glances at you. Decides something. "But I think the company made the difference."\n\nShe\'s being honest. You can feel it. This isn\'t flirting — it\'s something rarer.',scene:'party',mood:'#fd79a8',effects:{relationships:{mia:3},stats:{per:1}},choices:[{text:'"The company agrees."',next:'fp_mia_opens_up',effects:{relationships:{mia:2}}},{text:'Offer to carry her shoes. Walk her somewhere more comfortable.',next:'fp_roof_mia',effects:{relationships:{mia:2}}},{text:'"Tell me the real reason you usually hate parties."',next:'fp_mia_opens_up',effects:{relationships:{mia:3},stats:{int:1}}}]},
fp_late_observations:{characters:[],text:'You find a quiet corner and just... watch. The party in its late stage is a different beast. The performers have gone home. What\'s left is real.\n\nChad is picking up cups, quietly, when he thinks nobody\'s looking. Jake is sitting with a freshman who looks overwhelmed, talking to them softly. Zara is dancing alone, eyes closed, just for herself. Tyler is asleep on the couch, a blanket someone draped over him.\n\nThese are the moments that matter, you realize. Not the beer pong victories or the dance battles. The quiet kindnesses. The authentic selves that only come out when the audience leaves.\n\nYou\'re seeing people as they really are. And what you see is... good. Messy and imperfect and uncertain, but fundamentally good.',scene:'party',mood:'#636e72',effects:{stats:{per:3,int:1},flags:{late_observer:true}},choices:[{text:'This feels like an ending. A good one.',next:'fp_ending_good',effects:{stats:{per:1}}},{text:'Join Jake with the overwhelmed freshman. You remember that feeling.',next:'fp_help_freshman',effects:{relationships:{jake:1}}},{text:'One more conversation before the night ends.',next:'fp_kitchen_2am'}]},
fp_couch_midnight:{characters:[],text:'The couch at midnight is prime real estate. Three people are crammed onto a two-person loveseat, and they welcome you like a long-lost family member.\n\n"Sit, sit! We\'re ranking every professor in the psych department," says a guy in a backwards cap.\n\n"Professor Davis is a LEGEND," argues a girl with blue streaks in her hair. "His tangent about social media and dopamine addiction? Changed my life."\n\n"He put me to sleep," the third person says flatly. "I literally have a photo of me sleeping in his class. I\'m not ashamed."\n\nA vigorous debate erupts. It\'s the most intellectual conversation happening at this party, and it\'s happening on a couch that smells like spilled beer.\n\nThrough the debate, you notice Mia hovering nearby, listening with a suppressed smile. She\'s in Davis\'s class too.',scene:'party',mood:'#fdcb6e',effects:{stats:{int:1}},choices:[{text:'Defend Professor Davis. His tangents are gold.',next:'fp_mia_talk',effects:{relationships:{mia:1},stats:{int:1}}},{text:'Join the anti-Davis faction. He IS boring.',next:'fp_kitchen_chill',effects:{stats:{cha:1}}},{text:'Catch Mia\'s eye. Pull her into the debate.',next:'fp_meet_mia',effects:{relationships:{mia:2}}}]},

// === MORNING AFTER — MULTI-DAY SIM PROLOGUE ===
