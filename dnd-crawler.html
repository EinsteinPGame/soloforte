// ============================================================
// COMPANION COMBAT AI
// ============================================================
function companionTurn(comp) {
  if (!comp || comp.hp <= 0) return;
  const aliveEnemies = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0);
  if (aliveEnemies.length === 0) return;

  // Lyra special: arcane surge when ally just fell
  if (comp.name === 'Lyra Starweave' && combatState._fallenCompanions && combatState._fallenCompanions.length > 0 && !combatState._lyraSurgeUsed) {
    combatState._lyraSurgeUsed = true;
    const target = pick(aliveEnemies);
    const dmg = rollDice(3,4) + 3;
    target.entity.hp = Math.max(0, target.entity.hp - dmg);
    addCombatLog(`Lyra's Arcane Surge! Magic Missile for ${dmg} force damage!`);
    addFloatingText(canvasW/2, canvasH*0.3, `SURGE -${dmg}`, '#8888ff');
    SFX.spell();
    return;
  }

  // Healer companions heal lowest-HP party member if critical
  if (comp.canHeal) {
    // Find most injured ally
    const allies = [player, ...(player.squad || []).filter(c => c !== comp && c.hp > 0)];
    const injured = allies.find(a => a.hp < a.maxHp * 0.35);
    if (injured && Math.random() < 0.65) {
      const healAmt = rollDice(1, 8) + 2;
      injured.hp = Math.min(injured.maxHp, injured.hp + healAmt);
      const healTarget = injured === player ? 'you' : injured.name;
      addCombatLog(`${comp.name} heals ${healTarget} for ${healAmt} HP!`);
      addFloatingText(canvasW / 2, canvasH * 0.65, `+${healAmt}`, '#44ff44');
      SFX.heal();
      // Loyalty: healed player
      if (injured === player) comp.loyalty = Math.min(100, comp.loyalty + 1);
      return;
    }
  }

  // Attack a random enemy (Theron: target lowest HP if special ability not yet used)
  let target;
  if (comp.name === 'Theron Shadowstep' && !combatState._theronVolleyUsed) {
    combatState._theronVolleyUsed = true;
    const sorted = [...aliveEnemies].sort((a,b) => b.entity.hp - a.entity.hp);
    target = sorted[0];
    // Fires twice
    for (let shot = 0; shot < 2; shot++) {
      const attack = comp.attacks[0];
      const roll = d20();
      const totalRoll = roll + attack.bonus;
      if (roll >= 20 || (roll !== 1 && totalRoll >= target.entity.ac)) {
        const dmg = rollDice(attack.damage[0], attack.damage[1]) + attack.damageBonus;
        target.entity.hp = Math.max(0, target.entity.hp - dmg);
        addCombatLog(`Theron's Hunter's Volley (${shot+1}/2): HIT for ${dmg}!`);
        SFX.hit();
      } else {
        addCombatLog(`Theron's Hunter's Volley (${shot+1}/2): MISS`);
      }
      if (target.entity.hp <= 0) { addCombatLog(`${target.entity.name} defeated!`); break; }
    }
    return;
  }

  target = pick(aliveEnemies);
  const attack = comp.attacks[0];
  const roll = d20();
  const totalRoll = roll + attack.bonus;

  if (roll === 20) {
    const dmg = rollDice(attack.damage[0] * 2, attack.damage[1]) + attack.damageBonus;
    target.entity.hp = Math.max(0, target.entity.hp - dmg);
    addCombatLog(`${comp.name} uses ${attack.name}: NAT 20! CRIT for ${dmg}!`);
    SFX.crit();
  } else if (roll === 1) {
    addCombatLog(`${comp.name} uses ${attack.name}: NAT 1! Miss!`);
  } else if (totalRoll >= target.entity.ac) {
    let dmg = rollDice(attack.damage[0], attack.damage[1]) + attack.damageBonus;
    // Grimjaw berserker fury: double dmg on kills when below 50%
    if (comp.name === 'Grimjaw' && comp.hp < comp.maxHp * 0.5 && target.entity.hp <= dmg) {
      dmg *= 2;
      addCombatLog(`GRIMJAW FURY! Double damage: ${dmg}!`);
    }
    // Elara shadow strike: bonus once per combat
    if (comp.name === 'Elara the Swift' && !combatState._elaraShadowUsed) {
      combatState._elaraShadowUsed = true;
      const bonus = rollDice(2,4);
      dmg += bonus;
      addCombatLog(`Elara's Shadow Strike! +${bonus} bonus damage!`);
    }
    target.entity.hp = Math.max(0, target.entity.hp - dmg);
    addCombatLog(`${comp.name} uses ${attack.name} on ${target.entity.name}: HIT for ${dmg}!`);
    SFX.hit();
  } else {
    addCombatLog(`${comp.name} uses ${attack.name}: MISS! (${totalRoll} vs AC ${target.entity.ac})`);
  }
  if (target.entity.hp <= 0) addCombatLog(`${target.entity.name} defeated!`);
}

// ============================================================
// LOYALTY SYSTEM
// ============================================================
function applyLoyaltyEvent(event) {
  if (!player || !player.squad) return;
  const changes = COMPANION_OPINIONS[event];
  if (!changes) return;
  player.squad.forEach(comp => {
    const shortName = getCompShortName(comp.name);
    const delta = changes[shortName] || 0;
    if (delta === 0) return;
    const old = comp.loyalty;
    comp.loyalty = Math.max(0, Math.min(100, comp.loyalty + delta));
    if (comp.loyalty !== old && Math.abs(delta) >= 3) {
      const sign = delta > 0 ? '+' : '';
      addFloatingText(canvasW/2 + rand(-60,60), canvasH/2 - 80, `${comp.name}: ${sign}${delta} Loy`, delta > 0 ? '#44ff88' : '#ff6644');
    }
    // Loyalty-based events
    if (comp.loyalty <= 10 && old > 10) {
      dungeonMessage = `${comp.name} leaves the party in anger!`;
      dungeonMessageTimer = 3;
      setTimeout(() => { player.squad = player.squad.filter(c => c !== comp); }, 100);
    } else if (comp.loyalty <= 20 && old > 20) {
      dungeonMessage = `${comp.name} is thinking of leaving...`;
      dungeonMessageTimer = 2.5;
    } else if (comp.loyalty >= 80 && old < 80 && !comp.backstoryUnlocked) {
      comp.backstoryUnlocked = true;
      dungeonMessage = `${comp.name} opens up to you. Check the campfire for their story.`;
      dungeonMessageTimer = 3;
    }
  });
}

function getCompShortName(fullName) {
  if (fullName.startsWith('Elara')) return 'Elara';
  if (fullName.startsWith('Brother Aldric')) return 'Aldric';
  if (fullName === 'Grimjaw') return 'Grimjaw';
  if (fullName.startsWith('Lyra')) return 'Lyra';
  if (fullName.startsWith('Theron')) return 'Theron';
  if (fullName === 'Seraphina') return 'Seraphina';
  return fullName;
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveGame() {
  const saveData = {
    player: deepClone(player),
    dungeon: deepClone(dungeon),
    currentFloor: currentFloor,
    timestamp: Date.now(),
    version: '2.5',
    // War arc state
    warState: warState,
    playerFaction: playerFaction,
    factionReps: deepClone(factionReps),
    factionRanks: deepClone(factionRanks),
    completedFactionQuests: deepClone(completedFactionQuests),
    activeFactionQuest: deepClone(activeFactionQuest),
    defectionPending: defectionPending,
    assassinsActive: assassinsActive,
    assassinTier: assassinTier,
    // Companion conflict state
    conflictsThisFloor: conflictsThisFloor,
    pendingConflict: pendingConflict ? { conflict: pendingConflict.conflict, compAName: pendingConflict.compA?.name, compBName: pendingConflict.compB?.name } : null,
    conflictHistory: conflictHistory,
    // Guild state
    playerGuild: playerGuild,
    guildRep: deepClone(guildRep),
    activeGuildQuest: deepClone(activeGuildQuest),
    completedGuildQuests: deepClone(completedGuildQuests),
    guildQuestTracking: deepClone(guildQuestTracking),
    // NPC dialogue consequence flags
    npcFlags: deepClone(npcFlags),
  };
  try {
    localStorage.setItem('dof_save', JSON.stringify(saveData));
  } catch(e) {
    console.error('Save failed:', e);
  }
}

function loadGame() {
  try {
    const data = JSON.parse(localStorage.getItem('dof_save'));
    if (!data || !data.player || !data.dungeon) {
      dungeonMessage = 'Save data corrupted!';
      dungeonMessageTimer = 2;
      return;
    }
    player = data.player;
    if (player.reputation === undefined) player.reputation = 0;
    if (player.evolution === undefined) player.evolution = null;
    if (player.evolutionData === undefined) player.evolutionData = null;
    // v2.2 backward compat: migrate old companion to squad
    if (player.companion !== undefined && !player.squad) {
      player.squad = player.companion ? [player.companion] : [];
      delete player.companion;
    }
    if (!player.squad) player.squad = [];
    if (player.romanced === undefined) player.romanced = null;
    if (player.belovedShield === undefined) player.belovedShield = false;
    // Ensure squad members have loyalty
    player.squad.forEach(c => { if (c.loyalty === undefined) c.loyalty = 50; });
    dungeon = data.dungeon;
    currentFloor = data.currentFloor;
    // v2.3 war arc backward compat
    warState = data.warState || WAR_STATE.INACTIVE;
    playerFaction = data.playerFaction || null;
    factionReps = data.factionReps || { iron_legion: 0, shadow_syndicate: 0, arcane_conclave: 0, merchant_coalition: 0 };
    factionRanks = data.factionRanks || { iron_legion: 0, shadow_syndicate: 0, arcane_conclave: 0, merchant_coalition: 0 };
    completedFactionQuests = data.completedFactionQuests || [];
    activeFactionQuest = data.activeFactionQuest || null;
    defectionPending = data.defectionPending || false;
    assassinsActive = data.assassinsActive || false;
    assassinTier = data.assassinTier || 'initiate';
    // Companion conflict state
    conflictsThisFloor = data.conflictsThisFloor || 0;
    conflictHistory = data.conflictHistory || [];
    // Guild state
    playerGuild = data.playerGuild || null;
    guildRep = data.guildRep || { adventurers: 0, arcane: 0, shadow: 0, holy: 0 };
    activeGuildQuest = data.activeGuildQuest || null;
    completedGuildQuests = data.completedGuildQuests || [];
    guildQuestTracking = data.guildQuestTracking || { combatStreak: 0, spellsCast: 0, enemiesAvoided: 0, trapsDisarmed: 0, magicFound: 0, damageTaken: 0, undeadKilled: 0, companionsDied: false, bossRounds: 0 };
    // NPC dialogue consequence flags
    npcFlags = data.npcFlags || {};
    // Restore pending conflict by finding companions in squad
    if (data.pendingConflict && player.squad) {
      const compA = player.squad.find(c => c.name === data.pendingConflict.compAName);
      const compB = player.squad.find(c => c.name === data.pendingConflict.compBName);
      if (compA && compB) {
        pendingConflict = { conflict: data.pendingConflict.conflict, compA, compB };
      } else {
        pendingConflict = null;
      }
    } else {
      pendingConflict = null;
    }
    gameState = STATE.DUNGEON;
    revealArea(player.x, player.y, player.torchRadius);
    dungeonMessage = 'Game loaded!';
    dungeonMessageTimer = 1.5;
  } catch(e) {
    console.error('Load failed:', e);
    dungeonMessage = 'Failed to load!';
    dungeonMessageTimer = 2;
  }
}

// ============================================================
// PARTY MANAGEMENT SCREEN
// ============================================================
function updatePartyMgmt() {
  X.fillStyle = '#0a0a0f';
  X.fillRect(0, 0, canvasW, canvasH);

  const cx = canvasW / 2;

  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 18 : 22}px Consolas, monospace`;
  X.textAlign = 'center';
  X.fillText('PARTY MANAGEMENT', cx, 30);

  X.fillStyle = '#aaa';
  X.font = '13px Consolas, monospace';
  X.fillText(`Squad: ${(player.squad||[]).length}/4`, cx, 52);

  const panelW = Math.min(canvasW - 20, 460);
  const panelX = cx - panelW / 2;

  if (!player.squad || player.squad.length === 0) {
    X.fillStyle = '#555';
    X.font = '14px Consolas, monospace';
    X.fillText('No companions in your squad.', cx, canvasH / 2);
    X.fillText('Recruit companions from NPC rooms in the dungeon.', cx, canvasH / 2 + 22);
  } else {
    const cardH = isMobile ? 110 : 120;
    const gap = 10;
    const startY = 70;
    player.squad.forEach((comp, idx) => {
      const cy2 = startY + idx * (cardH + gap) + (partyMgmtScroll || 0);
      if (cy2 + cardH < 60 || cy2 > canvasH - 50) return;

      const loyPct = comp.loyalty / 100;
      const loyColor = comp.loyalty >= 90 ? '#ff88aa' : comp.loyalty >= 80 ? '#ffd700' : comp.loyalty >= 50 ? '#44aaff' : comp.loyalty >= 20 ? '#ff8800' : '#ff2222';

      X.fillStyle = '#1a1a2a';
      X.fillRect(panelX, cy2, panelW, cardH);
      X.strokeStyle = comp.color;
      X.lineWidth = 2;
      X.strokeRect(panelX, cy2, panelW, cardH);

      // Companion symbol
      X.fillStyle = comp.color;
      X.beginPath(); X.arc(panelX + 28, cy2 + 28, 20, 0, Math.PI * 2); X.fill();
      X.fillStyle = '#fff';
      X.font = 'bold 14px Consolas, monospace';
      X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(comp.symbol, panelX + 28, cy2 + 29);

      // Name & class
      X.textAlign = 'left'; X.textBaseline = 'alphabetic';
      X.fillStyle = '#fff';
      X.font = `bold ${isMobile ? 13 : 15}px Consolas, monospace`;
      const romanceTag = player.romanced === comp.name ? ' ♥' : '';
      X.fillText(`${comp.name}${romanceTag}`, panelX + 56, cy2 + 18);
      X.fillStyle = '#aaa';
      X.font = '11px Consolas, monospace';
      X.fillText(comp.class, panelX + 56, cy2 + 32);

      // HP bar
      X.fillStyle = '#300';
      X.fillRect(panelX + 56, cy2 + 38, panelW - 130, 8);
      const hpPct = comp.hp / comp.maxHp;
      X.fillStyle = hpPct > 0.5 ? '#0c0' : hpPct > 0.25 ? '#cc0' : '#c00';
      X.fillRect(panelX + 56, cy2 + 38, (panelW - 130) * hpPct, 8);
      X.fillStyle = '#888';
      X.font = '10px Consolas, monospace';
      X.fillText(`HP: ${comp.hp}/${comp.maxHp}`, panelX + 56, cy2 + 58);

      // Loyalty bar
      X.fillStyle = '#220';
      X.fillRect(panelX + 56, cy2 + 62, panelW - 130, 6);
      X.fillStyle = loyColor;
      X.fillRect(panelX + 56, cy2 + 62, (panelW - 130) * loyPct, 6);

      const loyLabel = comp.loyalty >= 90 ? 'Romance available!' : comp.loyalty >= 80 ? 'Backstory unlocked!' : comp.loyalty >= 20 ? `Loyalty: ${comp.loyalty}` : 'May leave soon!';
      X.fillStyle = loyColor;
      X.font = '10px Consolas, monospace';
      X.fillText(loyLabel, panelX + 56, cy2 + 80);

      // Personality
      X.fillStyle = '#666';
      X.font = `italic ${isMobile ? 9 : 10}px Consolas, monospace`;
      const shortPersonality = comp.personality.length > 55 ? comp.personality.substr(0, 52) + '...' : comp.personality;
      X.fillText(shortPersonality, panelX + 10, cy2 + cardH - 10);

      // Dismiss button
      const dismissW = 65, dismissH = 26;
      const dismissX = panelX + panelW - dismissW - 8;
      const dismissY = cy2 + (cardH - dismissH) / 2;
      drawButton(dismissX, dismissY, dismissW, dismissH, 'Dismiss', false, '#4a1a1a');
      if (clickedInRect(dismissX, dismissY, dismissW, dismissH)) {
        SFX.click();
        // Loyalty penalty for companions who liked dismissed one
        player.squad.forEach(other => {
          const compPool = COMPANION_POOL.find(c => c.name === other.name);
          if (compPool?.opinions?.likes?.some(n => comp.name.includes(n) || comp.name.startsWith(n))) {
            other.loyalty = Math.max(0, other.loyalty - 3);
          }
        });
        player.squad.splice(idx, 1);
        dungeonMessage = `${comp.name} has been dismissed.`;
        dungeonMessageTimer = 2;
      }
    });
  }

  // Romance section hint
  const romanceables = (player.squad || []).filter(c => c.romanceable && c.loyalty >= 90 && player.romanced !== c.name);
  if (romanceables.length > 0 && !player.romanced) {
    X.fillStyle = '#ff88aa';
    X.font = 'bold 12px Consolas, monospace';
    X.textAlign = 'center';
    const ry = canvasH - 90;
    X.fillText(`♥ Romance available with: ${romanceables.map(c=>c.name.split(' ')[0]).join(', ')}`, cx, ry);
    X.fillStyle = '#aaa';
    X.font = '11px Consolas, monospace';
    X.fillText('Visit the campfire at the next town to pursue romance.', cx, ry + 16);
  }
  if (player.romanced) {
    X.fillStyle = '#ff88aa';
    X.font = '11px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText(`♥ Romanced: ${player.romanced} — Beloved's Shield active (+1 AC)`, cx, canvasH - 76);
  }

  // Top-right X close button (mobile friendly)
  const xBtnSize = 40;
  drawButton(canvasW - xBtnSize - 10, 8, xBtnSize, xBtnSize, 'X', false, '#4a2a2a', '#ff6666');
  const closeBtnW = 120, closeBtnH = 40;
  drawButton(cx - closeBtnW/2, canvasH - 80, closeBtnW, closeBtnH, 'Close [P]', false, '#444');
  if (clickedInRect(canvasW - xBtnSize - 10, 8, xBtnSize, xBtnSize) || clickedInRect(cx - closeBtnW/2, canvasH - 80, closeBtnW, closeBtnH) || keys['p'] || keys['P'] || keys['Escape']) {
    keys['p'] = false; keys['P'] = false; keys['Escape'] = false;
    SFX.click();
    gameState = STATE.DUNGEON;
  }
}

// ============================================================
// TOWN SYSTEM
// ============================================================
let townNpcIdx = 0;
let townScrollY2 = 0;

function updateTown() {
  X.fillStyle = '#0a0a0f';
  X.fillRect(0, 0, canvasW, canvasH);

  if (!townData) { gameState = STATE.DUNGEON; return; }

  const cx = canvasW / 2;

  // Town header
  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 20 : 26}px Consolas, monospace`;
  X.textAlign = 'center';
  X.fillText('TOWN OF HEARTHREST', cx, 35);

  X.fillStyle = '#888';
  X.font = '13px Consolas, monospace';
  X.fillText(`Between Floor ${townData.floorCleared + 1} and Floor ${townData.nextFloor + 1}`, cx, 55);

  // Draw simple town layout (building icons row)
  const bldW = isMobile ? 55 : 70, bldH = isMobile ? 45 : 55;
  const bldY = 70;
  const bldGap = isMobile ? 8 : 14;
  const buildings = [
    { name: 'Tavern', color: '#a06030', icon: 'T', desc: 'Rest & rumors' },
    { name: 'Barracks', color: '#606080', icon: 'B', desc: 'Recruit allies' },
    { name: 'Bounty', color: '#c08020', icon: '$', desc: 'Contracts' },
    { name: 'Campfire', color: '#c04010', icon: '🔥', desc: 'Party talk' },
    { name: 'Guilds', color: playerGuild ? (GUILDS[playerGuild]?.color || '#c08020') : '#c08020', icon: '🏛', desc: 'Join & quests' },
    { name: 'Factions', color: warState !== WAR_STATE.INACTIVE ? (playerFaction ? (FACTIONS[playerFaction]?.color || '#8844cc') : '#8844cc') : '#444466', icon: '⚔', desc: 'Allegiance' },
    { name: 'Quests', color: '#44aa88', icon: '📜', desc: 'Side quests' },
  ];
  const totalBW = buildings.length * (bldW + bldGap) - bldGap;
  const bldStartX = cx - totalBW / 2;

  buildings.forEach((bld, i) => {
    const bx = bldStartX + i * (bldW + bldGap);
    const hov = isInRect(mouseX, mouseY, bx, bldY, bldW, bldH);
    X.fillStyle = hov ? bld.color : darkenColor(bld.color, 0.6);
    X.fillRect(bx, bldY, bldW, bldH);
    X.strokeStyle = hov ? '#fff' : '#666';
    X.lineWidth = hov ? 2 : 1;
    X.strokeRect(bx, bldY, bldW, bldH);
    X.fillStyle = '#fff';
    X.font = `bold ${isMobile ? 13 : 16}px Consolas, monospace`;
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(bld.icon, bx + bldW/2, bldY + bldH/2 - 6);
    X.font = `${isMobile ? 8 : 10}px Consolas, monospace`;
    X.fillText(bld.name, bx + bldW/2, bldY + bldH/2 + 10);
    X.fillStyle = '#aaa';
    X.font = `${isMobile ? 7 : 9}px Consolas, monospace`;
    X.fillText(bld.desc, bx + bldW/2, bldY + bldH/2 + 22);
  });

  const contentY = bldY + bldH + 18;
  const panelW = Math.min(canvasW - 20, 460);
  const panelX = cx - panelW / 2;

  // Tavern
  const tavX = bldStartX;
  if (clickedInRect(tavX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'tavern';
  }
  // Barracks
  const barX = bldStartX + (bldW + bldGap);
  if (clickedInRect(barX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'barracks';
  }
  // Bounty
  const bntX = bldStartX + 2 * (bldW + bldGap);
  if (clickedInRect(bntX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'bounty';
  }
  // Campfire
  const cfX = bldStartX + 3 * (bldW + bldGap);
  if (clickedInRect(cfX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'campfire';
  }
  // Guilds
  const gldX = bldStartX + 4 * (bldW + bldGap);
  if (clickedInRect(gldX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'guilds';
  }
  // Factions
  const facX = bldStartX + 5 * (bldW + bldGap);
  if (clickedInRect(facX, bldY, bldW, bldH)) {
    SFX.click();
    if (warState === WAR_STATE.TRIGGERED) {
      warChoiceState.phase = 'intro';
      gameState = STATE.WAR_CHOICE;
      return;
    }
    townData.activeSection = 'factions';
  }
  // Quests
  const questX = bldStartX + 6 * (bldW + bldGap);
  if (clickedInRect(questX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'quests';
  }

  const section = townData.activeSection || 'tavern';

  // Draw section content
  X.fillStyle = '#1a1a2a';
  X.fillRect(panelX, contentY, panelW, canvasH - contentY - 55);
  X.strokeStyle = '#444';
  X.lineWidth = 1;
  X.strokeRect(panelX, contentY, panelW, canvasH - contentY - 55);

  if (section === 'tavern') {
    drawTownTavern(panelX, contentY, panelW, cx);
  } else if (section === 'barracks') {
    drawTownBarracks(panelX, contentY, panelW, cx);
  } else if (section === 'bounty') {
    drawTownBounty(panelX, contentY, panelW, cx);
  } else if (section === 'campfire') {
    drawTownCampfire(panelX, contentY, panelW, cx);
  } else if (section === 'guilds') {
    drawTownGuilds(panelX, contentY, panelW, cx);
  } else if (section === 'factions') {
    drawTownFactions(panelX, contentY, panelW, cx);
  } else if (section === 'quests') {
    drawTownQuests(panelX, contentY, panelW, cx);
  }

  // Descend button
  const descW = isMobile ? 160 : 200, descH = 40;
  drawButton(cx - descW/2, canvasH - 48, descW, descH, `Descend to Floor ${townData.nextFloor + 1}`, false, '#2a2a4a');
  if (clickedInRect(cx - descW/2, canvasH - 48, descW, descH)) {
    SFX.stairs();
    currentFloor = townData.nextFloor;
    player.floor = currentFloor;
    conflictsThisFloor = 0; // reset conflict counter for new floor
    // Grimjaw custom weapon: +3 damage bonus for this floor
    if (npcFlags.grimjaw_custom_weapon) {
      const weapon = getEquippedItem('weapon');
      if (weapon) { weapon.bonusDamage = (weapon.bonusDamage || 0) + 3; }
      delete npcFlags.grimjaw_custom_weapon;
    }
    const startRoom = dungeon.floors[currentFloor].rooms[0];
    player.x = startRoom.cx;
    player.y = startRoom.cy;
    revealArea(player.x, player.y, player.torchRadius);
    // Show active NPC buffs
    const activeBuffs = [];
    if (npcFlags.marta_trap_intel) activeBuffs.push('Trap Detection+');
    if (npcFlags.elara_poison_ward) activeBuffs.push('Poison Ward');
    if (npcFlags.grimjaw_armor_knowledge) activeBuffs.push('Armor Exploit');
    if (npcFlags.verendis_seal_knowledge) activeBuffs.push('Seal Knowledge');
    if (npcFlags.thessa_bestiary) activeBuffs.push('Bestiary Intel');
    if (npcFlags.thessa_warding_word) activeBuffs.push('Warding Word');
    if (npcFlags.rolo_boss_pattern || npcFlags.kael_boss_pattern) activeBuffs.push('Boss Pattern');
    dungeonMessage = `Descended to Floor ${currentFloor + 1}` + (activeBuffs.length ? ` [${activeBuffs.join(', ')}]` : '');
    dungeonMessageTimer = activeBuffs.length ? 3 : 2;
    townData = null;
    gameState = STATE.DUNGEON;
    saveGame();
  }

  updateFloatingTexts(0.016);
}

function drawTownTavern(px, py, pw, cx) {
  // Check if NPC dialogue tree is active
  if (townData.talkingToNpc === 'marta') {
    if (drawNpcDialogueOverlay(px, py, pw, cx, 'marta')) return;
  }
  if (townData.talkingToNpc === 'elara') {
    if (drawNpcDialogueOverlay(px, py, pw, cx, 'elara')) return;
  }

  X.fillStyle = '#ffd700';
  X.font = 'bold 14px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText('THE RUSTY FLAGON TAVERN', cx, py + 18);

  const repTier = getRepTier(player.reputation);
  const canHealFree = player.reputation >= 50;
  const healCost = canHealFree ? 0 : 20;

  // NPC dialogue
  const npc = TOWN_NPCS[0];
  X.fillStyle = npc.color;
  X.font = 'bold 12px Consolas, monospace';
  X.textAlign = 'left';
  X.fillText(`${npc.name} says:`, px + 10, py + 38);
  X.fillStyle = '#ccc';
  X.font = 'italic 11px Consolas, monospace';
  const npcLine = npc.lines[townData.floorCleared % npc.lines.length];
  const npcLines = wrapText(npcLine, pw - 20, 11);
  npcLines.forEach((line, i) => X.fillText(line, px + 10, py + 52 + i * 14));

  // Talk to Marta button (opens dialogue tree)
  const talkBtnY = py + 52 + npcLines.length * 14 + 2;
  drawButton(px + 10, talkBtnY, 120, 22, 'Talk to Marta', false, '#2a2a3a', npc.color);
  if (clickedInRect(px + 10, talkBtnY, 120, 22)) {
    SFX.click(); townData.talkingToNpc = 'marta'; npcDialogueState = null;
  }

  const actY = talkBtnY + 28;

  // Rest/heal option
  const hLabel = canHealFree ? 'REST (Free - High Rep)' : `REST (${healCost} gold)`;
  const canAfford = player.gold >= healCost;
  drawButton(cx - 120, actY, 240, 36, hLabel, false, (canAfford || canHealFree) ? '#2a4a2a' : '#333');
  if (clickedInRect(cx - 120, actY, 240, 36) && (canAfford || canHealFree) && !townData.healUsed) {
    SFX.heal();
    player.gold -= healCost;
    player.hp = player.maxHp;
    player.spellSlots = player.maxSpellSlots;
    player.secondWindUsed = false; player.actionSurgeUsed = false;
    player.rageCount = 0; player.kiPoints = player.maxKiPoints;
    player.sorceryPoints = player.maxSorceryPoints;
    if (player.squad) player.squad.forEach(c => { c.hp = c.maxHp; });
    townData.healUsed = true;
    addFloatingText(canvasW/2, canvasH/2, 'FULLY RESTED!', '#44ff44');
  }
  if (townData.healUsed) {
    X.fillStyle = '#44ff44'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('Party fully rested!', cx, actY + 50);
  }

  // Buy drinks & chat (CHA dialogue check)
  const chatY = townData.healUsed ? actY + 65 : actY + 50;
  if (!townData.chatResult) {
    drawButton(cx - 100, chatY, 200, 30, 'Buy Drinks & Chat (5g)', false, player.gold >= 5 ? '#2a2a4a' : '#333');
    if (clickedInRect(cx - 100, chatY, 200, 30) && player.gold >= 5) {
      SFX.click(); player.gold -= 5;
      const check = dialogueCheck('CHA', 10 + townData.floorCleared * 2);
      const goodTips = [
        `"The boss on Floor ${townData.nextFloor + 1} is weak to magic. Hit it hard and fast."`,
        `"There is a hidden treasure room on the next floor. Look for a cracked wall in the east."`,
        `"The traps on the next floor trigger on weight. Send your lightest companion first."`,
        `"I heard the boss guards a legendary weapon. Worth the risk."`,
      ];
      const badTips = [
        '"Ehh, I dunno much. Drink more and ask again later."',
        '"Floor below is scary. That is all I know. Can I have another drink?"',
      ];
      townData.chatResult = {
        success: check.success,
        tip: check.success ? goodTips[townData.nextFloor % goodTips.length] : badTips[Math.floor(Math.random() * badTips.length)],
        roll: `CHA Check: ${check.roll}+${check.mod}=${check.total} vs DC ${check.dc}`
      };
      if (check.success) addFloatingText(canvasW/2, canvasH/2, 'Useful intel!', '#44ff44');
    }
  }
  if (townData.chatResult) {
    X.fillStyle = townData.chatResult.success ? '#44ff44' : '#ff8844';
    X.font = '9px Consolas, monospace'; X.textAlign = 'center';
    X.fillText(townData.chatResult.roll, cx, chatY + 8);
    X.fillStyle = '#ccc'; X.font = 'italic 10px Consolas, monospace';
    const tipLines = wrapText(townData.chatResult.tip, pw - 20, 10);
    tipLines.forEach((line, i) => X.fillText(line, cx, chatY + 22 + i * 13));
  }

  // Rumors (random flavor)
  const rumorsStartY = townData.chatResult ? chatY + 50 : chatY + 40;
  const rumors = [
    '"Heard the next floor has traps that make the last look like puddles..."',
    '"A wizard came through last month. We haven\'t seen him since."',
    '"Strange lights below. Could be treasure. Could be something worse."',
    '"The boss on the next floor... I won\'t say the name. Bad luck."',
    '"Three adventurers went down yesterday. Two came back. One doesn\'t talk anymore."',
  ];
  const rumor = rumors[(townData.nextFloor + Math.floor(gameTime * 0.1)) % rumors.length];
  X.fillStyle = '#666'; X.font = 'italic 10px Consolas, monospace'; X.textAlign = 'center';
  const rumorLines = wrapText(`Rumor: ${rumor}`, pw - 20, 10);
  rumorLines.forEach((line, i) => X.fillText(line, cx, rumorsStartY + i * 13));

  // Healer Elara (secondary NPC in tavern)
  const elaraY = rumorsStartY + rumorLines.length * 13 + 10;
  const elaraNpc = TOWN_NPCS[4];
  X.fillStyle = elaraNpc.color; X.font = 'bold 11px Consolas, monospace'; X.textAlign = 'left';
  X.fillText(`${elaraNpc.name}:`, px + 10, elaraY);
  X.fillStyle = '#ccc'; X.font = 'italic 10px Consolas, monospace';
  const elaraLine = elaraNpc.lines[townData.floorCleared % elaraNpc.lines.length];
  const elaraLines = wrapText(elaraLine, pw - 20, 10);
  elaraLines.forEach((line, i) => X.fillText(line, px + 10, elaraY + 14 + i * 13));
  const talkElaraY = elaraY + 14 + elaraLines.length * 13 + 2;
  drawButton(px + 10, talkElaraY, 120, 22, 'Talk to Elara', false, '#2a2a3a', elaraNpc.color);
  if (clickedInRect(px + 10, talkElaraY, 120, 22)) {
    SFX.click(); townData.talkingToNpc = 'elara'; npcDialogueState = null;
  }

  // Reputation indicator
  X.fillStyle = repTier.color; X.font = '11px Consolas, monospace'; X.textAlign = 'center';
  X.fillText(`Reputation: ${repTier.name} — ${repTier.desc}`, cx, talkElaraY + 30);
}

function drawTownBarracks(px, py, pw, cx) {
  // Check if NPC dialogue tree is active
  if (townData.talkingToNpc === 'rolo') {
    if (drawNpcDialogueOverlay(px, py, pw, cx, 'rolo')) return;
  }
  if (townData.talkingToNpc === 'grimjaw') {
    if (drawNpcDialogueOverlay(px, py, pw, cx, 'grimjaw')) return;
  }

  X.fillStyle = '#a0a0d0';
  X.font = 'bold 14px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText('BARRACKS — RECRUIT COMPANIONS', cx, py + 18);

  const guardNpc = TOWN_NPCS[1];
  X.fillStyle = guardNpc.color;
  X.font = 'bold 12px Consolas, monospace';
  X.textAlign = 'left';
  X.fillText(`${guardNpc.name} says:`, px + 10, py + 38);
  X.fillStyle = '#ccc'; X.font = 'italic 11px Consolas, monospace';
  const gl = guardNpc.lines[townData.floorCleared % guardNpc.lines.length];
  const gLines = wrapText(gl, pw - 20, 11);
  gLines.forEach((line, i) => X.fillText(line, px + 10, py + 52 + i * 14));

  // Talk to Rolo button
  const talkBtnY2 = py + 52 + gLines.length * 14 + 2;
  drawButton(px + 10, talkBtnY2, 120, 22, 'Talk to Rolo', false, '#2a2a3a', guardNpc.color);
  if (clickedInRect(px + 10, talkBtnY2, 120, 22)) {
    SFX.click(); townData.talkingToNpc = 'rolo'; npcDialogueState = null;
  }

  const cardY = talkBtnY2 + 28;
  const squadFull = (player.squad || []).length >= 4;

  // Show available companions not already in squad
  const available = COMPANION_POOL.filter(c => !(player.squad || []).some(s => s.name === c.name));
  if (available.length === 0) {
    X.fillStyle = '#888'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('All available companions are already in your party!', cx, cardY + 20);
  } else if (squadFull) {
    X.fillStyle = '#ff8800'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('Party is full (4/4). Dismiss a member first.', cx, cardY + 20);
  } else {
    available.slice(0, 3).forEach((npc, i) => {
      const cy = cardY + i * 54;
      X.fillStyle = '#222233';
      X.fillRect(px + 5, cy, pw - 10, 50);
      X.strokeStyle = npc.color; X.lineWidth = 1;
      X.strokeRect(px + 5, cy, pw - 10, 50);
      X.fillStyle = npc.color; X.beginPath(); X.arc(px + 22, cy + 25, 14, 0, Math.PI * 2); X.fill();
      X.fillStyle = '#fff'; X.font = 'bold 10px Consolas, monospace'; X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(npc.symbol, px + 22, cy + 26);
      X.textAlign = 'left'; X.textBaseline = 'alphabetic';
      X.fillStyle = '#fff'; X.font = 'bold 11px Consolas, monospace';
      X.fillText(`${npc.name} (${npc.class})`, px + 40, cy + 17);
      X.fillStyle = '#888'; X.font = '9px Consolas, monospace';
      const short = npc.personality.length > 55 ? npc.personality.substr(0,52)+'...' : npc.personality;
      X.fillText(short, px + 40, cy + 30);
      X.fillStyle = '#aaa'; X.font = '9px Consolas, monospace';
      X.fillText(`HP:${npc.hp} AC:${npc.ac} | ${npc.attacks[0].name}`, px + 40, cy + 43);

      drawButton(px + pw - 70, cy + 12, 60, 26, 'Recruit', false, '#2a4a2a');
      if (clickedInRect(px + pw - 70, cy + 12, 60, 26) && !squadFull) {
        SFX.click();
        const newComp = deepClone(npc);
        newComp.backstoryUnlocked = false; newComp.specialAbilityUsed = false;
        player.squad = player.squad || [];
        player.squad.push(newComp);
        dungeonMessage = `${npc.name} joins your squad!`;
        dungeonMessageTimer = 2;
        addFloatingText(canvasW/2, canvasH/2, `+${npc.name}`, npc.color);
      }
    });
  }

  // Weaponsmith Grimjaw (secondary NPC in barracks)
  const gjY = cardY + (available.length > 0 && !squadFull ? Math.min(available.length, 3) * 54 + 8 : 40);
  const gjNpc = TOWN_NPCS[5];
  X.fillStyle = gjNpc.color; X.font = 'bold 11px Consolas, monospace'; X.textAlign = 'left';
  X.fillText(`${gjNpc.name}:`, px + 10, gjY);
  X.fillStyle = '#ccc'; X.font = 'italic 10px Consolas, monospace';
  const gjLine = gjNpc.lines[townData.floorCleared % gjNpc.lines.length];
  const gjLines = wrapText(gjLine, pw - 20, 10);
  gjLines.forEach((line, i) => X.fillText(line, px + 10, gjY + 14 + i * 13));
  const talkGjY = gjY + 14 + gjLines.length * 13 + 2;
  drawButton(px + 10, talkGjY, 140, 22, 'Talk to Grimjaw', false, '#2a2a3a', gjNpc.color);
  if (clickedInRect(px + 10, talkGjY, 140, 22)) {
    SFX.click(); townData.talkingToNpc = 'grimjaw'; npcDialogueState = null;
  }

  X.fillStyle = '#888'; X.font = '10px Consolas, monospace'; X.textAlign = 'center';
  X.fillText(`Squad: ${(player.squad||[]).length}/4`, cx, talkGjY + 30);
}

function drawTownCampfire(px, py, pw, cx) {
  // Check if NPC dialogue tree is active
  if (townData.talkingToNpc === 'verendis') {
    if (drawNpcDialogueOverlay(px, py, pw, cx, 'verendis')) return;
  }

  X.fillStyle = '#ff8833';
  X.font = 'bold 14px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText('CAMPFIRE — PARTY CONVERSATIONS', cx, py + 18);

  // Animated fire particles
  if (Math.random() < 0.4) {
    spawnParticles(cx, py + 60, '#ff6600', 2);
    spawnParticles(cx, py + 60, '#ffaa00', 1);
  }

  const sage = TOWN_NPCS[2];
  X.fillStyle = sage.color; X.font = 'bold 11px Consolas, monospace'; X.textAlign = 'left';
  X.fillText(`${sage.name} ponders nearby:`, px + 10, py + 38);
  X.fillStyle = '#ccc'; X.font = 'italic 10px Consolas, monospace';
  const sageLine = sage.lines[townData.floorCleared % sage.lines.length];
  const sageLines = wrapText(sageLine, pw - 20, 10);
  sageLines.forEach((line, i) => X.fillText(line, px + 10, py + 51 + i * 13));

  // Talk to Verendis button
  const talkSageY = py + 51 + sageLines.length * 13 + 2;
  drawButton(px + 10, talkSageY, 130, 22, 'Talk to Verendis', false, '#2a2a3a', sage.color);
  if (clickedInRect(px + 10, talkSageY, 130, 22)) {
    SFX.click(); townData.talkingToNpc = 'verendis'; npcDialogueState = null;
  }

  // Lorekeeper Thessa
  const thessa = TOWN_NPCS[6];
  const thY = talkSageY + 28;
  X.fillStyle = thessa.color; X.font = 'bold 11px Consolas, monospace'; X.textAlign = 'left';
  X.fillText(`${thessa.name}:`, px + 10, thY);
  X.fillStyle = '#ccc'; X.font = 'italic 10px Consolas, monospace';
  const thLine = thessa.lines[townData.floorCleared % thessa.lines.length];
  const thLines = wrapText(thLine, pw - 20, 10);
  thLines.forEach((line, i) => X.fillText(line, px + 10, thY + 14 + i * 13));
  const talkThY = thY + 14 + thLines.length * 13 + 2;
  drawButton(px + 10, talkThY, 130, 22, 'Talk to Thessa', false, '#2a2a3a', thessa.color);
  if (clickedInRect(px + 10, talkThY, 130, 22)) {
    SFX.click(); townData.talkingToNpc = 'thessa'; npcDialogueState = null;
  }

  const actY = talkThY + 28;

  // Show pending companion conflict mediation
  if (pendingConflict && player.squad && player.squad.length >= 2) {
    const pc = pendingConflict;
    const nameA = pc.compA.name.split(' ')[0];
    const nameB = pc.compB.name.split(' ')[0];

    X.fillStyle = '#ff6644'; X.font = 'bold 12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('COMPANION CONFLICT', cx, actY);

    X.fillStyle = '#ffaa44'; X.font = 'italic 11px Consolas, monospace';
    const trigLines = wrapText(pc.conflict.trigger, pw - 20, 11);
    trigLines.forEach((line, i) => X.fillText(line, cx, actY + 18 + i * 14));

    const choiceY = actY + 18 + trigLines.length * 14 + 10;

    // Side A
    X.fillStyle = pc.compA.color; X.font = 'bold 11px Consolas, monospace'; X.textAlign = 'left';
    X.fillText(`${nameA}:`, px + 10, choiceY);
    X.fillStyle = '#ccc'; X.font = '10px Consolas, monospace';
    const aLines = wrapText(`"${pc.conflict.sideA.stance}"`, pw - 80, 10);
    aLines.forEach((line, i) => X.fillText(line, px + 10, choiceY + 14 + i * 13));

    const sideABtnY = choiceY + 14 + aLines.length * 13 + 4;
    drawButton(px + 10, sideABtnY, pw/2 - 20, 28, `Side with ${nameA}`, false, '#2a3a1a', pc.compA.color);

    // Side B
    const sideBStartY = sideABtnY + 36;
    X.fillStyle = pc.compB.color; X.font = 'bold 11px Consolas, monospace'; X.textAlign = 'left';
    X.fillText(`${nameB}:`, px + 10, sideBStartY);
    X.fillStyle = '#ccc'; X.font = '10px Consolas, monospace';
    const bLines = wrapText(`"${pc.conflict.sideB.stance}"`, pw - 80, 10);
    bLines.forEach((line, i) => X.fillText(line, px + 10, sideBStartY + 14 + i * 13));

    const sideBBtnY = sideBStartY + 14 + bLines.length * 13 + 4;
    drawButton(px + pw/2 + 10, sideABtnY, pw/2 - 20, 28, `Side with ${nameB}`, false, '#3a1a1a', pc.compB.color);

    // Compromise
    const compY = sideBBtnY + 6;
    X.fillStyle = '#aaa'; X.font = 'italic 10px Consolas, monospace'; X.textAlign = 'center';
    const cLines = wrapText(`Compromise: ${pc.conflict.compromise}`, pw - 20, 10);
    cLines.forEach((line, i) => X.fillText(line, cx, compY + i * 13));

    const compBtnY = compY + cLines.length * 13 + 4;
    drawButton(cx - 80, compBtnY, 160, 28, 'Find compromise', false, '#2a2a3a', '#ffaa44');

    // Handle clicks
    if (clickedInRect(px + 10, sideABtnY, pw/2 - 20, 28)) {
      SFX.click(); resolveConflict('sideA');
    }
    if (clickedInRect(px + pw/2 + 10, sideABtnY, pw/2 - 20, 28)) {
      SFX.click(); resolveConflict('sideB');
    }
    if (clickedInRect(cx - 80, compBtnY, 160, 28)) {
      SFX.click(); resolveConflict('compromise');
    }
    return;
  }

  if (!player.squad || player.squad.length === 0) {
    X.fillStyle = '#555'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('No companions to talk to.', cx, actY + 20);
    return;
  }

  // Show companion conversations/backstories
  X.fillStyle = '#ffd700'; X.font = 'bold 12px Consolas, monospace'; X.textAlign = 'center';
  X.fillText('Companion conversations:', cx, actY);

  const compBtnW = isMobile ? 160 : 200, compBtnH = 32;
  player.squad.forEach((comp, i) => {
    const by2 = actY + 14 + i * (compBtnH + 6);
    const hasBackstory = comp.backstoryUnlocked || comp.loyalty >= 80;
    const canRomance = comp.romanceable && comp.loyalty >= 90 && player.romanced !== comp.name && !player.romanced;
    const label = canRomance ? `♥ ${comp.name.split(' ')[0]}` : hasBackstory ? `★ ${comp.name.split(' ')[0]}` : comp.name.split(' ')[0];
    const color = canRomance ? '#4a1a2a' : hasBackstory ? '#2a3a1a' : '#1a1a2a';
    drawButton(cx - compBtnW/2, by2, compBtnW, compBtnH, label, false, color, canRomance ? '#ff88aa' : hasBackstory ? '#aaffaa' : '#aaa');
    if (clickedInRect(cx - compBtnW/2, by2, compBtnW, compBtnH)) {
      SFX.click();
      campfireCompanion = comp;
      campfireScene = { stage: canRomance ? 'romance_intro' : hasBackstory ? 'backstory' : 'chat', choiceIdx: 0, romanceChosen: false };
      gameState = STATE.CAMPFIRE;
    }
  });
}

// ============================================================
// CAMPFIRE SCENE SCREEN
// ============================================================
function updateCampfire() {
  X.fillStyle = '#0a0608';
  X.fillRect(0, 0, canvasW, canvasH);

  if (!campfireCompanion || !campfireScene) { gameState = STATE.TOWN; return; }

  const comp = campfireCompanion;
  const cx = canvasW / 2;

  // Firelight glow
  const t = gameTime * 2;
  const grad = X.createRadialGradient(cx, canvasH * 0.5, 10, cx, canvasH * 0.5, 200);
  grad.addColorStop(0, `rgba(255,120,20,${0.15 + Math.sin(t) * 0.05})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  X.fillStyle = grad; X.fillRect(0, 0, canvasW, canvasH);

  // Fire particles
  if (Math.random() < 0.3) spawnParticles(cx, canvasH * 0.5 + 30, '#ff6600', 2);

  // Companion portrait
  X.fillStyle = comp.color + '30';
  X.beginPath(); X.arc(cx, canvasH * 0.2, 55, 0, Math.PI * 2); X.fill();
  X.fillStyle = comp.color;
  X.beginPath(); X.arc(cx, canvasH * 0.2, 42, 0, Math.PI * 2); X.fill();
  X.fillStyle = '#fff'; X.font = 'bold 26px Consolas, monospace';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(comp.symbol, cx, canvasH * 0.2 + 1);

  X.textBaseline = 'alphabetic';
  X.fillStyle = '#ffd700'; X.font = `bold ${isMobile ? 16 : 20}px Consolas, monospace`;
  X.fillText(comp.name, cx, canvasH * 0.2 + 65);

  // Loyalty display
  const loyColor = comp.loyalty >= 90 ? '#ff88aa' : comp.loyalty >= 80 ? '#ffd700' : '#44aaff';
  X.fillStyle = loyColor; X.font = '12px Consolas, monospace';
  X.fillText(`Loyalty: ${comp.loyalty}/100`, cx, canvasH * 0.2 + 82);

  // Scene content based on stage
  const panelW = Math.min(canvasW - 30, 440);
  const panelX = cx - panelW / 2;
  const textY = canvasH * 0.37;

  X.fillStyle = 'rgba(0,0,0,0.7)';
  X.fillRect(panelX, textY - 10, panelW, canvasH * 0.45);
  X.strokeStyle = comp.color + '88'; X.lineWidth = 1;
  X.strokeRect(panelX, textY - 10, panelW, canvasH * 0.45);

  if (campfireScene.stage === 'chat') {
    // Generic chat based on loyalty
    const chatLines = getChatLines(comp);
    X.fillStyle = '#ccc'; X.font = `italic ${isMobile ? 12 : 13}px Consolas, monospace`;
    X.textAlign = 'center';
    chatLines.forEach((line, i) => {
      const lns = wrapText(line, panelW - 20, isMobile ? 12 : 13);
      lns.forEach((l, j) => X.fillText(l, cx, textY + 10 + (campfireScene._lineOffset || 0) + (i * 50 + j) * 16));
    });

    drawButton(cx - 60, canvasH - 70, 120, 36, 'Done', false, '#333');
    if (clickedInRect(cx - 60, canvasH - 70, 120, 36)) {
      SFX.click(); comp.loyalty = Math.min(100, comp.loyalty + 1);
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }

  } else if (campfireScene.stage === 'backstory') {
    X.fillStyle = comp.color; X.font = 'bold 13px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('PERSONAL STORY', cx, textY + 8);
    X.fillStyle = '#ddd'; X.font = `${isMobile ? 11 : 13}px Consolas, monospace`;
    const bLines = wrapText(comp.backstory || '"I have nothing more to say."', panelW - 20, isMobile ? 11 : 13);
    bLines.forEach((line, i) => X.fillText(line, cx, textY + 30 + i * 17));

    X.fillStyle = '#aaa'; X.font = '11px Consolas, monospace';
    X.fillText(`(Loyalty increases from hearing this)`, cx, textY + 30 + bLines.length * 17 + 14);

    drawButton(cx - 60, canvasH - 70, 120, 36, 'Thank them', false, '#2a3a2a');
    if (clickedInRect(cx - 60, canvasH - 70, 120, 36)) {
      SFX.click(); comp.loyalty = Math.min(100, comp.loyalty + 3);
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }

  } else if (campfireScene.stage === 'romance_intro') {
    X.fillStyle = '#ff88aa'; X.font = 'bold 13px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('A PRIVATE MOMENT', cx, textY + 8);

    const romanceIntros = {
      'Elara the Swift': '"You know... I don\'t usually trust people. Especially people who drag me into cursed dungeons. But here we are. And I\'m not... unhappy about it."',
      'Lyra Starweave': '"I\'ve been cataloguing everything on this expedition. The ruins, the monsters, the spells. But I keep finding myself adding notes about... you. Strange. Very unscientific."',
      'Seraphina': '"My oath says nothing about this. My heart, however, has been rather loud lately. I have tried to ignore it. I find I cannot."',
    };

    const intro = romanceIntros[comp.name] || '"There is something I have been meaning to say..."';
    X.fillStyle = '#ddd'; X.font = `italic ${isMobile ? 12 : 13}px Consolas, monospace`;
    const rLines = wrapText(intro, panelW - 20, isMobile ? 12 : 13);
    rLines.forEach((line, i) => X.fillText(line, cx, textY + 30 + i * 17));

    const choiceY = textY + 30 + rLines.length * 17 + 20;
    const btnW2 = 160, btnH2 = 34;
    drawButton(cx - btnW2 - 6, choiceY, btnW2, btnH2, 'I feel the same.', false, '#2a1a3a', '#ff88aa');
    drawButton(cx + 6, choiceY, btnW2, btnH2, 'We should focus.', false, '#333');

    if (clickedInRect(cx - btnW2 - 6, choiceY, btnW2, btnH2)) {
      SFX.heal();
      campfireScene.stage = 'romance_accepted';
    }
    if (clickedInRect(cx + 6, choiceY, btnW2, btnH2)) {
      SFX.click();
      comp.loyalty = Math.max(0, comp.loyalty - 2);
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }

  } else if (campfireScene.stage === 'romance_accepted') {
    X.fillStyle = '#ff88aa'; X.font = 'bold 13px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('♥ ROMANCE KINDLED ♥', cx, textY + 8);

    const romanceAccepts = {
      'Elara the Swift': '"Well. Don\'t make it weird. But... good. That\'s good. I have your back. Always have."',
      'Lyra Starweave': '"Oh! That is — I will need to update my notes significantly. This is wonderful. You are wonderful."',
      'Seraphina': '"Then by my oath and my heart both — I will not let harm come to you. Not while I stand."',
    };

    const acc = romanceAccepts[comp.name] || '"I am glad."';
    X.fillStyle = '#ddd'; X.font = `italic ${isMobile ? 12 : 13}px Consolas, monospace`;
    const aLines = wrapText(acc, panelW - 20, isMobile ? 12 : 13);
    aLines.forEach((line, i) => X.fillText(line, cx, textY + 30 + i * 17));

    X.fillStyle = '#ffaacc'; X.font = '12px Consolas, monospace';
    X.fillText("Beloved's Shield: +1 AC while they are in your party.", cx, textY + 30 + aLines.length * 17 + 18);

    drawButton(cx - 70, canvasH - 70, 140, 36, 'Continue', false, '#2a1a3a');
    if (clickedInRect(cx - 70, canvasH - 70, 140, 36)) {
      SFX.levelUp();
      player.romanced = comp.name;
      player.belovedShield = true;
      comp.loyalty = Math.min(100, comp.loyalty + 5);
      addFloatingText(canvasW/2, canvasH/2, '♥ ROMANCED ♥', '#ff88aa');
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }
  }

  renderParticles();
}

function getChatLines(comp) {
  if (comp.loyalty >= 80) {
    return [comp.opinions?.bossComment || '"Ready for whatever comes next."',
            '"I trust you. Don\'t make me regret it."'];
  } else if (comp.loyalty >= 50) {
    return [`"${comp.name.split(' ')[0]}... this dungeon is something else."`,
            '"Staying alive. That\'s the plan."'];
  } else if (comp.loyalty <= 30) {
    return ['"I\'m not sure about this anymore."',
            '"We should talk about whether I\'m staying."'];
  }
  return ['"Another floor down. Onward."',
          comp.opinions?.treasureComment || '"We press on."'];
}

// Patch calcAC to include beloved's shield
const _origCalcAC = calcAC;
function calcAC() {
  let ac = _origCalcAC();
  if (player && player.belovedShield && player.romanced) {
    const belovedInParty = (player.squad || []).some(c => c.name === player.romanced && c.hp > 0);
    if (belovedInParty) ac += 1;
  }
  return ac;
}

function getFactionRankName(factionId, rankIdx) {
  const f = FACTIONS[factionId];
  if (!f) return 'Outsider';
  return f.rankTitles[clamp(rankIdx, 0, 4)];

// Get display name for current faction
function getPlayerFactionDisplay() {
  if (!playerFaction) return warState === WAR_STATE.FREELANCER ? 'Freelancer' : 'None';
  const f = FACTIONS[playerFaction];
  return f ? f.name : 'Unknown';
}

// Change faction reputation
function changeFactionRep(factionId, amount, reason) {
  if (!factionReps[factionId] === undefined) return;
  const old = factionReps[factionId];
  factionReps[factionId] = clamp((factionReps[factionId] || 0) + amount, -100, 100);
  const newVal = factionReps[factionId];
  if (newVal !== old) {
    const sign = amount > 0 ? '+' : '';
    const f = FACTIONS[factionId];
    addFloatingText(canvasW/2, canvasH/2 - 80, `${f ? f.shortName : factionId}: ${sign}${amount}`, f ? f.color : '#aaa');
  }
  // Update rank based on rep
  updateFactionRank(factionId);
}

function updateFactionRank(factionId) {
  const rep = factionReps[factionId] || 0;
  let rank = 0;
  if (rep >= 80) rank = 4;
  else if (rep >= 50) rank = 3;
  else if (rep >= 25) rank = 2;
  else if (rep >= 0) rank = 1;
  else rank = 0;
  factionRanks[factionId] = rank;
}

// Initialize faction reps based on overall reputation when war arc starts
function initFactionRepsFromOverallRep() {
  const rep = player ? player.reputation : 0;
  // Starting faction reps influenced by overall reputation
  const baseRep = Math.floor(rep / 5); // overall rep / 5 as starting boost
  factionReps.iron_legion = clamp(baseRep + (player?.class === 'Fighter' || player?.class === 'Paladin' || player?.class === 'Barbarian' ? 10 : 0), -20, 20);
  factionReps.shadow_syndicate = clamp(baseRep + (player?.class === 'Rogue' ? 10 : 0), -20, 20);
  factionReps.arcane_conclave = clamp(baseRep + (player?.class === 'Wizard' || player?.class === 'Sorcerer' || player?.class === 'Warlock' ? 10 : 0), -20, 20);
  factionReps.merchant_coalition = clamp(baseRep + (player?.gold >= 100 ? 10 : 0), -20, 20);
  Object.keys(factionReps).forEach(k => updateFactionRank(k));
}

// Trigger the war arc after floor 3
function triggerWarArc() {
  if (warState !== WAR_STATE.INACTIVE) return;
  warState = WAR_STATE.TRIGGERED;
  initFactionRepsFromOverallRep();
  // Show notification
  dungeonMessage = 'The war arc begins. Factions await in Hearthrest.';
  dungeonMessageTimer = 3;
  addFloatingText(canvasW/2, canvasH/2 - 50, '*** WAR ARC BEGINS ***', '#ffd700');
}

// Apply companion reactions to faction joining
function applyCompanionFactionReactions(factionId) {
  if (!player || !player.squad) return;
  player.squad.forEach(comp => {
    const shortName = getCompShortName(comp.name);
    const opinions = COMPANION_FACTION_OPINIONS[comp.name];
    if (!opinions) return;
    const opinion = opinions[factionId];
    if (!opinion) return;

    const delta = opinion.loyaltyDelta || 0;
    const oldLoy = comp.loyalty;
    comp.loyalty = clamp(comp.loyalty + delta, 0, 100);

    // Show reaction
    setTimeout(() => {
      addFloatingText(canvasW/2 + rand(-80,80), canvasH/2 - 60 - rand(0,40),
        `${comp.name.split(' ')[0]}: "${opinion.reason.slice(1, 60)}..."`,
        delta > 0 ? '#44ff88' : delta < 0 ? '#ff6644' : '#aaa'
      );
    }, rand(200, 800));

    // Companions with hostile opinion and major negative delta may leave
    if (comp.loyalty <= 10 && oldLoy > 10) {
      setTimeout(() => {
        dungeonMessage = `${comp.name} refuses to follow your faction choice and leaves!`;
        dungeonMessageTimer = 4;
        if (player.squad) player.squad = player.squad.filter(c => c.name !== comp.name);
      }, 1200);
    } else if (comp.loyalty <= 20 && oldLoy > 20) {
      setTimeout(() => {
        dungeonMessage = `${comp.name}: "I have serious reservations about this..."`;
        dungeonMessageTimer = 3;
      }, 1200);
    }
  });
}

// Join a faction
function joinFaction(factionId) {
  if (playerFaction && playerFaction !== factionId) {
    // Defecting
    defectFromFaction();
  }
  playerFaction = factionId;
  warState = factionId;
  factionReps[factionId] = Math.max(factionReps[factionId] || 0, 10); // minimum rep to be a member
  updateFactionRank(factionId);
  applyCompanionFactionReactions(factionId);

  // Hostile factions take notice
  Object.keys(FACTIONS).forEach(fid => {
    if (FACTIONS[fid].hatesFactionsOf?.includes(factionId)) {
      changeFactionRep(fid, -20, 'Enemy Faction Joined');
    }
  });

  const f = FACTIONS[factionId];
  addFloatingText(canvasW/2, canvasH/2 - 30, `Joined: ${f.name}!`, f.color);
  SFX.levelUp();
}

// Choose freelancer path
function chooseFreelanancerPath() {
  playerFaction = null;
  warState = WAR_STATE.FREELANCER;
  applyCompanionFactionReactions('freelancer');
  addFloatingText(canvasW/2, canvasH/2 - 30, 'Freelancer Path!', '#ffd700');
  SFX.click();
}

// Defect from current faction
function defectFromFaction() {
  if (!playerFaction) return;
  const oldFaction = playerFaction;
  const oldRank = getPlayerFactionRank();

  // Rep crash with old faction
  factionReps[oldFaction] = clamp((factionReps[oldFaction] || 0) - 60, -100, 0);
  updateFactionRank(oldFaction);

  // Trigger assassins based on old rank
  assassinsActive = true;
  if (oldRank >= 4) assassinTier = 'commander';
  else if (oldRank >= 3) assassinTier = 'officer';
  else assassinTier = 'initiate';

  defectionPending = true;
  const f = FACTIONS[oldFaction];
  dungeonMessage = `You have betrayed the ${f.name}! Assassins have been dispatched.`;
  dungeonMessageTimer = 4;
  addFloatingText(canvasW/2, canvasH/2 - 40, 'DEFECTOR!', '#ff4444');
  SFX.trap();
}

// Check if an assassin encounter should trigger
function checkAssassinEncounter() {
  if (!assassinsActive) return false;
  // Random chance per room entered (post-defection)
  return Math.random() < 0.25;
}

// Spawn assassin encounter in a room
function spawnAssassinEncounter(room) {
  if (!assassinsActive || !playerFaction) return;
  const oldFaction = warState === WAR_STATE.DEFECTED ? playerFaction : null;
  const sourceFaction = defectionPending ? playerFaction : null;
  if (!sourceFaction) return;

  const templates = ASSASSIN_TEMPLATES[sourceFaction];
  if (!templates) return;
  const template = templates[assassinTier];
  if (!template) return;

  const assassin = {
    ...deepClone(template),
    maxHp: template.hp,
    hp: template.hp,
    id: Math.random().toString(36).substr(2, 9),
    conditions: [],
    px: room.cx, py: room.cy,
    isAssassin: true,
    fromFaction: sourceFaction,
  };

  room.enemies = [assassin];
  room.type = ROOM_TYPE.COMBAT;
  room.cleared = false;
  room.isAssassinAmbush = true;
}

// Start a faction quest
function startFactionQuest(factionId, questIndex) {
  const quests = FACTION_QUESTS[factionId];
  if (!quests || questIndex >= quests.length) return;
  const quest = quests[questIndex];
  activeFactionQuest = {
    factionId,
    questIndex,
    questData: quest,
    stage: 'active',
    skillRoll: null,
  };
  dungeonMessage = `New quest: ${quest.title}`;
  dungeonMessageTimer = 2.5;
  SFX.click();
}

// Complete active faction quest
function completeFactionQuest() {
  if (!activeFactionQuest) return;
  const { factionId, questData } = activeFactionQuest;
  completedFactionQuests.push(questData.id);
  changeFactionRep(factionId, questData.reward.rep || 15, 'Quest Complete');
  player.gold += questData.reward.gold || 50;
  if (questData.reward.item) {
    const item = generateTreasureItem(currentFloor);
    item.rarity = RARITY.UNCOMMON;
    player.inventory.push(item);
    addFloatingText(canvasW/2, canvasH/2 - 20, `+${item.name}`, RARITY_COLORS[item.rarity]);
  }
  addFloatingText(canvasW/2, canvasH/2, `Quest Complete! +${questData.reward.gold}g`, '#ffd700');
  activeFactionQuest = null;
  SFX.chest();
}

// Get available quests for player's faction
function getAvailableFactionQuests(factionId) {
  const quests = FACTION_QUESTS[factionId];
  if (!quests) return [];
  return quests.filter(q => {
    if (completedFactionQuests.includes(q.id)) return false;
    if (activeFactionQuest && activeFactionQuest.questData.id === q.id) return false;
    return true;
  });
}

// Get war state for final boss selection on Floor 5
function getWarFloor5Boss() {
  // Default boss name
  if (warState === WAR_STATE.INACTIVE || warState === WAR_STATE.TRIGGERED) return 'Ancient Wyrm';

  if (warState === WAR_STATE.FREELANCER) return 'Ancient Wyrm'; // No faction influence

  // Faction-specific boss name and data
  const factionBosses = {
    iron_legion: 'Legion Warlord Malgrim',
    shadow_syndicate: 'Syndicate Grandmaster',
    arcane_conclave: 'Rogue Archmage',
    merchant_coalition: 'Coalition War-Director',
  };
  // If player betrayed a faction, the old faction sends their best
  if (assassinsActive && assassinTier === 'commander') {
    const oldFaction = Object.keys(FACTIONS).find(f => factionReps[f] <= -60);
    if (oldFaction && factionBosses[oldFaction]) return `${factionBosses[oldFaction]} (Betrayed)`;
  }
  return factionBosses[playerFaction] || 'Ancient Wyrm';
}

  selectedFaction: null,
};

      'Four factions have been watching your progress through the dungeon.',

      'and change who waits for you at the deepest floor.',
      '',

      SFX.levelUp();
      joinFaction(warChoiceState.selectedFaction);
      warState = warChoiceState.selectedFaction;
      warChoiceState.phase = 'intro';

    X.fillStyle = '#ffd700';
    X.font = `bold ${isMobile ? 22 : 28}px Consolas, monospace`;
    X.textAlign = 'center';
    X.fillText('WALK ALONE', cx, 60);

    X.fillStyle = '#ccc';
    X.font = `${isMobile ? 12 : 14}px Consolas, monospace`;
    const flLines = [
      'The freelancer path offers no faction support, no quests,',
      'and no safe harbor. All factions remain neutral — for now.',

// ============================================================
// GUILD QUEST COMPLETION CHECK
// ============================================================
function checkGuildQuestCompletion() {
  if (!activeGuildQuest) return;
  const q = activeGuildQuest.questData;
  const t = guildQuestTracking;
  let complete = false;

  switch (q.type) {
    case 'combat_streak': complete = t.combatStreak >= q.target; break;
    case 'fast_boss': complete = t.bossRounds > 0 && t.bossRounds <= q.target; break;
    case 'low_damage': complete = false; break; // checked at floor end
    case 'find_magic': complete = t.magicFound >= q.target; break;
    case 'cast_spells': complete = t.spellsCast >= q.target; break;
    case 'reach_floor': complete = currentFloor >= q.target; break;
    case 'avoid_enemies': complete = t.enemiesAvoided >= q.target; break;
    case 'disarm_traps': complete = t.trapsDisarmed >= q.target; break;
    case 'steal_shop': complete = false; break; // special
    case 'protect_allies': complete = !t.companionsDied && t.combatStreak >= 3; break;
    case 'kill_undead': complete = t.undeadKilled >= q.target; break;
    case 'perfect_boss': complete = t.bossRounds > 0 && !t.companionsDied; break;
  }

  if (complete) {
    player.gold += q.reward.gold;
    guildRep[q.guild] = (guildRep[q.guild] || 0) + q.reward.rep;
    completedGuildQuests.push(q.title);
    addFloatingText(canvasW/2, canvasH/2 - 80, `Guild Quest Complete: ${q.title}!`, '#ffd700');
    addFloatingText(canvasW/2, canvasH/2 - 56, `+${q.reward.gold}g, +${q.reward.rep} guild rep`, '#44ff44');
    activeGuildQuest = null;
    saveGame();
  }
}

// ============================================================
// SIDE QUEST BOARD — TOWN SECTION
// ============================================================
function getAvailableSideQuests() {
  const seed = (townData?.floorCleared || 0) + sideQuestBoardSeed;
  return SIDE_QUESTS.filter(q =>
    !completedSideQuests.includes(q.id) &&
    !activeSideQuests.some(a => a.questData.id === q.id) &&
    q.difficulty <= (townData?.floorCleared || 0) + 2
  ).sort((a, b) => {
    const hashA = (a.id.charCodeAt(3) * 31 + seed) % 100;
    const hashB = (b.id.charCodeAt(3) * 31 + seed) % 100;
    return hashA - hashB;
  }).slice(0, 3);
}

function resolveSideQuest(quest) {
  // Resolution based on quest type — uses dice rolls + stats
  const types = {
    escort: { stat: 'CON', dc: 10 + quest.difficulty * 2 },
    fetch: { stat: 'INT', dc: 9 + quest.difficulty * 2 },
    investigate: { stat: 'WIS', dc: 11 + quest.difficulty * 2 },
    rescue: { stat: 'STR', dc: 10 + quest.difficulty * 2 },
    explore: { stat: 'INT', dc: 10 + quest.difficulty * 2 },
    race: { stat: 'DEX', dc: 12 + quest.difficulty * 2 },
  };
  const check = types[quest.type] || { stat: 'STR', dc: 12 };
  const result = dialogueCheck(check.stat, check.dc);
  // Floor cleared bonus
  const floorBonus = (townData?.floorCleared || 0) >= quest.difficulty ? 2 : 0;
  result.total += floorBonus;
  result.success = result.total >= check.dc;
  return { ...result, stat: check.stat };
}

function drawNpcDialogueOverlay(px, py, pw, cx, npcId) {
  const tree = NPC_DIALOGUE_TREES[npcId];
  if (!tree) return false;

  if (!npcDialogueState || npcDialogueState.npcId !== npcId) {
    npcDialogueState = { npcId, selectedOption: -1, result: null };
  }

  const state = npcDialogueState;

  // Dark overlay
  X.fillStyle = 'rgba(0,0,0,0.85)';
  X.fillRect(px, py, pw, canvasH - py - 55);

  // NPC name
  X.fillStyle = '#ffd700'; X.font = 'bold 14px Consolas, monospace'; X.textAlign = 'center';
  X.fillText(tree.name, cx, py + 20);

  // Greeting or result
  X.fillStyle = '#ccc'; X.font = 'italic 11px Consolas, monospace'; X.textAlign = 'center';
  let displayText = tree.greeting;
  if (state.result) {
    displayText = state.result.text;
    X.fillStyle = state.result.success === true ? '#44ff44' : state.result.success === false ? '#ff8844' : '#ccc';
  }
  const greetLines = wrapText(displayText, pw - 30, 11);
  greetLines.forEach((line, i) => X.fillText(line, cx, py + 38 + i * 14));

  // Show result roll info
  let rollY = py + 38 + greetLines.length * 14;
  if (state.result && state.result.rollInfo) {
    X.fillStyle = state.result.success ? '#44ff44' : '#ff6644';
    X.font = '9px Consolas, monospace';
    X.fillText(state.result.rollInfo, cx, rollY + 6);
    rollY += 14;
  }

  const optStartY = rollY + 14;

  // Show dialogue options
  if (state.selectedOption === -1) {
    tree.options.forEach((opt, i) => {
      const optY = optStartY + i * 30;
      const hov = isInRect(mouseX, mouseY, px + 10, optY, pw - 20, 26);
      X.fillStyle = hov ? '#2a2a3a' : '#1a1a2a';
      X.fillRect(px + 10, optY, pw - 20, 26);
      X.strokeStyle = hov ? '#44aa88' : '#333'; X.lineWidth = 1;
      X.strokeRect(px + 10, optY, pw - 20, 26);
      X.fillStyle = opt.stat ? '#ffaa44' : '#aaa';
      X.font = '10px Consolas, monospace'; X.textAlign = 'left';
      X.fillText(`> ${opt.label}`, px + 15, optY + 16);

      if (clickedInRect(px + 10, optY, pw - 20, 26)) {
        SFX.click();
        state.selectedOption = i;

        if (opt.stat) {
          // Stat check
          const check = dialogueCheck(opt.stat, opt.dc);
          state.result = {
            text: check.success ? opt.pass : opt.fail,
            success: check.success,
            rollInfo: `${opt.stat} Check: ${check.roll}+${check.mod}=${check.total} vs DC ${opt.dc} — ${check.success ? 'SUCCESS' : 'FAIL'}`
          };
          // Apply rewards on success
          if (check.success && opt.passReward) {
            if (opt.passReward.gold) { player.gold += opt.passReward.gold; addFloatingText(canvasW/2, canvasH/2, `+${opt.passReward.gold} gold`, '#ffd700'); }
            if (opt.passReward.tempHp) { player.hp = Math.min(player.maxHp + opt.passReward.tempHp, player.hp + opt.passReward.tempHp); addFloatingText(canvasW/2, canvasH/2, `+${opt.passReward.tempHp} temp HP`, '#44ff44'); }
            if (opt.passReward.flag) { npcFlags[opt.passReward.flag] = true; }
            if (opt.passReward.rep) { player.reputation = (player.reputation || 0) + opt.passReward.rep; }
          }
        } else if (opt.cost) {
          // Gold cost option
          if (player.gold >= opt.cost) {
            player.gold -= opt.cost;
            state.result = { text: opt.pass, success: true, rollInfo: `-${opt.cost} gold` };
            if (opt.passReward && opt.passReward.flag) { npcFlags[opt.passReward.flag] = true; }
          } else {
            state.result = { text: opt.fail, success: false, rollInfo: 'Not enough gold' };
          }
        } else {
          // Simple response
          state.result = { text: opt.response, success: null };
        }
      }
    });
  }

  // Back button
  const backY = py + (canvasH - py - 55) - 30;
  drawButton(cx - 50, backY, 100, 24, 'Back', false, '#333');
  if (clickedInRect(cx - 50, backY, 100, 24)) {
    SFX.click();
    npcDialogueState = null;
    townData.talkingToNpc = null;
  }

  // "Ask something else" button (after seeing a response)
  if (state.selectedOption >= 0) {
    drawButton(cx - 70, backY - 30, 140, 24, 'Ask something else', false, '#2a2a3a');
    if (clickedInRect(cx - 70, backY - 30, 140, 24)) {
      SFX.click();
      state.selectedOption = -1;
      state.result = null;
    }
  }

  return true;
}

// ============================================================
// WAR ARC — TOWN FACTION SECTION
// ============================================================
function drawTownFactions(px, py, pw, cx) {
  const faction = playerFaction ? FACTIONS[playerFaction] : null;
  const titleColor = faction ? faction.color : '#ffd700';
  const titleText = faction ? `${faction.name.toUpperCase()} — FACTION HQ` : 'FACTION HEADQUARTERS';

  X.fillStyle = titleColor;
  X.font = 'bold 14px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText(titleText, cx, py + 18);

  if (!playerFaction) {
    // No faction — show all reps
    if (warState === WAR_STATE.FREELANCER) {
      X.fillStyle = '#ffd700';
      X.font = '13px Consolas, monospace';
      X.fillText('You walk the Freelancer path. No faction allegiance.', cx, py + 42);
      X.fillStyle = '#888';
      X.font = '11px Consolas, monospace';
      X.fillText('All factions are neutral toward you.', cx, py + 60);
      return;
    }
    // War arc not triggered yet or still choosing
    if (warState === WAR_STATE.INACTIVE) {
      X.fillStyle = '#888';
      X.font = '11px Consolas, monospace';
      X.fillText('Clear Floor 3 to unlock faction allegiances.', cx, py + 42);
      return;
    }
    if (warState === WAR_STATE.TRIGGERED) {
      X.fillStyle = '#ff8844';
      X.font = '12px Consolas, monospace';
      X.fillText('The factions are watching. Choose your allegiance.', cx, py + 42);
      const btnW3 = 200, btnH3 = 36;
      drawButton(cx - btnW3/2, py + 58, btnW3, btnH3, 'Choose a Faction', false, '#2a1a3a', '#ffd700');
      if (clickedInRect(cx - btnW3/2, py + 58, btnW3, btnH3)) {
        SFX.click();
        warChoiceState.phase = 'intro';
        gameState = STATE.WAR_CHOICE;
      }
      return;
    }
  }

  // Show faction rep display
  const factionList = Object.values(FACTIONS);
  const repY = py + 32;
  factionList.forEach((f, i) => {
    const fy = repY + i * 22;
    const rep = factionReps[f.id] || 0;
    const rank = factionRanks[f.id] || 0;
    const isMine = f.id === playerFaction;

    X.fillStyle = isMine ? f.color : '#666';
    X.font = `${isMine ? 'bold ' : ''}${isMobile ? 10 : 11}px Consolas, monospace`;
    X.textAlign = 'left';
    X.fillText(`${isMine ? '► ' : '  '}${f.shortName}: ${getFactionRankName(f.id, rank)} (${rep >= 0 ? '+' : ''}${rep})`, px + 10, fy);
  });

  if (!faction) return;

  const actY = repY + factionList.length * 22 + 8;

  // Representative dialogue
  X.fillStyle = faction.color;
  X.font = 'bold 11px Consolas, monospace';
  X.textAlign = 'left';
  X.fillText(`${faction.representativeName}:`, px + 10, actY);

  // Rank status
  const myRank = getPlayerFactionRank();
  const rankName = getFactionRankName(playerFaction, myRank);
  X.fillStyle = '#aaa';
  X.font = '11px Consolas, monospace';
  X.fillText(`Your rank: ${rankName} | Rep: ${factionReps[playerFaction]}`, px + 10, actY + 15);

  // Active quest status
  if (activeFactionQuest && activeFactionQuest.factionId === playerFaction) {
    X.fillStyle = '#ffaa44';
    X.font = 'bold 11px Consolas, monospace';
    X.fillText(`Active Quest: ${activeFactionQuest.questData.title}`, px + 10, actY + 30);
    X.fillStyle = '#888';
    X.font = '10px Consolas, monospace';
    X.fillText(activeFactionQuest.questData.desc, px + 10, actY + 43);
    // Complete quest button (skill quests auto-resolve, others require dungeon action)
    if (activeFactionQuest.questData.type === 'skill') {
      const questBtnW = 130, questBtnH = 28;
      drawButton(cx - questBtnW/2, actY + 55, questBtnW, questBtnH, 'Attempt Quest', false, '#2a3a1a');
      if (clickedInRect(cx - questBtnW/2, actY + 55, questBtnW, questBtnH)) {
        SFX.click();
        const q = activeFactionQuest.questData;
        const stat = q.skillStat || 'DEX';
        const dc = q.skillDC || 14;
        const roll = d20();
        const bonus = mod(player.stats[stat]) + PROF_BONUS[player.level];
        const total = roll + bonus;
        if (total >= dc) {
          addFloatingText(canvasW/2, canvasH/2 - 30, `Success! (${total} vs DC ${dc})`, '#44ff44');
          completeFactionQuest();
        } else {
          addFloatingText(canvasW/2, canvasH/2 - 30, `Failed (${total} vs DC ${dc})`, '#ff4444');
          dungeonMessage = 'Quest failed. Try again later.';
          dungeonMessageTimer = 2;
          activeFactionQuest = null;
        }
      }
    } else {
      X.fillStyle = '#888';
      X.font = '10px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('Complete in the dungeon. Return to collect reward.', cx, actY + 60);
      // Check if quest was completed in dungeon
      if (activeFactionQuest.stage === 'dungeonComplete') {
        const cmpBtnW = 130, cmpBtnH = 28;
        drawButton(cx - cmpBtnW/2, actY + 72, cmpBtnW, cmpBtnH, 'Collect Reward', false, '#2a4a2a');
        if (clickedInRect(cx - cmpBtnW/2, actY + 72, cmpBtnW, cmpBtnH)) {
          SFX.click();
          completeFactionQuest();
        }
      }
    }
  } else {
    // Show available quests
    const available = getAvailableFactionQuests(playerFaction);
    if (available.length === 0) {
      X.fillStyle = '#888';
      X.font = '11px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('No new quests available. Your service is valued.', cx, actY + 30);
    } else {
      X.fillStyle = '#ffd700';
      X.font = 'bold 11px Consolas, monospace';
      X.textAlign = 'left';
      X.fillText('Available Quests:', px + 10, actY + 28);
      available.slice(0, 2).forEach((quest, qi) => {
        const qy = actY + 42 + qi * 52;
        X.fillStyle = '#1a1a2a';
        X.fillRect(px + 5, qy, pw - 10, 48);
        X.strokeStyle = faction.color + '66'; X.lineWidth = 1;
        X.strokeRect(px + 5, qy, pw - 10, 48);
        X.fillStyle = '#ccc'; X.font = 'bold 10px Consolas, monospace'; X.textAlign = 'left';
        X.fillText(quest.title, px + 10, qy + 13);
        X.fillStyle = '#888'; X.font = '9px Consolas, monospace';
        const descShort = quest.desc.length > 60 ? quest.desc.substr(0, 57) + '...' : quest.desc;
        X.fillText(descShort, px + 10, qy + 26);
        X.fillStyle = '#ffd700'; X.textAlign = 'right';
        X.fillText(`${quest.reward.gold}g + ${quest.reward.rep}rep`, px + pw - 10, qy + 13);

        const takeBtnW = 55, takeBtnH = 22;
        drawButton(px + pw - takeBtnW - 8, qy + 23, takeBtnW, takeBtnH, 'Take', false, darkenColor(faction.color, 0.4));
        if (clickedInRect(px + pw - takeBtnW - 8, qy + 23, takeBtnW, takeBtnH)) {
          SFX.click();
          startFactionQuest(playerFaction, FACTION_QUESTS[playerFaction].indexOf(quest));
        }
      });
    }
  }

  // Defect button (only if in a faction)
  const defBtnW = 120, defBtnH = 28;
  drawButton(px + pw - defBtnW - 8, py + (canvasH - py - 60) - 10, defBtnW, defBtnH, 'Defect', false, '#4a1a1a', '#ff6644');
  if (clickedInRect(px + pw - defBtnW - 8, py + (canvasH - py - 60) - 10, defBtnW, defBtnH)) {
    SFX.click();
    defectFromFaction();
    warState = WAR_STATE.DEFECTED;
    playerFaction = null;
    dungeonMessage = 'You have defected! Assassins are coming.';
    dungeonMessageTimer = 3;
  }
}

// ============================================================
// WAR STATUS INDICATOR IN HUD
// ============================================================
function renderWarStatusHUD() {
  if (warState === WAR_STATE.INACTIVE) return;

  const indicX = isMobile ? 10 : 10;
  // Position below main UI bars; calculate based on HP bar + spell slot bar + info panel
  const baseY = canvasH - (isMobile ? 190 : 200);

  const warBoxW = isMobile ? 140 : 170;
  const warBoxH = assassinsActive ? 46 : 34;

  X.fillStyle = 'rgba(0,0,0,0.75)';
  X.fillRect(indicX - 2, baseY - 2, warBoxW + 4, warBoxH + 4);

  const faction = playerFaction ? FACTIONS[playerFaction] : null;
  const statusColor = warState === WAR_STATE.FREELANCER ? '#ffd700' :
                     warState === WAR_STATE.TRIGGERED ? '#ff8844' :
                     warState === WAR_STATE.DEFECTED ? '#ff4444' :
                     faction ? faction.color : '#888';

  X.fillStyle = statusColor;
  X.font = `bold ${isMobile ? 9 : 10}px Consolas, monospace`;
  X.textAlign = 'left';

  const statusLabel = warState === WAR_STATE.FREELANCER ? 'WAR: Freelancer' :
                      warState === WAR_STATE.TRIGGERED ? 'WAR: Choose Faction!' :
                      warState === WAR_STATE.DEFECTED ? 'WAR: DEFECTOR' :
                      faction ? `WAR: ${faction.shortName} - ${getFactionRankName(playerFaction, getPlayerFactionRank())}` :
                      'WAR: Active';

  X.fillText(statusLabel, indicX + 2, baseY + 12);

  if (faction) {
    X.fillStyle = '#888';
    X.font = `${isMobile ? 8 : 9}px Consolas, monospace`;
    X.fillText(`Rep: ${factionReps[playerFaction] >= 0 ? '+' : ''}${factionReps[playerFaction]}`, indicX + 2, baseY + 24);
  }

  if (assassinsActive) {
    X.fillStyle = '#ff4444';
    X.font = `bold ${isMobile ? 8 : 9}px Consolas, monospace`;
    X.fillText(`!! ASSASSINS: ${assassinTier.toUpperCase()} !!`, indicX + 2, baseY + 36);
  }

  // War state color bar
  X.fillStyle = statusColor + '88';
  X.fillRect(indicX - 2, baseY - 2, warBoxW + 4, 3);
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  gameTime += dt;

  switch (gameState) {
    case STATE.TITLE:        updateTitle(); break;
    case STATE.CHAR_CREATE:  updateCharCreate(); break;
    case STATE.DUNGEON:      updateDungeon(dt); break;
    case STATE.COMBAT:       updateCombat(dt); break;
    case STATE.INVENTORY:    updateInventory(); break;
    case STATE.CHAR_SHEET:   updateCharSheet(); break;
    case STATE.GAME_OVER:    updateGameOver(); break;
    case STATE.VICTORY:      updateVictory(); break;
    case STATE.HELP:         updateHelp(); break;
    case STATE.LEVEL_UP:     updateLevelUp(); break;
    case STATE.SHOP:         updateShop(); break;
    case STATE.NPC_TALK:     updateNpcTalk(); break;
    case STATE.EVOLUTION:    updateEvolution(); break;
    case STATE.PARTY_MGMT:   updatePartyMgmt(); break;
    case STATE.TOWN:         updateTown(); break;
    case STATE.CAMPFIRE:     updateCampfire(); break;
    case STATE.WAR_CHOICE:   updateWarChoice(); break;
  }

  updateParticles(dt);

  // Tutorial overlay (first-time popup)
  if (showTutorial) {
    X.fillStyle = 'rgba(0,0,0,0.85)';
    X.fillRect(0, 0, canvasW, canvasH);
    const cx = canvasW / 2;
    const panelW = Math.min(canvasW - 30, 380);
    const panelX = cx - panelW / 2;
    const panelY = 30;
    X.fillStyle = '#1a1a2e';
    X.fillRect(panelX, panelY, panelW, canvasH - 60);
    X.strokeStyle = '#ffd700';
    X.lineWidth = 2;
    X.strokeRect(panelX, panelY, panelW, canvasH - 60);
    X.fillStyle = '#ffd700';
    X.font = 'bold 18px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText('HOW TO PLAY', cx, panelY + 30);
    const tips = [
      ['Move', isMobile ? 'Use the D-pad (bottom-left)' : 'WASD or Arrow keys'],
      ['Interact', isMobile ? 'Tap the E button (bottom-right)' : 'Press E near doors, stairs, shrines'],
      ['Combat', 'Tap/click actions when enemies appear'],
      ['Inventory', isMobile ? 'Tap [I]nv button' : 'Press I to manage gear'],
      ['Character', isMobile ? 'Tap [C]har button' : 'Press C to view stats'],
      ['Help', isMobile ? 'Tap [?] button' : 'Press ? for full controls'],
      ['Save', isMobile ? 'Tap Save button in dungeon HUD' : 'Use the Save button in the HUD'],
      ['Goal', 'Descend 8 floors. Defeat bosses. Survive!'],
      ['Tips', 'Rest at shrines to heal. Equip loot from inventory.'],
      ['Town', 'Visit the Town between floors to buy gear and talk to NPCs.'],
    ];
    X.textAlign = 'left';
    let ty = panelY + 55;
    tips.forEach(([key, desc]) => {
      X.fillStyle = '#ffcc00';
      X.font = 'bold 12px Consolas, monospace';
      X.fillText(key, panelX + 15, ty);
      X.fillStyle = '#ccc';
      X.font = '11px Consolas, monospace';
      const lines = wrapText(desc, panelW - 100, 11);
      lines.forEach((line, i) => X.fillText(line, panelX + 90, ty + i * 14));
      ty += Math.max(lines.length, 1) * 14 + 6;
    });
    const gotItW = 140, gotItH = 42;
    drawButton(cx - gotItW/2, canvasH - 80, gotItW, gotItH, 'GOT IT!', false, '#2a4a2a');
    if (clickedInRect(cx - gotItW/2, canvasH - 80, gotItW, gotItH) || keys['Escape'] || keys['Enter'] || keys[' ']) {
      keys['Escape'] = false; keys['Enter'] = false; keys[' '] = false;
      showTutorial = false;
      SFX.click();
    }
  }

  // Reset click
  mouseClicked = false;

  requestAnimationFrame(gameLoop);
}

// Handle ? key globally
document.addEventListener('keydown', e => {
  if (e.key === '?' && gameState === STATE.DUNGEON) {
    gameState = STATE.HELP;
    e.preventDefault();
  }
});

// Start
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
