  // D-pad
  const dpadSize = 55;
  const dpadX = 20;
  const dpadY = canvasH - dpadSize * 3 - 30;
  const dpadCX = dpadX + dpadSize * 1.5;
  const dpadCY = dpadY + dpadSize * 1.5;

  touchDpadDir = null;

  const dirs = [
    { x: dpadCX - dpadSize/2, y: dpadCY - dpadSize * 1.5, w: dpadSize, h: dpadSize, dir: 'up', label: 'W' },
    { x: dpadCX - dpadSize/2, y: dpadCY + dpadSize * 0.5, w: dpadSize, h: dpadSize, dir: 'down', label: 'S' },
    { x: dpadCX - dpadSize * 1.5, y: dpadCY - dpadSize/2, w: dpadSize, h: dpadSize, dir: 'left', label: 'A' },
    { x: dpadCX + dpadSize * 0.5, y: dpadCY - dpadSize/2, w: dpadSize, h: dpadSize, dir: 'right', label: 'D' },
  ];

  dirs.forEach(d => {
    const pressed = mouseDown && isInRect(mouseX, mouseY, d.x, d.y, d.w, d.h);
    X.fillStyle = pressed ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)';
    X.fillRect(d.x, d.y, d.w, d.h);
    X.strokeStyle = 'rgba(255,255,255,0.3)';
    X.lineWidth = 1;
    X.strokeRect(d.x, d.y, d.w, d.h);
    X.fillStyle = pressed ? '#fff' : '#888';
    X.font = 'bold 16px Consolas, monospace';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(d.label, d.x + d.w/2, d.y + d.h/2);
    if (pressed) touchDpadDir = d.dir;
  });

  // Action buttons (right side)
  const abtnSize = 50;
  const abtnX = canvasW - abtnSize - 15;
  const abtnY = canvasH - abtnSize * 4 - 30;

  const actionBtns = [
    { label: 'E', y: abtnY, action: 'interact' },
    { label: 'I', y: abtnY + abtnSize + 8, action: 'inventory' },
    { label: 'C', y: abtnY + (abtnSize + 8) * 2, action: 'character' },
    { label: '?', y: abtnY + (abtnSize + 8) * 3, action: 'help' },
  ];

  actionBtns.forEach(btn => {
    const pressed = mouseDown && isInRect(mouseX, mouseY, abtnX, btn.y, abtnSize, abtnSize);
    X.fillStyle = pressed ? 'rgba(255,200,0,0.3)' : 'rgba(255,255,255,0.1)';
    X.fillRect(abtnX, btn.y, abtnSize, abtnSize);
    X.strokeStyle = 'rgba(255,200,0,0.3)';
    X.lineWidth = 1;
    X.strokeRect(abtnX, btn.y, abtnSize, abtnSize);
    X.fillStyle = pressed ? '#ffd700' : '#aaa';
    X.font = 'bold 18px Consolas, monospace';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(btn.label, abtnX + abtnSize/2, btn.y + abtnSize/2);

    if (clickedInRect(abtnX, btn.y, abtnSize, abtnSize)) {
      SFX.click();
      if (btn.action === 'interact') { keys['e'] = true; }
      else if (btn.action === 'inventory') gameState = STATE.INVENTORY;
      else if (btn.action === 'character') gameState = STATE.CHAR_SHEET;
      else if (btn.action === 'help') gameState = STATE.HELP;
    }
  });

  // Save button (top right area below minimap)
  const saveBtnW = 55, saveBtnH = 25;
  const saveBtnX = canvasW - saveBtnW - 10;
  const saveBtnY = (isMobile ? 90 : 120) + 25;
  drawButton(saveBtnX, saveBtnY, saveBtnW, saveBtnH, 'Save', false, '#2a2a4a');
  if (clickedInRect(saveBtnX, saveBtnY, saveBtnW, saveBtnH)) {
    saveGame();
    dungeonMessage = 'Game saved!';
    dungeonMessageTimer = 1.5;
    SFX.save();
  }
}

// ============================================================
// COMBAT SYSTEM
// ============================================================
function startCombat(room) {
  combatLog = [];
  const enemies = room.enemies.filter(e => e.hp > 0);
  if (enemies.length === 0) { room.cleared = true; return; }

  // Roll initiative
  let playerInit = d20() + mod(player.stats.DEX);
  // Gloom Stalker initiative bonus
  if (player.evolutionData?.bonuses?.initiative) {
    playerInit += player.evolutionData.bonuses.initiative;
  }
  const combatants = [];
  combatants.push({ type: 'player', initiative: playerInit, entity: player });

  // Add squad members
  if (player.squad) {
    player.squad.forEach(comp => {
      if (comp.hp > 0) {
        const compInit = d20() + 2;
        combatants.push({ type: 'companion', initiative: compInit, entity: comp });
      }
    });
  }

  enemies.forEach(e => {
    const init = d20() + mod(e.dex || 10);
    combatants.push({ type: 'enemy', initiative: init, entity: e });
  });

  // Sort by initiative (higher goes first)
  combatants.sort((a, b) => b.initiative - a.initiative);

  combatState = {
    room: room,
    combatants: combatants,
    turnIndex: 0,
    playerTurn: false,
    phase: 'start', // start, player_action, enemy_turn, victory, defeat
    selectedAction: null,
    selectedSpell: null,
    selectedItem: null,
    animTimer: 0,
    turnDelay: 0,
    combatRound: 1,
    fleeing: false,
  };

  addCombatLog(`--- COMBAT BEGINS (Round 1) ---`);
  addCombatLog(`Initiative: ${combatants.map(c => `${c.type === 'player' ? player.name : c.entity.name} (${c.initiative})`).join(', ')}`);

  // Start first turn
  advanceTurn();
  gameState = STATE.COMBAT;
}

function addCombatLog(msg) {
  combatLog.push(msg);
  if (combatLog.length > 50) combatLog.shift();
}

function advanceTurn() {
  if (!combatState) return;

  // Check victory/defeat
  const aliveEnemies = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0);
  if (aliveEnemies.length === 0) {
    combatState.phase = 'victory';
    return;
  }
  if (player.hp <= 0) {
    combatState.phase = 'defeat';
    return;
  }

  // Find next alive combatant
  let found = false;
  let loops = 0;
  while (!found && loops < combatState.combatants.length * 2) {
    const current = combatState.combatants[combatState.turnIndex];
    if (current.type === 'player' && player.hp > 0) {
      combatState.playerTurn = true;
      combatState.phase = 'player_action';
      combatState.selectedAction = null;
      combatState.selectedSpell = null;
      combatState.selectedItem = null;
      found = true;

      // Tick conditions
      player.conditions = player.conditions.filter(c => {
        if (c.turns !== undefined) {
          c.turns--;
          return c.turns > 0;
        }
        return true;
      });
      if (player.shieldActive) { player.tempAc -= 5; player.shieldActive = false; }
      if (player.blessActive) {
        player.blessTurns--;
        if (player.blessTurns <= 0) { player.blessActive = false; }
      }
    } else if (current.type === 'companion' && current.entity.hp > 0) {
      combatState.playerTurn = false;
      combatState.phase = 'companion_auto';
      combatState.turnDelay = 0.5;
      found = true;
    } else if (current.type === 'enemy' && current.entity.hp > 0) {
      combatState.playerTurn = false;
      combatState.phase = 'enemy_turn';
      combatState.turnDelay = 0.8;
      found = true;
    } else {
      combatState.turnIndex = (combatState.turnIndex + 1) % combatState.combatants.length;
      if (combatState.turnIndex === 0) {
        combatState.combatRound++;
        addCombatLog(`--- Round ${combatState.combatRound} ---`);
      }
    }
    loops++;
  }
}

function nextTurn() {
  combatState.turnIndex = (combatState.turnIndex + 1) % combatState.combatants.length;
  if (combatState.turnIndex === 0) {
    combatState.combatRound++;
    addCombatLog(`--- Round ${combatState.combatRound} ---`);
  }
  advanceTurn();
}

function playerAttack() {
  const aliveEnemies = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0);
  if (aliveEnemies.length === 0) return;
  const target = aliveEnemies[0].entity;

  let roll = d20();
  // Halfling lucky
  if (player.race === 'Halfling' && roll === 1) { roll = d20(); addCombatLog('Lucky! Rerolled a 1.'); }
  // Bless bonus
  if (player.blessActive) roll += rollDice(1, 4);
  // Disadvantage from poison
  const isPoisoned = player.conditions.some(c => c.type === 'poisoned');
  if (isPoisoned) {
    const roll2 = d20();
    roll = Math.min(roll, roll2);
    addCombatLog('Disadvantage (poisoned)!');
  }

  const attackBonus = calcAttackBonus();
  const totalRoll = roll + attackBonus;
  const weapon = getEquippedItem('weapon');
  const weaponName = weapon ? weapon.name : 'Fists';

  // Champion improved critical: crit on 19-20
  const critThreshold = (player.evolution === 'Champion' && player.evolutionData?.bonuses?.critRange) ? player.evolutionData.bonuses.critRange : 20;

  if (roll >= critThreshold) {
    // Critical hit!
    const dmg = calcDamage(true);
    target.hp = Math.max(0, target.hp - dmg);
    const critLabel = roll === 20 ? 'NAT 20!' : `${roll} - IMPROVED CRITICAL!`;
    addCombatLog(`${player.name} attacks ${target.name} with ${weaponName}: ${critLabel} CRITICAL HIT for ${dmg} damage!`);
    addFloatingText(canvasW/2, canvasH * 0.3, `CRIT! -${dmg}`, '#ff4444');
    SFX.crit();
    spawnParticles(canvasW/2, canvasH * 0.3, '#ff4444', 15);
  } else if (roll === 1) {
    addCombatLog(`${player.name} attacks ${target.name} with ${weaponName}: NAT 1! Critical miss!`);
    addFloatingText(canvasW/2, canvasH * 0.3, 'MISS!', '#888');
    SFX.miss();
  } else if (totalRoll >= target.ac) {
    const dmg = calcDamage(false);
    target.hp = Math.max(0, target.hp - dmg);
    addCombatLog(`${player.name} attacks ${target.name} with ${weaponName}: ${totalRoll} vs AC ${target.ac} - HIT for ${dmg} damage!`);
    addFloatingText(canvasW/2, canvasH * 0.3, `-${dmg}`, '#ff6644');
    SFX.hit();
    spawnParticles(canvasW/2, canvasH * 0.3, '#ff6644', 8);
  } else {
    addCombatLog(`${player.name} attacks ${target.name} with ${weaponName}: ${totalRoll} vs AC ${target.ac} - MISS!`);
    addFloatingText(canvasW/2, canvasH * 0.3, 'MISS', '#888');
    SFX.miss();
  }

  if (target.hp <= 0) {
    addCombatLog(`${target.name} is defeated!`);
    addFloatingText(canvasW/2, canvasH * 0.3 - 20, 'DEFEATED!', '#ffd700');
    // Fiend Pact: Dark One's Blessing - gain temp HP on kill
    if (player.evolutionData?.bonuses?.darkBlessing) {
      const tempHp = mod(player.stats.CHA) + player.level;
      player.hp = Math.min(player.maxHp + tempHp, player.hp + tempHp);
      addCombatLog(`Dark One's Blessing! +${tempHp} temp HP!`);
      addFloatingText(canvasW/2, canvasH * 0.3 - 40, `+${tempHp} HP`, '#aa44ff');
    }
  }

  // Extra Attack (Fighter/Ranger level 5+, Paladin level 5+, or College of Valor)
  const hasEvoExtraAttack = player.evolutionData?.bonuses?.extraAttack;
  if (((player.class === 'Fighter' || player.class === 'Ranger' || player.class === 'Paladin') && player.level >= 5 || hasEvoExtraAttack) && !combatState._extraAttackUsed) {
    combatState._extraAttackUsed = true;
    addCombatLog('Extra Attack!');
    setTimeout(() => playerAttack(), 200);
    return;
  }
  combatState._extraAttackUsed = false;

  nextTurn();
}

function playerDodge() {
  addCombatLog(`${player.name} takes the Dodge action. Attacks against you have disadvantage until your next turn.`);
  player.conditions.push({ type: 'dodging', turns: 1 });
  nextTurn();
}

function playerFlee() {
  let roll = d20();
  if (player.race === 'Halfling' && roll === 1) roll = d20();
  const check = roll + mod(player.stats.DEX);
  const dc = 10 + currentFloor * 2;

  if (check >= dc) {
    addCombatLog(`${player.name} flees! (${check} vs DC ${dc})`);
    combatState.phase = 'flee_success';
    combatState.turnDelay = 1;
  } else {
    addCombatLog(`${player.name} fails to flee! (${check} vs DC ${dc})`);
    nextTurn();
  }
}

function playerUseItem() {
  // Find usable consumables
  const consumables = player.inventory.filter(i => i.type === ITEM_TYPES.CONSUMABLE);
  if (consumables.length === 0) {
    addCombatLog('No usable items!');
    return;
  }
  combatState.selectedAction = 'item';
}

function useConsumable(item) {
  if (item.effect === 'heal') {
    const heal = rollDice(item.healDice[0], item.healDice[1]) + (item.healBonus || 0);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addCombatLog(`${player.name} uses ${item.name}: healed ${heal} HP!`);
    addFloatingText(canvasW/2, canvasH * 0.6, `+${heal}`, '#44ff44');
    SFX.heal();
  } else if (item.effect === 'cure_poison') {
    player.conditions = player.conditions.filter(c => c.type !== 'poisoned');
    addCombatLog(`${player.name} uses ${item.name}: poison cured!`);
    SFX.heal();
  }

  // Remove item
  const idx = player.inventory.findIndex(i => i.id === item.id);
  if (idx !== -1) player.inventory.splice(idx, 1);

  combatState.selectedAction = null;
  nextTurn();
}

function playerCastSpell(spell) {
  const spellData = SPELLS[spell];
  if (!spellData) return;

  // Check spell slots (cantrips are free)
  if (spellData.level > 0) {
    if (player.spellSlots <= 0) {
      addCombatLog('No spell slots remaining!');
      return;
    }
    player.spellSlots--;
  }

  SFX.spell();

  const aliveEnemies = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0);
  const target = aliveEnemies.length > 0 ? aliveEnemies[0].entity : null;

  switch (spellData.type) {
    case 'damage':
      if (!target) { addCombatLog('No targets!'); return; }
      if (spellData.autoHit) {
        // Magic Missile
        const dmg = rollDice(spellData.damage[0], spellData.damage[1]) + spellData.damageBonus;
        target.hp = Math.max(0, target.hp - dmg);
        addCombatLog(`${player.name} casts ${spell}! Auto-hit for ${dmg} damage!`);
        addFloatingText(canvasW/2, canvasH * 0.3, `-${dmg}`, '#8888ff');
        spawnParticles(canvasW/2, canvasH * 0.3, '#8888ff', 12);
      } else if (spellData.savingThrow) {
        // Save-based (Sacred Flame, Vicious Mockery)
        const saveMod = mod(target[spellData.savingThrow.toLowerCase()] || 10);
        const saveRoll = d20() + saveMod;
        const dc = 8 + PROF_BONUS[player.level] + mod(player.stats[CLASSES[player.class].primary]);
        if (saveRoll < dc) {
          const dmg = rollDice(spellData.damage[0], spellData.damage[1]) + spellData.damageBonus;
          target.hp = Math.max(0, target.hp - dmg);
          addCombatLog(`${player.name} casts ${spell}! ${target.name} fails save (${saveRoll} vs DC ${dc}): ${dmg} damage!`);
          addFloatingText(canvasW/2, canvasH * 0.3, `-${dmg}`, '#ffaa44');
          if (spellData.effect === 'disadvantage') {
            target.conditions = target.conditions || [];
            target.conditions.push({ type: 'disadvantage', turns: 1 });
            addCombatLog(`${target.name} has disadvantage on next attack!`);
          }
        } else {
          addCombatLog(`${player.name} casts ${spell}! ${target.name} saves (${saveRoll} vs DC ${dc}): No damage!`);
        }
        spawnParticles(canvasW/2, canvasH * 0.3, '#ffaa44', 8);
      } else if (spellData.attackRoll) {
        // Fire Bolt
        let roll = d20();
        if (player.race === 'Halfling' && roll === 1) roll = d20();
        const attackMod = mod(player.stats[CLASSES[player.class].primary]) + PROF_BONUS[player.level];
        const totalRoll = roll + attackMod;
        if (roll === 20) {
          const dmg = rollDice(spellData.damage[0] * 2, spellData.damage[1]);
          target.hp = Math.max(0, target.hp - dmg);
          addCombatLog(`${player.name} casts ${spell}: NAT 20! CRIT for ${dmg} damage!`);
          addFloatingText(canvasW/2, canvasH * 0.3, `CRIT -${dmg}`, '#ff4400');
          SFX.crit();
        } else if (roll === 1) {
          addCombatLog(`${player.name} casts ${spell}: NAT 1! Miss!`);
          addFloatingText(canvasW/2, canvasH * 0.3, 'MISS', '#888');
        } else if (totalRoll >= target.ac) {
          const dmg = rollDice(spellData.damage[0], spellData.damage[1]);
          target.hp = Math.max(0, target.hp - dmg);
          addCombatLog(`${player.name} casts ${spell}: ${totalRoll} vs AC ${target.ac} - HIT for ${dmg}!`);
          addFloatingText(canvasW/2, canvasH * 0.3, `-${dmg}`, '#ff6600');
        } else {
          addCombatLog(`${player.name} casts ${spell}: ${totalRoll} vs AC ${target.ac} - MISS!`);
          addFloatingText(canvasW/2, canvasH * 0.3, 'MISS', '#888');
        }
        spawnParticles(canvasW/2, canvasH * 0.3, '#ff6600', 10);
      }
      if (target && target.hp <= 0) {
        addCombatLog(`${target.name} is defeated!`);
      }
      break;

    case 'heal': {
      const healStat = spellData.healStat || 'WIS';
      let heal = rollDice(spellData.healDice[0], spellData.healDice[1]) + Math.max(0, mod(player.stats[healStat]));
      // Life Domain: Disciple of Life healing bonus
      if (player.evolutionData?.bonuses?.healingBonus) {
        heal += player.evolutionData.bonuses.healingBonus;
      }
      player.hp = Math.min(player.maxHp, player.hp + heal);
      addCombatLog(`${player.name} casts ${spell}: healed ${heal} HP!`);
      addFloatingText(canvasW/2, canvasH * 0.6, `+${heal}`, '#44ff44');
      SFX.heal();
      break;
    }

    case 'defense':
      if (spell === 'Shield') {
        player.tempAc += 5;
        player.shieldActive = true;
        addCombatLog(`${player.name} casts Shield: +5 AC until next turn!`);
        addFloatingText(canvasW/2, canvasH * 0.6, '+5 AC', '#4488ff');
      }
      break;

    case 'buff':
      if (spell === 'Bless') {
        player.blessActive = true;
        player.blessTurns = 10;
        addCombatLog(`${player.name} casts Bless: +d4 to attacks and saves!`);
        addFloatingText(canvasW/2, canvasH * 0.6, 'BLESSED', '#ffd700');
      } else if (spell === "Hunter's Mark") {
        player.huntersMark = true;
        addCombatLog(`${player.name} casts Hunter's Mark: +d6 damage to target!`);
        addFloatingText(canvasW/2, canvasH * 0.6, "MARKED", '#40c040');
      }
      break;

    case 'control':
      if (spell === 'Sleep') {
        let hpPool = rollDice(5, 8);
        addCombatLog(`${player.name} casts Sleep! (${hpPool} HP worth)`);
        // Put enemies to sleep starting from lowest HP
        const sorted = [...aliveEnemies].sort((a, b) => a.entity.hp - b.entity.hp);
        for (const ce of sorted) {
          if (ce.entity.hp <= hpPool) {
            hpPool -= ce.entity.hp;
            ce.entity.conditions = ce.entity.conditions || [];
            ce.entity.conditions.push({ type: 'asleep', turns: 10 });
            addCombatLog(`${ce.entity.name} falls asleep!`);
          }
        }
      }
      break;
  }

  combatState.selectedAction = null;
  combatState.selectedSpell = null;

  // Bonus action spells don't end turn (Healing Word)
  if (spellData.bonusAction) {
    addCombatLog('(Bonus action - you can still act)');
    return;
  }

  nextTurn();
}

function enemyTurn(enemy) {
  // Check conditions
  if (enemy.conditions) {
    // Asleep - skip turn
    const asleep = enemy.conditions.find(c => c.type === 'asleep');
    if (asleep) {
      addCombatLog(`${enemy.name} is asleep and does nothing.`);
      asleep.turns--;
      if (asleep.turns <= 0) enemy.conditions = enemy.conditions.filter(c => c.type !== 'asleep');
      nextTurn();
      return;
    }
    // Tick conditions
    enemy.conditions = enemy.conditions.filter(c => {
      if (c.turns !== undefined) { c.turns--; return c.turns > 0; }
      return true;
    });
  }

  // Spread targeting across player + living squad members
  const aliveSquad = (player.squad || []).filter(c => c.hp > 0);
  if (aliveSquad.length > 0 && Math.random() < 0.35) {
    const compTarget = pick(aliveSquad);
    const attack = pick(enemy.attacks);
    const roll = d20();
    const totalRoll = roll + attack.bonus;
    if (roll === 20 || (roll !== 1 && totalRoll >= compTarget.ac)) {
      const dmg = roll === 20 ? rollDice(attack.damage[0]*2,attack.damage[1])+attack.damageBonus : rollDice(attack.damage[0],attack.damage[1])+attack.damageBonus;
      // Seraphina divine shield intercept
      const seraphina = aliveSquad.find(c => c.name === 'Seraphina' && c !== compTarget && c.specialAbilityUsed !== true);
      if (seraphina && compTarget.hp - dmg <= 0 && Math.random() < 0.5) {
        const interceptDmg = rollDice(1,8);
        seraphina.hp = Math.max(1, seraphina.hp - interceptDmg);
        addCombatLog(`Seraphina intercepts! Takes ${interceptDmg} to protect ${compTarget.name}!`);
        addFloatingText(canvasW/2, canvasH*0.5, 'DIVINE SHIELD!', '#f0d060');
        nextTurn(); return;
      }
      compTarget.hp = Math.max(0, compTarget.hp - dmg);
      addCombatLog(`${enemy.name} attacks ${compTarget.name}: ${roll===20?'CRIT! ':''}HIT for ${dmg}!`);
      if (compTarget.hp <= 0) {
        addCombatLog(`${compTarget.name} has fallen!`);
        addFloatingText(canvasW/2, canvasH*0.5, `${compTarget.name} DOWN!`, '#ff4444');
        // Loyalty hit for allies watching companion fall
        applyLoyaltyEvent('companion_falls');
        // Remove from squad after combat (permadeath)
        combatState._fallenCompanions = combatState._fallenCompanions || [];
        combatState._fallenCompanions.push(compTarget.name);
      }
    } else {
      addCombatLog(`${enemy.name} attacks ${compTarget.name}: MISS!`);
    }
    nextTurn();
    return;
  }

  // Pick an attack
  const attack = pick(enemy.attacks);

  // Auto-hit attacks (like Dragon Breath) bypass AC
  if (attack.autoHit) {
    let dmg = rollDice(attack.damage[0], attack.damage[1]) + attack.damageBonus;
    // DEX save for half damage
    let saveRoll = d20();
    if (player.race === 'Halfling' && saveRoll === 1) saveRoll = d20();
    const save = saveRoll + mod(player.stats.DEX) + (player.savingThrows.includes('DEX') ? PROF_BONUS[player.level] : 0);
    if (save >= 15) {
      dmg = Math.floor(dmg / 2);
      addCombatLog(`${enemy.name} uses ${attack.name}: DEX save SUCCESS! Half damage: ${dmg}!`);
    } else {
      addCombatLog(`${enemy.name} uses ${attack.name}: DEX save FAILED! ${dmg} damage!`);
    }
    if (player.race === 'Tiefling' && attack.name.toLowerCase().includes('fire')) dmg = Math.floor(dmg / 2);
    player.hp = Math.max(0, player.hp - dmg);
    addFloatingText(canvasW/2, canvasH * 0.65, `-${dmg}`, '#ff6600');
    SFX.trap();
    spawnParticles(canvasW/2, canvasH * 0.65, '#ff6600', 15);
    if (player.hp <= 0) {
      if (player.race === 'Orc' && !player.relentlessUsed) {
        player.hp = 1; player.relentlessUsed = true;
        addCombatLog('Relentless Endurance! Survived at 1 HP!');
      } else { combatState.phase = 'defeat'; SFX.death(); }
    }
    nextTurn();
    return;
  }

  let roll = d20();
  let totalRoll = roll + attack.bonus;

  // Check disadvantage
  const hasDisadvantage = enemy.conditions && enemy.conditions.some(c => c.type === 'disadvantage');
  const playerDodging = player.conditions.some(c => c.type === 'dodging');
  if (hasDisadvantage || playerDodging) {
    const roll2 = d20();
    roll = Math.min(roll, roll2);
    totalRoll = roll + attack.bonus;
  }

  const ac = calcAC();

  if (roll === 20) {
    const dmg = rollDice(attack.damage[0] * 2, attack.damage[1]) + attack.damageBonus;
    // Rogue Uncanny Dodge
    let finalDmg = dmg;
    if (player.class === 'Rogue' && player.level >= 5) {
      finalDmg = Math.floor(dmg / 2);
      addCombatLog('Uncanny Dodge: halved damage!');
    }
    // Bear Totem: resist all damage while raging
    if (player.evolutionData?.bonuses?.resistAll && player.rageActive) {
      finalDmg = Math.floor(finalDmg / 2);
      addCombatLog('Bear Totem: damage resisted!');
    }
    player.hp = Math.max(0, player.hp - finalDmg);
    addCombatLog(`${enemy.name} uses ${attack.name}: NAT 20! CRIT for ${finalDmg} damage!`);
    addFloatingText(canvasW/2, canvasH * 0.65, `-${finalDmg}`, '#ff0000');
    SFX.crit();
    spawnParticles(canvasW/2, canvasH * 0.65, '#ff0000', 12);
  } else if (roll === 1) {
    addCombatLog(`${enemy.name} uses ${attack.name}: NAT 1! Miss!`);
  } else if (totalRoll >= ac) {
    let dmg = rollDice(attack.damage[0], attack.damage[1]) + attack.damageBonus;
    // Fire resistance for Tiefling
    if (player.race === 'Tiefling' && attack.name.toLowerCase().includes('fire')) {
      dmg = Math.floor(dmg / 2);
    }
    // Bear Totem: resist all damage while raging
    if (player.evolutionData?.bonuses?.resistAll && player.rageActive) {
      dmg = Math.floor(dmg / 2);
      addCombatLog('Bear Totem: damage resisted!');
    }
    player.hp = Math.max(0, player.hp - dmg);
    addCombatLog(`${enemy.name} uses ${attack.name}: ${totalRoll} vs AC ${ac} - HIT for ${dmg}!`);
    addFloatingText(canvasW/2, canvasH * 0.65, `-${dmg}`, '#ff4444');
    SFX.hit();
    spawnParticles(canvasW/2, canvasH * 0.65, '#ff4444', 6);
  } else {
    addCombatLog(`${enemy.name} uses ${attack.name}: ${totalRoll} vs AC ${ac} - MISS!`);
    addFloatingText(canvasW/2, canvasH * 0.65, 'MISS', '#888');
  }

  // Check player death
  if (player.hp <= 0) {
    // Orc Relentless Endurance
    if (player.race === 'Orc' && !player.relentlessUsed) {
      player.hp = 1;
      player.relentlessUsed = true;
      addCombatLog('Relentless Endurance activates! Survived with 1 HP!');
      addFloatingText(canvasW/2, canvasH * 0.65 - 20, 'RELENTLESS!', '#ff8800');
    } else {
      // Death saving throws
      player.isDying = true;
      combatState.phase = 'death_saves';
      return;
    }
  }

  nextTurn();
}

function doDeathSave() {
  const roll = d20();
  if (roll === 20) {
    player.hp = 1;
    player.isDying = false;
    player.deathSaves = { successes: 0, failures: 0 };
    addCombatLog(`Death Save: NAT 20! ${player.name} regains 1 HP!`);
    addFloatingText(canvasW/2, canvasH * 0.5, 'NAT 20! REVIVED!', '#44ff44');
    SFX.heal();
    combatState.phase = 'player_action';
    return;
  }
  if (roll === 1) {
    player.deathSaves.failures += 2;
    addCombatLog(`Death Save: NAT 1! Two failures! (${player.deathSaves.failures}/3)`);
  } else if (roll >= 10) {
    player.deathSaves.successes++;
    addCombatLog(`Death Save: ${roll} - Success! (${player.deathSaves.successes}/3)`);
  } else {
    player.deathSaves.failures++;
    addCombatLog(`Death Save: ${roll} - Failure! (${player.deathSaves.failures}/3)`);
  }

  if (player.deathSaves.successes >= 3) {
    player.hp = 1;
    player.isDying = false;
    player.deathSaves = { successes: 0, failures: 0 };
    addCombatLog(`${player.name} stabilizes!`);
    addFloatingText(canvasW/2, canvasH * 0.5, 'STABILIZED', '#44ff44');
    SFX.heal();
    nextTurn();
  } else if (player.deathSaves.failures >= 3) {
    player.isDead = true;
    player.isDying = false;
    combatState.phase = 'defeat';
    addCombatLog(`${player.name} has died!`);
    SFX.death();
  } else {
    nextTurn();
  }
}

function handleSecondWind() {
  if (player.secondWindUsed) { addCombatLog('Second Wind already used!'); return; }
  const heal = rollDice(1, 10) + player.level;
  player.hp = Math.min(player.maxHp, player.hp + heal);
  player.secondWindUsed = true;
  addCombatLog(`${player.name} uses Second Wind: healed ${heal} HP!`);
  addFloatingText(canvasW/2, canvasH * 0.6, `+${heal}`, '#44ff44');
  SFX.heal();
  nextTurn();
}

function handleActionSurge() {
  if (player.actionSurgeUsed) { addCombatLog('Action Surge already used!'); return; }
  player.actionSurgeUsed = true;
  addCombatLog(`${player.name} uses Action Surge! Extra action!`);
  addFloatingText(canvasW/2, canvasH * 0.6, 'ACTION SURGE!', '#ffd700');
  // Don't advance turn - player gets another action
}

// ============================================================
// COMBAT RENDERING
// ============================================================
function updateCombat(dt) {
  if (!combatState) return;

  X.fillStyle = '#0a0a0f';
  X.fillRect(0, 0, canvasW, canvasH);

  // Combat scene background
  const sceneY = 60;
  const sceneH = canvasH * 0.35;

  // Floor texture
  X.fillStyle = '#1a1a20';
  X.fillRect(0, sceneY, canvasW, sceneH);
  for (let i = 0; i < 20; i++) {
    X.fillStyle = `rgba(255,255,255,${0.02 + Math.random() * 0.02})`;
    X.fillRect(Math.random() * canvasW, sceneY + Math.random() * sceneH, rand(2, 6), rand(2, 4));
  }

  // Draw enemies
  const aliveEnemies = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0);
  const enemySpacing = Math.min(120, (canvasW - 80) / Math.max(aliveEnemies.length, 1));
  const enemyStartX = canvasW / 2 - (aliveEnemies.length - 1) * enemySpacing / 2;

  aliveEnemies.forEach((ce, i) => {
    const enemy = ce.entity;
    const ex = enemyStartX + i * enemySpacing;
    const ey = sceneY + sceneH * 0.35;
    const size = 25 * (enemy.size || 1);

    // Boss aura
    if (enemy.boss) {
      const t = gameTime * 3;
      const auraSize = size * 1.6 + Math.sin(t) * 4;
      const grad = X.createRadialGradient(ex, ey, size * 0.5, ex, ey, auraSize);
      grad.addColorStop(0, 'rgba(255,50,20,0.3)');
      grad.addColorStop(0.6, 'rgba(255,100,0,0.15)');
      grad.addColorStop(1, 'rgba(255,50,0,0)');
      X.fillStyle = grad;
      X.beginPath();
      X.arc(ex, ey, auraSize, 0, Math.PI * 2);
      X.fill();
    }

    // Shadow
    X.fillStyle = 'rgba(0,0,0,0.3)';
    X.beginPath();
    X.ellipse(ex, ey + size + 5, size * 0.8, 5, 0, 0, Math.PI * 2);
    X.fill();

    // Body
    X.fillStyle = enemy.color;
    if (enemy.symbol === 's') {
      // Slime - blob shape
      X.beginPath();
      X.ellipse(ex, ey, size, size * 0.7, 0, 0, Math.PI * 2);
      X.fill();
    } else if (enemy.symbol === 'r') {
      // Rat - oval
      X.beginPath();
      X.ellipse(ex, ey, size * 0.8, size * 0.5, 0, 0, Math.PI * 2);
      X.fill();
    } else {
      // Humanoid - circle
      X.beginPath();
      X.arc(ex, ey, size, 0, Math.PI * 2);
      X.fill();
    }

    // Letter
    X.fillStyle = '#fff';
    X.font = `bold ${Math.floor(size * 0.8)}px Consolas, monospace`;
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(enemy.symbol, ex, ey + 1);

    // HP bar
    const hpPct = enemy.hp / enemy.maxHp;
    const hpW = size * 2;
    X.fillStyle = '#400';
    X.fillRect(ex - hpW/2, ey - size - 12, hpW, 6);
    X.fillStyle = hpPct > 0.5 ? '#0c0' : hpPct > 0.25 ? '#cc0' : '#c00';
    X.fillRect(ex - hpW/2, ey - size - 12, hpW * hpPct, 6);

    // Name & HP
    X.fillStyle = enemy.boss ? '#ff4444' : '#ccc';
    X.font = enemy.boss ? 'bold 11px Consolas, monospace' : '10px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText(`${enemy.boss ? '★ ' : ''}${enemy.name}${enemy.boss ? ' ★' : ''}`, ex, ey - size - 16);
    X.fillStyle = '#ccc';
    X.font = '10px Consolas, monospace';
    X.fillText(`${enemy.hp}/${enemy.maxHp}`, ex, ey - size - 2);

    // Status effects
    if (enemy.conditions && enemy.conditions.length > 0) {
      enemy.conditions.forEach((cond, ci) => {
        X.fillStyle = cond.type === 'asleep' ? '#8888ff' : '#ffaa00';
        X.font = '9px Consolas, monospace';
        X.fillText(`[${cond.type}]`, ex, ey + size + 15 + ci * 12);
      });
    }
  });

  // Draw player character
  const plX = canvasW / 2;
  const plY = sceneY + sceneH * 0.75;
  const cls = CLASSES[player.class];

  X.fillStyle = 'rgba(0,0,0,0.3)';
  X.beginPath();
  X.ellipse(plX, plY + 25, 20, 6, 0, 0, Math.PI * 2);
  X.fill();

  X.fillStyle = cls.color;
  X.beginPath();
  X.arc(plX, plY, 22, 0, Math.PI * 2);
  X.fill();
  X.fillStyle = '#fff';
  X.font = 'bold 16px Consolas, monospace';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(player.class[0], plX, plY + 1);

  // Player name & HP
  X.fillStyle = '#ffd700';
  X.font = 'bold 12px Consolas, monospace';
  X.fillText(player.name, plX, plY + 35);
  X.fillStyle = '#aaa';
  X.font = '11px Consolas, monospace';
  X.fillText(`HP: ${player.hp}/${player.maxHp}  AC: ${calcAC()}`, plX, plY + 50);

  // Round indicator
  X.fillStyle = '#888';
  X.font = '12px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText(`Floor ${currentFloor + 1} | Round ${combatState.combatRound}`, canvasW/2, 20);

  // Turn indicator
  const currentCombatant = combatState.combatants[combatState.turnIndex];
  X.fillStyle = '#ffd700';
  X.font = 'bold 14px Consolas, monospace';
  const turnName = currentCombatant.type === 'player' ? player.name : currentCombatant.entity.name;
  X.fillText(`${turnName}'s Turn`, canvasW/2, 40);

  // Combat log
  const logX = 10;
  const logY = sceneY + sceneH + 10;
  const logH = isMobile ? 100 : 130;

  X.fillStyle = 'rgba(0,0,0,0.8)';
  X.fillRect(logX, logY, canvasW - 20, logH);
  X.strokeStyle = '#333';
  X.lineWidth = 1;
  X.strokeRect(logX, logY, canvasW - 20, logH);

  X.fillStyle = '#aaa';
  X.font = `${isMobile ? 10 : 11}px Consolas, monospace`;
  X.textAlign = 'left'; X.textBaseline = 'top';
  const visibleLogs = combatLog.slice(-(Math.floor(logH / 14)));
  visibleLogs.forEach((log, i) => {
    X.fillStyle = log.includes('CRIT') ? '#ff4444' : log.includes('HIT') ? '#ffaa44' : log.includes('MISS') ? '#666' : log.includes('heal') || log.includes('Heal') ? '#44ff44' : log.includes('---') ? '#888' : '#ccc';
    const displayLog = log.length > 70 ? log.substr(0, 67) + '...' : log;
    X.fillText(displayLog, logX + 5, logY + 5 + i * 14);
  });

  // Action buttons area
  const btnAreaY = logY + logH + 10;

  // Handle different combat phases
  if (combatState.phase === 'player_action') {
    renderPlayerActions(btnAreaY);
  } else if (combatState.phase === 'death_saves') {
    renderDeathSaves(btnAreaY);
  } else if (combatState.phase === 'companion_auto') {
    combatState.turnDelay -= dt;
    if (combatState.turnDelay <= 0) {
      const current = combatState.combatants[combatState.turnIndex];
      companionTurn(current.entity);
      const alive = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0);
      if (alive.length === 0) { combatState.phase = 'victory'; }
      else nextTurn();
    }
    X.fillStyle = '#88aaff';
    X.font = '14px Consolas, monospace';
    X.textAlign = 'center';
    const compActor = combatState.combatants[combatState.turnIndex]?.entity;
    X.fillText(`${compActor ? compActor.name : 'Ally'}'s turn...`, canvasW/2, btnAreaY + 20);
  } else if (combatState.phase === 'enemy_turn') {
    combatState.turnDelay -= dt;
    if (combatState.turnDelay <= 0) {
      const current = combatState.combatants[combatState.turnIndex];
      enemyTurn(current.entity);
    }
    X.fillStyle = '#aaa';
    X.font = '14px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText('Enemy turn...', canvasW/2, btnAreaY + 20);
  } else if (combatState.phase === 'victory') {
    renderCombatVictory(btnAreaY);
  } else if (combatState.phase === 'defeat') {
    if (combatState.isEvolutionTrial) {
      // Evolution trial defeat: don't kill the player, just fail the trial
      X.fillStyle = '#ff6644';
      X.font = 'bold 24px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('TRIAL FAILED', canvasW/2, btnAreaY + 20);
      X.fillStyle = '#aaa';
      X.font = '13px Consolas, monospace';
      X.fillText('You were not ready. The trial spares your life.', canvasW/2, btnAreaY + 45);
      const bw = 160, bh = 40;
      drawButton(canvasW/2 - bw/2, btnAreaY + 60, bw, bh, 'Continue', false, '#333');
      if (clickedInRect(canvasW/2 - bw/2, btnAreaY + 60, bw, bh)) {
        SFX.click();
        player.hp = Math.max(1, Math.floor(player.maxHp * 0.25)); // Restore to 25% HP
        combatState = null;
        evolutionPhase = 'intro';
        gameState = STATE.DUNGEON;
        dungeonMessage = 'The trial spares you. Grow stronger and return.';
        dungeonMessageTimer = 3;
      }
    } else {
      X.fillStyle = '#ff4444';
      X.font = 'bold 24px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('DEFEATED', canvasW/2, btnAreaY + 20);
      const bw = 160, bh = 40;
      drawButton(canvasW/2 - bw/2, btnAreaY + 40, bw, bh, 'Main Menu', false, '#4a1a1a');
      if (clickedInRect(canvasW/2 - bw/2, btnAreaY + 40, bw, bh)) {
        SFX.click();
        gameState = STATE.GAME_OVER;
      }
    }
  } else if (combatState.phase === 'flee_success') {
    combatState.turnDelay -= dt;
    if (combatState.turnDelay <= 0) {
      // Move player back a step
      combatState = null;
      gameState = STATE.DUNGEON;
      dungeonMessage = 'You escaped!';
      dungeonMessageTimer = 1.5;
    }
    X.fillStyle = '#ffd700';
    X.font = '16px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText('Escaping...', canvasW/2, btnAreaY + 20);
  }

  // Floating texts & particles
  updateFloatingTexts(dt);
  renderParticles();
}

function renderPlayerActions(btnAreaY) {
  const btnW = isMobile ? 75 : 90;
  const btnH = isMobile ? 35 : 38;
  const btnGap = 6;
  const cls = CLASSES[player.class];

  if (combatState.selectedAction === 'spell') {
    // Spell selection
    X.fillStyle = '#aaa';
    X.font = '12px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText('Choose a spell:', canvasW/2, btnAreaY);

    const spells = player.spells;
    const spellBtnW = isMobile ? 130 : 160;
    const spellBtnH = 32;
    spells.forEach((spell, i) => {
      const spellData = SPELLS[spell];
      const canCast = spellData.level === 0 || player.spellSlots > 0;
      const bx = canvasW/2 - spellBtnW/2;
      const by = btnAreaY + 15 + i * (spellBtnH + 4);
      const color = canCast ? '#2a2a5a' : '#1a1a1a';
      drawButton(bx, by, spellBtnW, spellBtnH, `${spell} ${spellData.level === 0 ? '(C)' : `(Lv${spellData.level})`}`, false, color, canCast ? '#aaccff' : '#555');
      if (clickedInRect(bx, by, spellBtnW, spellBtnH) && canCast) {
        SFX.click();
        playerCastSpell(spell);
      }
    });

    // Back button
    const backBtnW = 80;
    drawButton(canvasW/2 - backBtnW/2, btnAreaY + 15 + spells.length * (spellBtnH + 4) + 5, backBtnW, 30, 'Back', false, '#333');
    if (clickedInRect(canvasW/2 - backBtnW/2, btnAreaY + 15 + spells.length * (spellBtnH + 4) + 5, backBtnW, 30)) {
      combatState.selectedAction = null;
    }
    return;
  }

  if (combatState.selectedAction === 'item') {
    // Item selection
    const consumables = player.inventory.filter(i => i.type === ITEM_TYPES.CONSUMABLE);
    X.fillStyle = '#aaa';
    X.font = '12px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText('Choose an item:', canvasW/2, btnAreaY);

    const itemBtnW = isMobile ? 160 : 180;
    const itemBtnH = 30;
    consumables.forEach((item, i) => {
      const bx = canvasW/2 - itemBtnW/2;
      const by = btnAreaY + 15 + i * (itemBtnH + 4);
      drawButton(bx, by, itemBtnW, itemBtnH, item.name, false, '#2a3a2a');
      if (clickedInRect(bx, by, itemBtnW, itemBtnH)) {
        SFX.click();
        useConsumable(item);
      }
    });

    if (consumables.length === 0) {
      X.fillStyle = '#666';
      X.fillText('No consumable items', canvasW/2, btnAreaY + 30);
    }

    const backY = btnAreaY + 15 + Math.max(consumables.length, 1) * (itemBtnH + 4) + 5;
    drawButton(canvasW/2 - 40, backY, 80, 30, 'Back', false, '#333');
    if (clickedInRect(canvasW/2 - 40, backY, 80, 30)) {
      combatState.selectedAction = null;
    }
    return;
  }

  // Main action buttons
  const actions = [];
  actions.push({ label: 'Attack', action: () => playerAttack() });
  if (cls.isCaster && player.spells.length > 0) {
    actions.push({ label: 'Spells', action: () => { combatState.selectedAction = 'spell'; } });
  }
  actions.push({ label: 'Dodge', action: () => playerDodge() });
  actions.push({ label: 'Item', action: () => { combatState.selectedAction = 'item'; } });
  actions.push({ label: 'Flee', action: () => playerFlee() });

  // Class-specific actions
  if (player.class === 'Fighter' && !player.secondWindUsed) {
    actions.push({ label: '2nd Wind', action: () => handleSecondWind() });
  }
  if (player.class === 'Fighter' && player.level >= 2 && !player.actionSurgeUsed) {
    actions.push({ label: 'Surge', action: () => handleActionSurge() });
  }

  const totalW = actions.length * (btnW + btnGap) - btnGap;
  const startX = canvasW/2 - totalW/2;

  // Wrap buttons if too wide
  const maxPerRow = Math.floor((canvasW - 20) / (btnW + btnGap));
  const rows = Math.ceil(actions.length / maxPerRow);

  actions.forEach((action, i) => {
    const row = Math.floor(i / maxPerRow);
    const col = i % maxPerRow;
    const rowCount = Math.min(maxPerRow, actions.length - row * maxPerRow);
    const rowW = rowCount * (btnW + btnGap) - btnGap;
    const rowStartX = canvasW/2 - rowW/2;

    const bx = rowStartX + col * (btnW + btnGap);
    const by = btnAreaY + row * (btnH + 5);
    drawButton(bx, by, btnW, btnH, action.label, false, '#2a2a3a');
    if (clickedInRect(bx, by, btnW, btnH)) {
      SFX.click();
      action.action();
    }
  });
}

function renderCombatVictory(btnAreaY) {
  // Calculate XP
  const deadEnemies = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp <= 0);
  let totalXP = 0;
  deadEnemies.forEach(c => totalXP += c.entity.xp);

  X.fillStyle = '#ffd700';
  X.font = 'bold 20px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText('VICTORY!', canvasW/2, btnAreaY);
  X.fillStyle = '#aaa';
  X.font = '14px Consolas, monospace';
  X.fillText(`+${totalXP} XP`, canvasW/2, btnAreaY + 25);

  const bw = 140, bh = 40;
  drawButton(canvasW/2 - bw/2, btnAreaY + 45, bw, bh, 'Continue', false, '#2a4a2a');
  if (clickedInRect(canvasW/2 - bw/2, btnAreaY + 45, bw, bh)) {
    SFX.click();
    // Award XP
    player.xp += totalXP;
    // Mark room cleared
    combatState.room.cleared = true;
    combatState.room.enemies = combatState.room.enemies.filter(e => e.hp > 0);

    // Check if it was a boss fight
    const wasBoss = deadEnemies.some(c => c.entity.boss);

    // Drop random item from combat
    const dropChance = wasBoss ? 1.0 : 0.3;
    if (Math.random() < dropChance) {
      const item = generateTreasureItem(currentFloor);
      if (wasBoss && item.rarity === RARITY.COMMON) item.rarity = RARITY.UNCOMMON;
      player.inventory.push(item);
      dungeonMessage = `Found: ${item.name}!`;
      dungeonMessageTimer = 2;
    }
    // Boss always drops a second item
    if (wasBoss) {
      const bonusItem = generateTreasureItem(currentFloor);
      bonusItem.rarity = Math.random() < 0.4 ? RARITY.RARE : RARITY.UNCOMMON;
      player.inventory.push(bonusItem);
      addFloatingText(canvasW/2, canvasH/2, `+${bonusItem.name}!`, RARITY_COLORS[bonusItem.rarity]);
    }

    // Reputation: boss kills
    if (wasBoss) changeRep(10, 'Boss Slain');
    else changeRep(1, 'Enemy Defeated');

    // Drop gold
    const goldDrop = wasBoss ? rand(30 + currentFloor * 15, 60 + currentFloor * 25) : rand(2 + currentFloor * 3, 10 + currentFloor * 8);
    player.gold += goldDrop;

    // Reset combat buffs
    player.huntersMark = false;
    player.conditions = player.conditions.filter(c => c.type !== 'dodging');

    // Remove fallen companions (permadeath)
    if (combatState._fallenCompanions && combatState._fallenCompanions.length > 0) {
      combatState._fallenCompanions.forEach(name => {
        const idx = player.squad.findIndex(c => c.name === name && c.hp <= 0);
        if (idx !== -1) {
          addFloatingText(canvasW/2, canvasH/2 - 40, `${name} has fallen forever.`, '#ff4444');
          player.squad.splice(idx, 1);
        }
      });
    }

    // Loyalty boost for winning battles together
    applyLoyaltyEvent('boss_victory');

    // Check if this was an evolution trial combat
    const wasEvolutionTrial = combatState.isEvolutionTrial;

    // If evolution trial won, mark the room and set pending flag
    if (wasEvolutionTrial && !player.evolution) {
      if (evolutionRoom) {
        evolutionRoom.evolutionTrialComplete = true;
        evolutionRoom.cleared = true;
      }
      player._pendingEvolution = true;
    }

    // Check level up
    if (player.level < 10 && player.xp >= XP_THRESHOLDS[player.level]) {
      gameState = STATE.LEVEL_UP;
    } else if (player._pendingEvolution) {
      // Evolution trial combat won - go to path selection
      player._pendingEvolution = false;
      evolutionTrialResult = { success: true };
      evolutionPhase = 'trial_result';
      gameState = STATE.EVOLUTION;
    } else {
      gameState = STATE.DUNGEON;
    }
    combatState = null;
  }
}

function updateLevelUp() {

  const cls = CLASSES[player.class];

  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 24 : 30}px Consolas, monospace`;
  X.textAlign = 'center';

  X.font = `bold ${isMobile ? 18 : 22}px Consolas, monospace`;

  X.font = `${isMobile ? 13 : 15}px Consolas, monospace`;
  X.fillText(`HP: +${hpGain} (${player.maxHp} -> ${player.maxHp + hpGain})`, cx, 160);
  X.fillText(`Proficiency Bonus: +${PROF_BONUS[newLevel]}`, cx, 185);

  if (cls.isCaster) {
    const newSlots = SPELL_SLOTS[newLevel];
    X.fillText(`Spell Slots: ${player.maxSpellSlots} -> ${newSlots}`, cx, 210);
  }

  // New features
  if (cls.features[newLevel]) {
    X.fillStyle = '#ffaa44';
    X.font = 'bold 14px Consolas, monospace';
    X.fillText('New Feature:', cx, 245);
    X.fillStyle = '#ccc';
    X.font = '13px Consolas, monospace';
    const lines = wrapText(cls.features[newLevel], canvasW - 80, 13);
    lines.forEach((line, i) => {
      X.fillText(line, cx, 265 + i * 18);
    });
  }

  // Ability Score Improvement at level 4, 8
  let abilityImprove = (newLevel === 4 || newLevel === 8);

  if (abilityImprove) {
    X.fillStyle = '#44ff44';
    X.font = 'bold 14px Consolas, monospace';
    X.fillText('Ability Score Improvement: +2 to one stat or +1 to two stats', cx, 320);

    // Simple: +2 to primary stat
    X.fillStyle = '#aaa';
    X.font = '12px Consolas, monospace';
    X.fillText(`(Auto: +2 ${cls.primary})`, cx, 340);
  }

  const bw = 180, bh = 45;
  drawButton(cx - bw/2, canvasH - 100, bw, bh, 'Accept', false, '#2a4a2a');
  if (clickedInRect(cx - bw/2, canvasH - 100, bw, bh)) {
    SFX.levelUp();
    player.level = newLevel;
    player.maxHp += hpGain;
    player.hp = player.maxHp; // Full heal on level up
    if (cls.isCaster) {
      player.maxSpellSlots = SPELL_SLOTS[newLevel];
      player.spellSlots = player.maxSpellSlots;
    }
    if (cls.features[newLevel]) {
      player.features[newLevel] = cls.features[newLevel];
    }
    if (abilityImprove) {
      player.stats[cls.primary] = Math.min(20, player.stats[cls.primary] + 2);
    }

    // Check if still need to level up more
    if (player.level < 10 && player.xp >= XP_THRESHOLDS[player.level]) {
      // Keep showing level up
    } else if (player._pendingEvolution) {
      // Evolution trial was passed during combat, show evolution choice after level-up
      player._pendingEvolution = false;
      evolutionTrialResult = { success: true };
      evolutionPhase = 'trial_result';
      gameState = STATE.EVOLUTION;
    } else {
      gameState = STATE.DUNGEON;
    }
  }
}

function startEvolutionTrial(paths) {
  // Determine trial type from paths: use the first path that has a combat trial, or default to skill
  // For simplicity, run one trial that qualifies for both paths
  const combatPath = paths.find(p => p.trialType === 'combat');
  const skillPath = paths.find(p => p.trialType === 'skill');

  if (combatPath && Math.random() < 0.5) {
    // Combat trial: start a special combat
    const enemyName = combatPath.trialEnemy;
    const template = EVOLUTION_TRIAL_ENEMIES[enemyName];
    if (template) {
      const enemy = {
        ...deepClone(template),
        maxHp: template.hp,
        id: Math.random().toString(36).substr(2, 9),
        conditions: [],
        px: 0, py: 0,
      };
      enemy.hp = enemy.maxHp;

      // Create a temporary room for the trial combat
      evolutionRoom.enemies = [enemy];
      evolutionRoom.evolutionTrialStarted = true;

      // Start combat; on victory we'll check for evolution
      combatState = null;
      startCombat(evolutionRoom);

      // Mark that this combat is an evolution trial
      if (combatState) {
        combatState.isEvolutionTrial = true;
      }
    } else {
      // Fallback to skill check
      runEvolutionSkillTrial(skillPath || paths[0]);
    }
  } else if (skillPath) {
    // Skill check trial
    runEvolutionSkillTrial(skillPath);
  } else {
    // Fallback: always run combat
    const enemyName = combatPath.trialEnemy;
    const template = EVOLUTION_TRIAL_ENEMIES[enemyName];
    if (template) {
      const enemy = {
        ...deepClone(template),
        maxHp: template.hp,
        id: Math.random().toString(36).substr(2, 9),
        conditions: [],
        px: 0, py: 0,
      };
      enemy.hp = enemy.maxHp;
      evolutionRoom.enemies = [enemy];
      evolutionRoom.evolutionTrialStarted = true;
      combatState = null;
      startCombat(evolutionRoom);
      if (combatState) {
        combatState.isEvolutionTrial = true;
      }
    }
  }
}

function runEvolutionSkillTrial(path) {
  const stat = path.trialStat || 'INT';
  const dc = path.trialDC || 14;
  const roll = d20();
  const bonus = mod(player.stats[stat]) + PROF_BONUS[player.level];
  const total = roll + bonus;
  const success = total >= dc;

  evolutionTrialResult = { success, roll: total, dc, stat };

  if (success) {
    evolutionRoom.evolutionTrialComplete = true;
    evolutionRoom.cleared = true;
    addFloatingText(canvasW/2, canvasH/2, 'TRIAL PASSED!', '#44ff44');
  } else {
    // Trial failed - player can try again later at another chamber
    addFloatingText(canvasW/2, canvasH/2, 'TRIAL FAILED', '#ff4444');
  }

  evolutionPhase = 'trial_result';
}

function applyEvolution(path) {
  player.evolution = path.name;
  player.evolutionData = {
    name: path.name,
    color: path.color,
    desc: path.desc,
    abilities: path.abilities,
    bonuses: deepClone(path.bonuses),
  };

  // Apply stat bonuses
  const b = path.bonuses;
  if (b.maxHp) player.maxHp += b.maxHp;
  if (b.maxHp) player.hp = Math.min(player.hp + b.maxHp, player.maxHp);
  if (b.gainSpells) {
    b.gainSpells.forEach(sp => { if (!player.spells.includes(sp)) player.spells.push(sp); });
  }
  if (b.maxSpellSlots) {
    player.maxSpellSlots = Math.max(player.maxSpellSlots, b.maxSpellSlots);
    player.spellSlots = Math.max(player.spellSlots, b.maxSpellSlots);
  }
  if (b.bonusSpellSlots) {
    player.maxSpellSlots += b.bonusSpellSlots;
    player.spellSlots += b.bonusSpellSlots;
  }
  if (b.tempShield) {
    player.tempAc += 1;
  }
  if (b.naturalAC) {
    // Only apply if better than current armor
    const currentAC = calcAC();
    if (b.naturalAC > currentAC) player.tempAc += (b.naturalAC - currentAC);
  }
  if (b.initiative) {
    // Stored in evolutionData for combat use
  }
  if (b.beastCompanion) {
    player.squad = player.squad || [];
    if (player.squad.length < 4 && !player.squad.some(c => c.name === b.beastCompanion.name)) {
      const beast = deepClone(b.beastCompanion);
      beast.loyalty = 70; beast.backstoryUnlocked = false;
      player.squad.push(beast);
    }
  }

  // Mark the room complete
  if (evolutionRoom) {
    evolutionRoom.evolutionTrialComplete = true;
    evolutionRoom.cleared = true;
  }

  // Emit particles
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: canvasW/2 + rand(-80, 80), y: canvasH/2 + rand(-80, 80),
      vx: rand(-50, 50), vy: rand(-80, -20),
      life: 2, maxLife: 2,
      color: path.color, size: rand(2, 6)
    });
  }
}

let invScroll = 0;

function updateInventory() {
  X.fillStyle = '#0a0a0f';
  X.fillRect(0, 0, canvasW, canvasH);

  const cx = canvasW / 2;
  const panelW = Math.min(canvasW - 20, 420);
  const panelX = cx - panelW / 2;

  // Title
  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 18 : 22}px Consolas, monospace`;
  X.textAlign = 'center';
  X.fillText('INVENTORY', cx, 30);

  // Gold
  X.fillStyle = '#ffd700';
  X.font = '14px Consolas, monospace';
  X.fillText(`Gold: ${player.gold}`, cx, 52);

  // Equipment slots
  const eqY = 70;
  X.fillStyle = '#aaa';
  X.font = 'bold 13px Consolas, monospace';
  X.textAlign = 'left';
  X.fillText('EQUIPPED:', panelX + 5, eqY);

  const slots = ['weapon', 'armor', 'shield'];
  slots.forEach((slot, i) => {
    const item = getEquippedItem(slot);
    const sy = eqY + 18 + i * 24;
    const slotLabel = slot.charAt(0).toUpperCase() + slot.slice(1);

    X.fillStyle = '#555';
    X.fillRect(panelX, sy, panelW, 22);
    X.strokeStyle = '#444';
    X.lineWidth = 1;
    X.strokeRect(panelX, sy, panelW, 22);

    X.fillStyle = '#888';
    X.font = '11px Consolas, monospace';
    X.textAlign = 'left';
    X.fillText(`${slotLabel}:`, panelX + 5, sy + 15);

    if (item) {
      X.fillStyle = RARITY_COLORS[item.rarity || 'common'];
      X.fillText(item.name, panelX + 70, sy + 15);
      X.fillStyle = '#888';
      X.textAlign = 'right';
      X.fillText(item.desc || '', panelX + panelW - 50, sy + 15);

      // Unequip button
      drawButton(panelX + panelW - 45, sy + 2, 40, 18, 'Off', false, '#4a2a2a');
      if (clickedInRect(panelX + panelW - 45, sy + 2, 40, 18)) {
        SFX.click();
        player.equipped[slot] = null;
      }
    } else {
      X.fillStyle = '#444';
      X.fillText('(empty)', panelX + 70, sy + 15);
    }
  });

  // Inventory list
  const listY = eqY + 18 + slots.length * 24 + 15;
  X.fillStyle = '#aaa';
  X.font = 'bold 13px Consolas, monospace';
  X.textAlign = 'left';
  X.fillText(`ITEMS (${player.inventory.length}):`, panelX + 5, listY);

  const itemH = 28;
  const maxVisible = Math.floor((canvasH - listY - 60) / itemH);
  const visibleItems = player.inventory.slice(invScroll, invScroll + maxVisible);

  visibleItems.forEach((item, i) => {
    const iy = listY + 18 + i * itemH;
    const isEquipped = Object.values(player.equipped).includes(item.id);

    X.fillStyle = isEquipped ? '#1a2a1a' : '#1a1a22';
    X.fillRect(panelX, iy, panelW, itemH - 2);
    X.strokeStyle = RARITY_COLORS[item.rarity || 'common'] + '60';
    X.lineWidth = 1;
    X.strokeRect(panelX, iy, panelW, itemH - 2);

    // Item name
    X.fillStyle = RARITY_COLORS[item.rarity || 'common'];
    X.font = '11px Consolas, monospace';
    X.textAlign = 'left';
    X.fillText(item.name + (isEquipped ? ' [E]' : ''), panelX + 5, iy + 16);

    // Item desc
    X.fillStyle = '#666';
    X.font = '10px Consolas, monospace';
    X.textAlign = 'right';
    X.fillText(item.desc || '', panelX + panelW - 80, iy + 16);

    // Action button
    if (item.type === ITEM_TYPES.WEAPON && !isEquipped) {
      drawButton(panelX + panelW - 75, iy + 2, 70, itemH - 6, 'Equip', false, '#2a3a2a');
      if (clickedInRect(panelX + panelW - 75, iy + 2, 70, itemH - 6)) {
        SFX.click();
        player.equipped.weapon = item.id;
      }
    } else if (item.type === ITEM_TYPES.ARMOR && !isEquipped) {
      drawButton(panelX + panelW - 75, iy + 2, 70, itemH - 6, 'Equip', false, '#2a3a2a');
      if (clickedInRect(panelX + panelW - 75, iy + 2, 70, itemH - 6)) {
        SFX.click();
        player.equipped.armor = item.id;
      }
    } else if (item.type === ITEM_TYPES.SHIELD && !isEquipped) {
      drawButton(panelX + panelW - 75, iy + 2, 70, itemH - 6, 'Equip', false, '#2a3a2a');
      if (clickedInRect(panelX + panelW - 75, iy + 2, 70, itemH - 6)) {
        SFX.click();
        player.equipped.shield = item.id;
      }
    } else if (item.type === ITEM_TYPES.CONSUMABLE && gameState !== STATE.COMBAT) {
      drawButton(panelX + panelW - 75, iy + 2, 70, itemH - 6, 'Use', false, '#2a2a3a');
      if (clickedInRect(panelX + panelW - 75, iy + 2, 70, itemH - 6)) {
        SFX.click();
        useItemOutOfCombat(item);
      }
    } else if (item.type === ITEM_TYPES.TREASURE) {
      drawButton(panelX + panelW - 75, iy + 2, 70, itemH - 6, 'Sell', false, '#3a3a2a');
      if (clickedInRect(panelX + panelW - 75, iy + 2, 70, itemH - 6)) {
        SFX.click();
        player.gold += item.value || 5;
        const idx = player.inventory.findIndex(inv => inv.id === item.id);
        if (idx !== -1) player.inventory.splice(idx, 1);
      }
    }
  });

  // Scroll indicators
  if (invScroll > 0) {
    X.fillStyle = '#ffd700';
    X.font = '12px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText('^ Scroll Up ^', cx, listY + 8);
  }
  if (invScroll + maxVisible < player.inventory.length) {
    X.fillStyle = '#ffd700';
    X.font = '12px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText('v Scroll Down v', cx, canvasH - 50);
  }

  // Scroll with arrow keys
  if (keys['arrowup'] || keys['w']) { keys['arrowup'] = false; keys['w'] = false; invScroll = Math.max(0, invScroll - 1); }
  if (keys['arrowdown'] || keys['s']) { keys['arrowdown'] = false; keys['s'] = false; invScroll = Math.min(Math.max(0, player.inventory.length - maxVisible), invScroll + 1); }

  // Close button
  const closeBtnW = 100, closeBtnH = 35;
  drawButton(cx - closeBtnW/2, canvasH - 45, closeBtnW, closeBtnH, 'Close [I]', false, '#333');
  if (clickedInRect(cx - closeBtnW/2, canvasH - 45, closeBtnW, closeBtnH) || keys['i'] || keys['I'] || keys['Escape']) {
    keys['i'] = false; keys['I'] = false; keys['Escape'] = false;
    SFX.click();
    gameState = STATE.DUNGEON;
  }
}

function useItemOutOfCombat(item) {
  if (item.effect === 'heal') {
    const heal = rollDice(item.healDice[0], item.healDice[1]) + (item.healBonus || 0);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addFloatingText(canvasW/2, canvasH/2, `+${heal} HP`, '#44ff44');
    SFX.heal();
  } else if (item.effect === 'cure_poison') {
    player.conditions = player.conditions.filter(c => c.type !== 'poisoned');
    SFX.heal();
  }
  const idx = player.inventory.findIndex(i => i.id === item.id);
  if (idx !== -1) player.inventory.splice(idx, 1);
}

// ============================================================
// FLOATING TEXTS
// ============================================================
function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1.5, maxLife: 1.5 });
}

function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.life -= dt;
    ft.y -= 30 * dt;

    if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }

    const alpha = ft.life / ft.maxLife;
    X.fillStyle = ft.color;
    X.globalAlpha = alpha;
    X.font = 'bold 16px Consolas, monospace';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(ft.text, ft.x, ft.y);
    X.globalAlpha = 1;
  }
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 200,
      vy: (Math.random() - 0.5) * 200,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8,
      color,
      size: 2 + Math.random() * 3,
    });
  }
}

function renderParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    X.fillStyle = p.color;
    X.globalAlpha = alpha;
    X.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  X.globalAlpha = 1;
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.size *= 0.98;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

  X.fillText(`Gold: ${player.gold}`, cx, 58);

  // Back button
  const bbw = 70, bbh = 30;
  drawButton(10, 10, bbw, bbh, '< Back', false, '#333');
  if (clickedInRect(10, 10, bbw, bbh)) {
    SFX.click();
    gameState = STATE.DUNGEON;
    return;
  }

  // ESC to close
  if (keys['escape']) {
    gameState = STATE.DUNGEON;
    keys['escape'] = false;
    return;
  }

  if (!shopRoom || !shopRoom.shopStock) { gameState = STATE.DUNGEON; return; }

  const itemH = isMobile ? 52 : 48;
  const gap = 4;
  const startY = 75;
  const stock = shopRoom.shopStock;
  const totalH = stock.length * (itemH + gap);
  const visH = canvasH - startY - 20;
  const maxScroll = 0;
  const minScroll = Math.min(0, -(totalH - visH));
  shopScrollY = clamp(shopScrollY, minScroll, maxScroll);

  stock.forEach((item, i) => {
    const y = startY + i * (itemH + gap) + shopScrollY;
    if (y + itemH < startY - 5 || y > canvasH + 5) return;

    const repMod = getRepTier(player.reputation).shopMod;
    const adjCost = Math.round(item.cost * repMod);
    const canBuy = player.gold >= adjCost && item.qty > 0;
    const isHov = isInRect(mouseX, mouseY, panelX, y, panelW, itemH);

    // Card background
    X.fillStyle = isHov ? '#2a2a3a' : '#1a1a2a';
    X.fillRect(panelX, y, panelW, itemH);
    X.strokeStyle = canBuy ? '#44ff88' : '#444';
    X.lineWidth = isHov ? 2 : 1;
    X.strokeRect(panelX, y, panelW, itemH);

    // Item name
    X.fillStyle = canBuy ? '#fff' : '#666';
    X.font = `bold ${isMobile ? 12 : 14}px Consolas, monospace`;
    X.textAlign = 'left';
    X.fillText(item.name, panelX + 10, y + 18);

    // Cost and qty (reputation-adjusted price)
    X.fillStyle = canBuy ? '#ffd700' : '#555';
    X.font = `${isMobile ? 10 : 12}px Consolas, monospace`;
    const priceLabel = repMod !== 1.0 ? `${adjCost}g (was ${item.cost}g)` : `${adjCost}g`;
    X.fillText(`${priceLabel} | Qty: ${item.qty}`, panelX + 10, y + 35);

    // Buy button
    if (canBuy) {
      const buyW = 60, buyH = 28;
      const buyX = panelX + panelW - buyW - 8;
      const buyY = y + (itemH - buyH) / 2;
      drawButton(buyX, buyY, buyW, buyH, 'BUY', false, '#2a5a2a');
      if (clickedInRect(buyX, buyY, buyW, buyH)) {
        SFX.chest();
        player.gold -= adjCost;
        item.qty--;

        // Create and add item to inventory
        if (item.item) {
          // It's a direct item template reference (potions, armor)
          const template = ITEM_TEMPLATES[item.item];
          if (template) {
            player.inventory.push(makeItem(template));
          }
        } else if (item.rarity === 'uncommon') {
          // Enhanced weapon
          const wpnList = UNCOMMON_WEAPONS;
          const wpn = wpnList[item.idx];
          if (wpn) {
            const base = ITEM_TEMPLATES[wpn.base];
            const enhanced = makeItem(base, RARITY.UNCOMMON);
            enhanced.name = wpn.name;
            enhanced.bonusDamage = wpn.bonusDamage;
            enhanced.desc = wpn.desc;
            player.inventory.push(enhanced);
          }
        } else if (item.rarity === 'rare') {
          const wpn = RARE_WEAPONS[item.idx];
          if (wpn) {
            const base = ITEM_TEMPLATES[wpn.base];
            const enhanced = makeItem(base, RARITY.RARE);
            enhanced.name = wpn.name;
            enhanced.bonusDamage = wpn.bonusDamage;
            enhanced.desc = wpn.desc;
            player.inventory.push(enhanced);
          }
        }

        addFloatingText(cx, canvasH / 2, `Bought ${item.name}!`, '#44ff88');
        if (item.qty <= 0) {
          shopRoom.shopStock = shopRoom.shopStock.filter(s => s.qty > 0);
        }
      }
    } else if (item.qty <= 0) {
      X.fillStyle = '#444';
      X.font = `${isMobile ? 10 : 12}px Consolas, monospace`;
      X.textAlign = 'right';
      X.fillText('SOLD OUT', panelX + panelW - 12, y + itemH / 2 + 4);
    }
  });

  // Sell section hint
  X.fillStyle = '#555';
  X.font = `${isMobile ? 10 : 12}px Consolas, monospace`;
  X.textAlign = 'center';
  X.fillText('Press I to open inventory and sell items', cx, canvasH - 8);

  updateFloatingTexts(0.016);
}

    X.fillStyle = '#44ff88';
    X.font = `${isMobile ? 10 : 12}px Consolas, monospace`;

  } else {
    X.fillStyle = '#888';
    X.font = `${isMobile ? 10 : 12}px Consolas, monospace`;
    X.fillText(`Party: ${(player.squad||[]).length}/4 companions`, cx, canvasH * 0.65);
  }

  // Companion inter-opinion hints
  if (!alreadyIn && player.squad && player.squad.length > 0) {
    const npcPool = COMPANION_POOL.find(c => c.name === npc.name);
    if (npcPool) {
      const opinions = [];
      player.squad.forEach(c => {
        const shortC = getCompShortName(c.name);
        if (npcPool.opinions?.likes?.includes(shortC)) opinions.push(`${npc.name} likes ${c.name}`);
        if (npcPool.opinions?.dislikes?.includes(shortC)) opinions.push(`${npc.name} dislikes ${c.name}`);
      });
      if (opinions.length > 0) {
        X.fillStyle = '#aaa';
        X.font = `${isMobile ? 9 : 11}px Consolas, monospace`;
        X.fillText(opinions[0], cx, canvasH * 0.68);

    }

  // Buttons

  const btnH = 45;
  const btnX = cx - btnW / 2;

  if (!alreadyIn) {

    drawButton(btnX, btnY1, btnW, btnH, canRecruit ? 'RECRUIT' : 'PARTY FULL', false, canRecruit ? '#2a5a2a' : '#333');
    if (canRecruit && clickedInRect(btnX, btnY1, btnW, btnH)) {
      SFX.click();
      const newComp = deepClone(npc);
      newComp.backstoryUnlocked = false;
      newComp.specialAbilityUsed = false;
      player.squad = player.squad || [];
      player.squad.push(newComp);

    dungeonMessageTimer = 1.5;
    gameState = STATE.DUNGEON;
  }

  // ESC to close
  if (keys['escape']) {
    gameState = STATE.DUNGEON;
    keys['escape'] = false;
  }
}

// ============================================================
// COMPANION COMBAT AI
// ============================================================
function companionTurn(comp) {
  if (!comp || comp.hp <= 0) return;
  const aliveEnemies = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0);
  if (aliveEnemies.length === 0) return;

  // Lyra special: arcane surge when ally just fell
  if (comp.name === 'Lyra Starweave' && combatState._fallenCompanions && combatState._fallenCompanions.length > 0 && !combatState._lyraSurgeUsed) {
    combatState._lyraSurgeUsed = true;
    const target = pick(aliveEnemies);
    const dmg = rollDice(3,4) + 3;
    target.entity.hp = Math.max(0, target.entity.hp - dmg);
    addCombatLog(`Lyra's Arcane Surge! Magic Missile for ${dmg} force damage!`);
    addFloatingText(canvasW/2, canvasH*0.3, `SURGE -${dmg}`, '#8888ff');
    SFX.spell();
    return;
  }

  // Healer companions heal lowest-HP party member if critical
  if (comp.canHeal) {
    // Find most injured ally
    const allies = [player, ...(player.squad || []).filter(c => c !== comp && c.hp > 0)];
    const injured = allies.find(a => a.hp < a.maxHp * 0.35);
    if (injured && Math.random() < 0.65) {
      const healAmt = rollDice(1, 8) + 2;
      injured.hp = Math.min(injured.maxHp, injured.hp + healAmt);
      const healTarget = injured === player ? 'you' : injured.name;
      addCombatLog(`${comp.name} heals ${healTarget} for ${healAmt} HP!`);
      addFloatingText(canvasW / 2, canvasH * 0.65, `+${healAmt}`, '#44ff44');
      SFX.heal();
      // Loyalty: healed player
      if (injured === player) comp.loyalty = Math.min(100, comp.loyalty + 1);
      return;
    }
  }

  // Attack a random enemy (Theron: target lowest HP if special ability not yet used)
  let target;
  if (comp.name === 'Theron Shadowstep' && !combatState._theronVolleyUsed) {
    combatState._theronVolleyUsed = true;
    const sorted = [...aliveEnemies].sort((a,b) => b.entity.hp - a.entity.hp);
    target = sorted[0];
    // Fires twice
    for (let shot = 0; shot < 2; shot++) {
      const attack = comp.attacks[0];
      const roll = d20();
      const totalRoll = roll + attack.bonus;
      if (roll >= 20 || (roll !== 1 && totalRoll >= target.entity.ac)) {
        const dmg = rollDice(attack.damage[0], attack.damage[1]) + attack.damageBonus;
        target.entity.hp = Math.max(0, target.entity.hp - dmg);
        addCombatLog(`Theron's Hunter's Volley (${shot+1}/2): HIT for ${dmg}!`);
        SFX.hit();
      } else {
        addCombatLog(`Theron's Hunter's Volley (${shot+1}/2): MISS`);
      }
      if (target.entity.hp <= 0) { addCombatLog(`${target.entity.name} defeated!`); break; }
    }
    return;
  }

  target = pick(aliveEnemies);
  const attack = comp.attacks[0];
  const roll = d20();
  const totalRoll = roll + attack.bonus;

  if (roll === 20) {
    const dmg = rollDice(attack.damage[0] * 2, attack.damage[1]) + attack.damageBonus;
    target.entity.hp = Math.max(0, target.entity.hp - dmg);
    addCombatLog(`${comp.name} uses ${attack.name}: NAT 20! CRIT for ${dmg}!`);
    SFX.crit();
  } else if (roll === 1) {
    addCombatLog(`${comp.name} uses ${attack.name}: NAT 1! Miss!`);
  } else if (totalRoll >= target.entity.ac) {
    let dmg = rollDice(attack.damage[0], attack.damage[1]) + attack.damageBonus;
    // Grimjaw berserker fury: double dmg on kills when below 50%
    if (comp.name === 'Grimjaw' && comp.hp < comp.maxHp * 0.5 && target.entity.hp <= dmg) {
      dmg *= 2;
      addCombatLog(`GRIMJAW FURY! Double damage: ${dmg}!`);
    }
    // Elara shadow strike: bonus once per combat
    if (comp.name === 'Elara the Swift' && !combatState._elaraShadowUsed) {
      combatState._elaraShadowUsed = true;
      const bonus = rollDice(2,4);
      dmg += bonus;
      addCombatLog(`Elara's Shadow Strike! +${bonus} bonus damage!`);
    }
    target.entity.hp = Math.max(0, target.entity.hp - dmg);
    addCombatLog(`${comp.name} uses ${attack.name} on ${target.entity.name}: HIT for ${dmg}!`);
    SFX.hit();
  } else {
    addCombatLog(`${comp.name} uses ${attack.name}: MISS! (${totalRoll} vs AC ${target.entity.ac})`);
  }
  if (target.entity.hp <= 0) addCombatLog(`${target.entity.name} defeated!`);
}

// ============================================================
// LOYALTY SYSTEM
// ============================================================
function applyLoyaltyEvent(event) {
  if (!player || !player.squad) return;
  const changes = COMPANION_OPINIONS[event];
  if (!changes) return;
  player.squad.forEach(comp => {
    const shortName = getCompShortName(comp.name);
    const delta = changes[shortName] || 0;
    if (delta === 0) return;
    const old = comp.loyalty;
    comp.loyalty = Math.max(0, Math.min(100, comp.loyalty + delta));
    if (comp.loyalty !== old && Math.abs(delta) >= 3) {
      const sign = delta > 0 ? '+' : '';
      addFloatingText(canvasW/2 + rand(-60,60), canvasH/2 - 80, `${comp.name}: ${sign}${delta} Loy`, delta > 0 ? '#44ff88' : '#ff6644');
    }
    // Loyalty-based events
    if (comp.loyalty <= 10 && old > 10) {
      dungeonMessage = `${comp.name} leaves the party in anger!`;
      dungeonMessageTimer = 3;
      setTimeout(() => { player.squad = player.squad.filter(c => c !== comp); }, 100);
    } else if (comp.loyalty <= 20 && old > 20) {
      dungeonMessage = `${comp.name} is thinking of leaving...`;
      dungeonMessageTimer = 2.5;
    } else if (comp.loyalty >= 80 && old < 80 && !comp.backstoryUnlocked) {
      comp.backstoryUnlocked = true;
      dungeonMessage = `${comp.name} opens up to you. Check the campfire for their story.`;
      dungeonMessageTimer = 3;
    }
  });
}

function getCompShortName(fullName) {
  if (fullName.startsWith('Elara')) return 'Elara';
  if (fullName.startsWith('Brother Aldric')) return 'Aldric';
  if (fullName === 'Grimjaw') return 'Grimjaw';
  if (fullName.startsWith('Lyra')) return 'Lyra';
  if (fullName.startsWith('Theron')) return 'Theron';
  if (fullName === 'Seraphina') return 'Seraphina';
  return fullName;
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveGame() {
  const saveData = {
    player: deepClone(player),
    dungeon: deepClone(dungeon),
    currentFloor: currentFloor,
    timestamp: Date.now(),
    version: '2.2',
  };
  try {
    localStorage.setItem('dof_save', JSON.stringify(saveData));
  } catch(e) {
    console.error('Save failed:', e);
  }
}

function loadGame() {
  try {
    const data = JSON.parse(localStorage.getItem('dof_save'));
    if (!data || !data.player || !data.dungeon) {
      dungeonMessage = 'Save data corrupted!';
      dungeonMessageTimer = 2;
      return;
    }
    player = data.player;
    if (player.reputation === undefined) player.reputation = 0;
    if (player.evolution === undefined) player.evolution = null;
    if (player.evolutionData === undefined) player.evolutionData = null;
    // v2.2 backward compat: migrate old companion to squad
    if (player.companion !== undefined && !player.squad) {
      player.squad = player.companion ? [player.companion] : [];
      delete player.companion;
    }
    if (!player.squad) player.squad = [];
    if (player.romanced === undefined) player.romanced = null;
    if (player.belovedShield === undefined) player.belovedShield = false;
    // Ensure squad members have loyalty
    player.squad.forEach(c => { if (c.loyalty === undefined) c.loyalty = 50; });
    dungeon = data.dungeon;
    currentFloor = data.currentFloor;
    gameState = STATE.DUNGEON;
    revealArea(player.x, player.y, player.torchRadius);
    dungeonMessage = 'Game loaded!';
    dungeonMessageTimer = 1.5;
  } catch(e) {
    console.error('Load failed:', e);
    dungeonMessage = 'Failed to load!';
    dungeonMessageTimer = 2;
  }
}

// ============================================================
// PARTY MANAGEMENT SCREEN
// ============================================================
function updatePartyMgmt() {
  X.fillStyle = '#0a0a0f';
  X.fillRect(0, 0, canvasW, canvasH);

  const cx = canvasW / 2;

  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 18 : 22}px Consolas, monospace`;
  X.textAlign = 'center';
  X.fillText('PARTY MANAGEMENT', cx, 30);

  X.fillStyle = '#aaa';
  X.font = '13px Consolas, monospace';
  X.fillText(`Squad: ${(player.squad||[]).length}/4`, cx, 52);

  const panelW = Math.min(canvasW - 20, 460);
  const panelX = cx - panelW / 2;

  if (!player.squad || player.squad.length === 0) {
    X.fillStyle = '#555';
    X.font = '14px Consolas, monospace';
    X.fillText('No companions in your squad.', cx, canvasH / 2);
    X.fillText('Recruit companions from NPC rooms in the dungeon.', cx, canvasH / 2 + 22);
  } else {
    const cardH = isMobile ? 110 : 120;
    const gap = 10;
    const startY = 70;
    player.squad.forEach((comp, idx) => {
      const cy2 = startY + idx * (cardH + gap) + (partyMgmtScroll || 0);
      if (cy2 + cardH < 60 || cy2 > canvasH - 50) return;

      const loyPct = comp.loyalty / 100;
      const loyColor = comp.loyalty >= 90 ? '#ff88aa' : comp.loyalty >= 80 ? '#ffd700' : comp.loyalty >= 50 ? '#44aaff' : comp.loyalty >= 20 ? '#ff8800' : '#ff2222';

      X.fillStyle = '#1a1a2a';
      X.fillRect(panelX, cy2, panelW, cardH);
      X.strokeStyle = comp.color;
      X.lineWidth = 2;
      X.strokeRect(panelX, cy2, panelW, cardH);

      // Companion symbol
      X.fillStyle = comp.color;
      X.beginPath(); X.arc(panelX + 28, cy2 + 28, 20, 0, Math.PI * 2); X.fill();
      X.fillStyle = '#fff';
      X.font = 'bold 14px Consolas, monospace';
      X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(comp.symbol, panelX + 28, cy2 + 29);

      // Name & class
      X.textAlign = 'left'; X.textBaseline = 'alphabetic';
      X.fillStyle = '#fff';
      X.font = `bold ${isMobile ? 13 : 15}px Consolas, monospace`;
      const romanceTag = player.romanced === comp.name ? ' ♥' : '';
      X.fillText(`${comp.name}${romanceTag}`, panelX + 56, cy2 + 18);
      X.fillStyle = '#aaa';
      X.font = '11px Consolas, monospace';
      X.fillText(comp.class, panelX + 56, cy2 + 32);

      // HP bar
      X.fillStyle = '#300';
      X.fillRect(panelX + 56, cy2 + 38, panelW - 130, 8);
      const hpPct = comp.hp / comp.maxHp;
      X.fillStyle = hpPct > 0.5 ? '#0c0' : hpPct > 0.25 ? '#cc0' : '#c00';
      X.fillRect(panelX + 56, cy2 + 38, (panelW - 130) * hpPct, 8);
      X.fillStyle = '#888';
      X.font = '10px Consolas, monospace';
      X.fillText(`HP: ${comp.hp}/${comp.maxHp}`, panelX + 56, cy2 + 58);

      // Loyalty bar
      X.fillStyle = '#220';
      X.fillRect(panelX + 56, cy2 + 62, panelW - 130, 6);
      X.fillStyle = loyColor;
      X.fillRect(panelX + 56, cy2 + 62, (panelW - 130) * loyPct, 6);

      const loyLabel = comp.loyalty >= 90 ? 'Romance available!' : comp.loyalty >= 80 ? 'Backstory unlocked!' : comp.loyalty >= 20 ? `Loyalty: ${comp.loyalty}` : 'May leave soon!';
      X.fillStyle = loyColor;
      X.font = '10px Consolas, monospace';
      X.fillText(loyLabel, panelX + 56, cy2 + 80);

      // Personality
      X.fillStyle = '#666';
      X.font = `italic ${isMobile ? 9 : 10}px Consolas, monospace`;
      const shortPersonality = comp.personality.length > 55 ? comp.personality.substr(0, 52) + '...' : comp.personality;
      X.fillText(shortPersonality, panelX + 10, cy2 + cardH - 10);

      // Dismiss button
      const dismissW = 65, dismissH = 26;
      const dismissX = panelX + panelW - dismissW - 8;
      const dismissY = cy2 + (cardH - dismissH) / 2;
      drawButton(dismissX, dismissY, dismissW, dismissH, 'Dismiss', false, '#4a1a1a');
      if (clickedInRect(dismissX, dismissY, dismissW, dismissH)) {
        SFX.click();
        // Loyalty penalty for companions who liked dismissed one
        player.squad.forEach(other => {
          const compPool = COMPANION_POOL.find(c => c.name === other.name);
          if (compPool?.opinions?.likes?.some(n => comp.name.includes(n) || comp.name.startsWith(n))) {
            other.loyalty = Math.max(0, other.loyalty - 3);
          }
        });
        player.squad.splice(idx, 1);
        dungeonMessage = `${comp.name} has been dismissed.`;
        dungeonMessageTimer = 2;
      }
    });
  }

  // Romance section hint
  const romanceables = (player.squad || []).filter(c => c.romanceable && c.loyalty >= 90 && player.romanced !== c.name);
  if (romanceables.length > 0 && !player.romanced) {
    X.fillStyle = '#ff88aa';
    X.font = 'bold 12px Consolas, monospace';
    X.textAlign = 'center';
    const ry = canvasH - 90;
    X.fillText(`♥ Romance available with: ${romanceables.map(c=>c.name.split(' ')[0]).join(', ')}`, cx, ry);
    X.fillStyle = '#aaa';
    X.font = '11px Consolas, monospace';
    X.fillText('Visit the campfire at the next town to pursue romance.', cx, ry + 16);
  }
  if (player.romanced) {
    X.fillStyle = '#ff88aa';
    X.font = '11px Consolas, monospace';
    X.textAlign = 'center';
    X.fillText(`♥ Romanced: ${player.romanced} — Beloved's Shield active (+1 AC)`, cx, canvasH - 76);
  }

  // Close button
  const closeBtnW = 100, closeBtnH = 35;
  drawButton(cx - closeBtnW/2, canvasH - 45, closeBtnW, closeBtnH, 'Close [P]', false, '#333');
  if (clickedInRect(cx - closeBtnW/2, canvasH - 45, closeBtnW, closeBtnH) || keys['p'] || keys['P'] || keys['Escape']) {
    keys['p'] = false; keys['P'] = false; keys['Escape'] = false;
    SFX.click();
    gameState = STATE.DUNGEON;
  }
}
