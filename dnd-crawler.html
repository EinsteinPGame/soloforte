let townNpcIdx = 0;
let townScrollY2 = 0;

function updateTown() {
  X.fillStyle = '#0a0a0f';
  X.fillRect(0, 0, canvasW, canvasH);

  if (!townData) { gameState = STATE.DUNGEON; return; }

  const cx = canvasW / 2;

  // Town header
  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 20 : 26}px Consolas, monospace`;
  X.textAlign = 'center';
  X.fillText('TOWN OF HEARTHREST', cx, 35);

  X.fillStyle = '#888';
  X.font = '13px Consolas, monospace';
  X.fillText(`Between Floor ${townData.floorCleared + 1} and Floor ${townData.nextFloor + 1}`, cx, 55);

  // Draw simple town layout (building icons row)
  const bldW = isMobile ? 55 : 70, bldH = isMobile ? 45 : 55;
  const bldY = 70;
  const bldGap = isMobile ? 8 : 14;
  const buildings = [
    { name: 'Tavern', color: '#a06030', icon: 'T', desc: 'Rest & rumors' },
    { name: 'Barracks', color: '#606080', icon: 'B', desc: 'Recruit allies' },
    { name: 'Bounty', color: '#c08020', icon: '$', desc: 'Contracts' },
    { name: 'Campfire', color: '#c04010', icon: '🔥', desc: 'Party talk' },
  ];
  const totalBW = buildings.length * (bldW + bldGap) - bldGap;
  const bldStartX = cx - totalBW / 2;

  buildings.forEach((bld, i) => {
    const bx = bldStartX + i * (bldW + bldGap);
    const hov = isInRect(mouseX, mouseY, bx, bldY, bldW, bldH);
    X.fillStyle = hov ? bld.color : darkenColor(bld.color, 0.6);
    X.fillRect(bx, bldY, bldW, bldH);
    X.strokeStyle = hov ? '#fff' : '#666';
    X.lineWidth = hov ? 2 : 1;
    X.strokeRect(bx, bldY, bldW, bldH);
    X.fillStyle = '#fff';
    X.font = `bold ${isMobile ? 13 : 16}px Consolas, monospace`;
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(bld.icon, bx + bldW/2, bldY + bldH/2 - 6);
    X.font = `${isMobile ? 8 : 10}px Consolas, monospace`;
    X.fillText(bld.name, bx + bldW/2, bldY + bldH/2 + 10);
    X.fillStyle = '#aaa';
    X.font = `${isMobile ? 7 : 9}px Consolas, monospace`;
    X.fillText(bld.desc, bx + bldW/2, bldY + bldH/2 + 22);
  });

  const contentY = bldY + bldH + 18;
  const panelW = Math.min(canvasW - 20, 460);
  const panelX = cx - panelW / 2;

  // Tavern
  const tavX = bldStartX;
  if (clickedInRect(tavX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'tavern';
  }
  // Barracks
  const barX = bldStartX + (bldW + bldGap);
  if (clickedInRect(barX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'barracks';
  }
  // Bounty
  const bntX = bldStartX + 2 * (bldW + bldGap);
  if (clickedInRect(bntX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'bounty';
  }
  // Campfire
  const cfX = bldStartX + 3 * (bldW + bldGap);
  if (clickedInRect(cfX, bldY, bldW, bldH)) {
    SFX.click(); townData.activeSection = 'campfire';
  }

  const section = townData.activeSection || 'tavern';

  // Draw section content
  X.fillStyle = '#1a1a2a';
  X.fillRect(panelX, contentY, panelW, canvasH - contentY - 55);
  X.strokeStyle = '#444';
  X.lineWidth = 1;
  X.strokeRect(panelX, contentY, panelW, canvasH - contentY - 55);

  if (section === 'tavern') {
    drawTownTavern(panelX, contentY, panelW, cx);
  } else if (section === 'barracks') {
    drawTownBarracks(panelX, contentY, panelW, cx);
  } else if (section === 'bounty') {
    drawTownBounty(panelX, contentY, panelW, cx);
  } else if (section === 'campfire') {
    drawTownCampfire(panelX, contentY, panelW, cx);
  }

  // Descend button
  const descW = isMobile ? 160 : 200, descH = 40;
  drawButton(cx - descW/2, canvasH - 48, descW, descH, `Descend to Floor ${townData.nextFloor + 1}`, false, '#2a2a4a');
  if (clickedInRect(cx - descW/2, canvasH - 48, descW, descH)) {
    SFX.stairs();
    currentFloor = townData.nextFloor;
    player.floor = currentFloor;
    const startRoom = dungeon.floors[currentFloor].rooms[0];
    player.x = startRoom.cx;
    player.y = startRoom.cy;
    revealArea(player.x, player.y, player.torchRadius);
    dungeonMessage = `Descended to Floor ${currentFloor + 1}`;
    dungeonMessageTimer = 2;
    townData = null;
    gameState = STATE.DUNGEON;
    saveGame();
  }

  updateFloatingTexts(0.016);
}

function drawTownTavern(px, py, pw, cx) {
  X.fillStyle = '#ffd700';
  X.font = 'bold 14px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText('THE RUSTY FLAGON TAVERN', cx, py + 18);

  const repTier = getRepTier(player.reputation);
  const canHealFree = player.reputation >= 50;
  const healCost = canHealFree ? 0 : 20;

  // NPC dialogue
  const npc = TOWN_NPCS[0];
  X.fillStyle = npc.color;
  X.font = 'bold 12px Consolas, monospace';
  X.textAlign = 'left';
  X.fillText(`${npc.name} says:`, px + 10, py + 38);
  X.fillStyle = '#ccc';
  X.font = 'italic 11px Consolas, monospace';
  const npcLine = npc.lines[townData.floorCleared % npc.lines.length];
  const npcLines = wrapText(npcLine, pw - 20, 11);
  npcLines.forEach((line, i) => X.fillText(line, px + 10, py + 52 + i * 14));

  const actY = py + 52 + npcLines.length * 14 + 10;

  // Rest/heal option
  const hLabel = canHealFree ? 'REST (Free - High Rep)' : `REST (${healCost} gold)`;
  const canAfford = player.gold >= healCost;
  drawButton(cx - 120, actY, 240, 36, hLabel, false, (canAfford || canHealFree) ? '#2a4a2a' : '#333');
  if (clickedInRect(cx - 120, actY, 240, 36) && (canAfford || canHealFree) && !townData.healUsed) {
    SFX.heal();
    player.gold -= healCost;
    player.hp = player.maxHp;
    player.spellSlots = player.maxSpellSlots;
    player.secondWindUsed = false; player.actionSurgeUsed = false;
    player.rageCount = 0; player.kiPoints = player.maxKiPoints;
    player.sorceryPoints = player.maxSorceryPoints;
    if (player.squad) player.squad.forEach(c => { c.hp = c.maxHp; });
    townData.healUsed = true;
    addFloatingText(canvasW/2, canvasH/2, 'FULLY RESTED!', '#44ff44');
  }
  if (townData.healUsed) {
    X.fillStyle = '#44ff44'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('Party fully rested!', cx, actY + 50);
  }

  // Rumors (random flavor)
  const rumors = [
    '"Heard the next floor has traps that make the last look like puddles..."',
    '"A wizard came through last month. We haven\'t seen him since."',
    '"Strange lights below. Could be treasure. Could be something worse."',
    '"The boss on the next floor... I won\'t say the name. Bad luck."',
    '"Three adventurers went down yesterday. Two came back. One doesn\'t talk anymore."',
  ];
  const rumor = rumors[(townData.nextFloor + Math.floor(gameTime * 0.1)) % rumors.length];
  X.fillStyle = '#666'; X.font = 'italic 10px Consolas, monospace'; X.textAlign = 'center';
  const rumorLines = wrapText(`Rumor: ${rumor}`, pw - 20, 10);
  rumorLines.forEach((line, i) => X.fillText(line, cx, actY + 65 + i * 13));

  // Reputation indicator
  X.fillStyle = repTier.color; X.font = '11px Consolas, monospace'; X.textAlign = 'center';
  X.fillText(`Reputation: ${repTier.name} — ${repTier.desc}`, cx, actY + 65 + rumorLines.length * 13 + 14);
}

function drawTownBarracks(px, py, pw, cx) {
  X.fillStyle = '#a0a0d0';
  X.font = 'bold 14px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText('BARRACKS — RECRUIT COMPANIONS', cx, py + 18);

  const guardNpc = TOWN_NPCS[1];
  X.fillStyle = guardNpc.color;
  X.font = 'bold 12px Consolas, monospace';
  X.textAlign = 'left';
  X.fillText(`${guardNpc.name} says:`, px + 10, py + 38);
  X.fillStyle = '#ccc'; X.font = 'italic 11px Consolas, monospace';
  const gl = guardNpc.lines[townData.floorCleared % guardNpc.lines.length];
  const gLines = wrapText(gl, pw - 20, 11);
  gLines.forEach((line, i) => X.fillText(line, px + 10, py + 52 + i * 14));

  const cardY = py + 52 + gLines.length * 14 + 10;
  const squadFull = (player.squad || []).length >= 4;

  // Show available companions not already in squad
  const available = COMPANION_POOL.filter(c => !(player.squad || []).some(s => s.name === c.name));
  if (available.length === 0) {
    X.fillStyle = '#888'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('All available companions are already in your party!', cx, cardY + 20);
  } else if (squadFull) {
    X.fillStyle = '#ff8800'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('Party is full (4/4). Dismiss a member first.', cx, cardY + 20);
  } else {
    available.slice(0, 3).forEach((npc, i) => {
      const cy = cardY + i * 54;
      X.fillStyle = '#222233';
      X.fillRect(px + 5, cy, pw - 10, 50);
      X.strokeStyle = npc.color; X.lineWidth = 1;
      X.strokeRect(px + 5, cy, pw - 10, 50);
      X.fillStyle = npc.color; X.beginPath(); X.arc(px + 22, cy + 25, 14, 0, Math.PI * 2); X.fill();
      X.fillStyle = '#fff'; X.font = 'bold 10px Consolas, monospace'; X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(npc.symbol, px + 22, cy + 26);
      X.textAlign = 'left'; X.textBaseline = 'alphabetic';
      X.fillStyle = '#fff'; X.font = 'bold 11px Consolas, monospace';
      X.fillText(`${npc.name} (${npc.class})`, px + 40, cy + 17);
      X.fillStyle = '#888'; X.font = '9px Consolas, monospace';
      const short = npc.personality.length > 55 ? npc.personality.substr(0,52)+'...' : npc.personality;
      X.fillText(short, px + 40, cy + 30);
      X.fillStyle = '#aaa'; X.font = '9px Consolas, monospace';
      X.fillText(`HP:${npc.hp} AC:${npc.ac} | ${npc.attacks[0].name}`, px + 40, cy + 43);

      drawButton(px + pw - 70, cy + 12, 60, 26, 'Recruit', false, '#2a4a2a');
      if (clickedInRect(px + pw - 70, cy + 12, 60, 26) && !squadFull) {
        SFX.click();
        const newComp = deepClone(npc);
        newComp.backstoryUnlocked = false; newComp.specialAbilityUsed = false;
        player.squad = player.squad || [];
        player.squad.push(newComp);
        dungeonMessage = `${npc.name} joins your squad!`;
        dungeonMessageTimer = 2;
        addFloatingText(canvasW/2, canvasH/2, `+${npc.name}`, npc.color);
      }
    });
  }

  X.fillStyle = '#888'; X.font = '10px Consolas, monospace'; X.textAlign = 'center';
  X.fillText(`Squad: ${(player.squad||[]).length}/4`, cx, py + (canvasH - py - 60));
}

function drawTownCampfire(px, py, pw, cx) {
  X.fillStyle = '#ff8833';
  X.font = 'bold 14px Consolas, monospace';
  X.textAlign = 'center';
  X.fillText('CAMPFIRE — PARTY CONVERSATIONS', cx, py + 18);

  // Animated fire particles
  if (Math.random() < 0.4) {
    spawnParticles(cx, py + 60, '#ff6600', 2);

  }

  X.fillText(`${sage.name} ponders nearby:`, px + 10, py + 38);
  X.fillStyle = '#ccc'; X.font = 'italic 10px Consolas, monospace';
  const sageLine = sage.lines[townData.floorCleared % sage.lines.length];
  const sageLines = wrapText(sageLine, pw - 20, 10);
  sageLines.forEach((line, i) => X.fillText(line, px + 10, py + 51 + i * 13));

  const actY = py + 51 + sageLines.length * 13 + 14;

  if (!player.squad || player.squad.length === 0) {
    X.fillStyle = '#555'; X.font = '12px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('No companions to talk to.', cx, actY + 20);
    return;
  }

  // Show companion conversations/backstories
  X.fillStyle = '#ffd700'; X.font = 'bold 12px Consolas, monospace'; X.textAlign = 'center';

  player.squad.forEach((comp, i) => {
    const by2 = actY + 14 + i * (compBtnH + 6);
    const hasBackstory = comp.backstoryUnlocked || comp.loyalty >= 80;
    const canRomance = comp.romanceable && comp.loyalty >= 90 && player.romanced !== comp.name && !player.romanced;
    const label = canRomance ? `♥ ${comp.name.split(' ')[0]}` : hasBackstory ? `★ ${comp.name.split(' ')[0]}` : comp.name.split(' ')[0];
    const color = canRomance ? '#4a1a2a' : hasBackstory ? '#2a3a1a' : '#1a1a2a';
    drawButton(cx - compBtnW/2, by2, compBtnW, compBtnH, label, false, color, canRomance ? '#ff88aa' : hasBackstory ? '#aaffaa' : '#aaa');
    if (clickedInRect(cx - compBtnW/2, by2, compBtnW, compBtnH)) {
      SFX.click();
      campfireCompanion = comp;
      campfireScene = { stage: canRomance ? 'romance_intro' : hasBackstory ? 'backstory' : 'chat', choiceIdx: 0, romanceChosen: false };
      gameState = STATE.CAMPFIRE;
    }
  });
}

// ============================================================
// CAMPFIRE SCENE SCREEN
// ============================================================
function updateCampfire() {
  X.fillStyle = '#0a0608';
  X.fillRect(0, 0, canvasW, canvasH);

  if (!campfireCompanion || !campfireScene) { gameState = STATE.TOWN; return; }

  const comp = campfireCompanion;
  const cx = canvasW / 2;

  // Firelight glow
  const t = gameTime * 2;
  const grad = X.createRadialGradient(cx, canvasH * 0.5, 10, cx, canvasH * 0.5, 200);
  grad.addColorStop(0, `rgba(255,120,20,${0.15 + Math.sin(t) * 0.05})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  X.fillStyle = grad; X.fillRect(0, 0, canvasW, canvasH);

  // Fire particles
  if (Math.random() < 0.3) spawnParticles(cx, canvasH * 0.5 + 30, '#ff6600', 2);

  // Companion portrait
  X.fillStyle = comp.color + '30';
  X.beginPath(); X.arc(cx, canvasH * 0.2, 55, 0, Math.PI * 2); X.fill();
  X.fillStyle = comp.color;
  X.beginPath(); X.arc(cx, canvasH * 0.2, 42, 0, Math.PI * 2); X.fill();
  X.fillStyle = '#fff'; X.font = 'bold 26px Consolas, monospace';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(comp.symbol, cx, canvasH * 0.2 + 1);

  X.textBaseline = 'alphabetic';
  X.fillStyle = '#ffd700'; X.font = `bold ${isMobile ? 16 : 20}px Consolas, monospace`;
  X.fillText(comp.name, cx, canvasH * 0.2 + 65);

  // Loyalty display
  const loyColor = comp.loyalty >= 90 ? '#ff88aa' : comp.loyalty >= 80 ? '#ffd700' : '#44aaff';
  X.fillStyle = loyColor; X.font = '12px Consolas, monospace';
  X.fillText(`Loyalty: ${comp.loyalty}/100`, cx, canvasH * 0.2 + 82);

  // Scene content based on stage
  const panelW = Math.min(canvasW - 30, 440);
  const panelX = cx - panelW / 2;
  const textY = canvasH * 0.37;

  X.fillStyle = 'rgba(0,0,0,0.7)';
  X.fillRect(panelX, textY - 10, panelW, canvasH * 0.45);
  X.strokeStyle = comp.color + '88'; X.lineWidth = 1;
  X.strokeRect(panelX, textY - 10, panelW, canvasH * 0.45);

  if (campfireScene.stage === 'chat') {
    // Generic chat based on loyalty
    const chatLines = getChatLines(comp);
    X.fillStyle = '#ccc'; X.font = `italic ${isMobile ? 12 : 13}px Consolas, monospace`;
    X.textAlign = 'center';
    chatLines.forEach((line, i) => {
      const lns = wrapText(line, panelW - 20, isMobile ? 12 : 13);
      lns.forEach((l, j) => X.fillText(l, cx, textY + 10 + (campfireScene._lineOffset || 0) + (i * 50 + j) * 16));
    });

    drawButton(cx - 60, canvasH - 70, 120, 36, 'Done', false, '#333');
    if (clickedInRect(cx - 60, canvasH - 70, 120, 36)) {
      SFX.click(); comp.loyalty = Math.min(100, comp.loyalty + 1);
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }

  } else if (campfireScene.stage === 'backstory') {
    X.fillStyle = comp.color; X.font = 'bold 13px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('PERSONAL STORY', cx, textY + 8);
    X.fillStyle = '#ddd'; X.font = `${isMobile ? 11 : 13}px Consolas, monospace`;
    const bLines = wrapText(comp.backstory || '"I have nothing more to say."', panelW - 20, isMobile ? 11 : 13);
    bLines.forEach((line, i) => X.fillText(line, cx, textY + 30 + i * 17));

    X.fillStyle = '#aaa'; X.font = '11px Consolas, monospace';
    X.fillText(`(Loyalty increases from hearing this)`, cx, textY + 30 + bLines.length * 17 + 14);

    drawButton(cx - 60, canvasH - 70, 120, 36, 'Thank them', false, '#2a3a2a');
    if (clickedInRect(cx - 60, canvasH - 70, 120, 36)) {
      SFX.click(); comp.loyalty = Math.min(100, comp.loyalty + 3);
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }

  } else if (campfireScene.stage === 'romance_intro') {
    X.fillStyle = '#ff88aa'; X.font = 'bold 13px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('A PRIVATE MOMENT', cx, textY + 8);

    const romanceIntros = {
      'Elara the Swift': '"You know... I don\'t usually trust people. Especially people who drag me into cursed dungeons. But here we are. And I\'m not... unhappy about it."',
      'Lyra Starweave': '"I\'ve been cataloguing everything on this expedition. The ruins, the monsters, the spells. But I keep finding myself adding notes about... you. Strange. Very unscientific."',
      'Seraphina': '"My oath says nothing about this. My heart, however, has been rather loud lately. I have tried to ignore it. I find I cannot."',
    };

    const intro = romanceIntros[comp.name] || '"There is something I have been meaning to say..."';
    X.fillStyle = '#ddd'; X.font = `italic ${isMobile ? 12 : 13}px Consolas, monospace`;
    const rLines = wrapText(intro, panelW - 20, isMobile ? 12 : 13);
    rLines.forEach((line, i) => X.fillText(line, cx, textY + 30 + i * 17));

    const choiceY = textY + 30 + rLines.length * 17 + 20;
    const btnW2 = 160, btnH2 = 34;
    drawButton(cx - btnW2 - 6, choiceY, btnW2, btnH2, 'I feel the same.', false, '#2a1a3a', '#ff88aa');
    drawButton(cx + 6, choiceY, btnW2, btnH2, 'We should focus.', false, '#333');

    if (clickedInRect(cx - btnW2 - 6, choiceY, btnW2, btnH2)) {
      SFX.heal();
      campfireScene.stage = 'romance_accepted';
    }
    if (clickedInRect(cx + 6, choiceY, btnW2, btnH2)) {
      SFX.click();
      comp.loyalty = Math.max(0, comp.loyalty - 2);
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }

  } else if (campfireScene.stage === 'romance_accepted') {
    X.fillStyle = '#ff88aa'; X.font = 'bold 13px Consolas, monospace'; X.textAlign = 'center';
    X.fillText('♥ ROMANCE KINDLED ♥', cx, textY + 8);

    const romanceAccepts = {
      'Elara the Swift': '"Well. Don\'t make it weird. But... good. That\'s good. I have your back. Always have."',
      'Lyra Starweave': '"Oh! That is — I will need to update my notes significantly. This is wonderful. You are wonderful."',
      'Seraphina': '"Then by my oath and my heart both — I will not let harm come to you. Not while I stand."',
    };

    const acc = romanceAccepts[comp.name] || '"I am glad."';
    X.fillStyle = '#ddd'; X.font = `italic ${isMobile ? 12 : 13}px Consolas, monospace`;
    const aLines = wrapText(acc, panelW - 20, isMobile ? 12 : 13);
    aLines.forEach((line, i) => X.fillText(line, cx, textY + 30 + i * 17));

    X.fillStyle = '#ffaacc'; X.font = '12px Consolas, monospace';
    X.fillText("Beloved's Shield: +1 AC while they are in your party.", cx, textY + 30 + aLines.length * 17 + 18);

    drawButton(cx - 70, canvasH - 70, 140, 36, 'Continue', false, '#2a1a3a');
    if (clickedInRect(cx - 70, canvasH - 70, 140, 36)) {
      SFX.levelUp();
      player.romanced = comp.name;
      player.belovedShield = true;
      comp.loyalty = Math.min(100, comp.loyalty + 5);
      addFloatingText(canvasW/2, canvasH/2, '♥ ROMANCED ♥', '#ff88aa');
      campfireCompanion = null; campfireScene = null; gameState = STATE.TOWN;
    }
  }

  renderParticles();
}

function getChatLines(comp) {
  if (comp.loyalty >= 80) {
    return [comp.opinions?.bossComment || '"Ready for whatever comes next."',
            '"I trust you. Don\'t make me regret it."'];
  } else if (comp.loyalty >= 50) {
    return [`"${comp.name.split(' ')[0]}... this dungeon is something else."`,
            '"Staying alive. That\'s the plan."'];
  } else if (comp.loyalty <= 30) {
    return ['"I\'m not sure about this anymore."',
            '"We should talk about whether I\'m staying."'];
  }
  return ['"Another floor down. Onward."',
          comp.opinions?.treasureComment || '"We press on."'];
}

// ============================================================
// AC BONUS FOR ROMANCE
// ============================================================
// Patch calcAC to include beloved's shield
const _origCalcAC = calcAC;
function calcAC() {
  let ac = _origCalcAC();
  if (player && player.belovedShield && player.romanced) {
    const belovedInParty = (player.squad || []).some(c => c.name === player.romanced && c.hp > 0);
    if (belovedInParty) ac += 1;
  }
  return ac;
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  gameTime += dt;

  switch (gameState) {
    case STATE.TITLE:        updateTitle(); break;
    case STATE.CHAR_CREATE:  updateCharCreate(); break;
    case STATE.DUNGEON:      updateDungeon(dt); break;
    case STATE.COMBAT:       updateCombat(dt); break;
    case STATE.INVENTORY:    updateInventory(); break;
    case STATE.CHAR_SHEET:   updateCharSheet(); break;
    case STATE.GAME_OVER:    updateGameOver(); break;
    case STATE.VICTORY:      updateVictory(); break;
    case STATE.HELP:         updateHelp(); break;
    case STATE.LEVEL_UP:     updateLevelUp(); break;
    case STATE.SHOP:         updateShop(); break;
    case STATE.NPC_TALK:     updateNpcTalk(); break;
    case STATE.EVOLUTION:    updateEvolution(); break;
    case STATE.PARTY_MGMT:   updatePartyMgmt(); break;
    case STATE.TOWN:         updateTown(); break;
    case STATE.CAMPFIRE:     updateCampfire(); break;
  }

  updateParticles(dt);

  // Reset click
  mouseClicked = false;

  requestAnimationFrame(gameLoop);
}

// Handle ? key globally
document.addEventListener('keydown', e => {
  if (e.key === '?' && gameState === STATE.DUNGEON) {
    gameState = STATE.HELP;
    e.preventDefault();
  }
});

// Start
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
