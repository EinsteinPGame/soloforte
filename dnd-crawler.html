let canvasW = 0, canvasH = 0, scaleFactor = 1;
function resize() {
  const w = innerWidth, h = innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvasW = w; canvasH = h;
  C.width = w * dpr; C.height = h * dpr;
  C.style.width = w + 'px'; C.style.height = h + 'px';
  C.style.position = 'absolute'; C.style.left = '0px'; C.style.top = '0px';
  X.setTransform(dpr, 0, 0, dpr, 0, 0);
  scaleFactor = dpr;
}
addEventListener('resize', resize); resize();

function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rollDice(num, sides) { let t = 0; for (let i = 0; i < num; i++) t += rand(1, sides); return t; }
function d20() { return rand(1, 20); }
function mod(score) { return Math.floor((score - 10) / 2); }
function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

const SFX = {
  ctx: null,
  _init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} },
  _tone(freq, dur, type, vol, delay) {
    this._init(); if (!this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  _noise(dur, vol) {
    this._init(); if (!this.ctx) return;
    const bufSz = this.ctx.sampleRate * dur;
    const buf = this.ctx.createBuffer(1, bufSz, this.ctx.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < bufSz; i++) d[i] = (Math.random() * 2 - 1) * (vol || 0.1);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = buf; g.gain.setValueAtTime(vol || 0.1, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    s.connect(g); g.connect(this.ctx.destination); s.start(); s.stop(this.ctx.currentTime + dur);
  },
  hit() { this._tone(200, 0.12, 'sine', 0.18); this._noise(0.1, 0.1); },
  crit() { this._tone(600, 0.08, 'sawtooth', 0.25); this._tone(900, 0.1, 'square', 0.22, 0.04); },
  miss() { this._tone(150, 0.1, 'triangle', 0.08); },
  heal() { this._tone(523, 0.15, 'sine', 0.15); this._tone(659, 0.15, 'sine', 0.12, 0.1); this._tone(784, 0.2, 'sine', 0.1, 0.2); },
  death() { this._tone(400, 0.3, 'sine', 0.2); this._tone(300, 0.4, 'sine', 0.15, 0.3); this._tone(200, 0.5, 'sine', 0.1, 0.6); },
  levelUp() { [523, 659, 784, 1047].forEach((f, i) => this._tone(f, 0.25, 'sine', 0.2, i * 0.1)); },
  click() { this._tone(800, 0.04, 'square', 0.06); },
  door() { this._tone(200, 0.15, 'triangle', 0.1); this._tone(150, 0.2, 'triangle', 0.08, 0.1); },
  trap() { this._tone(100, 0.2, 'sawtooth', 0.2); this._noise(0.15, 0.15); },
  chest() { this._tone(440, 0.1, 'sine', 0.15); this._tone(660, 0.1, 'sine', 0.12, 0.08); this._tone(880, 0.15, 'sine', 0.1, 0.16); },
  spell() { this._tone(800, 0.1, 'triangle', 0.15); this._tone(1200, 0.08, 'triangle', 0.1, 0.05); this._tone(600, 0.12, 'sine', 0.08, 0.1); },
  stairs() { [300, 400, 500, 600, 700].forEach((f, i) => this._tone(f, 0.1, 'sine', 0.1, i * 0.06)); },
  save() { this._tone(523, 0.2, 'sine', 0.12); this._tone(784, 0.2, 'sine', 0.1, 0.15); },
};

let conflictsThisFloor = 0; // max 1 per floor
let pendingConflict = null; // { conflict, compA, compB } — set when triggered, resolved at campfire
let conflictHistory = []; // track past conflicts for variety

// Check if a conflict should trigger between squad members
function checkCompanionConflict() {
  if (!player || !player.squad || player.squad.length < 2) return false;
  if (conflictsThisFloor >= 1) return false;
  if (pendingConflict) return false;

  // Gather all possible clashing pairs
  const pairs = [];
  for (let i = 0; i < player.squad.length; i++) {
    for (let j = i + 1; j < player.squad.length; j++) {
      const a = player.squad[i], b = player.squad[j];
      const nameA = getCompShortName(a.name), nameB = getCompShortName(b.name);
      const traitsA = COMPANION_TRAITS[nameA], traitsB = COMPANION_TRAITS[nameB];
      if (!traitsA || !traitsB) continue;

      // Check if any trait of A opposes any trait of B
      for (const tA of traitsA.traits) {
        if (traitsB.opposes.includes(tA)) {
          for (const tB of traitsB.traits) {
            if (traitsA.opposes.includes(tB)) {
              pairs.push({ compA: a, compB: b, traitA: tA, traitB: tB });
            }
          }
        }
      }
    }
  }

  if (pairs.length === 0) return false;

  // 30% chance per qualifying decision point
  if (Math.random() > 0.30) return false;

  const pair = pick(pairs);
  // Find a matching conflict scenario
  let conflict = COMPANION_CONFLICTS.find(c =>
    (c.sideA.trait === pair.traitA && c.sideB.trait === pair.traitB) ||
    (c.sideA.trait === pair.traitB && c.sideB.trait === pair.traitA)
  );
  if (!conflict) {
    // Fallback generic conflict
    conflict = pick(COMPANION_CONFLICTS);
  }

  // Assign companions to correct sides
  const nameA = getCompShortName(pair.compA.name);
  const traitsA = COMPANION_TRAITS[nameA];
  let compForSideA, compForSideB;
  if (traitsA.traits.includes(conflict.sideA.trait)) {
    compForSideA = pair.compA; compForSideB = pair.compB;
  } else {
    compForSideA = pair.compB; compForSideB = pair.compA;
  }

  pendingConflict = {
    conflict: deepClone(conflict),
    compA: compForSideA,
    compB: compForSideB,
  };
  conflictsThisFloor++;

  // Notify player of the conflict
  const shortA = compForSideA.name.split(' ')[0];
  const shortB = compForSideB.name.split(' ')[0];
  dungeonMessage = `${shortA} and ${shortB} are arguing! Resolve it at the campfire.`;
  dungeonMessageTimer = 3;
  addFloatingText(canvasW/2, canvasH/2 - 100, 'COMPANION CONFLICT!', '#ff6644');
  return true;
}

// Resolve a companion conflict based on player choice
function resolveConflict(choice) {
  if (!pendingConflict) return;
  const { compA, compB } = pendingConflict;

  if (choice === 'sideA') {
    // Player sided with compA
    compA.loyalty = Math.min(100, compA.loyalty + 5);
    compB.loyalty = Math.max(0, compB.loyalty - 12);
    dungeonMessage = `${compA.name} is grateful. ${compB.name} is upset.`;
    addFloatingText(canvasW/2 - 40, canvasH/2 - 60, `${getCompShortName(compA.name)}: +5 Loy`, '#44ff88');
    addFloatingText(canvasW/2 + 40, canvasH/2 - 60, `${getCompShortName(compB.name)}: -12 Loy`, '#ff6644');
  } else if (choice === 'sideB') {
    // Player sided with compB
    compB.loyalty = Math.min(100, compB.loyalty + 5);
    compA.loyalty = Math.max(0, compA.loyalty - 12);
    dungeonMessage = `${compB.name} is grateful. ${compA.name} is upset.`;
    addFloatingText(canvasW/2 + 40, canvasH/2 - 60, `${getCompShortName(compB.name)}: +5 Loy`, '#44ff88');
    addFloatingText(canvasW/2 - 40, canvasH/2 - 60, `${getCompShortName(compA.name)}: -12 Loy`, '#ff6644');
  } else {
    // Compromise — smaller penalty, no bonus
    compA.loyalty = Math.max(0, compA.loyalty - 3);
    compB.loyalty = Math.max(0, compB.loyalty - 3);
    dungeonMessage = 'Both companions accept the compromise, grudgingly.';
    addFloatingText(canvasW/2 - 40, canvasH/2 - 60, `${getCompShortName(compA.name)}: -3 Loy`, '#ffaa44');
    addFloatingText(canvasW/2 + 40, canvasH/2 - 60, `${getCompShortName(compB.name)}: -3 Loy`, '#ffaa44');
  }
  dungeonMessageTimer = 3;

  // Check if anyone threatens to leave or actually leaves
  [compA, compB].forEach(comp => {
    if (comp.loyalty <= 10) {
      dungeonMessage = `${comp.name} has had enough and leaves the party!`;
      dungeonMessageTimer = 3;
      setTimeout(() => { player.squad = player.squad.filter(c => c !== comp); }, 100);
    } else if (comp.loyalty <= 20) {
      dungeonMessage += ` ${comp.name} is thinking of leaving...`;
      dungeonMessageTimer = 3;
    }
  });

  conflictHistory.push({ compA: compA.name, compB: compB.name, choice, floor: currentFloor });
  pendingConflict = null;
}

// Boss phase transition — called during enemy turn when boss HP drops below 50%
function checkBossPhaseTransition(enemy) {
  if (!enemy.boss || !enemy.bossType) return false;
  if (enemy.phase2) return false;
  if (enemy.hp > enemy.maxHp * 0.5) return false;

  enemy.phase2 = true;

  // Swap to phase 2 attacks
  if (enemy.phase2Attacks) {
    enemy.attacks = enemy.phase2Attacks;
  }

  // Phase-specific behavior
  if (enemy.bossType === 'crown_general') {
    // Shield Wall: +3 AC for the rest of the fight
    enemy.ac += 3;
    addCombatLog(`★ PHASE 2: ${enemy.name} raises a SHIELD WALL! AC increased to ${enemy.ac}!`);
    addFloatingText(canvasW/2, canvasH * 0.3, 'SHIELD WALL!', '#c09030');
    SFX.trap();
  } else if (enemy.bossType === 'shadow_assassin') {
    // Goes invisible — next attack is a backstab
    enemy.invisible = true;
    enemy.ac += 2; // harder to hit while invisible
    addCombatLog(`★ PHASE 2: ${enemy.name} vanishes into shadow! INVISIBLE!`);
    addFloatingText(canvasW/2, canvasH * 0.3, 'VANISHED!', '#3a1a5a');
    SFX.spell();
  } else if (enemy.bossType === 'free_champion') {
    // Berserker Rage — damage bonus increases, gets extra attack
    enemy.rageActive = true;
    enemy.rageRound = combatState.combatRound;
    // Heal 20% on rage activation
    const healAmt = Math.floor(enemy.maxHp * 0.2);
    enemy.hp = Math.min(enemy.maxHp, enemy.hp + healAmt);
    addCombatLog(`★ PHASE 2: ${enemy.name} enters BERSERKER RAGE! Heals ${healAmt} HP!`);
    addFloatingText(canvasW/2, canvasH * 0.3, 'BERSERKER RAGE!', '#40a060');
    SFX.crit();
  }

  spawnParticles(canvasW/2, canvasH * 0.3, enemy.color, 20);
  return true;
}

// Boss special abilities during their turn
function bossSpecialAction(enemy) {
  if (!enemy.boss || !enemy.bossType || !enemy.phase2) return false;

  if (enemy.bossType === 'crown_general' && !enemy.summonedAdds) {
    // Summon 2 soldier adds (once per fight)
    enemy.summonedAdds = true;
    const soldierTemplate = MONSTERS['Crown Soldier'];
    for (let i = 0; i < 2; i++) {
      const soldier = {
        ...deepClone(soldierTemplate),
        maxHp: soldierTemplate.hp,
        hp: soldierTemplate.hp,
        id: Math.random().toString(36).substr(2, 9),
        conditions: [],
        px: 0, py: 0,
      };
      const init = d20() + 1;
      combatState.combatants.push({ type: 'enemy', initiative: init, entity: soldier });
    }
    addCombatLog(`${enemy.name} calls reinforcements! 2 Crown Soldiers join the fight!`);
    addFloatingText(canvasW/2, canvasH * 0.4, 'REINFORCEMENTS!', '#c0a040');
    SFX.door();
    return true;
  }

  if (enemy.bossType === 'shadow_assassin' && enemy.invisible) {
    // Backstab from stealth — guaranteed hit with bonus damage
    enemy.invisible = false;
    enemy.ac -= 2; // lose invisibility AC bonus
    const backstabDmg = rollDice(4, 8) + 8;
    // Apply poison
    enemy.poisonStacks = (enemy.poisonStacks || 0) + 1;
    const poisonDmg = enemy.poisonStacks * rollDice(1, 4);
    const totalDmg = backstabDmg + poisonDmg;
    player.hp = Math.max(0, player.hp - totalDmg);
    player.conditions.push({ type: 'poisoned', turns: 3 });
    addCombatLog(`${enemy.name} BACKSTABS from the shadows! ${backstabDmg} + ${poisonDmg} poison = ${totalDmg} damage! You are POISONED!`);
    addFloatingText(canvasW/2, canvasH * 0.65, `-${totalDmg} BACKSTAB!`, '#8800ff');
    SFX.crit();
    spawnParticles(canvasW/2, canvasH * 0.65, '#8800ff', 12);
    if (player.hp <= 0) {
      if (player.race === 'Orc' && !player.relentlessUsed) {
        player.hp = 1; player.relentlessUsed = true;
        addCombatLog('Relentless Endurance! Survived at 1 HP!');
      } else { combatState.phase = 'defeat'; SFX.death(); }
    }
    return true;
  }

  if (enemy.bossType === 'shadow_assassin' && !enemy.invisible && Math.random() < 0.25) {
    // Re-stealth every few turns
    enemy.invisible = true;
    enemy.ac += 2;
    addCombatLog(`${enemy.name} melts back into the shadows! INVISIBLE!`);
    addFloatingText(canvasW/2, canvasH * 0.3, 'VANISHED!', '#3a1a5a');
    SFX.spell();
    return true;
  }

  if (enemy.bossType === 'free_champion' && enemy.rageActive) {
    // Gets stronger as HP drops further — bonus damage scaling
    const hpPct = enemy.hp / enemy.maxHp;
    if (hpPct < 0.25) {
      // Desperate fury: extra free attack
      const attack = enemy.attacks[0];
      const roll = d20();
      const totalRoll = roll + attack.bonus + 2; // rage bonus
      if (roll >= 20 || (roll !== 1 && totalRoll >= calcAC())) {
        const dmg = rollDice(attack.damage[0], attack.damage[1]) + attack.damageBonus + 4;
        player.hp = Math.max(0, player.hp - dmg);
        addCombatLog(`${enemy.name}'s DESPERATE FURY! Extra attack for ${dmg} damage!`);
        addFloatingText(canvasW/2, canvasH * 0.65, `-${dmg} FURY!`, '#ff4444');
        SFX.crit();
        if (player.hp <= 0) {
          if (player.race === 'Orc' && !player.relentlessUsed) {
            player.hp = 1; player.relentlessUsed = true;
            addCombatLog('Relentless Endurance! Survived at 1 HP!');
          } else { combatState.phase = 'defeat'; SFX.death(); }
        }
      } else {
        addCombatLog(`${enemy.name}'s DESPERATE FURY: MISS!`);
      }
      return true;
    }
  }

  return false;
}

// Dialogue skill check helper
function dialogueCheck(stat, dc) {
  const statVal = player.stats[stat] || 10;
  const mod = Math.floor((statVal - 10) / 2);
  const roll = Math.floor(Math.random() * 20) + 1;
  return { success: (roll + mod) >= dc, roll, mod, total: roll + mod, dc };
}

function getGuildRank(guildId) {
  const rep = guildRep[guildId] || 0;
  const guild = GUILDS[guildId];
  let rank = 0;
  for (let i = guild.rankThresholds.length - 1; i >= 0; i--) {
    if (rep >= guild.rankThresholds[i]) { rank = i; break; }
  }
  return rank;
}

// ============================================================
// INPUT HANDLING
// ============================================================
const keys = {};
let mouseX = 0, mouseY = 0, mouseDown = false, mouseClicked = false;
let touchDpadDir = null;
let lastMoveTime = 0;
const MOVE_DELAY = 150;

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  keys[e.code] = true;
  if (gameState === STATE.CHAR_CREATE && charCreate.step === 3) {
    handleNameInput(e);
    e.preventDefault();
    return;
  }
  if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.code] = false; });

function getEventPos(e) {
  const t = e.touches ? e.touches[0] : e;
  if (!t) return { x: mouseX, y: mouseY };
  return { x: t.clientX, y: t.clientY };
}

C.addEventListener('mousedown', e => { const p = getEventPos(e); mouseX = p.x; mouseY = p.y; mouseDown = true; mouseClicked = true; });
C.addEventListener('mouseup', e => { mouseDown = false; });
C.addEventListener('mousemove', e => { const p = getEventPos(e); mouseX = p.x; mouseY = p.y; });

C.addEventListener('touchstart', e => {
  e.preventDefault();
  const p = getEventPos(e);
  mouseX = p.x; mouseY = p.y; mouseDown = true; mouseClicked = true;
  SFX._init();
}, { passive: false });
C.addEventListener('touchend', e => { e.preventDefault(); mouseDown = false; touchDpadDir = null; }, { passive: false });
C.addEventListener('touchmove', e => {
  e.preventDefault();
  const p = getEventPos(e);
  mouseX = p.x; mouseY = p.y;
}, { passive: false });

// Scroll support for selection screens
C.addEventListener('wheel', e => {
  if (gameState === STATE.CHAR_CREATE && (charCreate.step === 0 || charCreate.step === 1)) {
    charCreate.scrollY = (charCreate.scrollY||0) - e.deltaY * 0.5;
    e.preventDefault();
  } else if (gameState === STATE.SHOP) {
    shopScrollY = (shopScrollY||0) - e.deltaY * 0.5;
    e.preventDefault();
  }
}, { passive: false });
let touchStartY = 0;
C.addEventListener('touchstart', e2 => { touchStartY = e2.touches[0].clientY; }, { passive: true });
C.addEventListener('touchmove', e2 => {
  if (gameState === STATE.CHAR_CREATE && (charCreate.step === 0 || charCreate.step === 1)) {
    const dy = e2.touches[0].clientY - touchStartY;
    charCreate.scrollY = (charCreate.scrollY||0) + dy * 0.8;
    touchStartY = e2.touches[0].clientY;
  }
}, { passive: true });

function isInRect(x, y, rx, ry, rw, rh) {
  return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
}

function clickedInRect(rx, ry, rw, rh) {
  return mouseClicked && isInRect(mouseX, mouseY, rx, ry, rw, rh);
}

// ============================================================
// NAME INPUT
// ============================================================
function handleNameInput(e) {
  if (e.key === 'Backspace') {
    charCreate.nameInput = charCreate.nameInput.slice(0, -1);
  } else if (e.key === 'Enter') {
    if (charCreate.nameInput.trim().length > 0) {
      charCreate.playerName = charCreate.nameInput.trim();
      charCreate.step = 4;
      SFX.click();
    }
  } else if (e.key.length === 1 && charCreate.nameInput.length < 20) {
    charCreate.nameInput += e.key;
  }
}

// ============================================================
function drawButton(x, y, w, h, text, hovered, color, textColor) {
  const isHov = isInRect(mouseX, mouseY, x, y, w, h);
  const c = isHov ? (color || '#555') : (color ? darkenColor(color, 0.7) : '#333');
  X.fillStyle = c;
  X.fillRect(x, y, w, h);
  X.strokeStyle = isHov ? '#fff' : '#888';
  X.lineWidth = isHov ? 2 : 1;
  X.strokeRect(x, y, w, h);
  X.fillStyle = textColor || '#fff';
  X.font = `${Math.min(h * 0.45, 16)}px Consolas, monospace`;
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(text, x + w/2, y + h/2);
  return isHov;
}

function darkenColor(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
}

function updateCharCreate() {
  X.fillStyle = '#0a0a0f';
  X.fillRect(0, 0, canvasW, canvasH);

  // Remove mobile name overlay if not on name step
  if (charCreate.step !== 3) removeNameOverlay();

  const cx = canvasW / 2;
  const steps = ['Choose Race', 'Choose Class', 'Assign Stats', 'Name Your Hero', 'Review'];

  // Step indicator
  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 16 : 20}px Consolas, monospace`;
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(`Step ${charCreate.step + 1}/5: ${steps[charCreate.step]}`, cx, 30 + TOP_PAD);

  // Step dots
  for (let i = 0; i < 5; i++) {
    X.fillStyle = i <= charCreate.step ? '#ffd700' : '#333';
    X.beginPath();
    X.arc(cx - 40 + i * 20, 55 + TOP_PAD, 5, 0, Math.PI * 2);
    X.fill();
  }

  switch (charCreate.step) {
    case 0: drawRaceSelection(); break;
    case 1: drawClassSelection(); break;
    case 2: drawStatAssignment(); break;
    case 3: drawNameInput(); break;
    case 4: drawCharPreview(); break;
  }

  // Back button (except step 0)
  if (charCreate.step > 0) {
    const bx = 10, by = 10 + TOP_PAD, bw = 70, bh = 30;
    drawButton(bx, by, bw, bh, '< Back', false, '#333');
    if (clickedInRect(bx, by, bw, bh)) {
      SFX.click();
      if (charCreate.step === 3) {
        removeNameOverlay();
      }
      if (charCreate.step === 2) {
        charCreate.statAssignment = {};
        charCreate.availableValues = [...STANDARD_ARRAY];
        charCreate.assignOrder = [];
      }
      charCreate.step--;
    }
  } else {
    // Back to title
    const bx = 10, by = 10 + TOP_PAD, bw = 70, bh = 30;
    drawButton(bx, by, bw, bh, '< Menu', false, '#333');
    if (clickedInRect(bx, by, bw, bh)) { SFX.click(); gameState = STATE.TITLE; }
  }
}

function drawRaceSelection() {
  const cx = canvasW / 2;
  const races = Object.values(RACES);
  const cardW = isMobile ? canvasW * 0.85 : 340;
  const cardH = isMobile ? 60 : 70;
  const gap = 6;
  const startY = 80 + TOP_PAD;
  const totalH = races.length * (cardH + gap);
  const maxScroll = 0;
  const minScroll = Math.min(0, -(totalH - (canvasH - startY - 20)));
  charCreate.scrollY = clamp(charCreate.scrollY||0, minScroll, maxScroll);
  const scrollOff = charCreate.scrollY||0;

  races.forEach((race, i) => {
    const y = startY + i * (cardH + gap) + scrollOff;
    if (y + cardH < startY - 10 || y > canvasH + 10) return;
    const hov = isInRect(mouseX, mouseY, cx - cardW/2, y, cardW, cardH);

    X.fillStyle = hov ? '#2a2a3a' : '#1a1a2a';
    X.fillRect(cx - cardW/2, y, cardW, cardH);
    X.strokeStyle = race.color;
    X.lineWidth = hov ? 2 : 1;
    X.strokeRect(cx - cardW/2, y, cardW, cardH);

    // Race color dot
    X.fillStyle = race.color;
    X.beginPath();
    X.arc(cx - cardW/2 + 25, y + cardH/2, 10, 0, Math.PI * 2);
    X.fill();

    X.fillStyle = '#fff';
    X.font = `bold ${isMobile ? 13 : 15}px Consolas, monospace`;
    X.textAlign = 'left';
    const lx = cx - cardW/2 + 45;
    X.fillText(race.name, lx, y + 15);

    X.fillStyle = '#aaa';
    X.font = `${isMobile ? 9 : 11}px Consolas, monospace`;

    X.fillText(bonusStr, lx, y + 30);
    X.fillStyle = '#888';
    X.font = `${isMobile ? 8 : 10}px Consolas, monospace`;
    X.fillText(race.trait, lx, y + 43);

      SFX.click();
      charCreate.selectedRace = race.name;
      charCreate.scrollY = 0;
      charCreate.step = 1;

}

function drawStatAssignment() {
  const cx = canvasW / 2;
  const race = RACES[charCreate.selectedRace];
  const cardW = isMobile ? canvasW * 0.85 : 400;
  const startY = 80 + TOP_PAD;

  X.fillStyle = '#aaa';
  X.font = `${isMobile ? 11 : 13}px Consolas, monospace`;
  X.textAlign = 'center';
  X.fillText('Click a stat, then click a value from the standard array', cx, startY);
  X.fillText('to assign it. Race bonuses shown in parentheses.', cx, startY + 18);

  // Show available values
  const valY = startY + 45;
  X.fillStyle = '#ffd700';
  X.font = `bold ${isMobile ? 13 : 15}px Consolas, monospace`;
  X.fillText('Available Values:', cx, valY);

  const valBtnW = 45, valBtnH = 35;
  const totalValW = charCreate.availableValues.length * (valBtnW + 6);
  const valStartX = cx - totalValW / 2;

  charCreate.availableValues.forEach((val, i) => {
    const vx = valStartX + i * (valBtnW + 6);
    const vy = valY + 15;
    const selected = charCreate._selectedValue === val && charCreate._selectedValueIdx === i;
    X.fillStyle = selected ? '#4a4a2a' : '#2a2a2a';
    X.fillRect(vx, vy, valBtnW, valBtnH);
    X.strokeStyle = selected ? '#ffd700' : '#666';
    X.lineWidth = selected ? 2 : 1;
    X.strokeRect(vx, vy, valBtnW, valBtnH);
    X.fillStyle = '#fff';
    X.font = `bold ${isMobile ? 14 : 16}px Consolas, monospace`;
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(val.toString(), vx + valBtnW/2, vy + valBtnH/2);

    if (clickedInRect(vx, vy, valBtnW, valBtnH)) {
      SFX.click();
      charCreate._selectedValue = val;
      charCreate._selectedValueIdx = i;
    }
  });

  // Stats
  const statY = valY + 70;
  const statH = 45;

  STAT_NAMES.forEach((stat, i) => {
    const y = statY + i * (statH + 6);
    const assigned = charCreate.statAssignment[stat] !== undefined;
    const bonus = race.bonuses[stat] || 0;
    const baseVal = assigned ? charCreate.statAssignment[stat] : '--';
    const totalVal = assigned ? charCreate.statAssignment[stat] + bonus : '--';

    X.fillStyle = assigned ? '#1a2a1a' : '#1a1a2a';
    X.fillRect(cx - cardW/2, y, cardW, statH);
    X.strokeStyle = assigned ? '#4a8a4a' : '#555';
    X.lineWidth = 1;
    X.strokeRect(cx - cardW/2, y, cardW, statH);

    X.fillStyle = '#fff';
    X.font = `bold ${isMobile ? 14 : 16}px Consolas, monospace`;
    X.textAlign = 'left';
    X.fillText(stat, cx - cardW/2 + 15, y + statH/2 - 5);

    X.fillStyle = '#aaa';
    X.font = `${isMobile ? 10 : 12}px Consolas, monospace`;
    const statDesc = { STR:'Strength', DEX:'Dexterity', CON:'Constitution', INT:'Intelligence', WIS:'Wisdom', CHA:'Charisma' };
    X.fillText(statDesc[stat], cx - cardW/2 + 55, y + statH/2 - 5);

    X.fillStyle = '#666';
    X.font = `${isMobile ? 8 : 10}px Consolas, monospace`;
    X.textAlign = 'left';
    X.fillText(STAT_DESCS[stat], cx - cardW/2 + 15, y + statH/2 + 12);

    // Value display
    X.fillStyle = '#fff';
    X.font = `bold ${isMobile ? 18 : 22}px Consolas, monospace`;
    X.textAlign = 'right';
    X.fillText(totalVal.toString(), cx + cardW/2 - 15, y + statH/2 - 2);

    if (bonus > 0) {
      X.fillStyle = '#4a4';
      X.font = `${isMobile ? 10 : 12}px Consolas, monospace`;
      X.fillText(`(+${bonus})`, cx + cardW/2 - 50, y + statH/2 - 2);
    }

    // Modifier
    if (assigned) {
      const m = mod(parseInt(totalVal));
      X.fillStyle = m >= 0 ? '#4a4' : '#a44';
      X.font = `${isMobile ? 11 : 13}px Consolas, monospace`;
      X.textAlign = 'right';
      X.fillText(`mod: ${m >= 0 ? '+' : ''}${m}`, cx + cardW/2 - 80, y + statH/2 - 2);
    }

    // Click to assign
    if (clickedInRect(cx - cardW/2, y, cardW, statH)) {
      if (charCreate._selectedValue !== undefined) {
        // Unassign if already assigned
        if (assigned) {
          charCreate.availableValues.push(charCreate.statAssignment[stat]);
          charCreate.availableValues.sort((a,b) => b - a);
          charCreate.assignOrder = charCreate.assignOrder.filter(s => s !== stat);
        }
        // Assign selected value
        charCreate.statAssignment[stat] = charCreate._selectedValue;
        charCreate.availableValues.splice(charCreate._selectedValueIdx, 1);
        charCreate.assignOrder.push(stat);
        charCreate._selectedValue = undefined;
        charCreate._selectedValueIdx = undefined;
        SFX.click();
      } else if (assigned) {
        // Click assigned stat to unassign
        charCreate.availableValues.push(charCreate.statAssignment[stat]);
        charCreate.availableValues.sort((a,b) => b - a);
        delete charCreate.statAssignment[stat];
        charCreate.assignOrder = charCreate.assignOrder.filter(s => s !== stat);
        SFX.click();
      }
    }
  });

  // Continue button
  const allAssigned = STAT_NAMES.every(s => charCreate.statAssignment[s] !== undefined);
  if (allAssigned) {
    const btnW2 = 200, btnH2 = 45;
    const btnY = statY + 6 * (statH + 6) + 10;
    drawButton(cx - btnW2/2, btnY, btnW2, btnH2, 'CONTINUE', false, '#2a4a2a');
    if (clickedInRect(cx - btnW2/2, btnY, btnW2, btnH2)) {
      SFX.click();
      charCreate.step = 3;
    }
  }

  // Reset button
  const resetW = 100, resetH = 30;
  drawButton(cx - resetW/2, statY + 6 * (statH + 6) + 60, resetW, resetH, 'Reset', false, '#4a2a2a');
  if (clickedInRect(cx - resetW/2, statY + 6 * (statH + 6) + 60, resetW, resetH)) {
    SFX.click();
    charCreate.statAssignment = {};
    charCreate.availableValues = [...STANDARD_ARRAY];
    charCreate.assignOrder = [];
    charCreate._selectedValue = undefined;
  }
}

function wrapText(text, maxWidth, fontSize) {
  X.font = `${fontSize}px Consolas, monospace`;
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words) {
    const test = current ? current + ' ' + word : word;
    if (X.measureText(test).width > maxWidth) {
      if (current) lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}
