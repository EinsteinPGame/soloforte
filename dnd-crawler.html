function createCharacter() {
  const race = RACES[charCreate.selectedRace];
  const cls = CLASSES[charCreate.selectedClass];

  const stats = {};
  STAT_NAMES.forEach(s => {
    stats[s] = charCreate.statAssignment[s] + (race.bonuses[s] || 0);
  });

  const maxHp = cls.hitDie + mod(stats.CON);

  player = {
    name: charCreate.playerName,
    race: charCreate.selectedRace,
    class: charCreate.selectedClass,
    level: 1,
    xp: 0,
    stats: stats,
    maxHp: maxHp,
    hp: maxHp,
    tempAc: 0,
    gold: 10,
    inventory: [],
    equipped: { weapon: null, armor: null, shield: null },
    spells: cls.spells ? [...cls.spells] : [],
    maxSpellSlots: cls.isCaster ? SPELL_SLOTS[1] : 0,
    spellSlots: cls.isCaster ? SPELL_SLOTS[1] : 0,
    conditions: [],
    deathSaves: { successes: 0, failures: 0 },
    isDead: false,
    isDying: false,
    proficiencies: cls.skills || [],
    savingThrows: cls.savingThrows || [],
    features: {},
    secondWindUsed: false,
    actionSurgeUsed: false,
    relentlessUsed: false,
    stonesEnduranceUsed: false,
    healingHandsUsed: false,
    breathWeaponUsed: false,
    felineAgilityUsed: false,
    rageActive: false,
    rageCount: 0,
    maxRages: 2,
    kiPoints: 0,
    maxKiPoints: 0,
    wildShapeUsed: 0,
    sorceryPoints: 0,
    maxSorceryPoints: 0,
    huntersMark: false,
    blessActive: false,
    blessTurns: 0,
    shieldActive: false,
    x: 0,
    y: 0,
    floor: 0,
    torchRadius: 5,
    exploredTiles: [],
  };

  // Copy features for current level
  for (let lv = 1; lv <= player.level; lv++) {
    if (cls.features[lv]) player.features[lv] = cls.features[lv];
  }

  // Class-specific resource setup
  if (cls.name === 'Monk') { player.maxKiPoints = Math.max(0, player.level - 1); player.kiPoints = player.maxKiPoints; }
  if (cls.name === 'Sorcerer') { player.maxSorceryPoints = player.level; player.sorceryPoints = player.maxSorceryPoints; }
  if (cls.name === 'Barbarian') { player.maxRages = player.level >= 3 ? 3 : 2; }

  // Add starting equipment
  cls.startEquip.forEach(itemName => {
    const template = ITEM_TEMPLATES[itemName];
    if (template) {
      const item = makeItem(template);
      player.inventory.push(item);
    }
  });

  // Auto-equip
  autoEquip();

  // Init explored tiles for 5 floors
  player.exploredTiles = [[], [], [], [], []];
  player.squad = []; // up to 4 companions
  player.companionsSeen = []; // track which NPCs have been encountered
  player.romanced = null; // name of romanced companion
  player.belovedShield = false; // romance AC bonus active
  player.evolution = null; // evolved subclass name (e.g., 'Champion', 'Assassin')
  player.evolutionData = null; // full evolution path data (abilities, bonuses)
  player.reputation = 0; // -100 (Despised) to +100 (Legendary)
}

function autoEquip() {
  for (const item of player.inventory) {
    if (item.type === ITEM_TYPES.WEAPON && !player.equipped.weapon) {
      player.equipped.weapon = item.id;
    } else if (item.type === ITEM_TYPES.ARMOR && !player.equipped.armor) {
      player.equipped.armor = item.id;
    } else if (item.type === ITEM_TYPES.SHIELD && !player.equipped.shield) {
      player.equipped.shield = item.id;
    }
  }
}

// ============================================================
// REPUTATION SYSTEM
// ============================================================
function getRepTier(rep) {
  if (rep <= -50) return { name: 'Despised', color: '#8b0000', shopMod: 1.5, desc: 'NPCs refuse aid. Prices +50%' };
  if (rep <= -10) return { name: 'Mistrusted', color: '#c04040', shopMod: 1.2, desc: 'Prices +20%' };
  if (rep <= 9) return { name: 'Unknown', color: '#888', shopMod: 1.0, desc: 'No reputation effects' };
  if (rep <= 49) return { name: 'Respected', color: '#40a040', shopMod: 0.9, desc: 'Prices -10%' };
  if (rep <= 89) return { name: 'Honored', color: '#ffd700', shopMod: 0.8, desc: 'Prices -20%, rare items available' };
  return { name: 'Legendary', color: '#ff4500', shopMod: 0.7, desc: 'Prices -30%, legendary gear in shops' };
}
function changeRep(amount, reason) {
  if (!player) return;
  const old = player.reputation;
  player.reputation = clamp(player.reputation + amount, -100, 100);
  if (player.reputation !== old) {
    const sign = amount > 0 ? '+' : '';
    const color = amount > 0 ? '#ffd700' : '#c04040';
    addFloatingText(canvasW / 2, canvasH / 2 - 60, `${sign}${amount} Rep`, color);
  }
}

function getEquippedItem(slot) {
  if (!player.equipped[slot]) return null;
  return player.inventory.find(i => i.id === player.equipped[slot]) || null;
}

function calcAC() {
  let ac = 10 + mod(player.stats.DEX);
  const armor = getEquippedItem('armor');
  if (armor) {
    ac = armor.acBase + Math.min(mod(player.stats.DEX), armor.maxDex);
  }
  const shield = getEquippedItem('shield');
  if (shield) ac += shield.acBonus;
  ac += player.tempAc;
  return ac;
}

function calcAttackBonus() {
  const weapon = getEquippedItem('weapon');
  let statMod = mod(player.stats.STR);
  if (weapon) {
    if (weapon.finesse) statMod = Math.max(mod(player.stats.STR), mod(player.stats.DEX));
    else if (weapon.ranged) statMod = mod(player.stats.DEX);
    else statMod = mod(player.stats[weapon.stat] || player.stats.STR);
  }
  return statMod + PROF_BONUS[player.level];
}

function calcDamage(critical) {
  const weapon = getEquippedItem('weapon');
  let dice = weapon ? weapon.damageDice : [1, 4];
  let numDice = critical ? dice[0] * 2 : dice[0];
  let dmg = rollDice(numDice, dice[1]);
  let statMod = mod(player.stats.STR);
  if (weapon) {
    if (weapon.finesse) statMod = Math.max(mod(player.stats.STR), mod(player.stats.DEX));
    else if (weapon.ranged) statMod = mod(player.stats.DEX);
    else statMod = mod(player.stats[weapon.stat] || player.stats.STR);
    if (weapon.bonusDamage) dmg += weapon.bonusDamage;
  }
  dmg += statMod;
  // Hunter's Mark bonus
  if (player.huntersMark) dmg += rollDice(1, 6);
  // Sneak Attack (Rogue)
  if (player.class === 'Rogue') {
    const sneakDice = Math.ceil(player.level / 2);
    dmg += rollDice(sneakDice, 6);
  }
  // Evolution bonuses
  if (player.evolutionData?.bonuses) {
    const eb = player.evolutionData.bonuses;
    // Assassin poison damage on sneak attacks
    if (eb.poisonDmg && player.class === 'Rogue') {
      dmg += rollDice(eb.poisonDmg[0], eb.poisonDmg[1]);
    }
    // Evoker empowered evocation (applies to spell damage too via this path)
    if (eb.empoweredEvocation) {
      dmg += mod(player.stats.INT);
    }
    // Battle Master superiority dice (chance to add)
    if (eb.superiorityDice && Math.random() < 0.4) {
      const supDmg = rollDice(1, 8);
      dmg += supDmg;
    }
    // Gloom Stalker dread ambush (first attack bonus)
    if (eb.dreadAmbush && combatState && combatState.combatRound === 1) {
      dmg += rollDice(eb.dreadAmbush[0], eb.dreadAmbush[1]);
    }
    // Berserker frenzy (bonus while raging)
    if (eb.frenzy && player.rageActive) {
      dmg += rollDice(1, 6);
    }
  }
  // NPC dialogue consequences
  if (combatState) {
    const target = combatState.combatants.filter(c => c.type === 'enemy' && c.entity.hp > 0)[0];
    if (target) {
      // Grimjaw's armor knowledge: +2 vs armored enemies (AC >= 15)
      if (npcFlags.grimjaw_armor_knowledge && target.entity.ac >= 15) { dmg += 2; }
      // Verendis seal knowledge: +25% dmg vs bosses for first 3 rounds
      if (npcFlags.verendis_seal_knowledge && target.entity.boss && combatState.combatRound <= 3) { dmg = Math.floor(dmg * 1.25); }
      // Thessa bestiary: +2 vs undead or elemental names
      if (npcFlags.thessa_bestiary && (target.entity.undead || target.entity.name.includes('Elemental') || target.entity.name.includes('Golem'))) { dmg += 2; }
    }
  }
  return Math.max(1, dmg);
}

function getPassivePerception() {
  const proficient = player.proficiencies.includes('Perception');
  return 10 + mod(player.stats.WIS) + (proficient ? PROF_BONUS[player.level] : 0);
}

// ============================================================
// DUNGEON GENERATION
// ============================================================
const TILE = { VOID: 0, WALL: 1, FLOOR: 2, DOOR: 3, STAIRS_DOWN: 4, STAIRS_UP: 5, CORRIDOR: 6 };
const ROOM_TYPE = { COMBAT: 'combat', TREASURE: 'treasure', TRAP: 'trap', EMPTY: 'empty', SHRINE: 'shrine', STAIRS: 'stairs', START: 'start', BOSS: 'boss', SHOP: 'shop', NPC: 'npc', EVOLUTION_QUEST: 'evolution_quest', WAR_ENCOUNTER: 'war_encounter' };
const MAP_W = 48, MAP_H = 48;
const TILE_SIZE = 24;

function generateDungeon() {
  dungeon = { floors: [], totalFloors: 8 };
  for (let f = 0; f < 8; f++) {
    dungeon.floors.push(generateFloor(f));
  }
  currentFloor = 0;
  // Place player at start room
  const startRoom = dungeon.floors[0].rooms.find(r => r.type === ROOM_TYPE.START);
  player.x = startRoom.cx;
  player.y = startRoom.cy;
  player.floor = 0;
  revealArea(player.x, player.y, player.torchRadius);
}

function generateFloor(floorNum) {
  const tiles = [];
  for (let y = 0; y < MAP_H; y++) {
    tiles[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      tiles[y][x] = TILE.VOID;
    }
  }

  const rooms = [];
  const numRooms = rand(8, 12);
  const minRoomSize = 4, maxRoomSize = 8;

  // Generate rooms
  let attempts = 0;
  while (rooms.length < numRooms && attempts < 500) {
    attempts++;
    const w = rand(minRoomSize, maxRoomSize);
    const h = rand(minRoomSize, maxRoomSize);
    const x = rand(2, MAP_W - w - 2);
    const y = rand(2, MAP_H - h - 2);

    // Check overlap
    let overlap = false;
    for (const r of rooms) {
      if (x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y) {
        overlap = true; break;
      }
    }
    if (overlap) continue;

    rooms.push({ x, y, w, h, cx: Math.floor(x + w/2), cy: Math.floor(y + h/2), type: null, visited: false, cleared: false, enemies: [], items: [], trapTriggered: false, trapType: null });
  }

  // Assign room types
  // First room = start, last room = stairs
  rooms[0].type = ROOM_TYPE.START;

  // Sort rooms by distance from start to create a natural progression
  const startRoom = rooms[0];
  rooms.sort((a, b) => {
    if (a === startRoom) return -1;
    if (b === startRoom) return 1;
    const da = Math.abs(a.cx - startRoom.cx) + Math.abs(a.cy - startRoom.cy);
    const db = Math.abs(b.cx - startRoom.cx) + Math.abs(b.cy - startRoom.cy);
    return da - db;
  });

  rooms[rooms.length - 1].type = ROOM_TYPE.STAIRS;

  // Boss room: second-to-last room guards the stairs
  if (rooms.length >= 3) {
    rooms[rooms.length - 2].type = ROOM_TYPE.BOSS;
  }

  // Shop room: one per floor (pick a middle room)
  const midIdx = Math.floor(rooms.length / 2);
  if (rooms.length >= 5 && !rooms[midIdx].type) {
    rooms[midIdx].type = ROOM_TYPE.SHOP;
  }

  // NPC room: one per floor (pick a room between start and mid)
  const npcIdx = Math.floor(rooms.length / 3);
  if (rooms.length >= 6 && !rooms[npcIdx].type) {
    rooms[npcIdx].type = ROOM_TYPE.NPC;
  }

  // Evolution quest room: appears on floors 2+ (index 1+), one per floor, if player is level 3+ and not yet evolved
  if (floorNum >= 1 && player && player.level >= 3 && !player.evolution) {
    const evoIdx = Math.floor(rooms.length * 2 / 3);
    if (rooms.length >= 7 && !rooms[evoIdx].type) {
      rooms[evoIdx].type = ROOM_TYPE.EVOLUTION_QUEST;
    }
  }

  // War encounter room: appears on floors 3+ (index 2+) when war arc is active
  if (floorNum >= 2 && typeof warState !== 'undefined' && warState !== WAR_STATE.INACTIVE) {
    const warIdx = Math.floor(rooms.length * 3 / 4);
    if (rooms.length >= 6 && !rooms[warIdx].type) {
      rooms[warIdx].type = ROOM_TYPE.WAR_ENCOUNTER;
    }
  }

  // Assign remaining rooms
  const typeWeights = [
    { type: ROOM_TYPE.COMBAT, weight: 40 },
    { type: ROOM_TYPE.TREASURE, weight: 15 },
    { type: ROOM_TYPE.TRAP, weight: 15 },
    { type: ROOM_TYPE.EMPTY, weight: 15 },
    { type: ROOM_TYPE.SHRINE, weight: 15 },
  ];

  for (let i = 1; i < rooms.length - 1; i++) {
    if (rooms[i].type) continue;
    rooms[i].type = weightedPick(typeWeights);
  }

  // Carve rooms
  for (const room of rooms) {
    for (let ry = room.y; ry < room.y + room.h; ry++) {
      for (let rx = room.x; rx < room.x + room.w; rx++) {
        tiles[ry][rx] = TILE.FLOOR;
      }
    }
    // Walls around room
    for (let ry = room.y - 1; ry <= room.y + room.h; ry++) {
      for (let rx = room.x - 1; rx <= room.x + room.w; rx++) {
        if (ry >= 0 && ry < MAP_H && rx >= 0 && rx < MAP_W) {
          if (tiles[ry][rx] === TILE.VOID) tiles[ry][rx] = TILE.WALL;
        }
      }
    }
  }

  // Connect rooms with corridors (connect each room to nearest unconnected)
  const connected = new Set([0]);
  const unconnected = new Set(rooms.map((_, i) => i).slice(1));

  while (unconnected.size > 0) {
    let bestDist = Infinity, bestFrom = -1, bestTo = -1;
    for (const ci of connected) {
      for (const ui of unconnected) {
        const d = Math.abs(rooms[ci].cx - rooms[ui].cx) + Math.abs(rooms[ci].cy - rooms[ui].cy);
        if (d < bestDist) { bestDist = d; bestFrom = ci; bestTo = ui; }
      }
    }
    if (bestTo === -1) break;

    carveCorridor(tiles, rooms[bestFrom].cx, rooms[bestFrom].cy, rooms[bestTo].cx, rooms[bestTo].cy);
    connected.add(bestTo);
    unconnected.delete(bestTo);
  }

  // Place stairs tile
  const stairRoom = rooms.find(r => r.type === ROOM_TYPE.STAIRS);
  if (stairRoom) {
    tiles[stairRoom.cy][stairRoom.cx] = TILE.STAIRS_DOWN;
  }

  // If not floor 0, place stairs up at start
  if (floorNum > 0) {
    tiles[rooms[0].cy][rooms[0].cx] = TILE.STAIRS_UP;
  }

  // Populate rooms
  for (const room of rooms) {
    if (room.type === ROOM_TYPE.COMBAT) {
      const numEnemies = rand(1, Math.min(2 + floorNum, 3));
      const possibleMonsters = FLOOR_MONSTERS[floorNum];
      for (let i = 0; i < numEnemies; i++) {
        const template = MONSTERS[pick(possibleMonsters)];
        const enemy = {
          ...deepClone(template),
          maxHp: template.hp + rand(0, Math.floor(template.hp * 0.3)),
          id: Math.random().toString(36).substr(2, 9),
          conditions: [],
          px: room.x + rand(1, room.w - 2),
          py: room.y + rand(1, room.h - 2),
        };
        enemy.hp = enemy.maxHp;
        room.enemies.push(enemy);
      }
    } else if (room.type === ROOM_TYPE.TREASURE) {
      const numItems = rand(1, 3);
      for (let i = 0; i < numItems; i++) {
        room.items.push(generateTreasureItem(floorNum));
      }
      room.items.push(makeItem(ITEM_TEMPLATES['Health Potion']));
      // Gold
      room.gold = rand(5 + floorNum * 10, 20 + floorNum * 15);
    } else if (room.type === ROOM_TYPE.TRAP) {
      room.trapType = pick(['pit', 'poison_dart', 'fire_glyph', 'spike_floor', 'gas_cloud']);
      room.trapDC = 12 + floorNum;
    } else if (room.type === ROOM_TYPE.SHRINE) {
      room.shrineUsed = false;
    } else if (room.type === ROOM_TYPE.BOSS) {
      let boss;
      // Floor 5 (index 4): use faction-specific boss if war arc is active
      if (floorNum === 4 && typeof generateFactionBoss !== 'undefined' && typeof warState !== 'undefined' && warState !== WAR_STATE.INACTIVE) {
        boss = generateFactionBoss();
        boss.px = room.x + Math.floor(room.w / 2);
        boss.py = room.y + Math.floor(room.h / 2);
        boss.id = Math.random().toString(36).substr(2, 9);
        boss.conditions = [];
      } else {
        // Check for faction war bosses on specific floors when war arc is active
        let bossName = FLOOR_BOSSES[floorNum] || 'Shadow Demon';
        if (typeof warState !== 'undefined' && warState !== WAR_STATE.INACTIVE) {
          if (floorNum === 2 && MONSTERS['Crown Alliance General']) {
            bossName = 'Crown Alliance General';
          } else if (floorNum === 3 && MONSTERS['Shadow Covenant Assassin']) {
            bossName = 'Shadow Covenant Assassin';
          }
        }
        // Floor 5 (index 4) Free Peoples Champion only if no faction boss override
        if (floorNum === 4 && typeof warState !== 'undefined' && warState !== WAR_STATE.INACTIVE && MONSTERS['Free Peoples Champion']) {
          bossName = 'Free Peoples Champion';
        }
        const bossTemplate = MONSTERS[bossName];
        boss = {
          ...deepClone(bossTemplate),
          maxHp: bossTemplate.hp + rand(0, Math.floor(bossTemplate.hp * 0.2)),
          id: Math.random().toString(36).substr(2, 9),
          conditions: [],
          px: room.x + Math.floor(room.w / 2),
          py: room.y + Math.floor(room.h / 2),
        };
        boss.hp = boss.maxHp;
      }
      room.enemies = [boss];
    } else if (room.type === ROOM_TYPE.NPC) {
      room.npc = deepClone(COMPANION_POOL[floorNum % COMPANION_POOL.length]);
      room.npcRecruited = false;
      room.npcDismissed = false;
    } else if (room.type === ROOM_TYPE.SHOP) {
      room.shopStock = [];
      // Always stock potions
      for (const p of SHOP_ITEMS.potions) {
        room.shopStock.push({ ...p, qty: rand(2, 5) });
      }
      // Stock some armor
      for (const a of SHOP_ITEMS.armor) {
        if (Math.random() < 0.6) room.shopStock.push({ ...a, qty: 1 });
      }
      // Stock tier-appropriate weapons
      const weaponTier = Math.min(floorNum, SHOP_ITEMS.weapons.length - 1);
      for (const w of SHOP_ITEMS.weapons[weaponTier]) {
        if (Math.random() < 0.7) room.shopStock.push({ ...w, qty: 1 });
      }
    } else if (room.type === ROOM_TYPE.EVOLUTION_QUEST) {
      room.evolutionTrialComplete = false;
      room.evolutionTrialStarted = false;
      // The trial details are determined by player class at interaction time
    } else if (room.type === ROOM_TYPE.WAR_ENCOUNTER) {
      // War encounter room: faction enemies or generic war ambush
      const warGroupKeys = typeof WAR_ENCOUNTER_GROUPS !== 'undefined' ? Object.keys(WAR_ENCOUNTER_GROUPS) : [];
      if (warGroupKeys.length > 0) {
        const groupKey = pick(warGroupKeys);
        const groupData = WAR_ENCOUNTER_GROUPS[groupKey];
        const numEnemies = Math.min(groupData.count || 2, 3);
        for (let i = 0; i < numEnemies; i++) {
          const template = MONSTERS[groupData.enemy] || MONSTERS[pick(FLOOR_MONSTERS[Math.min(floorNum, FLOOR_MONSTERS.length - 1)])];
          if (template) {
            const enemy = {
              ...deepClone(template),
              maxHp: Math.round((template.hp || 20) * (groupData.hpMult || 1.2)),
              id: Math.random().toString(36).substr(2, 9),
              conditions: [],
              px: room.x + rand(1, room.w - 2),
              py: room.y + rand(1, room.h - 2),
              isWarEnemy: true,
              warGroup: groupKey,
            };
            enemy.hp = enemy.maxHp;
            // Give faction enemies a small attack bonus
            if (typeof groupData.attackBonus === 'number') {
              enemy.attack = (enemy.attack || 0) + groupData.attackBonus;
            }
            room.enemies.push(enemy);
          }
        }
        room.warGroup = groupKey;
        room.gold = rand(20 + floorNum * 8, 50 + floorNum * 15);
        // Completing a war encounter may progress active faction quest
        room.isFactionQuestTarget = activeFactionQuest && activeFactionQuest.questData.type === 'combat' && !activeFactionQuest.completed;
      } else {
        // Fallback: regular combat room
        const numEnemies = rand(1, 3);
        for (let i = 0; i < numEnemies; i++) {
          const template = MONSTERS[pick(FLOOR_MONSTERS[Math.min(floorNum, FLOOR_MONSTERS.length - 1)])];
          if (template) {
            const enemy = {
              ...deepClone(template),
              maxHp: template.hp + rand(0, Math.floor(template.hp * 0.2)),
              id: Math.random().toString(36).substr(2, 9),
              conditions: [],
              px: room.x + rand(1, room.w - 2),
              py: room.y + rand(1, room.h - 2),
            };
            enemy.hp = enemy.maxHp;
            room.enemies.push(enemy);
          }
        }
      }
    }
  }

  return { tiles, rooms, width: MAP_W, height: MAP_H };
}

function carveCorridor(tiles, x1, y1, x2, y2) {
  let cx = x1, cy = y1;
  // L-shaped corridor
  while (cx !== x2) {
    if (cy >= 0 && cy < MAP_H && cx >= 0 && cx < MAP_W) {
      if (tiles[cy][cx] === TILE.VOID || tiles[cy][cx] === TILE.WALL) {
        tiles[cy][cx] = TILE.CORRIDOR;
      }
      // Walls along corridor
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const ny = cy + dy, nx = cx + dx;
          if (ny >= 0 && ny < MAP_H && nx >= 0 && nx < MAP_W) {
            if (tiles[ny][nx] === TILE.VOID) tiles[ny][nx] = TILE.WALL;
          }
        }
      }
    }
    cx += cx < x2 ? 1 : -1;
  }
  while (cy !== y2) {
    if (cy >= 0 && cy < MAP_H && cx >= 0 && cx < MAP_W) {
      if (tiles[cy][cx] === TILE.VOID || tiles[cy][cx] === TILE.WALL) {
        tiles[cy][cx] = TILE.CORRIDOR;
      }
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const ny = cy + dy, nx = cx + dx;
          if (ny >= 0 && ny < MAP_H && nx >= 0 && nx < MAP_W) {
            if (tiles[ny][nx] === TILE.VOID) tiles[ny][nx] = TILE.WALL;
          }
        }
      }
    }
    cy += cy < y2 ? 1 : -1;
  }
}

function weightedPick(items) {
  const total = items.reduce((s, i) => s + i.weight, 0);
  let r = Math.random() * total;
  for (const item of items) {
    r -= item.weight;
    if (r <= 0) return item.type;
  }
  return items[items.length - 1].type;
}

function generateTreasureItem(floorNum) {
  const roll = Math.random();
  if (roll < 0.4) {
    // Common consumable
    return makeItem(pick([ITEM_TEMPLATES['Health Potion'], ITEM_TEMPLATES['Antidote']]));
  } else if (roll < 0.6) {
    // Common weapon
    return makeItem(pick([ITEM_TEMPLATES['Dagger'], ITEM_TEMPLATES['Mace'], ITEM_TEMPLATES['Staff']]));
  } else if (roll < 0.8) {
    // Uncommon
    const uw = pick(UNCOMMON_WEAPONS);
    const base = { ...ITEM_TEMPLATES[uw.base], name: uw.name, bonusDamage: uw.bonusDamage, desc: uw.desc };
    return makeItem(base, RARITY.UNCOMMON);
  } else if (roll < 0.93 || floorNum >= 1) {
    // Rare (more likely on deeper floors)
    if (floorNum >= 1 && Math.random() < 0.5) {
      const rw = pick(RARE_WEAPONS);
      const base = { ...ITEM_TEMPLATES[rw.base], name: rw.name, bonusDamage: rw.bonusDamage, desc: rw.desc };
      return makeItem(base, RARITY.RARE);
    }
    return makeItem(pick([ITEM_TEMPLATES['Greater Health Potion']]), RARITY.UNCOMMON);
  } else {
    // Legendary (very rare, floor 2 only)
    if (floorNum >= 2) {
      const lw = pick(LEGENDARY_WEAPONS);
      const base = { ...ITEM_TEMPLATES[lw.base], name: lw.name, bonusDamage: lw.bonusDamage, desc: lw.desc };
      return makeItem(base, RARITY.LEGENDARY);
    }
    return makeItem(ITEM_TEMPLATES['Greater Health Potion'], RARITY.UNCOMMON);
  }
}

// ============================================================
// FOG OF WAR & VISIBILITY
// ============================================================
function revealArea(px, py, radius) {
  if (!player.exploredTiles[currentFloor]) player.exploredTiles[currentFloor] = [];
  const explored = player.exploredTiles[currentFloor];
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx * dx + dy * dy <= radius * radius) {
        const tx = px + dx, ty = py + dy;
        if (tx >= 0 && tx < MAP_W && ty >= 0 && ty < MAP_H) {
          const key = `${tx},${ty}`;
          if (!explored.includes(key)) explored.push(key);
        }
      }
    }
  }
}

function isVisible(tx, ty) {
  const dx = tx - player.x, dy = ty - player.y;
  return dx * dx + dy * dy <= player.torchRadius * player.torchRadius;
}

function isExplored(tx, ty) {
  if (!player.exploredTiles[currentFloor]) return false;
  return player.exploredTiles[currentFloor].includes(`${tx},${ty}`);
}

// ============================================================
// DUNGEON RENDERING & UPDATE
// ============================================================
let cameraX = 0, cameraY = 0;
let dungeonMessage = '';
let dungeonMessageTimer = 0;
let interactPrompt = '';

function updateDungeon(dt) {
  const floor = dungeon.floors[currentFloor];

  // Camera follow
  const targetCX = player.x * TILE_SIZE - canvasW / 2 + TILE_SIZE / 2;
  const targetCY = player.y * TILE_SIZE - canvasH / 2 + TILE_SIZE / 2;
  cameraX += (targetCX - cameraX) * 0.15;
  cameraY += (targetCY - cameraY) * 0.15;

  // Movement
  const now = performance.now();
  if (now - lastMoveTime > MOVE_DELAY) {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup'] || touchDpadDir === 'up') dy = -1;
    if (keys['s'] || keys['arrowdown'] || touchDpadDir === 'down') dy = 1;
    if (keys['a'] || keys['arrowleft'] || touchDpadDir === 'left') dx = -1;
    if (keys['d'] || keys['arrowright'] || touchDpadDir === 'right') dx = 1;

    if (dx !== 0 || dy !== 0) {
      // Prioritize one direction
      if (dx !== 0 && dy !== 0) { if (Math.random() < 0.5) dx = 0; else dy = 0; }
      tryMove(dx, dy);
      lastMoveTime = now;
    }
  }

  // Check for interact
  interactPrompt = '';
  const tile = floor.tiles[player.y]?.[player.x];
  if (tile === TILE.STAIRS_DOWN) {
    interactPrompt = currentFloor < 2 ? 'Press E to descend' : 'Press E to enter the depths';
  } else if (tile === TILE.STAIRS_UP) {
    interactPrompt = 'Press E to ascend';
  }

  // Check current room
  const room = getRoomAt(player.x, player.y);
  if (room && !room.visited) {
    room.visited = true;
    enterRoom(room);
  }

  // Shrine interaction
  if (room && room.type === ROOM_TYPE.SHRINE && !room.shrineUsed) {
    interactPrompt = 'Press E to rest at shrine';
  }

  // Treasure room items
  if (room && room.type === ROOM_TYPE.TREASURE && !room.cleared && room.items.length > 0) {
    interactPrompt = 'Press E to loot treasure';
  }

  // Interact key
  if (keys['e'] || keys['E']) {
    keys['e'] = false; keys['E'] = false;
    handleInteract(floor, room);
  }

  // Toggle keys
  if (keys['i'] || keys['I']) { keys['i'] = false; keys['I'] = false; gameState = STATE.INVENTORY; }
  if (keys['c'] || keys['C']) { keys['c'] = false; keys['C'] = false; gameState = STATE.CHAR_SHEET; }
  if (keys['p'] || keys['P']) { keys['p'] = false; keys['P'] = false; gameState = STATE.PARTY_MGMT; }
  if (keys['?'] || keys['/']) { keys['?'] = false; keys['/'] = false; helpOpen = !helpOpen; if (helpOpen) gameState = STATE.HELP; }

  // Message timer
  if (dungeonMessageTimer > 0) dungeonMessageTimer -= dt;

  // Render
  renderDungeon(floor);
  renderUI();
  renderMinimap(floor);

  // Mobile controls
  if (isMobile) renderMobileControls();

  // Floating texts
  updateFloatingTexts(dt);

  // Interact prompt
  if (interactPrompt) {
    X.fillStyle = 'rgba(0,0,0,0.7)';
    const pw = X.measureText(interactPrompt).width + 20;
    X.fillRect(canvasW/2 - pw/2, canvasH - 140, pw, 28);
    X.fillStyle = '#ffd700';
    X.font = '14px Consolas, monospace';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(interactPrompt, canvasW/2, canvasH - 126);
  }

  // Dungeon message
  if (dungeonMessageTimer > 0 && dungeonMessage) {
    X.fillStyle = 'rgba(0,0,0,0.8)';
    X.font = '14px Consolas, monospace';
    const mw = X.measureText(dungeonMessage).width + 30;
    X.fillRect(canvasW/2 - mw/2, canvasH * 0.35, mw, 30);
    X.fillStyle = '#fff';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(dungeonMessage, canvasW/2, canvasH * 0.35 + 15);
  }
}

function tryMove(dx, dy) {
  const nx = player.x + dx, ny = player.y + dy;
  const floor = dungeon.floors[currentFloor];
  if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) return;
  const tile = floor.tiles[ny][nx];
  if (tile === TILE.VOID || tile === TILE.WALL) return;

  player.x = nx;
  player.y = ny;
  revealArea(nx, ny, player.torchRadius);
}

function getRoomAt(px, py) {
  const floor = dungeon.floors[currentFloor];
  for (const room of floor.rooms) {
    if (px >= room.x && px < room.x + room.w && py >= room.y && py < room.y + room.h) {
      return room;
    }
  }
  return null;
}

function enterRoom(room) {
  switch (room.type) {
    case ROOM_TYPE.COMBAT:
      if (room.enemies.length > 0 && !room.cleared) {
        dungeonMessage = 'Enemies ahead!';
        dungeonMessageTimer = 1.5;
        setTimeout(() => {
          if (room.enemies.length > 0 && !room.cleared) {
            startCombat(room);
          }
        }, 300);
      }
      break;
    case ROOM_TYPE.TRAP:
      if (!room.trapTriggered) {
        handleTrap(room);
      }
      break;
    case ROOM_TYPE.TREASURE:
      if (!room.cleared) {
        dungeonMessage = 'You found a treasure room!';
        dungeonMessageTimer = 2;
        SFX.chest();
      }
      break;
    case ROOM_TYPE.SHRINE:
      dungeonMessage = 'A peaceful shrine. You can rest here.';
      dungeonMessageTimer = 2;
      break;
    case ROOM_TYPE.EMPTY:
      const msgs = ['An empty chamber.', 'Dust and cobwebs.', 'Nothing of interest here.', 'The silence is unsettling.'];
      dungeonMessage = pick(msgs);
      dungeonMessageTimer = 1.5;
      break;
    case ROOM_TYPE.STAIRS:
      dungeonMessage = currentFloor < 6 ? 'Stairs leading deeper into the dungeon.' : 'The final stairway descends into primordial chaos...';
      dungeonMessageTimer = 2;
      SFX.stairs();
      break;
    case ROOM_TYPE.BOSS:
      if (room.enemies.length > 0 && !room.cleared) {
        const bossName = room.enemies[0].name;
        dungeonMessage = `BOSS: ${bossName} blocks the way!`;
        dungeonMessageTimer = 2;
        setTimeout(() => {
          if (room.enemies.length > 0 && !room.cleared) {
            startCombat(room);
          }
        }, 500);
      }
      break;
    case ROOM_TYPE.SHOP:
      if (!room.visited) {
        dungeonMessage = 'A merchant has set up shop here.';
        dungeonMessageTimer = 2;
        SFX.click();
      }
      break;
    case ROOM_TYPE.NPC:
      if (room.npc && !room.npcDismissed && !(player.squad||[]).some(c => c.name === room.npc?.name)) {
        dungeonMessage = `${room.npc.name} stands here. ${room.npc.greeting}`;
        dungeonMessageTimer = 3;
        SFX.click();
        // Show companion opinions
        if (player.squad && player.squad.length > 0) {
          const commenter = pick(player.squad);
          const npcPool = COMPANION_POOL.find(c => c.name === room.npc.name);
          if (npcPool) {
            const shortNew = room.npc.name.split(' ')[0];
            const commShort = getCompShortName(commenter.name);
            if (npcPool.opinions?.likes?.includes(commShort)) {
              setTimeout(() => addFloatingText(canvasW/2, canvasH/2 - 50, `${commenter.name}: "I know ${shortNew}. Good fighter."`, commenter.color), 500);
            } else if (npcPool.opinions?.dislikes?.includes(commShort)) {
              setTimeout(() => addFloatingText(canvasW/2, canvasH/2 - 50, `${commenter.name}: "I don't trust ${shortNew}..."`, commenter.color), 500);
            }
          }
        }
      }
      break;
    case ROOM_TYPE.EVOLUTION_QUEST:
      if (!room.evolutionTrialComplete && !player.evolution) {
        const paths = EVOLUTION_PATHS[player.class];
        if (paths) {
          dungeonMessage = 'A mystical trial chamber pulses with power. Your class evolution awaits!';
          dungeonMessageTimer = 3;
          SFX.spell();
        }
      }
      break;
    case ROOM_TYPE.WAR_ENCOUNTER:
      if (!room.cleared && room.enemies && room.enemies.length > 0) {
        const leader = room.enemies[0];
        dungeonMessage = `${leader.name} stands in your path! War encounter!`;
        dungeonMessageTimer = 2;
        SFX.trap();
        setTimeout(() => {
          if (!room.cleared && room.enemies.length > 0) {
            startCombat(room);
          }
        }, 400);
      }
      break;
  }

  // Assassin encounter check on entering any room past floor 2
  if (assassinsActive && currentFloor >= 2 && !room.cleared && Math.random() < 0.12) {
    if (checkAssassinEncounter()) {
      spawnAssassinEncounter(room);
    }
  }
}

function handleInteract(floor, room) {
  const tile = floor.tiles[player.y]?.[player.x];

  // Check if boss is defeated before allowing stairs
  if (tile === TILE.STAIRS_DOWN) {
    const bossRoom = floor.rooms.find(r => r.type === ROOM_TYPE.BOSS);
    if (bossRoom && !bossRoom.cleared) {
      dungeonMessage = 'A powerful guardian blocks the way. Defeat the boss first!';
      dungeonMessageTimer = 2.5;
      SFX.trap();
      mouseClicked = false;
      return;
    }
  }

  if (tile === TILE.STAIRS_DOWN && currentFloor < 7) {
    // Enter town between floors
    SFX.stairs();
    changeRep(5, 'Floor Cleared');
    // Clear per-floor NPC flags when entering town (they apply for one floor only)
    const perFloorFlags = ['marta_trap_intel','elara_poison_ward','grimjaw_armor_knowledge','verendis_seal_knowledge','thessa_bestiary','thessa_warding_word','rolo_boss_pattern','kael_boss_pattern'];
    perFloorFlags.forEach(f => delete npcFlags[f]);
    townData = {
      floorCleared: currentFloor,
      nextFloor: currentFloor + 1,
      healUsed: false,
      recruitChecked: false,
    };
    // Trigger war arc after clearing floor 2 (index 2)
    if (currentFloor === 2 && warState === WAR_STATE.INACTIVE) {
      triggerWarArc();
      warChoiceState.phase = 'intro';
      gameState = STATE.WAR_CHOICE;
      saveGame();
      return;
    }
    gameState = STATE.TOWN;
    saveGame();
    return;
  } else if (tile === TILE.STAIRS_DOWN && currentFloor === 7) {
    // Victory!
    gameState = STATE.VICTORY;
    SFX.levelUp();
  } else if (tile === TILE.STAIRS_UP && currentFloor > 0) {
    currentFloor--;
    player.floor = currentFloor;
    const stairRoom = dungeon.floors[currentFloor].rooms.find(r => r.type === ROOM_TYPE.STAIRS);
    if (stairRoom) {
      player.x = stairRoom.cx;
      player.y = stairRoom.cy;
    }
    revealArea(player.x, player.y, player.torchRadius);
    dungeonMessage = `Ascended to Floor ${currentFloor + 1}`;
    dungeonMessageTimer = 2;
    SFX.stairs();
  }

  if (room) {
    if (room.type === ROOM_TYPE.SHRINE && !room.shrineUsed) {
      room.shrineUsed = true;
      player.hp = player.maxHp;
      player.spellSlots = player.maxSpellSlots;
      player.secondWindUsed = false;
      player.actionSurgeUsed = false;
      player.relentlessUsed = false;
      player.stonesEnduranceUsed = false;
      player.healingHandsUsed = false;
      player.breathWeaponUsed = false;
      player.felineAgilityUsed = false;
      player.rageCount = 0;
      player.kiPoints = player.maxKiPoints;
      player.wildShapeUsed = 0;
      player.sorceryPoints = player.maxSorceryPoints;
      player.conditions = [];
      if (player.squad) { player.squad.forEach(c => { c.hp = c.maxHp; }); }
      // Loyalty bonus for using shrine
      applyLoyaltyEvent('use_shrine');
      // Check for companion conflict after shrine decision
      if (player.squad && player.squad.length >= 2) checkCompanionConflict();
      dungeonMessage = 'Rested at shrine. HP and spells restored!';
      dungeonMessageTimer = 2.5;
      SFX.heal();
      addFloatingText(canvasW/2, canvasH/2 - 40, 'FULLY RESTORED', '#44ff44');
      changeRep(1, 'Shrine Offering');
      saveGame();
    }

    if (room.type === ROOM_TYPE.TREASURE && !room.cleared) {
      // Collect items
      for (const item of room.items) {
        player.inventory.push(item);
        addFloatingText(canvasW/2, canvasH/2 - 20, `+${item.name}`, RARITY_COLORS[item.rarity || 'common']);
      }
      if (room.gold) {
        player.gold += room.gold;
        addFloatingText(canvasW/2, canvasH/2, `+${room.gold} gold`, '#ffd700');
      }
      room.items = [];
      room.cleared = true;
      SFX.chest();
    }

    if (room.type === ROOM_TYPE.SHOP && room.shopStock && room.shopStock.length > 0) {
      shopRoom = room;
      shopScrollY = 0;
      gameState = STATE.SHOP;
      SFX.click();
    }

    const alreadyRecruited = room.npc && (player.squad||[]).some(c => c.name === room.npc.name);
    if (room.type === ROOM_TYPE.NPC && room.npc && !room.npcDismissed && !alreadyRecruited) {
      npcRoom = room;
      gameState = STATE.NPC_TALK;
      SFX.click();
    }

    if (room.type === ROOM_TYPE.EVOLUTION_QUEST && !room.evolutionTrialComplete && !player.evolution && player.level >= 3) {
      evolutionRoom = room;
      gameState = STATE.EVOLUTION;
      SFX.spell();
    }
  }
}

function handleTrap(room) {
  room.trapTriggered = true;

  // Perception check to spot trap
  let trapBonus = 0;
  if (npcFlags.marta_trap_intel) { trapBonus += 3; } // Marta's hidden passage intel
  const percCheck = d20() + mod(player.stats.WIS) + (player.proficiencies.includes('Perception') ? PROF_BONUS[player.level] : 0) + trapBonus;
  // Halfling lucky: reroll 1s
  let spotted = percCheck >= room.trapDC;
  if (spotted && npcFlags.marta_trap_intel) {
    dungeonMessage += ' (Marta\'s intel helped!)';
  }

  if (spotted) {
    dungeonMessage = `Spotted a ${room.trapType === 'pit' ? 'pit trap' : 'poison dart trap'}! Avoided it.`;
    dungeonMessageTimer = 2;
    SFX.click();
    return;
  }

  SFX.trap();

  if (room.trapType === 'pit') {
    // DEX save
    let saveRoll = d20();
    // Halfling reroll 1s
    if (player.race === 'Halfling' && saveRoll === 1) saveRoll = d20();
    const save = saveRoll + mod(player.stats.DEX) + (player.savingThrows.includes('DEX') ? PROF_BONUS[player.level] : 0);
    if (save >= 12) {
      dungeonMessage = 'Pit trap! You leap aside (DEX save success)';
      dungeonMessageTimer = 2;
    } else {
      const dmg = rollDice(1, 6);
      player.hp = Math.max(0, player.hp - dmg);
      dungeonMessage = `Pit trap! Fell in for ${dmg} damage!`;
      dungeonMessageTimer = 2;
      addFloatingText(canvasW/2, canvasH/2, `-${dmg}`, '#ff4444');
      checkPlayerDeath();
    }
  } else if (room.trapType === 'poison_dart') {
    let saveRoll = d20();
    if (player.race === 'Halfling' && saveRoll === 1) saveRoll = d20();
    const save = saveRoll + mod(player.stats.CON) + (player.savingThrows.includes('CON') ? PROF_BONUS[player.level] : 0);
    const hasPoisonResist = player.race === 'Dwarf';
    if (save >= 13) {
      dungeonMessage = 'Poison darts! You dodged them (CON save success)';
      dungeonMessageTimer = 2;
    } else {
      let dmg = rollDice(1, 4);
      if (hasPoisonResist || npcFlags.elara_poison_ward) dmg = Math.floor(dmg / 2);
      player.hp = Math.max(0, player.hp - dmg);
      if (!hasPoisonResist && !npcFlags.elara_poison_ward) {
        player.conditions.push({ type: 'poisoned', turns: 3 });
      }
      const wardNote = npcFlags.elara_poison_ward ? ' (Elara\'s ward!)' : '';
      dungeonMessage = `Poison darts! ${dmg} damage${!hasPoisonResist && !npcFlags.elara_poison_ward ? ' + poisoned!' : ' (resisted poison' + wardNote + ')'}`;

      dungeonMessageTimer = 2.5;
      addFloatingText(canvasW/2, canvasH/2, `-${dmg}`, '#44ff44');
      checkPlayerDeath();
    }
  } else if (room.trapType === 'fire_glyph') {
    let saveRoll = d20();
    if (player.race === 'Halfling' && saveRoll === 1) saveRoll = d20();
    const save = saveRoll + mod(player.stats.DEX) + (player.savingThrows.includes('DEX') ? PROF_BONUS[player.level] : 0);
    const hasFireResist = player.race === 'Tiefling';
    if (save >= room.trapDC) {
      dungeonMessage = 'Fire glyph! You leapt clear (DEX save success)';
      dungeonMessageTimer = 2;
    } else {
      let dmg = rollDice(2, 6);
      if (hasFireResist) dmg = Math.floor(dmg / 2);
      player.hp = Math.max(0, player.hp - dmg);
      dungeonMessage = `Fire glyph erupts! ${dmg} fire damage${hasFireResist ? ' (resisted)' : ''}!`;
      dungeonMessageTimer = 2;
      addFloatingText(canvasW/2, canvasH/2, `-${dmg}`, '#ff6600');
      spawnParticles(canvasW/2, canvasH/2, '#ff4400', 15);
      checkPlayerDeath();
    }
  } else if (room.trapType === 'spike_floor') {
    let saveRoll = d20();
    if (player.race === 'Halfling' && saveRoll === 1) saveRoll = d20();
    const save = saveRoll + mod(player.stats.DEX) + (player.savingThrows.includes('DEX') ? PROF_BONUS[player.level] : 0);
    if (save >= room.trapDC) {
      dungeonMessage = 'Spike floor! You jumped across (DEX save success)';
      dungeonMessageTimer = 2;
    } else {
      const dmg = rollDice(2, 4);
      player.hp = Math.max(0, player.hp - dmg);
      dungeonMessage = `Spikes shoot up! ${dmg} piercing damage!`;
      dungeonMessageTimer = 2;
      addFloatingText(canvasW/2, canvasH/2, `-${dmg}`, '#cccccc');
      checkPlayerDeath();
    }
  } else if (room.trapType === 'gas_cloud') {
    let saveRoll = d20();
    if (player.race === 'Halfling' && saveRoll === 1) saveRoll = d20();
    const save = saveRoll + mod(player.stats.CON) + (player.savingThrows.includes('CON') ? PROF_BONUS[player.level] : 0);
    const hasPoisonResist = player.race === 'Dwarf';
    if (save >= room.trapDC) {
      dungeonMessage = 'Noxious gas! You held your breath (CON save success)';
      dungeonMessageTimer = 2;
    } else {
      let dmg = rollDice(1, 8);
      if (hasPoisonResist) dmg = Math.floor(dmg / 2);
      player.hp = Math.max(0, player.hp - dmg);
      player.conditions.push({ type: 'poisoned', turns: 5 });
      dungeonMessage = `Gas cloud! ${dmg} damage + poisoned for 5 turns!`;
      dungeonMessageTimer = 2.5;
      addFloatingText(canvasW/2, canvasH/2, `-${dmg}`, '#80ff80');
      checkPlayerDeath();
    }
  }
}

function checkPlayerDeath() {
  if (player.hp <= 0) {
    // Orc Relentless Endurance
    if (player.race === 'Orc' && !player.relentlessUsed) {
      player.hp = 1;
      player.relentlessUsed = true;
      dungeonMessage = 'Relentless Endurance! You survive with 1 HP!';
      dungeonMessageTimer = 2;
      addFloatingText(canvasW/2, canvasH/2 - 30, 'RELENTLESS!', '#ff8800');
      return;
    }
    // Goliath Stone's Endurance — reduce damage by d12+CON, once/rest
    if (player.race === 'Goliath' && !player.stonesEnduranceUsed) {
      const reduction = rollDice(1,12) + mod(player.stats.CON);
      player.hp = Math.max(1, player.hp + reduction);
      player.stonesEnduranceUsed = true;
      dungeonMessage = `Stone's Endurance! Reduced ${reduction} damage!`;
      dungeonMessageTimer = 2;
      addFloatingText(canvasW/2, canvasH/2 - 30, 'STONE\'S ENDURANCE!', '#808898');
      return;
    }
    // Aasimar Healing Hands — heal = level once when near death
    if (player.race === 'Aasimar' && !player.healingHandsUsed) {
      player.hp = Math.max(1, player.level);
      player.healingHandsUsed = true;
      dungeonMessage = `Healing Hands! Divine light restores ${player.level} HP!`;
      dungeonMessageTimer = 2;
      addFloatingText(canvasW/2, canvasH/2 - 30, 'DIVINE HEAL!', '#e0d0a0');
      return;
    }
    player.hp = 0;
    player.isDead = true;
    gameState = STATE.GAME_OVER;
    SFX.death();
  }
}

// ============================================================
// DUNGEON RENDER
// ============================================================
function renderDungeon(floor) {
  X.fillStyle = '#000';
  X.fillRect(0, 0, canvasW, canvasH);

  const startTX = Math.floor(cameraX / TILE_SIZE) - 1;
  const startTY = Math.floor(cameraY / TILE_SIZE) - 1;
  const endTX = startTX + Math.ceil(canvasW / TILE_SIZE) + 3;
  const endTY = startTY + Math.ceil(canvasH / TILE_SIZE) + 3;

  // Draw tiles
  for (let ty = startTY; ty <= endTY; ty++) {
    for (let tx = startTX; tx <= endTX; tx++) {
      if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) continue;

      const sx = tx * TILE_SIZE - cameraX;
      const sy = ty * TILE_SIZE - cameraY;
      const tile = floor.tiles[ty][tx];
      const visible = isVisible(tx, ty);
      const explored = isExplored(tx, ty);

      if (!visible && !explored) continue; // Black fog

      let color;
      switch (tile) {
        case TILE.WALL: color = visible ? '#3a3a4a' : '#1a1a22'; break;
        case TILE.FLOOR: color = visible ? '#2a2a30' : '#151518'; break;
        case TILE.CORRIDOR: color = visible ? '#252530' : '#121215'; break;
        case TILE.DOOR: color = visible ? '#6a4a2a' : '#352515'; break;
        case TILE.STAIRS_DOWN: color = visible ? '#4a2a5a' : '#251530'; break;
        case TILE.STAIRS_UP: color = visible ? '#2a4a5a' : '#152530'; break;
        default: continue;
      }

      X.fillStyle = color;
      X.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);

      // Tile details
      if (visible) {
        if (tile === TILE.WALL) {
          X.strokeStyle = '#4a4a5a';
          X.lineWidth = 0.5;
          X.strokeRect(sx + 1, sy + 1, TILE_SIZE - 2, TILE_SIZE - 2);
          // Stone texture
          X.fillStyle = '#444450';
          X.fillRect(sx + 3, sy + 3, 4, 3);
          X.fillRect(sx + 12, sy + 8, 5, 3);
          X.fillRect(sx + 5, sy + 15, 4, 3);
        } else if (tile === TILE.STAIRS_DOWN) {
          X.fillStyle = '#8a4aaa';
          X.font = 'bold 16px Consolas, monospace';
          X.textAlign = 'center'; X.textBaseline = 'middle';
          X.fillText('>', sx + TILE_SIZE/2, sy + TILE_SIZE/2);
        } else if (tile === TILE.STAIRS_UP) {
          X.fillStyle = '#4a8aaa';
          X.font = 'bold 16px Consolas, monospace';
          X.textAlign = 'center'; X.textBaseline = 'middle';
          X.fillText('<', sx + TILE_SIZE/2, sy + TILE_SIZE/2);
        }
      }

      // Dim overlay for explored but not visible
      if (!visible && explored) {
        X.fillStyle = 'rgba(0,0,0,0.5)';
        X.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Torch light gradient
  const plSX = player.x * TILE_SIZE - cameraX + TILE_SIZE/2;
  const plSY = player.y * TILE_SIZE - cameraY + TILE_SIZE/2;
  const lightRadius = player.torchRadius * TILE_SIZE;

  // Darkness overlay with light hole
  X.save();
  X.globalCompositeOperation = 'source-over';

  // Draw darkness around the light
  const grad = X.createRadialGradient(plSX, plSY, lightRadius * 0.3, plSX, plSY, lightRadius);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.3)');
  grad.addColorStop(1, 'rgba(0,0,0,0.7)');
  X.fillStyle = grad;
  X.fillRect(0, 0, canvasW, canvasH);
  X.restore();

  // Draw room indicators for visible rooms
  for (const room of floor.rooms) {
    if (!isVisible(room.cx, room.cy) && !isExplored(room.cx, room.cy)) continue;
    const rx = room.cx * TILE_SIZE - cameraX + TILE_SIZE/2;
    const ry = room.y * TILE_SIZE - cameraY - 8;

    if (room.type === ROOM_TYPE.SHRINE && !room.shrineUsed && isVisible(room.cx, room.cy)) {
      X.fillStyle = '#44aaff';
      X.font = '12px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('+ Shrine +', rx, ry);
    }
    if (room.type === ROOM_TYPE.TREASURE && !room.cleared && isVisible(room.cx, room.cy)) {
      X.fillStyle = '#ffd700';
      X.font = '12px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('$ Treasure $', rx, ry);
    }
    if (room.type === ROOM_TYPE.BOSS && !room.cleared && isVisible(room.cx, room.cy)) {
      X.fillStyle = '#ff4444';
      X.font = 'bold 12px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('!! BOSS !!', rx, ry);
    }
    if (room.type === ROOM_TYPE.SHOP && isVisible(room.cx, room.cy)) {
      X.fillStyle = '#44ff88';
      X.font = '12px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('$ Shop $', rx, ry);
    }
    const npcInSquad = room.npc && (player.squad||[]).some(c => c.name === room.npc.name);
    if (room.type === ROOM_TYPE.NPC && !room.npcDismissed && !npcInSquad && isVisible(room.cx, room.cy)) {
      X.fillStyle = '#ffaa44';
      X.font = '12px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('? NPC ?', rx, ry);
    }
    if (room.type === ROOM_TYPE.EVOLUTION_QUEST && !room.evolutionTrialComplete && isVisible(room.cx, room.cy)) {
      X.fillStyle = '#ff66ff';
      X.font = 'bold 12px Consolas, monospace';
      X.textAlign = 'center';
      X.fillText('* EVOLUTION *', rx, ry);
    }
  }

  // Draw player
  const px = player.x * TILE_SIZE - cameraX;
  const py = player.y * TILE_SIZE - cameraY;
  const cls = CLASSES[player.class];

  // Player glow
  X.fillStyle = cls.color + '30';
  X.beginPath();
  X.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, TILE_SIZE * 0.7, 0, Math.PI * 2);
  X.fill();

  // Player body
  X.fillStyle = cls.color;
  X.beginPath();
  X.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, TILE_SIZE * 0.4, 0, Math.PI * 2);
  X.fill();

  // Class letter
  X.fillStyle = '#fff';
  X.font = 'bold 12px Consolas, monospace';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(player.class[0], px + TILE_SIZE/2, py + TILE_SIZE/2 + 1);

  // HP bar under player
  const hpPct = player.hp / player.maxHp;
  X.fillStyle = '#300';
  X.fillRect(px + 2, py + TILE_SIZE + 2, TILE_SIZE - 4, 3);
  X.fillStyle = hpPct > 0.5 ? '#0c0' : hpPct > 0.25 ? '#cc0' : '#c00';
  X.fillRect(px + 2, py + TILE_SIZE + 2, (TILE_SIZE - 4) * hpPct, 3);

  // Render particles
  renderParticles();
}

// ============================================================
// MINIMAP
// ============================================================
function renderMinimap(floor) {
  const mmSize = isMobile ? 90 : 120;
  const mmX = canvasW - mmSize - 10;
  const mmY = 10;
  const tileW = mmSize / MAP_W;
  const tileH = mmSize / MAP_H;

  // Background
  X.fillStyle = 'rgba(0,0,0,0.7)';
  X.fillRect(mmX - 2, mmY - 2, mmSize + 4, mmSize + 4);
  X.strokeStyle = '#555';
  X.lineWidth = 1;
  X.strokeRect(mmX - 2, mmY - 2, mmSize + 4, mmSize + 4);

  for (let ty = 0; ty < MAP_H; ty++) {
    for (let tx = 0; tx < MAP_W; tx++) {
      if (!isExplored(tx, ty)) continue;
      const tile = floor.tiles[ty][tx];
      if (tile === TILE.VOID) continue;

      let color;
      if (tile === TILE.WALL) color = '#444';
      else if (tile === TILE.STAIRS_DOWN) color = '#a040c0';
      else if (tile === TILE.STAIRS_UP) color = '#40a0c0';
      else color = '#666';

      X.fillStyle = color;
      X.fillRect(mmX + tx * tileW, mmY + ty * tileH, Math.ceil(tileW), Math.ceil(tileH));
    }
  }

  // Player dot
  X.fillStyle = '#fff';
  X.fillRect(mmX + player.x * tileW - 1, mmY + player.y * tileH - 1, 3, 3);

  // Floor label
  X.fillStyle = '#aaa';
  X.font = '10px Consolas, monospace';
  X.textAlign = 'right'; X.textBaseline = 'top';
  X.fillText(`F${currentFloor + 1}`, mmX + mmSize, mmY + mmSize + 4);
}

// ============================================================
// HUD / UI
// ============================================================
function renderUI() {
  // HP bar top-left
  const barX = 10, barY = 10, barW = isMobile ? 140 : 180, barH = 18;
  const hpPct = player.hp / player.maxHp;

  X.fillStyle = 'rgba(0,0,0,0.7)';
  X.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  X.fillStyle = '#400';
  X.fillRect(barX, barY, barW, barH);
  X.fillStyle = hpPct > 0.5 ? '#c00' : hpPct > 0.25 ? '#c80' : '#800';
  X.fillRect(barX, barY, barW * hpPct, barH);
  X.strokeStyle = '#888';
  X.lineWidth = 1;
  X.strokeRect(barX, barY, barW, barH);
  X.fillStyle = '#fff';
  X.font = 'bold 12px Consolas, monospace';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(`HP: ${player.hp}/${player.maxHp}`, barX + barW/2, barY + barH/2);

  // Spell slots (if caster)
  if (player.maxSpellSlots > 0) {
    const slotY = barY + barH + 6;
    X.fillStyle = 'rgba(0,0,0,0.7)';
    X.fillRect(barX - 2, slotY - 2, barW + 4, barH + 4);
    X.fillStyle = '#004';
    X.fillRect(barX, slotY, barW, barH);
    const slotPct = player.spellSlots / player.maxSpellSlots;
    X.fillStyle = '#44a';
    X.fillRect(barX, slotY, barW * slotPct, barH);
    X.strokeStyle = '#888';
    X.strokeRect(barX, slotY, barW, barH);
    X.fillStyle = '#aaf';
    X.font = 'bold 12px Consolas, monospace';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(`Slots: ${player.spellSlots}/${player.maxSpellSlots}`, barX + barW/2, slotY + barH/2);
  }

  // Level, XP, Gold
  const infoY = barY + barH + (player.maxSpellSlots > 0 ? barH + 12 : 6) + 4;
  X.fillStyle = 'rgba(0,0,0,0.7)';
  X.fillRect(barX - 2, infoY, barW + 4, 50);
  X.fillStyle = '#ffd700';
  X.font = '11px Consolas, monospace';
  X.textAlign = 'left'; X.textBaseline = 'top';
  X.fillText(`Lv ${player.level} ${player.evolution || player.class}`, barX + 4, infoY + 4);
  X.fillStyle = '#aaa';
  X.fillText(`XP: ${player.xp}/${XP_THRESHOLDS[player.level] || '---'}`, barX + 4, infoY + 18);
  X.fillStyle = '#ffd700';
  X.fillText(`Gold: ${player.gold}`, barX + 4, infoY + 32);
  const repTier = getRepTier(player.reputation);
  X.fillStyle = repTier.color;
  X.fillText(`${repTier.name} (${player.reputation >= 0 ? '+' : ''}${player.reputation})`, barX + 4, infoY + 46);

  // Conditions
  if (player.conditions.length > 0) {
    const condY = infoY + 54;
    player.conditions.forEach((cond, i) => {
      X.fillStyle = cond.type === 'poisoned' ? '#40c040' : '#c0c040';
      X.font = '10px Consolas, monospace';
      X.fillText(`[${cond.type}${cond.turns ? ` ${cond.turns}t` : ''}]`, barX + 4, condY + i * 14);
    });
  }

  // Squad display
  if (player.squad && player.squad.length > 0) {
    let squadY = infoY + 54 + (player.conditions.length > 0 ? player.conditions.length * 14 + 4 : 0);
    player.squad.forEach(comp => {
      X.fillStyle = 'rgba(0,0,0,0.7)';
      X.fillRect(barX - 2, squadY, barW + 4, 34);
      X.fillStyle = comp.color;
      X.font = 'bold 9px Consolas, monospace';
      X.textAlign = 'left';
      const loyaltyStr = comp.loyalty >= 90 ? '♥' : comp.loyalty >= 80 ? '★' : '';
      X.fillText(`[${comp.symbol}] ${comp.name} ${loyaltyStr}`, barX + 4, squadY + 10);
      const compHpPct = comp.hp / comp.maxHp;
      X.fillStyle = '#300';
      X.fillRect(barX + 4, squadY + 14, barW - 8, 5);
      X.fillStyle = compHpPct > 0.5 ? '#0a8' : compHpPct > 0.25 ? '#aa0' : '#a00';
      X.fillRect(barX + 4, squadY + 14, (barW - 8) * compHpPct, 5);
      // Loyalty bar
      X.fillStyle = '#220';
      X.fillRect(barX + 4, squadY + 21, barW - 8, 4);
      X.fillStyle = comp.loyalty >= 80 ? '#ffd700' : comp.loyalty >= 50 ? '#44aaff' : comp.loyalty >= 20 ? '#ff8800' : '#ff2222';
      X.fillRect(barX + 4, squadY + 21, (barW - 8) * (comp.loyalty / 100), 4);
      X.fillStyle = '#888';
      X.font = '8px Consolas, monospace';
      X.fillText(`${comp.hp}/${comp.maxHp} | Loy:${comp.loyalty}`, barX + 4, squadY + 31);
      squadY += 36;
    });
  }

  // Bottom buttons (non-mobile)
  if (!isMobile) {
    const btnY = canvasH - 40;
    const btnW = 65, btnH = 28;
    const btns = [
      { label: '[I]nv', key: 'i', state: STATE.INVENTORY },
      { label: '[C]har', key: 'c', state: STATE.CHAR_SHEET },
      { label: '[P]arty', key: 'p', state: STATE.PARTY_MGMT },
      { label: '[?]Help', key: '?', state: STATE.HELP },
      { label: 'Save', key: null, action: 'save' },
    ];
    btns.forEach((btn, i) => {
      const bx = canvasW - (btns.length - i) * (btnW + 5) - 5;
      drawButton(bx, btnY, btnW, btnH, btn.label, false, '#2a2a2a');
      if (clickedInRect(bx, btnY, btnW, btnH)) {
        SFX.click();
        if (btn.action === 'save') {
          saveGame();
          dungeonMessage = 'Game saved!';
          dungeonMessageTimer = 1.5;
          SFX.save();
        } else {
          gameState = btn.state;
        }
      }
    });
  }

  // War status HUD overlay
  renderWarStatusHUD();
}
